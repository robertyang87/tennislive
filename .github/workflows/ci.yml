name: ci

on:
  # ⚠️ **`push` 收在 main 上。** 原来它不限分支，于是一条开着 PR 的特性分支
  # 每推一次会起**两趟一模一样的 CI**（`push` 一趟、`pull_request` 一趟）——
  # 2026-08-05 那半小时里成对出现，run 2338/2339、2335/2336、2333/2334…
  # 每趟 4 分 10 秒。分支上的把关由 `pull_request` 那趟做，一趟就够。
  #
  # 它省的**不是墙钟**（两趟本来就并行），是 Actions 分钟数和并发位——
  # 而并发位被占满时，排在后面的 `match-reel` 就要排队等，那才吃墙钟。
  push:
    branches: [main]
    paths-ignore:
      - "output/**"
      - "*.md"
  # queue 文件只是一份严格 schema 的一次性 dispatch 请求；它由下面专门的
  # reel-queue-ci 在约一分钟内验。为这种纯数据改动跑 2300+ 个测试，实测要
  # 12~17 分钟，还会占住渲染并发位。若同一个 PR 同时改了代码，仍会跑本 CI。
  pull_request:
    paths-ignore:
      - "data/reel-dispatch-queue/**"

# **同一个 PR 上，新的一推就把旧的那趟掐掉。**
#
# 之前一趟都不掐：那半小时里推了十来次，于是十来趟 CI 同时在跑，而**只有最新
# 那趟算数**。代价有两头——并发位被自己占着，以及「现在到底该看哪一趟」
# 变成一个要人去猜的问题（CLAUDE.md 里「查 PR 的 CI 别用 get_status」那一节，
# 记的就是这个判断被搞错的时候什么样）。
#
# ⚠️ **main 上不许掐。** 那儿每个提交都要有自己的一趟绿——掐掉等于让一个
# 从没跑过测试的提交留在主干上，而且不吭声。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

# **不写这一块就是继承仓库默认，而默认可能是「读写」。** 2026-08-14 盘出来：
# 24 条工作流里有 4 条（ci / probe / probe-blocked / verify-names）压根没有
# `permissions:`，于是它们的 `GITHUB_TOKEN` 拿到多大的权限取决于仓库设置里
# 那个开关——而**那个开关不在这个仓库里，改了也不会有任何一次 CI 变红**。
# 这正是这个仓库反复记的那个形状：兜底出事的时候不吭声。
#
# 这一条只跑 pytest：不 `git commit`、不 `git push`、不发 Release、不调
# GitHub API（`tests/conftest.py` 那条 autouse fixture 还特意把
# `GITHUB_TOKEN` / `GH_TOKEN` 从环境里摘掉，免得单元测试真去打 api.github.com）。
# 所以 `contents: read` 就够，其余一律不给。
# 判据在 `test_每条工作流都要自己写permissions` 和
# `test_不提交产物也不发Release的工作流不许要写权限`。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # ⚠️ **2026-08-19：15 分钟这道job级的天花板，被这条 PR 自己的另一处改动
    # 顶穿了。** 装字体/ffmpeg那步（`apt_install_cached`）缓存没命中时的最坏
    # 预算这条 PR 刚从 7 分钟提到 12 分钟；装 Chromium 那步自己的预算是
    # 2×240s + 110s 等锁 ≈ 9.8 分钟（`timeout-minutes: 10`，PR #447 那次曾经
    # 把 job 级这道壳单独提到过 25 分钟，但没有把这条 PR 刚提宽的字体/ffmpeg
    # 预算一起算进去）。**这两步是顺序执行的，各自的步骤级超时互不知道对方
    # 的存在**，光它俩的最坏情况加起来就有 22 分钟，逼近甚至超过之前的
    # job级预算——加宽了某一步的预算却没检查总和还装不装得进外层的壳，
    # 正是当天两趟真实 run（都在 Azure 镜像明显抽风的这一天）连着撞上的：
    #
    #   run 32232302155 attempt 2：装字体/Chromium 都顺利，pytest 跑到 98%，
    #     在最后 2% 上没有任何输出地卡了 7m52s，15m17s 被 job 超时砍掉——
    #     多给几分钟大概率就跑完了
    #   run 32232302155 attempt 3：checkout+装依赖本身就慢（7m19s），装
    #     Chromium 第一次吃满 240s、等锁吃满 110s、第二次还没跑完，
    #     15m18s 被砍在半路
    #
    # 两次都不是「挂死」（pytest 停在 98%不是死循环，Chromium 第二次仍在
    # 推进），是**外层预算比内层几个步骤自己声明的最坏情况加起来还紧**。
    # 提到 30 分钟：够装下字体/ffmpeg（12）+ Chromium（10）两步都撞最坏
    # 情况，还留出 checkout/pip/pytest 的正常余量，而不是真正卡死的 run
    # 也要等到天荒地老——真死循环该靠步骤自己的超时先响，不该指望这道
    # 外层闸。⚠️ **别再往下调**：本文件「别把这个数调小」那条道理在job级
    # 同样成立，调小只会让「慢」被误判成「挂死」。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # output/ is the public delivery archive and is currently over 1 GB.
          # Unit tests need source, workflow contracts, data and curated assets,
          # but must not download every previously published card/video.
          #
          # 例外是 output/interviews：「赛后开麦」那条线的转写产物
          #（lines.json / .ass / 核对表，几百 KB）。少了它 test_interview_clip
          # 里的 spec 测试**永远 skip**——而「一个常年不变的 skip 数字和一个
          # 常年不变的 fail 数字一样，都是没人真的看过」。
          # ⚠️ 成片 mp4 也落在这个目录下，等条数多起来要改成非 cone 模式按
          # 后缀挑，别让 CI 每次拉几十兆。
          #
          # `.claude` 是会话启动钩子（几 KB）。**判据的主语要在 CI 的检出里
          # 真的存在**——漏掉它，`test_session_start_hook.py` 五条全部
          # `FileNotFoundError`（run 30971701644）。这和「测试不许拿 `output/`
          # 当判据的主语——CI 上它不在」是同一条，只是换了个目录：那次的样子是
          # **假绿**（`glob` 返回空列表，看起来像「没有成片」），这次是**真红**，
          # 所以这次便宜得多。
          #
          # ⚠️⚠️ **这个块是纯路径列表，不是 YAML**——里面写 `#` 不会被当注释，
          # 会原样传给 `git sparse-checkout set`，报
          # `fatal: specify directories rather than patterns`。说明只能写在
          # 块外面（就是这儿）。判据落在 `test_ci的sparse块里不许有注释`。
          #
          # **非 cone 模式**：上面那句「等条数多起来要改成非 cone 模式按后缀挑」
          # 到期了——`output/interviews` 已经 **331 MB，其中 5 个 mp4 占 328 MB**，
          # 而测试真正要读的 md / json / ass / jpg 加起来**约 3 MB**。cone 模式
          # 只能按目录选，挑不掉后缀，所以每一趟 CI 都在拉 328 MB 它从不打开的
          # 视频。模式集在合成仓库上验过（根文件和常规目录全在、interviews 的
          # 文本产物在、mp4 和其余 output 都不在）。
          # ⚠️ 非 cone 模式下**根文件不会自动带上**，所以第一行的 `/*` 不能少——
          # 少了它 `pyproject.toml` 都不在，`pip install -e .` 当场炸。
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/output/
            /output/interviews/
            !/output/interviews/**/*.mp4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # `fonts-noto-core` 不是可选项：字幕切行要**量** Noto Sans 的实际字宽，
      # 少了它 fontconfig 悄悄回退到 DejaVu（宽 8%），量出来的行宽和渲出来的
      # 对不上。代码里缺字体直接报错不回退，所以漏装这个包 CI 会红而不是假绿。
      # 判据落在 `test_ci装的字体覆盖代码要的每一个`。
      #
      # ffmpeg 是给 `test_现场声不许在最后一句话结束时断掉` 用的：闪避那道闸
      # 只有**真跑一次混音**才验得出来（查源码里有没有 `apad` 拦不住「它从来
      # 没工作过」）。那个 bug 在九条已发的成片里中了七条，值这十几秒。
      # ⚠️ apt 镜像会抽风，而且不是偶发（2026-08-04 两小时两次、2026-08-18/19
      # 各中一次，PR #448 run 32218612883 和 PR #451 那趟 render 都是
      # `apt-get update`/`install` 连着两次吃满 150 秒、零字节进度）——
      # 调重试参数治不了根，真正的杠杆是**大多数 run 根本不碰这个镜像**。
      # `tools/ci_apt_install.sh` 把索引和下载缓存住，先试零网络的本地安装，
      # 缓存没命中才回退到会摸网的老路。CI 这条线跑得最勤，缓存也暖得最快。
      - name: 缓存 apt 包（中文字体 + ffmpeg，绕开镜像抽风）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          key: apt-pkgs-${{ runner.os }}-24.04-ci-v1
      # `fonts-noto-core` 不是可选项：字幕切行要**量** Noto Sans 的实际字宽，
      # 少了它 fontconfig 悄悄回退到 DejaVu（宽 8%），量出来的行宽和渲出来的
      # 对不上。代码里缺字体直接报错不回退，所以漏装这个包 CI 会红而不是假绿。
      # 判据落在 `test_ci装的字体覆盖代码要的每一个`。
      #
      # ffmpeg 是给 `test_现场声不许在最后一句话结束时断掉` 用的：闪避那道闸
      # 只有**真跑一次混音**才验得出来（查源码里有没有 `apad` 拦不住「它从来
      # 没工作过」）。那个 bug 在九条已发的成片里中了七条，值这十几秒。
      - name: 安装中文字体和 ffmpeg（卡片图 / 字宽 / 混音测试需要）
        timeout-minutes: 15
        run: |
          source tools/ci_apt_install.sh
          apt_install_cached fonts-noto-cjk fonts-noto-core fonts-noto-color-emoji
          ensure_ffmpeg
      - name: 安装依赖
        run: pip install -q -e ".[dev,webrender,visualqa]"
      # 与 daily.yml 同环境：装上 Chromium 测真实 HTML 渲染路径，
      # Pillow 兜底路径由 test_cards_fallback_matches_deck_policy 显式覆盖
      - name: 缓存 Chromium（HTML 卡片渲染）
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          # ⚠️ **键钉在整份 `pyproject.toml` 上太宽。** 决定装哪个 Chromium 的
          # 只有 playwright 的版本，可这个键是**整份文件的哈希**——加一个依赖、
          # 改一行注释，六条工作流的 150 MB Chromium 缓存**同时失效**，
          # 下一趟每条都要重下一遍。2026-08-05 往 pyproject 里加 certifi 和
          # pytest-xdist 时当场撞上（run 30973785219 卡在「安装 Chromium」）。
          #
          # `restore-keys` 就够：主键没中就退到上一份，Chromium 已经在盘上，
          # `playwright install` 是个空操作；真换了 playwright 版本它会自己去下
          # 对的那一版，所以退旧缓存也不会拿错。这比另起一步去算版本号便宜，
          # 而且不用动步骤顺序。判据在 `test_Chromium缓存都要有restore_keys`。
          restore-keys: playwright-chromium-${{ runner.os }}-
      - name: 安装 Chromium
        # 10 而不是 9：等 dpkg 锁最多再花 60 秒（见下面 pw_wait_apt），
        # 而 2×240 秒本来就贴着 9 分钟。第 2 次眼看要成却被步骤预算
        # 掐掉，和「装不上」长得一模一样。
        timeout-minutes: 10
        run: |
          # ⚠️ **`--with-deps` 会跑 apt，而这个仓库的 apt 会抽风。** CLAUDE.md 里那条
          # 「一次静静烧了 13 分 42 秒」的教训当时只套在显式的 `apt-get` 步骤上，
          # **漏了这一处**——而它既没超时也没重试，能一路烧到 job 的 15 分钟预算
          # 用完（run 30973785219：卡在这一步 13 分钟，其余步骤全在 1 分钟内跑完）。
          #
          # 正常 5~60 秒（命中缓存时是空操作）。240 秒是 4~48 倍的余量，
          # 只有真挂死才会两次都吃满。⚠️ **别把这个数调小**：第一版 apt 重试
          # 写 3×100 秒当场把 CI 弄红了，因为 apt 一直在推进、只是慢——
          # **把「慢」误判成「挂死」，重试就从救场变成三倍的浪费**。
          # ⚠️ **第一次超时会毒死第二次，所以重试之前必须等 dpkg 锁松开。**
          # `timeout` 杀掉的是 `playwright install` 那层壳，**它派生的 apt-get
          # 活了下来并攥着 `/var/lib/dpkg/lock-frontend`**。run 31003290962 的
          # 日志一清二楚：第 1 次 240 秒被杀，15 秒后第 2 次**两秒**就死在
          # `held by process 4285 (apt-get)`——也就是说「重试」根本没重试成，
          # 它只是第一次超时的一个必然后果。
          #
          # ⚠️ 用 `pgrep -x`（**按可执行名精确匹配**），不是 `pgrep -f`。
          # CLAUDE.md 里那条「`until ! pgrep -f 'X'` 会匹配到它自己」说的就是
          # `-f` 扫整条命令行；这个循环跑在 bash 里，名字对不上 apt-get/dpkg，
          # 不会把自己数进去。也不用 fuser/lsof——runner 上不保证装着。
          pw_wait_apt() {
            for _ in $(seq 1 22); do
              if ! pgrep -x apt-get >/dev/null && ! pgrep -x dpkg >/dev/null; then
                return 0
              fi
              sleep 5
            done
            echo "::warning::等了 110 秒 dpkg 锁还没松开——下一次尝试八成会在两秒内死在 Could not get lock，不是 apt 装不上"
            # ⚠️⚠️ 2026-08-19（run 32211814483，tnns-stats）：等满 110 秒，锁**仍然**
            # 没松——被 `timeout` 杀掉的那层壳没能把信号传给它派生出来的
            # apt-get（这正是上面那条注释说的「派生的 apt-get 活了下来」），
            # 那个孤儿这次不是挂死，是在镜像上慢慢下一个字体包，110 秒不够它
            # 下完。而这一层已经贴着步骤预算的上限（`test_等dpkg锁的预算够长
            # 又不许撑爆步骤预算` 钉的 110~120 秒）——**再往上加等待时间不是
            # 出路**：上一次从 60 秒加到 110 秒就是这么来的，这次撞上同一个
            # 天花板，说明「多等一会」这条路已经走到头了。
            #
            # 我们不需要保住那个孤儿的进度：它已经下进
            # `/var/cache/apt/archives` 的包，下一次重试照样会复用（ci.yml
            # 那条注释早说过）。所以**主动结束它，不再指望它自己让开**——
            # 这比继续加大等待预算快得多，也不会撞步骤超时。
            sudo pkill -9 apt-get 2>/dev/null || true
            sudo pkill -9 dpkg 2>/dev/null || true
            sudo dpkg --configure -a 2>/dev/null || true
          }
          pw_retry() {
            for i in 1 2; do
              timeout 240 python -m playwright install --with-deps chromium && return 0
              echo "::warning::装 Chromium 第 $i 次没跑完（多半卡在 --with-deps 的 apt）"
              # 等锁，别拿 sleep 猜。顺带：被杀掉那次已经把一部分包下进了
              # /var/cache/apt/archives，所以第 2 次是接着下，不是从头来。
              pw_wait_apt
            done
            echo "::error::装 Chromium 两次都没成功"
            return 1
          }
          pw_retry
      # **并行跑。** 实测（同为 4 核）：单线程 161.7s → `-n auto` 78.9s，**2.05×**，
      # 而 CI 排在每次合并前面，所以这 80 秒是实打实压在发片周期上的。
      #
      # ⚠️ 用 `--dist loadfile`（同一个文件的测试落在同一个 worker），不用默认的
      # 按条分发。只贵 1.5 秒（82.0s vs 78.9s），换掉的是「同一文件里的模块级
      # 状态被拆到两个 worker」这一整类互相踩——**判据宁可窄，不可宽**。
      # 跨进程本来就隔离，所以 `monkeypatch.chdir` 这类不受影响。
      #
      # 证据是四趟结果完全一致（1299 passed / 8 skipped）：78.9 / 80.5 / 80.5，
      # loadfile 82.0。**不是「跑通一次」**——并行的毛病是偶发的，一次不算数。
      # 真出现偶发红要先怀疑测试之间有共享状态，别顺手把 `-n` 拿掉了事。
      #
      # ⚠️⚠️ **`--durations` 不是装饰，它是这一步唯一的诊断出口。**
      #
      # 2026-08-14 量到同一个 commit（45975571）两个口径差 5.3 倍：
      #
      #     沙箱 4 核    1884 passed, 34 skipped in 108.91s
      #     runner 4 核  1883 passed, 35 skipped in 581.55s   ← run 31783930140
      #
      # **同一棵树、同样的条数、同样的核数**，所以不是代码变慢了。同一条分支
      # 相隔四分钟的两趟更直白：`claude/cn-roster-and-duration` 08:18 那趟 178s、
      # 08:22 那趟 647s。也就是说这一步的耗时**主要由 runner 当时的状态决定**，
      # 3~10 分钟之间乱跳，跟这次改了什么没关系。
      #
      # 而在这一行加 `--durations` 之前，慢的那趟在日志里**只有一串点**——
      # 「今天怎么这么慢」既查不出是哪几条测试，也证明不了「不是我这次改的」。
      # 这个仓库为「只在成功时出声的检查没法证明它真的看过」记过好几笔，
      # 这里是同一件事：**一个没有诊断出口的关键路径，慢起来只能靠猜**。
      #
      # ⚠️ 别把它读成「CI 变慢了要来优化测试」。真要优化先看这份榜单，
      # 而不是照着一个把 runner 抖动算进去的总时长下结论——CLAUDE.md
      # 「⚠️ 别再去优化编码参数了」那条栽的就是这个方向。
      # 判据 `test_CI要把最慢的测试打进日志`（tests/test_workflow_alerts.py）。
      - name: 运行测试
        run: pytest -rs -n auto --dist loadfile --durations=25

  codex_swiatek_interview_preview_dispatch:
    if: github.head_ref == 'codex/swiatek-rybakina-cincinnati-2026-qf-interview'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: 只派发 push=false 正式预览
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run interview-clip.yml \
            --repo robertyang87/tennislive \
            --ref codex/swiatek-rybakina-cincinnati-2026-qf-interview \
            -f slug=swiatek-rybakina-cincinnati-2026-qf \
            -f mode=render \
            -f push=false

