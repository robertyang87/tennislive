name: ci

on:
  # ⚠️ **`push` 收在 main 上。** 原来它不限分支，于是一条开着 PR 的特性分支
  # 每推一次会起**两趟一模一样的 CI**（`push` 一趟、`pull_request` 一趟）——
  # 2026-08-05 那半小时里成对出现，run 2338/2339、2335/2336、2333/2334…
  # 每趟 4 分 10 秒。分支上的把关由 `pull_request` 那趟做，一趟就够。
  #
  # 它省的**不是墙钟**（两趟本来就并行），是 Actions 分钟数和并发位——
  # 而并发位被占满时，排在后面的 `match-reel` 就要排队等，那才吃墙钟。
  push:
    branches: [main]
    paths-ignore:
      - "output/**"
      - "*.md"
  pull_request:

# **同一个 PR 上，新的一推就把旧的那趟掐掉。**
#
# 之前一趟都不掐：那半小时里推了十来次，于是十来趟 CI 同时在跑，而**只有最新
# 那趟算数**。代价有两头——并发位被自己占着，以及「现在到底该看哪一趟」
# 变成一个要人去猜的问题（CLAUDE.md 里「查 PR 的 CI 别用 get_status」那一节，
# 记的就是这个判断被搞错的时候什么样）。
#
# ⚠️ **main 上不许掐。** 那儿每个提交都要有自己的一趟绿——掐掉等于让一个
# 从没跑过测试的提交留在主干上，而且不吭声。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # output/ is the public delivery archive and is currently over 1 GB.
          # Unit tests need source, workflow contracts, data and curated assets,
          # but must not download every previously published card/video.
          #
          # 例外是 output/interviews：「赛后开麦」那条线的转写产物
          #（lines.json / .ass / 核对表，几百 KB）。少了它 test_interview_clip
          # 里的 spec 测试**永远 skip**——而「一个常年不变的 skip 数字和一个
          # 常年不变的 fail 数字一样，都是没人真的看过」。
          # ⚠️ 成片 mp4 也落在这个目录下，等条数多起来要改成非 cone 模式按
          # 后缀挑，别让 CI 每次拉几十兆。
          #
          # `.claude` 是会话启动钩子（几 KB）。**判据的主语要在 CI 的检出里
          # 真的存在**——漏掉它，`test_session_start_hook.py` 五条全部
          # `FileNotFoundError`（run 30971701644）。这和「测试不许拿 `output/`
          # 当判据的主语——CI 上它不在」是同一条，只是换了个目录：那次的样子是
          # **假绿**（`glob` 返回空列表，看起来像「没有成片」），这次是**真红**，
          # 所以这次便宜得多。
          #
          # ⚠️⚠️ **这个块是纯路径列表，不是 YAML**——里面写 `#` 不会被当注释，
          # 会原样传给 `git sparse-checkout set`，报
          # `fatal: specify directories rather than patterns`。说明只能写在
          # 块外面（就是这儿）。判据落在 `test_ci的sparse块里不许有注释`。
          #
          # **非 cone 模式**：上面那句「等条数多起来要改成非 cone 模式按后缀挑」
          # 到期了——`output/interviews` 已经 **331 MB，其中 5 个 mp4 占 328 MB**，
          # 而测试真正要读的 md / json / ass / jpg 加起来**约 3 MB**。cone 模式
          # 只能按目录选，挑不掉后缀，所以每一趟 CI 都在拉 328 MB 它从不打开的
          # 视频。模式集在合成仓库上验过（根文件和常规目录全在、interviews 的
          # 文本产物在、mp4 和其余 output 都不在）。
          # ⚠️ 非 cone 模式下**根文件不会自动带上**，所以第一行的 `/*` 不能少——
          # 少了它 `pyproject.toml` 都不在，`pip install -e .` 当场炸。
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/output/
            /output/interviews/
            !/output/interviews/**/*.mp4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # `fonts-noto-core` 不是可选项：字幕切行要**量** Noto Sans 的实际字宽，
      # 少了它 fontconfig 悄悄回退到 DejaVu（宽 8%），量出来的行宽和渲出来的
      # 对不上。代码里缺字体直接报错不回退，所以漏装这个包 CI 会红而不是假绿。
      # 判据落在 `test_ci装的字体覆盖代码要的每一个`。
      #
      # ffmpeg 是给 `test_现场声不许在最后一句话结束时断掉` 用的：闪避那道闸
      # 只有**真跑一次混音**才验得出来（查源码里有没有 `apad` 拦不住「它从来
      # 没工作过」）。那个 bug 在九条已发的成片里中了七条，值这十几秒。
      - name: 安装中文字体和 ffmpeg（卡片图 / 字宽 / 混音测试需要）
        timeout-minutes: 6
        run: |
          # ⚠️ apt 镜像会抽风，而且不是偶发：2026-08-04 两小时内两次——
          # 一次静静烧了 **13 分 42 秒**（那时没有闸），一次被 `timeout-minutes: 6`
          # 掐掉（run 30878555571），而正常只要 **18~53 秒**。
          # 硬超时只把「静静烧半小时」换成「6 分钟红掉、要人重跑」——**方向对了但停在
          # 一半**：卡住的正确处置是换一次重试，不是整趟失败。重跑那趟 34 秒就过了。
          # ⚠️ **第一版写的是 3 × 100 秒，当场把 CI 弄红了**（run 30880649692）：
          # 三次全跑满 100 秒被杀，也就是 apt **一直在推进、只是慢**，不是挂死。
          # 那个 100 秒是按「正常 18~53 秒」拍的，而那是**另一条工作流**的数——
          # ci.yml 这一步正常 25~34 秒，镜像变慢时能到 100 秒以上仍在干活。
          # **把「慢」误判成「挂死」，重试就从救场变成了三倍的浪费。**
          # 现在 2 × (150s + 10s) = 5.3 分，仍在步骤的 6 分钟超时以内。
          # 每次都留 150 秒（正常值的 4~6 倍），只有真挂死才会两次都吃满。
          apt_retry() {
            for i in 1 2; do
              sudo timeout 150 "$@" && return 0
              echo "::warning::apt 第 $i 次没跑完（卡住或超时）：$*"
              sudo dpkg --configure -a || true   # 上一次被 SIGTERM 打断可能留下半装状态
              sleep 10
            done
            echo "::error::apt 两次都没成功：$*"
            return 1
          }
          apt_retry apt-get update -qq
          apt_retry apt-get install -y -qq fonts-noto-cjk fonts-noto-core \
            fonts-noto-color-emoji ffmpeg
      - name: 安装依赖
        run: pip install -q -e ".[dev,webrender,visualqa]"
      # 与 daily.yml 同环境：装上 Chromium 测真实 HTML 渲染路径，
      # Pillow 兜底路径由 test_cards_fallback_matches_deck_policy 显式覆盖
      - name: 缓存 Chromium（HTML 卡片渲染）
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: 安装 Chromium
        run: python -m playwright install --with-deps chromium
      # **并行跑。** 实测（同为 4 核）：单线程 161.7s → `-n auto` 78.9s，**2.05×**，
      # 而 CI 排在每次合并前面，所以这 80 秒是实打实压在发片周期上的。
      #
      # ⚠️ 用 `--dist loadfile`（同一个文件的测试落在同一个 worker），不用默认的
      # 按条分发。只贵 1.5 秒（82.0s vs 78.9s），换掉的是「同一文件里的模块级
      # 状态被拆到两个 worker」这一整类互相踩——**判据宁可窄，不可宽**。
      # 跨进程本来就隔离，所以 `monkeypatch.chdir` 这类不受影响。
      #
      # 证据是四趟结果完全一致（1299 passed / 8 skipped）：78.9 / 80.5 / 80.5，
      # loadfile 82.0。**不是「跑通一次」**——并行的毛病是偶发的，一次不算数。
      # 真出现偶发红要先怀疑测试之间有共享状态，别顺手把 `-n` 拿掉了事。
      - name: 运行测试
        run: pytest -rs -n auto --dist loadfile
