name: safiullin-bu-source-probe
on:
  push:
    branches: [codex/safiullin-bu-hangzhou-20260927]
    paths: [.github/workflows/safiullin-bu-source-probe.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            tools
            assets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source tools
        run: |
          pip install -q -e ".[visualqa]" "yt-dlp[default]"
          source tools/ci_apt_install.sh
          ensure_ffmpeg
          python -c "import cv2, numpy, requests"
          command -v ffmpeg
          node --version
      - name: Use existing authorized YouTube credentials
        id: cookies
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          if [ -z "$YT_COOKIES_TXT" ]; then
            echo "::error::Existing YouTube credentials are not configured"
            exit 1
          fi
          umask 077
          printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/yt-cookies.txt"
          echo "path=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_OUTPUT"
      - name: Download official match and produce evidence
        timeout-minutes: 10
        env:
          YT_COOKIES: ${{ steps.cookies.outputs.path }}
          PYTHONUNBUFFERED: '1'
        run: |
          python tools/build_match_reel.py probe --url "https://www.youtube.com/watch?v=-i-__KqEvXE" --outdir source-probe
          find source-probe -maxdepth 2 -type f -printf '%f %s bytes\n'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safiullin-bu-source-evidence
          path: |
            source-probe/
            .cache/tennislive-sources/
          retention-days: 3
          include-hidden-files: true
