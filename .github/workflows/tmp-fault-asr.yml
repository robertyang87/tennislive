name: tmp-fault-asr
# 临时：fault-not-out-2026 短窗口补转写（主裁/电子司线的单词喊声），合并前删除。
on:
  push:
    branches: [claude/fault-not-out-2026]
    paths: [research/fault-not-out-2026/clips.txt, research/fault-not-out-2026/probe_windows.txt, .github/workflows/tmp-fault-asr.yml]
permissions:
  contents: write
jobs:
  asr:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/fault-not-out-2026
          fetch-depth: 0
          sparse-checkout: |
            tools
            research/fault-not-out-2026
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-small.en-medium.en-v1
      - run: pip install -q faster-whisper
      - name: probe
        run: sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true; python research/fault-not-out-2026/asr_probe.py research/fault-not-out-2026/probe_windows.txt
      - name: clips
        if: false
        run: |
          set -euo pipefail
          mkdir -p research/fault-not-out-2026/asr_clips
          while read -r id a b; do
            [ -n "$id" ] || continue
            f="$RUNNER_TEMP/$id.mp4"; [ -f "$f" ] || curl -sSLf --retry 3 -o "$f" "https://github.com/robertyang87/tennislive/releases/download/source-$id/$id.mp4"
            for M in small.en medium.en; do
              python tools/source_asr.py --source "$f" --model $M --out "research/fault-not-out-2026/asr_clips/${id}_${a}_${b}.$M.json" --from $a --to $b
            done
          done < research/fault-not-out-2026/clips.txt
      - name: commit
        run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add -A research/fault-not-out-2026/asr_clips
          git commit -qm "tmp: fault 短窗口补转写"; for i in 1 2 3 4; do git pull -q --rebase origin claude/fault-not-out-2026 && git push origin HEAD:claude/fault-not-out-2026 && break; sleep 5; done
