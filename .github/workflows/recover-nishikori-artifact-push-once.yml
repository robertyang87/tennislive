name: recover-nishikori-artifact-push-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-nishikori-artifact-push-once.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: recover-nishikori-artifact-push-once
  cancel-in-progress: false

jobs:
  recover-and-push:
    if: "${{ github.event.head_commit.message != 'ops: 清理锦织圭复用产物推送工作流' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SLUG: nishikori-sakamoto-us-open-2026-q3-farewell
      SOURCE_RUN: "33236281038"
      ARTIFACT_NAME: nishikori-sakamoto-us-open-2026-q3-farewell
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            .github
            assets
            data
            output/interviews/nishikori-sakamoto-us-open-2026-q3-farewell
            specs
            src
            tests
            tools

      - name: 修正官方告别仪式无独立冷开场时的误判
        run: |
          python - <<'PY'
          from pathlib import Path

          landed = Path("tools/check_interview_landed.py")
          text = landed.read_text(encoding="utf-8")
          old = '''    if expected == 0:\n        return False, "spec.lead_in.subs 为空"\n'''
          new = '''    if expected == 0:\n        official_farewell = (\n            spec.get("requested_content_type") == "farewell"\n            and (spec.get("opening") or {}).get("kind") == "none"\n            and (spec.get("source_verification") or {}).get("status") == "verified"\n            and (spec.get("source_verification") or {}).get("method")\n                == "official_explicit_farewell"\n        )\n        if official_farewell:\n            return True, "官方告别仪式未配置独立比赛冷开场（显式例外）"\n        return False, "spec.lead_in.subs 为空"\n'''
          if old not in text:
              raise SystemExit("check_interview_landed.py 的无 lead_in 判据形状已变化，停止自动改写")
          text = text.replace(old, new, 1)
          old_hash = '''        "lead_ass_sha256": _sha256(outdir / "_lead.ass"),\n'''
          new_hash = '''        "lead_ass_sha256": (\n            _sha256(outdir / "_lead.ass")\n            if (outdir / "_lead.ass").is_file() else ""\n        ),\n'''
          if old_hash not in text:
              raise SystemExit("check_interview_landed.py 的 lead_ass 哈希形状已变化，停止自动改写")
          landed.write_text(text.replace(old_hash, new_hash, 1), encoding="utf-8")

          gate = Path("tools/auto_push_interview_gate.py")
          text = gate.read_text(encoding="utf-8")
          old = '''    if (not expected_lead or checks.get("bilingual_lead_cues") != expected_lead\n            or not qc.get("lead_ass_sha256")):\n        raise Skip(f"{slug}：QC 没有逐 cue 证明获胜画面原解说的中英字幕完整")\n'''
          new = '''    official_farewell_no_lead = (\n        spec.get("requested_content_type") == "farewell"\n        and (spec.get("opening") or {}).get("kind") == "none"\n        and (spec.get("source_verification") or {}).get("status") == "verified"\n        and (spec.get("source_verification") or {}).get("method")\n            == "official_explicit_farewell"\n    )\n    if expected_lead:\n        if (checks.get("bilingual_lead_cues") != expected_lead\n                or not qc.get("lead_ass_sha256")):\n            raise Skip(f"{slug}：QC 没有逐 cue 证明获胜画面原解说的中英字幕完整")\n    elif not official_farewell_no_lead:\n        raise Skip(f"{slug}：缺获胜画面原解说双语字幕，且不符合官方告别仪式例外")\n    elif checks.get("bilingual_lead_cues") not in (None, 0) or qc.get("lead_ass_sha256"):\n        raise Skip(f"{slug}：官方告别仪式例外与 QC 冷开场证据互相矛盾")\n'''
          if old not in text:
              raise SystemExit("auto_push_interview_gate.py 的 lead_in 判据形状已变化，停止自动改写")
          gate.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python -m py_compile tools/check_interview_landed.py tools/auto_push_interview_gate.py

      - name: 为例外策略补回归测试
        run: |
          cat > tests/test_interview_official_farewell_no_lead.py <<'PY'
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path(__file__).resolve().parents[1] / "tools"))
          from check_interview_landed import bilingual_lead_ok


          def _spec(kind: str, method: str = "official_explicit_farewell") -> dict:
              return {
                  "requested_content_type": kind,
                  "opening": {"kind": "none"},
                  "source_verification": {"status": "verified", "method": method},
              }


          def test_official_farewell_may_have_no_separate_lead(tmp_path):
              ok, detail = bilingual_lead_ok(tmp_path / "missing.ass", _spec("farewell"))
              assert ok
              assert "显式例外" in detail


          def test_ordinary_on_court_still_requires_lead(tmp_path):
              ok, detail = bilingual_lead_ok(tmp_path / "missing.ass", _spec("on_court"))
              assert not ok
              assert "为空" in detail


          def test_unverified_farewell_still_requires_lead(tmp_path):
              spec = _spec("farewell")
              spec["source_verification"]["status"] = "pending"
              ok, _ = bilingual_lead_ok(tmp_path / "missing.ass", spec)
              assert not ok
          PY
          pip install -q pytest
          pytest -q tests/test_interview_official_farewell_no_lead.py

      - name: 下载既有成片 artifact（禁止重渲）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D="output/interviews/$SLUG"
          rm -rf "$D"
          mkdir -p "$D"
          gh run download "$SOURCE_RUN" --name "$ARTIFACT_NAME" --dir "$D"
          test -s "$D/$SLUG.mp4"
          echo "复用成片：$(stat -c%s "$D/$SLUG.mp4") bytes"

      - name: 安装最小质检与推送依赖
        run: |
          pip install -q -e .
          command -v ffmpeg >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          }

      - name: 复用成片执行正式 L2 并落发布凭证
        run: |
          D="output/interviews/$SLUG"
          PYTHONPATH=src python tools/check_interview_landed.py \
            --slug "$SLUG" --film "$D/$SLUG.mp4" --write-attestation

      - name: 成片上传 Release 并绑定 QC 哈希
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D="output/interviews/$SLUG"
          CLIP="$D/$SLUG.mp4"
          SZ=$(stat -c%s "$CLIP")
          TAG="interview-$SLUG"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "赛后开麦 · $SLUG" \
                 --notes "双语字幕成片。复用已通过渲染阶段的 artifact，经修正后的 L2 复核后发布。"
          OK=0
          for i in 1 2 3 4; do
            if gh release upload "$TAG" "$CLIP" --clobber; then OK=1; break; fi
            sleep $((i * i * 5))
          done
          [ "$OK" = 1 ] || { echo "::error::Release 上传失败"; exit 1; }
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$SLUG.mp4"
          CODE=000
          for i in 1 2 3 4 5 6 7 8; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -L -r 0-99 "$URL" || echo 000)
            if [ "$CODE" = 200 ] || [ "$CODE" = 206 ]; then break; fi
            sleep 5
          done
          [ "$CODE" = 200 ] || [ "$CODE" = 206 ] || {
            echo "::error::Release 附件不可取（$CODE）"; exit 1; }
          python - "$D/render.json" "$D/qc_attestation.json" "$URL" "$SZ" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          render_path, qc_path, url, size = Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3], int(sys.argv[4])
          render = json.loads(render_path.read_text(encoding="utf-8"))
          qc = json.loads(qc_path.read_text(encoding="utf-8"))
          render.update({
              "video_url": url,
              "video_bytes": size,
              "film_sha256": qc["film_sha256"],
              "qc_attestation_sha256": hashlib.sha256(qc_path.read_bytes()).hexdigest(),
              "reused_artifact_run": 33236281038,
          })
          render_path.write_text(json.dumps(render, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          rm -f "$CLIP"
          echo "Release 附件可取：$URL"

      - name: 生成微信复制页并清理中间物
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          D="output/interviews/$SLUG"
          COPY="specs/interviews/$SLUG.xhs.txt"
          eval "$(python - "$SLUG" <<'PY'
          import json, shlex, sys
          from pathlib import Path
          slug = sys.argv[1]
          d = json.loads(Path(f"specs/interviews/{slug}.json").read_text(encoding="utf-8"))
          push = d.get("push") or {}
          for key in ("matchup", "score", "event", "summary", "lead"):
              print(f"{key.upper()}={shlex.quote(str(push.get(key, '')).strip())}")
          PY
          )"
          PYTHONPATH=src python tools/push_reel.py --stage page \
            --outdir "$D" --matchup "$MATCHUP" --score "$SCORE" \
            --event "$EVENT" --summary "$SUMMARY" \
            --date "$(TZ=Asia/Shanghai date +%F)" --copy "$COPY"
          find "$D" -maxdepth 1 -name "*.html" ! -name "copy.html" -delete
          rm -f "$D"/source.* "$D"/whisper.json "$D"/storyboard.jpg
          rm -rf "$D"/_*

      - name: 提交根因修复、QC 证据与发布页面
        run: |
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git add tools/check_interview_landed.py tools/auto_push_interview_gate.py \
            tests/test_interview_official_farewell_no_lead.py \
            "output/interviews/$SLUG"
          python tools/check_staged_file_sizes.py
          git commit -m "fix: 复用锦织圭成片并修正告别仪式 QC 误判"
          source tools/git_push_retry.sh
          push_with_rebase_retry main 5

      - name: 触发 Pages 更新复制页
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: 发布前重新走 L0/L2/幂等门禁
        run: |
          git pull --rebase origin main
          GITHUB_OUTPUT=/tmp/gate.out python tools/auto_push_interview_gate.py --slug "$SLUG"
          cat /tmp/gate.out
          grep -q '^found=true$' /tmp/gate.out

      - name: 发送前预占发布账本
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          D="output/interviews/$SLUG"
          python tools/auto_push_interview_gate.py --reserve "$D" --slug "$SLUG" \
            --run "$RUN_URL" --now "$(date -u +%FT%TZ)"
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git add "data/interview_publish_ledger/$SLUG.json"
          python tools/check_staged_file_sizes.py
          git commit -m "interview: 预占推送 $SLUG"
          source tools/git_push_retry.sh
          push_with_rebase_retry main 5

      - name: 推送到微信（PushPlus 返回成功才算完成）
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TENNISLIVE_COPYPAGE_ATTEMPTS: "24"
          TENNISLIVE_COPYPAGE_RETRY_SECONDS: "10"
        run: |
          COPY="specs/interviews/$SLUG.xhs.txt"
          eval "$(python - "$SLUG" <<'PY'
          import json, shlex, sys
          from pathlib import Path
          slug = sys.argv[1]
          d = json.loads(Path(f"specs/interviews/{slug}.json").read_text(encoding="utf-8"))
          push = d.get("push") or {}
          for key in ("matchup", "score", "event", "summary", "lead"):
              print(f"{key.upper()}={shlex.quote(str(push.get(key, '')).strip())}")
          PY
          )"
          export TENNISLIVE_ASSET_REV="$(git rev-parse HEAD)"
          PYTHONPATH=src python tools/push_reel.py \
            --outdir "output/interviews/$SLUG" \
            --matchup "$MATCHUP" --score "$SCORE" --event "$EVENT" \
            --summary "$SUMMARY" --date "$(TZ=Asia/Shanghai date +%F)" \
            --lead "$LEAD" --copy "$COPY"

      - name: PushPlus 成功后记 sent 发布账本
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          D="output/interviews/$SLUG"
          python tools/auto_push_interview_gate.py --record "$D" --slug "$SLUG" \
            --run "$RUN_URL" --now "$(date -u +%FT%TZ)"
          git add "data/interview_publish_ledger/$SLUG.json"
          python tools/check_staged_file_sizes.py
          git commit -m "interview: $SLUG 已推送"
          source tools/git_push_retry.sh
          push_with_rebase_retry main 5

      - name: 已预占后失败则标记状态不明
        if: failure()
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -f "data/interview_publish_ledger/$SLUG.json" || exit 0
          D="output/interviews/$SLUG"
          python tools/auto_push_interview_gate.py --uncertain "$D" --slug "$SLUG" \
            --run "$RUN_URL" --now "$(date -u +%FT%TZ)"
          git add "data/interview_publish_ledger/$SLUG.json"
          git commit -m "interview: $SLUG 推送状态待核实" || exit 0
          source tools/git_push_retry.sh
          push_with_rebase_retry main 5

      - name: 清理一次性恢复工作流
        if: success()
        run: |
          git pull --rebase origin main
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git rm .github/workflows/recover-nishikori-artifact-push-once.yml
          git commit -m "ops: 清理锦织圭复用产物推送工作流"
          source tools/git_push_retry.sh
          push_with_rebase_retry main 5
