name: probe-blocked-sources

# 在 Actions 的出口网络上探那些**沙箱够不到**的源（ATP 全站 403、
# live-tennis.eu 403、赛事图库的 Cloudflare 人机校验）。
#
# 什么都不产、什么都不提交，结论**全打在日志里**——包括探不通的那几条。
# 只在成功时出声的检查，没法证明它真的看过。
on:
  workflow_dispatch:
    inputs:
      want:
        description: "要在正文里找的词，逗号分隔"
        required: false
        default: "Coleman Wong,Brooksby"
      mode:
        description: "http=urllib 探那几个固定源；browser=用 Chromium 探 TNNS"
        required: false
        default: "http"
      url:
        description: "browser 模式要加载的页面（默认 tnnslive.com 首页）"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # browser 模式要浏览器。**装在跑之前**，别等跑到一半才报
      # ModuleNotFoundError——竖版剪辑那条线同一个毛病犯过三次。
      - name: 装 Chromium（browser 模式才要）
        if: github.event.inputs.mode == 'browser'
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: 探
        run: |
          ARGS=""
          IFS=',' read -ra WORDS <<< "${{ github.event.inputs.want }}"
          for w in "${WORDS[@]}"; do ARGS="$ARGS --want \"$w\""; done
          if [ "${{ github.event.inputs.mode }}" = "browser" ]; then
            [ -n "${{ github.event.inputs.url }}" ] && ARGS="$ARGS --url '${{ github.event.inputs.url }}'"
            eval python tools/probe_tnns.py $ARGS
          else
            eval python tools/probe_blocked_sources.py $ARGS
          fi
