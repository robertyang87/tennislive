name: explainer-video

# 生成一条 AI 旁白知识解说视频（前因后果 / 技术原理 / 当今现状）。
# 面向抽象、拿不到合格真实照片的知识点（如鹰眼/计分制）：解说词由该选题
# 已核验的事实改写而成，画面是文字卡与示意图，不伪造真实赛场影像。
# 手动触发，不自动推送。成片 2026-08-13 起发到 Release（不进 git），
# 仓库里只提交幻灯 / 文案 / render.json 这些轻产物——账号所有者：
# 「包括后续所有的视频，制作的视频。都走统一的 Release 路线」。
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "知识选题 slug（默认 hawkeye）"
        required: false
        default: "hawkeye"
      # Empty means "whatever the code says". This used to default to
      # zh-CN-YunxiNeural and was passed unconditionally, so choosing a new
      # default voice in code changed nothing: every dispatch silently put
      # the old voice back on the command line. Three decks were regenerated
      # that way and came out in the voice that had just been replaced.
      voice:
        description: "edge-tts 中文语音（留空＝用代码默认：云健）"
        required: false
        default: ""
      rate:
        description: "语速，如 +22%（留空＝用代码默认）"
        required: false
        default: ""
      push:
        description: "生成后推送到微信（true/false）"
        required: false
        default: "false"

permissions:
  contents: write
  # 触发 `pages.yml` 重新发布复制页——工作流自己提交的 push
  # **不会**创建 workflow run，见 `trigger_pages_build`。
  actions: write

# Per topic, not per workflow. A single group meant that dispatching a batch
# of slugs kept only the first and the last: GitHub holds one run pending per
# group and cancels the rest. Different topics touch different output
# directories, so they have no reason to queue behind each other — and two
# runs landing at once is now handled by the push step's replay-and-retry.
#
# 同一个 slug 则取消旧的。改完发一版、没等落库又改一版再发，两个 run 会一起跑，
# 谁后落库谁赢——今晚两次都是先落库的旧版赢了，而两次的 commit message 一模一样，
# 光看 git log 完全看不出来，是逐像素比对才发现的。同一条片子只可能有一个"最新"，
# 所以让新的顶掉旧的。不同 slug 不受影响：分组名里带着 slug，多条「开球之前」
# 可以同一天并行生成，各写各的 output/<日期>/explainer/<slug>/。
concurrency:
  group: explainer-video-${{ github.event.inputs.slug || 'hawkeye' }}
  cancel-in-progress: true

jobs:
  explainer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TENNISLIVE_THEME: ${{ vars.TENNISLIVE_THEME || 'dark' }}
      # 卡片图和成片走哪个 jsDelivr 入口。留空＝代码默认（gcore）。
      # 想 A/B 别的镜像，在仓库 Actions variables 里改这一个值即可，
      # 不用动代码；填错域名会被代码挡掉并退回默认，不会发出裂图。
      TENNISLIVE_JSDELIVR_HOST: ${{ vars.TENNISLIVE_JSDELIVR_HOST }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # **别把 output/ 拉下来。** HEAD 上它就有 1.36 GB（.git 1.77 GiB），
          # checkout 因此每次要一分半到三分钟。
          # 本次要写的那一格在算出目录之后 `git sparse-checkout add` 回来——
          # **两半都要有**：只写这一半，`git add "$OUTDIR"` 会说路径在稀疏
          # 范围之外，只警告、退出码 0，产物静默丢掉。
          sparse-checkout: |
            assets
            data
            docs
            specs
            src
            tests
            tools

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装中文字体（幻灯需要）
        timeout-minutes: 12
        run: |
          # ⚠️ apt 镜像会抽风，而且不是偶发：2026-08-04 两小时内两次——一次静静烧了
          # **13 分 42 秒**（那时没有闸），一次被 `timeout-minutes: 6` 掐掉
          # （run 30878555571），而正常只要 **18~53 秒**，重跑那趟 34 秒就过了。
          # 硬超时只把「静静烧半小时」换成「6 分钟红掉、要人重跑」——**方向对了但停在
          # 一半**：卡住的正确处置是换一次重试，不是整趟失败。
          # ⚠️ **第一版写的是 3 × 100 秒，当场把 CI 弄红了**（run 30880649692）：
          # 三次全跑满 100 秒被杀，也就是 apt **一直在推进、只是慢**，不是挂死。
          # 那个 100 秒是按「正常 18~53 秒」拍的，而那是**另一条工作流**的数——
          # ci.yml 这一步正常 25~34 秒，镜像变慢时能到 100 秒以上仍在干活。
          # **把「慢」误判成「挂死」，重试就从救场变成了三倍的浪费。**
          # ⚠️⚠️ **2026-08-18：这句话原来写的是「5.3 分，仍在步骤的 6 分钟超时以内」，
          #    而它把预算算漏了一半——这一步调 `apt_retry` **两次**（update 一次、
          #    install 一次），真正的上界是 2 × 2 × (150s + 10s) = **640 秒 ≈ 10.7 分**。
          #    于是 match-reel 那两步（`timeout-minutes: 5`）连着两趟死在同一个地方：
          #    第 1 次 update 吃满 150 秒 → sleep 10 → 第 2 次跑到第 150 秒那一刻
          #    正好撞上步骤超时（run 32084186086 / 32084758610，00:33:07 报第一次没跑完、
          #    00:35:47 步骤被杀）。**重试在它唯一该起作用的那一次结构性地跑不完。**
          #    步骤超时现在按 `calls × tries × (per + 10)` 反推并留 1 分钟余量，
          #    判据 `test_apt重试的预算不许超过步骤自己的超时` 自己算不硬编。
          # 每次都留 150 秒（正常值的 4~6 倍），只有真挂死才会两次都吃满。
          apt_retry() {
            for i in 1 2; do
              sudo timeout 150 "$@" && return 0
              echo "::warning::apt 第 $i 次没跑完（卡住或超时）：$*"
              sudo dpkg --configure -a || true   # 上一次被 SIGTERM 打断可能留下半装状态
              sleep 10
            done
            echo "::error::apt 两次都没成功：$*"
            return 1
          }
          # ⚠️ **`Acquire::http::Timeout` 是这一行的关键，不是装饰。**
          # 2026-08-18 02:02 那趟 CI（run 32090339473）`apt-get update` **两次各吃满
          # 150 秒**，一个字节的进度都没有——这是 apt 挂在一个不响应的镜像上等
          # 它自己的默认超时（120 秒起）的样子，不是「在推进、只是慢」。
          # 给 apt 自己一个 20 秒的连接超时 ＋ 3 次重试，它会**在我们的 `timeout 150`
          # 之内自己换一个镜像**；没有这两个参数，外层重试只是把同一次挂死再等一遍。
          # ⚠️ 别用它去替代外层的 `apt_retry`：那一层管的是「整条命令挂了」，
          # 这一层管的是「某个 host 不响应」，两层各拦一头。
          apt_retry apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=20
          apt_retry apt-get install -y -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=20 fonts-noto-cjk

      - name: 安装 tennislive + edge-tts
        run: |
          pip install -q -e ".[webrender]"
          pip install -q edge-tts

      - name: 缓存 Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          # ⚠️ **键钉在整份 `pyproject.toml` 上太宽。** 决定装哪个 Chromium 的
          # 只有 playwright 的版本，可这个键是**整份文件的哈希**——加一个依赖、
          # 改一行注释，六条工作流的 150 MB Chromium 缓存**同时失效**，
          # 下一趟每条都要重下一遍。2026-08-05 往 pyproject 里加 certifi 和
          # pytest-xdist 时当场撞上（run 30973785219 卡在「安装 Chromium」）。
          #
          # `restore-keys` 就够：主键没中就退到上一份，Chromium 已经在盘上，
          # `playwright install` 是个空操作；真换了 playwright 版本它会自己去下
          # 对的那一版，所以退旧缓存也不会拿错。这比另起一步去算版本号便宜，
          # 而且不用动步骤顺序。判据在 `test_Chromium缓存都要有restore_keys`。
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: 安装 Chromium
        # 10 而不是 9：等 dpkg 锁最多再花 60 秒（见下面 pw_wait_apt），
        # 而 2×240 秒本来就贴着 9 分钟。第 2 次眼看要成却被步骤预算
        # 掐掉，和「装不上」长得一模一样。
        timeout-minutes: 10
        run: |
          # ⚠️ **`--with-deps` 会跑 apt，而这个仓库的 apt 会抽风。** CLAUDE.md 里那条
          # 「一次静静烧了 13 分 42 秒」的教训当时只套在显式的 `apt-get` 步骤上，
          # **漏了这一处**——而它既没超时也没重试，能一路烧到 job 的 15 分钟预算
          # 用完（run 30973785219：卡在这一步 13 分钟，其余步骤全在 1 分钟内跑完）。
          #
          # 正常 5~60 秒（命中缓存时是空操作）。240 秒是 4~48 倍的余量，
          # 只有真挂死才会两次都吃满。⚠️ **别把这个数调小**：第一版 apt 重试
          # 写 3×100 秒当场把 CI 弄红了，因为 apt 一直在推进、只是慢——
          # **把「慢」误判成「挂死」，重试就从救场变成三倍的浪费**。
          # ⚠️ **第一次超时会毒死第二次，所以重试之前必须等 dpkg 锁松开。**
          # `timeout` 杀掉的是 `playwright install` 那层壳，**它派生的 apt-get
          # 活了下来并攥着 `/var/lib/dpkg/lock-frontend`**。run 31003290962 的
          # 日志一清二楚：第 1 次 240 秒被杀，15 秒后第 2 次**两秒**就死在
          # `held by process 4285 (apt-get)`——也就是说「重试」根本没重试成，
          # 它只是第一次超时的一个必然后果。
          #
          # ⚠️ 用 `pgrep -x`（**按可执行名精确匹配**），不是 `pgrep -f`。
          # CLAUDE.md 里那条「`until ! pgrep -f 'X'` 会匹配到它自己」说的就是
          # `-f` 扫整条命令行；这个循环跑在 bash 里，名字对不上 apt-get/dpkg，
          # 不会把自己数进去。也不用 fuser/lsof——runner 上不保证装着。
          pw_wait_apt() {
            for _ in $(seq 1 22); do
              if ! pgrep -x apt-get >/dev/null && ! pgrep -x dpkg >/dev/null; then
                return 0
              fi
              sleep 5
            done
            echo "::warning::等了 110 秒 dpkg 锁还没松开——下一次尝试八成会在两秒内死在 Could not get lock，不是 apt 装不上"
          }
          pw_retry() {
            for i in 1 2; do
              timeout 240 python -m playwright install --with-deps chromium && return 0
              echo "::warning::装 Chromium 第 $i 次没跑完（多半卡在 --with-deps 的 apt）"
              # 等锁，别拿 sleep 猜。顺带：被杀掉那次已经把一部分包下进了
              # /var/cache/apt/archives，所以第 2 次是接着下，不是从头来。
              pw_wait_apt
            done
            echo "::error::装 Chromium 两次都没成功"
            return 1
          }
          pw_retry

      - name: 安装 ffmpeg
        timeout-minutes: 12
        run: |
          # ⚠️ apt 镜像会抽风，而且不是偶发：2026-08-04 两小时内两次——一次静静烧了
          # **13 分 42 秒**（那时没有闸），一次被 `timeout-minutes: 6` 掐掉
          # （run 30878555571），而正常只要 **18~53 秒**，重跑那趟 34 秒就过了。
          # 硬超时只把「静静烧半小时」换成「6 分钟红掉、要人重跑」——**方向对了但停在
          # 一半**：卡住的正确处置是换一次重试，不是整趟失败。
          # ⚠️ **第一版写的是 3 × 100 秒，当场把 CI 弄红了**（run 30880649692）：
          # 三次全跑满 100 秒被杀，也就是 apt **一直在推进、只是慢**，不是挂死。
          # 那个 100 秒是按「正常 18~53 秒」拍的，而那是**另一条工作流**的数——
          # ci.yml 这一步正常 25~34 秒，镜像变慢时能到 100 秒以上仍在干活。
          # **把「慢」误判成「挂死」，重试就从救场变成了三倍的浪费。**
          # ⚠️⚠️ **2026-08-18：这句话原来写的是「5.3 分，仍在步骤的 6 分钟超时以内」，
          #    而它把预算算漏了一半——这一步调 `apt_retry` **两次**（update 一次、
          #    install 一次），真正的上界是 2 × 2 × (150s + 10s) = **640 秒 ≈ 10.7 分**。
          #    于是 match-reel 那两步（`timeout-minutes: 5`）连着两趟死在同一个地方：
          #    第 1 次 update 吃满 150 秒 → sleep 10 → 第 2 次跑到第 150 秒那一刻
          #    正好撞上步骤超时（run 32084186086 / 32084758610，00:33:07 报第一次没跑完、
          #    00:35:47 步骤被杀）。**重试在它唯一该起作用的那一次结构性地跑不完。**
          #    步骤超时现在按 `calls × tries × (per + 10)` 反推并留 1 分钟余量，
          #    判据 `test_apt重试的预算不许超过步骤自己的超时` 自己算不硬编。
          # 每次都留 150 秒（正常值的 4~6 倍），只有真挂死才会两次都吃满。
          apt_retry() {
            for i in 1 2; do
              sudo timeout 150 "$@" && return 0
              echo "::warning::apt 第 $i 次没跑完（卡住或超时）：$*"
              sudo dpkg --configure -a || true   # 上一次被 SIGTERM 打断可能留下半装状态
              sleep 10
            done
            echo "::error::apt 两次都没成功：$*"
            return 1
          }
          # ⚠️ **`Acquire::http::Timeout` 是这一行的关键，不是装饰。**
          # 2026-08-18 02:02 那趟 CI（run 32090339473）`apt-get update` **两次各吃满
          # 150 秒**，一个字节的进度都没有——这是 apt 挂在一个不响应的镜像上等
          # 它自己的默认超时（120 秒起）的样子，不是「在推进、只是慢」。
          # 给 apt 自己一个 20 秒的连接超时 ＋ 3 次重试，它会**在我们的 `timeout 150`
          # 之内自己换一个镜像**；没有这两个参数，外层重试只是把同一次挂死再等一遍。
          # ⚠️ 别用它去替代外层的 `apt_retry`：那一层管的是「整条命令挂了」，
          # 这一层管的是「某个 host 不响应」，两层各拦一头。
          apt_retry apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20
          # ⚠️ **`--no-install-recommends` 不是洁癖，是这一步的耗时本身。**
          # 2026-08-18 `apt-get install ffmpeg` 连着两次吃满 150 秒被杀
          # （run 32085745112：00:46:29 起，00:49:11 和 00:51:51 各报一次没跑完；
          # 同一趟的 `apt-get update` 十几秒就过了，慢的只有 install）。
          # ffmpeg 的 recommends 拖着一整串 VA-API 驱动，而 runner 上根本没有
          # 硬件解码可用——`.claude/hooks/session-start.sh` 早就是这么装的，
          # 只是这半边一直没跟上（「规矩只写在了其中一半」）。
          # `Acquire::Retries=3` 让 apt 自己在一次尝试里换一次镜像，
          # 而不是挂在一个不响应的 host 上等我们的 `timeout` 来杀。
          apt_retry apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=20 ffmpeg

      - name: 生成解说视频
        id: gen
        run: |
          OUT_DATE=$(TZ=Asia/Shanghai date +%F)
          SLUG="${{ github.event.inputs.slug }}"
          if [ -z "$SLUG" ]; then SLUG="hawkeye"; fi
          OUT_DIR="output/$OUT_DATE/explainer/$SLUG"
          echo "outdir=$OUT_DIR" >> "$GITHUB_OUTPUT"
          # Release 那一步的 tag 从它拼（explainer-<slug>）——和这儿的默认值
          # 必须是同一个出处，别在那一步再写一遍 `|| hawkeye`。
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          # 进 cone 排在生成之前：`sparse-checkout add` 会把 HEAD 上那一版
          # 先铺回工作区，铺完再生成才是对的顺序（反过来会拿旧内容盖掉新的）。
          # 重放循环里的 `git checkout rendered -- "$OUTDIR"` 也要它在 cone 里。
          git sparse-checkout add "$OUT_DIR"
          # if-blocks, not `[ -n "$V" ] && ARGS+=(...)`: this step runs under
          # `bash -e`, where a top-level AND-list whose test fails aborts the
          # whole step.
          ARGS=(--slug "$SLUG" --outdir "$OUT_DIR")
          VOICE="${{ github.event.inputs.voice }}"
          RATE="${{ github.event.inputs.rate }}"
          if [ -n "$VOICE" ]; then ARGS+=(--voice "$VOICE"); fi
          if [ -n "$RATE" ]; then ARGS+=(--rate "$RATE"); fi
          echo "生成参数：${ARGS[*]}"
          tennislive explainer "${ARGS[@]}"
          ls -la "$OUT_DIR"
          # 视频体积可观，仅保留成片与幻灯，丢弃中间音频。
          rm -f "$OUT_DIR"/voice_*.mp3
          # 卡片 2026-07-29 起存 JPEG。重生成一条旧片子时，同名的 .png 还留在
          # 目录里（提交步骤只 add，不会删），于是仓库里同时躺着新旧两套图——
          # 一条就是 31 MB 的死重量，而且 `git add` 之后谁也看不出哪套是活的。
          rm -f "$OUT_DIR"/slide_*.png

      - name: 上传成片 artifact
        uses: actions/upload-artifact@v4
        with:
          name: explainer-${{ github.run_number }}
          path: ${{ steps.gen.outputs.outdir }}
          retention-days: 14

      # **查产物，不查信号。** 这两个脚本一直躺在 `tools/` 里，而
      # `grep -rn check_explainer_landed .github/` 除了它自己**零命中**——
      # 写好了一次都没跑过。CLAUDE.md 把「`check_explainer_landed` 报不合格」
      # 列为仅有的两个该停下来的闸之一：**规矩写了、工具写了、就是没接上。**
      # 同一个形状仓库栽过：`check_reel_landed.py` 也曾零调用方，补跑一遍它自己
      # 就报出两个真缺陷（音轨比画面短 ×7、38 秒数字静音 ×1）。
      #
      # ⚠️ **位置**（三头都要卡住，缺一头这道闸就没意义）：
      #   1. 排在「上传成片 artifact」**之后**——闸红了片子还有处可取，
      #      和下面提交步骤那句「成片仍在 artifact 里」是同一个承诺；
      #   2. 排在「成片发到 Release」**之前**——那一步末尾 `rm -f "$CLIP"`
      #      把成片删了，还会重写 render.json 和 push.html，排在它后面就没得验了；
      #   3. 排在「提交成片到仓库」**之前**——进了 main，`publish pushplus`
      #      那条路就会把它发到微信，而微信那条消息发出去收不回来。
      - name: 查这一版产物本身合不合格
        run: |
          OUTDIR="${{ steps.gen.outputs.outdir }}"
          SLUG="${{ steps.gen.outputs.slug }}"

          # ① 这条片子**到底是谁配的音**——读成片旁边的 narration.json，
          #    不拿「工作流传了什么参数」去推。这条线正是栽在那个推理上：
          #    工作流每次传一个写死的旧 `--voice`，代码里换默认值等于没换，
          #    三条片子用着被替换掉的声音发了出去（见本文件开头 voice 那个
          #    输入的注释）。每段 mp3 生成完就删了，mp4 里也读不出语音名。
          #
          # ⚠️ **留空＝用代码默认，期望值必须跟着退回代码默认**，不能在这儿
          #    补一个字面量。`check_explainer_voice.py` 已经为这个栽过一次：
          #    它抄着 `WANT_RATE = "+28%"`，而代码 2026-08-03 定回 +22%
          #    （29 份已落库的 narration.json 里 19 份是 +22%）——照原样接进来
          #    就是一条**常年红**，而常年红和没有检查是同一个毛病。
          VARGS=()
          if [ -n "${{ github.event.inputs.voice }}" ]; then VARGS+=(--voice "${{ github.event.inputs.voice }}"); fi
          if [ -n "${{ github.event.inputs.rate }}" ]; then VARGS+=(--rate "${{ github.event.inputs.rate }}"); fi
          python tools/check_explainer_voice.py --local "$(dirname "$OUTDIR")" "$SLUG" "${VARGS[@]}"

          # ② **这一版的字真的烧进产物了没有。** 喂进去的是脚本自己算出来的
          #    每屏小标——它来自 `explainer_script(story)`，也就是渲染的**输入**，
          #    而查的是渲染的**输出**。少一屏就报出是哪一屏（小红书正文卡着
          #    1000 字，为了塞下而丢掉一屏，正是这条线上活着的风险）。
          #
          # ⚠️ **不喂旁白原文**：`.ass` 去过标点、`.words.json` 本来就不含标点，
          #    旁白搜不到的样子是「★ 一个文件都没有」，和「没落库」一模一样。
          #    量过存量 243 屏：小标命中 241，旁白前 14 字含标点的 228 条只命中 7。
          #    判据连同这两个数记在 check_explainer_landed.py 的 docstring 里。
          # ⚠️ **小标由这段自己写进文件，不走 stdout 重定向。** 走重定向的话，
          #    将来哪次 `explainer_script` 顺手 print 一句诊断，那行就会被
          #    `mapfile` 当成一条小标喂进 `--says`，然后必然搜不到——报出来是
          #    「★ 一个文件都没有」，看着像片子不合格，其实是原料被污染了。
          #    （量过：今天它一个字都不打，所以这是防将来，不是修现在。）
          python - "$SLUG" /tmp/beat_titles.txt <<'PY'
          import sys
          from pathlib import Path
          from tennislive.render.tournament_story import find_story_by_slug
          from tennislive.video.explainer import explainer_script
          story = find_story_by_slug(sys.argv[1])
          if story is None:
              raise SystemExit(f"找不到 slug {sys.argv[1]} 的选题，这道闸没法验")
          titles = [seg.title for seg in explainer_script(story) if seg.title.strip()]
          if not titles:
              raise SystemExit("一屏小标都没算出来——喂空的 --says 等于不查")
          Path(sys.argv[2]).write_text("\n".join(titles) + "\n", encoding="utf-8")
          print(f"这一版共 {len(titles)} 屏，小标全部要在产物里找得到")
          PY
          mapfile -t SAYS < /tmp/beat_titles.txt
          # 空数组会让 `--says` 后面一个值都没有，那就退化成只查「目录非空」的
          # 假绿。脚本自己也拦这一种，这儿再挡一道，免得错怪到产物头上。
          [ "${#SAYS[@]}" -gt 0 ] || { echo "::error::没算出任何小标"; exit 1; }
          python tools/check_explainer_landed.py --local "$OUTDIR" "$SLUG" --says "${SAYS[@]}"

      # **成片一律发到 Release，不进 git。**（2026-08-13 起）
      #
      # 来路：账号所有者 2026-08-13「当前代码库太大了」「后面新的视频全部走
      # 新的架构不要放在代码里面」「包括后续所有的视频，制作的视频。都走
      # 统一的 Release 路线」。量出来 .git 已 6.0 GB，其中 mp4 blob 4.93 GB——
      # 这条线的成片 7 MB 上下一条条全在里面，每重渲一版就多一份死 blob。
      #
      # 存量已进 git 的解说成片**留着不动**——已发推送里的 jsDelivr 链接钉在
      # 仓库文件路径上，微信消息收不回来，删文件就是把老消息变成死链。只改
      # 增量：从这天起传 Release、把链接写进 `render.json` 的 `video_url`、
      # **删掉本地那份**（让提交步骤根本看不见它）。`explainer_push_html`
      # 优先读 `video_url`，没有才退回拼 jsDelivr 的老路（存量包重推的兜底）。
      #
      # 为什么是 Release 而不是 LFS：LFS 免费额度只有 1 GB/月流量，而且
      # `raw.githubusercontent.com` 对 LFS 文件返回的是**指针文本不是视频**，
      # 微信里那个 ▶ 按钮直接坏掉。详见 match-reel.yml 的 Release 那一步的注释。
      #
      # ⚠️ **这一步排在「上传成片 artifact」之后**：mp4 先进 artifact，这一步
      # 真失败时片子还有处可取（下面提交步骤的报错一直这么承诺）。这条线没有
      # 单独的「验成片」步骤——生成那步自己验（ffmpeg 没出片会当场抛
      # ExplainerVideoError），这儿再兜一道 `test -s`。
      - name: 成片发到 Release（不进 git）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUTDIR="${{ steps.gen.outputs.outdir }}"
          SLUG="${{ steps.gen.outputs.slug }}"
          CLIP="$OUTDIR/explainer.mp4"
          test -s "$CLIP" || { echo "::error::成片不存在或是空的：$CLIP"; exit 1; }
          # SZ 留着：render.json 的 video_bytes 从它来
          SZ=$(stat -c%s "$CLIP")
          TAG="explainer-$SLUG"
          echo "成片 $((SZ/1048576)) MiB —— 发到 Release $TAG"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "知识解说 · $SLUG" \
                 --notes "解说片成片。所有视频一律走 Release 附件，不进 git。"
          # **传附件要重试**（照 match-reel.yml 同一步骤抄的，注释也抄）。
          # 来路是 2026-08-13 李娜那条（run 31709569579）：render 跑了
          # 14 分 27 秒、质检也过了，死在 `--clobber` 撞上 GitHub 自己的
          # HTTP 500。一次瞬时 5xx 报销的是整趟生成（这条线一趟十来分钟）。
          # 重发是安全的：`--clobber` 幂等，删到一半再传一遍就好。
          # ⚠️ 循环里不许写 `[ A ] && break`——`bash -e` 下 AND 列表整条为假
          # 会直接把这一步杀掉（下面探活那段的注释记的是同一个坑）。一律用 if。
          UPLOADED=0
          for i in 1 2 3 4; do
            if gh release upload "$TAG" "$CLIP" --clobber; then UPLOADED=1; break; fi
            if [ "$i" != 4 ]; then
              WAIT=$((5 * i * i))
              echo "第 $i 次传 Release 附件没成，${WAIT}s 后重试"
              sleep "$WAIT"
            fi
          done
          [ "$UPLOADED" = 1 ] || {
            echo "::error::Release 附件传了 4 次都没上去"; exit 1; }
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/explainer.mp4"
          # **传完自己探一次**：Release 的 CDN 有几秒传播延迟，探不到就别写链接
          # ——写了等于把一个 404 发到微信，而消息发出去收不回来。
          # ⚠️ 循环体最后一句不许写成 `[ A ] || [ B ] && break`：整条 AND-OR
          # 列表为假时 `bash -e` 会直接把这一步杀掉，看着像「探活失败」，
          # 其实是第一次没中就退出了。用 if。
          for i in 1 2 3 4 5 6 7 8; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -L -r 0-99 "$URL" || echo 000)
            if [ "$CODE" = "206" ] || [ "$CODE" = "200" ]; then break; fi
            echo "第 $i 次探活 $CODE，5s 后重试"
            sleep 5
          done
          [ "$CODE" = "206" ] || [ "$CODE" = "200" ] || {
            echo "::error::Release 附件 $URL 探不到（$CODE）"; exit 1; }
          echo "Release 附件可取：$URL"
          python - "$OUTDIR/render.json" "$URL" "$SZ" <<'PY'
          import json
          import sys
          from pathlib import Path
          path, url, size = Path(sys.argv[1]), sys.argv[2], int(sys.argv[3])
          # 这条线原来不写 render.json，所以要允许它还不存在
          data = json.loads(path.read_text(encoding="utf-8")) if path.is_file() else {}
          data["video_url"] = url
          data["video_bytes"] = size
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                          encoding="utf-8")
          print("render.json 记下 video_url")
          PY
          rm -f "$CLIP"
          # **重渲 push.html。** 它是「生成解说视频」那一步写的，那一刻
          # render.json 还没有 video_url，▶ 按钮拼的是 jsDelivr 老路——而这条
          # mp4 从这天起不进 git，那个链接**必然 404**。render.json 落定之后
          # 再渲一遍，explainer_push_html 优先读 video_url，按钮才指向 Release。
          # 日期传 today：和生成那步的 `TZ=Asia/Shanghai date +%F` 是同一个口径
          # （parse_date_arg('today') = beijing_today()），同一趟 run 里必然同一天。
          python - "$OUTDIR" "$SLUG" <<'PY'
          import sys
          from pathlib import Path
          outdir, slug = Path(sys.argv[1]), sys.argv[2]
          from tennislive.timeutil import parse_date_arg
          from tennislive.render.tournament_story import find_story_by_slug
          from tennislive.video.explainer import explainer_push_html, explainer_script
          story = find_story_by_slug(slug)
          if story is None:
              raise SystemExit(f"找不到 slug {slug} 的选题，push.html 没法重渲")
          segments = explainer_script(story)
          xhs = (outdir / "xiaohongshu.txt").read_text(encoding="utf-8")
          (outdir / "push.html").write_text(
              explainer_push_html(segments, outdir,
                                  date=parse_date_arg("today"), xhs_text=xhs),
              encoding="utf-8")
          PY

      - name: 提交成片到仓库
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          OUTDIR="${{ steps.gen.outputs.outdir }}"
          git add "$OUTDIR"
          if git diff --cached --quiet; then
            echo "没有新成片"
            exit 0
          fi
          # `git pull --rebase` used to sit here, and it cannot rebase a run
          # whose output landed while this one was rendering: the conflicting
          # files are mp4 and png, git refuses to merge binaries, and the job
          # dies after doing all the work. Five regenerations were lost that
          # way before anyone noticed, because the run that dies leaves the
          # previous output in place and the repo still looks populated.
          #
          # Generated output has exactly one correct resolution — the copy
          # this run just rendered — so replay it onto whatever main is now
          # instead of merging. Retry because main can move again mid-push.
          #
          # Replay only THIS topic's directory. Replaying all of output/ put
          # back every other topic as it stood at this run's checkout, so a
          # batch of eight runs spent the evening reverting each other: a
          # deck would render correctly, land, and then be overwritten by
          # the next run's stale copy of it. The published cards flickered
          # between the old and new brand mark for half an hour.
          BRANCH="${{ github.ref_name }}"
          MSG="content: 知识解说视频 $(basename "$OUTDIR")"
          python tools/check_staged_file_sizes.py
          git commit -m "$MSG"
          # Backoff has to outlast a whole batch, not one collision. With
          # five tries three seconds apart, a run regenerating alongside six
          # siblings burned every attempt in fifteen seconds and gave up
          # while the others were still pushing. Jitter so the losers of a
          # collision do not line up and collide again.
          for attempt in $(seq 1 10); do
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "push 被拒（第 $attempt 次），把本次成片重放到最新的 $BRANCH 上"
            git fetch origin "$BRANCH"
            git branch -f rendered HEAD
            git reset --hard "origin/$BRANCH"
            git checkout rendered -- "$OUTDIR"
            git add "$OUTDIR"
            python tools/check_staged_file_sizes.py
            git diff --cached --quiet || git commit -m "$MSG"
            sleep $((attempt * 5 + RANDOM % 10))
          done
          echo "::error::连续 10 次推送失败，成片仍在 artifact 里"
          exit 1

      - name: PushPlus 推送到微信
        if: github.event.inputs.push == 'true' && env.PUSHPLUS_TOKEN != ''
        run: |
          export TENNISLIVE_ASSET_REV="$(git rev-parse HEAD)"
          tennislive publish pushplus --dir "${{ steps.gen.outputs.outdir }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
