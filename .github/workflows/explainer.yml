name: explainer-video

# 生成一条 AI 旁白知识解说视频（前因后果 / 技术原理 / 当今现状）。
# 面向抽象、拿不到合格真实照片的知识点（如鹰眼/计分制）：解说词由该选题
# 已核验的事实改写而成，画面是文字卡与示意图，不伪造真实赛场影像。
# 手动触发，成片提交回仓库，不自动推送。
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "知识选题 slug（默认 hawkeye）"
        required: false
        default: "hawkeye"
      # Empty means "whatever the code says". This used to default to
      # zh-CN-YunxiNeural and was passed unconditionally, so choosing a new
      # default voice in code changed nothing: every dispatch silently put
      # the old voice back on the command line. Three decks were regenerated
      # that way and came out in the voice that had just been replaced.
      voice:
        description: "edge-tts 中文语音（留空＝用代码默认：云健）"
        required: false
        default: ""
      rate:
        description: "语速，如 +22%（留空＝用代码默认）"
        required: false
        default: ""
      push:
        description: "生成后推送到微信（true/false）"
        required: false
        default: "false"

permissions:
  contents: write

# Per topic, not per workflow. A single group meant that dispatching a batch
# of slugs kept only the first and the last: GitHub holds one run pending per
# group and cancels the rest. Different topics touch different output
# directories, so they have no reason to queue behind each other — and two
# runs landing at once is now handled by the push step's replay-and-retry.
#
# 同一个 slug 则取消旧的。改完发一版、没等落库又改一版再发，两个 run 会一起跑，
# 谁后落库谁赢——今晚两次都是先落库的旧版赢了，而两次的 commit message 一模一样，
# 光看 git log 完全看不出来，是逐像素比对才发现的。同一条片子只可能有一个"最新"，
# 所以让新的顶掉旧的。不同 slug 不受影响：分组名里带着 slug，多条「开球之前」
# 可以同一天并行生成，各写各的 output/<日期>/explainer/<slug>/。
concurrency:
  group: explainer-video-${{ github.event.inputs.slug || 'hawkeye' }}
  cancel-in-progress: true

jobs:
  explainer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TENNISLIVE_THEME: ${{ vars.TENNISLIVE_THEME || 'dark' }}
      # 卡片图和成片走哪个 jsDelivr 入口。留空＝代码默认（gcore）。
      # 想 A/B 别的镜像，在仓库 Actions variables 里改这一个值即可，
      # 不用动代码；填错域名会被代码挡掉并退回默认，不会发出裂图。
      TENNISLIVE_JSDELIVR_HOST: ${{ vars.TENNISLIVE_JSDELIVR_HOST }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      PUSHPLUS_SECRET_KEY: ${{ secrets.PUSHPLUS_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # **别把 output/ 拉下来。** HEAD 上它就有 1.36 GB（.git 1.77 GiB），
          # checkout 因此每次要一分半到三分钟。
          # 本次要写的那一格在算出目录之后 `git sparse-checkout add` 回来——
          # **两半都要有**：只写这一半，`git add "$OUTDIR"` 会说路径在稀疏
          # 范围之外，只警告、退出码 0，产物静默丢掉。
          sparse-checkout: |
            assets
            data
            docs
            specs
            src
            tests
            tools

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装中文字体（幻灯需要）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 安装 tennislive + edge-tts
        run: |
          pip install -q -e ".[webrender]"
          pip install -q edge-tts

      - name: 缓存 Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: 安装 Chromium
        run: python -m playwright install --with-deps chromium

      - name: 安装 ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 生成解说视频
        id: gen
        run: |
          OUT_DATE=$(TZ=Asia/Shanghai date +%F)
          SLUG="${{ github.event.inputs.slug }}"
          if [ -z "$SLUG" ]; then SLUG="hawkeye"; fi
          OUT_DIR="output/$OUT_DATE/explainer/$SLUG"
          echo "outdir=$OUT_DIR" >> "$GITHUB_OUTPUT"
          # 进 cone 排在生成之前：`sparse-checkout add` 会把 HEAD 上那一版
          # 先铺回工作区，铺完再生成才是对的顺序（反过来会拿旧内容盖掉新的）。
          # 重放循环里的 `git checkout rendered -- "$OUTDIR"` 也要它在 cone 里。
          git sparse-checkout add "$OUT_DIR"
          # if-blocks, not `[ -n "$V" ] && ARGS+=(...)`: this step runs under
          # `bash -e`, where a top-level AND-list whose test fails aborts the
          # whole step.
          ARGS=(--slug "$SLUG" --outdir "$OUT_DIR")
          VOICE="${{ github.event.inputs.voice }}"
          RATE="${{ github.event.inputs.rate }}"
          if [ -n "$VOICE" ]; then ARGS+=(--voice "$VOICE"); fi
          if [ -n "$RATE" ]; then ARGS+=(--rate "$RATE"); fi
          echo "生成参数：${ARGS[*]}"
          tennislive explainer "${ARGS[@]}"
          ls -la "$OUT_DIR"
          # 视频体积可观，仅保留成片与幻灯，丢弃中间音频。
          rm -f "$OUT_DIR"/voice_*.mp3
          # 卡片 2026-07-29 起存 JPEG。重生成一条旧片子时，同名的 .png 还留在
          # 目录里（提交步骤只 add，不会删），于是仓库里同时躺着新旧两套图——
          # 一条就是 31 MB 的死重量，而且 `git add` 之后谁也看不出哪套是活的。
          rm -f "$OUT_DIR"/slide_*.png

      - name: 上传成片 artifact
        uses: actions/upload-artifact@v4
        with:
          name: explainer-${{ github.run_number }}
          path: ${{ steps.gen.outputs.outdir }}
          retention-days: 14

      - name: 提交成片到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OUTDIR="${{ steps.gen.outputs.outdir }}"
          git add "$OUTDIR"
          if git diff --cached --quiet; then
            echo "没有新成片"
            exit 0
          fi
          # `git pull --rebase` used to sit here, and it cannot rebase a run
          # whose output landed while this one was rendering: the conflicting
          # files are mp4 and png, git refuses to merge binaries, and the job
          # dies after doing all the work. Five regenerations were lost that
          # way before anyone noticed, because the run that dies leaves the
          # previous output in place and the repo still looks populated.
          #
          # Generated output has exactly one correct resolution — the copy
          # this run just rendered — so replay it onto whatever main is now
          # instead of merging. Retry because main can move again mid-push.
          #
          # Replay only THIS topic's directory. Replaying all of output/ put
          # back every other topic as it stood at this run's checkout, so a
          # batch of eight runs spent the evening reverting each other: a
          # deck would render correctly, land, and then be overwritten by
          # the next run's stale copy of it. The published cards flickered
          # between the old and new brand mark for half an hour.
          BRANCH="${{ github.ref_name }}"
          MSG="content: 知识解说视频 $(basename "$OUTDIR")"
          python tools/check_staged_file_sizes.py
          git commit -m "$MSG"
          # Backoff has to outlast a whole batch, not one collision. With
          # five tries three seconds apart, a run regenerating alongside six
          # siblings burned every attempt in fifteen seconds and gave up
          # while the others were still pushing. Jitter so the losers of a
          # collision do not line up and collide again.
          for attempt in $(seq 1 10); do
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "push 被拒（第 $attempt 次），把本次成片重放到最新的 $BRANCH 上"
            git fetch origin "$BRANCH"
            git branch -f rendered HEAD
            git reset --hard "origin/$BRANCH"
            git checkout rendered -- "$OUTDIR"
            git add "$OUTDIR"
            python tools/check_staged_file_sizes.py
            git diff --cached --quiet || git commit -m "$MSG"
            sleep $((attempt * 5 + RANDOM % 10))
          done
          echo "::error::连续 10 次推送失败，成片仍在 artifact 里"
          exit 1

      - name: PushPlus 推送到微信
        if: github.event.inputs.push == 'true' && env.PUSHPLUS_TOKEN != ''
        run: |
          export TENNISLIVE_ASSET_REV="$(git rev-parse HEAD)"
          tennislive publish pushplus --dir "${{ steps.gen.outputs.outdir }}"
