name: codex-probe-swiatek-rybakina-source

on:
  push:
    branches:
      - codex/probe-swiatek-rybakina-20260821
    paths:
      - .github/workflows/codex-probe-swiatek-rybakina-source.yml

permissions:
  contents: read

jobs:
  probe:
    if: "${{ github.event.head_commit.message == 'ci: probe selected source second by second' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install download stack
        run: |
          pip install -q --upgrade "yt-dlp[default]" bgutil-ytdlp-pot-provider
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Start PO token provider
        run: |
          docker run --name bgutil-pot -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
          for i in $(seq 1 25); do
            curl -sf http://127.0.0.1:4416/ping >/dev/null && exit 0
            sleep 2
          done
          docker logs bgutil-pot
          exit 1
      - name: Write YouTube cookies
        id: cookies
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "path=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_OUTPUT"
          fi
      - name: Download selected source and build one-second sheets
        env:
          YT_COOKIES: ${{ steps.cookies.outputs.path }}
        run: |
          mkdir -p probe
          ARGS=(
            --no-playlist --retries 3 --js-runtimes node
            -f 'bv*[height<=720]+ba/b[height<=720]'
            --merge-output-format mp4
            -o probe/source.mp4
          )
          [ -n "$YT_COOKIES" ] && ARGS+=(--cookies "$YT_COOKIES")
          yt-dlp "${ARGS[@]}" 'https://youtu.be/ntKq8uBK5dM'
          ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate             -of json probe/source.mp4 > probe/source.json
          for START in 450 500 550 600 650; do
            END=$((START + 50))
            [ "$END" -gt 706 ] && END=706
            DUR=$((END - START))
            ROWS=$(((DUR + 4) / 5))
            ffmpeg -hide_banner -loglevel error -ss "$START" -i probe/source.mp4 -t "$DUR"               -vf "fps=1,scale=480:-2,tile=5x${ROWS}:padding=4:margin=4"               -frames:v 1 -q:v 3 "probe/${START}-${END}-1s.jpg"
          done
          ffmpeg -hide_banner -loglevel error -ss 500 -i probe/source.mp4             -vf 'scale=640:-2' -c:v libx264 -preset veryfast -crf 27             -c:a aac -b:a 96k -movflags +faststart probe/injury-review-500-end.mp4
          rm probe/source.mp4
          cat > probe/README.txt <<'EOF'
          Source: ntKq8uBK5dM, 1280x720.
          Each JPEG is row-major, five columns, one frame per source second.
          For 550-600-1s.jpg: first tile = 550s, second = 551s, and so on.
          injury-review-500-end.mp4 begins at source 500.000s.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: swiatek-rybakina-selected-source-second-probe
          path: probe
          retention-days: 7
