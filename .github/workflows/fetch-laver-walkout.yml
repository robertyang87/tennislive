name: fetch-laver-walkout

# 一次性的临时任务（不是流水线，不合并进 main）：账号所有者 2026-09-25 要把
# 拉沃尔杯两队出场片做成横屏双语字幕的独立视频。沙箱被 YouTube 挡了，
# 这里只做一件事：用仓库的 cookie 把源片和自动字幕下下来挂到 Release，
# 剪辑和烧字幕在本地做。
on:
  push:
    branches: [claude/laver-cup-entrance-video-jdvqqw]
    paths: [.github/workflows/fetch-laver-walkout.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 装 yt-dlp
        run: pip install -q "yt-dlp[default]" bgutil-ytdlp-pot-provider
      - name: 启动 PO token provider
        run: |
          docker run --name bgutil-pot -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4416/ping; then break; fi
            sleep 1
          done
      - name: 下源片和字幕
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          mkdir -p out
          C=()
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/c.txt"; C=(--cookies "$RUNNER_TEMP/c.txt")
          fi
          URL="https://www.youtube.com/watch?v=ZTeyiwjaBTE"
          OK=0
          for client in default android_vr tv_simply web_safari; do
            X=()
            if [ "$client" != default ]; then X=(--extractor-args "youtube:player_client=$client"); fi
            if yt-dlp --js-runtimes node "${C[@]}" "${X[@]}" \
                 -f "bv*[height<=1080][ext=mp4]+ba[ext=m4a]/bv*[height<=1080]+ba/b" \
                 --merge-output-format mp4 -o out/laver-walkout-source.mp4 \
                 --write-auto-subs --write-subs --sub-langs "en,en-orig" --sub-format json3 "$URL"; then
              OK=1; break
            fi
          done
          [ "$OK" = 1 ] || { echo "::error::全部 client 都下不动"; exit 1; }
          ls -la out
      - name: 挂到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=scratch-laver-walkout-2026
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "临时：拉沃尔杯出场源片" --notes "一次性素材，不是产物。" --prerelease
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" out/* --clobber
