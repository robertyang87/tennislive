name: probe-nishikori-match-mp4-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-nishikori-match-mp4-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          sparse-checkout: |
            .github
            tools

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装媒体与转写依赖
        timeout-minutes: 6
        run: |
          source tools/ci_apt_install.sh
          ensure_ffmpeg
          pip install -q faster-whisper

      - name: 下载并核验美网官方比赛视频
        env:
          SOURCE_URL: https://usopenvideo.akamaized.net/2026/prd/interviews/fc237349-6bb1-4cd1-9341-da83ed9c4b44.mp4
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-delay 2 \
            -A 'Mozilla/5.0' "$SOURCE_URL" -o /tmp/nishikori-match.mp4
          test -s /tmp/nishikori-match.mp4
          sha256sum /tmp/nishikori-match.mp4 | tee /tmp/source.sha256
          ffprobe -v error -show_format -show_streams -of json \
            /tmp/nishikori-match.mp4 | tee /tmp/probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/probe.json').read_text())
          video=next(s for s in d['streams'] if s.get('codec_type')=='video')
          audio=next((s for s in d['streams'] if s.get('codec_type')=='audio'),{})
          duration=float(d['format']['duration'])
          print('MEDIA_SUMMARY',json.dumps({
              'width':video.get('width'),'height':video.get('height'),
              'fps':video.get('avg_frame_rate'),'duration':duration,
              'video_codec':video.get('codec_name'),'audio_codec':audio.get('codec_name'),
              'size':int(d['format'].get('size') or 0),
          },ensure_ascii=False))
          if int(video.get('height') or 0) < 1080:
              raise SystemExit(f"官方视频只有 {video.get('height')}p，低于1080p硬门槛")
          PY

      - name: 双模型转写并输出末段时间码
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from faster_whisper import WhisperModel

          src='/tmp/nishikori-match.mp4'
          all_results={}
          for model_name in ('small.en','medium.en'):
              model=WhisperModel(model_name,compute_type='int8')
              segs,info=model.transcribe(
                  src,language='en',vad_filter=False,word_timestamps=True,
                  beam_size=5,condition_on_previous_text=True,
              )
              rows=[]
              for s in segs:
                  words=[]
                  for w in (s.words or []):
                      token=str(w.word or '').strip()
                      if token:
                          words.append({'a':round(float(w.start),2),'b':round(float(w.end),2),'text':token})
                  rows.append({
                      'a':round(float(s.start),2),'b':round(float(s.end),2),
                      'text':str(s.text or '').strip(),'words':words,
                  })
              all_results[model_name]={'duration':float(info.duration or 0),'segments':rows}
              print(f'=== {model_name} ALL SEGMENTS ===')
              for r in rows:
                  print(f"{r['a']:7.2f}-{r['b']:7.2f} | {r['text']}")
              cutoff=max(0,float(info.duration or 0)-80)
              print(f'=== {model_name} LAST 80 SECONDS (cutoff={cutoff:.2f}) ===')
              for r in rows:
                  if r['b']>=cutoff:
                      print(f"{r['a']:7.2f}-{r['b']:7.2f} | {r['text']}")
              print(f'=== {model_name} LAST 80 WORDS ===')
              for r in rows:
                  for w in r['words']:
                      if w['b']>=cutoff:
                          print(f"{w['a']:7.2f}-{w['b']:7.2f} | {w['text']}")
          Path('/tmp/transcripts.json').write_text(
              json.dumps(all_results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: 生成末段画面墙与试听片段
        run: |
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 /tmp/nishikori-match.mp4)
          START=$(python - <<PY
          print(max(0,float('$DURATION')-60))
          PY
          )
          ffmpeg -hide_banner -loglevel error -ss "$START" -i /tmp/nishikori-match.mp4 \
            -vf "fps=1/4,scale=480:-2,tile=5x3:padding=6:margin=6" \
            -frames:v 1 -q:v 2 /tmp/contact-last60.jpg
          ffmpeg -hide_banner -loglevel error -ss "$START" -i /tmp/nishikori-match.mp4 \
            -t 60 -c copy /tmp/tail-last60.mp4
          ls -lh /tmp/contact-last60.jpg /tmp/tail-last60.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: nishikori-official-match-probe
          path: |
            /tmp/probe.json
            /tmp/source.sha256
            /tmp/transcripts.json
            /tmp/contact-last60.jpg
            /tmp/tail-last60.mp4
          retention-days: 2

      - name: 清理一次性工作流
        if: always()
        run: |
          git pull --rebase origin main
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git rm .github/workflows/probe-nishikori-match-mp4-once.yml
          git commit -m "ops: 清理锦织圭官方比赛视频探测工作流"
          source tools/git_push_retry.sh
          push_with_rebase_retry main 5
