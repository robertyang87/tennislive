name: Djokovic Bu production kickoff
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: [.github/workflows/djokovic-bu-kickoff.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.head_ref == 'codex/djokovic-bu-20261003'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch native source probe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRODUCTION_BRANCH: ${{ github.head_ref }}
        run: |
          gh workflow run match-reel.yml --ref "$PRODUCTION_BRANCH" -f mode=probe -f slug=djokovic-bu-beijing-2026-r2 -f url=https://www.youtube.com/watch?v=U_XusSb_NV4 -f scorebox=96,920,530,1030 -f push=false
