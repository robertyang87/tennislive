name: tmp-sc-fetch
# 临时：swiatek-chwalinska-story-2026 下载官方图到分支，合并前删除。
on:
  push:
    branches: [claude/swiatek-chwalinska-story-2026]
    paths: [research/swiatek-chwalinska-story-2026/cover_fetch.txt, .github/workflows/tmp-sc-fetch.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          mkdir -p assets/reel/swiatek-chwalinska
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -sSfL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124" -o "assets/reel/swiatek-chwalinska/raw-$name" "$url" && ls -l "assets/reel/swiatek-chwalinska/raw-$name" || echo "FAIL $name"
          done < research/swiatek-chwalinska-story-2026/cover_fetch.txt
          python3 -c "
          import glob
          from PIL import Image
          for f in sorted(glob.glob('assets/reel/swiatek-chwalinska/raw-*')):
              im=Image.open(f); print(f, im.size, im.mode)
          " || true
      - name: commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add assets/reel/swiatek-chwalinska
          git commit -m "tmp: 下载斯瓦泰克与赫瓦林斯卡官方图" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin claude/swiatek-chwalinska-story-2026 && git push -q origin HEAD:claude/swiatek-chwalinska-story-2026 && break; sleep 5; done
