name: codex-fetch-cincinnati-r16-covers

on:
  push:
    branches:
      - codex/cincinnati-2026-08-20-remaining-reels
    paths:
      - .github/workflows/codex-fetch-cincinnati-r16-covers.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/cincinnati-2026-08-20-remaining-reels

      - name: Download verified same-match cover photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/reel
          curl --fail --location --retry 3 --header 'Accept: image/*'             'https://www.gannett-cdn.com/authoring/authoring-images/2026/08/20/PCIN/91381522007-081926-tennis-95.JPG'             --output assets/reel/auger-aliassime-cincinnati-2026-r16.jpg
          curl --fail --location --retry 3 --header 'Accept: image/*'             'https://www.gannett-cdn.com/authoring/authoring-images/2026/08/19/PCIN/91378535007-081926-tennis-30.JPG'             --output assets/reel/deminaur-cincinnati-2026-r16.jpg
          curl --fail --location --retry 3             'https://cincinnatiopen.com/wp-content/uploads/2026/08/best-day-9_CincinnatiOpen_20260819_JM045007_JW1.jpg'             --output assets/reel/musetti-cincinnati-2026-r16.jpg
          curl --fail --location --retry 3             'https://cincinnatiopen.com/wp-content/uploads/2026/08/best-day-9_CincinnatiOpen_20260819_JM044736_LS2.jpg'             --output assets/reel/tirante-cincinnati-2026-r16.jpg
          curl --fail --location --retry 3 --header 'Accept: image/*'             'https://www.gannett-cdn.com/authoring/authoring-images/2026/08/19/PCIN/91378531007-081926-tennis-45.JPG'             --output assets/reel/rybakina-cincinnati-2026-r16.jpg

      - name: Verify image dimensions
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          expected = {
              "auger-aliassime-cincinnati-2026-r16.jpg": (3414, 5121),
              "deminaur-cincinnati-2026-r16.jpg": (5086, 3391),
              "musetti-cincinnati-2026-r16.jpg": (1920, 1280),
              "tirante-cincinnati-2026-r16.jpg": (1920, 1280),
              "rybakina-cincinnati-2026-r16.jpg": (3327, 4990),
          }
          for name, dims in expected.items():
              path = Path("assets/reel") / name
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  actual = image.size
              if actual != dims:
                  raise SystemExit(f"{name}: expected {dims}, got {actual}")
              print(name, actual)
          PY

      - name: Commit cover photos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/reel
          git diff --cached --quiet && exit 0
          git commit -m 'assets: add same-match Cincinnati R16 cover photos'
          git push
