name: news-brief

# 网球热点简报：扫新闻 → 聚热点 → 抓正文出中文要点 → **一条**微信。
#
# 这条工作流原来叫 news-radar，一趟发**两条**微信：
#   「场外网球快讯候选」——8 条英文标题 + 链接
#   「今日选题候选」——撞上人工角度表的簇，2026-08-02 实测 0 个
# 账号所有者的原话：「目前推送的内容还有两块，英文媒体一份中文一份，
# 而且也看不到具体内容……合并成一个做推送，英文的话要有对应的中文翻译，
# 主要能深入挖掘热点」。
#
# 于是三件事一起改了：合成一条、英文一律带中译、前几条抓正文出中文要点。
# 判据在 tests/test_news_brief.py。
#
# ⚠️ **这条不再装 Chromium 和中文字体**。原来装它们是为了渲 flash-radar 的
# 草稿卡（`draft_00.jpg`），而简报是纯 HTML 文字消息，一张图都不出——
# 那两步白烧一分半。要出快讯卡走 `tennislive flash-card`，它自己会装。
on:
  # **定时仍然不开。** 2026-08-02 账号所有者：「这两个任务停掉吧，不需要了」，
  # 那个决定针对的是「无人值守地一天两趟」，这次改的是**内容形态**，不是
  # 那个决定——所以照旧只留手动，要恢复定时是加一行 cron 的事。
  #
  # 判据：test_停掉的定时不许自己回来
  workflow_dispatch:
    inputs:
      deep:
        description: "深挖几条（抓正文出中文要点）。0 = 全部（默认）"
        required: false
        default: "0"
      push:
        # ⚠️ **默认 true，改口径要连这个默认值一起想清楚。**
        #
        # 2026-08-05 加的，理由是「⚠️ 判据只在发布路径上才走得到，它就永远
        # 验不了」那条（CLAUDE.md）：改了 prompt / 角度表想看一眼产物长什么
        # 样，原来只能真发一条微信——而微信那条消息**发出去收不回来**，
        # 于是「验一下」和「发出去」被绑在了一起。同一天为了核 `angle` 那一栏
        # 已经发了三条几乎一样的推送给账号所有者。
        #
        # 关掉它**只跳过发微信那一步**：照常抓、照常出简报、照常提交进仓库，
        # 所以产物（brief.json / brief_push.html）一样能打开逐条看。
        #
        # ⚠️ 这不是 `mode=push` 那个坑的重演。那个坑坏在**关掉之后整趟什么都
        # 不产**，绿得和发出去一模一样；这里关掉之后产物照旧落库，而且下面
        # 那一步会**明写一行**说本次没发——「被跳过的步骤根本不进日志」，
        # 不出声的话「没发」和「发了」在日志上分不出来。
        description: "推微信（默认 true）。false = 只出简报并提交，不发消息"
        required: false
        default: "true"

permissions:
  contents: write

concurrency:
  group: news-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      # 中译和要点靠这两个**二选一**，配哪个走哪个（都配了走 DeepSeek，
      # 要反过来用 `TENNISLIVE_BRIEF_PROVIDER=anthropic`）。跑了哪条会写进
      # `brief.json` 的 notes 和推送正文底部——「配了什么」不是判据，
      # 「走了哪条」才是。
      #
      # ⚠️ **不是 `GITHUB_MODELS_TOKEN`**：那个端点 2026-08-05 实测返回 410
      # `github_models_retirement_brownout`，正在退役（`video-localize.yml`
      # 还挂在上面，是另一笔账）。
      # 两个都没配不会让这条工作流失败：简报退回「只有英文标题和热度」，
      # 并在推送正文底部照实写出来（见 `Brief.notes`）。
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # **别把 output/ 拉下来**（HEAD 上 1.36 GB，checkout 要一分半到三分钟）。
          # 本次要写的那一格在下面 `git sparse-checkout add` 回来。
          sparse-checkout: |
            assets
            data
            docs
            specs
            src
            tests
            tools

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装 tennislive
        # 只要主依赖 + 简报那一个 extra：简报是纯文字 HTML，不渲卡片，
        # 所以不装 webrender、不装 Chromium、不装中文字体。
        #
        # `[brief]` 里只有 anthropic SDK。**走 DeepSeek 那条路一个新依赖都
        # 不用装**（`requests` 是主依赖），照装是为了两个密钥哪个配着都能跑，
        # 代价是几秒钟。
        run: pip install -q -e ".[brief]"

      - name: 生成今日简报
        id: brief
        run: |
          OUT_DATE=$(TZ=Asia/Shanghai date +%F)
          echo "date=$OUT_DATE" >> "$GITHUB_OUTPUT"
          DATE=$(python -c "from tennislive.timeutil import beijing_today; print(beijing_today())")
          # 进 cone 要排在生成**之前**：`sparse-checkout add` 会把 HEAD 上
          # 那一版先铺回工作区，铺完再生成才是对的顺序（反过来会拿旧内容
          # 盖掉刚生成的）。
          git sparse-checkout add "output/$DATE"
          tennislive brief --outdir output --deep "${{ inputs.deep || '0' }}"

      - name: 提交简报到仓库
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          # **必须带 `--sparse`**：稀疏检出之后，裸的 `git add output/` 对
          # cone 外的路径只打一句警告然后退出码 0，这一轮的产物静默丢掉。
          git add --sparse output/
          if git diff --cached --quiet; then
            echo "没有新的简报"
          else
            python tools/check_staged_file_sizes.py
            git commit -m "content: 网球热点简报 ${{ steps.brief.outputs.date }}"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "${{ github.ref_name }}"
          fi

      - name: 推送简报到微信
        id: push
        # **整条工作流只有这一次推送。** 原来这儿是两步（快讯候选 + 选题候选），
        # 合并的全部意义就在于这里只剩一条。判据：test_一天只发一条推送
        if: env.PUSHPLUS_TOKEN != ''
        # 2026-08-13 审查：这里的 `continue-on-error: true` 原来是**裸的**，
        # 而它把这条工作流自己装的那道闸废掉了——下面「运行失败时告警」挂的是
        # `if: failure()`，专为无人值守写的；continue-on-error 让 job 保持绿色，
        # 那个 PushPlus 告警**一次都不会响**。
        #
        # ⚠️ 这里 continue-on-error **确实还有用**（和 flash / knowledge-adhoc
        # 不一样）：下面「空产摘要」挂的是 `if: success()`，它把
        # 新闻条数/热点数/每个信号源的状态写进运行摘要。推送失败时那份诊断
        # 照样要留下，所以不能让 job 在这一步就红。改法是**延迟失败**：
        # 摘要写完之后再按 outcome 重抛（形状抄 `oncourt-interviews.yml`）。
        # 判据：tests/test_workflow_alerts.py::test_吞掉微信推送失败的步骤都要按outcome重抛
        continue-on-error: true
        run: |
          # ⚠️ 这个分支要**出声**。被 `if:` 跳过的步骤根本不进日志，于是
          # 「本次没发」和「发了」长得一模一样（`mode=push` 那次栽过：
          # 27 秒、绿的、什么都没发，日志里一个字都没说）。所以判断写在
          # 步骤**里面**，不写在 `if:` 上——不发也要留一行。
          if [ "${{ inputs.push || 'true' }}" != "true" ]; then
            echo "本次不发微信（push=false）：简报已落库，去 output/${{ steps.brief.outputs.date }}/brief/ 里看"
            exit 0
          fi
          FILE="output/${{ steps.brief.outputs.date }}/brief/brief_push.html"
          if [ ! -s "$FILE" ]; then
            echo "::error::简报正文没写出来，本次不推送"
            exit 1
          fi
          BODY="$(jq -nc \
            --arg t "$PUSHPLUS_TOKEN" \
            --arg title "网球热点简报 · ${{ steps.brief.outputs.date }}" \
            --rawfile c "$FILE" \
            '{token:$t,title:$title,content:$c,template:"html"}')"
          RESP="$(curl -s -m 30 -X POST https://www.pushplus.plus/send \
            -H "Content-Type: application/json" -d "$BODY")"
          # 流水号要记进日志：`code == 200` 只保证 PushPlus 收下了，不保证
          # 微信推到了手机上。真出现「接口成功但人没收到」，没有流水号什么
          # 都查不了。
          echo "PushPlus 返回：$RESP"
          # 2026-08-13 补：**这里原来 echo 完就结束，从来没有人看那行返回体。**
          # PushPlus 拒绝（token 错、内容超限、频率限制）时 **HTTP 仍然是 200、
          # curl 退出码仍然是 0**，于是这一步全绿、整趟全绿，而那份简报一个人
          # 都没收到。判据是**返回体里的 code**，不是 curl 的退出码——
          # 又一次「查产物，不查信号」。
          #
          # ⚠️ **只判，不在这儿重试。** `code != 200` 是服务端明确拒绝，
          # 重发只会把同一条错误消息发很多次，而微信那条消息发出去收不回来
          # （这条政策的实现和推导写在 `src/tennislive/publish/pushplus.py`
          # 的重试预算注释里：只重试「没送到」）。
          #
          # ⚠️⚠️ **别把那条政策读成「所以「没送到」这一半在这儿也有人管」——
          # 这条路一次都不重试。** flash / knowledge-adhoc 走的是
          # `tennislive publish`，也就是 `publish/pushplus.py` 的 `push()`，
          # 那儿有 `PUSH_ATTEMPTS` 次「没送到」重试；**这一步是裸 curl，
          # 绕开了那个函数**，所以政策的前一半（拒绝不重发）照做了，
          # 后一半（没送到要重发）在这条线上根本不存在。
          # 后果是明摆着的：`RESP="$(curl …)"` 在 `bash -e` 下，curl 一非零
          # 退出这一步就死——**一次网络抖动就是一趟红**。
          # 这是这次**故意没动**的：给它加 `--retry` 就要面对下面那条敞口
          # （服务端已收下而我们超时 → 重发 = 用户收到两条），而两害相权，
          # 「红一趟、人来看一眼」比「静静发两条」轻。真要修，正解是给这条线
          # 补一个发送标记再谈重试，见下。
          # ⚠️ 已知敞口，别当成已经解决：这条线**没有任何「已发过」标记**
          # （不像 oncourt 那条有 `data/oncourt_feed_sent.json`），所以
          # 「送到了但我们判成失败」——比如服务端已收下而 curl 在 30 秒超时——
          # 之后重跑会**再发一条**。修它要给这条线补一个发送标记，那要动
          # 工作流以外的代码，这次没做。
          echo "$RESP" | jq -e '.code == 200' >/dev/null || {
            echo "::error::PushPlus 没有收下这条简报（返回体见上一行）"
            exit 1
          }

      - name: 空产摘要（跑成功但没有热点时写明原因）
        # 空产不是失败，但也不能静默：把扫到多少、聚出几个、每条退化的原因
        # 留在运行摘要里，否则诊断只存在于会过期的日志正文。
        if: success()
        run: |
          JSON="output/${{ steps.brief.outputs.date }}/brief/brief.json"
          {
            echo "## 今日简报"
            echo ""
            if [ -s "$JSON" ]; then
              jq -r '"- 新闻 " + (.news_count|tostring) + " 条 → 热点 "
                     + (.count|tostring) + " 个，深挖 " + (.deep|tostring) + " 个"' "$JSON"
              jq -r '"- 中文平台扫了 " + (.zh_scanned|tostring) + " 条"' "$JSON"
              jq -r '(.notes // [])[] | "- " + .' "$JSON"
              jq -r '(.source_status // {}) | to_entries[] |
                "- 信号源 " + .key + "：" + (.value|tostring)' "$JSON"
            else
              echo "- 连 brief.json 都没写出来，请看『生成今日简报』步骤日志。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 推送失败要出声（简报已落库，但没发出去）
        # 2026-08-13 补。位置有两个约束，都不能反：
        #   · 排在上面「空产摘要」**之后**——那一步挂 `if: success()`，
        #     这一步一 `exit 1` 它就被跳过，那份信号源诊断会跟着没。
        #     推送步骤的 continue-on-error 存在的**全部理由**就是让它先跑完
        #   · 排在下面「运行失败时告警」**之前**——那一步挂 `if: failure()`，
        #     要先有人把 job 打红，它才读得到失败状态
        if: steps.push.outcome == 'failure'
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "::error::微信推送失败：简报已经落库，但没有发出去"
          {
            echo "## ⚠️ 热点简报：内容已落库，微信没发出去"
            echo ""
            echo "- 推送步骤失败：要么没送到，要么 PushPlus 返回的 \`code\` 不是 200"
            echo "  （具体返回体在『推送简报到微信』步骤日志里）。"
            echo "- 简报已在本次提交里：\`output/${{ steps.brief.outputs.date }}/brief/\`。"
            echo "- ⚠️ 重跑会**重新发一条**：这条线没有「已发过」标记。"
            echo "  只有在确认收件人确实没收到时才重跑。"
            echo "- 运行日志：$RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: 运行失败时告警（PushPlus + 运行摘要）
        # 无人值守时，任何一步失败都主动通知，而不是只留一封 GitHub 邮件。
        if: failure()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "## ⚠️ 热点简报运行失败"
            echo ""
            echo "- news-brief 本次运行失败，今天这份简报可能缺产。"
            echo "- 运行日志：$RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PUSHPLUS_TOKEN" ]; then
            BODY="$(jq -nc --arg u "$RUN_URL" \
              '{title:"⚠️ 热点简报运行失败",
                content:("news-brief 本次运行失败，今天这份简报可能缺产。请查看：<a href=\"" + $u + "\">运行日志</a>"),
                template:"html"}')"
            curl -s -m 20 -X POST https://www.pushplus.plus/send \
              -H "Content-Type: application/json" \
              -d "$(jq -nc --argjson b "$BODY" --arg t "$PUSHPLUS_TOKEN" '$b + {token:$t}')" \
              || true
          fi
