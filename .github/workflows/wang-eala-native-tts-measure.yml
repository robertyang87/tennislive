name: wang-eala-native-tts-measure
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: [.github/workflows/wang-eala-native-tts-measure.yml]
permissions:
  contents: read
jobs:
  measure:
    if: github.head_ref == 'codex/wang-xiyu-eala-asiad-20261002'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: src
      - name: Install native speech dependencies
        run: |
          python3 -m pip install edge-tts requests
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Measure actual native narration
        env:
          PYTHONPATH: src
        run: |
          python3 - <<'PYCODE'
          import json,pathlib,subprocess,sys
          from tennislive.video.tts import tts_one
          out=pathlib.Path('tts-measure');out.mkdir(exist_ok=True)
          items=json.loads('[{"index": 1, "text": "两小时三十四分，这张决赛门票，拿得一点也不轻松。", "name": "voice_01.mp3"}, {"index": 2, "text": "北京时间十月一日下午，爱知名古屋亚运会女单半决赛，王曦雨对伊埃拉。", "name": "voice_02.mp3"}, {"index": 3, "text": "开局，王曦雨连丢五局，零比五。离丢掉第一盘，只差一局。", "name": "voice_03.mp3"}, {"index": 4, "text": "发球先把伊埃拉带开。下一拍，王曦雨向正手位移动，把球再送回去。", "name": "voice_04.mp3"}, {"index": 5, "text": "她追回了三局，却还是以三比六丢掉首盘。反击开始了，比赛还得继续追。", "name": "voice_05.mp3"}, {"index": 6, "text": "第二盘一比一后，王曦雨连拿四局，五比一。伊埃拉又追两局，她守住最后一局，六比三，把比赛拉回同一起点。", "name": "voice_06.mp3"}, {"index": 7, "text": "全场，王曦雨二发小分三十四个拿下二十一个，得分率百分之六十二。伊埃拉是百分之二十九。", "name": "voice_07.mp3"}, {"index": 8, "text": "决胜盘一比一后，她连赢三局，四比一。伊埃拉回破追到四比二，她又立刻破了回来。", "name": "voice_08.mp3"}, {"index": 9, "text": "决胜盘，四个破发点，她兑现了三个。五比二后的发球局，又连拿四分。最后这一分，稳稳收住。", "name": "voice_09.mp3"}, {"index": 10, "text": "发球后站稳，双手反手接上下一拍。", "name": "voice_10.mp3"}, {"index": 12, "text": "这场胜利，让王曦雨和张帅会师女单决赛，中国队提前锁定金银牌。", "name": "voice_12.mp3"}, {"index": 13, "text": "王曦雨这场逆转，哪一分最让你想再看一遍？", "name": "voice_13.mp3"}, {"index": "outro", "text": "关注网球时差，时差归我，好球归你。", "name": "voice_outro.mp3"}]')
          rows=[]
          for row in items:
           p=out/row['name'];marks=tts_one(row['text'],p,'zh-CN-YunjianNeural','+0%')
           seconds=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(p)],text=True))
           rows.append({**row,'seconds':seconds,'marks':marks})
           print(row['index'],seconds,row['text'],flush=True)
          (out/'measured.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: wang-eala-native-tts
          path: tts-measure/
