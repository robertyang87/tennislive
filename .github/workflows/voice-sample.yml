name: voice-sample

# Reads one paragraph in every candidate voice and commits the clips, because
# "does this sound mechanical" cannot be answered from a parameter and the
# sandbox cannot reach the TTS service. Small files, deliberately in-repo so
# they can be listened to without hunting through artifacts.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "sample=合成各音色样本；ssml=只探这条免费通道认哪些 SSML（不写产物）"
        type: choice
        options: [sample, ssml, azure, compare, phoneme, hd, oss, minimax]
        default: sample

permissions:
  contents: write

concurrency:
  group: voice-sample
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    # oss 模式要装 CPU torch + 拉 2GB 模型 + CPU 合成，30 分钟起步；
    # 其余模式仍在 12 分钟内跑完，超时只是上限不是目标
    #
    # ⚠️ **2026-08-19：这两步自己声明的最坏预算已经有 47 分钟**（装依赖 12 ＋
    # 试 CosyVoice2 35），比原来这行的 40 分钟还多——装依赖那步的预算是同一天
    # 从 7 分钟提到 12 分钟的（见 `tools/ci_apt_install.sh`），提完没人回头
    # 检查外层这道 job 级的壳还装不装得下（`ci.yml` 当天真撞过同一个缺口，
    # 见那边的注释）。65 分钟＝47（两步最坏情况）＋18（checkout/pip 的余量，
    # 这个 job 大头本来就在 CosyVoice2 那 35 分钟里，其余步骤都很轻）。
    # 判据在 `test_job级超时要兜得住各步骤自己声明的最坏预算之和`。
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          # **别把整个 output/ 拉下来**（1.36 GB）。产物目录是固定的 `output/voice-samples`，
          # 所以直接列进稀疏范围，不用另算日期再 add。
          sparse-checkout: |
            assets
            data
            docs
            specs
            src
            tests
            tools
            output/voice-samples

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ⚠️ apt 镜像会抽风且不是偶发（2026-08-04/18/19 多次撞上 `apt-get
      # update`/`install` 连着两次吃满 150 秒、零字节进度）——调重试参数治不了根，
      # 真正的杠杆是大多数 run 根本不碰这个镜像。`tools/ci_apt_install.sh`
      # 把索引和下载缓存住，先试零网络的本地安装，缓存没命中才回退到老路。
      - name: 缓存 apt 包（ffmpeg，绕开镜像抽风）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          key: apt-pkgs-${{ runner.os }}-24.04-voice-sample-v1
      - name: 安装 edge-tts + ffmpeg
        timeout-minutes: 12
        run: |
          pip install -q edge-tts
          # Azure 那条路要 SDK 才拿得到词边界（REST 接口不给）——而字幕整条线
          # 就建立在词边界上。只在 mode=azure 时用得到，装着不碍别的模式。
          pip install -q azure-cognitiveservices-speech
          source tools/ci_apt_install.sh
          apt_install_cached ffmpeg

      # 探一遍免费端点认哪些 SSML（break / express-as / prosody）。报告直接
      # print 进日志——这台沙箱下不了 artifact，写文件等于白跑。
      - name: 探 SSML 支持范围
        if: github.event.inputs.mode == 'ssml'
        run: python tools/probe_tts_ssml.py

      # F0 免费层到底给不给情绪风格和 <break>，只能量。要两个 secret；
      # 没配就自己报出来并退出，不装作探过。
      - name: 探 Azure 的风格和停顿
        if: github.event.inputs.mode == 'azure'
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: python tools/probe_azure_tts.py

      # 多音字唯一能自动查的那条路：viseme 事件里有没有音素、<phoneme> 能不能
      # 把读音钉死。词边界只给字符串，「一发」读 fā 还是 fà 在 text 字段里
      # 长得一模一样——又一个「不吭声」。
      - name: 探 Azure 的音素（多音字）
        if: github.event.inputs.mode == 'phoneme'
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: python tools/probe_azure_phoneme.py

      # 同一段真旁白两版并排——**判据是打开听**，时长表证明不了情绪。
      - name: 两版并排（edge vs Azure）
        if: github.event.inputs.mode == 'compare'
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: python tools/compare_tts.py output/voice-samples

      # DragonHD 高自然度声线试音（抖音七批诊断 7/7 点名配音机器感之后）。
      # 判据除了听，还有**词边界个数**——HD 声不给 WordBoundary 的话字幕会漂，
      # 探针会把这一项和失败原因逐声打进日志。
      - name: 试 DragonHD 声线
        if: github.event.inputs.mode == 'hd'
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: python tools/probe_azure_hd.py output/voice-samples/hd

      # 开源拟真 TTS（CosyVoice2-0.5B，Apache-2.0 可商用）试音——账号所有者
      # 2026-08-09 拍板的方向。装依赖和拉模型都在这一步，选型和判据见
      # tools/probe_oss_tts.py 的 docstring。⚠️ 依赖是从官方 requirements
      # 挑的 CPU 最小集，第一趟跑红了按报错补，别整包照抄（GPU 依赖装不上）。
      - name: 试开源拟真 TTS（CosyVoice2）
        if: github.event.inputs.mode == 'oss'
        timeout-minutes: 35
        env:
          COSYVOICE_DIR: /tmp/CosyVoice
          COSY_MODEL_DIR: /tmp/cosy-model
        run: |
          set -e
          echo "== 拉代码（含 Matcha-TTS 子模块）=="
          git clone -q --depth 1 --recursive \
            https://github.com/FunAudioLLM/CosyVoice.git "$COSYVOICE_DIR"
          echo "== 装 CPU torch（钉 <2.9）=="
          # ⚠️ torchaudio 2.9 把内置文件 I/O 后端删了（torchaudio.load 一律
          # 转发 torchcodec，连 backend='soundfile' 都无视）——而 CosyVoice 的
          # load_wav 正是这么写的。钉在 2.8 系，upstream 代码原样能跑，
          # 不用引入 torchcodec 这个新依赖（第 4、5 趟都是死在这一类上）
          pip install -q "torch<2.9" "torchaudio<2.9" --index-url https://download.pytorch.org/whl/cpu
          echo "== 按官方 requirements 装（滤掉 GPU 行）=="
          # ⚠️ 手挑依赖集是打地鼠（第一趟缺 rich、第二趟缺 matplotlib，
          # 都死在 flow_matching 的 import）。正解是抄官方清单、只滤掉
          # CPU 上装不动/不需要的：deepspeed（要编译）、tensorrt、
          # onnxruntime-gpu（用 CPU 版顶上）、torch 系（上面已装 CPU 版，
          # 别让它重装 GPU 版）、triton、以及 --extra-index-url 那些行
          # openai-whisper 的老 setup.py 要 pkg_resources，而构建隔离环境装的
          # 新 setuptools（>=82）把它删了——降级 setuptools 后关掉隔离单独装，
          # 并从批量清单里滤掉
          grep -vE "^(--|#)|deepspeed|tensorrt|onnxruntime|torch|triton|openai-whisper" \
            "$COSYVOICE_DIR/requirements.txt" > /tmp/cosy-req.txt
          pip install -q "setuptools<81" wheel
          pip install -q --no-build-isolation openai-whisper
          pip install -q onnxruntime
          pip install -q -r /tmp/cosy-req.txt
          echo "== 拉模型（约 2GB）=="
          python -c "from huggingface_hub import snapshot_download; \
            snapshot_download('FunAudioLLM/CosyVoice2-0.5B', local_dir='$COSY_MODEL_DIR')"
          echo "== 合成样品 =="
          python tools/probe_oss_tts.py output/voice-samples/oss

      # MiniMax 托管 TTS 试音（key 见 tools/probe_minimax_tts.py 的 docstring；
      # 沙箱 2026-08-09 已直连跑通过，这条是给 runner 复跑用的入口）
      - name: 试 MiniMax 托管 TTS
        if: github.event.inputs.mode == 'minimax'
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: python tools/probe_minimax_tts.py output/voice-samples/minimax

      - name: 合成语音样本
        if: github.event.inputs.mode == 'sample'
        run: python tools/voice_sample.py output/voice-samples

      - name: 提交样本到仓库
        if: github.event.inputs.mode == 'sample' || github.event.inputs.mode == 'compare' || github.event.inputs.mode == 'hd' || github.event.inputs.mode == 'oss' || github.event.inputs.mode == 'minimax'
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add output/voice-samples
          if git diff --cached --quiet; then
            echo "样本没有变化"
            exit 0
          fi
          python tools/check_staged_file_sizes.py
          git commit -m "chore: 语音样本（供试听选嗓）"
          for attempt in 1 2 3 4 5; do
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            git fetch origin "${{ github.ref_name }}"
            git branch -f rendered HEAD
            git reset --hard "origin/${{ github.ref_name }}"
            git checkout rendered -- output/voice-samples
            git add output/voice-samples
            python tools/check_staged_file_sizes.py
            git diff --cached --quiet || git commit -m "chore: 语音样本（供试听选嗓）"
            sleep $((attempt * 4))
          done
          echo "::error::推送样本失败"
          exit 1
