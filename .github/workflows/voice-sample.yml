name: voice-sample

# Reads one paragraph in every candidate voice and commits the clips, because
# "does this sound mechanical" cannot be answered from a parameter and the
# sandbox cannot reach the TTS service. Small files, deliberately in-repo so
# they can be listened to without hunting through artifacts.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voice-sample
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # **别把整个 output/ 拉下来**（1.36 GB）。产物目录是固定的 `output/voice-samples`，
          # 所以直接列进稀疏范围，不用另算日期再 add。
          sparse-checkout: |
            assets
            data
            docs
            specs
            src
            tests
            tools
            output/voice-samples

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装 edge-tts + ffmpeg
        timeout-minutes: 6
        run: |
          pip install -q edge-tts
          # ⚠️ apt 镜像会抽风，而且不是偶发：2026-08-04 两小时内两次——
          # 一次静静烧了 **13 分 42 秒**（那时没有闸），一次被 `timeout-minutes: 6`
          # 掐掉（run 30878555571），而正常只要 **18~53 秒**。
          # 硬超时只把「静静烧半小时」换成「6 分钟红掉、要人重跑」——**方向对了但停在
          # 一半**：卡住的正确处置是换一次重试，不是整趟失败。重跑那趟 34 秒就过了。
          # 3 × (100s + 10s) = 5.5 分，仍在步骤的 6 分钟超时以内，闸还在。
          apt_retry() {
            for i in 1 2 3; do
              sudo timeout 100 "$@" && return 0
              echo "::warning::apt 第 $i 次没跑完（卡住或失败）：$*"
              sleep 10
            done
            echo "::error::apt 三次都没成功：$*"
            return 1
          }
          apt_retry apt-get update -qq
          apt_retry apt-get install -y -qq ffmpeg

      - name: 合成语音样本
        run: python tools/voice_sample.py output/voice-samples

      - name: 提交样本到仓库
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add output/voice-samples
          if git diff --cached --quiet; then
            echo "样本没有变化"
            exit 0
          fi
          python tools/check_staged_file_sizes.py
          git commit -m "chore: 语音样本（供试听选嗓）"
          for attempt in 1 2 3 4 5; do
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            git fetch origin "${{ github.ref_name }}"
            git branch -f rendered HEAD
            git reset --hard "origin/${{ github.ref_name }}"
            git checkout rendered -- output/voice-samples
            git add output/voice-samples
            python tools/check_staged_file_sizes.py
            git diff --cached --quiet || git commit -m "chore: 语音样本（供试听选嗓）"
            sleep $((attempt * 4))
          done
          echo "::error::推送样本失败"
          exit 1
