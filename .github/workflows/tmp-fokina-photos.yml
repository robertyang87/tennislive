name: tmp-fokina-photos
# 临时：fokina-story-2026 在 runner 上取 ATP Media 官方实拍（沙箱被代理挡）。只在本分支 push 触发，合并前删除。
on:
  push:
    branches: [claude/fokina-story-2026]
    paths: [research/fokina-story-2026/fetch_photos.py, .github/workflows/tmp-fokina-photos.yml]
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/fokina-story-2026
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow
      - run: python3 research/fokina-story-2026/fetch_photos.py
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add research/fokina-story-2026/photos && git commit -q -m "tmp: fokina 官方实拍候选 [skip ci]" && git push origin HEAD:claude/fokina-story-2026
