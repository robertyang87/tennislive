name: noskova-final-review-export
on:
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Export actual renderer MP3 and marks without production publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir review
          gh run download 37438489355 -n reel-noskova-alexandrova-2590 -D review
          find review -type f -name 'voice*' -print
          tar -czf noskova-actual-renderer-audio.tar.gz -C review .
          sha256sum noskova-actual-renderer-audio.tar.gz > SHA256SUMS
          gh release view audio-renderer-noskova-alexandrova || gh release create audio-renderer-noskova-alexandrova --target "$GITHUB_SHA" --prerelease --title "Actual renderer audio QC evidence" --notes "Actual failed-render preserved audio and metadata, no production publication."
          gh release upload audio-renderer-noskova-alexandrova noskova-actual-renderer-audio.tar.gz SHA256SUMS --clobber
