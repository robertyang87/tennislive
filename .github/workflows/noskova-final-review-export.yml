# Branch-only evidence collection. Do not merge this temporary override into main.
name: native-asr-zverev-large-crosscheck-20261001
run-name: "native-asr-zverev-large-crosscheck-20261001 · six windows · evidence-only"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-asr-zverev-large-crosscheck-20261001
  cancel-in-progress: false
jobs:
  asr-evidence:
    if: github.ref == 'refs/heads/preview/native-asr-zverev-crosscheck-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ORT_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      INPUT_PLAN_SHA: "813c367f87d7aec87fe0bbe54995b7ed39c21ad53d29f6ee37297e75597a2217"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/review_zverev_large_crosscheck.py
            assets/asr-review-20261001/zverev-large-crosscheck.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the exact six-window plan
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "preview/native-asr-zverev-crosscheck-20261001" ]] || exit 1
          python tools/review_zverev_large_crosscheck.py --mode inputs --plan-sha256 "$INPUT_PLAN_SHA"
      - name: Install ffmpeg when absent using the ordinary apt route
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 -o Acquire::Retries=0 update -qq
            sudo apt-get -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 -o Acquire::Retries=0 install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          ffmpeg -version
      - name: Verify the fixed public Release source and extract six exact cuts
        run: |
          python tools/review_zverev_large_crosscheck.py --mode acquire --plan-sha256 "$INPUT_PLAN_SHA" --workdir "$RUNNER_TEMP/zverev-large-crosscheck-work" --outdir "$RUNNER_TEMP/zverev-large-crosscheck-evidence"
      - name: Install fixed inference dependencies
        run: |
          python -m pip install --disable-pip-version-check --retries 0 --timeout 30 faster-whisper==1.2.1 ctranslate2==4.8.2 onnxruntime==1.30.0 numpy==2.5.3 huggingface-hub==1.33.0 tokenizers==0.23.2 av==19.0.0
      - name: Fetch and hash-verify the fixed official large-v3 model
        run: |
          python tools/review_zverev_large_crosscheck.py --mode download-model --plan-sha256 "$INPUT_PLAN_SHA" --workdir "$RUNNER_TEMP/zverev-large-crosscheck-work" --outdir "$RUNNER_TEMP/zverev-large-crosscheck-evidence"
      - name: Infer six windows sequentially in English on CPU
        run: |
          python tools/review_zverev_large_crosscheck.py --mode infer --plan-sha256 "$INPUT_PLAN_SHA" --workdir "$RUNNER_TEMP/zverev-large-crosscheck-work" --outdir "$RUNNER_TEMP/zverev-large-crosscheck-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zverev-large-crosscheck-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/zverev-large-crosscheck-evidence/sources.json
            ${{ runner.temp }}/zverev-large-crosscheck-evidence/runtime-inputs.json
            ${{ runner.temp }}/zverev-large-crosscheck-evidence/crosscheck-01-zverev-norrie-beijing-2026-r1.json
            ${{ runner.temp }}/zverev-large-crosscheck-evidence/crosscheck-02-zverev-norrie-beijing-2026-r1.json
            ${{ runner.temp }}/zverev-large-crosscheck-evidence/crosscheck-03-zverev-norrie-beijing-2026-r1.json
            ${{ runner.temp }}/zverev-large-crosscheck-evidence/crosscheck-04-zverev-norrie-beijing-2026-r1.json
            ${{ runner.temp }}/zverev-large-crosscheck-evidence/crosscheck-05-zverev-norrie-beijing-2026-r1.json
            ${{ runner.temp }}/zverev-large-crosscheck-evidence/crosscheck-06-zverev-norrie-beijing-2026-r1.json
            ${{ runner.temp }}/zverev-large-crosscheck-evidence/batch.json
          if-no-files-found: warn
          retention-days: 7
