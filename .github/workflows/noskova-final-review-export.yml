name: noskova-final-review-export
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    if: github.ref == 'refs/heads/codex/zheng-kalinskaya-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/ci_apt_install.sh
            /shared/ci/apt.sh
      - name: Ensure ffmpeg and ffprobe
        run: |
          source tools/ci_apt_install.sh
          ensure_ffmpeg
      - uses: actions/cache/restore@v4
        id: original
        with:
          path: ~/.cache/tennislive-sources
          key: reel-src-zheng-kalinskaya-source-1-e86153a33638afb5
          fail-on-cache-miss: true
      - name: Export exact original bytes, hashes and source metadata
        env:
          CACHE_HIT: ${{ steps.original.outputs.cache-hit }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPORT_RUN_ID: ${{ github.run_id }}
          EXPORT_HEAD: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          assert os.environ['CACHE_HIT']=='true'
          source=Path.home()/'.cache/tennislive-sources/623d99844d676d9d.mp4'
          assert source.is_file()
          probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(source)],text=True))
          video=next(s for s in probe['streams'] if s.get('codec_type')=='video')
          assert (video['width'],video['height'])==(1920,1080)
          assert video['avg_frame_rate']=='30/1'
          assert abs(float(probe['format']['duration'])-1652.494512)<.1
          h=hashlib.sha256()
          with source.open('rb') as f:
              for chunk in iter(lambda:f.read(1024*1024),b''):h.update(chunk)
          metadata=Path('review-metadata');metadata.mkdir()
          tag='source-zheng-kalinskaya-iFpkI2x5gWs-20261003'
          filename='iFpkI2x5gWs-original-1080p.mp4'
          exported=Path(filename);exported.hardlink_to(source)
          release_url=f'https://github.com/{os.environ["GH_REPO"]}/releases/download/{tag}/{filename}'
          manifest={'schema':'exact-original-source-export-v1','canonical_source_url':'https://www.youtube.com/watch?v=iFpkI2x5gWs','source_cache_key':'reel-src-zheng-kalinskaya-source-1-e86153a33638afb5','source_cache_filename':source.name,'native_probe_run_id':37149326550,'export_run_id':os.environ['EXPORT_RUN_ID'],'export_head':os.environ['EXPORT_HEAD'],'bytes':source.stat().st_size,'sha256':h.hexdigest(),'width':1920,'height':1080,'avg_frame_rate':'30/1','duration_seconds':float(probe['format']['duration']),'release_url':release_url,'is_original_bytes':True,'method':'actual complete native-cache file read, hardlinked and uploaded without transcode; original full SHA verified again locally after release download'}
          (metadata/'source-original-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          (metadata/'source-original-ffprobe.json').write_text(json.dumps(probe,indent=2)+'\n')
          if subprocess.run(['gh','release','view',tag],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode:
              subprocess.run(['gh','release','create',tag,'--title','Zheng Kalinskaya source evidence 2026-10-03','--notes','Exact original source bytes retained for source review; not a finished episode.','--target',os.environ['EXPORT_HEAD']],check=True)
          subprocess.run(['gh','release','upload',tag,str(exported),'--clobber'],check=True)
          print(json.dumps(manifest))
          PY
      - name: Save original in production slug cache
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/tennislive-sources
          key: reel-src-zheng-kalinskaya-beijing-2026-r2-e86153a33638afb5
      - uses: actions/upload-artifact@v4
        with:
          name: zheng-kalinskaya-source1-original-metadata
          path: review-metadata/
          if-no-files-found: error
          retention-days: 5
