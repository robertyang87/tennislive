# Branch-only evidence collection. Do not merge this temporary override into main.
name: native-asr-ttv-large-crosscheck-20261001
run-name: "native-asr-ttv-large-crosscheck-20261001 · ten windows · evidence-only"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-asr-ttv-large-crosscheck-20261001
  cancel-in-progress: false
jobs:
  asr-evidence:
    if: github.ref == 'refs/heads/preview/native-asr-ttv-large-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ORT_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      INPUT_PLAN_SHA: "85257996ebafbefad5c7a5ff9887fa616c321e105f59251b58f1614811d28c13"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/review_ttv_large_crosscheck.py
            assets/asr-review-20261001/ttv-retained-windows-v3.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the exact ten-window plan
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "preview/native-asr-ttv-large-20261001" ]] || exit 1
          python tools/review_ttv_large_crosscheck.py --mode inputs --plan-sha256 "$INPUT_PLAN_SHA"
      - name: Install ffmpeg when absent using the ordinary apt route
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 -o Acquire::Retries=0 update -qq
            sudo apt-get -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 -o Acquire::Retries=0 install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          ffmpeg -version
      - name: Verify the two fixed public Release sources and extract ten exact cuts
        run: |
          python tools/review_ttv_large_crosscheck.py --mode acquire --plan-sha256 "$INPUT_PLAN_SHA" --workdir "$RUNNER_TEMP/ttv-large-crosscheck-work" --outdir "$RUNNER_TEMP/ttv-large-crosscheck-evidence"
      - name: Install fixed inference dependencies
        run: |
          python -m pip install --disable-pip-version-check --retries 0 --timeout 30 faster-whisper==1.2.1 ctranslate2==4.8.2 onnxruntime==1.30.0 numpy==2.5.3 huggingface-hub==1.33.0 tokenizers==0.23.2 av==19.0.0
      - name: Fetch and hash-verify the fixed official large-v3 model
        run: |
          python tools/review_ttv_large_crosscheck.py --mode download-model --plan-sha256 "$INPUT_PLAN_SHA" --workdir "$RUNNER_TEMP/ttv-large-crosscheck-work" --outdir "$RUNNER_TEMP/ttv-large-crosscheck-evidence"
      - name: Infer ten windows sequentially in English on CPU
        run: |
          python tools/review_ttv_large_crosscheck.py --mode infer --plan-sha256 "$INPUT_PLAN_SHA" --workdir "$RUNNER_TEMP/ttv-large-crosscheck-work" --outdir "$RUNNER_TEMP/ttv-large-crosscheck-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ttv-large-crosscheck-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ttv-large-crosscheck-evidence/sources.json
            ${{ runner.temp }}/ttv-large-crosscheck-evidence/runtime-inputs.json
            ${{ runner.temp }}/ttv-large-crosscheck-evidence/clip-01-nishikori-tiafoe-tokyo-2026-r1.json
            ${{ runner.temp }}/ttv-large-crosscheck-evidence/clip-02-nishikori-tiafoe-tokyo-2026-r1.json
            ${{ runner.temp }}/ttv-large-crosscheck-evidence/clip-03-nishikori-tiafoe-tokyo-2026-r1.json
            ${{ runner.temp }}/ttv-large-crosscheck-evidence/clip-04-nishikori-tiafoe-tokyo-2026-r1.json
            ${{ runner.temp }}/ttv-large-crosscheck-evidence/clip-05-nishikori-tiafoe-tokyo-2026-r1.json
            ${{ runner.temp }}/ttv-large-crosscheck-evidence/clip-06-shang-baez-beijing-2026-r1.json
            ${{ runner.temp }}/ttv-large-crosscheck-evidence/clip-07-shang-baez-beijing-2026-r1.json
            ${{ runner.temp }}/ttv-large-crosscheck-evidence/clip-08-shang-baez-beijing-2026-r1.json
            ${{ runner.temp }}/ttv-large-crosscheck-evidence/clip-09-shang-baez-beijing-2026-r1.json
            ${{ runner.temp }}/ttv-large-crosscheck-evidence/clip-10-shang-baez-beijing-2026-r1.json
            ${{ runner.temp }}/ttv-large-crosscheck-evidence/batch.json
          if-no-files-found: warn
          retention-days: 7
