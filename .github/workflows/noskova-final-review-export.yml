name: noskova-final-review-export
on:
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            tools
            pyproject.toml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -e '.[polyphone]'
      - run: |
          source tools/ci_apt_install.sh
          ensure_ffmpeg
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/tennislive-tts
          key: reel-tts-noskova-alexandrova-37435523117
          fail-on-cache-miss: false
      - name: Export only audio QC artifact, never production
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir review
          mkdir prior
          gh release download audio-review-noskova-alexandrova --pattern '*.tar.gz' --dir prior
          tar -xzf prior/noskova-audio-review.tar.gz -C review
          echo '' | base64 -d > targeted.py
          python targeted.py
          tar --exclude=asr-models --exclude=models -czf noskova-audio-review.tar.gz -C review .
          sha256sum noskova-audio-review.tar.gz > SHA256SUMS
          gh release view audio-review-noskova-alexandrova || gh release create audio-review-noskova-alexandrova --target "$GITHUB_SHA" --prerelease --title "Read-only Noskova audio QC" --notes "Actual TTS audio and acoustic QC evidence only. No production publication."
          gh release upload audio-review-noskova-alexandrova noskova-audio-review.tar.gz SHA256SUMS --clobber
