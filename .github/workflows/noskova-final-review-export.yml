name: native-asr-retained-window-review-v2
run-name: "native-asr-retained-window-review-v2 · ATP 2026-10-01 · evidence-only"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-asr-retained-window-review-v2
  cancel-in-progress: false
jobs:
  asr-evidence:
    if: github.ref == 'refs/heads/preview/native-asr-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ORT_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
      INPUT_PLAN_SHA: "0a15b7026b90d0ef2c2e816ff18b629144a8b71365db23cbaf8f360218d4db41"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            src
            tools/review_atp_retained_windows_v2.py
            assets/asr-review-20261001/retained-source-windows-v2.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the native ffmpeg dependency when absent
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          ffmpeg -version
      - name: Validate the fixed fifteen-window plan
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "preview/native-asr-20261001" ]] || exit 1
          command -v ffmpeg >/dev/null
          python tools/review_atp_retained_windows_v2.py --mode inputs --plan-sha256 "$INPUT_PLAN_SHA"
      - name: Install public-source reader dependencies
        run: python -m pip install --disable-pip-version-check --retries 0 --timeout 30 requests==2.32.5 yt-dlp==2026.7.4
      - name: Verify public sources and extract only the fixed windows
        run: |
          python tools/review_atp_retained_windows_v2.py --mode acquire --plan-sha256 "$INPUT_PLAN_SHA" --workdir "$RUNNER_TEMP/atp-retained-review-v2" --outdir "$RUNNER_TEMP/atp-retained-asr-v2"
      - name: Install fixed inference dependencies
        run: |
          python -m pip install --disable-pip-version-check --retries 0 --timeout 30 faster-whisper==1.2.1 ctranslate2==4.8.2 onnxruntime==1.30.0 numpy==2.5.3 huggingface-hub==1.33.0 tokenizers==0.23.2 av==19.0.0
      - name: Fetch and hash-verify one official model
        run: |
          python tools/review_atp_retained_windows_v2.py --mode download-model --plan-sha256 "$INPUT_PLAN_SHA" --workdir "$RUNNER_TEMP/atp-retained-review-v2" --outdir "$RUNNER_TEMP/atp-retained-asr-v2"
      - name: Infer fifteen windows sequentially
        run: |
          python tools/review_atp_retained_windows_v2.py --mode infer --plan-sha256 "$INPUT_PLAN_SHA" --workdir "$RUNNER_TEMP/atp-retained-review-v2" --outdir "$RUNNER_TEMP/atp-retained-asr-v2"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atp-retained-window-asr-v2-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/atp-retained-asr-v2/sources.json
            ${{ runner.temp }}/atp-retained-asr-v2/runtime-inputs.json
            ${{ runner.temp }}/atp-retained-asr-v2/clip-*.json
            ${{ runner.temp }}/atp-retained-asr-v2/batch.json
          if-no-files-found: warn
          retention-days: 7
