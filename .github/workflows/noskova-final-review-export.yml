name: noskova-final-review-export
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    if: github.ref == 'refs/heads/codex/sun-bucsa-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve public official Day4 metadata only
        timeout-minutes: 2
        run: |
          python -m pip install --quiet yt-dlp
          mkdir -p review
          timeout 90 yt-dlp --skip-download --dump-single-json 'https://www.youtube.com/watch?v=EuPUtfm-pA0' > review/wta-day4-info.json
      - uses: actions/upload-artifact@v4
        with:
          name: sun-official-day4-metadata
          path: review/wta-day4-info.json
          if-no-files-found: error
          retention-days: 3
