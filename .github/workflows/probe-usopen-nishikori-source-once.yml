name: probe-usopen-nishikori-source-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-usopen-nishikori-source-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装探测工具
        run: pip install -q "yt-dlp[default]" requests beautifulsoup4

      - name: 解析美网官网新闻页内嵌视频
        env:
          ARTICLE: https://www.usopen.org/en_US/news/articles/2026-08-28/kei_nishikori_honored_after_playing_final_grand_slam_match_at_2026_us_open.html
        run: |
          set -o pipefail
          echo "=== yt-dlp generic probe ==="
          yt-dlp --no-warnings --skip-download --dump-single-json "$ARTICLE" \
            > /tmp/yt.json 2>/tmp/yt.err || true
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/yt.json')
          if p.is_file() and p.stat().st_size:
              try:
                  d=json.loads(p.read_text())
                  keep={k:d.get(k) for k in ('id','title','webpage_url','url','duration','height','extractor','extractor_key','formats') if k in d}
                  if isinstance(keep.get('formats'), list):
                      keep['formats']=[{k:f.get(k) for k in ('format_id','ext','height','width','url','protocol','vcodec','acodec')} for f in keep['formats'][-8:]]
                  print(json.dumps(keep,ensure_ascii=False,indent=2)[:30000])
              except Exception as e:
                  print('yt-json parse error',e)
          print(Path('/tmp/yt.err').read_text(errors='replace')[-4000:])
          PY

          echo "=== raw html parse ==="
          python - <<'PY'
          import html, json, os, re
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          url=os.environ['ARTICLE']
          r=requests.get(url,timeout=40,headers={'User-Agent':'Mozilla/5.0'})
          print('HTTP',r.status_code,'bytes',len(r.content),'final',r.url)
          text=r.text
          Path('/tmp/article.html').write_text(text,encoding='utf-8')
          needles=('nishikori','sakamoto','brightcove','videojs','video-id','video_id','mediaid','media_id','qualifying final','bc-player','account')
          lines=text.splitlines()
          for i,line in enumerate(lines):
              low=line.lower()
              if any(n in low for n in needles):
                  clean=re.sub(r'\s+',' ',html.unescape(line)).strip()
                  print(f'LINE {i+1}: {clean[:4000]}')
          soup=BeautifulSoup(text,'html.parser')
          print('=== video-ish tags ===')
          for tag in soup.find_all(['video','iframe','source','script','div','a']):
              blob=' '.join(f'{k}={v}' for k,v in tag.attrs.items())
              body=(tag.get_text(' ',strip=True) or '')[:500]
              low=(blob+' '+body).lower()
              if any(n in low for n in needles):
                  print(tag.name,blob[:2500],body[:500])
          print('=== candidate ids ===')
          ids=[]
          for m in re.finditer(r'(?<!\d)\d{13,20}(?!\d)',text):
              a=max(0,m.start()-300); b=min(len(text),m.end()+300)
              ctx=re.sub(r'\s+',' ',html.unescape(text[a:b]))
              if any(n in ctx.lower() for n in needles):
                  ids.append((m.group(),ctx))
          for vid,ctx in ids[:100]: print(vid,ctx[:1200])
          print('=== media urls ===')
          urls=sorted(set(re.findall(r'https?://[^\"\'<>\\\s]+',html.unescape(text))))
          for u in urls:
              if any(x in u.lower() for x in ('brightcove','akamai','m3u8','mp4','players.brightcove','edge.api','video')):
                  print(u[:4000])
          PY

      - name: 清理一次性工作流
        if: always()
        run: |
          git pull --rebase origin main
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git rm .github/workflows/probe-usopen-nishikori-source-once.yml
          git commit -m "ops: 清理美网视频源探测工作流"
          source tools/git_push_retry.sh
          push_with_rebase_retry main 5
