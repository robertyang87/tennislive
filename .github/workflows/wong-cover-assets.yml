name: wong-cover-assets

on:
  workflow_dispatch:
  push:
    branches:
      - agent/wong-lehecka-reel
    paths:
      - .github/workflows/wong-cover-assets.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install video and cutout dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q -e .
          pip install -q "yt-dlp[default]" bgutil-ytdlp-pot-provider "rembg[cpu]"

      - name: Start YouTube PO token provider
        id: pot
        continue-on-error: true
        run: |
          docker run --name bgutil-pot -d -p 4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider
          for i in $(seq 1 25); do
            if curl -sf http://127.0.0.1:4416/ping >/dev/null; then
              echo "up=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          echo "::warning::PO token provider did not become ready"

      - name: Load YouTube cookies
        id: cookies
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "path=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the official 1080p source
        env:
          YT_COOKIES: ${{ steps.cookies.outputs.path }}
          YT_POT_PROVIDER: ${{ steps.pot.outputs.up }}
        run: |
          python tools/build_match_reel.py probe \
            --url "https://www.youtube.com/watch?v=TQlG3YAxoBE" \
            --every 1000 \
            --outdir "$RUNNER_TEMP/wong-source"

      - name: Extract real match close-ups
        run: |
          mkdir -p assets/reel/wong-lehecka/candidates
          SOURCE="$RUNNER_TEMP/wong-source/source.mp4"
          ffmpeg -hide_banner -loglevel error -y -ss 38.7 -i "$SOURCE" \
            -vf "crop=1100:1080:410:0" -frames:v 1 -q:v 2 \
            assets/reel/wong-lehecka/candidates/lehecka-38.7.jpg
          ffmpeg -hide_banner -loglevel error -y -ss 52.5 -i "$SOURCE" \
            -vf "crop=1100:1080:410:0" -frames:v 1 -q:v 2 \
            assets/reel/wong-lehecka/candidates/lehecka-52.5.jpg
          ffmpeg -hide_banner -loglevel error -y -ss 178.8 -i "$SOURCE" \
            -vf "crop=1100:1080:410:0" -frames:v 1 -q:v 2 \
            assets/reel/wong-lehecka/candidates/wong-178.8.jpg
          ffmpeg -hide_banner -loglevel error -y -ss 180.5 -i "$SOURCE" \
            -vf "crop=1100:1080:410:0" -frames:v 1 -q:v 2 \
            assets/reel/wong-lehecka/candidates/wong-180.5.jpg
          ffmpeg -hide_banner -loglevel error -y -ss 186.2 -i "$SOURCE" \
            -vf "crop=1100:1080:410:0" -frames:v 1 -q:v 2 \
            assets/reel/wong-lehecka/candidates/wong-186.2.jpg

      - name: Remove backgrounds without changing the players
        run: |
          python - <<'PY'
          from pathlib import Path
          from rembg import new_session, remove

          root = Path("assets/reel/wong-lehecka/candidates")
          session = new_session("u2net_human_seg")
          for source in sorted(root.glob("*.jpg")):
              target = source.with_suffix(".cutout.png")
              target.write_bytes(remove(source.read_bytes(), session=session))
              print(target)
          PY

      - name: Commit candidate assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/reel/wong-lehecka/candidates
          python tools/check_staged_file_sizes.py
          git diff --cached --quiet && exit 0
          git commit -m "assets: 黄泽林莱赫奇卡本场近景抠图"
          git push origin "HEAD:${GITHUB_REF_NAME}"
