name: tmp-kartal-v2
# 临时：kartal-story-2026 第二版找历史赛点官方源片。只在本分支 push 触发，合并前删除。
on:
  push:
    branches: [claude/kartal-story-2026-v2]
    paths: [research/kartal-story-2026/queries.txt, .github/workflows/tmp-kartal-v2.yml]
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/kartal-story-2026
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "yt-dlp[default]"
      - run: |
          python3 - <<'PY'
          import json, subprocess
          for q in open('research/kartal-story-2026/queries.txt'):
              q=q.strip()
              if not q or q.startswith('#'): continue
              print('\n######', q, flush=True)
              r=subprocess.run(['yt-dlp','--flat-playlist','-J',f'ytsearch12:{q}'],capture_output=True,text=True)
              try: d=json.loads(r.stdout)
              except Exception: print('ERR',r.stderr[-300:]); continue
              for e in d.get('entries',[]):
                  print(f"{e.get('id')} | {e.get('channel')} | {e.get('duration')} | {e.get('title')}", flush=True)
          PY
