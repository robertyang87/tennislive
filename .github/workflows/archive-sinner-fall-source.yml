name: archive-sinner-fall-source
run-name: "archive-sinner-fall-source"

# 本机房 IP 被 YouTube 挡成「Sign in to confirm you're not a bot」。
# 延长集锦 CRLz1DnoDSo 已存过，里面没有第三盘 2-2 的那次滑倒。
# 这一轮只切官方全场回放 GKH_429gZsI 的 1:00:00–2:30:00，找那一滑。不提交视频。
on:
  push:
    branches: [cursor/sinner-knee-fall-v2-c395]
    paths:
      - .github/workflows/archive-sinner-fall-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ci_apt_install.sh
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 YouTube 下载器
        run: pip install -q "yt-dlp[default]" bgutil-ytdlp-pot-provider

      - name: 恢复音视频工具 apt 缓存
        id: apt_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          key: apt-pkgs-${{ runner.os }}-24.04-sinner-fall-v1-${{ github.run_id }}
          restore-keys: |
            apt-pkgs-${{ runner.os }}-24.04-sinner-fall-v1-

      - name: 安装音视频合并工具
        timeout-minutes: 15
        run: |
          source tools/ci_apt_install.sh
          ensure_ffmpeg

      - name: 回写实际下载的 apt 缓存
        if: env.APT_CACHE_DIRTY == '1' && steps.apt_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          key: ${{ steps.apt_cache.outputs.cache-primary-key }}

      - name: 启动 PO token provider
        continue-on-error: true
        run: |
          docker run --name bgutil-pot -d -p 4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider
          for attempt in $(seq 1 25); do
            if curl -sf http://127.0.0.1:4416/ping >/dev/null; then
              echo "PO token provider 已就绪"
              exit 0
            fi
            sleep 2
          done
          echo "::warning::PO token provider 50 秒内未就绪，继续尝试 cookies/client 通道"
          docker logs bgutil-pot 2>&1 | tail -20 || true

      - name: 写入 YouTube cookies（如已配置）
        id: cookies
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "path=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::未配置 YT_COOKIES_TXT，仅使用 PO token/client 通道"
          fi

      - name: 下载温网官方全场回放的第三盘窗口并上传 Release
        timeout-minutes: 35
        env:
          YT_COOKIES: ${{ steps.cookies.outputs.path }}
        run: |
          set -euo pipefail
          ARGS=(--js-runtimes node)
          if [ -n "${YT_COOKIES:-}" ]; then
            ARGS+=(--cookies "$YT_COOKIES")
          fi
          VIDEO_URL="https://www.youtube.com/watch?v=GKH_429gZsI"
          VIDEO_ID=$(yt-dlp "${ARGS[@]}" --skip-download --print id "$VIDEO_URL" | tail -1)
          TITLE=$(yt-dlp "${ARGS[@]}" --skip-download --print title "$VIDEO_URL" | tail -1)
          test "$VIDEO_ID" = "GKH_429gZsI"
          # 比赛 3 小时 30 分，视频约 3 小时 36 分。第三盘 2-2 的滑倒落在前两盘之后，
          # 先取 1:00:00–2:30:00。文件时间从这一段的开头算。
          yt-dlp "${ARGS[@]}" \
            --download-sections "*1:00:00-2:30:00" \
            --force-keyframes-at-cuts \
            -f "bv*[ext=mp4][height<=1080]+ba[ext=m4a]/b[ext=mp4]/bv*+ba/b" \
            --merge-output-format mp4 --remux-video mp4 \
            -o "$RUNNER_TEMP/$VIDEO_ID.%(ext)s" \
            "$VIDEO_URL"
          FILE="$RUNNER_TEMP/$VIDEO_ID.mp4"
          test -s "$FILE"
          TAG="source-$VIDEO_ID"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TITLE" \
              --notes "温网官方全场回放 1:00:00–2:30:00，用来找第三盘 2 平那次滑倒。来源：$VIDEO_URL 。延长集锦 CRLz1DnoDSo 没有这一刻。"
          gh release upload "$TAG" "$FILE" --clobber
          echo "saved https://github.com/${{ github.repository }}/releases/download/$TAG/$VIDEO_ID.mp4"
