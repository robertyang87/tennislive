name: tmp-andreeva-photos
on:
  push:
    branches: [andreeva-redo-2026]
    paths: [research/andreeva-finals-2026/photo_probe/probe.py, .github/workflows/tmp-andreeva-photos.yml, research/andreeva-finals-2026/photo_probe/pick.txt]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: andreeva-redo-2026, sparse-checkout: research/andreeva-finals-2026/photo_probe}
      - run: pip install -q pillow
      - run: |
          if [ -f research/andreeva-finals-2026/photo_probe/pick.txt ]; then
            while read -r id url; do [ -n "$url" ] && curl -sSL -A "Mozilla/5.0" -o "research/andreeva-finals-2026/photo_probe/pick-$id.jpg" "$url"; done < research/andreeva-finals-2026/photo_probe/pick.txt
          else
            python3 research/andreeva-finals-2026/photo_probe/probe.py research/andreeva-finals-2026/photo_probe/out
          fi
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A research/andreeva-finals-2026/photo_probe && git commit -m "tmp: andreeva photo probe" && git push origin HEAD:andreeva-redo-2026
