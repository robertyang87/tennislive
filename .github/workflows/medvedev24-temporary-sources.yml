name: Medvedev 24 titles temporary sources
run-name: Medvedev 24 titles private source acquisition
on:
  push:
    branches: [codex/medvedev24-private-source-20260930]
    paths: [.github/workflows/medvedev24-temporary-sources.yml]
permissions:
  contents: read
concurrency:
  group: medvedev24-temporary-sources
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: [{"key": "title02", "url": "https://www.youtube.com/watch?v=DbotaYXf5p0"}, {"key": "title04", "url": "https://www.youtube.com/watch?v=xGh-Vs58gx8"}, {"key": "title13", "url": "https://www.youtube.com/watch?v=MEFpXBwnyQA"}]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official downloader and verify FFmpeg
        run: |
          python -m pip install --quiet 'yt-dlp[default]'
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo timeout 240 apt-get update -qq
            sudo timeout 240 apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Acquire requested official source without publication
        env:
          SOURCE_URL: ${{ matrix.url }}
          SOURCE_KEY: ${{ matrix.key }}
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/metadata"
          COOKIE_ARGS=()
          COOKIE_PATH="$RUNNER_TEMP/medvedev24-cookies.txt"
          trap 'rm -f "$COOKIE_PATH"' EXIT
          if [ -n "$YT_COOKIES_TXT" ]; then
            umask 077
            printf '%s' "$YT_COOKIES_TXT" > "$COOKIE_PATH"
            COOKIE_ARGS=(--cookies "$COOKIE_PATH")
          fi
          python -m yt_dlp --js-runtimes node "${COOKIE_ARGS[@]}" \
            --no-playlist --socket-timeout 30 --retries 2 --fragment-retries 2 \
            -f 'bv*[height>=720][height<=1080]+ba/b[height>=720][height<=1080]' \
            -S 'vcodec:h264,acodec:m4a' --merge-output-format mp4 \
            --write-info-json -o "$RUNNER_TEMP/source/source.%(ext)s" "$SOURCE_URL"
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height,r_frame_rate:format=duration,size \
            -of json "$RUNNER_TEMP/source/source.mp4" > "$RUNNER_TEMP/source/probe.json"
          python - <<'PYMETA'
          import json,os,pathlib,hashlib
          d=pathlib.Path(os.environ['RUNNER_TEMP'])/'source'
          info=json.loads((d/'source.info.json').read_text())
          meta={k:info.get(k) for k in ['id','title','uploader','channel_id','webpage_url','upload_date','duration','width','height','fps']}
          meta['key']=os.environ['SOURCE_KEY']
          meta['sha256']=hashlib.sha256((d/'source.mp4').read_bytes()).hexdigest()
          meta['rights_status']='unknown; production research source, not a licence'
          meta['retention_days']=1
          meta['quality_exception']='User allows native720p only when no higher accessible source'
          (d/'source.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2))
          (d/'source.info.json').unlink()
          probe=json.loads((d/'probe.json').read_text())
          assert any(s.get('height',0)>=720 for s in probe['streams']), 'Native720p minimum; user approved archival fallback'
          assert any(s.get('codec_type')=='audio' for s in probe['streams']), 'Missing audio'
          PYMETA
      - name: Save authenticated temporary artifact only
        uses: actions/upload-artifact@v4
        with:
          name: medvedev24-${{ matrix.key }}
          path: |
            ${{ runner.temp }}/source/source.mp4
            ${{ runner.temp }}/source/source.json
            ${{ runner.temp }}/source/probe.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
