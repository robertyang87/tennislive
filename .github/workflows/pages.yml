name: pages

# 复制页与手机状态看板共用同一个 Pages 部署，避免两套工作流互相覆盖站点。
# output 中的视频/图片不进入 artifact；只稀疏检出 HTML 和小型状态证据。
on:
  push:
    branches: [main]
    paths:
      - "output/**/*.html"
      - "output/**/render.json"
      - "dashboard/**"
      - "tools/build_dashboard_snapshot.py"
      - "data/orchestration_state.json"
      - "data/reel-dispatch-queue/*.json"
      - "data/*_publish_ledger/*.json"
      - "specs/**/*.json"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows:
      # ⚠️ 这里认的是工作流的 `name:`，不是文件名：probe.yml 叫 probe-data-sources、
      # explainer.yml 叫 explainer-video——原来写成文件名，这两条跑完从来没触发过部署。
      # 判据 test_看板阶段表点名的工作流文件都存在_pages按名字订阅它们
      - orchestrate
      - oncourt-interviews
      - official-social-images
      - source-health
      - probe-data-sources
      - reel-dispatch-queue
      - match-reel
      - interview-auto-render
      - explainer-video
      - auto-push-reel
      - auto-push-interview
      - auto-push-explainer
      - pipeline-health
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            output/**/*.html
            output/**/render.json
            dashboard
            assets/logo/brand/favicon.png
            assets/logo/brand/icon-180.png
            tools/build_dashboard_snapshot.py
            data/orchestration_state.json
            data/reel-dispatch-queue/*.json
            data/*_publish_ledger/*.json
            specs/**/*.json
          sparse-checkout-cone-mode: false

      - name: 收齐复制页与 dashboard
        run: |
          set -o pipefail
          mkdir -p _site/dashboard
          find output -name '*.html' -print0 | while IFS= read -r -d '' f; do
            mkdir -p "_site/$(dirname "$f")"
            cp "$f" "_site/$f"
          done
          # tokens.css 是 design_tokens 的生成物；图标给 favicon / apple-touch-icon / 顶栏 lockup。
          # 判据 test_看板页面引用的本地文件pages都拷过去了
          cp dashboard/index.html dashboard/tokens.css dashboard/styles.css dashboard/app.js _site/dashboard/
          cp assets/logo/brand/favicon.png assets/logo/brand/icon-180.png _site/dashboard/
          touch _site/.nojekyll
          n=$(find _site/output -name '*.html' 2>/dev/null | wc -l)
          if [ "$n" -eq 0 ]; then
            echo "一个复制页都没收到——稀疏检出可能失效，拒绝覆盖现有站点"
            exit 1
          fi
          echo "收齐 $n 个复制页，并加入手机 dashboard"

      - name: 生成无密钥状态快照
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # 把本趟 run id 交给它：看板不把「正在部署自己」算成运行中的任务
        run: |
          python3 tools/build_dashboard_snapshot.py --root . --output _site/dashboard/snapshot.json \
            --self-run-id "$GITHUB_RUN_ID"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
