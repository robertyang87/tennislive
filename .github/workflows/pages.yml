name: pages

# 复制页与手机状态看板共用同一个 Pages 部署，避免两套工作流互相覆盖站点。
# output 中的视频/图片不进入 artifact；只稀疏检出 HTML 和小型状态证据。
on:
  push:
    branches: [main]
    paths:
      - "output/**/*.html"
      - "output/**/render.json"
      - "dashboard/**"
      - "tools/build_dashboard_snapshot.py"
      - "data/orchestration_state.json"
      - "data/reel-dispatch-queue/*.json"
      - "data/*_publish_ledger/*.json"
      - "specs/**/*.json"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows:
      - orchestrate
      - oncourt-interviews
      - official-social-images
      - source-health
      - probe
      - reel-dispatch-queue
      - match-reel
      - interview-auto-render
      - explainer
      - auto-push-reel
      - auto-push-interview
      - auto-push-explainer
      - pipeline-health
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            output/**/*.html
            output/**/render.json
            dashboard
            tools/build_dashboard_snapshot.py
            data/orchestration_state.json
            data/reel-dispatch-queue/*.json
            data/*_publish_ledger/*.json
            specs/**/*.json
          sparse-checkout-cone-mode: false

      - name: 收齐复制页与 dashboard
        run: |
          set -o pipefail
          mkdir -p _site/dashboard
          find output -name '*.html' -print0 | while IFS= read -r -d '' f; do
            mkdir -p "_site/$(dirname "$f")"
            cp "$f" "_site/$f"
          done
          cp dashboard/index.html dashboard/styles.css dashboard/app.js _site/dashboard/
          touch _site/.nojekyll
          n=$(find _site/output -name '*.html' 2>/dev/null | wc -l)
          if [ "$n" -eq 0 ]; then
            echo "一个复制页都没收到——稀疏检出可能失效，拒绝覆盖现有站点"
            exit 1
          fi
          echo "收齐 $n 个复制页，并加入手机 dashboard"

      - name: 生成无密钥状态快照
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/build_dashboard_snapshot.py --root . --output _site/dashboard/snapshot.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
