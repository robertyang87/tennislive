name: Djokovic Bu production render kickoff
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: [.github/workflows/djokovic-bu-render-kickoff.yml]
permissions:
  contents: read
  actions: write
jobs:
  launch:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/djokovic-bu-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch native render once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          existing=$(gh run list --workflow match-reel.yml --branch codex/djokovic-bu-20261003 --limit 30 --json createdAt,displayTitle --jq '[.[] | select(.createdAt >= "2026-10-03T06:38:00Z" and .displayTitle == "match-reel · render · djokovic-bu-beijing-2026-r2")] | length')
          if [ "$existing" != 0 ]; then
            echo "Native production render already dispatched"; exit 0
          fi
          gh workflow run match-reel.yml --ref codex/djokovic-bu-20261003 -f mode=render -f slug=djokovic-bu-beijing-2026-r2 -f push=false -f voice=zh-CN-YunjianNeural -f rate=+6%
