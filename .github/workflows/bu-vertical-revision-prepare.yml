name: bu-vertical-revision-prepare
# Owner verified: connected account robertyang87 id 257251572 equals repository owner.
# User confirmed GitHub upload for WeChat after public-hosting disclosure, then requested full-bleed correction.
# One scoped preparation run; no PushPlus secret or send step. Workflow deletes itself after recording artifacts.
on:
  push:
    branches: [codex/bu-cover-left-20260928]
    paths: [.github/workflows/bu-vertical-revision-prepare.yml]
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/bu-cover-left-20260928
          sparse-checkout: |
            assets
            tools
            docs/production
            output/2026-09-27/reel/safiullin-bu-hangzhou-2026-qf
            output/revisions
            .github/workflows
      - name: Fetch previously verified production inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source tools/ci_apt_install.sh
          ensure_ffmpeg
          mkdir -p hangzhou-v5-audit bu-vertical-fix output/revisions/bu-vertical-20260928
          gh release download reel-safiullin-bu-hangzhou-2026-qf --pattern safiullin-bu-hangzhou-2026-qf.mp4 --dir hangzhou-v5-audit
          echo "a07995af6f39eae5e32e2b118e465bfe73f3504ddb6ce5a1ba5ecb95b77574be  hangzhou-v5-audit/safiullin-bu-hangzhou-2026-qf.mp4" | sha256sum -c -
          gh run download 36322312524 --name safiullin-bu-source-evidence --dir safiullin-bu-evidence
          gh run download 36325902329 --name reel-safiullin-bu-hangzhou-2026-qf-2293 --dir "$RUNNER_TEMP/qc"
          QC_DIR=$(dirname "$(find "$RUNNER_TEMP/qc" -name subtitles.ass -print -quit)")
          cp -r "$QC_DIR" hangzhou-v5-qc
          ln -s . tennis-hangzhou
          mkdir -p "$HOME/.local/share/fonts/tennis"
          cp assets/fonts/NotoSansSC-*-sub.ttf "$HOME/.local/share/fonts/tennis/"
          fc-cache -f "$HOME/.local/share/fonts/tennis"
      - name: Render approved full-bleed revision
        run: |
          python - <<'PY'
          import json,base64,pathlib
          p=json.loads(pathlib.Path('docs/production/bu-cover-left-20260928.json').read_text())
          pathlib.Path('赛场之上-杭州八强赛-布云朝克特封面.jpg').write_bytes(base64.b64decode(p['cover']))
          scripts=json.loads(pathlib.Path('docs/production/bu-vertical-fix-scripts.json').read_text())
          for name,code in scripts.items(): pathlib.Path('bu-vertical-fix',name+'.py').write_text(code)
          for name in ['subtitles.ass','topbar.ass']:
              text=pathlib.Path('hangzhou-v5-qc',name).read_text().replace('Noto Sans CJK SC','Noto Sans SC')
              pathlib.Path('bu-vertical-fix',name).write_text(text)
          pathlib.Path('output/revisions/bu-vertical-20260928/spec.json').write_text(json.dumps(p['spec'],ensure_ascii=False,indent=2))
          PY
          python bu-vertical-fix/render.py
          python bu-vertical-fix/assemble.py
          cp 赛场之上-杭州八强赛-布云朝克特封面.jpg output/revisions/bu-vertical-20260928/poster.jpg
          cp hangzhou-v5-qc/stat_card.jpg output/revisions/bu-vertical-20260928/stat_card.jpg
          cp bu-vertical-fix/pan-plan.json output/revisions/bu-vertical-20260928/
      - name: Verify revised film
        run: |
          python - <<'PY'
          import subprocess,json,pathlib,os,hashlib
          d=pathlib.Path('output/revisions/bu-vertical-20260928')
          f=pathlib.Path('赛场之上-杭州八强赛-布云朝克特封面版.mp4')
          q=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_format','-show_streams','-of','json',str(f)]))
          v=next(x for x in q['streams'] if x['codec_type']=='video')
          assert (v['width'],v['height'])==(1080,1440)
          assert abs(float(q['format']['duration'])-118.88)<.05
          ah=subprocess.check_output(['ffmpeg','-v','error','-i',str(f),'-map','0:a','-c','copy','-f','hash','-hash','sha256','-']).decode().strip()
          assert ah=='SHA256=06879a20181bf20a29f31f971931c356f9e76827524c06d9ca959423ed8c7327'
          report={'status':'pass','film_sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'film_bytes':f.stat().st_size,'film_seconds':float(q['format']['duration']),'audio_hash':ah,'cover_seconds':1.2,'replaced_intervals':[[36.4,49.6],[90.6,98.72],[98.72,115.04]],'full_bleed':True,'review':'Codex manually inspected cover and measured player-aware pan paths. Audio unchanged; video first frame and three previously letterboxed sections revised.','run_id':os.environ['GITHUB_RUN_ID'],'video_url':'https://github.com/robertyang87/tennislive/releases/download/reel-safiullin-bu-vertical-20260928/safiullin-bu-hangzhou-2026-qf-vertical.mp4'}
          (d/'render.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(report,ensure_ascii=False))
          for t in [0,42,48,95,102,114]:
              subprocess.run(['ffmpeg','-v','error','-ss',str(t),'-i',str(f),'-frames:v','1','-y',str(d/f'frame-{t}.jpg')],check=True)
          f.rename('safiullin-bu-hangzhou-2026-qf-vertical.mp4')
          PY
      - name: Release revised film and commit review artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create reel-safiullin-bu-vertical-20260928 safiullin-bu-hangzhou-2026-qf-vertical.mp4 --target "${{ github.sha }}" --title "杭州八强赛：竖屏铺满修正版" --notes "User-requested Bu photograph, left-aligned factual hook and full-bleed action framing. Original audio retained."
          git config user.name Codex
          git config user.email codex@users.noreply.github.com
          git rm .github/workflows/bu-vertical-revision-prepare.yml docs/production/bu-cover-left-20260928.json
          git add --sparse output/revisions/bu-vertical-20260928
          git commit -m "reel: full-bleed Bu revision with render and QC evidence"
          source tools/git_push_retry.sh
          push_with_rebase_retry codex/bu-cover-left-20260928 5
