name: alcaraz-voice-review
run-name: "alcaraz-voice-review · bergs-alcaraz-shanghai-2026-r3"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TENNISLIVE_TTS_BACKEND: edge
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            src
            specs/reels
            data/evidence/bergs-alcaraz-shanghai-2026-r3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set native cache directory
        run: printf 'TENNISLIVE_TTS_CACHE=%s/alcaraz-native-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Restore audio tool apt cache
        id: apt_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          key: apt-pkgs-${{ runner.os }}-24.04-alcaraz-voice-v1-${{ github.run_id }}
          restore-keys: |
            apt-pkgs-${{ runner.os }}-24.04-alcaraz-voice-v1-
      - name: Install native audio measurement dependencies
        timeout-minutes: 15
        run: |
          source tools/ci_apt_install.sh
          ensure_ffmpeg
          python -m pip install -e '.[polyphone]'
      - name: Save downloaded audio tool apt packages
        if: env.APT_CACHE_DIRTY == '1' && steps.apt_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          key: ${{ steps.apt_cache.outputs.cache-primary-key }}
      - name: Prepare actual frozen nine utterances and paired ZIP evidence
        run: python tools/alcaraz_voice_review.py --stage prepare --outdir "$RUNNER_TEMP/alcaraz-voice-artifact"
      - name: Upload native speech immediately
        uses: actions/upload-artifact@v4
        with:
          name: alcaraz-native-speech-${{ github.run_id }}
          path: ${{ runner.temp }}/alcaraz-voice-artifact
          if-no-files-found: error
          retention-days: 7
      - name: Fresh full-sentence homophone controls and self-calibration
        run: python tools/alcaraz_voice_review.py --stage analyze --outdir "$RUNNER_TEMP/alcaraz-voice-artifact"
      - name: Upload complete fresh evidence including limitations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alcaraz-complete-voice-review-${{ github.run_id }}
          path: ${{ runner.temp }}/alcaraz-voice-artifact
          if-no-files-found: error
          retention-days: 7
