name: cv2-kick-render
run-name: cv2-kick-render

# 云代理的 GitHub App token 没有 actions: write，workflow_dispatch 返回 403。
# 这一份只在自己被推进 cursor/code-violation-point-penalty-2026-1adf 时跑一次：
# 用仓库 GITHUB_TOKEN 派发 match-reel 的 cookies 自检，绿了立刻派 render。
# 同时另派一趟 cookies 去试 Serena 那条源（uiBrForlj-k），失败只打日志，不拦渲染。
# 不合并、不推微信、push=false。
# 2026-10-12 重派：取景已固定 0.5；再派是因为 Edge TTS 改走还活着的主机。
on:
  push:
    branches: [cursor/code-violation-point-penalty-2026-1adf]
    paths: [".github/workflows/cv2-kick-render.yml"]

permissions:
  contents: read
  actions: write

jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: cookie 绿了立刻派 render，并单独试 Serena
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: cursor/code-violation-point-penalty-2026-1adf
        run: |
          set -euo pipefail
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run match-reel.yml --repo "$REPO" --ref "$REF" \
            -f mode=cookies \
            -f slug=code-violation-point-penalty-2026 \
            -f push=false
          gh workflow run match-reel.yml --repo "$REPO" --ref "$REF" \
            -f mode=cookies \
            -f slug=serena-uibrforljk-avail \
            -f url=https://www.youtube.com/watch?v=uiBrForlj-k \
            -f push=false
          echo "dispatched cookies + serena at $SINCE"

          find_id() {
            local title="$1"
            gh run list --repo "$REPO" --workflow match-reel.yml --branch "$REF" \
              --limit 30 \
              --json databaseId,displayTitle,createdAt \
              --jq "[.[] | select(.displayTitle == \"$title\") | select(.createdAt >= \"$SINCE\")] | sort_by(.createdAt) | last | .databaseId"
          }
          COOKIE_ID=""
          SERENA_ID=""
          for _ in $(seq 1 40); do
            [ -n "$COOKIE_ID" ] || COOKIE_ID=$(find_id "match-reel · cookies · code-violation-point-penalty-2026")
            [ -n "$SERENA_ID" ] || SERENA_ID=$(find_id "match-reel · cookies · serena-uibrforljk-avail")
            [ -n "$COOKIE_ID" ] && [ "$COOKIE_ID" != "null" ] && [ -n "$SERENA_ID" ] && [ "$SERENA_ID" != "null" ] && break
            sleep 5
          done
          echo "cookie run=$COOKIE_ID serena run=$SERENA_ID"
          [ -n "$COOKIE_ID" ] && [ "$COOKIE_ID" != "null" ] || { echo "::error::cookie 自检 run 没出现"; exit 1; }
          [ -n "$SERENA_ID" ] && [ "$SERENA_ID" != "null" ] || { echo "::error::Serena 可用性 run 没出现"; exit 1; }

          gh run watch "$SERENA_ID" --repo "$REPO" --exit-status > /tmp/serena-watch.txt 2>&1 &
          SPID=$!
          set +e
          gh run watch "$COOKIE_ID" --repo "$REPO" --exit-status > /tmp/cookie-watch.txt 2>&1
          COOKIE_RC=$?
          set -e
          echo "cookie_rc=$COOKIE_RC"
          if [ "$COOKIE_RC" != 0 ]; then
            echo "::error::cookie 自检是红的，不派 render。run $COOKIE_ID"
            gh run view "$COOKIE_ID" --repo "$REPO" --log-failed 2>/dev/null | tail -80 || true
            wait "$SPID" || true
            exit 1
          fi

          gh workflow run match-reel.yml --repo "$REPO" --ref "$REF" \
            -f mode=render \
            -f slug=code-violation-point-penalty-2026 \
            -f voice=zh-CN-YunjianNeural \
            -f rate=+6% \
            -f push=false
          echo "render dispatched"
          RENDER_ID=""
          for _ in $(seq 1 24); do
            RENDER_ID=$(find_id "match-reel · render · code-violation-point-penalty-2026")
            [ -n "$RENDER_ID" ] && [ "$RENDER_ID" != "null" ] && break
            sleep 5
          done
          echo "render run=$RENDER_ID"

          set +e
          wait "$SPID"
          SERENA_RC=$?
          set -e
          echo "serena_rc=$SERENA_RC"
          if [ "$SERENA_RC" != 0 ]; then
            echo "::error::SERENA_UNAVAILABLE uiBrForlj-k — 渲染已派发，这一段没有静默丢掉。run $SERENA_ID"
            gh run view "$SERENA_ID" --repo "$REPO" --log-failed 2>/dev/null | tail -60 || \
              gh run view "$SERENA_ID" --repo "$REPO" --log 2>/dev/null | tail -60 || true
          else
            echo "SERENA_OK uiBrForlj-k 在 runner 上下得到 3 秒媒体流"
          fi
