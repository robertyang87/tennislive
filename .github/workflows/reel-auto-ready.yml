name: reel-auto-ready

# probe 当下缺官方图/视觉证据时，草稿明确留在 pending。赛后官方图片经常晚到；
# 这条轻量班次只重试仍有机会补齐的 pending，证据全绿后提升并立即 dispatch render。
on:
  push:
    branches: [main]
    paths:
      - 'specs/reels/pending/*.draft.json'
      - 'assets/reel/*-cover.jpg'
      - '.github/workflows/reel-auto-ready.yml'
  schedule:
    - cron: "6,16,26,36,46,56 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: reel-auto-ready
  cancel-in-progress: false

jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            assets
            data
            specs
            # analyze_reel_visuals / promote 的重起草在调用时要读生产 skill
            # 拼 prompt；漏了它，失败要等第一条真 pending 草稿才炸（2026-08-27）
            skills
            src
            tools

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装生产闸依赖
        run: pip install -q -e .

      - name: 重试 pending 的官方封面、视觉证据和正式提升
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          : > /tmp/reel-ready
          shopt -s nullglob
          for DRAFT in specs/reels/pending/*.draft.json; do
            SLUG=$(jq -r '.slug' "$DRAFT")
            KIND=$(jq -r '._production.kind // ""' "$DRAFT")
            if [ "$KIND" != "orchestrated_reel" ]; then
              echo "[skip] $SLUG 不是 orchestrate 自动草稿，不接管历史/人工 pending"
              continue
            fi
            RECEIVED=$(jq -r '._production.received_at // ""' "$DRAFT")
            if ! python - "$RECEIVED" <<'PY'
          import sys
          from datetime import datetime, timezone

          # 新鲜窗只有一份出处：promote_reel_draft.PENDING_MAX_AGE（和调度侧
          # orchestrate.FRESH_RESULT_HOURS 由测试钉成同一个数）。原来这儿手抄
          # 了一个 20——三处各写一遍，改一处漏两处的样子是「这一班放过、下一步
          # 拦下」，不报错。
          sys.path.insert(0, "tools")
          from promote_reel_draft import PENDING_MAX_AGE

          try:
              stamp = datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))
              assert stamp.tzinfo is not None
          except (AssertionError, ValueError):
              raise SystemExit(1)
          raise SystemExit(datetime.now(timezone.utc) - stamp > PENDING_MAX_AGE)
          PY
            then
              echo "[expired] $SLUG 已超过 PENDING_MAX_AGE 或缺 received_at，不再追旧比赛"
              continue
            fi
            # probe 那一趟 flashscore 读失败（5xx／超时）的块记在 `_feed_retry`：编排器认得
            # 这份草稿、永不重 probe，所以在这儿**只重跑那几块**——不 probe、不下源片、
            # 不碰模型，最多 FEED_RETRY_MAX 次；试满了打 warning、写 run 摘要，
            # pipeline_health 另外点名。排在补封面／视觉证据之前：补上的赛果这一班就能转正
            # （赛果变了，probe 那一趟的视觉结论它自己作废，下面那道重审条件会接上）。
            # - 已经停手（exhausted_at：试满／崩了）的不进这一步——pipeline_health 在点名，
            #   不必每一班再刷一遍 warning
            # - 墙钟上限：flashscore 挂住不回时一趟能拖 2~6 分钟，整个 job 才 15 分钟；被掐掉
            #   （124）另起一次 --timed-out 补记这一趟（tries＋1），不然落库那步不跑、tries 不涨、
            #   每一班重演，连别的草稿的转正和 render 派发一起挡住
            # 判据 tests/test_feed_retry.py。
            if [ "$(jq -r '(._feed_retry.blocks // []) | length' "$DRAFT")" != "0" ] \
              && [ -z "$(jq -r '._feed_retry.exhausted_at // ""' "$DRAFT")" ]; then
              FEED_RC=0
              timeout 120 python tools/retry_feed_blocks.py --draft "$DRAFT" --write || FEED_RC=$?
              if [ "$FEED_RC" = "124" ]; then
                python tools/retry_feed_blocks.py --timed-out 120 --draft "$DRAFT" --write \
                  || echo "::warning::$SLUG 备料重跑超时，补记这一趟也失败了"
              elif [ "$FEED_RC" != "0" ]; then
                echo "::warning::$SLUG retry_feed_blocks 读不了这份草稿（退出码 $FEED_RC），这一步跳过"
              fi
            fi
            PROBE=$(git ls-tree -r --name-only HEAD \
              | grep -E "^output/[^/]+/reel/${SLUG}/probe.json$" | tail -n 1 || true)
            if [ -z "$PROBE" ]; then
              echo "[waiting] $SLUG 没有已落库 probe 证据"
              continue
            fi
            OUTDIR=${PROBE%/probe.json}
            git sparse-checkout add "$OUTDIR"

            # 每份草稿各自隔离：一份炸了（模型接口 4xx、坏 JSON）不许把这一班
            # 剩下的草稿一起跳过——整段是 bash -e 的 for 循环，不隔离就是这个后果。
            python tools/refresh_reel_cover.py --draft "$DRAFT" --write \
              || { echo "::warning::$SLUG refresh_reel_cover 失败，这一份跳过"; continue; }

            PORTRAIT=$(jq -r '.cover.portrait.image // ""' "$DRAFT")
            REVIEWED=$(jq -r '._visual_evidence.cover_image // "__missing__"' "$DRAFT")
            VISUAL_STATUS=$(jq -r '._visual_evidence.visual_status // ""' "$DRAFT")
            RETRYABLE=$(jq -r '._visual_evidence.retryable // false' "$DRAFT")
            # Compare bytes and auditor version, not only a reused filename.
            EVIDENCE_CHANGED=$(python - "$DRAFT" "$OUTDIR" <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,"tools")
          from analyze_reel_visuals import evidence_hash,select_contact_sheets
          draft=json.loads(Path(sys.argv[1]).read_text())
          frames=select_contact_sheets(list(Path(sys.argv[2]).glob("contact_*.jpg")))
          portrait=Path(str(((draft.get("cover") or {}).get("portrait") or {}).get("image") or ""))
          cover=portrait if portrait.is_file() else None
          old=(draft.get("_visual_evidence") or {}).get("input_sha256")
          print("true" if frames and evidence_hash(frames,cover) != old else "false")
          PY
            )
            # 同一批图片不反复收费问模型；没有报告（含瞬时 API 失败）或官方图
            # 刚补上/换过时才重新审核。
            if [ "$REVIEWED" = "__missing__" ] || [ "$PORTRAIT" != "$REVIEWED" ] \
              || [ "$VISUAL_STATUS" = "error" ] || [ "$RETRYABLE" = "true" ] \
              || [ "$EVIDENCE_CHANGED" = "true" ]; then
              python tools/analyze_reel_visuals.py \
                --draft "$DRAFT" --outdir "$OUTDIR" --write \
                || { echo "::warning::$SLUG analyze_reel_visuals 失败，这一份跳过"; continue; }
            else
              echo "[skip] $SLUG 的同一批视觉证据已经审核过"
            fi
            python tools/promote_reel_draft.py --draft "$DRAFT" --write \
              || { echo "::warning::$SLUG promote_reel_draft 失败，这一份跳过"; continue; }
            if [ -f "specs/reels/$SLUG.json" ] && [ ! -f "$DRAFT" ]; then
              echo "$SLUG" >> /tmp/reel-ready
            fi
          done

      - name: 落库 ready spec（waiting 不制造空提交）
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add specs/reels assets/reel
          if git diff --cached --quiet; then
            echo "没有新证据/正式 spec"
            exit 0
          fi
          python tools/check_staged_file_sizes.py
          git commit -m "reel: 自动补齐视觉证据并提升正式 spec"
          source tools/git_push_retry.sh
          if ! push_with_rebase_retry main 5; then
            echo "::error::ready spec 连续 5 次推不上 main；没有 dispatch render"
            exit 1
          fi

      - name: 正式 spec 落库后逐条并行派发 render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r SLUG; do
            [ -n "$SLUG" ] || continue
            gh workflow run match-reel.yml --ref main \
              -f mode=render -f slug="$SLUG" -f received_at="$(date -u +%FT%TZ)"
            echo "[dispatch] render $SLUG"
          done < /tmp/reel-ready

      # schedule 会被 GitHub 丢弃（详见 tools/nudge_stale_ticks.sh 顶注），
      # 每一班顺手叫醒别的挨饿班次。⚠️ orchestrate 要带 apply=true——
      # 它 workflow_dispatch 的 apply 默认 false，裸点一趟只扫不派发。
      - name: 顺手叫醒挨饿的编排/监控班次
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source tools/nudge_stale_ticks.sh
          nudge_if_stale orchestrate.yml 20 -f apply=true
          # 监控班次自己也挨饿（实测 145~402 分钟一趟）：它是阻塞推微信的那一班
          nudge_if_stale pipeline-health.yml 90
          # O4 自动换图（2026-09-28）：登记 3 小时 0 趟——没有任何班次叫醒它，而 GitHub 会丢
          # schedule 事件。apply=true 和它自己的定时班次同一个语义（定时＝真换）
          nudge_if_stale reel-cover-upgrade.yml 40 -f apply=true
          # 采访派发（10 分钟一班）：停着的草稿不再叫醒全量之后，空转一趟只要十几秒
          nudge_if_stale interview-auto-render.yml 30
