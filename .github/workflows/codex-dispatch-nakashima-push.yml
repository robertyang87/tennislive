name: codex-dispatch-nakashima-push

on:
  push:
    branches:
      - claude/nakashima-borges-2026-08-20
    paths:
      - .github/workflows/codex-dispatch-nakashima-push.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified reel push on main
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'match-reel.yml',
              ref: 'main',
              inputs: {
                mode: 'push',
                slug: 'nakashima-borges',
                push: 'true',
                matchup: '中岛 vs 博尔热斯',
                score: '6-3 6-7(5) 6-3',
                event: '',
                summary: '发球局零丢失却打满三盘',
                push_lead: '辛辛那提男单1/8决赛，中岛纳赛马6-3 6-7(5) 6-3击败博尔热斯，ATP官方用时2小时20分。首盘他破发一次，6-3拿下；次盘两人缠斗到六比六，博尔热斯抢七7比5扳回一盘；决胜盘中岛纳赛马再破一次，5-3发球拿下比赛，却握了三个赛点、博尔热斯救回两个，第三个才关上比赛。全场他一个发球局都没丢（16/16保发），博尔热斯0/4破发点转化；中岛一人打出27个ACE，博尔热斯8个。这是他本周辛辛那提第二场硬仗——前一天他刚三盘战胜梅德韦杰夫。'
              }
            });
            core.info('match-reel push dispatched on main');

      - name: Probe ATP official Hawkeye match endpoint
        continue-on-error: true
        shell: bash
        run: |
          status=$(curl --compressed -L -sS -A 'Mozilla/5.0' -o /tmp/atp-body -w '%{http_code}' 'https://www.atptour.com/-/Hawkeye/MatchStats/Complete/2026/422/ms013')
          echo "ATP_HAWKEYE_HTTP=$status"
          wc -c /tmp/atp-body
          python - <<'PY'
          import json
          from pathlib import Path

          raw = Path('/tmp/atp-body').read_bytes()
          text = raw.decode('utf-8', errors='replace')
          print('ATP_BODY_PREFIX=' + text[:300].replace('\n', ' '))
          try:
              data = json.loads(text)
          except Exception as exc:
              print('ATP_JSON_PARSE=' + type(exc).__name__)
          else:
              print('ATP_JSON_TYPE=' + type(data).__name__)
              hits = []
              def walk(value, path='root'):
                  if isinstance(value, dict):
                      for key, child in value.items():
                          key_l = str(key).lower()
                          if any(term in key_l for term in ('winner', 'unforced', 'ace', 'double', 'serve', 'point')):
                              hits.append((path + '.' + str(key), child if not isinstance(child, (dict, list)) else type(child).__name__))
                          walk(child, path + '.' + str(key))
                  elif isinstance(value, list):
                      for i, child in enumerate(value[:50]):
                          walk(child, path + '[' + str(i) + ']')
              walk(data)
              for path, value in hits[:120]:
                  print('ATP_FIELD', path, '=', value)
          PY
