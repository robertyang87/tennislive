name: interview-model-benchmark

# 只读影子练习：不改 spec、不 render、不 dispatch、不调用 PushPlus。
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "skills/tennis-interview-production/**"
      - "tools/interview_skill.py"
      - "tools/draft_interview_spec.py"
      - "tools/benchmark_interview_models.py"
      - "specs/interviews/gauff-pegula-cin2026-final.json"
      - ".github/workflows/interview-model-benchmark.yml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            assets/explainer/nadal-academy/faces
            assets/venues/canada-iga-stadium-centre-court.jpg
            assets/venues/cincinnati-centre-court-full.jpg
            assets/venues/indianwells-centre-court.jpg
            assets/venues/madrid-centre-court.jpg
            assets/venues/miami-centre-court.jpg
            assets/venues/montecarlo-centre-court.jpg
            assets/venues/paris-bercy-centre-court.jpg
            assets/venues/rome-foro-italico-centre-court.jpg
            assets/venues/shanghai-qizhong-centre-court.jpg
            skills
            specs/interviews/gauff-pegula-cin2026-final.json
            src
            tools

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 缓存 apt 包（ffmpeg 保底）
        id: apt_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          key: apt-pkgs-${{ runner.os }}-24.04-interview-benchmark-v1-${{ github.run_id }}
          restore-keys: |
            apt-pkgs-${{ runner.os }}-24.04-interview-benchmark-v1-

      - name: 安装证据抽帧工具
        timeout-minutes: 15
        run: |
          source tools/ci_apt_install.sh
          ensure_ffmpeg

      # 只在这一趟真摸了网、下了新包时回写（`APT_CACHE_DIRTY` 由
      # `tools/ci_apt_install.sh` 置位）。原来靠 actions/cache@v4 的 post 自动存：
      # 命中的趟白传一份、只装 ffmpeg 的趟把空目录存成最新那一格——见那份脚本
      # 顶部 2026-09-27 那段。判据 `tests/test_runner_setup_cache.py`。
      - name: 回写 apt 缓存（这趟真下了新包才存）
        if: env.APT_CACHE_DIRTY == '1' && steps.apt_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          key: ${{ steps.apt_cache.outputs.cache-primary-key }}

      - name: 安装只读基准依赖
        run: pip install -q -e .

      - name: 下载已发布成片作为只读基准
        run: >-
          curl --fail --location --retry 3 --output /tmp/interview-benchmark.mp4
          https://github.com/robertyang87/tennislive/releases/download/interview-gauff-pegula-cin2026-final/gauff-pegula-cin2026-final.mp4

      - name: DeepSeek + MiniMax 复做并逐项对比
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: >-
          python tools/benchmark_interview_models.py
          --film /tmp/interview-benchmark.mp4
          --outdir /tmp/interview-model-benchmark

      - name: 上传评分、模型原始结果与证据帧
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interview-model-benchmark-${{ github.run_number }}
          path: /tmp/interview-model-benchmark
          retention-days: 30
