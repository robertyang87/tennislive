name: fix-interview-direct-media-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-interview-direct-media-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  fix-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          sparse-checkout: |
            .github
            specs
            tests
            tools
      - name: 修共享下载器对直链 MP4 的处理
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/build_interview_clip.py')
          s=p.read_text(encoding='utf-8')
          needle='''def yt_download(url: str, dest: Path, fmt: str, spec: dict) -> Path:\n    """下到 `dest`，**下完必须确认它真的在那儿**。返回实际落地的路径。\n'''
          if needle not in s:
              raise SystemExit('找不到 yt_download 函数锚点，拒绝盲改')
          marker='''    if dest.exists():\n        return dest\n'''
          replacement='''    if dest.exists():\n        return dest\n    # 直链媒体不是播放器页面，不能套 YouTube 的 `-f bv*+ba/b` 选择器。\n    # US Open/Brightcove 这类官方源会直接给 `.mp4`；yt-dlp 对 generic extractor\n    # 套格式选择器会报 `Requested format is not available`，但 curl 直取完全正常。\n    # 这属于共享下载器的来源适配，不是当前视频的特判。\n    parsed = urlparse(url)\n    if (parsed.scheme in {"http", "https"}\n            and parsed.path.lower().endswith((".mp4", ".mov", ".m4v"))):\n        dest.parent.mkdir(parents=True, exist_ok=True)\n        proc = subprocess.run(\n            ["curl", "-LfsS", "--retry", "2", "--connect-timeout", "15",\n             "--max-time", "240", "-o", str(dest), url],\n            capture_output=True, text=True, timeout=260)\n        if proc.returncode == 0 and dest.is_file() and dest.stat().st_size > 1024:\n            print(f"[下载] 官方直链媒体成功：{url} → {dest.name} "\n                  f"({dest.stat().st_size / 1e6:.1f}MB)")\n            return dest\n        dest.unlink(missing_ok=True)\n        tail = (proc.stderr or proc.stdout or "直链下载没有输出").strip().splitlines()[-1]\n        raise SystemExit(f"官方直链媒体下载失败 {url}：{tail[:180]}")\n'''
          if '官方直链媒体成功' not in s:
              if marker not in s:
                  raise SystemExit('找不到 yt_download 的 dest.exists 锚点')
              s=s.replace(marker,replacement,1)
              p.write_text(s,encoding='utf-8')
          PY
          cat > tests/test_interview_direct_media.py <<'PY'
          import sys
          from pathlib import Path
          from types import SimpleNamespace

          sys.path.insert(0, str(Path(__file__).resolve().parents[1] / 'tools'))
          import build_interview_clip as clip

          def test_direct_mp4_bypasses_ytdlp_format_selector(tmp_path, monkeypatch):
              dest = tmp_path / 'lead.mp4'
              seen = []
              def fake_run(cmd, **kwargs):
                  seen.append(cmd)
                  assert cmd[0] == 'curl'
                  out = Path(cmd[cmd.index('-o') + 1])
                  out.write_bytes(b'x' * 2048)
                  return SimpleNamespace(returncode=0, stdout='', stderr='')
              monkeypatch.setattr(clip.subprocess, 'run', fake_run)
              got = clip.yt_download('https://media.example.test/path/final.mp4', dest, 'bv*+ba/b', {})
              assert got == dest
              assert dest.stat().st_size == 2048
              assert seen and all(cmd[0] != 'yt-dlp' for cmd in seen)
          PY
          python3 -m py_compile tools/build_interview_clip.py
          python3 -m pip install -q pytest
          python3 -m pytest -q tests/test_interview_direct_media.py
      - name: 提交共享修复并重跑锦织圭
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git rm .github/workflows/fix-interview-direct-media-once.yml
          git add tools/build_interview_clip.py tests/test_interview_direct_media.py
          git commit -m "fix: 直链官方媒体绕过 yt-dlp 格式选择器"
          source tools/git_push_retry.sh
          push_with_rebase_retry main 5
          sleep 3
          gh workflow run interview-clip.yml --ref main -f slug=nishikori-sakamoto-us-open-2026-q3-farewell -f mode=render -f received_at="$(date -u +%FT%TZ)"
