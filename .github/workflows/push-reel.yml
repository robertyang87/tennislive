name: push-reel

# 把**仓库里已经有的**那条竖版短片推到微信。不渲染、不下载源片、不合成语音。
#
# **为什么单独一条线**：GitHub Pages 只服务 main，所以推送只能在 main 上跑。
# 一直以来的做法是把整条 `match-reel` 在 main 上从头再跑一遍——而那一遍
# 除了「这次是在 main 上」之外没有产生任何新东西：
#
#   PR #108（分支上渲的）  output/2026-07-31/reel/wong-brooksby.mp4  55,028,417 字节
#   run 30623994190（main 上重渲）                                   55,028,980 字节
#
# 七分二十二秒的渲染，换来一个差 563 字节的同一条片子，外加往仓库里再塞一个
# 55 MB 的 blob（.git 因此涨到 1.77 GiB，每次 checkout 要两分多钟）。
# 同样的事在 hewitt-washington 上又发生了一次（56,953,265 → 57,297,653）。
#
# 现在的流程：分支上 `match-reel push=false` 出片 → 合进 main → 跑这条。
# 三分钟，而且**失败重跑也是三分钟**——不用再赌那十六分钟一次跑通。
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "片子 slug，决定 spec 和 output 目录"
        required: true
      date:
        description: "成片所在的日期目录（留空＝上海时间的今天）"
        required: false
        default: ""
      event:
        description: "覆盖标题里的赛事与轮次（一般留空）"
        required: false
        default: ""
      summary:
        description: "覆盖一句话概括（默认取 spec 的 push.summary）"
        required: false
        default: ""
      lead:
        description: "覆盖正文那一句（默认取 spec 的 push.lead）"
        required: false
        default: ""

permissions:
  contents: write

# 同一条片子只推一次；不同片子互不排队。
concurrency:
  group: push-reel-${{ github.event.inputs.slug }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 和 match-reel 那道闸同一个理由，同一个位置：第一步就拦。
      # Pages 只服务 main，分支上的 copy.html 那个 URL 永远是 404。
      - name: 只能在 main 上跑
        if: github.ref_name != 'main'
        run: |
          echo "::error::这条工作流只能在 main 上跑，当前分支是 ${{ github.ref_name }}。"
          echo "::error::GitHub Pages 只服务 main——复制页留在分支上永远是 404。"
          echo "::error::先把成片所在的 PR 合进 main，再从 main 跑这一条。"
          exit 1

      # 只取这一条片子那一格 output/，别把 1.36 GB 的 output/ 全拉下来。
      # 目录名要等 date/slug 算出来才知道，所以先只检出代码，随后再 add 进来。
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            specs
            src
            tools

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 只发消息，不渲染：不要 webrender / visualqa / cutout / ffmpeg / Chromium。
      # match-reel 那边光装依赖就一分半，这里十几秒。
      - name: 装依赖
        run: pip install -q -e .

      - name: 算出目录
        id: paths
        run: |
          DATE="${{ github.event.inputs.date }}"
          [ -n "$DATE" ] || DATE=$(TZ=Asia/Shanghai date +%F)
          SLUG="${{ github.event.inputs.slug }}"
          OUTDIR="output/$DATE/reel/$SLUG"
          echo "outdir=$OUTDIR" >> "$GITHUB_OUTPUT"
          git sparse-checkout add "$OUTDIR"
          echo "date=$DATE  outdir=$OUTDIR"

      # **查产物，不查信号。** 「合进 main 了」是信号，成片和复制页真的在这个
      # 目录里才是产物——目录写错日期（上海时间比 runner 的 UTC 早，16:00 UTC
      # 之后差一天）时，下面每一步都会以别的方式失败，报错却指不到这儿。
      - name: 成片和文案都得在
        id: check
        run: |
          OUTDIR="${{ steps.paths.outputs.outdir }}"
          SLUG="${{ github.event.inputs.slug }}"
          COPY="specs/reels/$SLUG.xhs.txt"
          test -f "$COPY" || { echo "::error::找不到 $COPY"; exit 1; }
          if [ ! -d "$OUTDIR" ]; then
            echo "::error::$OUTDIR 不在仓库里。先把渲染那条 PR 合进 main，"
            echo "::error::或者用 date 输入指明成片在哪一天的目录下"
            echo "::error::（日期按上海时间算，16:00 UTC 之后和 runner 差一天）。"
            ls -d output/*/reel/"$SLUG" 2>/dev/null && \
              echo "::error::这个 slug 在上面这些日期下有成片。"
            exit 1
          fi
          ls -la "$OUTDIR"
          test -s "$OUTDIR/$SLUG.mp4" || { echo "::error::找不到成片 $OUTDIR/$SLUG.mp4"; exit 1; }
          # 复制页在不在，决定下面要不要等 Pages。渲染那条线现在会把它提前
          # 提交上去，所以正常情况下这里是「已经在了」，一秒都不用等。
          if [ -s "$OUTDIR/copy.html" ]; then
            echo "page_committed=1" >> "$GITHUB_OUTPUT"
            echo "复制页已在仓库里，Pages 早就发布过了"
          else
            echo "page_committed=0" >> "$GITHUB_OUTPUT"
            echo "::warning::$OUTDIR/copy.html 不在（这条片子是旧流程渲的）——"
            echo "::warning::这次要现写现提交，推送前得等 Pages 发布，慢几分钟。"
          fi

      # 只有旧流程渲的片子才会走到这儿。写 + 提交，然后由推送那一步去等。
      - name: 补写复制页（旧片子才需要）
        if: steps.check.outputs.page_committed == '0'
        run: |
          OUTDIR="${{ steps.paths.outputs.outdir }}"
          SLUG="${{ github.event.inputs.slug }}"
          python tools/push_reel.py --stage page \
            --outdir "$OUTDIR" \
            --event "${{ github.event.inputs.event }}" \
            --summary "${{ github.event.inputs.summary }}" \
            --copy "specs/reels/$SLUG.xhs.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTDIR/copy.html"
          git diff --cached --quiet && exit 0
          git commit -m "reel: $SLUG 复制页"
          for attempt in $(seq 1 5); do
            git push origin HEAD:main && exit 0
            echo "push 被拒（第 $attempt 次），重放到最新的 main 上"
            git fetch origin main
            git branch -f staged HEAD
            git reset --hard origin/main
            git checkout staged -- "$OUTDIR/copy.html"
            git add "$OUTDIR/copy.html"
            git diff --cached --quiet || git commit -m "reel: $SLUG 复制页"
            sleep $((attempt * 3 + RANDOM % 5))
          done
          echo "::error::复制页没能落库，推送出去就是死链——不推。"
          exit 1

      # `push_reel.py` 自己会先探复制页（`wait_for_copy_page`）：探不到这一版
      # 就 exit 1，一个字都不发。这条工作流三分钟一轮，重跑不心疼——比起
      # 让它带着一个指向旧内容的按钮把消息发出去，宁可多跑一次。
      - name: 推送到微信
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_SECRET_KEY: ${{ secrets.PUSHPLUS_SECRET_KEY }}
          TENNISLIVE_JSDELIVR_HOST: ${{ vars.TENNISLIVE_JSDELIVR_HOST }}
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          python tools/push_reel.py \
            --outdir "${{ steps.paths.outputs.outdir }}" \
            --event "${{ github.event.inputs.event }}" \
            --summary "${{ github.event.inputs.summary }}" \
            --lead "${{ github.event.inputs.lead }}" \
            --copy "specs/reels/$SLUG.xhs.txt"
