name: codex-dispatch-fritz-render

on:
  push:
    branches:
      - codex/cincinnati-2026-08-20-remaining-reels
    paths:
      - .github/workflows/codex-dispatch-fritz-render.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Fritz reel render
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'match-reel.yml',
              ref: 'codex/cincinnati-2026-08-20-remaining-reels',
              inputs: {
                mode: 'render',
                slug: 'fritz-oconnell',
                voice: 'zh-CN-YunjianNeural',
                rate: '+6%',
                push: 'false'
              }
            });
            core.info('Fritz render dispatched');
