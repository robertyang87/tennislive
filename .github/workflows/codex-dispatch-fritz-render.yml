name: codex-dispatch-tirante-retry

on:
  push:
    branches:
      - codex/cincinnati-2026-08-20-remaining-reels
    paths:
      - .github/workflows/codex-dispatch-fritz-render.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Tirante-Mensik render
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = 'codex/cincinnati-2026-08-20-remaining-reels';

            for (const slug of ['tirante-mensik']) {
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: 'match-reel.yml', ref,
                inputs: {
                  mode: 'render',
                  slug,
                  voice: 'zh-CN-YunjianNeural',
                  rate: '+6%',
                  push: 'false'
                }
              });
              core.info(`render dispatched: ${slug}`);
            }
