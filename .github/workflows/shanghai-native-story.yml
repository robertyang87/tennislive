name: shanghai-native-story
run-name: "Shanghai native story · ${{ contains(github.event.head_commit.message, '[native-full]') && 'full' || 'preview' }}"
on:
  push:
    branches: ['repair/shanghai-native-story-20261006']
    paths: ['tools/build_shanghai_native_story.py', 'tools/story_reference_style.py', 'tools/story_triptych_cover.py', '.github/workflows/shanghai-native-story.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: shanghai-native-story-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src
            tools
            assets
            pyproject.toml
            README.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Native story dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          pip install -q -e '.[video]'
          pip install -q playwright pillow
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              with open(os.environ['GITHUB_ENV'],'a') as f:
                  f.write('CHROMIUM_PATH='+p.chromium.executable_path+'\n')
          PY
      - name: Recover approved historical input and byte-exact official sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 origin 28abaf0a9a4dc2ec8501315185fa6cb81e4e1cdf
          git checkout FETCH_HEAD -- specs/reels/shanghai-masters-history-2026.json assets/reel/shanghai-masters-history-2026
          gh run download 37394302656 --pattern 'shanghai-original-part-*' --dir "$RUNNER_TEMP/source-parts"
          mkdir -p "$RUNNER_TEMP/shanghai-clean-sources"
          find "$RUNNER_TEMP/source-parts" -type f -name 'part-*' | sort | xargs cat > "$RUNNER_TEMP/sources.tar"
          tar -xf "$RUNNER_TEMP/sources.tar" -C "$RUNNER_TEMP/shanghai-clean-sources"
          gh run download 37416853309 --name shanghai-review-audio-metadata-37416853309 --dir "$RUNNER_TEMP/preserved-audio"
      - name: Download real approved native-story reference and sample frames
        run: |
          mkdir -p "$RUNNER_TEMP/native-reference"
          curl --fail --location --retry 3 'https://github.com/robertyang87/tennislive/releases/download/reel-medvedev-24-titles-23-cities/medvedev-24-titles-23-cities.mp4' -o "$RUNNER_TEMP/native-reference/explainer.mp4"
          echo '5af14197ef8a2dd2c93ae53ec3870ad8992e9b6b2b2ccfde7af254c8c0512c31  '"$RUNNER_TEMP/native-reference/explainer.mp4" | sha256sum -c
          ffprobe -v error -show_format -show_streams -of json "$RUNNER_TEMP/native-reference/explainer.mp4" > "$RUNNER_TEMP/native-reference/probe.json"
          for AT in 0 2 12 17 21 35 48 97 150 215 297; do
            ffmpeg -y -v error -ss "$AT" -i "$RUNNER_TEMP/native-reference/explainer.mp4" -frames:v 1 "$RUNNER_TEMP/native-reference/frame-$AT.jpg"
          done
          ffmpeg -y -v error -sseof -2 -i "$RUNNER_TEMP/native-reference/explainer.mp4" -frames:v 1 "$RUNNER_TEMP/native-reference/frame-outro.jpg"
      - name: Render native story preview or full film
        id: native_render
        env:
          PHASE: ${{ contains(github.event.head_commit.message, '[native-full]') && 'full' || 'preview' }}
        run: |
          MODE=--preview
          if [ "$PHASE" = full ]; then MODE=; fi
          python tools/build_shanghai_native_story.py \
            --spec specs/reels/shanghai-masters-history-2026.json \
            --sources "$RUNNER_TEMP/shanghai-clean-sources" \
            --audio "$RUNNER_TEMP/preserved-audio" \
            --outdir "$RUNNER_TEMP/native-story" $MODE
          mkdir -p "$RUNNER_TEMP/native-delivery/subtitles" "$RUNNER_TEMP/native-delivery/words"
          cp "$RUNNER_TEMP/native-story"/*.ass "$RUNNER_TEMP/native-delivery/subtitles/"
          find "$RUNNER_TEMP/preserved-audio" -name 'voice_*.words.json' -exec cp {} "$RUNNER_TEMP/native-delivery/words/" \;
          cp "$RUNNER_TEMP/native-story/native-story-review.json" "$RUNNER_TEMP/native-delivery/"
          cp "$RUNNER_TEMP/native-story"/slide-*.jpg "$RUNNER_TEMP/native-delivery/"
          find "$RUNNER_TEMP/native-story" -maxdepth 1 -name 'shanghai-native-story*.mp4' -exec cp {} "$RUNNER_TEMP/native-delivery/" \;
          FILM=$(find "$RUNNER_TEMP/native-delivery" -name '*.mp4' | head -1)
          sha256sum "$FILM" > "$RUNNER_TEMP/native-delivery/film.sha256"
          split -b 30000000 -d -a 2 "$FILM" "$RUNNER_TEMP/native-delivery/film.part."
          rm "$FILM"
          PARTS=$(find "$RUNNER_TEMP/native-delivery" -name 'film.part.*' | wc -l)
          test "$PARTS" -le 7
          echo "parts=$PARTS" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shanghai-native-story-metadata-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native-delivery/*.json
            ${{ runner.temp }}/native-delivery/*.jpg
            ${{ runner.temp }}/native-delivery/film.sha256
            ${{ runner.temp }}/native-delivery/subtitles/*.ass
            ${{ runner.temp }}/native-delivery/words/*.json
            ${{ runner.temp }}/native-reference/*.jpg
            ${{ runner.temp }}/native-reference/probe.json
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success() && fromJSON(steps.native_render.outputs.parts) > 0
        with:
          name: shanghai-native-story-part-00-${{ github.run_id }}
          path: ${{ runner.temp }}/native-delivery/film.part.00
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success() && fromJSON(steps.native_render.outputs.parts) > 1
        with:
          name: shanghai-native-story-part-01-${{ github.run_id }}
          path: ${{ runner.temp }}/native-delivery/film.part.01
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success() && fromJSON(steps.native_render.outputs.parts) > 2
        with:
          name: shanghai-native-story-part-02-${{ github.run_id }}
          path: ${{ runner.temp }}/native-delivery/film.part.02
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success() && fromJSON(steps.native_render.outputs.parts) > 3
        with:
          name: shanghai-native-story-part-03-${{ github.run_id }}
          path: ${{ runner.temp }}/native-delivery/film.part.03
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success() && fromJSON(steps.native_render.outputs.parts) > 4
        with:
          name: shanghai-native-story-part-04-${{ github.run_id }}
          path: ${{ runner.temp }}/native-delivery/film.part.04
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success() && fromJSON(steps.native_render.outputs.parts) > 5
        with:
          name: shanghai-native-story-part-05-${{ github.run_id }}
          path: ${{ runner.temp }}/native-delivery/film.part.05
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success() && fromJSON(steps.native_render.outputs.parts) > 6
        with:
          name: shanghai-native-story-part-06-${{ github.run_id }}
          path: ${{ runner.temp }}/native-delivery/film.part.06
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: shanghai-native-story-debug-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native-story/*.json
            ${{ runner.temp }}/native-story/slide-*.jpg
            ${{ runner.temp }}/native-story/*.ass
          retention-days: 7
          if-no-files-found: warn
