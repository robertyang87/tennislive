name: content-radar

# 冷启动内容雷达：选出一条高价值的赛前焦点，生成完整内容包并推到微信。
# 每日最多一条赛果和一条预告——而赛果那一半已经用 `RESULT_DAILY_LIMIT = 0`
# 关掉了，所以现在实际只出赛前焦点。
#
# （「全天每 20 分钟」是当年的写法，早就不是了：72 次/天 → 6 次/天 →
# 2026-08-02 定时归零，见下。**带数字的注释会过期，而它过期的时候不吭声。**）
on:
  # **2026-08-02：定时停掉，只留手动。** 账号所有者：「这两个任务停掉吧，
  # 不需要了」（另一条是 news-radar）。
  #
  # 停的是**定时**，不是这条线的代码：`tennislive publish content` 和整套
  # 选题/渲卡/推送照旧，`workflow_dispatch` 随时能跑一趟。仓库里「停一条线
  # 要按产品分，不是按工作流分」那条同样适用——这次连产品都没停，只是不再
  # 无人值守地自己跑。
  #
  # （历史：一天 72 趟 → 2026-07-31 降到 6 趟 → 今天归零。那次降频的账是
  # run 30643007873：全程 3 分 44 秒，checkout 占 3 分 02 秒，而真正
  # 「自动选题并生成」只用了 3 秒；产出每天雷打不动就是日限那 1 个包。）
  #
  # 判据：test_停掉的定时不许自己回来
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: content-radar
  cancel-in-progress: false

jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
      WECHAT_APPSECRET: ${{ secrets.WECHAT_APPSECRET }}
      WECHAT_API_PROXY: ${{ secrets.WECHAT_API_PROXY }}
      WECHAT_MODE: ${{ vars.WECHAT_MODE || 'off' }}
      # 卡片主题：dark=品牌深绿（默认）/ light=奶油浅色
      TENNISLIVE_THEME: ${{ vars.TENNISLIVE_THEME || 'dark' }}
      TENNISLIVE_FONT: assets/fonts/NotoSansSC-Regular-sub.ttf
      TENNISLIVE_FONT_BOLD: assets/fonts/NotoSansSC-Bold-sub.ttf
    steps:
      - uses: actions/checkout@v4
        with:
          # **别把 output/ 拉下来。** 这条一天跑 72 趟，而它每趟只干 3 秒的活：
          # run 30643007873 全程 3 分 44 秒，其中 checkout 占 **3 分 02 秒（81%）**，
          # 「自动选题并生成」只用了 3 秒。HEAD 上 output/ 就有 1.36 GB，
          # 而这条只写当天那一格。
          #
          # 本次要写的那一格在「算出今天的目录」那一步 add 回来。
          sparse-checkout: |
            assets
            data
            docs
            specs
            src
            tests
            tools

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装 tennislive
        run: pip install -q -e ".[webrender]"

      - name: 缓存 Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          # ⚠️ **键钉在整份 `pyproject.toml` 上太宽。** 决定装哪个 Chromium 的
          # 只有 playwright 的版本，可这个键是**整份文件的哈希**——加一个依赖、
          # 改一行注释，六条工作流的 150 MB Chromium 缓存**同时失效**，
          # 下一趟每条都要重下一遍。2026-08-05 往 pyproject 里加 certifi 和
          # pytest-xdist 时当场撞上（run 30973785219 卡在「安装 Chromium」）。
          #
          # `restore-keys` 就够：主键没中就退到上一份，Chromium 已经在盘上，
          # `playwright install` 是个空操作；真换了 playwright 版本它会自己去下
          # 对的那一版，所以退旧缓存也不会拿错。这比另起一步去算版本号便宜，
          # 而且不用动步骤顺序。判据在 `test_Chromium缓存都要有restore_keys`。
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: 安装 Chromium
        # 10 而不是 9：等 dpkg 锁最多再花 60 秒（见下面 pw_wait_apt），
        # 而 2×240 秒本来就贴着 9 分钟。第 2 次眼看要成却被步骤预算
        # 掐掉，和「装不上」长得一模一样。
        timeout-minutes: 10
        run: |
          # ⚠️ **`--with-deps` 会跑 apt，而这个仓库的 apt 会抽风。** CLAUDE.md 里那条
          # 「一次静静烧了 13 分 42 秒」的教训当时只套在显式的 `apt-get` 步骤上，
          # **漏了这一处**——而它既没超时也没重试，能一路烧到 job 的 15 分钟预算
          # 用完（run 30973785219：卡在这一步 13 分钟，其余步骤全在 1 分钟内跑完）。
          #
          # 正常 5~60 秒（命中缓存时是空操作）。240 秒是 4~48 倍的余量，
          # 只有真挂死才会两次都吃满。⚠️ **别把这个数调小**：第一版 apt 重试
          # 写 3×100 秒当场把 CI 弄红了，因为 apt 一直在推进、只是慢——
          # **把「慢」误判成「挂死」，重试就从救场变成三倍的浪费**。
          # ⚠️ **第一次超时会毒死第二次，所以重试之前必须等 dpkg 锁松开。**
          # `timeout` 杀掉的是 `playwright install` 那层壳，**它派生的 apt-get
          # 活了下来并攥着 `/var/lib/dpkg/lock-frontend`**。run 31003290962 的
          # 日志一清二楚：第 1 次 240 秒被杀，15 秒后第 2 次**两秒**就死在
          # `held by process 4285 (apt-get)`——也就是说「重试」根本没重试成，
          # 它只是第一次超时的一个必然后果。
          #
          # ⚠️ 用 `pgrep -x`（**按可执行名精确匹配**），不是 `pgrep -f`。
          # CLAUDE.md 里那条「`until ! pgrep -f 'X'` 会匹配到它自己」说的就是
          # `-f` 扫整条命令行；这个循环跑在 bash 里，名字对不上 apt-get/dpkg，
          # 不会把自己数进去。也不用 fuser/lsof——runner 上不保证装着。
          pw_wait_apt() {
            for _ in $(seq 1 22); do
              if ! pgrep -x apt-get >/dev/null && ! pgrep -x dpkg >/dev/null; then
                return 0
              fi
              sleep 5
            done
            echo "::warning::等了 110 秒 dpkg 锁还没松开——下一次尝试八成会在两秒内死在 Could not get lock，不是 apt 装不上"
          }
          pw_retry() {
            for i in 1 2; do
              timeout 240 python -m playwright install --with-deps chromium && return 0
              echo "::warning::装 Chromium 第 $i 次没跑完（多半卡在 --with-deps 的 apt）"
              # 等锁，别拿 sleep 猜。顺带：被杀掉那次已经把一部分包下进了
              # /var/cache/apt/archives，所以第 2 次是接着下，不是从头来。
              pw_wait_apt
            done
            echo "::error::装 Chromium 两次都没成功"
            return 1
          }
          pw_retry

      - name: 算出今天的目录并放进稀疏范围
        run: |
          # 日期用 `beijing_today()` 算，和 `cmd_content` 写 `output/<today>/queue/`
          # 用的是**同一个函数**——拿 shell 的 `date` 另算一次，跨零点那一趟就会
          # 对不上，而对不上的表现是「git add 什么也没暂存」，不报错。
          DATE=$(python -c "from tennislive.timeutil import beijing_today; print(beijing_today())")
          git sparse-checkout add "output/$DATE"
          echo "今天是 $DATE，稀疏范围：$(git sparse-checkout list | tr '\n' ' ')"

      - name: 自动选题并生成完整内容包
        id: generate
        run: |
          rm -f .content-publish.json
          tennislive content --outdir output --manifest .content-publish.json
          if [ -f .content-publish.json ] && jq -e '.items | length > 0' .content-publish.json >/dev/null; then
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交内容包与状态
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          # **必须带 `--sparse`。** 稀疏检出之后，裸的 `git add output/` 对
          # cone 外的路径只打一句警告（"will not be updated in the index"）
          # 然后**退出码 0**——接着 `git diff --cached --quiet` 说「没有新内容」，
          # 这一轮的产物就这么静默丢了。合成仓库上验过两种写法。
          git add --sparse output/ data/
          if git diff --cached --quiet; then
            echo "没有新内容"
          else
            python tools/check_staged_file_sizes.py
            git commit \
              -m "Keep selected tennis content ready for human approval" \
              -m "The content radar generated this review queue at $(date -u +%H:%MZ)." \
              -m $'Constraint: Xiaohongshu publishing remains a human-confirmed action\nConfidence: high\nScope-risk: narrow\nTested: deterministic selection, content QA, and card rendering completed in this run'
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "${{ github.ref_name }}"
          fi

      - name: 上传待审核内容包
        if: steps.generate.outputs.has_new == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: content-queue-${{ github.run_number }}
          path: output/*/queue/
          retention-days: 14

      - name: 推送小红书待发布包到微信
        id: push
        if: steps.generate.outputs.has_new == 'true' && env.PUSHPLUS_TOKEN != ''
        # 2026-08-13 审查：这行原来写着 `continue-on-error: true  # 单次推送抖动
        # 不应让整轮内容雷达失败`——**那个前提不成立**。抖动（网络异常、5xx）
        # 早就在库层重试过了（`src/tennislive/publish/pushplus.py` 的重试预算：
        # 只重试「没送到」，`code != 200` 是明确拒绝不重发）。能走到这一层的，
        # 已经是重试之后仍然没送到、或者被服务端明确拒绝的**硬失败**——
        # 恰恰是最该出声的那一类。continue-on-error 拦错了类别。
        #
        # 而它真正的代价是**把这条工作流自己装的那道闸废掉了**：下面
        # 「运行失败时告警」挂的是 `if: failure()`，专为无人值守写的；
        # continue-on-error 让 job 保持绿色，于是那个 PushPlus 告警
        # **一次都不会响**。
        #
        # ⚠️ 所以 continue-on-error **留着**，形状抄 `oncourt-interviews.yml`
        # （本仓库唯一做对的一条推送）：吞下来只是为了让失败落到一个**能写出
        # 具体原因**的步骤里，而不是只留一句泛泛的「本次运行失败」——
        # 这条线的失败原因很特殊，见下面那一步的注释。
        # 判据：tests/test_workflow_alerts.py::test_吞掉微信推送失败的步骤都要按outcome重抛
        continue-on-error: true
        run: |
          export TENNISLIVE_ASSET_REV="$(git rev-parse HEAD)"
          tennislive publish content --manifest .content-publish.json

      - name: 空产摘要（运行成功但没有新内容时写明原因）
        # 空产不是失败，但也不能静默：把"为什么没有产出"留在运行摘要里，
        # 否则诊断只存在于会过期的日志正文，"内容静默消失"无从追查。
        if: success() && steps.generate.outputs.has_new != 'true'
        run: |
          {
            echo "## 内容雷达空产"
            echo ""
            echo "- 本次运行成功，但没有生成新的待发布内容包。"
            if [ -f .content-publish.json ]; then
              echo "- manifest 已写出但条目为 0。"
            else
              echo "- 未写出 manifest：本轮没有达到规则的完赛热点/赛前焦点，或候选都已发过（每日限额与去重）。"
            fi
            echo "- 选题判定明细见『自动选题并生成完整内容包』步骤日志。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 推送失败要出声（内容已落库，但没发出去）
        # 2026-08-13 补。位置只有**一个**约束：排在下面「运行失败时告警」
        # **之前**——那一步挂 `if: failure()`，要先有人把 job 打红，
        # 它才读得到失败状态。
        #
        # ⚠️ **别照抄 news-brief 那条「必须排在空产摘要之后」的理由，
        # 在这条线上它是假的。** 复查时（2026-08-13）核过两个 `if:`：
        #     推送     `steps.generate.outputs.has_new == 'true' && …`
        #     空产摘要 `success() && steps.generate.outputs.has_new != 'true'`
        # ——**互斥**。推送跑过，就说明 `has_new == 'true'`，空产摘要早已被
        # 它自己那个条件跳过，这一步 `exit 1` 跳不掉一份本来就不会写的诊断。
        # news-brief 那边的空产摘要只挂 `if: success()`，那条约束在**那儿**
        # 才成立；照抄过来就是给下一个人一个查不出错的假理由。
        #
        # 那 `continue-on-error` 在这条线上还买什么？只买**下面这段具体的
        # 诊断**：不吞的话 job 在推送那一步就红，这一步（隐式 `success()`）
        # 会被跳过，运行摘要里就只剩一句泛泛的「本次运行失败」，而这条线
        # 失败之后的处置很特殊——见下。
        #
        # ⚠️⚠️ **这条线上「重跑」救不回来，所以必须当场喊。**
        # `state[pick.key] = today` 是在**生成**的时候就写死的
        # （`src/tennislive/cli.py` 的 `cmd_content`，落盘到
        # `data/content_state.json`），而上面「提交内容包与状态」把它
        # **在推送之前**就提交进了仓库。于是推送失败之后重跑，
        # `select_content` 会因为 `pick.key in state` 直接 `continue` 跳过
        # 这条内容——**它再也不会被发出去，而且原来一个字都不吭声**。
        # 这比「重跑会重发」更坏：那个还救得回来，这个是静默永久丢失。
        #
        # 「选过」和「发过」本该是两个状态（`tools/auto_push_gate.py` 的
        # `pushed.json` 就是这么做的，只是这条线从来没接上）。**没有在这里
        # 改落盘时机**：那会动到 `prune_state` 和 RESULT/PREVIEW 日限的计数
        # 口径，而「推送失败的那条内容是下一趟重新选出来（可能已过热点窗口），
        # 还是就此作废」两种都说得通——**那是口径选择，不是明确的问题**，
        # 留给账号所有者定。这一步先把静默的永久丢失变成大声的永久丢失。
        if: steps.push.outcome == 'failure'
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "::error::微信推送失败：本轮内容包已经落库，但没有发出去"
          {
            echo "## ⚠️ 内容雷达：内容已落库，微信没发出去"
            echo ""
            echo "- 推送步骤失败。库层已经重试过「没送到」，走到这一步的是硬失败"
            echo "  （重试完仍然没送到，或者被 PushPlus 明确拒绝）。"
            echo "- ⚠️ **重跑救不回来**：这条内容在生成时就已记进"
            echo "  \`data/content_state.json\` 并随上一步提交，下一趟会被当成"
            echo "  「已用过」跳过。要补发得人工处理。"
            echo "- 内容包已在本次提交里：\`output/<日期>/queue/\` 下。"
            echo "- 运行日志：$RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: 运行失败时告警（PushPlus + 运行摘要）
        # 无人值守时，任何一步失败都主动通知，而不是只留一封 GitHub 邮件。
        if: failure()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "## ⚠️ 内容雷达运行失败"
            echo ""
            echo "- content-radar 本次运行失败，本轮完赛热点/赛前焦点可能缺产。"
            echo "- 运行日志：$RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PUSHPLUS_TOKEN" ]; then
            BODY="$(jq -nc --arg u "$RUN_URL" \
              '{title:"⚠️ 内容雷达运行失败",
                content:("content-radar 本次运行失败，本轮完赛热点/赛前焦点可能缺产。请查看：<a href=\"" + $u + "\">运行日志</a>"),
                template:"html"}')"
            curl -s -m 20 -X POST https://www.pushplus.plus/send \
              -H "Content-Type: application/json" \
              -d "$(jq -nc --argjson b "$BODY" --arg t "$PUSHPLUS_TOKEN" '$b + {token:$t}')" \
              || true
          fi
