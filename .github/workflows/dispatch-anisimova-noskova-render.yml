# rerender-after-score-subtitle-fix
name: dispatch-anisimova-noskova-render

on:
  push:
    branches:
      - agent/dispatch-anisimova-noskova-render

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch match-reel render
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "match-reel.yml",
              ref: "agent/anisimova-noskova-2026-08-20",
              inputs: {
                mode: "render",
                slug: "anisimova-noskova",
                voice: "zh-CN-YunjianNeural",
                rate: "+6%",
                push: "false"
              }
            });
            core.info("Dispatched match-reel render for anisimova-noskova");
