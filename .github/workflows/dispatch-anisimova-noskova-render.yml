# publish-after-merge
name: dispatch-anisimova-noskova-push

on:
  push:
    branches:
      - agent/dispatch-anisimova-noskova-render

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch match-reel push
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "match-reel.yml",
              ref: "main",
              inputs: {
                mode: "push",
                slug: "anisimova-noskova",
                voice: "zh-CN-YunjianNeural",
                rate: "+6%",
                push: "true"
              }
            });
            core.info("Dispatched match-reel push for anisimova-noskova");
