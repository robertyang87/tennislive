name: news-radar

# 场外网球新闻雷达：把"非比赛"的场外新闻（退役复出、规则赛制、人事组织、
# 装备科技、荣誉名人堂、场外趣闻）筛成快讯卡候选，推到微信供人工挑选。
# 敏感话题不入队、转人工。
#
# （原来写着「每天扫描两次」「比赛新闻归日报」——两句都过期了：定时
# 2026-08-02 停了，日报 2026-07-31 停产。**带数字的注释会过期，
# 而它过期的时候不吭声。**）
# 候选只用新闻源已有的真实字段成草稿；时间/地点/人物/事件由人工补全后再发。
on:
  # **2026-08-02：定时停掉，只留手动。** 账号所有者：「这两个任务停掉吧，
  # 不需要了」（另一条是 content-radar）。
  #
  # 停的是**定时**，不是这条线的代码：扫描、候选队列、快讯卡、选题候选照旧，
  # `workflow_dispatch` 随时能跑一趟。原来是每天两趟（北京 09:13 / 21:13）。
  #
  # 判据：test_停掉的定时不许自己回来
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      TENNISLIVE_THEME: ${{ vars.TENNISLIVE_THEME || 'dark' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # **别把 output/ 拉下来。** HEAD 上它就有 1.36 GB（.git 1.77 GiB），
          # checkout 因此每次要一分半到三分钟。这条一天两趟。
          # 本次要写的那一格在下面 `git sparse-checkout add` 回来。
          sparse-checkout: |
            assets
            data
            docs
            specs
            src
            tests
            tools

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装中文字体（草稿卡需要）
        timeout-minutes: 6
        run: |
          # ⚠️ apt 镜像会抽风，而且不是偶发：2026-08-04 两小时内两次——一次静静烧了
          # **13 分 42 秒**（那时没有闸），一次被 `timeout-minutes: 6` 掐掉
          # （run 30878555571），而正常只要 **18~53 秒**，重跑那趟 34 秒就过了。
          # 硬超时只把「静静烧半小时」换成「6 分钟红掉、要人重跑」——**方向对了但停在
          # 一半**：卡住的正确处置是换一次重试，不是整趟失败。
          # ⚠️ **第一版写的是 3 × 100 秒，当场把 CI 弄红了**（run 30880649692）：
          # 三次全跑满 100 秒被杀，也就是 apt **一直在推进、只是慢**，不是挂死。
          # 那个 100 秒是按「正常 18~53 秒」拍的，而那是**另一条工作流**的数——
          # ci.yml 这一步正常 25~34 秒，镜像变慢时能到 100 秒以上仍在干活。
          # **把「慢」误判成「挂死」，重试就从救场变成了三倍的浪费。**
          # 现在 2 × (150s + 10s) = 5.3 分，仍在步骤的 6 分钟超时以内。
          # 每次都留 150 秒（正常值的 4~6 倍），只有真挂死才会两次都吃满。
          apt_retry() {
            for i in 1 2; do
              sudo timeout 150 "$@" && return 0
              echo "::warning::apt 第 $i 次没跑完（卡住或超时）：$*"
              sudo dpkg --configure -a || true   # 上一次被 SIGTERM 打断可能留下半装状态
              sleep 10
            done
            echo "::error::apt 两次都没成功：$*"
            return 1
          }
          apt_retry apt-get update -qq
          apt_retry apt-get install -y -qq fonts-noto-cjk

      - name: 安装 tennislive
        run: pip install -q -e ".[webrender]"

      - name: 缓存 Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          # ⚠️ **键钉在整份 `pyproject.toml` 上太宽。** 决定装哪个 Chromium 的
          # 只有 playwright 的版本，可这个键是**整份文件的哈希**——加一个依赖、
          # 改一行注释，六条工作流的 150 MB Chromium 缓存**同时失效**，
          # 下一趟每条都要重下一遍。2026-08-05 往 pyproject 里加 certifi 和
          # pytest-xdist 时当场撞上（run 30973785219 卡在「安装 Chromium」）。
          #
          # `restore-keys` 就够：主键没中就退到上一份，Chromium 已经在盘上，
          # `playwright install` 是个空操作；真换了 playwright 版本它会自己去下
          # 对的那一版，所以退旧缓存也不会拿错。这比另起一步去算版本号便宜，
          # 而且不用动步骤顺序。判据在 `test_Chromium缓存都要有restore_keys`。
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: 安装 Chromium
        timeout-minutes: 9
        run: |
          # ⚠️ **`--with-deps` 会跑 apt，而这个仓库的 apt 会抽风。** CLAUDE.md 里那条
          # 「一次静静烧了 13 分 42 秒」的教训当时只套在显式的 `apt-get` 步骤上，
          # **漏了这一处**——而它既没超时也没重试，能一路烧到 job 的 15 分钟预算
          # 用完（run 30973785219：卡在这一步 13 分钟，其余步骤全在 1 分钟内跑完）。
          #
          # 正常 5~60 秒（命中缓存时是空操作）。240 秒是 4~48 倍的余量，
          # 只有真挂死才会两次都吃满。⚠️ **别把这个数调小**：第一版 apt 重试
          # 写 3×100 秒当场把 CI 弄红了，因为 apt 一直在推进、只是慢——
          # **把「慢」误判成「挂死」，重试就从救场变成三倍的浪费**。
          pw_retry() {
            for i in 1 2; do
              timeout 240 python -m playwright install --with-deps chromium && return 0
              echo "::warning::装 Chromium 第 $i 次没跑完（多半卡在 --with-deps 的 apt）"
              sleep 15
            done
            echo "::error::装 Chromium 两次都没成功"
            return 1
          }
          pw_retry

      - name: 扫描场外新闻并生成候选队列
        id: radar
        run: |
          OUT_DATE=$(TZ=Asia/Shanghai date +%F)
          echo "date=$OUT_DATE" >> "$GITHUB_OUTPUT"
          DATE=$(python -c "from tennislive.timeutil import beijing_today; print(beijing_today())")
          # 进 cone 要排在生成**之前**：`sparse-checkout add` 会把 HEAD 上
          # 那一版先铺回工作区，铺完再生成才是对的顺序。
          git sparse-checkout add "output/$DATE"
          tennislive flash-radar --outdir output

      - name: 提炼选题候选（新闻钩子 + 底下的常青线）
        # 和上一步是两件事：flash-radar 出的是「一条新闻 → 一张快讯卡」，
        # 这一步出的是选题——同一天几家在报同一件事才算新闻点，再去撞人工
        # 维护的角度表。撞不上就不猜，留在 unmatched_terms 里让人看该补什么。
        continue-on-error: true
        run: tennislive topic-radar --outdir output

      - name: 提交候选队列到仓库
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add --sparse output/
          if git diff --cached --quiet; then
            echo "没有新的场外候选"
          else
            python tools/check_staged_file_sizes.py
            git commit -m "content: 场外快讯候选 ${{ steps.radar.outputs.date }}"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "${{ github.ref_name }}"
          fi

      - name: 推送候选清单到微信（供人工挑选成稿）
        if: env.PUSHPLUS_TOKEN != ''
        continue-on-error: true
        run: |
          FILE="output/${{ steps.radar.outputs.date }}/flash_radar/flash_radar_push.html"
          if [ ! -s "$FILE" ]; then
            echo "本次无场外候选，跳过推送"
            exit 0
          fi
          BODY="$(jq -nc \
            --arg t "$PUSHPLUS_TOKEN" \
            --arg title "场外网球快讯候选 · ${{ steps.radar.outputs.date }}" \
            --rawfile c "$FILE" \
            '{token:$t,title:$title,content:$c,template:"html"}')"
          curl -s -m 20 -X POST https://www.pushplus.plus/send \
            -H "Content-Type: application/json" -d "$BODY" || true

      - name: 推送今日选题候选到微信
        if: env.PUSHPLUS_TOKEN != ''
        continue-on-error: true
        run: |
          FILE="output/${{ steps.radar.outputs.date }}/topic_radar/topic_radar_push.html"
          if [ ! -s "$FILE" ]; then
            echo "今天没有对上角度的选题候选，跳过推送"
            exit 0
          fi
          BODY="$(jq -nc \
            --arg t "$PUSHPLUS_TOKEN" \
            --arg title "今日选题候选 · ${{ steps.radar.outputs.date }}" \
            --rawfile c "$FILE" \
            '{token:$t,title:$title,content:$c,template:"html"}')"
          curl -s -m 20 -X POST https://www.pushplus.plus/send \
            -H "Content-Type: application/json" -d "$BODY" || true

      - name: 空产摘要（运行成功但没有场外候选时写明原因）
        # 空产不是失败，但也不能静默：把候选数和各信号源状态留在运行摘要里，
        # 否则诊断只存在于会过期的日志正文，"候选静默消失"无从追查。
        if: success()
        run: |
          RADAR_DIR="output/${{ steps.radar.outputs.date }}/flash_radar"
          if [ -s "$RADAR_DIR/flash_radar_push.html" ]; then
            echo "有候选产出，无需空产摘要"
            exit 0
          fi
          {
            echo "## 场外新闻雷达空产"
            echo ""
            echo "- 本次运行成功，但没有可发的场外新闻候选。"
            QUEUE="$RADAR_DIR/flash_radar_queue.json"
            if [ -s "$QUEUE" ]; then
              jq -r '"- 候选数：" + (.count|tostring)' "$QUEUE"
              jq -r '(.source_status // {}) | to_entries[] |
                "- 信号源 " + .key + "：" + (.value|tostring)' "$QUEUE"
            else
              echo "- 连候选队列文件都没有写出，请检查『扫描场外新闻并生成候选队列』步骤日志。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 运行失败时告警（PushPlus + 运行摘要）
        # 无人值守时，任何一步失败都主动通知，而不是只留一封 GitHub 邮件。
        if: failure()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "## ⚠️ 场外新闻雷达运行失败"
            echo ""
            echo "- news-radar 本次运行失败，本班次场外快讯候选可能缺产。"
            echo "- 运行日志：$RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PUSHPLUS_TOKEN" ]; then
            BODY="$(jq -nc --arg u "$RUN_URL" \
              '{title:"⚠️ 场外新闻雷达运行失败",
                content:("news-radar 本次运行失败，本班次场外快讯候选可能缺产。请查看：<a href=\"" + $u + "\">运行日志</a>"),
                template:"html"}')"
            curl -s -m 20 -X POST https://www.pushplus.plus/send \
              -H "Content-Type: application/json" \
              -d "$(jq -nc --argjson b "$BODY" --arg t "$PUSHPLUS_TOKEN" '$b + {token:$t}')" \
              || true
          fi
