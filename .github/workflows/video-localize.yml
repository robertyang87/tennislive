name: 授权视频中文化

on:
  workflow_dispatch:
    inputs:
      video_path:
        description: 仓库内本地视频路径
        required: true
        type: string
      subtitle_path:
        description: 仓库内英文 SRT 路径
        required: true
        type: string
      rights_path:
        description: 仓库内授权清单 JSON 路径
        required: true
        type: string
      bilingual:
        description: 是否生成中英双语字幕
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ⚠️ **不是 `GITHUB_MODELS_TOKEN`。** 这条线原来打
      # `models.github.ai/inference`，那个端点 2026-08-05 实测返回 HTTP 410
      # `github_models_retirement_brownout`——正在退役。热点简报那条线当天
      # 已经换到 DeepSeek，字幕翻译现在走**同一个 `research.brief.Chat`**，
      # 所以密钥也是同一对（两条通道二选一，见 `PROVIDERS`）。
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # **别把整个 output/ 拉下来**（1.36 GB）。产物目录是固定的 `output/video-localized`，
          # 所以直接列进稀疏范围，不用另算日期再 add。
          sparse-checkout: |
            assets
            data
            docs
            specs
            src
            tests
            tools
            output/video-localized

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装项目
        # `[brief]` 装的是 Anthropic SDK。DeepSeek 那条通道只要 `requests`
        # （主依赖），可**只配 ANTHROPIC_API_KEY 的话** `Chat` 会走另一条路，
        # 而那个 import 是延迟的——不装就在翻译那一步才炸，而翻译排在
        # checkout、校验路径之后。判据：test_做视频中文化的工作流要配模型密钥
        run: pip install -e ".[brief]"

      - name: 校验输入只指向仓库内文件
        env:
          VIDEO_PATH: ${{ inputs.video_path }}
          SUBTITLE_PATH: ${{ inputs.subtitle_path }}
          RIGHTS_PATH: ${{ inputs.rights_path }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path.cwd().resolve()
          for name in ("VIDEO_PATH", "SUBTITLE_PATH", "RIGHTS_PATH"):
              path = (root / os.environ[name]).resolve()
              if root not in path.parents or not path.is_file():
                  raise SystemExit(f"{name} 必须是仓库内已存在的文件: {path}")
          PY

      - name: 翻译并烧录中文字幕
        env:
          VIDEO_PATH: ${{ inputs.video_path }}
          SUBTITLE_PATH: ${{ inputs.subtitle_path }}
          RIGHTS_PATH: ${{ inputs.rights_path }}
          BILINGUAL: ${{ inputs.bilingual }}
        run: |
          EXTRA=""
          if [ "$BILINGUAL" = "true" ]; then EXTRA="--bilingual"; fi
          tennislive video \
            --video "$VIDEO_PATH" \
            --subtitles "$SUBTITLE_PATH" \
            --rights "$RIGHTS_PATH" \
            --outdir output/video-localized \
            $EXTRA

      - name: 上传成片、字幕与授权审计
        uses: actions/upload-artifact@v4
        with:
          name: video-localized-${{ github.run_number }}
          path: output/video-localized
          if-no-files-found: error
          retention-days: 14
