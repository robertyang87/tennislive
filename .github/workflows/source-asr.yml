name: source-asr
run-name: "caption-only AO diagnostic · ${{ inputs.url }}"
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Bounded official YouTube subtitle evidence; no video or ASR"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ao-caption-only-${{ github.ref }}
  cancel-in-progress: false
jobs:
  captions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE_URL: ${{ inputs.url }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install metadata/subtitle client only
        run: pip install -q "yt-dlp[default]" bgutil-ytdlp-pot-provider
      - name: Start existing PO token provider path
        continue-on-error: true
        run: |
          docker run --name bgutil-pot -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider >/dev/null
          for attempt in $(seq 1 15); do
            if curl -sf http://127.0.0.1:4416/ping >/dev/null; then
              echo "PO token provider ready"
              exit 0
            fi
            sleep 2
          done
          echo "::warning::PO provider not ready; metadata client will report actual result"
      - name: Write configured cookies outside artifact directory
        id: cookies
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/yt-cookies.txt"
            chmod 600 "$RUNNER_TEMP/yt-cookies.txt"
            echo "path=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No configured cookies; using existing Node/PO client path"
          fi
      - name: Fetch official or auto English subtitles and metadata once
        id: capture
        continue-on-error: true
        timeout-minutes: 5
        env:
          YT_COOKIES: ${{ steps.cookies.outputs.path }}
        run: |
          set -euo pipefail
          test "$SOURCE_URL" = "https://www.youtube.com/watch?v=Yh8lt5u7nqM"
          mkdir -p "$RUNNER_TEMP/ao-caption-evidence"
          ARGS=(--js-runtimes node --no-playlist --no-progress --socket-timeout 25 --retries 1 --extractor-retries 1 --fragment-retries 0)
          if [ -n "$YT_COOKIES" ]; then ARGS+=(--cookies "$YT_COOKIES"); fi
          set +e
          yt-dlp "${ARGS[@]}" --skip-download --write-subs --write-auto-subs \
            --sub-langs 'en.*' --sub-format 'vtt/json3' --write-info-json \
            --paths "$RUNNER_TEMP/ao-caption-evidence" -o '%(id)s.%(ext)s' \
            "$SOURCE_URL" > "$RUNNER_TEMP/ao-caption-evidence/capture.log" 2>&1
          CAPTION_EXIT=$?
          set -e
          printf '%s' "$CAPTION_EXIT" > "$RUNNER_TEMP/ao-caption-evidence/capture-exit.txt"
          echo "Metadata/subtitle client exit=$CAPTION_EXIT; video download disabled"
          exit "$CAPTION_EXIT"
      - name: Inventory evidence and exclude credential fields
        if: always()
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          root=Path(os.environ['RUNNER_TEMP'])/'ao-caption-evidence';root.mkdir(exist_ok=True)
          def clean(value):
              if isinstance(value,dict):
                  return {k:clean(v) for k,v in value.items() if k.lower() not in {'cookie','cookies','authorization','proxy-authorization','yt_cookies_txt'}}
              if isinstance(value,list):return [clean(v) for v in value]
              return value
          metadata=[]
          for f in root.glob('*.info.json'):
              d=json.loads(f.read_text());d=clean(d);f.write_text(json.dumps(d,ensure_ascii=False,indent=2))
              metadata.append({'file':f.name,'id':d.get('id'),'title':d.get('title'),'manual_english_languages':[k for k in d.get('subtitles',{}) if k.startswith('en')],'automatic_english_languages':[k for k in d.get('automatic_captions',{}) if k.startswith('en')],'requested_subtitles':list((d.get('requested_subtitles')or{}))})
          rows=[{'name':f.name,'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()} for f in root.iterdir() if f.is_file()]
          record={'source_url':os.environ['SOURCE_URL'],'capture_outcome':os.environ.get('CAPTURE_OUTCOME'),'capture_exit':(root/'capture-exit.txt').read_text() if (root/'capture-exit.txt').exists() else None,'metadata':metadata,'files':rows,'scope':'Single bounded metadata/subtitle retrieval; --skip-download; no ASR, no model, no source-film mutation, no publication.','credential_policy':'Cookie file resides outside artifact; cookie and authorization fields removed from info JSON; no cookie values printed.'}
          (root/'evidence-inventory.json').write_text(json.dumps(record,ensure_ascii=False,indent=2))
          print(json.dumps({'capture_outcome':record['capture_outcome'],'metadata_count':len(metadata),'subtitle_files':[r['name'] for r in rows if r['name'].endswith(('.vtt','.json3'))]}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ao-Yh8lt5u7nqM-caption-evidence
          path: ${{ runner.temp }}/ao-caption-evidence
          retention-days: 3
      - name: Require actual subtitle evidence
        if: always()
        run: |
          python - <<'PY'
          import os,json,sys
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'ao-caption-evidence'
          record=json.loads((root/'evidence-inventory.json').read_text())
          files=list(root.glob('*.vtt'))+list(root.glob('*.json3'))
          if record['capture_outcome']!='success' or not files:
              sys.exit('No successful subtitle retrieval; diagnostic artifact retained; not a transcription approval.')
          print('Subtitle bytes retrieved; exact wording and manual/automatic provenance still require review.')
          PY
