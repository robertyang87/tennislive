name: codex-dispatch-swiatek-interview-unmirror-render

on:
  push:
    branches:
      - codex/swiatek-rybakina-cincinnati-2026-qf-interview
    paths:
      - .github/workflows/codex-dispatch-swiatek-interview-unmirror-render.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: "${{ github.event.head_commit.message == 'ci: dispatch corrected unmirrored interview render' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch corrected render without another WeChat message
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run interview-clip.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f slug=swiatek-rybakina-cincinnati-2026-qf \
            -f mode=render \
            -f push=false
