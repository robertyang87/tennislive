name: codex-dispatch-fils-tirante-tnns

on:
  push:
    branches:
      - codex/dispatch-fils-tirante-tnns-20260821
    paths:
      - .github/workflows/codex-dispatch-fils-tirante-tnns.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: "${{ github.event.head_commit.message == 'ci: retry Fils-Tirante TNNS stats on UTC date' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch TNNS lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run tnns-stats.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f who=Fils,Tirante \
            -f date=2026-08-20
