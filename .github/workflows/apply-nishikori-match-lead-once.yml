name: apply-nishikori-match-lead-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-nishikori-match-lead-once.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 写入美网官方同场赛点冷开场
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          slug = "nishikori-sakamoto-us-open-2026-q3-farewell"
          path = Path("specs/interviews") / f"{slug}.json"
          spec = json.loads(path.read_text(encoding="utf-8"))
          match = spec["match"]

          source_url = "https://usopenvideo.akamaized.net/2026/prd/interviews/fc237349-6bb1-4cd1-9341-da83ed9c4b44.mp4"
          article_url = "https://www.usopen.org/en_US/news/articles/2026-08-28/kei_nishikori_honored_after_playing_final_grand_slam_match_at_2026_us_open.html"
          subs = [
              {"a": 127.02, "b": 129.20, "en": "Does it in style.", "zh": "他用最漂亮的方式兑现赛点"},
              {"a": 130.34, "b": 133.60, "en": "Rei Sakamoto—he can barely believe it.", "zh": "坂本怜几乎不敢相信这一刻"},
              {"a": 134.18, "b": 136.02, "en": "Served up an absolute treat today.", "zh": "他今天奉献了一场精彩表现"},
              {"a": 136.24, "b": 138.64, "en": "He was so impressive on serve,", "zh": "他的发球表现太出色"},
              {"a": 138.64, "b": 140.44, "en": "and he was simply too good", "zh": "整场比赛也确实更胜一筹"},
              {"a": 141.38, "b": 145.38, "en": "for his fellow countryman and idol, Kei Nishikori.", "zh": "击败了自己的同胞与偶像锦织圭"},
              {"a": 146.36, "b": 148.58, "en": "Getting the job done today in straight sets.", "zh": "直落两盘完成晋级"},
              {"a": 151.04, "b": 152.56, "en": "6-4, 7-6.", "zh": "6比4 7比6"},
          ]
          start, end = 121.0, 153.2
          assert end - start <= 39.5
          assert len(subs) >= 2
          assert all(start <= row["a"] < row["b"] <= end for row in subs)
          assert all(subs[i]["b"] <= subs[i + 1]["a"] for i in range(len(subs) - 1))

          spec["lead_in"] = {
              "url": source_url,
              "start": start,
              "end": end,
              "subs": subs,
              "why": (
                  "美网官网2026年8月28日官方报道内嵌同场视频"
                  "《Nishikori vs. Sakamoto | 2026 Qualifying Final》；"
                  "实测1920×1080、60fps。保留第3个赛点、坂本怜倒地庆祝、"
                  "网前握手与官方英文赛果播报，随后接锦织圭告别仪式。"
              ),
              "verification": {
                  "match_id": match["id"],
                  "channel": "US Open official site",
                  "height": 1080,
                  "width": 1920,
                  "fps": 60,
                  "duration": 153.566667,
                  "method": "official_exact_match_highlight",
                  "winner_en": match["winner_en"],
                  "loser_en": match["loser_en"],
                  "event_search": match["event_search"],
                  "year": match["year"],
                  "article_url": article_url,
                  "source_sha256": "36dab28838879cada51a9ce98832c9abd42a5f86b29fb6bf514061f0bbc9d2aa",
                  "asr_crosscheck": "faster-whisper small.en + medium.en；人名按官方赛果校正为 Rei Sakamoto / Kei Nishikori",
              },
          }
          spec.setdefault("opening", {})["why"] = (
              "正文官方告别仪式没有比赛画面；lead_in使用美网官网内嵌的同场1080p官方视频，"
              "从第3个赛点保留到握手和赛果播报。"
          )

          old_prefix = "冷开场例外已显式销账："
          notes = [n for n in spec.get("_notes", []) if not str(n).startswith(old_prefix)]
          lead_note = (
              "冷开场已改用美网官网同场官方1080p视频：121.0–153.2秒，"
              "含完整赛点、倒地庆祝、网前握手与8条双语现场解说。"
          )
          if lead_note not in notes:
              notes.append(lead_note)
          spec["_notes"] = notes

          path.write_text(
              json.dumps(spec, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(spec["lead_in"], ensure_ascii=False, indent=2))
          PY

          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git add specs/interviews/nishikori-sakamoto-us-open-2026-q3-farewell.json
          git commit -m "interview: 补齐锦织圭同场赛点冷开场"
          source tools/git_push_retry.sh
          push_with_rebase_retry main 5

      - name: 等主分支落稳后点名重渲染
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 25); do
            REMOTE=$(git ls-remote origin refs/heads/main | awk '{print $1}')
            LOCAL=$(git rev-parse HEAD)
            [ "$REMOTE" = "$LOCAL" ] && break
            sleep 1
          done
          RECEIVED_AT=$(date -u +%FT%TZ)
          gh workflow run interview-clip.yml --ref main \
            -f slug=nishikori-sakamoto-us-open-2026-q3-farewell \
            -f mode=render \
            -f "received_at=$RECEIVED_AT"
          echo "已点名正式渲染：$RECEIVED_AT"

      - name: 清理一次性工作流
        if: always()
        run: |
          git pull --rebase origin main
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git rm .github/workflows/apply-nishikori-match-lead-once.yml
          git commit -m "ops: 清理锦织圭冷开场一次性工作流"
          source tools/git_push_retry.sh
          push_with_rebase_retry main 5
