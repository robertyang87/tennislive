name: pipeline-health

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  # read 是看板用的；write 是「顺手叫醒挨饿班次」那一步 gh workflow run 要的
  actions: write

concurrency:
  group: pipeline-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data/orchestration_state.json
            data/interview_publish_ledger/*.json
            data/reel_publish_ledger/*.json
            data/explainer_publish_ledger/*.json
            output/**/render.json
            tools/pipeline_health.py
            # ⚠️ 叫醒挨饿班次那一步 `source` 它。这条是**逐文件**列的
            # （不像 orchestrate / reel-auto-ready 那样整个 `tools`），
            # 漏了它那一步每小时 `No such file or directory` 一次——
            # 而后果是双份的：pipeline-health 这条监控线自己常年红，
            # 且 nudge 从装上（#629）起在这个宿主上一次都没生效过。
            tools/nudge_stale_ticks.sh
          sparse-checkout-cone-mode: false

      # 每趟用唯一 key 保存一份很小的 JSON；restore-keys 会拿同分支最近一份。
      # 不把它提交进 main：健康检查每小时跑，监控状态不该制造 24 个提交/天。
      - name: 恢复微信告警状态
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/pipeline-health-alert.json
          key: pipeline-health-alert-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pipeline-health-alert-v2-

      - name: 汇总最近运行、慢步骤、SLA 与发布账本
        id: health
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/pipeline_health.py --limit 10 --step-runs 3 \
            --alert-state "$RUNNER_TEMP/pipeline-health-alert.json"

      - name: 趋势异常时推送微信告警
        if: steps.health.outputs.notify == 'true'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TITLE: ${{ steps.health.outputs.title }}
          MESSAGE: ${{ steps.health.outputs.message }}
        run: |
          echo "::warning::$MESSAGE"
          if [ -z "$PUSHPLUS_TOKEN" ]; then
            echo "::warning::没有 PUSHPLUS_TOKEN，只保留 Actions 告警"
            exit 0
          fi
          BODY=$(jq -nc --arg token "$PUSHPLUS_TOKEN" --arg message "$MESSAGE" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg title "$TITLE" \
            '{token:$token,title:$title,content:($message + "<br><a href=\"" + $url + "\">健康报告</a>"),template:"html"}')
          RESP=$(curl -sS --fail -m 20 --retry 3 --retry-all-errors \
            -X POST https://www.pushplus.plus/send -H "Content-Type: application/json" -d "$BODY")
          echo "PushPlus 返回：$RESP"
          echo "$RESP" | jq -e '.code == 200' >/dev/null || {
            echo "::error::PushPlus 明确拒绝了健康告警"; exit 1; }

      # 推送失败时不保存新状态，下一班会重试；成功或无需通知才推进状态。
      - name: 保存微信告警状态
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/pipeline-health-alert.json
          key: pipeline-health-alert-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 监控自身失败时留出明确故障
        if: failure()
        run: echo "::error::pipeline-health 自身失败；当前流水线健康状态不可观测"

      - name: 顺手叫醒挨饿的编排/提升班次
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # schedule 会被 GitHub 丢弃，详见 tools/nudge_stale_ticks.sh 顶注。
          # 监控班次自己也挨饿，但它每次醒来都能顺手把生产班次叫起来。
          source tools/nudge_stale_ticks.sh
          nudge_if_stale orchestrate.yml 20 -f apply=true
          nudge_if_stale reel-auto-ready.yml 20
