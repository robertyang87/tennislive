name: codex-dispatch-nakashima-render

on:
  push:
    branches:
      - claude/nakashima-borges-2026-08-20
    paths:
      - .github/workflows/codex-dispatch-nakashima-render.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger existing match-reel render
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'match-reel.yml',
              ref: 'claude/nakashima-borges-2026-08-20',
              inputs: {
                mode: 'render',
                slug: 'nakashima-borges',
                voice: 'zh-CN-YunjianNeural',
                rate: '+6%',
                push: 'false'
              }
            })
