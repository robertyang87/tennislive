name: probe-data-sources

# 手动/推送触发的临时探针。当前用途：为鹰眼解说视频抓取真实、贴切、可署名的
# B-roll 候选图，提交回仓库供人工核验挑选（用完恢复基线）。
on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/probe.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装 tennislive
        run: pip install -q -e .

      - name: 抓取 hawkeye 解说 B-roll 候选图
        run: python tools/probe_explainer_broll.py

      - name: 提交候选图供人工核验
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/broll
          if git diff --cached --quiet; then
            echo "无新候选"
          else
            git commit -m "probe: hawkeye explainer b-roll candidates"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "${{ github.ref_name }}"
          fi

      - name: 上传候选包 artifact
        uses: actions/upload-artifact@v4
        with:
          name: broll-${{ github.run_number }}
          path: tools/broll
