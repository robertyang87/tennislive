name: probe-data-sources

# 手动触发：在 GitHub Actions 出口网络中检查比分聚合源与授权统计配置。
on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/probe.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
      SPORTRADAR_ACCESS_LEVEL: ${{ vars.SPORTRADAR_ACCESS_LEVEL || 'trial' }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装 tennislive
        run: pip install -q -e .

      - name: 穷举 2004 美网 / 小威 / 卡普里亚蒂 的全部可用图片
        run: python tools/hunt_2004_usopen.py
