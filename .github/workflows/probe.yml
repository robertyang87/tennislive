name: probe-data-sources

# 临时改造：为解说视频定向抓取贴合内容的实拍 B-roll 候选（法网红土/球印/司线员/挑战大屏/电子司线）。
on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/probe.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装 tennislive
        run: pip install -q -e .

      - name: 定向抓取解说视频 B-roll 候选
        run: python tools/probe_explainer_broll.py

      - name: 提交候选图供人工目检
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/broll
          if git diff --cached --quiet; then
            echo "没有新候选"
          else
            git commit -m "probe: slot-targeted explainer b-roll candidates"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "${{ github.ref_name }}"
          fi
