name: yino-repair-dispatch
on:
  push:
    branches: [reel/yino-20261013]
    paths: [.github/workflows/yino-repair-dispatch.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: yino-repair-bootstrap
  cancel-in-progress: false
jobs:
  dispatch:
    if: "!contains(github.event.head_commit.message, '[skip yino repair]')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SLUG: zverev-bublik-shanghai-2026-r16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout: |
            .github
            data
            specs
            src
            tools
      - name: Verify pinned editorial and frozen producer
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY_CHECK'
          import hashlib,json,pathlib,os
          s=os.environ['SLUG']
          p=pathlib.Path('specs/reels')/(s+'.json')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='ad00eec61c15d8073f1a8f104e165720e6d54be027a26b076d188ac59ebf6e1f'
          d=json.loads((pathlib.Path('data/narration_checks')/(s+'.json')).read_text())
          assert d['tts_bundle']['bundle_sha256']=='de90d1b92aa474f32f40fc9333d8bb1b7e1117486991489b1447fc745324d3c9'
          assert d['tts_bundle']['request_count']==8
          assert d['voice']=='zh-CN-YunjianNeural' and d['rate']=='+6%' and d['backend']=='edge-tts'
          PY_CHECK
      - name: Remove temporary bootstrap and dispatch repaired native renderer
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/yino-repair-dispatch.yml
          git commit -m 'Dispatch corrected scoreboard renderer with identical frozen speech [skip yino repair]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          gh workflow run match-reel.yml --ref "$GITHUB_REF_NAME" -f mode=render -f slug="$SLUG" -f push=false -f voice=zh-CN-YunjianNeural -f rate=+6% -f received_at=2026-10-13T14:03:12Z
