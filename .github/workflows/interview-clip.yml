name: interview-clip
# run 标题带上 slug：看板首屏和阻塞微信（账号所有者 Q9）从标题里认「哪条卡住」——
# 手动拨的 run 原来标题只有工作流名。判据 test_手动拨的出片工作流run标题带slug
# ⚠️ 每一段是什么登记在 tools/build_dashboard_snapshot.py 的 RUN_NAME_FIELDS（按段位读，
# 两段的 slug 才认得出来），改这一行要一起改——判据 test_run标题的段位表和工作流里写的run_name对得上
run-name: "interview-clip · ${{ inputs.mode }} · ${{ inputs.slug }}"

# 把 @wta 逐场集锦尾巴上的**场上采访**剪出来，烧中英双语字幕。
#
# **为什么不在本地跑**：沙箱那台机器的 IP 被 YouTube 挡了。实测五个 player
# client 全废——`web`/`ios`/`web_safari` 报 `Sign in to confirm you're not a
# bot`，`tv` 报 `This video is DRM protected`，默认的 `android vr` 拿得到格式表
# 但一取媒体就 403。
#
# ⚠️ **「但字幕是通的」这句 2026-08-02 起不成立了**：现在连 `--list-subs` 都吃
# 同一个 bot 拦截，两条视频、两种取法一样，是 IP 不是单条视频。所以切行也搬到了
# runner 上（`mode: subs`），本地只剩「照着日志里的英文写中文」这一段。
# 这条留着是因为它会再变：哪天沙箱又通了，`--stage subs` 本地照样跑得动。
#
# 三个 mode 对应三个阶段，各装各的依赖——**只挑工作不挑准备等于没挑**：
#   subs   取字幕 + 切行        字体 + yt-dlp                 ~1 分钟（行先落库）
#          → 第二份 ASR 交报告   再加 ffmpeg ＋ faster-whisper   ＋3~5 分钟（2026-09-27）
#   cover  下载 + 扫封面候选 + 海报  ffmpeg/Chromium              ~2~3 分钟
#   render 下载 + 封面 + 转写校验 + 剪 + 烧  再加 whisper          ~9 分钟（封面先验）
#   push   只发微信             只要 `-e .`                    ~20 秒
#
# 用法：dispatch 时给 slug，spec 从 specs/interviews/<slug>.json 读。
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "spec 文件名（不带 .json）"
        required: true
        default: "eala-svitolina-dc2026-qf"
      mode:
        description: "subs=取字幕切行＋第二份ASR报告｜cover=扫封面候选＋出海报，不出片｜render=出片（封面先验，可同时推送）｜push=只推送已在仓库里的成片"
        type: choice
        options: [subs, cover, render, push]
        default: render
      push:
        description: "出片后推送微信"
        type: boolean
        default: false
      push_lead:
        description: "推送正文那一句（留空用文案第一行）"
        required: false
        default: ""
      received_at:
        description: "生产可用的视频链接与正式 spec 被确认/派发的 UTC 时刻；自动链路必传"
        required: false
        default: ""

permissions:
  contents: write
  # 触发 `pages.yml` 重新发布复制页——工作流自己提交的 push
  # **不会**创建 workflow run，见 `trigger_pages_build`。
  actions: write

# 同一条采访只留一个在跑——并行两个 run 会互相覆盖 `output/interviews/<slug>/`。
#
# **2026-08-13 补的，而且这条线从来就没有过**（`git log -p` 全历史里
# `concurrency` 零命中，不是被谁删掉的）。窗口是这条线的**设计工作方式**，
# 不是理论：同一个 slug 反复 dispatch 换封面正是常规操作（下面
# 「只出海报（不出片）」那一步——2026-09-27 起并进了「出封面并验视觉」——的注释就记着「2026-08-04 一晚渲了五趟，
# 四趟是为了换封面」——⚠️ 这句原来写着指向「成片发到 Release」那一步，
# 复查时核过，它在 `mode=cover` 那一步的注释里，指错了一步），而
# `mode=render` 要 ~9 分钟。两趟撞上时下面那个提交循环会在
# `poster.jpg` / `lines.json` 上冲突——**合成仓库上真跑过**，git 原话是
# `Cannot merge binary files: poster.jpg` + `CONFLICT (content): lines.json`。
#
# **分组名必须带 slug。** 写死一个组名的话，一批不同 slug 一起发只会活下来
# 第一个和最后一个——GitHub 每组只留一个 pending，其余全取消。这条是
# `explainer.yml` 那边用血换来的（见那个文件同一位置的注释）。
#
# ⚠️ **group 故意不带 mode**，跟 `match-reel.yml` 对齐。代价是
# `mode=push`/`cover`/`subs` 会掐掉同 slug 正在跑的那趟 render（反过来，
# 2026-09-27 起 subs 在切行落库之后还要跑三到五分钟的第二份 ASR，这段时间里
# 发同 slug 的 cover／render 也会把它掐掉、报告丢掉——见那一步的注释）；收益是
# 「同一条采访永远只有一个 run」这条不变量最干净，而**带上 mode 只能解决
# 一半**——同一个 slug 连发两趟 `render` 仍然会并行，也就是这次要修的那个
# 问题原样还在。
#
# ⚠️ 由此**换掉一个操作习惯**：`cancel-in-progress` 之后，「重发一趟看看起没起来」
# 会把正在跑的那趟掐掉，不能再拿它当探活手段（CLAUDE.md 记过同一条）。
# 而这条线的推送在**同一趟 run 里**（不像 match-reel 拆到了 auto-push-reel），
# 复制页那段最长要等 `60 × 40s = 40 分钟`（下面「推送到微信」那一步的
# `TENNISLIVE_COPYPAGE_ATTEMPTS/RETRY_SECONDS`），所以一趟
# `mode=render push=true` 可能一直占着这个组到 job 的 `timeout-minutes: 65`
# 为止——期间任何同 slug 的 dispatch 都会顶掉它。
# （原来是 45 分钟——render 约 9 分钟 + 探活最坏 40 分钟 = 49 > 45，
# **结构性越顶**，已按这笔账调到 65，见 job 上那段注释。）
#
# ⚠️⚠️ **由此新开了一个窗口，掐掉的时机很要命**：这条线是「提交成片」
# 之后才「推送到微信」，中间隔着那最长 40 分钟的等待。在这段里被同 slug
# 的 dispatch 顶掉，结果是**成片已经进了仓库、微信一个字没发，而且没有
# 任何「已发过」标记会记下这件事**。补救是重跑一趟 `mode=push`
# （成片已在仓库里，那条路只要 `-e .`、约 20 秒）。
# 顶掉它的人当场就知道自己顶了，所以这不是静默失败——但别在
# 「渲完了正在等复制页」的时候顺手再发一趟。
concurrency:
  group: interview-clip-${{ github.event.inputs.slug }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    # 65 分钟：`mode=render push=true` 的最坏路径是 render 本身约 9 分钟
    # ＋ 复制页探活最长 60×40s＝40 分钟，再留提交/重试的余量。原来的 45 分钟
    # **结构性地不够**（9 + 40 = 49 > 45），砍掉的时机正好落在「成片已提交、
    # 微信一个字没发」那一段——auto-push-interview.yml 为同一笔账把 60 调成
    # 70，这条线当时没跟上。
    timeout-minutes: 65
    steps:
      - name: 10 分钟成片时钟起点
        id: production_clock
        if: github.event.inputs.mode == 'render'
        env:
          RECEIVED_AT: ${{ github.event.inputs.received_at }}
        run: |
          START="${RECEIVED_AT:-$(date -u +%FT%TZ)}"
          echo "received_at=$START" >> "$GITHUB_OUTPUT"
          echo "[production-sla] link/spec accepted at $START; owned MP4 budget = 600s"

      # `mode=push` 的**唯一目的**就是发微信（顶上那张三阶段表写着
      # 「push＝只发微信」），可真正发消息那一步的 `if:` 认的是 `inputs.push`。
      # 只传 `mode=push` 的那趟会 20 来秒跑完、绿的——什么都不装、什么都不发。
      #
      # **它和「发出去了」长得一模一样**：run 是绿的，日志里没有任何一行说
      # 「本次没有推送」——被跳过的步骤根本不进日志。`match-reel.yml` 2026-08-05
      # 在同一个组合上栽过（run 30969384140，27 秒、绿、什么都没发），闸也是
      # 从那儿照抄的（注释也抄）。
      #
      # 装在最前面：`mode=push` 且 `push!=true` 是一个**没有意义的组合**，
      # 跑完什么也不产。第 5 秒报错，比绿着回来强。
      - name: mode=push 就必须 push=true
        if: github.event.inputs.mode == 'push' && github.event.inputs.push != 'true'
        run: |
          echo "::error::mode=push 的唯一目的就是发微信，但 push 还是 false——"
          echo "::error::这一趟会什么都不做就收工，**绿着回来，什么都没发**。"
          echo "::error::要发就同时给 mode=push 和 push=true。"
          exit 1

      - uses: actions/checkout@v4
        with:
          # **别把 output/ 拉下来。** 它有 2.26 GB，而这条工作流只碰自己那一格。
          # 实测代价：2026-08-03 那趟 `mode=push` 的 checkout **3 分 12 秒**，
          # 而它真正要跑的活只需要 requests 一个包、7 秒。
          #
          # 本次要写的那一格在下一步 `git sparse-checkout add` 回来——
          # **两半都要有**：只写这一半，`git add "$OUTDIR"` 会说路径在稀疏
          # 范围之外，只警告、退出码 0，**产物静默丢掉**，而那是跑完之后才发现。
          #
          # ⚠️ 排除的**只有** output：assets 一百多兆看着也不小，但烧字幕要读
          # `assets/fonts`（得意黑的 ttf），少一个就是第 5 分钟才炸的
          # FileNotFoundError。cone 模式下根目录的文件总是带上。
          sparse-checkout: |
            .github
            assets
            data
            specs
            skills
            src
            tools

      # 必须排在**所有读写 output 的步骤之前**。目录不在工作区时，
      # `[ -f ... ]` 这类判断全是假的，而且不报错。
      - name: 把本次那一格加回稀疏范围
        run: |
          set -o pipefail
          OUT="output/interviews/${{ github.event.inputs.slug }}"
          git sparse-checkout add "$OUT"
          echo "$OUT：$(ls -1 "$OUT" 2>/dev/null | wc -l) 个文件已在工作区"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 发布文案前置检查
        if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover'
        env:
          SLUG: ${{ github.event.inputs.slug }}
        run: |
          pip install -q -e ".[pronunciation]"
          python -c "import pypinyin"
          python tools/check_polyphones.py --spec "specs/interviews/$SLUG.json"
          python tools/video_sla.py mark --timeline "$RUNNER_TEMP/production-timeline.json" --phase preflight
          python tools/production_preflight.py --spec "specs/interviews/$SLUG.json" --column 赛后开麦

      # 第二份 ASR 是开麦链路最大单项：最新成功样本 5m44s。模型本身过去每趟
      # 都从 Hugging Face 重下；这既不增加校验信息，也把成片推到 10m09s。
      # 按模型名缓存，small.en / medium.en 仍是两份独立模型，精度闸不变。
      #
      # ⚠️ **subs 那一趟也要算**：第二份 ASR 挪到了 subs（见「第二份 ASR 交叉校验
      # 并提交报告（subs）」），它的模型缓存键从这一步拿——两个 mode 同一把键，
      # 同一份模型文件，不许 subs 另下一份。
      - name: 算第二份 ASR 模型
        id: second_asr
        if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'subs'
        env:
          SLUG: ${{ github.event.inputs.slug }}
        run: |
          MODEL=$(python - <<'PY'
          import json, os
          from pathlib import Path
          spec = json.loads(Path(f"specs/interviews/{os.environ['SLUG']}.json").read_text())
          print(spec.get("whisper_model", "small.en"))
          PY
          )
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "第二份 ASR 模型：$MODEL"

      - name: 缓存第二份 ASR 模型
        if: github.event.inputs.mode == 'render'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: faster-whisper-${{ runner.os }}-${{ steps.second_asr.outputs.model }}
          restore-keys: |
            faster-whisper-${{ runner.os }}-

      # ⚠️⚠️ **Chromium 缓存键按装上的 playwright 版本算，不按 pyproject 的哈希**
      # （2026-09-27）pyproject 写的是 `playwright>=1.40`、而且 08-08 之后没动过，
      # 于是主键**永远命中**那份旧缓存（chromium-1234）；pip 装上的新 playwright 要
      # 1243，launch 探针落空、每趟重下 187 MiB ＋ 114 MiB 还跑一遍 `--with-deps`
      # 的 apt（run 36284220097）——而主键命中时 post 步骤「not saving cache」，
      # 这份缓存**永远修不好自己**。「装 Chromium」这一步 09-15 前中位 1s、之后
      # 18s（n=189）。按版本算：换版本那一趟主键落空、退到上一份、装完存新的一格。
      # 判据 `tests/test_runner_setup_cache.py`。
      - name: 算 Chromium 缓存键（装上的 playwright 版本）
        id: pw_version
        if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover'
        run: |
          pip install -q playwright   # 这一步排在「装依赖」之前，先把它装上才读得到版本
          v=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')
          echo "playwright $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # match-reel 已经缓存同一版 Playwright Chromium；采访线以前仍每趟重装。
      # 共用键和目录，命中后下面真 launch 一次，成功就不再碰 apt。
      - name: 缓存 Chromium
        if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-pw${{ steps.pw_version.outputs.version }}
          restore-keys: playwright-chromium-${{ runner.os }}-

      # 两个字体包都不能漏，而且**漏了的表现不一样，都不报错**：
      # - `fonts-noto-cjk`：少了它 libass 用回退字体，中文那行变豆腐块
      # - `fonts-noto-core`：少了它 `Noto Sans` 解析不到，英文那行悄悄换成
      #   DejaVu——**比 Noto Sans 宽 8%**，切行时量的宽度和渲出来的对不上，
      #   于是精心算好的「一行不超宽」在 runner 上失效。切行那步现在缺字体
      #   直接报错（不回退），所以这一行漏了会在第 5 秒就炸，不是第 90 秒
      # ⚠️ apt 镜像会抽风且不是偶发（2026-08-04/18/19 多次撞上 `apt-get
      # update`/`install` 连着两次吃满 150 秒、零字节进度）——调重试参数治不了根，
      # 真正的杠杆是大多数 run 根本不碰这个镜像。`tools/ci_apt_install.sh`
      # 把索引和下载缓存住，先试零网络的本地安装，缓存没命中才回退到老路。
      - name: 缓存 apt 包（字体 + ffmpeg，绕开镜像抽风）
        id: apt_cache
        if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          # actions/cache 的主键是不可变的：固定钥匙的话，第一趟只攒下一部分包，
          # 后面的 run 即使把缺的包补进目录，post step 也不能覆盖同名缓存，
          # 于是每一趟仍要重新摸 apt 镜像。照 match-reel.yml 改成滚动键：
          # 先按稳定前缀恢复最近一份，跑完再用本次 run_id 回写（注释也抄）。
          key: apt-pkgs-${{ runner.os }}-24.04-interview-clip-v2-${{ github.run_id }}
          # 第二格退到 CI 在 main 上存的那份（cjk＋core＋emoji，这一步装的字体是它的
          # 子集）：缓存按 ref 隔离，本线自己存的只有同一条分支看得见，每条新分支
          # 的第一趟全靠这一格（2026-09-27，见 match-reel.yml 同一步的注释）
          restore-keys: |
            apt-pkgs-${{ runner.os }}-24.04-interview-clip-v2-
            apt-pkgs-${{ runner.os }}-24.04-ci-v2-
      - name: 装系统依赖
        timeout-minutes: 15
        if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover'
        run: |
          source tools/ci_apt_install.sh
          apt_install_cached fonts-noto-cjk fonts-noto-core
          ensure_ffmpeg

      # 只在这一趟真摸了网、下了新包时回写（`APT_CACHE_DIRTY` 由
      # `tools/ci_apt_install.sh` 置位）。原来靠 actions/cache@v4 的 post 自动存：
      # 命中的趟白传一份、只装 ffmpeg 的趟把空目录存成最新那一格——见那份脚本
      # 顶部 2026-09-27 那段。判据 `tests/test_runner_setup_cache.py`。
      - name: 回写 apt 缓存（这趟真下了新包才存）
        # 这个 job 按 mode 分流、有两对 apt 缓存，所以 mode 也写进来——
        # 「哪个 mode 跑哪几步」那套判据（`_if_holds`）才算得清
        if: (github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover') && env.APT_CACHE_DIRTY == '1' && steps.apt_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          key: ${{ steps.apt_cache.outputs.cache-primary-key }}

      # **只看 spec 就判得出的错，排在装大依赖、下源片、取字幕之前报。**
      # 中文超宽／吊在「的」上／中英行数对不上、解读卡那一句折成两行、顶栏比分写成
      # 输家视角……原来都要等「取字幕切行」甚至渲完才红（2026-09-06 起 12 趟红在
      # 中文字幕上）。判据和本地 `python tools/interview_preflight.py --slug X`、
      # 自动链 dispatch 前的 `pick_interview_renders` 是同一份函数；量宽度的中文字体
      # 就是上一步装的 fonts-noto-cjk，所以排在它后面。文案那一项上面已经跑过。
      #
      # ⚠️ **自动链派发的 render 走 `--require-subs`**（2026-09-28）：当前转写指纹没有 subs 那一趟交的判定
      # （第二份 ASR 的分歧量数、空档的 VAD 证据），或者判定是红的，**在这儿就停**——
      # 不装大依赖、不下源片、不跑转写。9/20~9/28 六趟 render 红在「空档没销账／转写
      # 分歧超阈」，都是装完依赖、下完源片、跑完三五分钟 whisper 才知道；判定在仓库里
      # 的话，这一步第 1 秒就判得出。缺判定就先 dispatch `mode=subs`（它交判定，
      # render 那一趟的 verify 在判定 ok 时直接用它、不再重量）。
      #
      # ⭐ **只对自动链派发的 run 开**（`--dispatched-by`，2026-09-28 会话决定，时效第一）：
      # 已推送的 54 条里 46 条的判定是没记区间和源的老产物，手动重渲一条原来要先多拨一趟
      # `mode=subs`（取字幕约 1 分钟＋第二份 ASR 3~5 分钟，工作流顶上那张表）。派发者按 `github.triggering_actor` 认——pick 用
      # `GH_TOKEN: secrets.GITHUB_TOKEN` 派发，是 `github-actions[bot]`（interview-clip
      # 36337385713 实测，见 build_dashboard_snapshot.is_unattended）；个人拨的缺判定只提示，
      # 下面「转写交叉校验」那一步在同一个 job 里现量第二份 ASR（判定不是 ok 就重量，
      # 上线 subs 之前的老路）。已经量出来的红，两种派发者都红。
      - name: 采访 spec 离线预检（秒级）
        if: github.event.inputs.mode == 'render'
        env:
          SLUG: ${{ github.event.inputs.slug }}
          DISPATCHED_BY: ${{ github.triggering_actor }}
        run: PYTHONPATH=src python tools/interview_preflight.py --slug "$SLUG" --skip-copy --dispatched-by "$DISPATCHED_BY"

      # **`yt-dlp` 要装 `[default]`**，它才带 `yt-dlp-ejs`——解 YouTube 的
      # n challenge 要跑一段 JS。少了它不会报「装少了」，而是任何格式选择器都
      # 匹配不上，看起来像「这个视频没有格式」或者「cookie 过期了」。
      # **加新能力要同时改三处：代码、这里的依赖、开跑前的预检。** 这条在竖版
      # 剪辑那条线上连着犯过三次（playwright、Chromium、cv2），每次都是下完源片、
      # 跑了一分半之后才 ModuleNotFoundError。封面走 HTML 渲染，所以要 playwright。
      # **`-e .` 不能漏**：这个工具 import `PIL`（量字幕宽度）和
      # `tennislive.render.webcards`（封面字体），后者又拖着 requests / rich /
      # pypdf 一整串。只装那三个第三方包，跑到预检就是 `No module named 'PIL'`。
      # 这是同一条规矩在同一天里第三次咬人（前两次是 fonts-noto-core 和
      # Chromium 的路径）。判据落在 `test_工作流装的依赖覆盖工具import的每一个`：
      # 工具里新加一个第三方 import，那条测试会红到你把它登记进来为止。
      - name: 装依赖
        if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover'
        # ⚠️ 这一步 run 里跑 `playwright install --with-deps`，**那个 `--with-deps`
        # 会跑 apt**。原来它没有步骤级超时——判据看不见，因为 run 里当时不出现
        # `apt-get` 这个字面量。2026-08-05 补等 dpkg 锁那段之后它才被照出来。
        # 12 分钟 = 2×240 秒 + 60 秒等锁 + pip 那几行的余量。
        timeout-minutes: 12
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          # ⚠️ **`edge-tts` 是解读卡的口播要的**，别再漏。这条线在解读卡之前
          # 一个字都不合语音（片尾走的是母版转码），所以这一行原来没有它——
          # 又一次「加新能力就要同时改三处」。而漏了它**不报错**：
          # `_takeaway_voice` 的退路把它吞成一句「口播合不出来，退回静音卡」，
          # 于是成片里那张卡是**数字静音（−91 dB）**，run 照样绿。
          # 判据 `test_会合语音的工作流都要装edge_tts` 自己推导，不维护白名单。
          #
          # **faster-whisper 只有 render 用**（`--stage verify` 的第二份 ASR）。
          # `cover` 只下源片抽帧渲海报，从不转写——原来两档一起装，cover 那趟
          # 白拖一个大包；「只挑工作不挑准备等于没挑」在依赖粒度上同样成立。
          EXTRA_ASR=""
          # PyAV 19 removed metadata_errors, which faster-whisper 1.2.1 still
          # passes to av.open(). Keep the compatible decoder for real audio.
          if [ "$MODE" = "render" ]; then EXTRA_ASR="faster-whisper av==16.1.0"; fi
          # `faces`（onnxruntime）是封面认人＋睁眼要的（2026-09-27 账号所有者批的
          # O2+O3，`tools/face_checks.py`）。⚠️ **别换成 `pip install insightface`**：
          # 它依赖的是 opencv-python 5.x，装上就把 cv2 换成没有 CascadeClassifier 的
          # 那一版，Haar 这道闸当场废掉（量过，见 face_checks 顶部）。
          pip install -q -e ".[visualqa,faces]" "yt-dlp[default]" playwright edge-tts $EXTRA_ASR
          # ⚠️ **`--with-deps` 会跑 apt，而这个仓库的 apt 会抽风。** CLAUDE.md 里那条
          # 「一次静静烧了 13 分 42 秒」的教训当时只套在显式的 `apt-get` 步骤上，
          # **漏了这一处**——而它既没超时也没重试，能一路烧到 job 的 15 分钟预算
          # 用完（run 30973785219：卡在这一步 13 分钟，其余步骤全在 1 分钟内跑完）。
          #
          # 正常 5~60 秒（命中缓存时是空操作）。240 秒是 4~48 倍的余量，
          # 只有真挂死才会两次都吃满。⚠️ **别把这个数调小**：第一版 apt 重试
          # 写 3×100 秒当场把 CI 弄红了，因为 apt 一直在推进、只是慢——
          # **把「慢」误判成「挂死」，重试就从救场变成三倍的浪费**。
          # ⚠️ **第一次超时会毒死第二次，所以重试之前必须等 dpkg 锁松开。**
          # `timeout` 杀掉的是 `playwright install` 那层壳，**它派生的 apt-get
          # 活了下来并攥着 `/var/lib/dpkg/lock-frontend`**。run 31003290962 的
          # 日志一清二楚：第 1 次 240 秒被杀，15 秒后第 2 次**两秒**就死在
          # `held by process 4285 (apt-get)`——也就是说「重试」根本没重试成，
          # 它只是第一次超时的一个必然后果。
          #
          # ⚠️ 用 `pgrep -x`（**按可执行名精确匹配**），不是 `pgrep -f`。
          # CLAUDE.md 里那条「`until ! pgrep -f 'X'` 会匹配到它自己」说的就是
          # `-f` 扫整条命令行；这个循环跑在 bash 里，名字对不上 apt-get/dpkg，
          # 不会把自己数进去。也不用 fuser/lsof——runner 上不保证装着。
          pw_wait_apt() {
            for _ in $(seq 1 22); do
              if ! pgrep -x apt-get >/dev/null && ! pgrep -x dpkg >/dev/null; then
                return 0
              fi
              sleep 5
            done
            echo "::warning::等了 110 秒 dpkg 锁还没松开——下一次尝试八成会在两秒内死在 Could not get lock，不是 apt 装不上"
            # ⚠️⚠️ 2026-08-19（run 32211814483，tnns-stats）：等满 110 秒，锁**仍然**
            # 没松——被 `timeout` 杀掉的那层壳没能把信号传给它派生出来的
            # apt-get（这正是上面那条注释说的「派生的 apt-get 活了下来」），
            # 那个孤儿这次不是挂死，是在镜像上慢慢下一个字体包，110 秒不够它
            # 下完。而这一层已经贴着步骤预算的上限（`test_等dpkg锁的预算够长
            # 又不许撑爆步骤预算` 钉的 110~120 秒）——**再往上加等待时间不是
            # 出路**：上一次从 60 秒加到 110 秒就是这么来的，这次撞上同一个
            # 天花板，说明「多等一会」这条路已经走到头了。
            #
            # 我们不需要保住那个孤儿的进度：它已经下进
            # `/var/cache/apt/archives` 的包，下一次重试照样会复用（ci.yml
            # 那条注释早说过）。所以**主动结束它，不再指望它自己让开**——
            # 这比继续加大等待预算快得多，也不会撞步骤超时。
            sudo pkill -9 apt-get 2>/dev/null || true
            sudo pkill -9 dpkg 2>/dev/null || true
            sudo dpkg --configure -a 2>/dev/null || true
          }
          pw_retry() {
            for i in 1 2; do
              timeout 240 python -m playwright install --with-deps chromium && return 0
              echo "::warning::装 Chromium 第 $i 次没跑完（多半卡在 --with-deps 的 apt）"
              # 等锁，别拿 sleep 猜。顺带：被杀掉那次已经把一部分包下进了
              # /var/cache/apt/archives，所以第 2 次是接着下，不是从头来。
              pw_wait_apt
            done
            echo "::error::装 Chromium 两次都没成功"
            return 1
          }
          if timeout 20 python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              page = browser.new_page()
              page.set_content("<p>chromium-ready</p>")
              assert page.locator("p").inner_text() == "chromium-ready"
              browser.close()
          PY
          then
            echo "[chromium] 缓存可直接启动，跳过带系统依赖的安装"
          else
            echo "[chromium] 缓存未就绪，走带依赖安装"
            pw_retry
          fi
          node --version

      # 封面认人＋睁眼的三个 onnx（insightface buffalo_s v0.7 里的 det_500m /
      # w600k_mbf / 2d106det，21 MB）。键**按权重内容定址**（`face_checks.CACHE_KEY`：
      # 版本号 ＋ 三个 sha256 的摘要），`test_人脸模型缓存键跟着模型版本走` 逼着这里逐字一致。
      # 没命中时现下也只要约 2 秒（127 MB 的包里只解三个文件），缓存买的是
      # 「GitHub Release 抽风那天不至于整条链降级」。
      - name: 取人脸模型缓存
        id: face-cache
        if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/tennislive/face-models
          key: face-models-buffalo_s-v0.7-17d6bb6dfcd3
      # 备不上**不许把整趟拖红**，也**不许不吭声**：账号所有者要的是「模型加载
      # 不了就大声降级」——封面凭证（render 那一档还有 render.json）里会记 `unavailable`，这里先打一条注解。
      # `ok=true` 只在 fetch 真成功时写，下面存缓存那一步只认它。
      - name: 备好人脸模型
        id: face-models
        if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover'
        run: |
          if python tools/face_checks.py fetch; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::人脸模型没备好——封面认人／睁眼会降级成 unavailable（写进封面凭证）"
          fi
      # **只在「备好」真成功、而且缓存没命中时才存。** 原来是一步 `actions/cache@v4`，
      # 它的收尾保存不管 fetch 成没成——fetch 下到一半断掉（三个文件只写了一两个）
      # 的半截目录会被钉进一个**不可变**的键里，之后每一趟都命中这份残缺的缓存
      # （评审 2026-09-27 nit 7）。拆成 restore / save 两步，save 挂在 fetch 的 `ok` 上。
      - name: 存人脸模型缓存
        if: (github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover') && steps.face-cache.outputs.cache-hit != 'true' && steps.face-models.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/tennislive/face-models
          key: face-models-buffalo_s-v0.7-17d6bb6dfcd3

      # **取字幕这一阶段的准备，比出片少一大半。** 它不下媒体、不转写、不渲封面、
      # 不编码——只拉自动字幕、切行、量宽度。所以不装 Chromium / faster-whisper /
      # ffmpeg，省下三分多钟。
      # **字体两个都要**：切行是按真实字宽切的（`_en_width` / `_zh_width`），
      # 缺了就直接报错——这一步的产物是行的划分，量错了整条片子的字幕都跟着错。
      # ⚠️ apt 镜像会抽风且不是偶发——`mode=subs` 这条路自己也中过（2026-08-19
      # run 32212794304 / 32213180838，同一个位置连着两趟各吃满两次 150 秒、
      # 零字节进度）。调重试参数治不了根，真正的杠杆是大多数 run 根本不碰这个
      # 镜像，见 `tools/ci_apt_install.sh` 顶部注释。
      - name: 缓存 apt 包（字体，绕开镜像抽风）
        id: apt_cache_subs
        if: github.event.inputs.mode == 'subs'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          # 滚动键 + restore-keys，理由同上面 render/cover 那份缓存的注释。
          key: apt-pkgs-${{ runner.os }}-24.04-interview-clip-subs-v2-${{ github.run_id }}
          # 第二格退到 CI 在 main 上存的那份（cjk＋core＋emoji，这一步装的字体是它的
          # 子集）：缓存按 ref 隔离，本线自己存的只有同一条分支看得见，每条新分支
          # 的第一趟全靠这一格（2026-09-27，见 match-reel.yml 同一步的注释）
          restore-keys: |
            apt-pkgs-${{ runner.os }}-24.04-interview-clip-subs-v2-
            apt-pkgs-${{ runner.os }}-24.04-ci-v2-
      - name: 装依赖（只取字幕）
        timeout-minutes: 15
        if: github.event.inputs.mode == 'subs'
        run: |
          source tools/ci_apt_install.sh
          apt_install_cached fonts-noto-cjk fonts-noto-core
          # subs 那一趟的第二份 ASR 要 ffmpeg（`verify_transcript` 用 `yt-dlp -f ba` 下音轨，
          # tennistv.com 那 12 条是 Brightcove HLS；2026-09-27 review）。装在这儿而不是
          # 提交 lines.json 之后：`ensure_ffmpeg` 落空时退回 apt，得夹在这一对 apt 缓存
          # restore/save 中间才存得进去（`test_apt缓存只在这趟真下了新包时回写`）；
          # 先走静态构建、不碰镜像，多花的是几秒下载。
          ensure_ffmpeg
          pip install -q -e . "yt-dlp[default]"

      # 只在这一趟真摸了网、下了新包时回写（`APT_CACHE_DIRTY` 由
      # `tools/ci_apt_install.sh` 置位）。原来靠 actions/cache@v4 的 post 自动存：
      # 命中的趟白传一份、只装 ffmpeg 的趟把空目录存成最新那一格——见那份脚本
      # 顶部 2026-09-27 那段。判据 `tests/test_runner_setup_cache.py`。
      - name: 回写 apt 缓存（这趟真下了新包才存）
        if: github.event.inputs.mode == 'subs' && env.APT_CACHE_DIRTY == '1' && steps.apt_cache_subs.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          key: ${{ steps.apt_cache_subs.outputs.cache-primary-key }}

      - name: 开跑前预检（只取字幕）
        if: github.event.inputs.mode == 'subs'
        run: |
          PYTHONPATH=src python - <<'PY'
          import sys
          sys.path.insert(0, "tools")
          import yt_dlp  # noqa: F401
          from build_interview_clip import _en_width, _zh_width
          # 字体缺了就在这儿炸。它不报「装少了」，只是悄悄换回退字体，
          # 然后行宽全算错——而错的行划分会一路带到成片上。
          print(f"字宽 en={_en_width('respect'):.1f} zh={_zh_width('网球'):.1f}")
          PY

      # **只推送的时候什么重依赖都不需要**：封面已经在仓库里、不转写、不下载、
      # 不编码，`push_reel.py` 只用 requests 和 tennislive 自己那几个模块。
      # 原来照样装 apt 字体 + ffmpeg + Chromium + faster-whisper，白等三分钟——
      # 一个非关键阶段失败之后重跑，不该把前面所有阶段的准备工作再做一遍。
      - name: 装依赖（只推送）
        if: github.event.inputs.mode == 'push'
        run: pip install -q -e .

      # 让失败发生在第 5 秒，不是第 90 秒：用到什么就先 import 一次。
      - name: 开跑前预检
        if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover'
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          PYTHONPATH=src python - <<'PY'
          import os, shutil, sys
          from playwright.sync_api import sync_playwright
          sys.path.insert(0, "tools")
          from build_interview_clip import _chromium
          # 转写校验（第二份 ASR）只在 render 那条路上跑，装依赖那一步也只在
          # render 装它——预检要和「装了什么」一致，不然 cover 那趟会死在一个
          # 它根本不用的包上。
          if os.environ.get("MODE") == "render":
              import faster_whisper  # noqa: F401
          # 解读卡的口播。⚠️ 缺了它**不会让 render 失败**——`_takeaway_voice`
          # 的退路会把它吞成「口播合不出来，退回静音卡」，成片里那张卡是数字
          # 静音，而账号所有者对这张卡的要求原话就是「但要有配音」。
          # 所以在这儿 import 一次：让它死在第 5 秒，而不是在第 3 分钟静静降级。
          import edge_tts  # noqa: F401
          # 去水印的掩膜要 cv2（`logo_mask`）。装 extra 别装裸包名——
          # opencv 5.x 里 `CascadeClassifier` 没了，pyproject 钉着 <5
          import cv2; assert hasattr(cv2, "inpaint")
          from build_interview_clip import _en_width, _zh_width
          assert shutil.which("ffmpeg"), "没有 ffmpeg"
          print("Chromium:", _chromium())
          # 字体缺了就在这儿炸，不要等切行那一步——两个包漏哪个都不报错，
          # 只是悄悄换成回退字体，然后行宽全算错
          print(f"字宽 en={_en_width('respect'):.1f} zh={_zh_width('网球'):.1f}")
          from tennislive.render.webcards import _font_css
          css = _font_css()
          assert "TL Display SC" in css, "得意黑没内嵌进来，封面标题会退回系统字体"
          print("字体 CSS", len(css), "字节")
          PY

      # 配了 Secret 就带 cookie 下载。没配也先试一把——公开视频在 runner 的 IP 上
      # 有时候不用 cookie 也下得动，真下不动再回来配。
      - name: 落 cookies（配了 Secret 才有）
        if: github.event.inputs.mode != 'push'
        id: cookies
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "path=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_OUTPUT"
            echo "已写入 cookies（$(wc -l < "$RUNNER_TEMP/yt-cookies.txt") 行）"
          else
            echo "没有配 YT_COOKIES_TXT，裸下试试"
          fi

      # 2026-08-23：同一条公开视频在 runner 上会先于格式选择就被 YouTube
      # 拦成「Sign in to confirm you're not a bot」。只装 yt-dlp-ejs 不够；
      # web/mweb 的媒体流还需要 GVS PO token。match-reel / frame-grab 已经走
      # 这套 provider，这里补齐，避免采访线对同一来源静默退到不可下载客户端。
      - name: 启动 YouTube PO token provider
        if: github.event.inputs.mode != 'push'
        timeout-minutes: 3
        run: |
          pip install -q bgutil-ytdlp-pot-provider
          docker run --name bgutil-pot -d -p 4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider
          READY=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4416/ping; then
              READY=1
              break
            fi
            sleep 1
          done
          [ "$READY" = 1 ] || {
            docker logs bgutil-pot 2>&1 | tail -30 || true
            echo "::error::PO token provider 没有就绪"
            exit 1
          }

      # **切行这一步现在也只能在 runner 上跑。** 沙箱原来还取得到字幕（见顶上
      # 那段注释），2026-08-02 起整个 extractor 都吃 `Sign in to confirm you're
      # not a bot`——两条视频、两种取法都一样，是 IP 不是单条视频。而 cookie
      # 只存在 Actions secret 里，所以给「取字幕」单开一个 mode。
      #
      # **产物同时 print 进日志**：artifact 在沙箱里下不下来（api.github.com 是
      # 403），只写文件等于我看不见。`--stage subs` 在 spec 的 `zh` 还空着的时候
      # 本来就会把切好的每一行逐条打出来，正好是要的那份。
      - name: 取字幕切行
        if: github.event.inputs.mode == 'subs'
        env:
          COOKIES: ${{ steps.cookies.outputs.path }}
        run: |
          set -o pipefail
          SPEC="specs/interviews/${{ github.event.inputs.slug }}.json"
          PYTHONPATH=src python tools/build_interview_clip.py --spec "$SPEC" --stage subs

      # **封面排在最前面，紧跟源片下载——在转写校验和编码之前就验掉。**
      #
      # 来路（2026-09-27 返工审计）：「验封面视觉」原来排在「剪 + 烧字幕」**后面**，
      # 14 趟 run（74.8 runner-分钟）红在那儿，每一趟都先付了一整趟编码（中位
      # 148 秒，`bu-jodar` 那趟 487.9 秒）才知道封面那一帧不行——而这道闸只要
      # poster.jpg，源片一下完就有。CLAUDE.md「封面排在最前面，紧跟选题」说的
      # 就是这件事：唯一可能整条卡住的输入，别放在链条末端。
      #
      # 两个 mode 走**同一步**（同一份 `--stage cover`、同一把本地像素闸，不许分叉）：
      #   cover  —— 预览档：先 `--stage cover-scan` 把 frame_at 前后一段逐格过同一
      #             道闸，`cover_candidates.json` 随这一趟提交、候选墙只走 artifact
      #             ——挑帧从「一趟试一帧」变成「一趟扫一段」（monfils 那条前九趟
      #             都在赌）。⚠️ **frame_at 没过闸（或者渲不出海报）、这一步红着退出时，记录照样先提交**：
      #             那正是这份记录最有用的时候（下一帧该挑哪个），而红了之后
      #             「提交成片」那一步不会跑。排名表在错误旁边再印一遍。
      #   render —— 出片档：`--keep-source` 把源片留给后面的「剪 + 烧字幕」
      #             （`yt_download` 见文件在就复用，不下第二遍）。闸红了就地扫一段
      #             **并自动换帧**（`--autopick`，2026-09-28）：扫出来的格子里挑一格
      #             过闸＋认得出是封面主角（match，而且是文案点了名的人）＋睁眼（open）的，改写 spec 的
      #             `cover.frame_at`、重渲海报、再过一遍同一把终审，接着出片；近处
      #             没有就整段采访粗扫一遍。一格都挑不出来才红（并记一笔停车账：同一个
      #             封面满 3 趟，picker 就不再投——D2）。来路：9 趟 run（46.5
      #             runner-分钟）红在封面帧，cobolli-mensik 那趟就地扫出的第一名 29.4
      #             正是人后来写进 spec 的那一格——又等了一整趟（rework_audit_0928）。
      #             改过的 spec 由「提交成片」那一步和成片一起提交（见那一步的注释）
      # 出片之后「终审封面视觉」再对最终海报量一次（render 会重渲 poster.jpg，
      # 质检凭证绑的是那一份的哈希）。
      #
      # cookie 从 `COOKIES` 环境变量走（`cookie_args()` 读它）。
      # 原来是把路径**写进 spec**、跑完再 `git checkout --` 撤掉——两个毛病：
      # 上一步 verify 拿不到（那段注入只在这一步），而且 secret 的路径会短暂
      # 落到仓库里的文件上。现在两步都只靠环境变量，那套动作整个删了。
      # **只出海报，不出片。** 2026-08-04 一晚渲了五趟，四趟是为了换封面——
      # 每趟六分钟、往仓库里永久塞一个 50~70 MB 的 blob，而真正变的只有第一帧。
      # 走这一档：下源片 → 抽帧 → 渲海报 → 删源片，**一个 mp4 都不产生**。
      #
      # ⚠️ **这一步也要 `COOKIES`，它一样要下源片。** 上面那句「两步都只靠环境
      # 变量」是 `verify` / `render` 两步时代写的，而 `cover` 是后来加的
      # （#174），**加的时候没跟着注入**——又一次「加新能力就要同时改三处」。
      # 它躺了三天没出声，因为在此之前走这条线的都是 Brightcove 源（不要
      # cookie）；换成 YouTube 的第一条（`sabalenka-zhang-tor2026-r3`）连撞三趟
      # `Sign in to confirm you're not a bot`，而日志上一行写着「已写入
      # cookies（25 行）」、下一行写着「COOKIES=未设置」。
      # 判据 `test_会下源片的每一步都要拿到cookie` 自己推导，不维护白名单。
      - name: 出封面并验视觉（完全本地，排在转写和编码之前）
        if: >-
          github.event.inputs.mode == 'render' ||
          github.event.inputs.mode == 'cover'
        env:
          COOKIES: ${{ steps.cookies.outputs.path }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          set -o pipefail
          SLUG="${{ github.event.inputs.slug }}"
          SPEC="specs/interviews/$SLUG.json"
          OUTDIR="output/interviews/$SLUG"
          KEEP=""
          if [ "$MODE" = "render" ]; then
            KEEP="--keep-source"
            python tools/video_sla.py mark --timeline "$RUNNER_TEMP/production-timeline.json" --phase cover_audit
          fi
          # cover 档红着退出之前**先交扫描记录**。两条红路都走它：`--stage cover`
          # 自己红（比如 frame_at 越过视频流最后一帧抛 NoFrameAt——而扫描刚把
          # 那一格记成「没有画面」，正是最该交上去的那份）和像素闸没过。
          # 写成函数、两处调同一份：原来提交那几行只写在像素闸那一支里，
          # `--stage cover` 一红，`bash -e` 当场结束这一步，刚写好的记录跟着
          # runner 一起没了（review 2026-09-27）。
          commit_scan_record() {
            echo "::error::$1 扫描记录照样提交（下一趟挑帧、推送前对账都要它），候选排名再印一遍："
            PYTHONPATH=src python tools/interview_cover_scan.py --report --spec "$SPEC" \
              || echo "::warning::排名表没印出来（记录读不了）"
            REC="$OUTDIR/cover_candidates.json"
            [ -f "$REC" ] || return 0
            git config user.name "Claude"
            git config user.email "noreply@anthropic.com"
            git add "$REC"
            git diff --cached --quiet && return 0
            python tools/check_staged_file_sizes.py
            git commit -m "interview: $SLUG 封面扫描记录（$2）"
            source tools/git_push_retry.sh
            push_with_rebase_retry "${{ github.ref_name }}" 5 \
              || echo "::warning::扫描记录没推上去——上面那张排名表就是这一趟的全部产出"
          }
          # render 红在封面这一步、而同一个封面再投一趟照样红 → 记一笔停车账：同一个封面连着
          # 3 趟，picker 就不再投（D2，`pick_interview_renders.PARK_AFTER`）——不停就是 70 分钟
          # 一趟、永远红。三种红记同一个计数器（参数是 `PARK_KINDS`）：
          #   autopick —— 自动换帧一格都挑不出来（`--autopick` 退出 3）
          #   audit    —— 自动换上的那一帧终审还红（扫描和终审分叉）
          #   check    —— 终审过了、推送前对账红（D3 的边：记录说没过，runner 上却过了）
          # 人脸模型整趟不可用（退出 4）和工具自己坏了（别的非零）**故意不记**：环境／工具的事。
          # **只在 main 上记**：picker 只在 main 上投、只读 main 上的账；分支上记一笔会推到分支、
          # 跟着合并进 main，替一条在 main 上没红过的封面停车——分支上只告警。
          # 指纹按**派发时**那份 spec 算（HEAD 里的；自动换帧会就地改写工作区那份，picker 比的是
          # main 上的）。只提交状态文件；扫描记录照旧**不**提交（红着的 render 不留记录）。
          # 记不上／推不上只告警：多烧一趟，不会卡死。
          note_autopick_failure() {
            local kind="$1"
            if [ "${{ github.ref_name }}" != "main" ]; then
              echo "::warning::这一趟跑在 ${{ github.ref_name }} 上，不记停车账（$kind）——picker 只在 main 上投、只读 main 上的账，分支上记一笔会跟着合并替 main 停车"
              return 0
            fi
            local state="data/interview_render_dispatched.json"
            local base="$RUNNER_TEMP/interview_dispatch_base.json"
            local ours="$RUNNER_TEMP/interview_dispatch_ours.json"
            local dispatched="$RUNNER_TEMP/interview_spec_as_dispatched.json"
            git show "HEAD:$state" > "$base" 2>/dev/null \
              || echo '{"slugs": [], "at": {}, "spec_sha256": {}}' > "$base"
            if ! git show "HEAD:$SPEC" > "$dispatched"; then
              echo "::warning::取不到派发时那份 spec，停车账没记上——下一趟 picker 照旧会重投（多烧一趟，不会卡死）"
              return 0
            fi
            if ! PYTHONPATH=src python tools/pick_interview_renders.py --autopick-failed "$SLUG" \
                --kind "$kind" --dispatched-spec "$dispatched"; then
              echo "::warning::停车账没记上——下一趟 picker 照旧会重投（多烧一趟，不会卡死）"
              return 0
            fi
            cp "$state" "$ours"
            git config user.name "Claude"
            git config user.email "noreply@anthropic.com"
            git add "$state"
            git diff --cached --quiet && return 0
            git commit -m "data: $SLUG 封面那一步红了（$kind，停车账）"
            source tools/git_push_retry.sh
            push_interview_dispatch_retry "${{ github.ref_name }}" "$base" "$ours" 5 \
              || echo "::warning::停车账没推上去——下一趟 picker 照旧会重投（多烧一趟，不会卡死）"
          }
          if [ "$MODE" = "cover" ]; then
            PYTHONPATH=src python tools/build_interview_clip.py --spec "$SPEC" --stage cover-scan --keep-source
          fi
          if ! PYTHONPATH=src python tools/build_interview_clip.py --spec "$SPEC" --stage cover $KEEP; then
            if [ "$MODE" = "cover" ]; then
              commit_scan_record "封面没渲出来（--stage cover 自己红了，见上面的报错）。" "frame_at 渲不出海报"
            fi
            exit 1
          fi
          audit_cover() {
            PYTHONPATH=src python tools/audit_interview_cover.py \
              --spec "$SPEC" \
              --poster "$OUTDIR/poster.jpg" \
              --out "$OUTDIR/cover_visual_attestation.json"
          }
          if ! audit_cover; then
            if [ "$MODE" != "render" ]; then
              commit_scan_record "封面那一帧没过本地像素闸。" "frame_at 没过闸"
              exit 1
            fi
            # render：就地扫、自动换帧。换上的那一帧由扫描记录作证，所以这份记录
            # （连同改过的 spec）跟成片一起提交——原来「render 红了扫的那份不提交」
            # 是因为 frame_at 还没换、自动链认领不了一份跟它对不上的记录；现在
            # frame_at 就是记录里挑出来的那一格，推送前对账（cover_scan_gate）正要它。
            echo "::warning::封面那一帧没过本地像素闸——就地扫 frame_at 前后一段，挑一格过闸、认得出是封面主角、眼睛睁着的自动换上（近处没有就整段采访粗扫一遍）："
            rc=0
            PYTHONPATH=src python tools/build_interview_clip.py --spec "$SPEC" --stage cover-scan --keep-source --autopick || rc=$?
            if [ "$rc" -ne 0 ]; then
              if [ "$rc" -eq 3 ]; then
                echo "::error::扫过的格子里没有一格同时过闸、认得出是封面主角（文案点了名的人）、眼睛睁着——停在转写校验和编码之前。上面那张排名表就是下一帧的候选（✓ 那一列）。记一笔停车账（同一个封面满 3 趟就不再自动投）："
                note_autopick_failure autopick
              elif [ "$rc" -eq 4 ]; then
                echo "::error::人脸模型整趟不可用，一格都没认成人——环境的事，不记停车账，下一趟照常重投。"
              else
                echo "::error::封面扫描本身出错了（退出码 $rc，见上面的报错）——工具的事，不记停车账。"
              fi
              exit 1
            fi
            rc=0
            audit_cover || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::自动换上的那一帧终审没过——扫描和终审是同一份实现，分叉了就是 bug，不许带着它出片。"
              # 同一个封面再投一趟换上的还是这一帧、终审还红：退出 1（判了不合格）才记停车账；
              # 2 是输入缺了（找不到海报／spec），不是封面的事
              if [ "$rc" -eq 1 ]; then note_autopick_failure audit; fi
              exit 1
            fi
            touch "$RUNNER_TEMP/cover-autopicked"
            echo "::warning::封面自动换帧了（新旧秒数和理由见上面 [封面自动换帧] 那一行，记在 spec 的 cover._frame_autopick）——改过的 spec 跟成片一起提交"
          fi
          # 扫描记录提交过的话，frame_at 必须是其中过闸的那一格；推送前 auto_push_interview_gate 再对一次。
          # render 红在这儿也记停车账（check）：D3 放行的那种——已提交的记录说 frame_at 没过、记录里
          # 有一格 render 会换上的，可 runner 上这一帧过了闸、不换帧，对账拿那份记录一比就红；
          # 同一份封面＋同一份记录再投一趟还是红。重扫（mode=cover）一换记录就从头数
          rc=0
          PYTHONPATH=src python tools/interview_cover_scan.py --check --spec "$SPEC" || rc=$?
          if [ "$rc" -ne 0 ]; then
            if [ "$MODE" = "render" ] && [ "$rc" -eq 1 ]; then
              echo "::error::封面过了终审、推送前对账红了（原因见上一行）——记一笔停车账（同一个封面、同一份扫描记录满 3 趟就不再自动投）："
              note_autopick_failure check
            fi
            exit "$rc"
          fi

      # **先验转写，再出片。** 这是英语学习素材，发错的英文比没有更糟。
      # YouTube 的自动字幕实测错得不轻（人名、整句语法不成立、`respect to her`
      # 其实是 `for her`），而它自己那两条轨（en / en-orig）逐词完全一致，
      # 拿来交叉验证是自欺。所以在这儿跑第二份 ASR 对一遍，分歧超过闸门直接失败。
      #
      # 另有一道**不联网**的闸跟着每个 stage 跑（`check_human_quote`）：拿赛事
      # 官网战报里的人工引语对 ASR。它只覆盖记者抄走的那几句，但**是人转写的**，
      # 比任何 ASR 都硬。
      #
      # 上面两道比的都是「源说了什么」，**谁也不管「源什么都没说」**——伊埃拉
      # 那条就这么漏了 3.2 秒：她对着菲律宾球迷开口，自动字幕在那一段连一个
      # 事件都没有，没有词就没有分歧，两道闸全绿。第三道 `caption_gaps` 专查
      # 空白，`probe_gap_speech` 把第二份 ASR 在那几秒里听到的词摊出来
      # （**用已经跑完的那一份**，不下第二个模型）。它没听出词来**不等于没人
      # 说话**——small.en 对着非英语同样是空白，那一档交给人听。
      #
      # 三道闸都在这一步暴露——报告落在 output/interviews/<slug>/
      # {transcript_diff,human_quote_diff,caption_gaps}.md，
      # 失败时看 artifact（下面 `if: always()` 那步会把整个 outdir 传上来）。
      - name: 转写交叉校验
        if: github.event.inputs.mode == 'render'
        env:
          COOKIES: ${{ steps.cookies.outputs.path }}
        run: |
          set -o pipefail
          SPEC="specs/interviews/${{ github.event.inputs.slug }}.json"
          python tools/video_sla.py mark --timeline "$RUNNER_TEMP/production-timeline.json" --phase asr_verify
          PYTHONPATH=src python tools/build_interview_clip.py --spec "$SPEC" --stage verify

      # 口播走共享 tts_one 内容缓存；以前 runner 每趟丢失它、重合成同一句。
      # 输入稳定时命中主键，不再把同一份缓存按 run_id 重复上传。
      - name: 缓存解读卡 TTS
        if: github.event.inputs.mode == 'render'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tennislive-tts
          key: interview-tts-v1-${{ inputs.slug }}-${{ hashFiles('src/tennislive/video/tts.py', 'src/tennislive/video/azure_tts.py') }}-${{ hashFiles(format('specs/interviews/{0}.json', inputs.slug), 'tools/build_interview_clip.py', 'src/tennislive/video/explainer.py', 'src/tennislive/video/pronounce.py') }}
          restore-keys: |
            interview-tts-v1-${{ inputs.slug }}-${{ hashFiles('src/tennislive/video/tts.py', 'src/tennislive/video/azure_tts.py') }}-

      - name: 剪 + 烧字幕
        if: github.event.inputs.mode == 'render'
        env:
          COOKIES: ${{ steps.cookies.outputs.path }}
        run: |
          set -o pipefail
          SLUG="${{ github.event.inputs.slug }}"
          SPEC="specs/interviews/$SLUG.json"
          OUTDIR="output/interviews/$SLUG"
          # 600 秒是性能目标，不是发布硬闸。内容完整与质检优先；超线由
          # `finish` 记 FAIL / warning，但后续 L2 与自动发布继续执行。
          python tools/video_sla.py mark --timeline "$RUNNER_TEMP/production-timeline.json" --phase render
          RENDER_STARTED=$(date -u +%FT%TZ)
          PYTHONPATH=src python tools/build_interview_clip.py \
            --spec "$SPEC" --stage render
          python tools/video_sla.py finish --spec "$SPEC" --timeline "$RUNNER_TEMP/production-timeline.json" \
            --received-at "${{ steps.production_clock.outputs.received_at }}" \
            --render-started-at "$RENDER_STARTED" \
            --artifact "$OUTDIR/$SLUG.mp4" \
            --metadata "$OUTDIR/render.json" \
            --pipeline interview-clip --slug "$SLUG" \
            --summary "$GITHUB_STEP_SUMMARY"

      # 直接审核最终 poster，而不是相信 cover._why 或缩略图墙。两者都曾写着
      # 「费德勒本人中近景」，最终海报却一版是家属席、一版是人物很小的全景。
      # 不调用 DeepSeek/MiniMax，不需要外部 key。OpenCV 不可用、尺寸/解码失败、
      # 人脸不够正/大/清楚或近景 zoom/focus 合同不合格，一律红灯。
      # ⚠️ **拦人的那一道已经挪到「出封面并验视觉」**（编码之前，cover/render
      # 两档都过）。这一步只剩 render：`render()` 会从同一帧**重渲**一遍
      # poster.jpg，而 L2 质检凭证绑的是最终那份的哈希——对最终海报再量一次、
      # 重写凭证，一秒钟。
      - name: 终审封面视觉（出片后的最终海报，完全本地）
        if: github.event.inputs.mode == 'render'
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          SPEC="specs/interviews/$SLUG.json"
          OUTDIR="output/interviews/$SLUG"
          # 认人／睁眼的结果只并进**这一趟刚写的** render.json：`mode=cover` 只换海报，
          # outdir 里那份 render.json 是上一版成片的，不许往里记这张新海报的账。
          RENDER_JSON=()
          if [ "${{ github.event.inputs.mode }}" = "render" ]; then
            RENDER_JSON=(--render-json "$OUTDIR/render.json")
          fi
          PYTHONPATH=src python tools/audit_interview_cover.py \
            --spec "$SPEC" \
            --poster "$OUTDIR/poster.jpg" \
            --out "$OUTDIR/cover_visual_attestation.json" "${RENDER_JSON[@]}"

      # **查产物，不查信号。** 步骤 success 不等于成片存在——探一下文件和时长。
      # 2026-08-15 起升级成完整 L2 成片落地闸（docs/qa-contract.md §三）：
      # 原来只 `test -s` + ffprobe 时长，**不查分辨率、不查音画等长、不查字幕**。
      # 采访片这条线一直缺这道闸，出问题只有等账号所有者回头翻微信才发现。
      - name: 验成片（L2 成片落地闸）
        if: github.event.inputs.mode == 'render'
        run: |
          OUT="output/interviews/${{ github.event.inputs.slug }}/${{ github.event.inputs.slug }}.mp4"
          test -s "$OUT" || { echo "成片不存在或是空的：$OUT"; exit 1; }
          python tools/video_sla.py mark --timeline "$RUNNER_TEMP/production-timeline.json" --phase qc
          PYTHONPATH=src python tools/check_interview_landed.py \
            --slug "${{ github.event.inputs.slug }}" --film "$OUT" \
            --write-attestation

      # **采访成片一律发到 Release，不进 git。**（2026-08-13 起）
      #
      # 来路：账号所有者 2026-08-13「当前代码库太大了，好多资源是不是不用
      # 放在这里代码库里」。量出来 .git 已经 6.0 GB，其中 mp4 blob 4.93 GB，
      # 这条线的成片 20~67 MiB 一条条全在里面。原来这一步只在成片超过
      # 95 MiB 时才走 Release——而采访成片**从来没超过 95 MiB**，所以
      # Release 分支上线以来**一次都没走到过**，每条成片照旧进 git。
      # 一个从来没被走到的兜底，正是「兜底出事的时候不吭声」的形状：
      # 它每趟都绿着，同时把每条 mp4 静静放进 git 历史。
      #
      # 存量已进 git 的采访成片**留着不动**——链接钉在 main 的文件路径上，
      # 已发的微信消息收不回来，删文件就是把老消息变成死链。只改增量：
      # 从这天起一律传 Release、把链接写进 `render.json` 的 `video_url`、
      # **删掉本地那份**（让清理和提交步骤根本看不见它）。
      # `push_reel.released_video_url()` 本来就优先读 `video_url`，下游不用改。
      #
      # 为什么是 Release 而不是 LFS：LFS 免费额度只有 1 GB/月流量，而且
      # `raw.githubusercontent.com` 对 LFS 文件返回的是**指针文本不是视频**，
      # 微信里那个 ▶ 按钮直接坏掉。详见 match-reel.yml 的 Release 那一步的注释。
      # ⚠️ **这一步必须排在「验成片」之后**：验的就是这份本地文件，
      # 这儿 `rm` 之后就没得验了。
      # ⚠️ **只在 `render` 才跑，`cover` 一律不跑。** `--stage cover` 的
      # docstring 白纸黑字写着「**没有出片**：确认好看再跑 `--stage render`，
      # 这样一条片子只往仓库里塞一个 mp4」——它删源片、渲海报，从不落
      # `$SLUG.mp4`。这一步原来两档都跑，`stat` 一个不存在的文件直接
      # `cannot statx ... No such file or directory`，整条 `mode=cover`
      # 的 run 在这儿栽倒，从来没能验证过 cookie／client 梯子那两个修复。
      - name: 成片发到 Release（不进 git）
        if: github.event.inputs.mode == 'render'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/video_sla.py mark --timeline "$RUNNER_TEMP/production-timeline.json" --phase qc_passed --metadata "output/interviews/${{ github.event.inputs.slug }}/render.json"
          SLUG="${{ github.event.inputs.slug }}"
          OUTDIR="output/interviews/$SLUG"
          CLIP="$OUTDIR/$SLUG.mp4"
          # SZ 留着：render.json 的 video_bytes 从它来
          SZ=$(stat -c%s "$CLIP")
          TAG="interview-$SLUG"
          echo "成片 $((SZ/1048576)) MiB —— 发到 Release $TAG"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "赛后开麦 · $SLUG" \
                 --notes "双语字幕成片。采访成片一律走 Release 附件，不进 git。"
          # **传附件要重试**（照 match-reel.yml 同一步骤抄的，注释也抄）。
          # 来路是 2026-08-13 李娜那条（run 31709569579）：render 跑了
          # 14 分 27 秒、质检也过了，死在 `--clobber` 撞上 GitHub 自己的
          # HTTP 500。这条线原来裸调一次无所谓——体积闸在前面，一年走不到
          # 几次；改成**每趟 render 都走**之后，一次瞬时 5xx 报销的就是
          # 整趟 render。重发是安全的：`--clobber` 幂等，删到一半再传一遍就好。
          # ⚠️ 循环里不许写 `[ A ] && break`——`bash -e` 下 AND 列表整条为假
          # 会直接把这一步杀掉（下面探活那段的注释记的是同一个坑）。一律用 if。
          UPLOADED=0
          for i in 1 2 3 4; do
            if gh release upload "$TAG" "$CLIP" --clobber; then UPLOADED=1; break; fi
            if [ "$i" != 4 ]; then
              WAIT=$((5 * i * i))
              echo "第 $i 次传 Release 附件没成，${WAIT}s 后重试"
              sleep "$WAIT"
            fi
          done
          [ "$UPLOADED" = 1 ] || {
            echo "::error::Release 附件传了 4 次都没上去"; exit 1; }
          # `--clobber` 只说明 API 调用成功，不能证明同 slug 的附件已经换成
          # **本趟这份字节**。旧附件和新附件的公开 URL 完全一样；只探 200/206
          # 会被旧 CDN 缓存骗绿，随后 render.json 却会记下新 film_sha256，形成
          # 「账上是新片、Release 实际还是旧片」。读取当前 Release asset 的
          # GitHub 原生 `digest`（它绑定 asset id 与远端完整字节）核对 SHA；没
          # 对上就不写 render.json、更不会推微信。成片可到 500 MiB，不为了验
          # hash 再整片下载一遍。
          EXPECTED_SHA=$(python -c \
            'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["film_sha256"])' \
            "$OUTDIR/qc_attestation.json")
          RELEASE_META="$RUNNER_TEMP/interview-release-$SLUG.json"
          VERIFIED=0
          for i in 1 2 3 4; do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RELEASE_META"; then
              REMOTE_DIGEST=$(python -c \
                'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); n=sys.argv[2]; print(next((a.get("digest") or "" for a in d.get("assets", []) if a.get("name") == n), ""))' \
                "$RELEASE_META" "$SLUG.mp4")
              if [ "$REMOTE_DIGEST" = "sha256:$EXPECTED_SHA" ]; then
                VERIFIED=1
                break
              fi
              echo "::warning::Release asset digest 仍不是本趟成片（第 $i/4 次）：$REMOTE_DIGEST"
            else
              echo "::warning::Release asset 元数据读取失败（第 $i/4 次）"
            fi
            if [ "$i" != 4 ]; then sleep $((5 * i)); fi
          done
          rm -f "$RELEASE_META"
          [ "$VERIFIED" = 1 ] || {
            echo "::error::同 slug Release 附件没有替换成本趟成片（期望 $EXPECTED_SHA）";
            exit 1;
          }
          echo "Release asset digest 已绑定本趟成片：$EXPECTED_SHA"
          # 同 slug 的路径会复用；新推送必须带成片指纹，避免微信/CDN 仍命中旧
          # URL 缓存。查询参数实测仍会 302 到当前 release asset。
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$SLUG.mp4?v=${EXPECTED_SHA:0:16}"
          # **传完自己探一次**：Release 的 CDN 有几秒传播延迟，探不到就别写链接
          # ——写了等于把一个 404 发到微信，而消息发出去收不回来。
          # ⚠️ 循环体最后一句不许写成 `[ A ] || [ B ] && break`：整条 AND-OR
          # 列表为假时 `bash -e` 会直接把这一步杀掉，看着像「探活失败」，
          # 其实是第一次没中就退出了。用 if。
          for i in 1 2 3 4 5 6 7 8; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -L -r 0-99 "$URL" || echo 000)
            if [ "$CODE" = "206" ] || [ "$CODE" = "200" ]; then break; fi
            echo "第 $i 次探活 $CODE，5s 后重试"
            sleep 5
          done
          [ "$CODE" = "206" ] || [ "$CODE" = "200" ] || {
            echo "::error::Release 附件 $URL 探不到（$CODE）"; exit 1; }
          echo "Release 附件可取：$URL"
          python - "$OUTDIR/render.json" "$OUTDIR/qc_attestation.json" "$URL" "$SZ" "$REMOTE_DIGEST" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          path, qc_path, url, size, release_digest = (
              Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3], int(sys.argv[4]), sys.argv[5])
          # 这条线原来不写 render.json，所以要允许它还不存在
          data = json.loads(path.read_text(encoding="utf-8")) if path.is_file() else {}
          qc = json.loads(qc_path.read_text(encoding="utf-8"))
          data["video_url"] = url
          data["video_bytes"] = size
          data["film_sha256"] = qc["film_sha256"]
          data["release_asset_digest"] = release_digest
          data["qc_attestation_sha256"] = hashlib.sha256(qc_path.read_bytes()).hexdigest()
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                          encoding="utf-8")
          print("render.json 记下 video_url + QC 成片哈希 + Release asset digest")
          PY
          rm -f "$CLIP"

      # **复制页要在提交之前写。** 这一步只落文件，由下面的提交步骤带进仓库；
      # 真正发微信排在提交之后（GitHub Pages 只服务 main，链接才取得到）。
      # 这条规矩在别的线上踩过四次，别在这儿再踩第五次。
      # 对阵 / 比分 / 赛事**从 spec 读**，不做成 dispatch 的输入——手打两遍必分叉。
      - name: 取推送用的字段
        id: push_meta
        if: github.event.inputs.push == 'true'
        run: |
          PYTHONPATH=src python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          d = json.loads(pathlib.Path(
              f"specs/interviews/{os.environ['SLUG']}.json").read_text(encoding="utf-8"))
          push = d.get("push") or {}
          for k in ("matchup", "score", "event", "summary", "lead"):
              v = str(push.get(k, "")).strip()
              # `$GITHUB_OUTPUT` 是一行一个 `k=v`：值里有换行会把后面的行吃掉，
              # 而且**不报错**，只是下游少拿到几个字段。
              if "\n" in v:
                  raise SystemExit(f"push.{k} 里有换行，塞不进 GITHUB_OUTPUT")
              if k == "matchup" and not v:
                  raise SystemExit("spec 的 push.matchup 是空的，推送标题拼不出来")
              print(f"{k}={v}")
          PY
        env:
          SLUG: ${{ github.event.inputs.slug }}

      - name: 写复制页（必须排在提交之前）
        if: github.event.inputs.push == 'true'
        run: |
          COPY="specs/interviews/${{ github.event.inputs.slug }}.xhs.txt"
          test -f "$COPY" || { echo "::error::找不到 $COPY"; exit 1; }
          PYTHONPATH=src python tools/push_reel.py --stage page \
            --outdir "output/interviews/${{ github.event.inputs.slug }}" \
            --matchup "${{ steps.push_meta.outputs.matchup }}" \
            --score "${{ steps.push_meta.outputs.score }}" \
            --event "${{ steps.push_meta.outputs.event }}" \
            --summary "${{ steps.push_meta.outputs.summary }}" \
            --date "$(TZ=Asia/Shanghai date +%F)" \
            --copy "$COPY"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: 提交成片
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          # **中间物一个都别留。** 只列 `source.mp4` 是不够的——第七趟出片时
          # 跟着进仓库的还有 `_audio.m4a`（6.6 MB，verify 下的音轨）、
          # `cover.html`（**12.5 MB**，字体 base64 内嵌进去的那份）、
          # `whisper.json`。三样加起来比成片的三分之一还多，而且每条片子来一份。
          # 判据落在 `test_中间物不许进仓库`：出片目录里只许留下面这几种。
          D="output/interviews/${{ github.event.inputs.slug }}"
          # ⚠️ **清理清单里的名字会过时。** 封面从 `cover.jpg` 改叫 `poster.jpg` 之后，
          # 它旁边那份内嵌字体的 HTML 就叫 `poster.html`（**12.4 MB**），
          # 而这一行还写着 `cover.html`——于是它跟着进了仓库。所以按后缀清，
          # 别按名字：`.html` 里只有 `copy.html` 是产物（Pages 要服务它）。
          find "$D" -maxdepth 1 -name "*.html" ! -name "copy.html" -delete
          rm -f "$D"/source.* "$D"/whisper.json
          # 本地质检稿和一次性重建脚本不是成片。成都捧杯那条把
          # `landed-check.txt`、`reconstruction.py`、`independent-qc/` 交进了仓库，
          # `test_中间物不许进仓库` 按「不在保留名单里」红。目录用 rm -rf。
          rm -rf "$D"/independent-qc
          rm -f "$D"/landed-check.txt "$D"/reconstruction.py
          # ⚠️ **`_` 开头的按前缀清，别按名字列。** 这一行原来写的是
          # `"$D"/_audio.* "$D"/_logo_mask.png`——两个具体名字。解读卡加了
          # `_takeaway_close.png` 之后，它就跟着进了仓库（367 KB/条），而
          # `test_中间物不许进仓库` 拦所有 `_` 开头的编码中间物，
          # 仅保留 L2 必须复核的 `_lead.ass` 和 `_trail.ass`。
          # 上面那句注释自己写着「清理清单里的名字会过时」，这一行正是它说的那种。
          # ⚠️ 用 `rm -rf` 不是 `find -delete`：解读卡的口播合在 `_tkvoice_*/`
          # 这个**子目录**里（`synthesize_narration` 按索引命名 `voice_00.mp3`，
          # 和别人同一个目录会互相盖掉），而 `find -delete` 删不掉非空目录——
          # 它报一句错然后继续，于是那个目录连同里面的 mp3 静静进了仓库。
          # L2 的逐 cue 核验及哈希依赖这两份 ASS，不能把证据随编码中间物清掉。
          for intermediate in "$D"/_*; do
            case "$intermediate" in
              "$D"/_lead.ass|"$D"/_trail.ass) continue ;;
            esac
            rm -rf -- "$intermediate"
          done
          # 缩略图墙是**写 spec 时的工作台**，不是产物：挑完 `cover.frame_at`
          # 就没用了，而它一张 1.8 MB——这个仓库的 `output/` 已经 1.3 GB，
          # 每条片子再塞一张，代价会加在此后每一条工作流的 checkout 上。
          # 要看就本地 `--stage subs` 重生成（几百 KB 的 storyboard，不用 ffmpeg）；
          # 挑帧的理由留在 spec 的 `cover._why` 里，那才是持久的那一份。
          # ⚠️ **`mode=subs` 那趟不删**：storyboard 正是 subs 的产物之一——
          # 人挑帧要看的就是它，而它只从 artifact 走（`.gitignore` 里
          # `output/**/storyboard.jpg` 挡着，不会进仓库）。这一步排在
          # upload-artifact **之前**，subs 那趟删掉它，artifact 里就只剩
          # 字幕行，挑帧的人两手空空——「工作台」被自己的清理步骤收走了。
          if [ "$MODE" != "subs" ]; then rm -f "$D"/storyboard.jpg; fi
          # 封面**候选墙**（`--stage cover-scan`）是同一种工作台，同一套处置：一张
          # 约 0.6 MB、每趟 mode=cover 一张，只走 artifact；`.gitignore` 里
          # `output/**/cover_scan_sheet.jpg` 挡着，`git add "$D"` 吃不进去。
          # **`mode=cover` 那趟不删**——它正是那一趟要交给人看的东西，而这一步排在
          # upload-artifact 之前。进仓库的是几 KB 的 `cover_candidates.json`
          # （推送前对账要的就是它）。判据 `test_缩略图墙两头都不许进仓库`。
          if [ "$MODE" != "cover" ]; then rm -f "$D"/cover_scan_sheet.jpg; fi
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          # 用 `$D`，别把这个路径再写一遍——下面重放那几行清的、放回来的、
          # 重新 add 的必须**和这里 add 的是同一格**，写两处必分叉，而分叉的
          # 样子是「重放放回来的不是刚提交的那一格」，不报错。
          git add "$D"
          # **封面前置那一步自动换过帧，改过的 spec 跟成片一起提交**（2026-09-28）。
          # 这一趟的 QC／封面凭证绑的是**换帧之后**那一版 spec 的哈希：只提交产物不提交
          # spec，main 上 spec 的哈希就对不上凭证——`auto_push_interview_gate` 报「spec
          # 在质检后发生过变化」不推，`pick_interview_renders` 判「当前 spec 没出过片」
          # 过 70 分钟又投一趟，那一趟再红、再换，**永远落不了地**。标记只由封面那一步写。
          # O4（reel-cover-upgrade）换赛场之上的封面也是连 spec 一起提交的，同一个做法。
          # ⚠️ 只在 render 档：标记本来只由 render 的封面那一步写，这里再按 MODE 拦一道，
          # subs 那一档（和人改 spec 并行跑）就**结构上**碰不到 spec——判据
          # `test_subs那一趟只提交自己那一格` 认的就是这个 MODE 守卫。
          AUTOPICK_SPEC=""
          if [ "$MODE" = "render" ] && [ -f "$RUNNER_TEMP/cover-autopicked" ]; then
            AUTOPICK_SPEC="specs/interviews/${{ github.event.inputs.slug }}.json"
            git add "$AUTOPICK_SPEC"
          fi
          git diff --cached --quiet && { echo "没有变化"; exit 0; }
          # **体积闸**：渲完一整趟才被 GitHub 拒收（推分支吃 HTTP 413）是最贵
          # 的失败方式，而这个仓库的 .git 已经 1.77 GiB。判据自动推导——凡是
          # `git commit` 的工作流都要有这一行（`test_every_workflow_that_
          # commits_generated_files_has_a_size_gate`），不维护白名单。
          python tools/check_staged_file_sizes.py
          BRANCH="${{ github.ref_name }}"
          MSG="interview: ${{ github.event.inputs.slug }} 双语字幕成片"
          if [ -n "$AUTOPICK_SPEC" ]; then MSG="$MSG（封面自动换帧，spec 的 cover._frame_autopick 记着新旧秒数）"; fi
          git commit -m "$MSG"
          # ⚠️ **2026-08-13：这里原来是 `git pull --rebase` ＋ `&& break`，
          # 两个毛病叠在一起，而合成仓库上一跑就全现形了。**
          #
          # ① **rebase 过不去。** 另一趟同 slug 的 run 抢先落库时，冲突的正是
          #    `poster.jpg`（二进制，git 明说 `Cannot merge binary files`）和
          #    `lines.json`（纯文本，一样冲突——跟文件类型无关）。第 1 次死在
          #    冲突里，之后每一次都是 `Pulling is not possible because you have
          #    unmerged files`，跑完 `.git/rebase-merge` 还留在那儿。
          #    `explainer.yml` / `match-reel.yml` / `frame-grab.yml` 三条线
          #    早就为这个把 `pull --rebase` 换掉了，这条线没跟上。
          #
          # ② **⭐ 更贵的是退出码 0——整步绿着过去，产物静默丢掉。**
          #    `bash -e` 下 AND-OR 列表里非末尾命令失败不触发退出，而循环体
          #    最后一句是 `sleep`（必成功），于是循环耗尽之后这一步正常结束。
          #    实测：`for i in 1 2 3 4; do false && echo push && break; sleep 0; done`
          #    退出码就是 0。而 `push` 默认是 false，那一趟后面没有任何步骤会
          #    再碰仓库——**整趟 run 从头绿到尾，没人会知道这一条没落库**。
          #    ⚠️ 同一个坑的注释就写在上面「成片发到 Release」那一步里
          #    （「循环里不许写 `[ A ] && break`」），只是没管到 60 行之外。
          #
          # 生成出来的产物只有一个正确解——本趟渲的这一份——所以不 merge，
          # **重放**到最新的分支上；重试是因为 main 还会再动。
          for attempt in $(seq 1 10); do
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "push 被拒（第 $attempt 次），把本条采访重放到最新的 $BRANCH 上"
            git fetch origin "$BRANCH"
            git branch -f rendered HEAD
            git reset --hard "origin/$BRANCH"
            # ⚠️ **先清空再放回来，顺序不许反。** `git checkout <ref> -- <dir>`
            # 只恢复 ref 里**存在**的文件，不会删掉 ref 里没有的——而上一句
            # `reset --hard` 刚把 origin 上那份旧成片放了回来。这条线尤其要紧：
            # 仓库里现在还躺着 16 个存量 slug 的 mp4，而上面「成片发到 Release」
            # 那一步 `rm -f "$CLIP"` 之后本趟提交是带着 `delete mode` 的。
            # 合成仓库上验过——**漏掉这一行，被删掉的 mp4 当场被重放救活**，
            # 于是仓库里留着旧片、真片在 Release 上，两个地址两条片子。
            # 两张工作台（缩略图墙、候选墙）不在 `rendered` 里（.gitignore 挡着），
            # `rm -rf` 之后 checkout 不会把它们放回来——先挪到一边、放回来之后再
            # add（`-A` 照样认 .gitignore），不然撞一次车 artifact 里就没墙了。
            # 本地复跑没有 RUNNER_TEMP；空值不能拼成根目录 /workbench。
            # 每次重放独占临时目录，也不能复用前一趟留下的同名墙。
            WB=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/interview-workbench.XXXXXX")
            trap 'rm -rf -- "$WB"' EXIT
            cp -f "$D"/storyboard.jpg "$D"/cover_scan_sheet.jpg "$WB"/ 2>/dev/null || true
            rm -rf "$D"
            git checkout rendered -- "$D"
            cp -f "$WB"/*.jpg "$D"/ 2>/dev/null || true
            rm -rf -- "$WB"
            git add -A "$D"
            # 换帧改过的 spec：只在别人**没动过**它的时候放回本趟那一版（比
            # `rendered^` 和最新分支上的 blob）。别人改过就留别人的——盖掉就是
            # 吞掉一次人工修改；这一趟的凭证于是对不上新 spec，推送闸不会拿旧凭证推。
            # ⚠️ **留别人的 spec，就连扫描记录也退回分支上那一份**（没有就不留）：
            # 本趟的记录要是落了库，别人那版 spec 的 frame_at（多半还是原来红的那一格）
            # 在 dispatch 之前的预检（`cover_scan_problem`）就红，picker 把它停进
            # waiting、等人改——本来按新 spec 重渲一趟、封面再红再自动换就行了
            # （2026-09-28 复审复现：「cover.frame_at=30.0 在扫描里没过闸」）。
            if [ -n "$AUTOPICK_SPEC" ]; then
              if [ "$(git rev-parse "rendered^:$AUTOPICK_SPEC")" = "$(git rev-parse "HEAD:$AUTOPICK_SPEC")" ]; then
                git checkout rendered -- "$AUTOPICK_SPEC"
                git add "$AUTOPICK_SPEC"
              else
                REC="$D/cover_candidates.json"
                git rm -q --cached --ignore-unmatch -- "$REC"
                rm -f "$REC"
                if git cat-file -e "HEAD:$REC" 2>/dev/null; then git checkout HEAD -- "$REC"; fi
                echo "::warning::$AUTOPICK_SPEC 在 $BRANCH 上被别人改过——不覆盖，扫描记录也留 $BRANCH 上那一份；本趟成片绑的是换帧后的那一版 spec，picker 会按新 spec 重渲（封面再红会再扫、再换）"
                AUTOPICK_SPEC=""
                MSG="interview: ${{ github.event.inputs.slug }} 双语字幕成片（封面换过帧，但 spec 撞上别人的修改、留了别人的）"
              fi
            fi
            python tools/check_staged_file_sizes.py
            git diff --cached --quiet || git commit -m "$MSG"
            # 退避带 jitter：固定间隔会让撞车的双方下一轮继续对撞。
            sleep $((attempt * 5 + RANDOM % 10))
          done
          echo "::error::连续 10 次推送失败；本条采访没有落库，别把它当成已发"
          exit 1

      # **第二份 ASR 在 subs 这一趟就跑，报告 render 之前就摊到桌上。**
      #
      # 来路（2026-09-27 返工审计）：第二份 ASR（spec 的 `whisper_model`）和空档
      # VAD 原来只在 `mode=render` 跑——10 趟 render 红在「两份转写对不上」「空档
      # 没销账」上（41.7 runner-分钟），每趟都是装完依赖、下完源片才知道英文漏了
      # 一句，中文跟着返工（alcaraz-fritz 三趟、tien-cobolli 两趟、chwalinska 一趟）。
      # 这两样只要音轨，跟出片无关。
      #
      # ⚠️ **排在「提交成片」之后，不是之前**：切好的英文行（lines.json）是写中文
      # 要等的那一份，它照旧一分多钟就落库；第二份 ASR 要三到五分钟，报告第二次
      # 提交。人在写中文的时候它在跑——「runner 在跑的时候别闲着」。
      # ⚠️ **先交报告再定颜色**：transcript_diff.md / caption_gaps.md /
      # gap_vad_attestation.json 正是修的依据，红着把它们扔掉这一趟就白跑了。
      # render 那头照旧再验（指纹没变且 transcript_verified 已置上才跳过，见
      # `transcript_fingerprint`）——这一步是**提前报**，不是替掉那道闸。
      # ⚠️ **报出分歧／空档不算红**（退出码 `VERIFY_FINDINGS_EXIT`＝3）：刚切出来、
      # 还没人核过的转写，有分歧、有没销账的空档是**常态**。第一版让它红，
      # 而 `tools/pipeline_health.py` 按 run 的 conclusion 数失败率——近 10 趟
      # 红 40% 或连着红 3 趟就推微信告警，一条天天喊狼来了的告警没人看。所以
      # 发现逐条印进日志、`::warning::` 收尾、run 绿着；render 照旧拦。
      # **工具坏了**（下不动音轨、模型起不来、同一个模型跑两遍）不是 3，照样红。
      # ⚠️ **这一步要跑三到五分钟，而 concurrency 按 slug 分组、`cancel-in-progress`**：
      # 这段时间里 dispatch 同 slug 的 `mode=cover`／`render` 会把这一趟掐掉，
      # 报告就丢了（lines.json 已经在前面落库，丢的只是第二份 ASR 的报告；render
      # 自己会再验一遍，丢的是「提前报」这份好处）。**同一个 slug 的几档串着发，
      # 别叠在对方还在跑的时候**：按 CLAUDE.md「封面排在最前面」先发 cover（两三
      # 分钟），它绿了再发 subs；反过来也行。不同 slug 之间互不掐，照样并行。
      # ⚠️ **模型缓存键和 render 同一把**（从「算第二份 ASR 模型」拿）：subs 下过的
      # 模型 render 直接用，反过来也一样。
      - name: 缓存第二份 ASR 模型（subs）
        if: github.event.inputs.mode == 'subs'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: faster-whisper-${{ runner.os }}-${{ steps.second_asr.outputs.model }}
          restore-keys: |
            faster-whisper-${{ runner.os }}-

      - name: 第二份 ASR 交叉校验并提交报告（subs）
        id: subs_verify
        if: github.event.inputs.mode == 'subs'
        env:
          COOKIES: ${{ steps.cookies.outputs.path }}
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          SPEC="specs/interviews/$SLUG.json"
          D="output/interviews/$SLUG"
          # 装在这儿不装在「装依赖（只取字幕）」：那一步排在取字幕之前，
          # 多装一个大包就把 lines.json 落库往后推——而写中文等的正是它。
          pip install -q faster-whisper "av==16.1.0"
          python -c "import faster_whisper"
          set +e
          PYTHONPATH=src python tools/build_interview_clip.py --spec "$SPEC" --stage verify
          STATUS=$?
          set -e
          # 中间物和「提交成片」同一套清法：`_` 开头的（_audio.m4a）、whisper.json、源片
          rm -rf "$D"/_*
          rm -f "$D"/source.* "$D"/whisper.json
          rm -rf "$D"/independent-qc
          rm -f "$D"/landed-check.txt "$D"/reconstruction.py
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add "$D"
          if git diff --cached --quiet; then
            echo "第二份 ASR 的报告没有变化"
          else
            python tools/check_staged_file_sizes.py
            git commit -m "interview: $SLUG 第二份 ASR 交叉校验报告"
            source tools/git_push_retry.sh
            if ! push_with_rebase_retry "${{ github.ref_name }}" 5; then
              echo "::error::第二份 ASR 的报告推不上去——render 会重新验，但这一趟的报告没落库"
              exit 1
            fi
          fi
          # 3 ＝ build_interview_clip.VERIFY_FINDINGS_EXIT：只有「要人核的发现」，工具本身跑完了
          if [ "$STATUS" = 3 ]; then
            echo "::warning::第二份 ASR 报了要人核的分歧／空档（上面逐条印着；报告已提交：$D/transcript_diff.md、caption_gaps.md、gap_vad_attestation.json）。人核之前这是常态，这一趟不算红；render 照旧会拦——修 en_fixed／认领 transcript_disagree_ok／销账 caption_gaps_ok"
            exit 0
          fi
          if [ "$STATUS" != 0 ]; then
            echo "::error::第二份 ASR 没跑成（退出码 $STATUS——不是「有分歧」，那是 3）：下不动音轨、模型起不来或 spec 配错了，看上面的报错"
            exit "$STATUS"
          fi
          echo "clean=true" >> "${GITHUB_OUTPUT:-/dev/null}"

      # **判定干净就叫醒自动出片，不干等定时班次。** 自动链（interview-auto-render）
      # 缺判定时先投的就是这一趟 subs；判定落库之后要它再判一次才会投 render——
      # 而这一步的提交用的是 GITHUB_TOKEN，**不触发**它的 on:push（`pages.yml` 那条规则），
      # 定时班次最多 10 分钟一趟、GitHub 还会丢 schedule 事件（CLAUDE.md 记过 25 小时没点过）。
      # 有要人核的发现（退出码 3）就不叫：它醒了也只会把这条放进等待名单。
      # 叫不醒不许把这趟打红——判定已经落库，下一趟定时班次照样接得上。
      - name: 叫醒自动出片（subs 交了干净的判定）
        if: >-
          github.event.inputs.mode == 'subs' &&
          steps.subs_verify.outputs.clean == 'true' &&
          github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh workflow run interview-auto-render.yml --ref main; then
            echo "[自动出片] 已叫醒 interview-auto-render——判定干净，它会按当前指纹投 render"
          else
            echo "::warning::叫不醒 interview-auto-render——判定已落库，下一趟定时班次照样接得上"
          fi

      # **叫醒自动推送——render 提交自己永远触发不了它。** 上一步的 push 用的
      # 是仓库自带的 GITHUB_TOKEN，GitHub 明文规定这种 push 不创建 workflow run
      # （防递归；`pages.yml` 那条记的同一条规则）。量过的代价：50 份
      # render.json / 0 份 pushed.json——auto-push-interview 的 on:push 从上线起
      # 一次都没为 render 醒来过。`workflow_dispatch` 正是那条禁令明文列出的
      # 例外，所以渲完点一下。
      #
      # 三个条件缺一不可：
      #   mode=render        —— 只有出片才有新东西可发（subs/cover/push 都没有）
      #   push != 'true'     —— 本趟自己要发的话，叫醒它就是同一条消息发两遍
      #                         的竞态（本趟的推送要等复制页最长 40 分钟，而
      #                         auto-push 那头看不到任何「正在发」的标记）
      #   ref_name == main   —— 分支上的产物 Pages 取不到，auto-push 那头也有
      #                         同一道闸，这儿先省一趟白跑
      #
      # ⚠️ 发不出去（比如并发限流）不许把整趟 render 打红——成片已经落库了，
      # 兜底是 auto-push-interview 手动 dispatch 一次（slug 留空扫全部也行）。
      - name: 叫醒自动推送
        if: >-
          github.event.inputs.mode == 'render' &&
          github.event.inputs.push != 'true' &&
          github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ github.event.inputs.slug }}
        run: |
          if gh workflow run auto-push-interview.yml --ref main -f "slug=$SLUG"; then
            echo "[自动推送] 已叫醒 auto-push-interview（slug=$SLUG）——"
            echo "  ⚠️ 204 只是信号：真发没发出去要看那条 run 自己的日志。"
          else
            echo "::warning::叫不醒 auto-push-interview——成片已落库，"
            echo "::warning::请手动 dispatch 一次 auto-push-interview（slug=$SLUG）。"
          fi

      - name: 推送前通过 L0/L2/幂等门禁
        id: manual_gate
        if: github.event.inputs.push == 'true'
        run: |
          [ "${{ github.ref_name }}" = "main" ] || {
            echo "::error::微信推送只允许 main：Pages、QC 和发布账本必须基于主干不可变产物"; exit 1; }
          FORCED=""
          if [ "${{ github.event.inputs.mode }}" = "push" ]; then FORCED="--forced"; fi
          python tools/auto_push_interview_gate.py $FORCED \
            --slug "${{ github.event.inputs.slug }}"

      - name: 预占发布账本（发送前）
        id: manual_reserve
        if: >-
          github.event.inputs.push == 'true' &&
          steps.manual_gate.outputs.found == 'true'
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          D="output/interviews/$SLUG"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python tools/auto_push_interview_gate.py --reserve "$D" --slug "$SLUG" \
            --run "$RUN_URL" --now "$(date -u +%FT%TZ)"
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add --sparse "data/interview_publish_ledger/$SLUG.json"
          python tools/check_staged_file_sizes.py
          git commit -m "interview: 预占推送 $SLUG"
          for attempt in 1 2 3 4 5; do
            if git push origin main; then exit 0; fi
            git pull --rebase origin main || { git rebase --abort || true; }
            sleep $((attempt * 3 + RANDOM % 5))
          done
          echo "::error::发送前账本未落库，不发送"
          exit 1

      # **「触发成功」不算推了，这一步 success 才算。** 而且它必须排在提交之后：
      # GitHub Pages 只服务 main，复制页没进 main 就取不到，按钮会被摘掉
      # （`drop_dead_copy_button` 发送前探一次）。这条在别的线上踩过四次。
      - name: 推送到微信
        if: >-
          github.event.inputs.push == 'true' &&
          steps.manual_gate.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          # **钉 commit，别停在 @main。** 同一条采访重渲，海报路径一模一样，
          # 而微信的图片缓存按**路径**算——URL 停在 @main 的话第二轮推出去的
          # 还是第一轮那张图，**而且不吭声**。reel 那两条线漏过同一个，
          # 这条线也漏了。
          TENNISLIVE_ASSET_REV: ${{ github.sha }}
          # **这个仓库的 Pages 构建明显比默认预算慢。** 实测：08:41 的提交能打开，
          # 08:54 的等了 14 分钟还是 404，而默认预算是 30×20s=10 分钟。
          # 仓库 1 GB+，每次构建要打包整站，越攒越慢。
          # 「等不到」和「没等够」长得一模一样，而代价完全不对称——多等只是让
          # runner 空转，等不够就是整条推送作废。给到 40 分钟。
          TENNISLIVE_COPYPAGE_ATTEMPTS: "60"
          TENNISLIVE_COPYPAGE_RETRY_SECONDS: "40"
        run: |
          COPY="specs/interviews/${{ github.event.inputs.slug }}.xhs.txt"
          # render/cover 的 poster 是本趟刚提交的；workflow 启动时的 github.sha
          # 还没有它。钉当前 HEAD，避免手动 push=true 把海报 URL 指向旧提交 404。
          export TENNISLIVE_ASSET_REV="$(git rev-parse HEAD)"
          PYTHONPATH=src python tools/push_reel.py \
            --outdir "output/interviews/${{ github.event.inputs.slug }}" \
            --matchup "${{ steps.push_meta.outputs.matchup }}" \
            --score "${{ steps.push_meta.outputs.score }}" \
            --event "${{ steps.push_meta.outputs.event }}" \
            --summary "${{ steps.push_meta.outputs.summary }}" \
            --date "$(TZ=Asia/Shanghai date +%F)" \
            --lead "${{ github.event.inputs.push_lead || steps.push_meta.outputs.lead }}" \
            --copy "$COPY" \
            --receipt-out "$RUNNER_TEMP/interview-pushplus-receipt.json"

      # **发完记一笔，而且必须进仓库**（照 auto-push-interview.yml 同名步骤
      # 抄的，注释也抄）。`pushed.json` 是「已经发过」的唯一判据——原来只有
      # 自动推送那条路会记，这条手动路发完**什么都不留**，于是 spec 开着
      # `push.auto` 的采访在这儿手动发过之后，下一次合并照样会被
      # auto-push-interview 判成「没推过」再发一遍，而微信那条消息收不回来。
      # ⚠️ **必须排在发微信之后**：反过来的话，推送失败会留下一个「已经发过」
      # 的假标记，这条采访从此再也发不出去，而且不吭声。这一步没有自己的
      # 状态函数，隐式 `success()`——上一步没发出去它就不会跑，顺序天然成立。
      # 记不进去也不算这一趟失败（消息已经发了），但要红出来让人看见。
      - name: 记下平台已经接收
        if: >-
          github.event.inputs.push == 'true' &&
          steps.manual_gate.outputs.found == 'true'
        run: |
          D="output/interviews/${{ github.event.inputs.slug }}"
          python tools/auto_push_interview_gate.py \
            --record "$D" \
            --slug "${{ github.event.inputs.slug }}" \
            --run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --now "$(date -u +%FT%TZ)" \
            --receipt-file "$RUNNER_TEMP/interview-pushplus-receipt.json"
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add --sparse \
            "data/interview_publish_ledger/${{ github.event.inputs.slug }}.json" \
            "$D/pushed.json"
          python tools/check_staged_file_sizes.py
          git commit -m "interview: ${{ github.event.inputs.slug }} PushPlus 已接收"
          # 标记是新文件、别的 run 不会碰同名路径（concurrency 按 slug 分组），
          # rebase 在这儿是安全的；真撞上冲突就放弃这一次、下一轮重试。
          for attempt in 1 2 3; do
            if git push origin "HEAD:${{ github.ref_name }}"; then exit 0; fi
            git pull --rebase origin "${{ github.ref_name }}" || { git rebase --abort || true; }
            sleep $((attempt * 3 + RANDOM % 5))
          done
          echo "::error::accepted 状态没推上去——PushPlus 已返回流水号，别再手动补发；"
          echo "::error::发送前的 sending 状态已在 main，会阻断自动重发；请核对本 run 后再修账本。"
          exit 1

      - name: 已预占后失败则按回执恢复账本
        if: failure() && steps.manual_reserve.outcome == 'success'
        continue-on-error: true
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          D="output/interviews/$SLUG"
          RECEIPT_FILE="$RUNNER_TEMP/interview-pushplus-receipt.json"
          COMMON=(
            --slug "$SLUG"
            --run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            --now "$(date -u +%FT%TZ)"
          )
          if python - "$RECEIPT_FILE" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          try:
              ok = bool(json.loads(path.read_text(encoding="utf-8")).get("receipt"))
          except (OSError, ValueError, AttributeError):
              ok = False
          raise SystemExit(0 if ok else 1)
          PY
          then
            echo "[恢复] 找到 PushPlus 流水号：只补 accepted 账本，不降级为 uncertain"
            python tools/auto_push_interview_gate.py --record "$D" "${COMMON[@]}" \
              --receipt-file "$RECEIPT_FILE"
            COMMIT_MSG="interview: $SLUG 补记 PushPlus 接收凭据"
            git add --sparse "data/interview_publish_ledger/$SLUG.json" "$D/pushed.json"
          else
            echo "[恢复] 没有平台流水号：只记 uncertain，禁止自动重发"
            python tools/auto_push_interview_gate.py --uncertain "$D" "${COMMON[@]}"
            COMMIT_MSG="interview: $SLUG 推送状态待核实"
            git add --sparse "data/interview_publish_ledger/$SLUG.json"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$COMMIT_MSG"
          fi
          source tools/git_push_retry.sh
          push_with_rebase_retry main 5

      # ⚠️ artifact 里**没有成片 mp4 是正常的**：2026-08-13 起成片一律传
      # Release 后 `rm` 掉（见「成片发到 Release」那一步），要看成片去
      # `render.json` 的 `video_url`。别把这个读成「render 没出片」——
      # 真没出片的话「验成片」那一步早就红了。
      # ⚠️ 同一个形状的另一半（2026-09-16，match-reel 那条 3.2 GB 的 artifact
      # 抖出来的）：`always()` 让这一步在前面红了的时候也跑，**而「提交成片」
      # 那一步里的 `rm -f "$D"/source.*` 此时没跑过**，于是整条源片跟着上传。
      # 按同一个 glob 排除掉；storyboard、字幕、render.json 照旧传——排查要的
      # 是这些。判据 `test_失败时的artifact不许带源片`。
      # 封面候选墙 `cover_scan_sheet.jpg` **只从这儿走**（不进仓库，见「提交成片」），
      # `mode=cover` 和 render 封面前置红了就地扫的那一张都在里面。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # mp4 / JPEG 已压缩；跳过 ZIP 再压缩，文件内容和质检不变。
          compression-level: 0
          name: ${{ github.event.inputs.slug }}
          path: |
            output/interviews/${{ github.event.inputs.slug }}/
            !output/interviews/${{ github.event.inputs.slug }}/source.*
