name: interview-clip
on:
  workflow_dispatch:
    inputs:
      slug:
        description: spec 文件名（不带 .json）
        required: true
        default: sabalenka-noskova-usopen-2026-qf-oncourt
      mode:
        description: 完成最终视觉复核和发布附件
        default: render
      push:
        description: 出片后推送微信
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            assets
            data
            specs
            src
            tools
            skills
            output/interviews/sabalenka-noskova-usopen-2026-qf-oncourt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install final audit dependencies
        run: pip install -q -e '.[visualqa]'
      - name: Ensure video-frame decoder and audit rules
        run: |
          source tools/ci_apt_install.sh
          ensure_ffmpeg
          ffmpeg -version | head -1
          test -s skills/tennis-interview-production/SKILL.md
          PYTHONPATH=src:tools python -c "from interview_skill import model_instructions; from benchmark_interview_models import _image; assert model_instructions('minimax')"
      - name: Recover completed and QC-passed film
        uses: actions/download-artifact@v4
        with:
          name: sabalenka-noskova-usopen-2026-qf-oncourt
          path: output/interviews/sabalenka-noskova-usopen-2026-qf-oncourt
          run-id: 34314612692
          github-token: ${{ github.token }}
      - name: Verify recovered QC binds these exact files
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          o=Path('output/interviews/sabalenka-noskova-usopen-2026-qf-oncourt')
          q=json.loads((o/'qc_attestation.json').read_text())
          assert q['status']=='pass',q
          assert q['film_sha256']==hashlib.sha256((o/'sabalenka-noskova-usopen-2026-qf-oncourt.mp4').read_bytes()).hexdigest()
          assert q['spec_sha256']==hashlib.sha256(Path('specs/interviews/sabalenka-noskova-usopen-2026-qf-oncourt.json').read_bytes()).hexdigest()
          assert q['poster_sha256']==hashlib.sha256((o/'poster.jpg').read_bytes()).hexdigest()
          print('Existing L2 pass matches the exact recovered film, poster and formal spec.')
          PY
      - name: MiniMax review of actual final interview frames
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: PYTHONPATH=src python tools/audit_sabalenka_oncourt.py
      - name: 成片发到 Release（不进 git）
        if: github.event.inputs.mode == 'render'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          OUTDIR="output/interviews/$SLUG"
          CLIP="$OUTDIR/$SLUG.mp4"
          # SZ 留着：render.json 的 video_bytes 从它来
          SZ=$(stat -c%s "$CLIP")
          TAG="interview-$SLUG"
          echo "成片 $((SZ/1048576)) MiB —— 发到 Release $TAG"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "赛后开麦 · $SLUG" \
                 --notes "双语字幕成片。采访成片一律走 Release 附件，不进 git。"
          # **传附件要重试**（照 match-reel.yml 同一步骤抄的，注释也抄）。
          # 来路是 2026-08-13 李娜那条（run 31709569579）：render 跑了
          # 14 分 27 秒、质检也过了，死在 `--clobber` 撞上 GitHub 自己的
          # HTTP 500。这条线原来裸调一次无所谓——体积闸在前面，一年走不到
          # 几次；改成**每趟 render 都走**之后，一次瞬时 5xx 报销的就是
          # 整趟 render。重发是安全的：`--clobber` 幂等，删到一半再传一遍就好。
          # ⚠️ 循环里不许写 `[ A ] && break`——`bash -e` 下 AND 列表整条为假
          # 会直接把这一步杀掉（下面探活那段的注释记的是同一个坑）。一律用 if。
          UPLOADED=0
          for i in 1 2 3 4; do
            if gh release upload "$TAG" "$CLIP" --clobber; then UPLOADED=1; break; fi
            if [ "$i" != 4 ]; then
              WAIT=$((5 * i * i))
              echo "第 $i 次传 Release 附件没成，${WAIT}s 后重试"
              sleep "$WAIT"
            fi
          done
          [ "$UPLOADED" = 1 ] || {
            echo "::error::Release 附件传了 4 次都没上去"; exit 1; }
          # `--clobber` 只说明 API 调用成功，不能证明同 slug 的附件已经换成
          # **本趟这份字节**。旧附件和新附件的公开 URL 完全一样；只探 200/206
          # 会被旧 CDN 缓存骗绿，随后 render.json 却会记下新 film_sha256，形成
          # 「账上是新片、Release 实际还是旧片」。读取当前 Release asset 的
          # GitHub 原生 `digest`（它绑定 asset id 与远端完整字节）核对 SHA；没
          # 对上就不写 render.json、更不会推微信。成片可到 500 MiB，不为了验
          # hash 再整片下载一遍。
          EXPECTED_SHA=$(python -c \
            'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["film_sha256"])' \
            "$OUTDIR/qc_attestation.json")
          RELEASE_META="$RUNNER_TEMP/interview-release-$SLUG.json"
          VERIFIED=0
          for i in 1 2 3 4; do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RELEASE_META"; then
              REMOTE_DIGEST=$(python -c \
                'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); n=sys.argv[2]; print(next((a.get("digest") or "" for a in d.get("assets", []) if a.get("name") == n), ""))' \
                "$RELEASE_META" "$SLUG.mp4")
              if [ "$REMOTE_DIGEST" = "sha256:$EXPECTED_SHA" ]; then
                VERIFIED=1
                break
              fi
              echo "::warning::Release asset digest 仍不是本趟成片（第 $i/4 次）：$REMOTE_DIGEST"
            else
              echo "::warning::Release asset 元数据读取失败（第 $i/4 次）"
            fi
            if [ "$i" != 4 ]; then sleep $((5 * i)); fi
          done
          rm -f "$RELEASE_META"
          [ "$VERIFIED" = 1 ] || {
            echo "::error::同 slug Release 附件没有替换成本趟成片（期望 $EXPECTED_SHA）";
            exit 1;
          }
          echo "Release asset digest 已绑定本趟成片：$EXPECTED_SHA"
          # 同 slug 的路径会复用；新推送必须带成片指纹，避免微信/CDN 仍命中旧
          # URL 缓存。查询参数实测仍会 302 到当前 release asset。
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$SLUG.mp4?v=${EXPECTED_SHA:0:16}"
          # **传完自己探一次**：Release 的 CDN 有几秒传播延迟，探不到就别写链接
          # ——写了等于把一个 404 发到微信，而消息发出去收不回来。
          # ⚠️ 循环体最后一句不许写成 `[ A ] || [ B ] && break`：整条 AND-OR
          # 列表为假时 `bash -e` 会直接把这一步杀掉，看着像「探活失败」，
          # 其实是第一次没中就退出了。用 if。
          for i in 1 2 3 4 5 6 7 8; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -L -r 0-99 "$URL" || echo 000)
            if [ "$CODE" = "206" ] || [ "$CODE" = "200" ]; then break; fi
            echo "第 $i 次探活 $CODE，5s 后重试"
            sleep 5
          done
          [ "$CODE" = "206" ] || [ "$CODE" = "200" ] || {
            echo "::error::Release 附件 $URL 探不到（$CODE）"; exit 1; }
          echo "Release 附件可取：$URL"
          python - "$OUTDIR/render.json" "$OUTDIR/qc_attestation.json" "$URL" "$SZ" "$REMOTE_DIGEST" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          path, qc_path, url, size, release_digest = (
              Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3], int(sys.argv[4]), sys.argv[5])
          # 这条线原来不写 render.json，所以要允许它还不存在
          data = json.loads(path.read_text(encoding="utf-8")) if path.is_file() else {}
          qc = json.loads(qc_path.read_text(encoding="utf-8"))
          data["video_url"] = url
          data["video_bytes"] = size
          data["film_sha256"] = qc["film_sha256"]
          data["release_asset_digest"] = release_digest
          data["qc_attestation_sha256"] = hashlib.sha256(qc_path.read_bytes()).hexdigest()
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                          encoding="utf-8")
          print("render.json 记下 video_url + QC 成片哈希 + Release asset digest")
          PY
          rm -f "$CLIP"

      - name: 提交成片
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          # **中间物一个都别留。** 只列 `source.mp4` 是不够的——第七趟出片时
          # 跟着进仓库的还有 `_audio.m4a`（6.6 MB，verify 下的音轨）、
          # `cover.html`（**12.5 MB**，字体 base64 内嵌进去的那份）、
          # `whisper.json`。三样加起来比成片的三分之一还多，而且每条片子来一份。
          # 判据落在 `test_中间物不许进仓库`：出片目录里只许留下面这几种。
          D="output/interviews/${{ github.event.inputs.slug }}"
          # ⚠️ **清理清单里的名字会过时。** 封面从 `cover.jpg` 改叫 `poster.jpg` 之后，
          # 它旁边那份内嵌字体的 HTML 就叫 `poster.html`（**12.4 MB**），
          # 而这一行还写着 `cover.html`——于是它跟着进了仓库。所以按后缀清，
          # 别按名字：`.html` 里只有 `copy.html` 是产物（Pages 要服务它）。
          find "$D" -maxdepth 1 -name "*.html" ! -name "copy.html" -delete
          rm -f "$D"/source.* "$D"/whisper.json
          # ⚠️ **`_` 开头的按前缀清，别按名字列。** 这一行原来写的是
          # `"$D"/_audio.* "$D"/_logo_mask.png`——两个具体名字。解读卡加了
          # `_takeaway_close.png` 之后，它就跟着进了仓库（367 KB/条），而
          # `test_中间物不许进仓库` 拦的本来就是**所有 `_` 开头**的文件。
          # 上面那句注释自己写着「清理清单里的名字会过时」，这一行正是它说的那种。
          # ⚠️ 用 `rm -rf` 不是 `find -delete`：解读卡的口播合在 `_tkvoice_*/`
          # 这个**子目录**里（`synthesize_narration` 按索引命名 `voice_00.mp3`，
          # 和别人同一个目录会互相盖掉），而 `find -delete` 删不掉非空目录——
          # 它报一句错然后继续，于是那个目录连同里面的 mp3 静静进了仓库。
          rm -rf "$D"/_*
          # 缩略图墙是**写 spec 时的工作台**，不是产物：挑完 `cover.frame_at`
          # 就没用了，而它一张 1.8 MB——这个仓库的 `output/` 已经 1.3 GB，
          # 每条片子再塞一张，代价会加在此后每一条工作流的 checkout 上。
          # 要看就本地 `--stage subs` 重生成（几百 KB 的 storyboard，不用 ffmpeg）；
          # 挑帧的理由留在 spec 的 `cover._why` 里，那才是持久的那一份。
          # ⚠️ **`mode=subs` 那趟不删**：storyboard 正是 subs 的产物之一——
          # 人挑帧要看的就是它，而它只从 artifact 走（`.gitignore` 里
          # `output/**/storyboard.jpg` 挡着，不会进仓库）。这一步排在
          # upload-artifact **之前**，subs 那趟删掉它，artifact 里就只剩
          # 字幕行，挑帧的人两手空空——「工作台」被自己的清理步骤收走了。
          if [ "$MODE" != "subs" ]; then rm -f "$D"/storyboard.jpg; fi
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          # 用 `$D`，别把这个路径再写一遍——下面重放那几行清的、放回来的、
          # 重新 add 的必须**和这里 add 的是同一格**，写两处必分叉，而分叉的
          # 样子是「重放放回来的不是刚提交的那一格」，不报错。
          git add "$D"
          git diff --cached --quiet && { echo "没有变化"; exit 0; }
          # **体积闸**：渲完一整趟才被 GitHub 拒收（推分支吃 HTTP 413）是最贵
          # 的失败方式，而这个仓库的 .git 已经 1.77 GiB。判据自动推导——凡是
          # `git commit` 的工作流都要有这一行（`test_every_workflow_that_
          # commits_generated_files_has_a_size_gate`），不维护白名单。
          python tools/check_staged_file_sizes.py
          BRANCH="${{ github.ref_name }}"
          MSG="interview: ${{ github.event.inputs.slug }} 双语字幕成片"
          git commit -m "$MSG"
          # ⚠️ **2026-08-13：这里原来是 `git pull --rebase` ＋ `&& break`，
          # 两个毛病叠在一起，而合成仓库上一跑就全现形了。**
          #
          # ① **rebase 过不去。** 另一趟同 slug 的 run 抢先落库时，冲突的正是
          #    `poster.jpg`（二进制，git 明说 `Cannot merge binary files`）和
          #    `lines.json`（纯文本，一样冲突——跟文件类型无关）。第 1 次死在
          #    冲突里，之后每一次都是 `Pulling is not possible because you have
          #    unmerged files`，跑完 `.git/rebase-merge` 还留在那儿。
          #    `explainer.yml` / `match-reel.yml` / `frame-grab.yml` 三条线
          #    早就为这个把 `pull --rebase` 换掉了，这条线没跟上。
          #
          # ② **⭐ 更贵的是退出码 0——整步绿着过去，产物静默丢掉。**
          #    `bash -e` 下 AND-OR 列表里非末尾命令失败不触发退出，而循环体
          #    最后一句是 `sleep`（必成功），于是循环耗尽之后这一步正常结束。
          #    实测：`for i in 1 2 3 4; do false && echo push && break; sleep 0; done`
          #    退出码就是 0。而 `push` 默认是 false，那一趟后面没有任何步骤会
          #    再碰仓库——**整趟 run 从头绿到尾，没人会知道这一条没落库**。
          #    ⚠️ 同一个坑的注释就写在上面「成片发到 Release」那一步里
          #    （「循环里不许写 `[ A ] && break`」），只是没管到 60 行之外。
          #
          # 生成出来的产物只有一个正确解——本趟渲的这一份——所以不 merge，
          # **重放**到最新的分支上；重试是因为 main 还会再动。
          for attempt in $(seq 1 10); do
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "push 被拒（第 $attempt 次），把本条采访重放到最新的 $BRANCH 上"
            git fetch origin "$BRANCH"
            git branch -f rendered HEAD
            git reset --hard "origin/$BRANCH"
            # ⚠️ **先清空再放回来，顺序不许反。** `git checkout <ref> -- <dir>`
            # 只恢复 ref 里**存在**的文件，不会删掉 ref 里没有的——而上一句
            # `reset --hard` 刚把 origin 上那份旧成片放了回来。这条线尤其要紧：
            # 仓库里现在还躺着 16 个存量 slug 的 mp4，而上面「成片发到 Release」
            # 那一步 `rm -f "$CLIP"` 之后本趟提交是带着 `delete mode` 的。
            # 合成仓库上验过——**漏掉这一行，被删掉的 mp4 当场被重放救活**，
            # 于是仓库里留着旧片、真片在 Release 上，两个地址两条片子。
            rm -rf "$D"
            git checkout rendered -- "$D"
            git add -A "$D"
            python tools/check_staged_file_sizes.py
            git diff --cached --quiet || git commit -m "$MSG"
            # 退避带 jitter：固定间隔会让撞车的双方下一轮继续对撞。
            sleep $((attempt * 5 + RANDOM % 10))
          done
          echo "::error::连续 10 次推送失败；本条采访没有落库，别把它当成已发"
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sabalenka-noskova-usopen-2026-qf-oncourt-final
          path: output/interviews/sabalenka-noskova-usopen-2026-qf-oncourt
