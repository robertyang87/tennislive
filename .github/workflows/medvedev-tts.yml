name: medvedev-tts

on:
  workflow_dispatch:
    inputs:
      text_file:
        description: 'Narration text file path in repo'
        required: false
        default: 'workspace/medvedev-story/narration-clean.txt'
      voice:
        description: 'TTS voice'
        required: false
        default: 'zh-CN-YunjianNeural'
      rate:
        description: 'Speech rate'
        required: false
        default: '+10%'

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install edge-tts
        run: python -m pip install edge-tts==7.2.8
      - name: Generate narration
        run: |
          PYTHONPATH=tools/alcaraz_voice_review/runtime \
          python -m edge_tts \
            --voice "${{ inputs.voice }}" \
            --rate="${{ inputs.rate }}" --pitch=+0Hz \
            --file "${{ inputs.text_file }}" \
            --write-media /tmp/narration.mp3
          ls -la /tmp/narration.mp3
          python -c "
          import json, subprocess
          r = subprocess.run(['ffprobe','-v','error','-show_entries','format=duration,size','-of','json','/tmp/narration.mp3'], capture_output=True, text=True)
          print(r.stdout)
          " || echo "ffprobe not available, skipping check"
      - name: Upload narration
        uses: actions/upload-artifact@v4
        with:
          name: medvedev-narration
          path: /tmp/narration.mp3
          retention-days: 7
