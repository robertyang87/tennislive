name: medvedev-tts

on:
  workflow_dispatch:
    inputs:
      text_file:
        description: 'Narration text file path in repo'
        required: false
        default: 'workspace/medvedev-story/narration-clean.txt'
      voice:
        description: 'TTS voice'
        required: false
        default: 'zh-CN-YunjianNeural'
      rate:
        description: 'Speech rate'
        required: false
        default: '+10%'

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            workspace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install edge-tts
        run: python -m pip install edge-tts==7.2.8
      - name: Generate narration
        run: |
          PYTHONPATH=tools/alcaraz_voice_review/runtime \
          python -m edge_tts \
            --voice "${{ inputs.voice }}" \
            --rate="${{ inputs.rate }}" --pitch=+0Hz \
            --file "${{ inputs.text_file }}" \
            --write-media /tmp/narration.mp3
          ls -la /tmp/narration.mp3
      - name: Upload narration artifact
        uses: actions/upload-artifact@v4
        with:
          name: medvedev-narration
          path: /tmp/narration.mp3
          retention-days: 7
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tts-medvedev-narration
          name: "Medvedev story narration (TTS)"
          files: /tmp/narration.mp3
          fail_on_unmatched_files: true
