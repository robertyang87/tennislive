name: pushplus-selftest

# 只干一件事：拿同一个 `PUSHPLUS_TOKEN`，**从两条真实代码路径各发一条纯文本
# 自检消息**，看落不落得进微信。
#
# **为什么要单独开一条。** `code == 200` 只保证 PushPlus 收下了，**不保证微信
# 推到了手机上**——`pushplus.push()` 自己的注释就写着这句，CLAUDE.md 也记过。
# 而这一跳真出问题时，我们这一侧**一个可查的东西都没有**：2026-09-05
# `wu-alcaraz-us-open-2026-r3` 就是这个形状——流水号有（`e8e18497…`）、
# `msg=执行成功`、台账 `sent`、run 全绿、复制页和成片链接各自第一次探活就命中、
# 推送体只有 5487 字节，而账号所有者没收到。
#
# 在这条工作流之前，唯一能验这一跳的办法是**再发一条真片子**——也就是把
# 「验一下」和「发一条收不回来的消息」绑在了一起。`pages-selftest` 当年拆的
# 是同一个形状（那条判据只有真推送时才走得到，于是「写了、没跑过」躺了一天）。
#
# ⭐ **2026-09-05 第一次跑的结果就写在这儿，别再猜一遍**：A/B 两条**都收到了**
# ——token 失效／取消关注／撞日限额／被封停／`channel=wechat` 这个值，一次全
# 排除掉（撞限额的话 A 路会当场 `exit 1`，封停的话两条一条都到不了）。
# 那条真消息的四个外部资源也逐个探过，全活着（两张图 206、成片 302、复制页 206）。
# 所以问题只剩「那一条消息本身」，C 路就是为这一问加的。
#
# ── PushPlus 官方文档里那两条硬约束（2026-09-05 实际抓的 `/doc/help/limit.html`，
#    不是推的）──────────────────────────────────────────────────────────
#
#   微信渠道日请求次数   未实名 0 次 ／ 实名 **200 次** ／ 会员 2000 次
#     200 ≤ 次数 < 2000 → **当日无法推送，次日凌晨恢复正常**
#   请求频率            1 分钟 5 次；**相同内容 1 小时 3 条**
#   ⚠️ 「**超出的请求将不再推送**」——也就是**照样返回 code=200 + 流水号，
#      只是不推**。这正好长成我们看到的样子。
#   ⚠️ 「**请求次数不等于接收到消息的条数**」：错误的请求也算次数。
#
#   ⭐ **官方给了一个用户自己 10 秒能查的判据**，比这条工作流还快：
#      在「pushplus 推送加」公众号里发 **「请求次数」** 查当日请求数、
#      发 **「解封时间」** 查解封日期。撞限额的话那儿直接就说了。
#
# ── 三条路，A/B 一层、C 一层 ────────────────────────────────────────────
#
# A/B 问的是「**token 这一层还通不通**」，C 问的是「**那一条真消息本身有没有
# 问题**」——2026-09-05 A/B 两条都收到了，于是问题一次收窄到 C 那一层：
# A/B 是纯文本零图零链接，而真片子是几千字 HTML ＋ 2 张 jsDelivr 图 ＋ 4 个外链。
#
#
#   A 裸 curl，**不带 channel** —— 告警走这条（pipeline-health / source-health /
#     orchestrate / news-brief / flash）
#   B `pushplus.push()`，**显式 `channel=wechat`** —— 发片走这条（赛场之上 /
#     赛后开麦 / 解说片）
#
#   ⚠️ **两条走的是同一个渠道，别指望它们分出渠道问题。** 文档
#   `/doc/channel.html` 明写「`wechat`｜免费｜微信公众号渠道」，而且
#   「**如不指定默认使用官网微信公众号渠道发送**」——所以 A 的「不指定」和
#   B 的「显式 wechat」落到的是同一处。`pushplus.py` 里那句「默认值被改成
#   App／邮件时接口照样 200」是**写它的人推的，没查过文档**；显式钉着没有
#   坏处，但别把它当成 A/B 有区别的理由。
#
#   （这一段是 2026-09-05 抓了文档之后改写的。第一版这里写着「只有 A 到 →
#   channel=wechat 没被投递」「只有 B 到 → 后台默认渠道被改了」——**那两支是
#   我编的**，文档一查就否掉。CLAUDE.md 记着「编出来的判据 ＋ 正确的结论」
#   是最坏的一种，因为没有人有理由去查它。）
#
# ── 怎么读结果（产物是微信里收到几条，run 绿不绿不算数）────────────────
#
#   【A/B：token 这一层还通不通】
#   两条都到    → token、关注、额度、渠道全好；问题在那一条真消息本身
#   两条都不到  → 去公众号发「解封时间」、「请求次数」；或 token 失效／取消关注
#   一到一不到  → 意外，两条本该同渠道；把两边的返回体贴出来再看
#
#   【C：那一条真消息本身有没有问题】（给了 slug 才有）
#   A/B 到、C 也到  → 那一次是**偶发**，直接重发那条片子
#   A/B 到、C 没到  → 就是**这条消息的内容**，再二分图片／外链／长度
#
# ⚠️ 副作用：往微信里发**两条**（给了 slug 是**三条**）标着「自检」的消息，
# **每条也各算一次请求次数**（撞限额时它自己也发不出去——那本身就是答案）。
# **不出片、不提交、不写复制页、不碰 `output/`、不下源片。**
#
# ⚠️ 两条内容**故意不一样**（A/B 各自的说明文字）：文档那条「相同内容 1 小时
# 3 条」会把内容一样的两条算成重复。
#
# ⚠️ 只留 `workflow_dispatch`，不给定时——它不产出任何东西，定时跑等于每天往
# 微信里塞两条噪音，**还白烧两次日额度**。

on:
  workflow_dispatch:
    inputs:
      note:
        description: "写进消息里的备注（留空就只有时间戳）"
        required: false
        default: ""
      slug:
        description: "C 路：拿这条 spec 的**真实推送体**原样发一次（留空＝只跑 A/B）"
        required: false
        default: ""
      asset_rev:
        description: "C 路的图片 URL 钉哪个 commit（留空＝@main）。要和当初那趟一模一样就填那趟的 head_sha"
        required: false
        default: ""

permissions:
  contents: read
  # ⚠️ C 路走生产那条 `push_reel.py --stage push`，而它会 `wait_for_copy_page`
  # → `trigger_pages_build()` 点一次 `pages.yml`。**没有这个权限那次点会静静
  # 失败**（「204 是信号，运行记录才是产物」那条），后果不是慢一点：探不到
  # 复制页 → 那颗按钮被摘掉 → **发出去的推送体就和真片子不一样了**，
  # 而这一路的全部意义就是「原样」。
  # 判据 `test_给了actions_write的工作流都真的要点Pages` /
  # `test_会发微信的工作流都要能触发Pages` 两条都钉着它。
  # ⚠️ A/B 两路用不上它，而权限只能按 job 给、分不开——这是代价，认领在这儿。
  actions: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # 只要源码，`output/` 一 GB 多，这条一个产物都不读。
          sparse-checkout: |
            src
            tools
            specs
            pyproject.toml
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 装依赖
        run: pip install -q -e .

      - name: 打上这一趟的标记
        id: stamp
        run: |
          STAMP="$(TZ=Asia/Shanghai date '+%m-%d %H:%M')"
          NOTE="${{ github.event.inputs.note }}"
          [ -n "$NOTE" ] && STAMP="$STAMP · $NOTE"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          echo "这一趟的标记：$STAMP"

      # ── A：裸 curl，不带 channel（告警那条路） ──────────────────────────
      - name: A · 裸 curl（不带 channel）
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          STAMP: ${{ steps.stamp.outputs.stamp }}
        run: |
          if [ -z "$PUSHPLUS_TOKEN" ]; then
            echo "::error::没有 PUSHPLUS_TOKEN，这条自检什么都验不了"; exit 1
          fi
          BODY=$(jq -nc --arg token "$PUSHPLUS_TOKEN" \
            --arg title "推送自检 A · 裸curl · $STAMP" \
            --arg content "A 路：裸 curl，不带 channel 参数。告警（pipeline-health / source-health / orchestrate）走的就是这条。<br>标记 $STAMP" \
            '{token:$token,title:$title,content:$content,template:"html"}')
          # ⚠️ 不带 `--fail`：4xx/5xx 的返回体本身就是诊断（余额、token 错、
          # 限流全写在里面），`--fail` 会把它吞成一个裸状态码。
          # ⚠️ 也不带 `--retry`：撞限额时重试只会把请求次数再乘几倍，把自己
          # 推得更深（CLAUDE.md「只重试『没送到』」那条的同一个道理）。
          RESP=$(curl -sS -m 20 -X POST https://www.pushplus.plus/send \
            -H "Content-Type: application/json" -d "$BODY")
          echo "A 路返回：$RESP"
          echo "$RESP" | jq -e '.code == 200' >/dev/null || {
            echo "::error::A 路被 PushPlus 明确拒绝——返回体就是答案"; exit 1; }
          echo "A 路流水号：$(echo "$RESP" | jq -r '.data // "(返回体里没有)"')"

      # ── B：pushplus.push()，显式 channel=wechat（发片那条路） ───────────
      # ⚠️ 用生产那个函数，不在这儿另写一份 POST——「一个数写两处必分叉」，
      # 而分叉的样子会是「自检说通了，发片那条路照样不通」。
      # ⚠️ `if: always()`：A 路失败（比如被限流拒了）时 B 路更要跑一次——
      # 两条都拒才说明是账号级的，只拒一条是另一回事。
      - name: B · pushplus.push()（显式 channel=wechat）
        if: always()
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          STAMP: ${{ steps.stamp.outputs.stamp }}
        run: |
          python - <<'PY'
          import os
          from tennislive.publish.pushplus import push

          stamp = os.environ["STAMP"]
          # ⚠️ 内容和 A 路不一样，别撞上「相同内容 1 小时 3 条」那条限制。
          receipt = push(
              f"推送自检 B · push() · {stamp}",
              "B 路：<code>pushplus.push()</code>，显式 channel=wechat。"
              "赛场之上 / 赛后开麦 / 解说片发片走的就是这条。<br>"
              f"标记 {stamp}",
          )
          print(f"B 路流水号：{receipt}")
          PY

      # ── C：拿一条真 spec 的**推送体原样**发一次 ─────────────────────────
      # A/B 是纯文本、零图、零链接；一条真片子是几千字 HTML ＋ 两张 jsDelivr 图
      # ＋ 四个外链。**三样同时不一样，所以 A/B 都到了也分不出是哪一样坏的**
      # ——这一路把那三样一次全带上：到了说明那一次是偶发，没到说明是这条
      # 消息本身，再去二分图片／链接／长度。
      #
      # ⚠️ **调的是生产那条 `push_reel.py --stage push`，不在这儿重组一份。**
      # 自己拼会漏掉 `copy_text = f"{title}\n\n{copy_text}"` 这类只在 main 里
      # 发生的步骤（第一次写就漏了），而漏掉的样子是「自检发的和真发的差一点，
      # 却看不出差在哪」——那正好毁掉这一路唯一的意义。
      # 唯一的差别是 `--title-prefix` 给标题加了「推送自检 C」。
      #
      # ⚠️ **不写复制页**（`--stage push` 本来就不写）、**不提交、不碰台账**：
      # 这一路只是再发一次同样的内容，**不是重发这条片子**。真要重发走
      # `match-reel mode=push`，那条路有它自己「先把 pushed.json 删掉」的显式闸。
      - name: C · 真实推送体原样发一次
        if: always() && github.event.inputs.slug != ''
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          STAMP: ${{ steps.stamp.outputs.stamp }}
          SLUG: ${{ github.event.inputs.slug }}
          # ⚠️ 光有 `actions: write` 不够：`trigger_pages_build()` **环境里没有
          # token 就直接跳过**（不报错）。生产那条 push 步给的也是这个。
          GITHUB_TOKEN: ${{ github.token }}
          # 图片 URL 钉哪个 commit。留空＝@main；要和当初那趟逐字节一样就填
          # 那趟的 head_sha——微信的图片缓存按**路径**算，换个 rev 就是另一个
          # 资源，实验就不等价了。
          TENNISLIVE_ASSET_REV: ${{ github.event.inputs.asset_rev }}
        run: |
          # ⚠️ 按 slug 反查产物目录，**别按今天的日期拼**——`mode=push` 为这个
          # 栽过一次（渲的那天和推的那天不是同一天）。渲过不止一次取最晚那份。
          # ⚠️ 用 `git ls-files` 不用 `test -f`：稀疏检出下 `output/` 不在工作区，
          # 而索引里认得（`auto_push_gate` 早为这个栽过）。
          RENDER=$(git ls-files -- "output/*/reel/$SLUG/render.json" | sort | tail -1)
          if [ -z "$RENDER" ]; then
            echo "::error::仓库里找不到 output/*/reel/$SLUG/render.json——slug 写错了？"
            exit 1
          fi
          OUTDIR=$(dirname "$RENDER")
          echo "产物目录：$OUTDIR"
          git sparse-checkout add "$OUTDIR"
          python tools/push_reel.py \
            --outdir "$OUTDIR" \
            --copy "specs/reels/$SLUG.xhs.txt" \
            --title-prefix "推送自检 C · $STAMP ｜ "

      - name: 怎么读这一趟
        if: always()
        run: |
          cat <<'EOF'
          ────────────────────────────────────────────────
          run 变绿只说明 PushPlus 每一路都返回了 code=200。
          **产物是你微信里收到几条**，去看一眼：

          【A/B：token 这一层还通不通】
            两条都到    → token／关注／额度／渠道全好，问题在那一条真消息上
            两条都不到  → 先去「pushplus 推送加」公众号发「请求次数」；
                          再发「解封时间」。撞限额时接口照样返回 200，
                          官方文档原话：「超出的请求将不再推送」
            一到一不到  → 意外（两条本该同渠道），把两边返回体贴出来

          【C：那一条真消息本身有没有问题】（给了 slug 才有）
            A/B 到了、C 也到  → 那一次是**偶发**，直接重发那条片子就行
                                （走 match-reel mode=push，先删 pushed.json）
            A/B 到了、C 没到  → 就是**这条消息的内容**。接着二分：
                                图片（2 张 jsDelivr）／外链（Release + Pages）／
                                长度（几千字 HTML）——三样里是哪一样

          日额度：实名 200 次／天，会员 2000 次／天。
          错误的请求也算次数——「请求次数不等于接收到消息的条数」。
          ────────────────────────────────────────────────
          EOF
