name: pushplus-selftest

# 只干一件事：拿同一个 `PUSHPLUS_TOKEN`，**从两条真实代码路径各发一条自检消息**，
# 看哪一条落得进微信。
#
# **为什么要单独开一条。** `code == 200` 只保证 PushPlus 收下了，**不保证微信
# 推到了手机上**——`pushplus.push()` 自己的注释就写着这句，CLAUDE.md 也记过。
# 而这一跳真出问题时，我们这一侧**一个可查的东西都没有**：2026-09-05
# `wu-alcaraz-us-open-2026-r3` 就是这个形状——流水号有（`e8e18497…`）、
# `msg=执行成功`、台账 `sent`、run 全绿、复制页和成片链接各自第一次探活就命中，
# 而账号所有者没收到。
#
# 在这条工作流之前，唯一能分辨「token／关注坏了」还是「这一条消息坏了」的办法，
# 是**再发一条真片子**——也就是把「验一下」和「发一条收不回来的消息」绑在了
# 一起。`pages-selftest` 当年拆的是同一个形状（那条判据只有真推送时才走得到，
# 于是在仓库里躺了一天没被验过）。
#
# **两条路真的不一样，所以要各发一条**（这不是推的，是两处源码摆在一起量的）：
#
#   A 裸 curl，**不带 channel**  —— 告警走这条（pipeline-health / source-health /
#     orchestrate / news-brief / flash），继承 PushPlus 后台的默认渠道
#   B `pushplus.push()`，**显式 channel=wechat** —— 发片走这条（赛场之上 /
#     赛后开麦 / 解说片），故意不继承后台默认值
#
# **怎么读结果**（这才是它的产出，run 绿不绿不算数）：
#
#   两条都到    → token 和关注都好，问题在那一条真消息的内容或资产上
#   只有 A 到   → 后台默认渠道通，而 `channel=wechat` 这个值没被投递
#   只有 B 到   → 后台默认渠道被改成了 App／邮件——那正是 B 显式钉 wechat 的理由
#   两条都不到  → token 失效，或者微信这头取消关注了 PushPlus 公众号
#
# ⚠️ 副作用只有一个：往微信里发**两条**标着「自检」的短消息。
# **不出片、不提交、不写复制页、不碰 `output/`、不下源片。**
#
# ⚠️ 只留 `workflow_dispatch`，不给定时——它不产出任何东西，定时跑等于每天
# 往微信里塞两条噪音（`pages-selftest` 那条注释记的是同一个理由）。
#
# ⚠️ 两条消息都**只发纯文本**：没有 `<img>`，所以 `wait_for_images` 不会等
# 任何 CDN。这是故意的——自检要问的是「这一跳通不通」，混进图片就分不清
# 「没送达」和「图片没就绪被拦下」了。

on:
  workflow_dispatch:
    inputs:
      note:
        description: "写进两条消息里的备注（留空就只有时间戳）"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # 只要源码，`output/` 一 GB 多，这条一个产物都不读。
          sparse-checkout: |
            src
            pyproject.toml
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 装依赖
        run: pip install -q -e .

      - name: 打上这一趟的标记
        id: stamp
        run: |
          STAMP="$(TZ=Asia/Shanghai date '+%m-%d %H:%M')"
          NOTE="${{ github.event.inputs.note }}"
          [ -n "$NOTE" ] && STAMP="$STAMP · $NOTE"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          echo "这一趟的标记：$STAMP"

      # ── A：裸 curl，不带 channel（告警那条路） ──────────────────────────
      - name: A · 裸 curl（不带 channel，继承后台默认渠道）
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          STAMP: ${{ steps.stamp.outputs.stamp }}
        run: |
          if [ -z "$PUSHPLUS_TOKEN" ]; then
            echo "::error::没有 PUSHPLUS_TOKEN，这条自检什么都验不了"; exit 1
          fi
          BODY=$(jq -nc --arg token "$PUSHPLUS_TOKEN" \
            --arg title "推送自检 A · 裸curl · $STAMP" \
            --arg content "这是 <b>A 路</b>：裸 curl，<b>不带 channel</b>，走 PushPlus 后台的默认渠道。<br>告警（pipeline-health / source-health / orchestrate）用的就是这条。<br>标记 $STAMP" \
            '{token:$token,title:$title,content:$content,template:"html"}')
          # ⚠️ 不带 --fail：4xx/5xx 的返回体本身就是诊断（余额、token 错、
          # 内容超限全写在里面），--fail 会把它吞成一个裸状态码。
          RESP=$(curl -sS -m 20 -X POST https://www.pushplus.plus/send \
            -H "Content-Type: application/json" -d "$BODY")
          echo "A 路返回：$RESP"
          echo "$RESP" | jq -e '.code == 200' >/dev/null || {
            echo "::error::A 路被 PushPlus 明确拒绝"; exit 1; }
          echo "A 路流水号：$(echo "$RESP" | jq -r '.data // "(返回体里没有)"')"

      # ── B：pushplus.push()，显式 channel=wechat（发片那条路） ───────────
      # ⚠️ 用生产那个函数，不在这儿另写一份 POST——「一个数写两处必分叉」，
      # 而分叉的样子会是「自检说通了，发片那条路照样不通」。
      - name: B · pushplus.push()（显式 channel=wechat）
        if: always()
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          STAMP: ${{ steps.stamp.outputs.stamp }}
        run: |
          python - <<'PY'
          import os
          from tennislive.publish.pushplus import push

          stamp = os.environ["STAMP"]
          receipt = push(
              f"推送自检 B · push() · {stamp}",
              "这是 <b>B 路</b>：<code>pushplus.push()</code>，"
              "<b>显式 channel=wechat</b>。<br>"
              "赛场之上 / 赛后开麦 / 解说片发片走的就是这条。<br>"
              f"标记 {stamp}",
          )
          print(f"B 路流水号：{receipt}")
          PY

      - name: 怎么读这一趟
        if: always()
        run: |
          cat <<'EOF'
          ────────────────────────────────────────────────
          run 变绿只说明 PushPlus 两次都返回了 code=200。
          **产物是你微信里收到几条**，去看一眼：

            两条都到    → token 和关注都好，问题在那一条真消息的内容/资产上
            只有 A 到   → channel=wechat 这个值没被投递（发片那条路坏了）
            只有 B 到   → 后台默认渠道被改成了 App／邮件（告警那条路坏了）
            两条都不到  → token 失效，或微信取消关注了 PushPlus 公众号

          上面每一步都打了流水号，拿它去 PushPlus 后台能查这一条的投递状态。
          ────────────────────────────────────────────────
          EOF
