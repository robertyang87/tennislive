name: Sun Bucsa audited source cache prewarm
on:
  push:
    branches:
      - codex/sun-bucsa-20261003
    paths:
      - .github/workflows/sun-bucsa-source-cache-prewarm.yml
permissions:
  contents: read
jobs:
  prewarm:
    if: github.ref == 'refs/heads/codex/sun-bucsa-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore only the exact native cache key
        id: sourcecache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/tennislive-sources
          key: reel-src-sun-bucsa-beijing-2026-r2-699d8649c31ed091
      - name: Install pinned source extractor
        timeout-minutes: 2
        run: python -m pip install --disable-pip-version-check --quiet yt-dlp==2026.08.19
      - name: Refresh signed URL and verify exact audited progressive bytes
        timeout-minutes: 4
        env:
          CACHE_HIT: ${{ steps.sourcecache.outputs.cache-hit }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import tempfile
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import yt_dlp

          canonical_url = 'https://www.wtatennis.com/videos/4586047/sun-xinran-16-stuns-bucsa-in-beijing-for-first-top-50-win-to-face-gauff-next'
          player_url = 'https://players.brightcove.net/6041795521001/te01Hqw71_default/index.html?videoId=6406166508112'
          exact_path = '/media/v1/pmp4/static/clear/6041795521001/2f8e040e-bf52-44b6-9191-d9e4fed86cd7/8345a455-1c8f-4353-bc32-f77bf46a89ea/main.mp4'
          expected_bytes = 54935229
          expected_sha = 'dd3a0d6f24eea364aa7038b7f3adc4441087273ba56c348f0c2461c2feb16c9d'
          key_hash = hashlib.sha256(canonical_url.encode()).hexdigest()[:16]
          filename = hashlib.sha1(canonical_url.encode()).hexdigest()[:16] + '.mp4'
          assert key_hash == '699d8649c31ed091'
          assert filename == '8be14ffcb9ec3320.mp4'
          cache_root = Path.home() / '.cache/tennislive-sources'
          destination = cache_root / filename

          def verify(path):
              if not path.is_file() or path.stat().st_size != expected_bytes:
                  raise RuntimeError('Actual source size differs from audited original')
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              if digest.hexdigest() != expected_sha:
                  raise RuntimeError('Actual source SHA differs from audited original')
              print(f'Verified original bytes={expected_bytes} sha256={expected_sha} cache_file={filename}')

          if os.environ.get('CACHE_HIT') == 'true':
              # Actions caches are immutable. An existing corrupt exact key must fail,
              # rather than claim that rewriting its local copy repaired the remote cache.
              verify(destination)
              print('Exact audited source already cached; no replacement requested')
          else:
              class QuietLogger:
                  def debug(self, message): pass
                  def warning(self, message): pass
                  def error(self, message): pass

              temporary = None
              try:
                  with yt_dlp.YoutubeDL({
                      'quiet': True, 'no_warnings': True, 'skip_download': True,
                      'logger': QuietLogger(), 'socket_timeout': 25,
                      'retries': 0, 'extractor_retries': 0,
                  }) as downloader:
                      info = downloader.extract_info(player_url, download=False)
                  if str(info.get('id')) != '6406166508112':
                      raise RuntimeError('Brightcove video identity mismatch')
                  candidates = [
                      f for f in info.get('formats', [])
                      if f.get('protocol') == 'https'
                      and f.get('width') == 1280 and f.get('height') == 720
                      and urllib.parse.urlsplit(f.get('url', '')).scheme == 'https'
                      and urllib.parse.urlsplit(f.get('url', '')).path == exact_path
                  ]
                  if len(candidates) != 1:
                      raise RuntimeError('Exact HTTPS progressive rendition not uniquely available')
                  selected = candidates[0]
                  request = urllib.request.Request(selected['url'], headers=selected.get('http_headers') or info.get('http_headers') or {})
                  cache_root.mkdir(parents=True, exist_ok=True)
                  descriptor, temporary_name = tempfile.mkstemp(prefix='sun-bucsa-original-', suffix='.tmp', dir=cache_root)
                  os.close(descriptor)
                  temporary = Path(temporary_name)
                  deadline = time.monotonic() + 180
                  count = 0
                  with urllib.request.urlopen(request, timeout=25) as response, temporary.open('wb') as handle:
                      if response.status != 200:
                          raise RuntimeError('Original-source HTTP status not 200')
                      final_url = urllib.parse.urlsplit(response.url)
                      if final_url.scheme != 'https' or final_url.path != exact_path:
                          raise RuntimeError('Original-source redirect changed the audited rendition')
                      while True:
                          if time.monotonic() > deadline:
                              raise RuntimeError('Original-source download exceeded deadline')
                          chunk = response.read(1024 * 1024)
                          if not chunk:
                              break
                          count += len(chunk)
                          if count > expected_bytes:
                              raise RuntimeError('Original-source response exceeds audited size')
                          handle.write(chunk)
                  verify(temporary)
                  os.replace(temporary, destination)
                  temporary = None
                  print('Fresh signed URL resolved; exact original progressive bytes placed in native branch cache')
              except Exception as error:
                  # Avoid logging signed URLs or extractor request secrets in tracebacks.
                  status = getattr(error, 'code', None)
                  print(f'Source preparation failed: {type(error).__name__}; HTTP status={status}')
                  raise SystemExit('Audited source unavailable or byte verification failed; no cache saved') from None
              finally:
                  if temporary is not None:
                      temporary.unlink(missing_ok=True)
          PY
      - name: Save verified original under the native branch cache key
        if: steps.sourcecache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/tennislive-sources
          key: reel-src-sun-bucsa-beijing-2026-r2-699d8649c31ed091
