name: tmp-djt-photos
on:
  push:
    branches: [claude/djokovic-turin-remake]
    paths: [research/djokovic-turin-last-ticket-2026/photo_probe.py, .github/workflows/tmp-djt-photos.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/djokovic-turin-remake
      - run: python3 research/djokovic-turin-last-ticket-2026/photo_probe.py
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add research/djokovic-turin-last-ticket-2026/photos
          git commit -m "tmp: djt 2023 都灵捧杯实拍候选 [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin claude/djokovic-turin-remake && git push -q origin HEAD:claude/djokovic-turin-remake && break; sleep 5; done
