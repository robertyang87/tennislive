name: tmp-med-norm
# 临时：medvedev-not-villain-2026 竖版源片规整并存 Release，合并前删除。
on:
  push:
    branches: [claude/medvedev-not-villain-2026]
    paths: [research/medvedev-not-villain-2026/normalize.sh, .github/workflows/tmp-med-norm.yml]
permissions:
  contents: write
jobs:
  norm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/medvedev-not-villain-2026
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: bash research/medvedev-not-villain-2026/normalize.sh
