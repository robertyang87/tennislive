name: yino-time-dispatch
on:
  push:
    branches: [reel/yino-20261013]
    paths: [.github/workflows/yino-time-dispatch.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: yino-time-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    if: "!contains(github.event.head_commit.message, '[skip yino time]')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SLUG: zverev-bublik-shanghai-2026-r16
      APPROVED_BUNDLE_SHA256: deec7ccd03c74c27f687c11dc0f12f697e60031b9b5975b200391cce1c960a04
      APPROVED_SPEC_SHA256: b217e0eb4901dfd1a603117658b0c230dfb27b95030b708d75809edfcbf8b721
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout: |
            .github
            data
            specs
            src
            tools
      - name: Verify immutable approved inputs and actual producer identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,sys
          sys.path.insert(0,'src')
          from tennislive.video.tts_bundle import validate_bundle
          slug=os.environ['SLUG']
          spec_path=pathlib.Path('specs/reels')/(slug+'.json')
          assert hashlib.sha256(spec_path.read_bytes()).hexdigest()==os.environ['APPROVED_SPEC_SHA256'], 'Reviewed spec changed'
          spec=json.loads(spec_path.read_text())
          assert spec['slug']==slug and spec['tts_backend']=='edge'
          assert spec['sources']['main']=='https://github.com/robertyang87/tennislive/releases/download/source-yINOy0bSnYk/yINOy0bSnYk.mp4'
          record=json.loads((pathlib.Path('data/narration_checks')/(slug+'.json')).read_text())
          assert record['slug']==slug and record['backend']=='edge-tts'
          assert record['voice']=='zh-CN-YunjianNeural' and record['rate']=='+6%'
          assert record.get('segments'), 'Actual measured duration record required'
          bundle=pathlib.Path('data/evidence')/slug/'tts_bundle.zip'
          report=validate_bundle(bundle,decode_audio=False)
          assert report['bundle_sha256']==os.environ['APPROVED_BUNDLE_SHA256']
          assert record['tts_bundle']['bundle_sha256']==report['bundle_sha256']
          assert report['request_count']==record['tts_bundle']['request_count']==8
          assert report['metadata']['slug']==slug and report['metadata']['kind']=='reel_native_tts'
          assert report['quality_approval'] is False
          print('Exact reviewed frozen audio and actual measured record confirmed; no synthesis performed.')
          PY
      - name: Publish small frozen bundle and persist locators
        run: |
          set -euo pipefail
          python3 tools/reel_tts_release.py publish --slug "$SLUG"             --bundle "data/evidence/$SLUG/tts_bundle.zip"             --metadata "data/narration_checks/$SLUG.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- "data/evidence/$SLUG/tts_bundle.zip" .github/workflows/yino-time-dispatch.yml
          git add -- "data/narration_checks/$SLUG.json"
          git commit -m 'Freeze actual Yunjian speech inputs and dispatch branch render [skip yino time]'
          # Fail if another producer changed this branch; never overwrite or silently rebase.
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Dispatch native render on updated branch without publication
        run: |
          set -euo pipefail
          gh workflow run match-reel.yml --ref "$GITHUB_REF_NAME"             -f mode=render -f slug="$SLUG" -f push=false             -f voice=zh-CN-YunjianNeural -f rate=+6%             -f received_at=2026-10-13T14:03:12Z
          echo 'Native render dispatched. WeChat publication remains gated by current film review, QC, and merge to main.'
