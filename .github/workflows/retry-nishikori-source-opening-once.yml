name: retry-nishikori-source-opening-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retry-nishikori-source-opening-once.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 用美网官方告别片开头补冷开场并去重正文
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('specs/interviews/nishikori-sakamoto-us-open-2026-q3-farewell.json')
          d = json.loads(path.read_text(encoding='utf-8'))
          if not d.get('lead_in'):
              d['lead_in'] = {
                  'url': d['url'],
                  'start': 0.62,
                  'end': 5.68,
                  'why': '同场资格赛官方单场集锦自动精确搜索未找到；不静默降级，改用美网官方《Final Match Presentation》开头5秒作告别冷开场，保留现场原声与双语字幕，随后从6.32秒继续正文，避免重复。',
                  '_subs_why': '时间码来自已入库的第一份ASR逐词时间码；三行均为美网现场主持人的可辨英语原声，不改写成旁白。',
                  'subs': [
                      {'a': 0.62, 'b': 1.80, 'en': 'And ladies and gentlemen,', 'zh': '女士们先生们'},
                      {'a': 1.92, 'b': 3.66, 'en': "right now I'd like to take a moment to", 'zh': '现在，让我们花一点时间'},
                      {'a': 3.66, 'b': 5.68, 'en': 'celebrate an incredible career.', 'zh': '致敬这段非凡的职业生涯'},
                  ],
              }
              d['start'] = 6.32
              d['opening'] = {
                  'kind': 'source_ceremony',
                  'why': '同场比赛结尾官方单场集锦经精确匹配仍不可得；显式使用美网官方告别仪式源片开头作冷开场，不伪造比赛镜头。',
              }
              d['zh'] = list(d.get('zh') or [])[3:]
              if d.get('_zh_draft'):
                  d['_zh_draft'] = list(d['_zh_draft'])[3:]
              fixed = {}
              for key, value in (d.get('en_fixed') or {}).items():
                  idx = int(key)
                  if idx > 3:
                      fixed[str(idx - 3)] = value
              d['en_fixed'] = fixed
              d.setdefault('_notes', []).append('冷开场例外已显式销账：同场官方单场集锦精确搜索无结果，使用同一美网官方告别片0.62–5.68秒主持人开场；正文从6.32秒续接，避免重复。')
              path.write_text(json.dumps(d, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          python3 -m json.tool specs/interviews/nishikori-sakamoto-us-open-2026-q3-farewell.json >/dev/null

      - name: 提交补丁并删除一次性工作流
        run: |
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git rm .github/workflows/retry-nishikori-source-opening-once.yml
          git add specs/interviews/nishikori-sakamoto-us-open-2026-q3-farewell.json
          git commit -m "content: 锦织圭告别片补官方仪式冷开场"
          git pull --rebase origin main
          source tools/git_push_retry.sh
          push_with_rebase_retry main 5

      - name: 点名重跑并质检后自动推送微信
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 3
          gh workflow run interview-clip.yml --ref main \
            -f slug=nishikori-sakamoto-us-open-2026-q3-farewell \
            -f mode=render \
            -f received_at="$(date -u +%FT%TZ)"
