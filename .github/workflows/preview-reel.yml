name: preview-reel

# 开球之前 · 独立管线（纯视频）。渲染核心委托 build_match_reel.render()（预览 spec
# 用的就是 segments+sources+mixed_fps 那套 schema），入口和产物目录独立：
#   spec   specs/previews/<slug>.json（存量 4 条老片还在 specs/reels/，只读回退）
#   产物   output/preview/<slug>/
# 和 match-reel 分家，是为了「开球之前」以后能长出自己那几样 beat 类型
# （footage_beat / poster_beat / stat_overlay，见 tools/preview_beats.py），
# 不因改 match-reel 而互相波及。
#
# 第一版只做 render（+ 可选的 --dry-run 形状校验）；probe / cover / push 分档
# 以后按需要再加——先能出片，再谈完整。

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "开球之前 spec 文件名（不带 .json）"
        required: true
        default: "jodar-fritz"
      dry_run:
        description: "true = 只验 spec 形状，不下载不渲染"
        required: false
        default: "false"

# 提交产物 + 成片发 Release 都要写权限（match-reel 同款）。
permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: preview-reel-${{ github.event.inputs.slug }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # 不写 sparse-checkout-cone-mode（默认 cone 模式）：它会**自动带上根目录
          # 的 pyproject.toml**——`pip install -e .` 靠它，漏了就是
          # 「does not appear to be a Python project」（第一次验证就是这么红的）。
          sparse-checkout: |
            assets
            data
            docs
            specs
            src
            tests
            tools
            output

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 装 ffmpeg
        timeout-minutes: 6
        run: |
          apt_retry() {
            for i in 1 2; do
              sudo timeout 150 "$@" && return 0
              echo "::warning::apt 第 $i 次没跑完：$*"
              sudo dpkg --configure -a || true
              sleep 10
            done
            echo "::error::apt 两次都没成功：$*"
            return 1
          }
          apt_retry apt-get update -qq
          apt_retry apt-get install -y -qq ffmpeg

      - name: 装中文字体（封面和烧字幕都要）
        timeout-minutes: 6
        run: |
          apt_retry() {
            for i in 1 2; do
              sudo timeout 150 "$@" && return 0
              echo "::warning::apt 第 $i 次没跑完：$*"
              sudo dpkg --configure -a || true
              sleep 10
            done
            echo "::error::apt 两次都没成功：$*"
            return 1
          }
          apt_retry apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji

      - name: 装依赖
        run: |
          pip install -q -e ".[webrender,visualqa,cutout]"
          # ⚠️ yt-dlp 要装 [default]，它才带 yt-dlp-ejs——少了它不报「装少了」，
          # 而是解不了 YouTube 的 n challenge，报得像个源片问题。
          pip install -q "yt-dlp[default]" edge-tts azure-cognitiveservices-speech

      - name: 装 Chromium（封面/角标渲染）
        run: python -m playwright install --with-deps chromium

      - name: 渲开球之前
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            PYTHONPATH=src python tools/preview_beats.py --slug "${{ github.event.inputs.slug }}" --dry-run
          else
            PYTHONPATH=src python tools/preview_beats.py --slug "${{ github.event.inputs.slug }}"
          fi

      # 成片一律走 Release 不进 git（match-reel 同款）。预览线产物目录独立：
      # output/preview/<slug>/，和 reel 的 output/<日期>/reel/<slug> 分家。
      - name: 成片发到 Release
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUTDIR="output/preview/${{ github.event.inputs.slug }}"
          REEL="$OUTDIR/${{ github.event.inputs.slug }}.mp4"
          TAG="preview-${{ github.event.inputs.slug }}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "开球之前 · ${{ github.event.inputs.slug }}" \
                 --notes "开球之前纯视频，成片走 Release 附件。"
          SZ=$(stat -c%s "$REEL")
          UPLOADED=0
          for i in 1 2 3 4; do
            if gh release upload "$TAG" "$REEL" --clobber; then UPLOADED=1; break; fi
            echo "第 $i 次传 Release 没成，${i}0s 后重试"
            sleep $((i * 10))
          done
          [ "$UPLOADED" = 1 ] || { echo "::error::Release 传了 4 次都没上去"; exit 1; }
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/${{ github.event.inputs.slug }}.mp4"
          python - "$OUTDIR/render.json" "$URL" "$SZ" <<'PY'
          import json, pathlib, sys
          path, url, size = sys.argv[1], sys.argv[2], int(sys.argv[3])
          data = json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
          data["video_url"] = url
          data["video_bytes"] = size
          pathlib.Path(path).write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("render.json 记下 video_url")
          PY
          rm -f "$REEL"

      - name: 丢掉不进仓库的中间物
        if: github.event.inputs.dry_run != 'true'
        run: |
          OUTDIR="output/preview/${{ github.event.inputs.slug }}"
          rm -f "$OUTDIR"/source* "$OUTDIR"/*.part "$OUTDIR"/*.ytdl \
            "$OUTDIR"/voice_*.mp3 "$OUTDIR"/_cover.* "$OUTDIR"/poster.html \
            "$OUTDIR"/_versus_* "$OUTDIR"/_subs* "$OUTDIR"/part_*.mp4 \
            "$OUTDIR"/_video.mp4

      - name: 提交产物
        if: github.event.inputs.dry_run != 'true'
        run: |
          OUTDIR="output/preview/${{ github.event.inputs.slug }}"
          git add "$OUTDIR"
          python tools/check_staged_file_sizes.py
          git commit -m "preview: ${{ github.event.inputs.slug }}" || echo "没有可提交的"
          git push origin HEAD:main
