name: preview-reel

# 开球之前 · 独立管线（纯视频）。渲染核心委托 build_match_reel.render()（预览 spec
# 用的就是 segments+sources+mixed_fps 那套 schema），入口和产物目录独立：
#   spec   specs/previews/<slug>.json（存量 4 条老片还在 specs/reels/，只读回退）
#   产物   output/preview/<slug>/
# 和 match-reel 分家，是为了「开球之前」以后能长出自己那几样 beat 类型
# （footage_beat / poster_beat / stat_overlay，见 tools/preview_beats.py），
# 不因改 match-reel 而互相波及。
#
# 第一版只做 render（+ 可选的 --dry-run 形状校验）；probe / cover / push 分档
# 以后按需要再加——先能出片，再谈完整。

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "开球之前 spec 文件名（不带 .json）"
        required: true
        default: "jodar-fritz"
      dry_run:
        description: "true = 只验 spec 形状，不下载不渲染"
        required: false
        default: "false"
      push:
        description: "渲染完推送到微信（默认 false，先验片）"
        required: false
        type: boolean
        default: false
      # 推送文案一律不给默认值——默认值只能是上一条片子的文案，不传就顶着别人
      # 的话发出去（match-reel 同一条教训）。开球之前没有比分，score 固定留空。
      matchup:
        description: "对阵进标题，如「霍达尔 vs 弗里茨」（push=true 时必填）"
        required: false
        default: ""
      event:
        description: "赛事与轮次进标题，如「华盛顿 ATP500 男单决赛」"
        required: false
        default: ""
      summary:
        description: "一句话概括（顶掉对阵+赛事）"
        required: false
        default: ""
      lead:
        description: "正文第一句"
        required: false
        default: ""

# 提交产物 + 成片发 Release 要 contents: write；推微信要触发 pages.yml 重新发布
# 复制页（push_reel.trigger_pages_build 走 workflow_dispatch），要 actions: write。
permissions:
  contents: write
  actions: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: preview-reel-${{ github.event.inputs.slug }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # 不写 sparse-checkout-cone-mode（默认 cone 模式）：它会**自动带上根目录
          # 的 pyproject.toml**——`pip install -e .` 靠它，漏了就是
          # 「does not appear to be a Python project」（第一次验证就是这么红的）。
          sparse-checkout: |
            assets
            data
            docs
            specs
            src
            tests
            tools
            # ⚠️ **只要 `output/preview` 这一格，不要裸的 `output`。** 后者会把
            # 一 GB 多的历史产物全拉下来，checkout 白等一分半（daily 量到 1:31、
            # match-reel 2:44）。这条工作流只写 `output/preview/<slug>`，前缀固定，
            # 静态列出来就够，不用像 match-reel 那样等算出目录再 `sparse-checkout add`。
            # ⚠️ **不能只做一半**：漏掉这一格的话 `git add` 只警告并退出 0，
            # 产物静默丢掉，而那是跑完之后才发现的。判据
            # `test_不碰产物的工作流不许把output拉下来`。
            output/preview

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 装 ffmpeg
        timeout-minutes: 12
        run: |
          apt_retry() {
            for i in 1 2; do
              sudo timeout 150 "$@" && return 0
              echo "::warning::apt 第 $i 次没跑完：$*"
              sudo dpkg --configure -a || true
              sleep 10
            done
            echo "::error::apt 两次都没成功：$*"
            return 1
          }
          apt_retry apt-get update -qq
          apt_retry apt-get install -y -qq ffmpeg

      - name: 装中文字体（封面和烧字幕都要）
        timeout-minutes: 7
        run: |
          apt_retry() {
            for i in 1 2; do
              sudo timeout 150 "$@" && return 0
              echo "::warning::apt 第 $i 次没跑完：$*"
              sudo dpkg --configure -a || true
              sleep 10
            done
            echo "::error::apt 两次都没成功：$*"
            return 1
          }
          apt_retry apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji

      - name: 装依赖
        run: |
          pip install -q -e ".[webrender,visualqa,cutout]"
          # ⚠️ yt-dlp 要装 [default]，它才带 yt-dlp-ejs——少了它不报「装少了」，
          # 而是解不了 YouTube 的 n challenge，报得像个源片问题。
          pip install -q "yt-dlp[default]" edge-tts azure-cognitiveservices-speech

      - name: 装 Chromium（封面/角标渲染）
        timeout-minutes: 10
        run: |
          pw_wait_apt() {
            for _ in $(seq 1 22); do
              if ! pgrep -x apt-get >/dev/null && ! pgrep -x dpkg >/dev/null; then
                return 0
              fi
              sleep 5
            done
            echo "::warning::等了 110 秒 dpkg 锁还没松开——下一次尝试八成会在两秒内死在 Could not get lock，不是 apt 装不上"
          }
          pw_retry() {
            for i in 1 2; do
              timeout 240 python -m playwright install --with-deps chromium && return 0
              echo "::warning::装 Chromium 第 $i 次没跑完（多半卡在 --with-deps 的 apt）"
              pw_wait_apt
            done
            echo "::error::装 Chromium 两次都没成功"
            return 1
          }
          pw_retry

      - name: 起 PO token provider
        continue-on-error: true
        run: |
          pip install -q bgutil-ytdlp-pot-provider
          docker run --name bgutil-pot -d -p 4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider
          for i in $(seq 1 25); do
            if curl -sf http://127.0.0.1:4416/ping >/dev/null; then
              echo "provider 起来了（第 $i 次探活）"
              exit 0
            fi
            sleep 2
          done
          echo "::warning::PO token provider 50 秒内没起来，退回 client 梯子"

      - name: 落 cookies（配了 Secret 才有）
        id: cookies
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "path=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_OUTPUT"
            echo "已写入 cookies（$(wc -l < "$RUNNER_TEMP/yt-cookies.txt") 行）"
          else
            echo "::notice::未配置 YT_COOKIES_TXT，只能靠 player client 梯子碰运气"
          fi

      - name: 渲开球之前
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          YT_COOKIES: ${{ steps.cookies.outputs.path }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            PYTHONPATH=src python tools/preview_beats.py --slug "${{ github.event.inputs.slug }}" --dry-run
          else
            PYTHONPATH=src python tools/preview_beats.py --slug "${{ github.event.inputs.slug }}"
          fi

      # 预览片和赛场之上是同一个 render() 出的（同画布/音轨/字幕），所以
      # check_reel_landed 直接适用；只是用 --film 显式指到 preview 目录，
      # --slug 读 spec（存量老片在 specs/reels/ 下）。
      - name: 查成片本身合不合格
        if: github.event.inputs.dry_run != 'true'
        run: |
          python tools/check_reel_landed.py \
            --slug "${{ github.event.inputs.slug }}" \
            --film "output/preview/${{ github.event.inputs.slug }}/${{ github.event.inputs.slug }}.mp4"

      # 成片一律走 Release 不进 git（match-reel 同款）。预览线产物目录独立：
      # output/preview/<slug>/，和 reel 的 output/<日期>/reel/<slug> 分家。
      - name: 成片发到 Release
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUTDIR="output/preview/${{ github.event.inputs.slug }}"
          REEL="$OUTDIR/${{ github.event.inputs.slug }}.mp4"
          TAG="preview-${{ github.event.inputs.slug }}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "开球之前 · ${{ github.event.inputs.slug }}" \
                 --notes "开球之前纯视频，成片走 Release 附件。"
          SZ=$(stat -c%s "$REEL")
          UPLOADED=0
          for i in 1 2 3 4; do
            if gh release upload "$TAG" "$REEL" --clobber; then UPLOADED=1; break; fi
            echo "第 $i 次传 Release 没成，${i}0s 后重试"
            sleep $((i * 10))
          done
          [ "$UPLOADED" = 1 ] || { echo "::error::Release 传了 4 次都没上去"; exit 1; }
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/${{ github.event.inputs.slug }}.mp4"
          python - "$OUTDIR/render.json" "$URL" "$SZ" <<'PY'
          import json, pathlib, sys
          path, url, size = sys.argv[1], sys.argv[2], int(sys.argv[3])
          data = json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
          data["video_url"] = url
          data["video_bytes"] = size
          pathlib.Path(path).write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("render.json 记下 video_url")
          PY
          rm -f "$REEL"

      - name: 丢掉不进仓库的中间物
        if: github.event.inputs.dry_run != 'true'
        run: |
          OUTDIR="output/preview/${{ github.event.inputs.slug }}"
          rm -f "$OUTDIR"/source* "$OUTDIR"/*.part "$OUTDIR"/*.ytdl \
            "$OUTDIR"/voice_*.mp3 "$OUTDIR"/_cover.* "$OUTDIR"/poster.html \
            "$OUTDIR"/_versus_* "$OUTDIR"/_subs* "$OUTDIR"/part_*.mp4 \
            "$OUTDIR"/_video.mp4

      - name: 取日期（开球之前产物不按日期分目录，push_reel 要显式 --date）
        id: date
        if: github.event.inputs.push == 'true'
        run: |
          DATE=$(python3 - <<'PY'
          import json, re
          spec = json.load(open("specs/reels/${{ github.event.inputs.slug }}.json", encoding="utf-8"))
          m = re.search(r"(\d{4})-(\d{2})-(\d{2})", str(spec.get("_fixture") or ""))
          print(m.group(1) if m else "")
          PY
          )
          [ -n "$DATE" ] || { echo "::error::从 _fixture 取不到日期"; exit 1; }
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: 写复制页（必须排在提交之前）
        if: github.event.inputs.push == 'true'
        env:
          # ⚠️ **拿不到 token，`trigger_pages_build()` 会直接跳过**——跳过之后
          # 探活只能干等别的 push 去触发 Pages，最后把复制页那颗按钮摘掉，
          # 日志上和「今天 Pages 慢」长得一模一样。`match-reel.yml` 的同名步骤
          # 一直是这么给的。判据 `test_会发微信的工作流都要能触发Pages`。
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          COPY="specs/reels/${{ github.event.inputs.slug }}.xhs.txt"
          test -f "$COPY" || { echo "::error::找不到 $COPY"; exit 1; }
          python tools/push_reel.py --stage page \
            --outdir "output/preview/${{ github.event.inputs.slug }}" \
            --date "${{ steps.date.outputs.date }}" \
            --matchup "${{ github.event.inputs.matchup }}" \
            --event "${{ github.event.inputs.event }}" \
            --summary "${{ github.event.inputs.summary }}" \
            --lead "${{ github.event.inputs.lead }}" \
            --copy "$COPY"

      - name: 提交产物
        if: github.event.inputs.dry_run != 'true'
        run: |
          OUTDIR="output/preview/${{ github.event.inputs.slug }}"
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add "$OUTDIR"
          python tools/check_staged_file_sizes.py
          git commit -m "preview: ${{ github.event.inputs.slug }}" || echo "没有可提交的"
          git push origin HEAD:main

      - name: 推送到微信（可选）
        if: github.event.inputs.push == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TENNISLIVE_ASSET_REV: ${{ github.sha }}
        run: |
          COPY="specs/reels/${{ github.event.inputs.slug }}.xhs.txt"
          python tools/push_reel.py \
            --outdir "output/preview/${{ github.event.inputs.slug }}" \
            --date "${{ steps.date.outputs.date }}" \
            --matchup "${{ github.event.inputs.matchup }}" \
            --event "${{ github.event.inputs.event }}" \
            --summary "${{ github.event.inputs.summary }}" \
            --lead "${{ github.event.inputs.lead }}" \
            --copy "$COPY"
