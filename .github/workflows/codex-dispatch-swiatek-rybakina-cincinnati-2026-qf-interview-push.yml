name: codex-dispatch-swiatek-rybakina-cincinnati-2026-qf-interview-push

on:
  push:
    branches:
      - codex/swiatek-rybakina-cincinnati-2026-qf-interview
    paths:
      - .github/workflows/codex-dispatch-swiatek-rybakina-cincinnati-2026-qf-interview-push.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: "${{ github.event.head_commit.message == 'ci: dispatch Swiatek Cincinnati interview WeChat push' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch QA-approved interview push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run interview-clip.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f slug=swiatek-rybakina-cincinnati-2026-qf \
            -f mode=push \
            -f push=true
