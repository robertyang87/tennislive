name: production-research-check
run-name: Osaka official caption verification
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  official-source-captions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q 'yt-dlp[default]'
      - name: Read only public source caption tracks
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          mkdir -p inventory
          python - <<'PYCODE'
          import pathlib,subprocess,json,os
          out=pathlib.Path('inventory');args=[]
          if os.environ.get('YT_COOKIES_TXT'):
              cookie=pathlib.Path(os.environ['RUNNER_TEMP'])/'yt-cookies.txt';cookie.write_text(os.environ['YT_COOKIES_TXT']);cookie.chmod(0o600);args=['--cookies',str(cookie)]
          result=[]
          for key,start,end in [('ksA37BLbaWg',711,729),('_r9i8mV5Zv8',1071,1092)]:
              cmd=['yt-dlp',*args,'--no-warnings','--skip-download','--ignore-no-formats-error','--write-auto-subs','--write-subs','--sub-langs','en','--sub-format','json3','--socket-timeout','20','--retries','1','-o',str(out/(key+'.%(ext)s')),'https://www.youtube.com/watch?v='+key]
              r=subprocess.run(cmd,capture_output=True,text=True,timeout=180)
              row={'id':key,'returncode':r.returncode,'log':(r.stdout+r.stderr)[-1200:],'subfiles':[]}
              for f in out.glob(key+'*.json3'):
                  d=json.loads(f.read_text());events=[]
                  for e in d.get('events',[]):
                      a=e.get('tStartMs',0)/1000;b=a+e.get('dDurationMs',0)/1000
                      if b>=start and a<=end:events.append({'start':a,'end':b,'text':''.join(x.get('utf8','') for x in e.get('segs',[]))})
                  row['subfiles'].append({'name':f.name,'selected_events':events})
              result.append(row)
          (out/'caption-report.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print('OFFICIAL_CAPTION_REPORT_JSON_BEGIN')
          print(json.dumps(result,ensure_ascii=False))
          print('OFFICIAL_CAPTION_REPORT_JSON_END')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osaka-official-caption-verification
          path: inventory/
