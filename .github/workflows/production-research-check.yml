name: production-research-check
run-name: Osaka observed official playlist source check
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  read-only-official-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public metadata reader
        run: pip install -q 'yt-dlp[default]'
      - name: Inventory WTA and tournament official channels
        run: |
          mkdir -p inventory
          python - <<'PY'
          import subprocess,json,pathlib,datetime
          out=pathlib.Path('inventory')
          channels=[('wta-current-osaka-playlist','https://www.youtube.com/playlist?list=PLGG94DGJAqdM',30)]
          report=[]
          for key,url,limit in channels:
              cmd=['yt-dlp','--flat-playlist','--playlist-end',str(limit),'--dump-single-json','--socket-timeout','20','--retries','1',url]
              try:r=subprocess.run(cmd,capture_output=True,text=True,timeout=150)
              except subprocess.TimeoutExpired:
                  report.append({'channel':key,'status':'timeout'});continue
              (out/(key+'-stderr.txt')).write_text(r.stderr)
              if r.returncode:
                  report.append({'channel':key,'status':'error','error':r.stderr[-600:]});continue
              d=json.loads(r.stdout);(out/(key+'.json')).write_text(json.dumps(d))
              hits=[{k:e.get(k) for k in ['id','title','url','duration','channel','channel_id','uploader','timestamp','release_timestamp']} for e in d.get('entries',[]) if any(s in str(e.get('title','')).lower() for s in ['siniak','osaka','japan','大阪','シニアコバ','シニアコワ'])]
              report.append({'channel':key,'channel_id':d.get('channel_id'),'status':'ok','total':len(d.get('entries',[])),'first_entries':[{k:e.get(k) for k in ['id','title','url','duration','channel_id','timestamp','channel','uploader']} for e in d.get('entries',[])[:30]],'hits':hits})
          rec={'observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'report':report}
          (out/'report.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2))
          print('OFFICIAL_INVENTORY_JSON_BEGIN')
          print(json.dumps(rec,ensure_ascii=False))
          print('OFFICIAL_INVENTORY_JSON_END')
          assert all(x.get('status')=='ok' for x in report),'Final refresh must actually fetch every requested official channel/search page'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osaka-official-inventory
          path: inventory/
