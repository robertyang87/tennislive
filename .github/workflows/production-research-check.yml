name: production-research-check
run-name: "zhou-musetti · verified editorial review"
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            tools
            skills
            specs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -e .
      - name: Existing DeepSeek editorial and PushPlus contracts
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python tools/zhou_musetti_editorial_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zhou-musetti-model-review
          path: model-review
          retention-days: 3
