name: Djokovic Bu source review export
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: [.github/workflows/djokovic-bu-source-review.yml]
permissions:
  contents: read
  actions: write
jobs:
  launch:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/djokovic-bu-20261003'
    runs-on: ubuntu-latest
    steps:
      - name: Export under production branch cache scope
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run djokovic-bu-source-review.yml --ref codex/djokovic-bu-20261003
  export:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for native source cache
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 80); do
            state=$(gh api repos/robertyang87/tennislive/actions/runs/37101585454 --jq '.status')
            if [ "$state" = completed ]; then
              result=$(gh api repos/robertyang87/tennislive/actions/runs/37101585454 --jq '.conclusion')
              [ "$result" = success ] || { echo "Native probe ended: $result"; exit 1; }
              exit 0
            fi
            sleep 15
          done
          echo "Native probe not complete"; exit 1
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/tennislive-sources
          key: reel-src-djokovic-bu-beijing-2026-r2-4166c83cbd23b2be
          fail-on-cache-miss: true
      - name: Export exact cached source bytes for local review
        run: |
          mkdir -p review-export
          python3 - <<'PY'
          import pathlib, hashlib, json
          url='https://www.youtube.com/watch?v=U_XusSb_NV4'
          name=hashlib.sha1(url.encode()).hexdigest()[:16]+'.mp4'
          src=pathlib.Path('~/.cache/tennislive-sources').expanduser()/name
          raw=src.read_bytes()
          out=pathlib.Path('review-export')
          manifest={'url':url,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'parts':[]}
          for i,pos in enumerate(range(0,len(raw),24*1024*1024)):
              name=f'part-{i:02d}.bin'
              (out/name).write_bytes(raw[pos:pos+24*1024*1024])
              manifest['parts'].append(name)
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          print(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: djokovic-bu-review-manifest
          path: review-export/manifest.json
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: djokovic-bu-review-part-00
          path: review-export/part-00.bin
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: djokovic-bu-review-part-01
          path: review-export/part-01.bin
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: djokovic-bu-review-part-02
          path: review-export/part-02.bin
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: djokovic-bu-review-part-03
          path: review-export/part-03.bin
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: djokovic-bu-review-part-04
          path: review-export/part-04.bin
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: djokovic-bu-review-part-05
          path: review-export/part-05.bin
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: djokovic-bu-review-part-06
          path: review-export/part-06.bin
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: djokovic-bu-review-part-07
          path: review-export/part-07.bin
          if-no-files-found: ignore
          retention-days: 3
