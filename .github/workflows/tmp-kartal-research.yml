name: tmp-kartal-research
# 临时：网球有故事 kartal-story-2026 核事实、查官方源片。只在本分支 push 触发，合并前删除。
on:
  push:
    branches: [claude/kartal-story-2026]
    paths: [research/kartal-story-2026/*.txt, .github/workflows/tmp-kartal-research.yml]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/kartal-story-2026
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "yt-dlp[default]" beautifulsoup4
      - name: meta
        continue-on-error: true
        run: |
          for id in $(grep -v '^#' research/kartal-story-2026/ids.txt); do
            yt-dlp --skip-download --print "%(id)s | %(channel)s | %(uploader_id)s | %(height)sp %(fps)sfps | %(duration)ss | %(upload_date)s | %(title)s" "https://www.youtube.com/watch?v=$id" 2>&1 | tail -1
          done
      - name: search
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, subprocess
          for q in open('research/kartal-story-2026/queries.txt'):
              q=q.strip()
              if not q or q.startswith('#'): continue
              print('\n######', q, flush=True)
              r=subprocess.run(['yt-dlp','--flat-playlist','-J',f'ytsearch12:{q}'],capture_output=True,text=True)
              try: d=json.loads(r.stdout)
              except Exception: print('ERR',r.stderr[-500:]); continue
              for e in d.get('entries',[]):
                  print(f"{e.get('id')} | {e.get('channel')} | {e.get('duration')} | {e.get('title')}", flush=True)
          PY
      - name: pages
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import urllib.request, re
          from bs4 import BeautifulSoup
          UA={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36'}
          for u in open('research/kartal-story-2026/pages.txt'):
              u=u.strip()
              if not u or u.startswith('#'): continue
              print('\n######', u, flush=True)
              try:
                  h=urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=30).read().decode('utf-8','replace')
              except Exception as e:
                  print('ERR',e); continue
              s=BeautifulSoup(h,'html.parser')
              for t in s(['script','style','nav','footer','header']): t.decompose()
              txt=re.sub(r'\n\s*\n+','\n',s.get_text('\n'))
              print(txt[:14000])
          PY
      - name: captions
        continue-on-error: true
        run: |
          mkdir -p subs
          for id in $(grep -v '^#' research/kartal-story-2026/ids.txt); do
            yt-dlp --skip-download --write-auto-subs --write-subs --sub-langs "en.*" --sub-format vtt -o "subs/%(id)s" "https://www.youtube.com/watch?v=$id" >/dev/null 2>&1 || echo "subs fail $id"
          done
          python3 - <<'PY'
          import glob,re
          for f in sorted(glob.glob('subs/*.vtt')):
              print('\n######', f)
              t=None; last=''
              for line in open(f,encoding='utf-8'):
                  line=line.strip()
                  m=re.match(r'(\d+):(\d+):(\d+\.\d+) -->',line)
                  if m: t=int(m[1])*3600+int(m[2])*60+float(m[3]); continue
                  txt=re.sub(r'<[^>]+>','',line)
                  if txt and txt!=last and t is not None and not txt.startswith(('WEBVTT','Kind:','Language:')):
                      print(f'{t:8.2f} {txt}'); last=txt
          PY
