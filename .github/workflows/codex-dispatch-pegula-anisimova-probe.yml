name: codex-dispatch-pegula-anisimova-probe

on:
  push:
    branches:
      - codex/pegula-anisimova-20260821
    paths:
      - .github/workflows/codex-dispatch-pegula-anisimova-probe.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: "${{ github.event.head_commit.message == 'ci: dispatch Pegula-Anisimova probe' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch source probe and draft spec
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run match-reel.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "codex/pegula-anisimova-20260821" \
            -f mode=probe \
            -f slug=pegula-anisimova \
            -f url="https://youtu.be/GJb3f9i-D7E" \
            -f every=2 \
            -f home="Amanda Anisimova" \
            -f away="Jessica Pegula" \
            -f event="Cincinnati Open" \
            -f year=2026 \
            -f push=false
