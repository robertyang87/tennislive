name: player-name-sync

on:
# **2026-07-31：定时停掉，只留手动。**
# 六月至今 `player_names_top500.json` 只变过一次，而那次是人手改的，
# 不是这个周任务改的。译名表要补的时候手动跑一次即可。
#
# 原来的定时（留档，恢复时照抄）：
#   schedule:
#   - cron: "23 12 * * 1" # 周一 20:23 北京时间，等待两站官方周榜稳定
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # **原来这儿写着 `fetch-depth: 0`**，也就是把 1.77 GiB 的完整历史
          # （每一条成片的每一个版本）全拉下来。而这条工作流里唯一的 git 读操作
          # 是 `git diff --quiet -- <两个被跟踪的文件>`——那是**工作区对 HEAD**
          # 的比较，一条历史都不需要。提交和推送在浅克隆上照样能做，别的工作流
          # 一直是这么跑的。
          #
          # 顺带把 output/ 也挡在外面：HEAD 上它就有 1.36 GB，而这条一个字节
          # 都不碰它。cone 模式下根目录的文件总是带上。
          sparse-checkout: |
            assets
            data
            docs
            specs
            src
            tests
            tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装同步依赖
        run: pip install -q -e ".[dev]"
      - name: 同步 ATP/WTA 前 500 中文名
        run: python tools/update_player_names.py
      - name: 校验 1000/1000 覆盖率与译名入口
        run: |
          python tools/update_player_names.py --check
          pytest -q tests/test_player_names.py
      - name: 提交更新
        shell: bash
        run: |
          if git diff --quiet -- src/tennislive/zh/player_names_top500.json data/player_name_review_queue.json; then
            echo "排名与译名快照无变化"
            exit 0
          fi
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add src/tennislive/zh/player_names_top500.json data/player_name_review_queue.json
          python tools/check_staged_file_sizes.py
          git commit -m "data: sync top-500 Chinese player names [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
