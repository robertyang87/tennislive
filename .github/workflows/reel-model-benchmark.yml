name: reel-model-benchmark

# 只做影子练习和对比报告：不提交、不 dispatch render、不调用 PushPlus。
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "skills/tennis-reel-production/**"
      - "tools/draft_spec.py"
      - "tools/analyze_reel_visuals.py"
      - "tools/benchmark_reel_models.py"
      - "tools/reel_skill.py"
      - ".github/workflows/reel-model-benchmark.yml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            assets
            output/2026-08-23/reel/fils-cobolli-cincinnati-2026-sf
            skills
            specs
            src
            tools

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装只读基准依赖
        run: pip install -q -e . "yt-dlp[default]>=2026.7.4"

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - uses: actions/cache@v4
        with:
          path: ~/.cache/tennislive-sources
          key: reel-src-fils-cobolli-cincinnati-2026-sf-visual-benchmark-v2
          restore-keys: reel-src-fils-cobolli-cincinnati-2026-sf-
      - name: Restore missing reference contact sheets from original source
        timeout-minutes: 7
        env:
          TENNISLIVE_SOURCE_CACHE: ~/.cache/tennislive-sources
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          python - <<'PY'
          import os,json,sys
          from pathlib import Path
          sys.path.insert(0,"tools")
          from build_match_reel import download,contact_sheet,probe_duration
          base=Path("output/2026-08-23/reel/fils-cobolli-cincinnati-2026-sf")
          if not list(base.glob("contact_*.jpg")):
              cookie=Path(os.environ["RUNNER_TEMP"])/"benchmark-cookies.txt"
              if os.environ.get("YT_COOKIES_TXT"):
                  cookie.write_text(os.environ["YT_COOKIES_TXT"])
                  os.chmod(cookie,0o600)
                  os.environ["YT_COOKIES"]=str(cookie)
              try:
                  probe=json.loads((base/"probe.json").read_text())
                  source=download(probe["url"],Path(os.environ["RUNNER_TEMP"])/"benchmark-source.mp4")
                  assert abs(probe_duration(source)-float(probe["duration"])) < .25, "Reference source changed; cannot reuse old timing"
                  contact_sheet(source,base,every=2)
              finally:
                  cookie.unlink(missing_ok=True)
          assert list(base.glob("contact_*.jpg")), "Reference still has no images"
          PY


      - name: DeepSeek + MiniMax 复做已发布样片并对比
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: python tools/benchmark_reel_models.py --outdir /tmp/reel-model-benchmark

      - name: 上传候选 spec 与逐项对比报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-model-benchmark-${{ github.run_number }}
          path: /tmp/reel-model-benchmark
          retention-days: 30
