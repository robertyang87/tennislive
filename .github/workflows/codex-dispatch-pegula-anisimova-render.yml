name: codex-dispatch-pegula-anisimova-render

on:
  push:
    branches:
      - codex/pegula-anisimova-final-20260821
    paths:
      - .github/workflows/codex-dispatch-pegula-anisimova-render.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: "${{ github.event.head_commit.message == 'ci: dispatch Pegula-Anisimova render' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch render without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run match-reel.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "codex/pegula-anisimova-final-20260821" \
            -f mode=render \
            -f slug=pegula-anisimova \
            -f push=false
