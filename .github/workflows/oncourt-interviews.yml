name: oncourt-interviews

# 场上赛后采访的持续采集。每天两轮，把新出现的视频并进
# data/oncourt_interviews.json，供英语学习选材用。
#
# 只收一类：**赛后直接在场上接受采访**（主持人拿麦上场问、球员站着答）。
# 颁奖礼致辞、冠军演讲也在场上，但那是「讲」不是「接受采访」，默认不收；
# 媒体间的新闻发布会永远不收（另有 ASAP Sports 的人工文字稿，
# 见 docs/post-match-interview-sources.md）。
#
# 为什么跑在 Actions 而不是本地：沙箱下 YouTube 会对连续请求返 429，
# 退避到 240 秒都拿不到；Actions 的出口没这个问题。
on:
  push:
    branches:
      - codex/swiatek-rybakina-cincinnati-2026-qf-interview
    paths:
      - .github/workflows/oncourt-interviews.yml
  # **2026-08-18 恢复定时。** 之前 7/31 停掉是因为「4551 条库存没有下游在读」；
  # 现在下游有了——`pick_oncourt_clips.py` 挑成片候选、`oncourt_feed.py` 推清单，
  # 都是这条库的直接消费者。没有定时采集，新采访永远进不来，成片候选永远是空的。
  schedule:
  # **每天两轮**，不是每周。「赢球后的采访」等一周就没意义了——
  # 赛事一周打完，周推的话决赛采访最晚要等七天才到手。
  #
  # cron 一律是 UTC，北京时间要自己减八小时；**减完跨了零点就要连日期一起挪**。
  #
  # 两轮的分工按**赛区落在 UTC 的哪一段**来定，不是随手挑两个整点：
  #   北京 05:00（21:00 UTC）——欧洲白天和傍晚场都打完并上传了
  #   北京 11:00（03:00 UTC）——补美洲晚场。美东夜场常在 01:00–04:00 UTC
  #                             才结束，上一轮跑的时候它还没打完
  - cron: "0 21 * * *"   # 北京 05:00（次日）
  - cron: "0 3 * * *"    # 北京 11:00（当日）
  workflow_dispatch:
    inputs:
      only:
        description: "只扫名字含这些子串的源（空格分隔，留空＝全部）"
        required: false
        default: ""
      full:
        description: "重扫全部历史（每源 600–800 条，十几分钟）。日常不需要"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: oncourt-interviews
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # **别把 output/ 拉下来。** HEAD 上它就有 1.36 GB（.git 1.77 GiB），
          # checkout 因此每次要一分半上下（daily 那条量到 1:31，match-reel 2:44），
          # 而**这条工作流一个字节都不碰 output/**。稀疏检出把它挡在外面，
          # 剩下的全部加起来 161 MB。cone 模式下根目录的文件总是带上。
          #
          # ⚠️ 这里没有 `git sparse-checkout add`——因为它不写产物。会写
          # `output/` 的那几条要在算出目录之后把自己那一格 add 回来，
          # 见 match-reel.yml。照抄这一段之前先确认你这条真的不写产物。
          sparse-checkout: |
            assets
            data
            docs
            specs
            src
            tests
            tools

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装 yt-dlp
        # `[default]` 带 yt-dlp-ejs，解 n challenge 要它；少了它格式表只剩
        # 故事板，而 yt-dlp 不会说「装少了」。见 match-reel.yml 那条注释。
        run: pip install -q "yt-dlp[default]>=2026.7.4"

      - name: 采集
        run: |
          # 默认日常增量（每源 60 条，约 1 分钟）。新内容永远在频道最前面，
          # 每天重刷 800 条历史既慢又没意义——手动派发时勾 full 才深扫。
          python tools/collect_oncourt_interviews.py \
            ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }} \
            ${{ github.event.inputs.full == 'true' && '--full' || '' }} \
            | tee /tmp/oncourt.log

      - name: 用赛果反查缺口（顺带发现新频道）
        run: |
          # 拿「赢了但没采访」的场次当种子，按「球员 + 赛事」直接搜。
          # 比通用查询强的地方在于能撞见标题不含 on-court/interview 的频道
          # ——`Tennis Interviews`（234 条，补马德里/迈阿密/印第安维尔斯）
          # 就是这么找到的，通用查询永远搜不到它。
          python tools/oncourt_hunt.py --days 2 | tee -a /tmp/oncourt.log || true

      - name: 发现新来源（每周一次）
        # 注册表里最有价值的几个源全是手搜出来的（Eurosport 78 条、
        # United Cup 84、Hopman Cup 118），它们不在任何官方清单上。
        # 新的还会不断冒出来，搬运号尤其如此，所以把发现本身自动化。
        # 只在周一跑：搜索有配额，每天跑没必要——新源不会天天出现。
        #
        # **只挂在早上那一轮上。** 一天跑两轮，不限定的话周一会搜两遍。
        if: github.event.schedule != '0 3 * * *'
        run: |
          # 星期几按**上海时间**算。早上那一轮是 21:00 UTC 起跑，UTC 还停在
          # 前一天——`date -u +%u` 判出来的「周一」其实是北京的周二。
          # 这就是仓库里那条「产物在哪个日期目录下按上海时间算」的同一个坑。
          if [ "$(TZ=Asia/Shanghai date +%u)" = "1" ] || [ -n "${{ github.event.inputs.only }}" ]; then
            python tools/discover_oncourt_sources.py --min 2 | tee -a /tmp/oncourt.log || true
          else
            echo "非周一（上海时间 $(TZ=Asia/Shanghai date '+%F %A')），跳过来源发现。"
          fi

      - name: 比对赛果，算出「赢了但没采访」的缺口
        run: |
          # 采集保证不了每场都有采访（源头就不是每场都发），所以把缺口
          # 明确列出来，别让它静默存在。抓不到赛果时退出码 2，
          # 这里不让它中断整个流程——采访照推，只是没有缺口对照。
          pip install -q -e . 2>&1 | tail -1
          python tools/oncourt_gaps.py --html /tmp/oncourt_gaps.html \
            | tee -a /tmp/oncourt.log || echo "::warning::赛果抓取失败，本次没有缺口对照"

      - name: 筛出关键场次与中国球员，推到微信
        id: feed
        # 推送失败必须保留真实 outcome，但不能阻断下一步把已经采集到的数据
        # 提交回仓库。提交后会再次按 outcome 让整个 run 红灯告警。
        continue-on-error: true
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          # **pipefail 必须开。** 这一步是 `python ... | tee`，默认情况下 bash
          # 报的是管道最后一环（tee）的退出码——第一次定时跑的时候 oncourt_feed.py
          # 抛了 TypeError 直接崩掉，一条都没推出去，而这一步和整个 run
          # 都显示 success。**又是拿信号当产物。**
          #
          # 上面几步的 `| tee ... || true` 是**故意**吞错的（搜索和缺口对账失败
          # 不该拦住推送），那几处不受影响——pipefail 只让没写 `|| true`
          # 的那几步真实反映退出码。
          set -o pipefail
          # 采集是全量的（八百多条），推送只推两类：关键场次（决赛/半决赛/
          # 四分之一）和中国球员**赢球后**的。已推过的记在
          # data/oncourt_feed_sent.json 里，不会重复打扰。
          if [ -z "$PUSHPLUS_TOKEN" ]; then
            echo "::notice::没有 PUSHPLUS_TOKEN，只生成清单不推送"
            python tools/oncourt_feed.py --dry-run | tee -a /tmp/oncourt.log
          else
            pip install -q -e . 2>&1 | tail -1
            python tools/oncourt_feed.py --push --gaps /tmp/oncourt_gaps.html \
              | tee -a /tmp/oncourt.log
          fi

      - name: 挑出该剪成片的候选（赛后开麦自动出片链的输入）
        run: |
          # 在 oncourt_feed 的选题闸之上再加三道成片闸（oncourt 类型 / 未做过 /
          # 赛事还在打），写 data/interview_clip_candidates.json 给「自动建 spec →
          # dispatch render」消费。当前库里没有窗口内的候选很正常（采集刚恢复，
          # 辛辛那提还没打到关键轮次）——候选文件空着就是「现在没有该做的」。
          python tools/pick_oncourt_clips.py --write \
            | tee -a /tmp/oncourt.log

      - name: 自动建赛后开麦 spec 草稿（转写 + 翻译）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          # 对**全部**候选并行建草稿：yt-dlp 下音频 → faster-whisper small.en 转写 →
          # DeepSeek 翻译 → specs/interviews/<slug>.draft.json。⚠️ 必须并行——
          # 好多比赛差不多时间结束，一条一条跑（下音频+whisper+翻译约 1-3 分钟）
          # N 场就是 N 倍时间；`--max-parallel 2` 把总时间压成「最慢那一场 × 2」，
          # 也别开太大（whisper 吃 CPU，runner 4 核，2 保守）。候选为空就跳过
          # （连 faster-whisper 都不装）。
          n=$(python -c "import json;print(len(json.load(open('data/interview_clip_candidates.json'))))" 2>/dev/null || echo 0)
          if [ "$n" = "0" ]; then
            echo "没有成片候选，跳过自动建 spec。"
          else
            pip install -q faster-whisper 2>&1 | tail -1
            python tools/draft_interview_spec.py --max-parallel 2 --write \
              | tee -a /tmp/oncourt.log
          fi

      - name: 提交新增条目
        run: |
          # 只碰这几个文件。并行的生成任务互相覆盖过整棵 output/，
          # 这里从一开始就把范围钉死。
          if git diff --quiet -- data/oncourt_interviews.json data/oncourt_feed_sent.json data/interview_clip_candidates.json specs/interviews; then
            echo "没有新增，不提交。"
            exit 0
          fi
          n=$(python -c "import json;print(len(json.load(open('data/oncourt_interviews.json'))['items']))")
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add data/oncourt_interviews.json data/oncourt_feed_sent.json data/interview_clip_candidates.json specs/interviews
          python tools/check_staged_file_sizes.py
          git commit -m "data: 场上赛后采访采集（累计 ${n} 条）+ 成片候选 + 采访 spec 草稿"
          for i in 1 2 3 4; do
            # --autostash：提交后工作树可能有未跟踪产物（自动建 spec 的临时文件），
            # 没有它 `git pull --rebase` 会报 unstaged changes 直接失败（真踩过）。
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          echo "::error::推送失败"
          exit 1

      - name: 推送失败后确认数据已保留并告警
        if: steps.feed.outcome == 'failure'
        run: |
          echo "::error::采访推送失败；本轮已采集的数据已先提交到仓库，下轮不会重新丢失。"
          exit 1

      - name: 摘要
        if: always()
        run: |
          {
            echo '### 场上采访采集'
            echo '```'
            cat /tmp/oncourt.log 2>/dev/null || echo '（没有日志）'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  codex_preview:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            assets
            data
            specs
            src
            tools

      - name: 把本条采访产物目录加回稀疏范围
        run: git sparse-checkout add output/interviews/swiatek-rybakina-cincinnati-2026-qf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装转写依赖
        run: pip install -q -e . "yt-dlp[default]>=2026.7.4" faster-whisper

      - name: 按正式渲染线准备 YouTube cookies
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s\n' "$YT_COOKIES_TXT" > /tmp/yt-cookies.txt
            echo "COOKIES=/tmp/yt-cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: 用采访下载梯子转写并翻译完整采访
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, "tools")
          import draft_interview_spec as draft
          from build_interview_clip import yt_download
          from faster_whisper import WhisperModel
          from tennislive.research.brief import Chat

          candidate = json.loads(Path("data/interview_clip_candidates.json").read_text())[0]
          calendar = json.loads(Path("data/tour_calendar_2026.json").read_text())
          with tempfile.TemporaryDirectory() as td:
              audio = yt_download(candidate["url"], Path(td) / "audio.m4a", "ba", {})
              model = WhisperModel("small.en", compute_type="int8")
              segments, info = model.transcribe(
                  str(audio), vad_filter=True, word_timestamps=True)
              segments = list(segments)
              rows = [{"t": round(s.start, 2), "text": s.text.strip()}
                      for s in segments if s.text.strip()]
          if not rows:
              raise SystemExit("转写为空")
          chat = Chat()
          if not chat.ready:
              raise SystemExit("没有 DEEPSEEK_API_KEY")
          zh = draft.translate(rows, chat)
          spec = draft.build_spec(candidate, zh, float(info.duration or 138.0), calendar)
          spec["slug"] = "swiatek-rybakina-cincinnati-2026-qf"
          spec["_asr_rows"] = rows
          out = Path("specs/interviews/swiatek-rybakina-cincinnati-2026-qf.draft.json")
          out.write_text(json.dumps(spec, ensure_ascii=False, indent=2), encoding="utf-8")

          events = []
          for s in segments:
              words = [w for w in (s.words or []) if w.word.strip()]
              if words:
                  base = float(words[0].start)
                  segs = [{"utf8": w.word.strip(),
                           "tOffsetMs": round((float(w.start) - base) * 1000)}
                          for w in words]
                  end = float(words[-1].end)
              elif s.text.strip():
                  base = float(s.start)
                  segs = [{"utf8": s.text.strip(), "tOffsetMs": 0}]
                  end = float(s.end)
              else:
                  continue
              events.append({
                  "tStartMs": round(base * 1000),
                  "dDurationMs": max(1, round((end - base) * 1000)),
                  "segs": segs,
              })
          capdir = Path("output/interviews/swiatek-rybakina-cincinnati-2026-qf")
          capdir.mkdir(parents=True, exist_ok=True)
          cap = capdir / "cap_aufUQ6eSXSM.en.json3"
          cap.write_text(json.dumps({"events": events}, ensure_ascii=False),
                         encoding="utf-8")
          print(f"生成 {len(rows)} 条双语字幕、{len(events)} 个时间轴事件 → {out} / {cap}")
          PY

      - name: 提交双语草稿到预览分支
        run: |
          git add specs/interviews/*.draft.json \
            output/interviews/swiatek-rybakina-cincinnati-2026-qf/cap_aufUQ6eSXSM.en.json3
          if git diff --cached --quiet; then
            echo "没有生成草稿"
            exit 1
          fi
          git config user.name "Codex"
          git config user.email "noreply@openai.com"
          git commit -m "interview: 生成斯瓦泰克赛后采访双语草稿"
          git push origin "HEAD:${GITHUB_REF_NAME}"
