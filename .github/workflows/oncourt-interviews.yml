name: oncourt-interviews

# 场上赛后采访的持续采集。每 30 分钟一轮，把新出现的视频并进
# data/oncourt_interviews.json，供英语学习选材用。
#
# 只收一类：**赛后直接在场上接受采访**（主持人拿麦上场问、球员站着答）。
# 颁奖礼致辞、冠军演讲也在场上，但那是「讲」不是「接受采访」，默认不收；
# 媒体间的新闻发布会永远不收（另有 ASAP Sports 的人工文字稿，
# 见 docs/post-match-interview-sources.md）。
#
# 为什么跑在 Actions 而不是本地：沙箱下 YouTube 会对连续请求返 429，
# 退避到 240 秒都拿不到；Actions 的出口没这个问题。
on:
  # **2026-08-18 恢复定时。** 之前 7/31 停掉是因为「4551 条库存没有下游在读」；
  # 现在下游有了——`pick_oncourt_clips.py` 挑成片候选、`oncourt_feed.py` 推清单，
  # 都是这条库的直接消费者。没有定时采集，新采访永远进不来，成片候选永远是空的。
  schedule:
  # **每 30 分钟一轮**（原来每天两轮）。这条现在是「赛后开麦」自动出片链的
  # 第一环——采集 → 候选 → 草稿，后面 interview-auto-render 每半小时接一次；
  # 采集一天只醒两次的话，一条比赛日下午打完的采访要等到深夜才建草稿，
  # 而这条线的规矩是「上一个比赛日的不做了」——等一晚等出来的常常是过期候选。
  # 每 30 分钟把「打完 → 候选矩阵启动」的最坏等待压到半小时。
  #
  # 分钟取 7，避开 :00/:30——GitHub 在整点半点最容易延迟或丢弃
  # （daily 当年留下的经验，knowledge-adhoc 的 08:37 也是这么定的）。
  # 每 30 分钟追一轮新赛果后的采访。不同比赛在下面 matrix 中各占一个 runner，
  # 不再让第 N 场等待前 N-1 场转写完成。
  - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "只扫名字含这些子串的源（空格分隔，留空＝全部）"
        required: false
        default: ""
      full:
        description: "重扫全部历史（每源 600–800 条，十几分钟）。日常不需要"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: oncourt-interviews
  cancel-in-progress: false

jobs:
  collect:
    outputs:
      candidate_ids: ${{ steps.matrix.outputs.candidate_ids }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # **别把整棵 output/ 拉下来。** HEAD 上它就有 1.36 GB（.git 1.77 GiB），
          # checkout 因此每次要一分半上下（daily 那条量到 1:31，match-reel 2:44）。
          # 这条工作流**只写 `output/interviews/`**（自动建草稿落的第一份转写
          # cap_asr.json3，现在只有几 MB 文本）——目录是固定的，按仓库的老规矩
          # 直接列进 sparse-checkout（「目录固定 → 直接列，不用 add」），
          # 其余 output/ 照旧挡在外面。cone 模式下根目录的文件总是带上。
          sparse-checkout: |
            assets
            data
            docs
            output/interviews
            specs
            src
            tests
            tools

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装 yt-dlp
        # `[default]` 带 yt-dlp-ejs，解 n challenge 要它；少了它格式表只剩
        # 故事板，而 yt-dlp 不会说「装少了」。见 match-reel.yml 那条注释。
        run: pip install -q "yt-dlp[default]>=2026.7.4"

      - name: 采集
        run: |
          # **pipefail 必须开**：这一步是 `python | tee`，不开的话 bash 报的是
          # tee 的退出码——采集崩了整步照样绿（「筛出关键场次」那一步就这么
          # 骗过一次，这里是同一个形状）。
          set -o pipefail
          # 默认日常增量（每源 60 条，约 1 分钟）。新内容永远在频道最前面，
          # 每天重刷 800 条历史既慢又没意义——手动派发时勾 full 才深扫。
          python tools/collect_oncourt_interviews.py \
            ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }} \
            ${{ github.event.inputs.full == 'true' && '--full' || '' }} \
            | tee /tmp/oncourt.log

      - name: 用赛果反查缺口（顺带发现新频道）
        run: |
          # 拿「赢了但没采访」的场次当种子，按「球员 + 赛事」直接搜。
          # 比通用查询强的地方在于能撞见标题不含 on-court/interview 的频道
          # ——`Tennis Interviews`（234 条，补马德里/迈阿密/印第安维尔斯）
          # 就是这么找到的，通用查询永远搜不到它。
          python tools/oncourt_hunt.py --days 2 | tee -a /tmp/oncourt.log || true

      - name: 发现新来源（每周一次）
        # 注册表里最有价值的几个源全是手搜出来的（Eurosport 78 条、
        # United Cup 84、Hopman Cup 118），它们不在任何官方清单上。
        # 新的还会不断冒出来，搬运号尤其如此，所以把发现本身自动化。
        # 只在周一跑一次：搜索有配额，每天跑没必要——新源不会天天出现。
        run: |
          # 星期几按**上海时间**算（「产物在哪个日期目录下按上海时间算」同一个坑）。
          # cron 现在是每 3 小时一轮（`7 */3 * * *`），只看星期几的话周一会搜
          # 八遍——再钉一个钟点：只认 21:07 UTC 那一轮（北京周一 05:07，
          # 沿用原来「早上那一轮」的位置）。手动 dispatch 带 only 时照旧放行。
          if [ -n "${{ github.event.inputs.only }}" ] || { [ "$(TZ=Asia/Shanghai date +%u)" = "1" ] && [ "$(date -u +%H)" = "21" ]; }; then
            python tools/discover_oncourt_sources.py --min 2 | tee -a /tmp/oncourt.log || true
          else
            echo "非周一 21 时那一轮（上海 $(TZ=Asia/Shanghai date '+%F %A')，UTC $(date -u +%H) 时），跳过来源发现。"
          fi

      - name: 比对赛果，算出「赢了但没采访」的缺口
        run: |
          # 采集保证不了每场都有采访（源头就不是每场都发），所以把缺口
          # 明确列出来，别让它静默存在。抓不到赛果时退出码 2，
          # 这里不让它中断整个流程——采访照推，只是没有缺口对照。
          pip install -q -e . 2>&1 | tail -1
          python tools/oncourt_gaps.py --html /tmp/oncourt_gaps.html \
            | tee -a /tmp/oncourt.log || echo "::warning::赛果抓取失败，本次没有缺口对照"

      - name: 筛出关键场次与中国球员，推到微信
        id: feed
        # 推送失败必须保留真实 outcome，但不能阻断下一步把已经采集到的数据
        # 提交回仓库。提交后会再次按 outcome 让整个 run 红灯告警。
        continue-on-error: true
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          # **pipefail 必须开。** 这一步是 `python ... | tee`，默认情况下 bash
          # 报的是管道最后一环（tee）的退出码——第一次定时跑的时候 oncourt_feed.py
          # 抛了 TypeError 直接崩掉，一条都没推出去，而这一步和整个 run
          # 都显示 success。**又是拿信号当产物。**
          #
          # 上面几步的 `| tee ... || true` 是**故意**吞错的（搜索和缺口对账失败
          # 不该拦住推送），那几处不受影响——pipefail 只让没写 `|| true`
          # 的那几步真实反映退出码。
          set -o pipefail
          # 采集是全量的（八百多条），推送只推两类：关键场次（决赛/半决赛/
          # 四分之一）和中国球员**赢球后**的。已推过的记在
          # data/oncourt_feed_sent.json 里，不会重复打扰。
          if [ -z "$PUSHPLUS_TOKEN" ]; then
            echo "::notice::没有 PUSHPLUS_TOKEN，只生成清单不推送"
            python tools/oncourt_feed.py --dry-run | tee -a /tmp/oncourt.log
          else
            pip install -q -e . 2>&1 | tail -1
            python tools/oncourt_feed.py --push --gaps /tmp/oncourt_gaps.html \
              | tee -a /tmp/oncourt.log
          fi

      - name: 挑出该剪成片的候选（赛后开麦自动出片链的输入）
        run: |
          # 在 oncourt_feed 的选题闸之上再加三道成片闸（oncourt 类型 / 未做过 /
          # 赛事还在打），写 data/interview_clip_candidates.json 给「自动建 spec →
          # dispatch render」消费。当前库里没有窗口内的候选很正常（采集刚恢复，
          # 辛辛那提还没打到关键轮次）——候选文件空着就是「现在没有该做的」。
          python tools/pick_oncourt_clips.py --write \
            | tee -a /tmp/oncourt.log

      - name: 生成逐场并行矩阵
        id: matrix
        run: |
          IDS=$(python - <<'PY'
          import json
          rows = json.load(open('data/interview_clip_candidates.json', encoding='utf-8'))
          print(json.dumps([str(row['id']) for row in rows], separators=(',', ':')))
          PY
          )
          echo "candidate_ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "本轮逐场任务：$IDS"

      - name: 提交新增条目
        run: |
          # 只碰这几个文件。并行的生成任务互相覆盖过整棵 output/，
          # 这里从一开始就把范围钉死。
          #
          # **先 add 再判**：自动建草稿产出的是**新建**的未跟踪文件
          # （specs/interviews/*.draft.json、output/interviews/<slug>/cap_asr.json3），
          # 裸的 `git diff --quiet` 看不见它们——原来的写法会在「只有新草稿、
          # 没有老文件变化」的那一轮打印「没有新增」直接退出，整轮转写翻译
          # 就这么静默丢掉（interview-auto-render 的提交步踩过一模一样的坑）。
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add data/oncourt_interviews.json data/oncourt_feed_sent.json \
            data/interview_clip_candidates.json data/interview_source_review_queue.json
          if git diff --cached --quiet; then
            echo "没有新增，不提交。"
            exit 0
          fi
          n=$(python -c "import json;print(len(json.load(open('data/oncourt_interviews.json'))['items']))")
          python tools/check_staged_file_sizes.py
          git commit -m "data: 场上赛后采访采集（累计 ${n} 条）+ 成片候选 + 采访 spec 草稿"
          for i in 1 2 3 4; do
            # --autostash：提交后工作树可能有未跟踪产物（自动建 spec 的临时文件），
            # 没有它 `git pull --rebase` 会报 unstaged changes 直接失败（真踩过）。
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          echo "::error::推送失败"
          exit 1

      - name: 推送失败后确认数据已保留并告警
        if: steps.feed.outcome == 'failure'
        run: |
          echo "::error::采访推送失败；本轮已采集的数据已先提交到仓库，下轮不会重新丢失。"
          exit 1

      - name: 摘要
        if: always()
        run: |
          {
            echo '### 场上采访采集'
            echo '```'
            cat /tmp/oncourt.log 2>/dev/null || echo '（没有日志）'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 一场比赛一个 runner：下载/ASR/翻译互不抢 4 核 CPU，一场失败也不会取消其余。
  # 同一 candidate id 单飞；不同比赛最多 4 路并行。
  draft:
    needs: collect
    # feed 推送告警发生在候选已提交之后；即使那一步把 collect 标红，也不能让
    # 已发现的比赛错过转写窗口。只有矩阵本身为空才不启动。
    if: >-
      always()
      && needs.collect.outputs.candidate_ids != ''
      && needs.collect.outputs.candidate_ids != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        candidate_id: ${{ fromJSON(needs.collect.outputs.candidate_ids) }}
    concurrency:
      group: interview-draft-${{ matrix.candidate_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            assets
            data
            output/interviews
            specs
            src
            tools

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装单场转写依赖
        timeout-minutes: 15
        run: |
          source tools/ci_apt_install.sh
          apt_install_cached fonts-noto-core
          pip install -q -e . faster-whisper "yt-dlp[default]>=2026.7.4"

      - name: 启动 YouTube PO token provider
        continue-on-error: true
        timeout-minutes: 3
        run: |
          pip install -q bgutil-ytdlp-pot-provider
          docker run --name bgutil-pot -d -p 4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider
          for i in $(seq 1 25); do
            curl -fsS http://127.0.0.1:4416/ping >/dev/null && exit 0
            sleep 2
          done
          docker logs bgutil-pot 2>&1 | tail -20 || true
          echo "::warning::PO token provider 未就绪；继续用 cookies/client 梯子尝试"
          exit 1

      - name: 落 cookies（配了 Secret 才有）
        id: cookies
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "path=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_OUTPUT"
          fi

      - name: 单场生成精确行号草稿
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          YT_COOKIES: ${{ steps.cookies.outputs.path }}
        run: |
          set -o pipefail
          python tools/draft_interview_spec.py \
            --candidate-id '${{ matrix.candidate_id }}' --max-parallel 1 --write \
            | tee /tmp/draft.log

      - name: 提交本场草稿
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add specs/interviews output/interviews
          if git diff --cached --quiet; then
            echo "::error::候选 ${{ matrix.candidate_id }} 返回成功却没有草稿产物"
            exit 1
          fi
          python tools/check_staged_file_sizes.py
          MSG="interview: 自动建立单场草稿 ${{ matrix.candidate_id }}"
          git commit -m "$MSG"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git pull --rebase origin "${GITHUB_REF_NAME}" || { git rebase --abort || true; }
            sleep $((attempt * 3 + RANDOM % 5))
          done
          echo "::error::本场草稿无法落库；其他 matrix 场次不受影响"
          exit 1
