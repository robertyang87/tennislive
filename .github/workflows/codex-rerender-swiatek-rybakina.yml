name: rerender Swiatek Rybakina Cincinnati

on:
  push:
    branches:
      - codex/swiatek-rybakina-cincinnati-20260821
    paths:
      - .github/workflows/codex-rerender-swiatek-rybakina.yml

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start verified rerender
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run match-reel.yml \
            --repo robertyang87/tennislive \
            --ref codex/swiatek-rybakina-cincinnati-20260821 \
            -f mode=render \
            -f slug=swiatek-rybakina-cincinnati-2026-qf \
            -f push=false
