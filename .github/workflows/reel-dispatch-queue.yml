name: reel-dispatch-queue

# A reviewed queue file is the only push-triggered bridge into match-reel.  The
# helper compares the complete push range, rejects edits/deletes/multiple queue
# files, validates every spec, and only then dispatches parallel production renders
# (QC pass automatically fans into serial push-only runs) or one direct publish run.
on:
  push:
    branches: [main]
    paths:
      - "data/reel-dispatch-queue/*.json"

permissions:
  contents: write
  actions: write

concurrency:
  group: reel-dispatch-queue
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Reruns must see receipts committed after the triggering event.
          ref: main
          # The helper needs both ends of the push.  Avoid fetching the repository's
          # full, media-heavy history; explicitly fetch the event's two endpoint commits.
          fetch-depth: 1
          sparse-checkout: |
            data
            specs
            tools

      - name: Fetch both commits of the triggering push
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] && [[ "$AFTER" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$BEFORE" "$AFTER"

      - name: Validate the queue and dispatch match-reel runs
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          python tools/dispatch_reel_queue.py --before "$BEFORE" --after "$AFTER"
