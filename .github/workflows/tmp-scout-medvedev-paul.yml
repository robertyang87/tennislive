name: tmp-scout-medvedev-paul
on:
  push:
    branches: [claude/medvedev-paul-shanghai-qf]
    paths: ['.github/workflows/tmp-scout-medvedev-paul.yml']
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            src
            specs
            data
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps
        timeout-minutes: 12
        run: |
          python -m pip install -q -e . playwright pillow
          for i in 1 2; do timeout 240 python -m playwright install --with-deps chromium && break; sudo pkill -9 apt-get || true; sudo dpkg --configure -a || true; done
      - name: timing
        continue-on-error: true
        run: |
          D=data/research/medvedev-paul-shanghai-2026-qf
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129 Safari/537.36"
          curl -sS -A "$UA" "https://www.flashscore.com/tennis/atp-singles/shanghai/results/" -o /tmp/fsres.html
          python - <<'P'
          import re,datetime
          t=open('/tmp/fsres.html',encoding='utf-8',errors='replace').read()
          out=[]
          for blk in t.split('~AA÷')[1:]:
              if blk[:8]=='zH4GMhet':
                  f=dict(re.findall(r"([A-Z]{2})÷([^¬~]*)",blk))
                  ad=int(f.get('AD','0'))
                  out.append(f"zH4GMhet AD={ad} utc={datetime.datetime.utcfromtimestamp(ad)} bj={datetime.datetime.utcfromtimestamp(ad+8*3600)} fields={ {k:f[k] for k in ['AE','AF','ER','AD','AC','AB'] if k in f} }")
                  break
          open('data/research/medvedev-paul-shanghai-2026-qf/fs-results-timing.txt','w').write('\n'.join(out) or 'not found')
          print(out)
          P
          curl -sS -A "$UA" "https://en.rolexshanghaimasters.com/en/media/news" -o /tmp/news.html || true
          grep -oE '/en/media/news/[a-z0-9-]+' /tmp/news.html | sort -u | grep -iE 'medvedev|paul|friday|quarter' | head -10 > $D/news-links.txt
          cat $D/news-links.txt
          for l in $(head -3 $D/news-links.txt); do n=$(basename $l); curl -sS -A "$UA" "https://en.rolexshanghaimasters.com$l" -o $D/news-$n.raw; python - "$D/news-$n.raw" <<'P'
          import re,sys,html
          t=open(sys.argv[1],errors='ignore').read()
          body=re.sub(r'\s+',' ',html.unescape(re.sub(r'<script.*?</script>|<style.*?</style>|<[^>]+>',' ',t,flags=re.S)))
          for k in ['night','evening','afternoon','session','Medvedev','Paul']:
              for m in re.finditer(k,body):
                  print(k,':',body[max(0,m.start()-150):m.start()+150]); break
          P
          done
      - name: commit
        run: |
          git config user.name Claude; git config user.email noreply@anthropic.com
          git add -f data/research/medvedev-paul-shanghai-2026-qf
          git commit -qm "scout3: medvedev-paul shanghai qf [skip ci]" && git push origin HEAD:${GITHUB_REF_NAME}
