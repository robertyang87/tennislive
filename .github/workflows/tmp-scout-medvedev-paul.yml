name: tmp-scout-medvedev-paul
on:
  push:
    branches: [claude/medvedev-paul-shanghai-qf]
    paths: ['.github/workflows/tmp-scout-medvedev-paul.yml']
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            src
            specs
            data
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps
        timeout-minutes: 12
        run: |
          python -m pip install -q -e . playwright pillow
          for i in 1 2; do timeout 240 python -m playwright install --with-deps chromium && break; sudo pkill -9 apt-get || true; sudo dpkg --configure -a || true; done
      - name: photos2
        continue-on-error: true
        run: |
          D=data/research/medvedev-paul-shanghai-2026-qf; mkdir -p $D/full
          python tools/find_cover_photo.py --player Medvedev --event Shanghai --date 2026-10-16 --tour atp --days 1 > $D/cover-find-Medvedev-2.txt 2>&1 || true
          python - <<'P'
          import re,subprocess,pathlib
          from PIL import Image
          D=pathlib.Path('data/research/medvedev-paul-shanghai-2026-qf')
          urls=[]
          for u in re.findall(r'https://\S+?\.(?:jpg|jpeg|JPG)',(D/'cover-find-Medvedev-2.txt').read_text()):
              if '2026/10/16' in u and 'PAUL' in u and u not in urls: urls.append(u)
          lines=[]
          for u in urls[:12]:
              name=u.rsplit('/',1)[1]; out=D/'full'/name
              subprocess.run(['curl','-sSL','-A','Mozilla/5.0','-o',str(out),u])
              im=Image.open(out); ex=im.getexif(); sub=ex.get_ifd(0x8769)
              line=f"{name} {im.size} dt={ex.get(306)} orig={sub.get(36867)} off={sub.get(36881)} desc={ex.get(270)} artist={ex.get(315)} url={u}"
              print(line); lines.append(line)
              sm=im.copy(); sm.thumbnail((900,900)); sm.save(D/'full'/(name[:-4]+'.small.jpg'),quality=82)
              if 'MEDVEDEV' not in name.split('-vs-')[0].upper(): out.unlink()
          (D/'full'/'exif.txt').write_text('\n'.join(lines))
          P
      - name: commit
        run: |
          git config user.name Claude; git config user.email noreply@anthropic.com
          git add -f data/research/medvedev-paul-shanghai-2026-qf
          git commit -qm "scout2: medvedev-paul shanghai qf [skip ci]" && git push origin HEAD:${GITHUB_REF_NAME}
