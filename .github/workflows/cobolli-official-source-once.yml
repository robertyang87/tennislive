name: cobolli-official-source-once
on:
  push:
    branches: [feat/cobolli-finals-2026]
    paths: [.github/workflows/cobolli-official-source-once.yml]
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            src
            pyproject.toml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native downloader requirements
        run: |
          pip install -q -e . 'yt-dlp[default]' numpy edge-tts
          source tools/ci_apt_install.sh
          ensure_ffmpeg
      - name: Archive only the verified free official Acapulco source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PYTHONPATH=src:tools python - <<'PY'
          import hashlib,json,pathlib,subprocess
          from build_match_reel import download
          url='https://www.tennistv.com/videos/4459713/acapulco-2026-final-cobolli-tiafoe-short-highlights'
          p=pathlib.Path('4459713-01d711954a47ee48.mp4')
          download(url,p)
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          if actual!='01d711954a47ee48c9c054c582ff65fef8c6f25f4b4020264597ca6ec060a9bd':
              raise ValueError('Official source container differs from reviewed exact bytes: '+actual)
          probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=width,height,r_frame_rate','-of','json',str(p)]))['streams'][0]
          if (probe['width'],probe['height'],probe['r_frame_rate'])!=(1920,1080,'25/1'):
              raise ValueError('Official source geometry differs')
          print(json.dumps({'source':url,'sha256':actual,'bytes':p.stat().st_size,'geometry':probe}))
          PY
          gh release view source-4459713 >/dev/null
          gh release upload source-4459713 4459713-01d711954a47ee48.mp4 --clobber
  ao_english_review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/source_asr.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: cobolli-ao-bounded-large-v3-v1
      - name: Install native read-only source ASR
        run: pip install -q faster-whisper
      - name: One bounded third-model reading of the unchanged official audio
        run: |
          set -euo pipefail
          curl -sSL --fail --retry 2 -o "$RUNNER_TEMP/ao-source.mp4" https://github.com/robertyang87/tennislive/releases/download/source-dSafV4sp0OM/dSafV4sp0OM.mp4
          mkdir -p review
          SOURCE_PATH="$RUNNER_TEMP/ao-source.mp4" PYTHONPATH=tools python - <<'PY_AO'
          import json,os,pathlib
          from source_asr import transcribe,shift,sha256
          source=pathlib.Path(os.environ['SOURCE_PATH'])
          segments,duration=transcribe(source,'large-v3',436,447)
          doc={'model':'large-v3','source_sha256':sha256(source),'clip':[436.0,447.0],'duration':duration,'segments':shift(segments,436.0),'review_scope':'One bounded extra local-ASR cross-check, not human listening or production approval.'}
          pathlib.Path('review/ao-large-v3-436-447.json').write_text(json.dumps(doc,ensure_ascii=False,indent=1)+'\n')
          for row in doc['segments']:print(row['start'],row['end'],row['text'])
          PY_AO
      - uses: actions/upload-artifact@v4
        with:
          name: cobolli-ao-bounded-third-model
          path: review/ao-large-v3-436-447.json
          retention-days: 3
