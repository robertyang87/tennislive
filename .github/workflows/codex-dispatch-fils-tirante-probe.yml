name: codex-dispatch-fils-tirante-probe

on:
  push:
    branches:
      - codex/fils-tirante-probe-20260821
    paths:
      - .github/workflows/codex-dispatch-fils-tirante-probe.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: "${{ github.event.head_commit.message == 'ci: dispatch Fils-Tirante probe' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch source probe and draft spec
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run match-reel.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "codex/fils-tirante-probe-20260821" \
            -f mode=probe \
            -f slug=fils-tirante \
            -f url="https://youtu.be/iDT22qnj6UU" \
            -f every=2 \
            -f home="Arthur Fils" \
            -f away="Thiago Agustin Tirante" \
            -f event="Cincinnati Open" \
            -f year=2026 \
            -f push=false
