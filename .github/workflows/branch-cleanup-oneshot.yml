name: 一次性：清掉遗留分支

# ⚠️⚠️ **这是一条一次性工作流，跑完就删**（和 #905 清掉的那批同一个套路）。
#
# 为什么要它：2026-09-15 的 purge 把 output 媒体从 main 全史抹掉了，可全新 clone
# 还是 3.5G——因为 `git filter-repo` 只 force-push 了 main 和 tags，310 条遗留分支
# 仍指着重写前的历史，把那 2.4G 旧对象全钉着。
#
# 为什么不在会话里直接删：**删除 ref 在那边稳定吃 GitHub 403**（普通推送一直正常，
# 只有删除被拒）。而 runner 上的 GITHUB_TOKEN 带 contents: write，删 ref 是它权限
# 之内的事。
#
# ⚠️ **它删得动的只有 `docs/branch-cleanup-20260915.md` 里列着的那些**——那份名单
# 是提交进仓库、过了 review 的。加上运行时再查一次当前开着的 PR，护住它们的 head。

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '照抄这一句才会真删：删掉名单里的遗留分支'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # 310 次 DELETE，实测每次几百毫秒；给 20 分钟绰绰有余。
    # GitHub 默认 360 分钟——卡住会烧六小时，而且看起来和「还在跑」一样。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/branch-cleanup-20260915.md
          sparse-checkout-cone-mode: false

      - name: 闸①：没照抄那句话就不动手
        if: inputs.confirm != '删掉名单里的遗留分支'
        run: |
          echo "::error::confirm 没对上，什么都没删。要真删就把描述里那句话原样填进去"
          exit 1

      - name: 清理
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # ---- 名单：只认提交进仓库的那份 ----
          DOC=docs/branch-cleanup-20260915.md
          awk -F'|' '/^\| `/{gsub(/[` ]/,"",$2); if ($2 != "") print $2}' "$DOC" | sort -u > /tmp/listed.txt
          N=$(wc -l < /tmp/listed.txt)
          echo "存档名单解析出 ${N} 条"
          # ⚠️ **空 ≠ 验过**：解析不出来要当场红，不能当成「没什么可删的」往下走。
          if [ "$N" -lt 100 ]; then
            echo "::error::名单只解析出 ${N} 条，多半是解析错了，不动手"
            exit 1
          fi

          # ---- 护栏：运行时重查当前开着的 PR，它们的 head 一条都不许删 ----
          # ⚠️ 名单是几十分钟前定的，这中间可能有人开了新 PR。
          gh api --paginate "/repos/${REPO}/pulls?state=open&per_page=100" \
            --jq '.[].head.ref' | sort -u > /tmp/protected.txt
          echo "当前开着的 PR：$(wc -l < /tmp/protected.txt) 条 head 分支受保护"
          echo main >> /tmp/protected.txt
          sort -u -o /tmp/protected.txt /tmp/protected.txt

          comm -23 /tmp/listed.txt /tmp/protected.txt > /tmp/todelete.txt
          SKIPPED=$(comm -12 /tmp/listed.txt /tmp/protected.txt | wc -l)
          echo "名单里被护栏挡下的：${SKIPPED} 条"
          comm -12 /tmp/listed.txt /tmp/protected.txt | sed 's/^/  跳过 /'
          echo "实际要删：$(wc -l < /tmp/todelete.txt) 条"

          # ---- 删 ----
          OK=0
          BAD=0
          while read -r b; do
            [ -z "$b" ] && continue
            if gh api -X DELETE "/repos/${REPO}/git/refs/heads/${b}" >/dev/null 2>&1; then
              OK=$((OK+1))
            else
              BAD=$((BAD+1))
              echo "  ❌ 删不掉：${b}"
            fi
          done < /tmp/todelete.txt
          echo "删成功 ${OK} 条，失败 ${BAD} 条"

          # ---- 查产物：别拿「命令跑完了」当「删掉了」 ----
          # ⚠️ 这一步是这条工作流最要紧的一步。做这次清理的会话里，批量删除的成功
          # 判据写成 `grep -qiv "error"`，推送失败时最后一行不含这些词，于是 8 批
          # 全打了 ✅ 而**分支一条没少**。判据必须是远端现在剩几条。
          REMAIN=$(gh api --paginate "/repos/${REPO}/branches?per_page=100" --jq '.[].name' | wc -l)
          echo "远端现在剩 ${REMAIN} 条分支"
          {
            echo "### 遗留分支清理"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| 存档名单 | ${N} 条 |"
            echo "| 被开着的 PR 护下 | ${SKIPPED} 条 |"
            echo "| 删掉 | ${OK} 条 |"
            echo "| 远端现存 | ${REMAIN} 条 |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$BAD" -gt 0 ]; then
            echo "::error::有 ${BAD} 条没删掉，上面列着是哪些"
            exit 1
          fi
