name: assets

# 一次性/按需：下载国旗小图等静态资源并提交回仓库
on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "可选：官方图片直链（仅 WTA 图片域名）"
        required: false
        type: string
      image_out:
        description: "可选：assets/reel/ 下的文件名"
        required: false
        type: string

permissions:
  contents: write

jobs:
  flags:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # **别把 output/ 拉下来。** HEAD 上它就有 1.36 GB（.git 1.77 GiB），
          # checkout 因此每次要一分半上下（daily 那条量到 1:31，match-reel 2:44），
          # 而**这条工作流一个字节都不碰 output/**。稀疏检出把它挡在外面，
          # 剩下的全部加起来 161 MB。cone 模式下根目录的文件总是带上。
          #
          # ⚠️ 这里没有 `git sparse-checkout add`——因为它不写产物。会写
          # `output/` 的那几条要在算出目录之后把自己那一格 add 回来，
          # 见 match-reel.yml。照抄这一段之前先确认你这条真的不写产物。
          sparse-checkout: |
            assets
            data
            docs
            specs
            src
            tests
            tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: python tools/fetch_flags.py
      # 个别图片抓取失败（Commons 限流/无合规候选）不阻断提交已成功的部分
      - run: python tools/fetch_venues.py || echo "::warning::some assets failed to fetch"
      - name: Fetch one verified official WTA photo
        if: ${{ inputs.image_url != '' }}
        env:
          IMAGE_URL: ${{ inputs.image_url }}
          IMAGE_OUT: ${{ inputs.image_out }}
        run: |
          python - <<'PY'
          import io
          import os
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from PIL import Image

          url = os.environ["IMAGE_URL"].strip()
          name = os.environ["IMAGE_OUT"].strip()
          parsed = urllib.parse.urlparse(url)
          if parsed.scheme != "https" or parsed.hostname != "photoresources.wtatennis.com":
              raise SystemExit("image_url 必须是 WTA 官方图片域名")
          if not re.fullmatch(r"[A-Za-z0-9._-]+\.(?:jpg|jpeg|png)", name, re.I):
              raise SystemExit("image_out 必须是 assets/reel 下的安全图片文件名")
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          blob = urllib.request.urlopen(req, timeout=60).read()
          with Image.open(io.BytesIO(blob)) as im:
              w, h = im.size
              if w < 1600:
                  raise SystemExit(f"图片只有 {w}x{h}，未达到 1600px 高清底线")
              im.verify()
          out = Path("assets/reel") / name
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(blob)
          print(f"saved {out} ({w}x{h}, {len(blob)} bytes)")
          PY
      - name: Commit assets
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add assets/flags assets/venues assets/players assets/trivia assets/reel
          git diff --cached --quiet && echo "no changes" && exit 0
          python tools/check_staged_file_sizes.py
          git commit -m "assets: flags and licensed venue/player images for story cards"
          git pull --rebase origin main
          git push
