name: gauff-reel-recovery
on:
  push:
    branches: [codex/gauff-reel-editorial-correction]
    paths:
      - tools/recover_gauff_reel.py
      - .github/workflows/gauff-reel-recovery.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/gauff-reel-editorial-correction
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            tools
            src
            skills
            specs
            assets
            output/2026-09-10/reel/andreeva-gauff
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -q -e '.[visualqa]' edge-tts
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          key: apt-pkgs-${{ runner.os }}-24.04-ffmpeg-fonts-v2-${{ github.run_id }}
          restore-keys: apt-pkgs-${{ runner.os }}-24.04-ffmpeg-fonts-v2-
      - name: Install ffmpeg with existing retry helper
        timeout-minutes: 15
        run: |
          source tools/ci_apt_install.sh
          ensure_ffmpeg
      - uses: actions/cache@v4
        with:
          path: ~/.cache/tennislive-sources
          key: reel-src-andreeva-gauff-recovery
          restore-keys: reel-src-andreeva-gauff-
      - name: Prepare audited evidence
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TENNISLIVE_SOURCE_CACHE: ~/.cache/tennislive-sources
        run: python tools/recover_gauff_reel.py
      - name: Save evidence to review branch
        if: always()
        run: |
          git config user.name "codex"
          git config user.email "noreply@openai.com"
          test -d output/2026-09-10/reel/andreeva-gauff/recovery || exit 0
          git add output/2026-09-10/reel/andreeva-gauff/recovery
          if ! git diff --cached --quiet; then
            git commit -m "reel: preserve Gauff recovery source and visual evidence"
            git push origin HEAD:codex/gauff-reel-editorial-correction
          fi
