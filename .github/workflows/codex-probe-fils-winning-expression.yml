name: codex-probe-fils-winning-expression

on:
  push:
    branches:
      - codex/probe-fils-short-cover-20260821
    paths:
      - .github/workflows/codex-probe-fils-winning-expression.yml

permissions:
  contents: read

jobs:
  probe:
    if: "${{ github.event.head_commit.message == 'ci: retry Fils Short with working client ladder' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            src
            pyproject.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache and install ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          key: apt-pkgs-${{ runner.os }}-24.04-frame-grab-v1
      - name: Install dependencies
        run: |
          source tools/ci_apt_install.sh
          ensure_ffmpeg
          pip install -q -e . "yt-dlp[default]" pillow bgutil-ytdlp-pot-provider
      - name: Start PO token provider
        id: pot
        continue-on-error: true
        run: |
          docker run --name bgutil-pot -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
          for i in $(seq 1 25); do
            curl -sf http://127.0.0.1:4416/ping >/dev/null && { echo "up=1" >> "$GITHUB_OUTPUT"; exit 0; }
            sleep 2
          done
      - name: Materialize cookies
        id: cookies
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "path=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_OUTPUT"
          fi
      - name: Extract every 0.25 seconds
        env:
          YT_COOKIES: ${{ steps.cookies.outputs.path }}
          YT_POT_PROVIDER: ${{ steps.pot.outputs.up }}
          PYTHONPATH: src
        run: |
          OUT=/tmp/fils-winning-expression
          mkdir -p "$OUT"
          ARGS=(--js-runtimes node)
          [ -n "$YT_COOKIES" ] && ARGS+=(--cookies "$YT_COOKIES")
          yt-dlp "${ARGS[@]}" -f 137 -o "$OUT/source.mp4" \
            "https://youtube.com/shorts/iGBTbmQM2vk"
          ffmpeg -v error -i "$OUT/source.mp4" \
            -vf "fps=4,scale=1080:-2" -q:v 2 "$OUT/raw_%04d.jpg"
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from grab_frames import contact_sheet
          out = Path("/tmp/fils-winning-expression")
          frames = []
          for i, path in enumerate(sorted(out.glob("raw_*.jpg"))):
              target = out / f"frame_{i * 0.25:05.2f}s.jpg"
              path.rename(target)
              frames.append(target)
          contact_sheet(frames, out / "contact.jpg", cols=6)
          (out / "source.mp4").unlink()
          print(f"[候选] {len(frames)} 张")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fils-winning-expression
          path: /tmp/fils-winning-expression
          retention-days: 3
          compression-level: 6
