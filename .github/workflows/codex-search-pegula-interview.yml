name: codex-search-pegula-interview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/codex-search-pegula-interview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-search-pegula-interview
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install yt-dlp
        run: pipx install yt-dlp
      - name: Inspect newest Cincinnati Open uploads
        run: |
          yt-dlp --flat-playlist --playlist-end 40 \
            --print "%(id)s | %(title)s | %(duration_string)s | %(webpage_url)s" \
            "https://www.youtube.com/channel/UCtRsUWSlnmATu1X-wORUTqA/videos"
      - name: Search newest mirrors and exact quotes
        run: |
          for QUERY in \
            "Jessica Pegula after her victory over Swiatek Cincinnati final" \
            "Jessica Pegula on court interview after beating Iga Swiatek semifinals" \
            "Jessica Pegula always rooting for American tennis Coco Cincinnati" \
            "Jessica Pegula crazy match today on court Cincinnati"; do
            echo "QUERY: $QUERY"
            yt-dlp --flat-playlist --playlist-end 50 \
              --print "%(id)s | %(title)s | %(uploader)s | %(duration_string)s | %(webpage_url)s" \
              "ytsearch50:$QUERY"
          done
