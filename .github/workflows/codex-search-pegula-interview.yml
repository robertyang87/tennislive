name: codex-search-pegula-interview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/codex-search-pegula-interview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-search-pegula-interview
  cancel-in-progress: true

jobs:
  fetch-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Find a healthy Piped mirror
        run: |
          mkdir -p analysis
          SUCCESS=0
          for HOST in \
            pipedapi.kavin.rocks pipedapi.tokhmi.xyz pipedapi.moomoo.me \
            pipedapi.syncpundit.io api-piped.mha.fi api.watch.pluto.lat \
            piped-backend.seitan-ayoub.lol pipedapi.owo.si api.piped.minionflo.net \
            pipedapi.nezumi.party pipedapi.ducks.party pipedapi.ngn.tf \
            pipedapi.coldforge.xyz piped-api.codespace.cz \
            pipedapi.reallyaweso.me pipedapi.phoenixthrush.com; do
            echo "TRY $HOST" | tee -a analysis/proxy.log
            if curl -L --connect-timeout 5 --max-time 30 -fsS \
              "https://$HOST/streams/lvFHKAXntQM" -o analysis/streams.json; then
              TITLE=$(jq -r '.title // empty' analysis/streams.json)
              URL=$(jq -r '[.videoStreams[]? | select(.videoOnly==false and .format=="MPEG_4")][0].url // [.videoStreams[]? | select(.videoOnly==false)][0].url // empty' analysis/streams.json)
              echo "TITLE=$TITLE URL_LENGTH=${#URL}" | tee -a analysis/proxy.log
              if [ -n "$URL" ]; then
                curl -L --connect-timeout 10 --max-time 180 -fsS "$URL" -o analysis/interview.mp4
                SUCCESS=1
                break
              fi
            fi
          done
          test "$SUCCESS" = 1
      - name: Probe source
        run: |
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height -of json analysis/interview.mp4 | tee analysis/interview-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pegula-oncourt-mirror
          path: analysis/
          retention-days: 3
