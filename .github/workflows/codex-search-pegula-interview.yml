name: codex-search-pegula-interview
on:
  push:
    branches: [main]
    paths: [".github/workflows/codex-search-pegula-interview.yml"]
permissions:
  actions: write
  contents: read
jobs:
  dispatch-push:
    runs-on: ubuntu-latest
    steps:
      - name: Push verified Pegula open-mic video to WeChat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run auto-push-interview.yml -R ${{ github.repository }} --ref main \
            -f slug=pegula-swiatek-cincinnati-2026-sf
