name: codex-search-pegula-interview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/codex-search-pegula-interview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install yt-dlp
        run: pipx install yt-dlp
      - name: Inspect latest Cincinnati Open uploads
        run: |
          yt-dlp --flat-playlist --playlist-end 100 \
            --print "%(id)s | %(title)s | %(uploader)s | %(duration_string)s | %(upload_date)s | %(webpage_url)s" \
            "https://www.youtube.com/channel/UCtRsUWSlnmATu1X-wORUTqA/videos"
      - name: Search public video sources
        run: |
          set +e
          for QUERY in \
            "Jessica Pegula Iga Swiatek Cincinnati 2026 on court interview" \
            "Jessica Pegula Cincinnati 2026 post match interview" \
            "Pegula Swiatek Cincinnati Open 2026 interview" \
            "Jessica Pegula Cincinnati Open after victory Swiatek" \
            "Cincinnati Open Jessica Pegula final 2026"; do
            echo "QUERY: $QUERY"
            yt-dlp --flat-playlist --playlist-end 50 \
              --print "%(id)s | %(title)s | %(uploader)s | %(duration_string)s | %(upload_date)s | %(webpage_url)s" \
              "ytsearch50:$QUERY"
          done
          true
