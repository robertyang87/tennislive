name: codex-search-pegula-interview
on:
  push:
    branches: [main]
    paths: [".github/workflows/codex-search-pegula-interview.yml"]
permissions:
  actions: write
  contents: read
jobs:
  dispatch-render:
    runs-on: ubuntu-latest
    steps:
      - name: Render and push bilingual-safe Pegula open-mic video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run interview-clip.yml -R ${{ github.repository }} --ref main \
            -f slug=pegula-swiatek-cincinnati-2026-sf -f mode=render -f push=true
