name: codex-dispatch-paul-cobolli-tnns

on:
  push:
    branches:
      - codex/dispatch-paul-cobolli-tnns-20260821
    paths:
      - .github/workflows/codex-dispatch-paul-cobolli-tnns.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: "${{ github.event.head_commit.message == 'ci: dispatch Paul-Cobolli TNNS stats' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing TNNS stats collector
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run tnns-stats.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f who=Paul,Cobolli \
            -f date=2026-08-20
