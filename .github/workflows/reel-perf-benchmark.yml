name: reel-perf-benchmark

# PR #504 的一次性冷启动成片基准。拿到墙钟数据和成片 artifact 后从 PR 删除。
on:
  pull_request:
    paths:
      - ".github/workflows/reel-perf-benchmark.yml"
      - "specs/reels/paul-cobolli.json"
      - "assets/reel/cobolli-acapulco-2026.jpg"

permissions:
  contents: read

jobs:
  render-paul-cobolli:
    if: github.head_ref == 'codex/render-under-10m-20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: 记录冷启动起点
        run: date +%s > "$RUNNER_TEMP/job-start"

      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            assets
            data
            specs
            src
            tools

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 缓存 ffmpeg 与字体包
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          key: apt-pkgs-${{ runner.os }}-24.04-ffmpeg-fonts-v1

      - name: 安装系统依赖并计时
        run: |
          START=$SECONDS
          source tools/ci_apt_install.sh
          ensure_ffmpeg
          apt_install_cached fonts-noto-cjk fonts-noto-color-emoji
          echo "BENCHMARK_SYSTEM_DEPS_SECONDS=$((SECONDS - START))"

      - name: 缓存抠图模型
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-isnet-general-use-${{ runner.os }}

      - name: 缓存 Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: 安装 Python 与 Chromium 依赖并计时
        timeout-minutes: 10
        run: |
          START=$SECONDS
          pip install -q -e ".[webrender,visualqa,cutout]"
          pip install -q "yt-dlp[default]" edge-tts azure-cognitiveservices-speech
          pw_wait_apt() {
            for _ in $(seq 1 22); do
              if ! pgrep -x apt-get >/dev/null && ! pgrep -x dpkg >/dev/null; then
                return 0
              fi
              sleep 5
            done
            sudo pkill -9 apt-get 2>/dev/null || true
            sudo pkill -9 dpkg 2>/dev/null || true
            sudo dpkg --configure -a 2>/dev/null || true
          }
          OK=0
          for i in 1 2; do
            if timeout 240 python -m playwright install --with-deps chromium; then
              OK=1
              break
            fi
            echo "::warning::装 Chromium 第 $i 次没跑完"
            pw_wait_apt
          done
          [ "$OK" = 1 ] || exit 1
          echo "BENCHMARK_RENDER_DEPS_SECONDS=$((SECONDS - START))"

      - name: 起 PO token provider
        id: pot
        continue-on-error: true
        run: |
          pip install -q bgutil-ytdlp-pot-provider
          docker run --name bgutil-pot -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
          for i in $(seq 1 25); do
            if curl -sf http://127.0.0.1:4416/ping >/dev/null; then
              echo "up=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done

      - name: 落 YouTube cookies（若仓库已配置）
        id: cookies
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "path=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_OUTPUT"
          fi

      - name: 真实冷启动 render 并计时
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          YT_COOKIES: ${{ steps.cookies.outputs.path }}
          YT_POT_PROVIDER: ${{ steps.pot.outputs.up }}
          TENNISLIVE_SOURCE_CACHE: ~/.cache/tennislive-sources
        run: |
          START=$SECONDS
          python tools/build_match_reel.py render \
            --spec specs/reels/paul-cobolli.json \
            --voice zh-CN-YunjianNeural \
            --rate +6% \
            --outdir output/benchmark/reel/paul-cobolli
          echo "BENCHMARK_RENDER_SECONDS=$((SECONDS - START))"

      - name: QA 并计时
        run: |
          START=$SECONDS
          python tools/check_reel_landed.py \
            --slug paul-cobolli \
            --film output/benchmark/reel/paul-cobolli/paul-cobolli.mp4
          echo "BENCHMARK_QA_SECONDS=$((SECONDS - START))"
          STARTED=$(cat "$RUNNER_TEMP/job-start")
          echo "BENCHMARK_SOURCE_TO_QA_SECONDS=$(($(date +%s) - STARTED))"

      - name: 上传完整成片与审片材料
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-perf-paul-cobolli-render
          path: |
            output/benchmark/reel/paul-cobolli/**
            !output/benchmark/reel/paul-cobolli/source.*
            !output/benchmark/reel/paul-cobolli/*.part
            !output/benchmark/reel/paul-cobolli/voice_*.mp3
          retention-days: 7
