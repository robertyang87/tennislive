name: wong-lehecka-render

on:
  workflow_dispatch:
  push:
    branches:
      - agent/wong-lehecka-reel
    paths:
      - .github/workflows/wong-lehecka-probe.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch match-reel render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload=$(jq -nc \
            --arg ref "${GITHUB_REF_NAME}" \
            '{ref: $ref, inputs: {
              mode: "render",
              slug: "wong-lehecka",
              voice: "zh-CN-YunjianNeural",
              rate: "+6%",
              push: "false",
              matchup: "黄泽林 vs 莱赫奇卡",
              score: "2:1",
              event: "洛斯卡沃斯 ATP250 第二轮",
              summary: "黄泽林逆转世界第12"
            }}')
          status=$(curl --silent --show-error \
            --output "$RUNNER_TEMP/dispatch-response.json" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/match-reel.yml/dispatches" \
            --data "$payload")
          if [ "$status" != "204" ]; then
            echo "::error::match-reel dispatch failed with HTTP $status"
            sed -n '1,80p' "$RUNNER_TEMP/dispatch-response.json"
            exit 1
          fi
          echo "match-reel render dispatched for wong-lehecka"
