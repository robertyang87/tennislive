name: codex-dispatch-gauff-bejlek-render

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/codex-dispatch-gauff-bejlek-render.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data
            tools

      - name: Dispatch preview render
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 字幕已过宽度闸；封面改用逐帧核过的睁眼微笑画面，重跑完整预览。
          gh workflow run interview-clip.yml --ref main \
            -f slug=gauff-bejlek-cincinnati-2026-sf \
            -f mode=render \
            -f push=false

      - name: Record dispatch
        run: |
          python tools/pick_interview_renders.py \
            --mark-one gauff-bejlek-cincinnati-2026-sf
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add data/interview_render_dispatched.json
          python tools/check_staged_file_sizes.py
          git commit -m "data: mark Gauff Bejlek interview render dispatched"
          git pull --rebase origin main
          git push origin main
