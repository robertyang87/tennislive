name: reel-cover-upgrade

# 抽帧封面推出去之后，官方高清实拍一到就自动换图、重渲、重推。
#
# 账号所有者 2026-09-27 选的 O4「自动换图重推」。来路：alcaraz-fritz 推送之后
# 4 分钟官网就上传了本场实拍（6b49049b），bu-majchrzak（5beecfa6）、
# zverev-deminaur（1a4f92d3）——三次都是他在微信里看见、开口抱怨，会话才手动换图重推。
#
# 一趟做什么、每道闸是什么，全在 tools/cover_upgrade.py 的 docstring 里（写进 YAML
# 就测不了了）。这里只管接线：
#   先不装依赖，找目标、对账（换了图却一直没推出去的，重派 render）——都没有就收工
#   → 装依赖、备模型 → 找近 48 小时推过、封面还是抽帧的「赛场之上」 → 查官方图
#   → 机器闸全过才换 → spec ＋ 原图 ＋ data/cover_upgrades.json 推上 main（同日重渲
#   会撞上的 pushed.json 一并删掉，2026-09-22「重渲之后默认就是重推」）
#   → 派发 match-reel mode=render push=true（重试三次），走正常的渲 → 质检 → 推送
# 一个 slug 最多换一次；查不到、拿不准就不换，下一班再查（下过的候选不重下）。
on:
  schedule:
    # 20 分钟一班，避开 :00/:30 和编排器（1,11,…）、提升班次（6,16,…）的分钟。
    # 官方图从推送后几分钟（alcaraz-fritz 4 分钟）到次日都有；48 小时窗口里
    # 每一班只查还是抽帧的那几条，不查就不花钱。
    - cron: "9,29,49 * * * *"
  workflow_dispatch:
    inputs:
      slug:
        description: "只查这一条（留空＝近 48 小时全部抽帧封面）"
        required: false
        default: ""
      apply:
        description: "真换（写图、改 spec、推 main、派发重渲）。不勾就只查、只报告"
        required: false
        type: boolean
        default: true

permissions:
  contents: write   # spec / 原图 / 账推回 main
  actions: write    # 派发 match-reel render；顺手叫醒挨饿的班次

# 一次只跑一班：两班并跑会对同一条各换一次（「一个 slug 最多换一次」靠的是
# data/cover_upgrades.json，而它要先落进 main 才看得见）。
concurrency:
  group: reel-cover-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    # 25 = 检出/装包/模型约 3 分钟 ＋ 查图那一步的 15 ＋ 提交派发余量
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          # output/（1.36 GB）和 assets/reel（518 MB）都不要：pushed.json 用
          # `git ls-files` / `git rm --sparse` 认，写新图用 `git add --sparse`。
          # ⚠️ assets/venues 和 assets/explainer/nadal-academy 不是这条线要用，是
          # `import build_match_reel` 在 import 时就读（explainer 模块顶上画示意图），
          # 少了它最终那道封面闸 import 不进来——而那只在真有图过闸时才走到，所以
          # 工具在 --apply 开头先 import 一次，缺了当场红（2026-09-27 在 cone 检出里量的）。
          # ⚠️ assets/flags：最终那道闸里的 `validate_spec` 查比分板国旗
          # （`reel_asset_gates.image_problems`，#1104）——少了它**每一条**换好的图都被
          # 「assets/flags/xx.png 不在仓库里」退回。这张单子由
          # `test_最终那道闸在工作流的稀疏检出里和全量检出里判得一样` 按真实 spec 逐条对账。
          # 字卡制作预检按真实字体测语义行宽，同样必须带上 fonts。
          sparse-checkout: |
            assets/flags
            assets/fonts
            assets/players
            assets/venues
            assets/explainer/nadal-academy
            data
            skills
            specs
            src
            tools

      # 先看有没有活，再装依赖（评审 N4）：这一步只读账和 spec（纯标准库），算出
      # 要查图的目标、要重派 render 的 slug。两样都没有，后面的 setup-python（连同它的
      # pip 缓存还原）、装包、拉模型、查图全部跳过——一天 72 班，绝大多数是 0 条。
      # 所以这一步用 runner 自带的 `python3`，排在 setup-python **之前**。
      # 带 --apply 时顺手把「这次要重派」记进账（下面的提交步骤一起推上去）。
      # 按模块跑（`python3 -m cover_upgrade`）：这一步不碰人脸模型；
      # `test_人脸模型缓存键跟着模型版本走` 认 `tools/cover_upgrade.py` 那一步为
      # 第一次用到模型，那一步排在缓存和「备好」之后。
      - name: 找目标、对账（不装依赖）
        id: plan
        env:
          SLUG: ${{ github.event.inputs.slug }}
          APPLY: ${{ github.event_name == 'schedule' || github.event.inputs.apply == 'true' }}
        run: |
          ARGS=(--plan --summary "$GITHUB_STEP_SUMMARY"
                --out-targets "$RUNNER_TEMP/targets.txt"
                --out-redispatch "$RUNNER_TEMP/redispatch.txt"
                --out-assets "$RUNNER_TEMP/assets.txt")
          [ "$APPLY" = "true" ] && ARGS+=(--apply)
          [ -n "$SLUG" ] && ARGS+=(--slug "$SLUG")
          PYTHONPATH=tools python3 -m cover_upgrade "${ARGS[@]}"
          echo "targets=$(grep -c . "$RUNNER_TEMP/targets.txt" || true)" >> "$GITHUB_OUTPUT"

      # assets/reel（518 MB）不在稀疏检出里，而「赛场之上」的整屏证据段、插图段指着的
      # 正是那里的图：`validate_spec` 查它们在不在，少了最终那道闸和换图之前的基线一起红，
      # 那一条就永远退避、永远换不成（批次 4 复审：gea-shapovalov 的三张图）。
      # 所以**只检出目标 spec 点名的那几张**（`cover_upgrade.spec_assets`，`--plan` 写的
      # assets.txt）。cone 模式的 `git sparse-checkout add` 只收目录，单个文件要走
      # `checkout --ignore-skip-worktree-bits`；只取索引里真有的（spec 写错的路径留给
      # `validate_spec` 去报，别让 checkout 在这儿炸）。
      # 判据 `test_最终那道闸在工作流的稀疏检出里和全量检出里判得一样`（按这张单子补文件）
      # ＋ `test_点名素材那一步在真的稀疏检出里只取出那几张`（真跑这段脚本）。
      - name: 检出目标 spec 点名的素材（不整个拉 assets/reel）
        if: steps.plan.outputs.targets != '0'
        env:
          GIT_LITERAL_PATHSPECS: "1"
        run: |
          if [ ! -s "$RUNNER_TEMP/assets.txt" ]; then
            echo "目标 spec 没点名稀疏检出之外的素材"
            exit 0
          fi
          xargs -r -d '\n' git ls-files -- < "$RUNNER_TEMP/assets.txt" > "$RUNNER_TEMP/assets-known.txt"
          if [ -s "$RUNNER_TEMP/assets-known.txt" ]; then
            xargs -r -d '\n' git checkout HEAD --ignore-skip-worktree-bits -- < "$RUNNER_TEMP/assets-known.txt"
          fi
          echo "检出 $(grep -c . "$RUNNER_TEMP/assets-known.txt" || true) / $(grep -c . "$RUNNER_TEMP/assets.txt") 个点名素材"

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.targets != '0'
        with:
          python-version: "3.11"
          cache: pip

      # visualqa 是 cv2（headless，<5），faces 是 onnxruntime——认人＋睁眼要这两个。
      - name: 装依赖
        if: steps.plan.outputs.targets != '0'
        run: pip install -q -e ".[visualqa,faces]"

      # 认人＋睁眼的三个 onnx。键**按权重内容定址**（`face_checks.CACHE_KEY`：版本号 ＋
      # 三个 sha256 的摘要），`test_人脸模型缓存键跟着模型版本走` 逼着这里逐字一致。
      # 和 interview-clip.yml 同一个形状（#1105）：拆成 restore / save 两步。
      - name: 取人脸模型缓存
        id: face-cache
        if: steps.plan.outputs.targets != '0'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/tennislive/face-models
          key: face-models-buffalo_s-v0.7-17d6bb6dfcd3
      # 备不上不拖红：工具会把每张候选记成「人脸模型不可用」——**不换**，不是放行。
      # `ok=true` 只在 fetch 真成功时写，下面存缓存那一步只认它。
      - name: 备好人脸模型
        id: face-models
        if: steps.plan.outputs.targets != '0'
        run: |
          if python tools/face_checks.py fetch; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::人脸模型没备好——这一班所有候选都会因「认人／睁眼没查」而不换"
          fi
      # 只在「备好」真成功、而且缓存没命中时才存：fetch 下到一半断掉的半截目录不许
      # 钉进一个不可变的键里（评审 2026-09-27 nit 7，interview-clip.yml 同一段）。
      - name: 存人脸模型缓存
        if: steps.plan.outputs.targets != '0' && steps.face-cache.outputs.cache-hit != 'true' && steps.face-models.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/tennislive/face-models
          key: face-models-buffalo_s-v0.7-17d6bb6dfcd3

      - name: 查官方图、过闸、换
        if: steps.plan.outputs.targets != '0'
        timeout-minutes: 15
        env:
          SLUG: ${{ github.event.inputs.slug }}
          APPLY: ${{ github.event_name == 'schedule' || github.event.inputs.apply == 'true' }}
        run: |
          set -o pipefail
          ARGS=(--summary "$GITHUB_STEP_SUMMARY" --out-slugs "$RUNNER_TEMP/upgraded.txt")
          [ "$APPLY" = "true" ] && ARGS+=(--apply)
          [ -n "$SLUG" ] && ARGS+=(--slug "$SLUG")
          python tools/cover_upgrade.py "${ARGS[@]}"

      # always()：上一步可能因为「某一条换完过不了正式的封面闸、已退回」而红（红是为了
      # 让人看见），别的条换好的照样要推。upgraded.txt 是**换成一条就当场追加**的，
      # 上一步半路崩了，已经换好的那几条也在清单上（账和 spec 一起提交，不会只提交账）。
      # 没换图也可能要提交账：对账重派记了一笔、补记了一笔、下过没过闸的候选（下一班跳过）、退避。
      # 换图那一步自己已经 `git add --sparse` 了两样：删掉的同日 pushed.json、给 Release
      # tag 上的旧 render.json 挂的账（评审 NB1）——下面的 commit 一起带上。那两样只在
      # 这一条进了清单时才留在索引里：半路炸了 `apply_upgrade` 连索引一起退回（评审第四轮），
      # 所以这句不带路径的 `git commit` 不会带上没换成的那条的半截。
      - name: 换了的、账变了的推上 main（都没变不制造空提交）
        id: commit
        if: always()
        run: |
          touch "$RUNNER_TEMP/upgraded.txt" "$RUNNER_TEMP/redispatch.txt"
          if [ ! -s "$RUNNER_TEMP/upgraded.txt" ] \
             && [ -z "$(git status --porcelain -- data/cover_upgrades.json)" ]; then
            echo "这一班没有换图，账也没变"
            exit 0
          fi
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          # assets/reel 在稀疏范围外：裸 `git add` 只警告、退出码 0，图就静默丢了
          while read -r SLUG; do
            [ -n "$SLUG" ] || continue
            git add --sparse specs/reels/"$SLUG".json
            git add --sparse assets/reel/"$SLUG"-official.*
          done < "$RUNNER_TEMP/upgraded.txt"
          git add --sparse data/cover_upgrades.json
          # python3：0 条目标的那一班没跑 setup-python，而对账重派照样要提交账
          python3 tools/check_staged_file_sizes.py
          if [ -s "$RUNNER_TEMP/upgraded.txt" ]; then
            MSG="reel: 抽帧封面自动换成官方实拍（O4）$(paste -sd' ' "$RUNNER_TEMP/upgraded.txt")"
          else
            MSG="reel: 封面自动换图的账（对账重派／补记／下过的候选／退避）"
          fi
          git commit -m "$MSG"
          source tools/git_push_retry.sh
          if ! push_with_rebase_retry main 5; then
            echo "::error::连续 5 次推不上 main；没有派发重渲（换好的图下一班对账会补派）"
            exit 1
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # render 只认 main 上的 spec，所以排在推上去之后。push=true：换图就是要重推
      # （表单那个勾只放宽「spec 没写 push.auto」那一道，质检/账本/成片身份照旧拦）。
      # 每一条重试三次（评审 N1：原来一次失败、或 bash -e 在循环里停下，spec 在 main 上
      # 已经是新图、成片还是抽帧，而账里记着 upgraded，从此没人再派）。三次都不行就红，
      # 下一班的对账（一小时后）会看到「换了图、发布账本里没有新推送」再派。
      - name: 派发重渲重推（换了的 ＋ 对账要重派的）
        if: always() && steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dispatch() {
            local slug=$1 n
            for n in 1 2 3; do
              if gh workflow run match-reel.yml --ref main \
                   -f mode=render -f slug="$slug" -f push=true \
                   -f received_at="$(date -u +%FT%TZ)" </dev/null; then
                return 0
              fi
              echo "::warning::派发 $slug 的 render 第 $n 次失败"
              sleep $((n * 15))
            done
            return 1
          }
          FAILED=()
          while read -r SLUG; do
            [ -n "$SLUG" ] || continue
            if dispatch "$SLUG"; then
              echo "[dispatch] render $SLUG（推完用 tools/push_link.py --slug $SLUG 取新的推送网页）" \
                | tee -a "$GITHUB_STEP_SUMMARY"
            else
              FAILED+=("$SLUG")
            fi
          done < <(cat "$RUNNER_TEMP/upgraded.txt" "$RUNNER_TEMP/redispatch.txt" | sort -u)
          if [ "${#FAILED[@]}" -gt 0 ]; then
            echo "::error::派发 render 连续 3 次失败：${FAILED[*]}——账里记着换过图，下一班对账会重派" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 失败时写摘要
        if: failure() || cancelled()
        run: |
          {
            echo "## ⚠️ 封面自动换图这一班失败了"
            echo "- 日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- 已推上 main 的换图会在 data/cover_upgrades.json 里；没推上去的这一班什么都没改"
          } >> "$GITHUB_STEP_SUMMARY"

      # schedule 会被 GitHub 丢弃（tools/nudge_stale_ticks.sh 顶注），顺手叫醒别的班次
      - name: 顺手叫醒挨饿的编排班次
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source tools/nudge_stale_ticks.sh
          nudge_if_stale orchestrate.yml 20 -f apply=true
          nudge_if_stale reel-auto-ready.yml 20
