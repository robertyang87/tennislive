name: codex-push-paul-cobolli-stat-card-supplement

on:
  push:
    branches:
      - codex/dispatch-paul-cobolli-stat-wechat-20260821
    paths:
      - .github/workflows/codex-push-paul-cobolli-stat-card-supplement.yml

permissions:
  contents: read

jobs:
  push-stat-card:
    if: "${{ github.event.head_commit.message == 'ci: push Paul-Cobolli stat card supplement' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed main commit
        uses: actions/checkout@v4
        with:
          ref: d3dd69b26f3ef10bd486b570b0b853eea9065b69

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install push dependency
        run: python -m pip install -q requests

      - name: Push standalone technical-statistics image
        env:
          PYTHONPATH: src
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_SECRET_KEY: ${{ secrets.PUSHPLUS_SECRET_KEY }}
          PUSHPLUS_ACCESS_KEY: ${{ secrets.PUSHPLUS_ACCESS_KEY }}
          TENNISLIVE_ASSET_REV: d3dd69b26f3ef10bd486b570b0b853eea9065b69
          TENNISLIVE_PUSHPLUS_IMAGE_ATTEMPTS: "20"
          TENNISLIVE_PUSHPLUS_IMAGE_RETRY_SECONDS: "15"
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tennislive.publish.pushplus import push

          out = Path("output/2026-08-21/reel/paul-cobolli")
          card = out / "stat_card.jpg"
          if not card.is_file() or card.stat().st_size < 100_000:
              raise SystemExit(f"技术统计卡缺失或异常：{card}")

          repo = os.environ["GITHUB_REPOSITORY"]
          rev = os.environ["TENNISLIVE_ASSET_REV"]
          image_url = (
              f"https://cdn.jsdelivr.net/gh/{repo}@{rev}/"
              f"{out.as_posix()}/stat_card.jpg"
          )
          title = "8.21 赛场之上 | 科博利–保罗技术统计"
          body = f"""
          <div style="background:#f6f7f4;padding:12px 10px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
            <div style="max-width:680px;margin:0 auto;background:#fff;border-top:5px solid #ff2442;padding:18px 0 22px">
              <div style="padding:0 16px">
                <div style="display:inline-block;background:#e7f5ea;color:#087747;font-size:12px;font-weight:bold;padding:4px 8px;border-radius:4px">技术统计补充</div>
                <div style="font-size:22px;line-height:1.4;font-weight:800;color:#102d23;margin:10px 0 8px">科博利 2-6 6-3 6-4 逆转保罗</div>
                <div style="font-size:14px;line-height:1.75;color:#42534c;margin:0 0 14px">总得分仅 83–82；制胜分与非受迫失误经 TNNS 分盘求和复核，并与 Flashscore 全场数据一致。</div>
              </div>
              <img src="{image_url}" width="100%" alt="科博利–保罗技术统计" referrerpolicy="no-referrer" style="width:100%;display:block;margin:0 0 10px">
              <div style="text-align:center;padding:0 16px">
                <a href="{image_url}" style="color:#087747;font-size:13px;text-decoration:none">图片没显示？点此打开原图</a>
              </div>
            </div>
          </div>
          """
          push(title, body, asset_dir=out)
          print(f"已单独推送技术统计图片：{title}")
          print(f"原图：{image_url}")
          PY
