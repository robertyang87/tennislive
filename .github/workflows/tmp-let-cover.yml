name: tmp-let-cover
# 临时：let-not-net-2026 封面候选检索（Commons/Openverse），合并前删除。
on:
  push:
    branches: [claude/let-not-net-2026]
    paths: [research/let-not-net-2026/cover_search.py, research/let-not-net-2026/cover_fetch.txt, .github/workflows/tmp-let-cover.yml]
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/let-not-net-2026
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: search
        run: true
      - name: fetch chosen originals
        run: |
          if [ -f research/let-not-net-2026/cover_fetch.txt ]; then
            while read -r url out; do [ -n "$url" ] && curl -sSLf -A "tennislive-cover/1.0 (github.com/robertyang87/tennislive)" -o "$out" "$url" && ls -la "$out"; done < research/let-not-net-2026/cover_fetch.txt
          fi
      - name: commit
        run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add -A research/let-not-net-2026 assets/reel || true
          git diff --cached --quiet || { git commit -qm "tmp: let 封面候选"; git push origin HEAD:claude/let-not-net-2026; }
