name: Voice auto review for no1-vs-top10 story import
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voice-review-no1-top10
  cancel-in-progress: false
jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUTDIR: output/2026-11-27/reel/no1-vs-top10-story-2026
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            output/2026-11-27/reel/no1-vs-top10-story-2026
            specs/reels
            tools
            src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Cache voice review models and references
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/tennislive/polyphone
          key: voice-auto-${{ runner.os }}-v1-no1-${{ github.run_id }}
          restore-keys: voice-auto-${{ runner.os }}-v1-
      - name: 恢复音视频工具 apt 缓存
        id: apt_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          key: apt-pkgs-${{ runner.os }}-24.04-voice-review-no1-v1-${{ github.run_id }}
          restore-keys: |
            apt-pkgs-${{ runner.os }}-24.04-voice-review-no1-v1-
      - name: Install review dependencies
        timeout-minutes: 15
        run: |
          source tools/ci_apt_install.sh
          ensure_ffmpeg
          pip install -q -e ".[polyphone]" faster-whisper
      - name: 回写实际下载的 apt 缓存
        if: env.APT_CACHE_DIRTY == '1' && steps.apt_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          key: ${{ steps.apt_cache.outputs.cache-primary-key }}
      - name: Run native voice auto review on the actual frozen bundle
        run: |
          python tools/voice_auto_review.py \
            --outdir "$OUTDIR" \
            --bundle "$OUTDIR/tts_bundle.zip"
      - name: Verify the publish gate now passes
        run: |
          test -f "$OUTDIR/voice_quality_review.json"
          python tools/voice_quality_gate.py --outdir "$OUTDIR" --check
      - name: Commit voice review evidence
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add --sparse "$OUTDIR/voice_auto_review.json" "$OUTDIR/voice_quality_review.json"
          python tools/check_staged_file_sizes.py
          if ! git diff --cached --quiet; then
            git commit -m 'reel: no1-vs-top10-story-2026 配音自动听审证据（五项全过）'
          fi
          source tools/git_push_retry.sh
          push_with_rebase_retry main
