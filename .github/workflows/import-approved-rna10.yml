name: Import approved RNA10 master
on:
  push:
    branches: [main]
    paths:
      - data/approved_reel_imports/nadal-academy-10th-2026/request.json
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: import-approved-rna10-cup
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      REQUEST: data/approved_reel_imports/nadal-academy-10th-2026/request.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            data/approved_reel_imports/nadal-academy-10th-2026
            data/reel_publish_ledger
            specs/reels
            tools
            assets/reel
            research/nadal-academy-10th-2026
            src
            output/2026-10-04/reel/nadal-academy-10th-2026
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Cache apt packages for native validation
        id: apt_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          key: apt-pkgs-${{ runner.os }}-24.04-approved-rna10-${{ github.run_id }}
          restore-keys: |
            apt-pkgs-${{ runner.os }}-24.04-approved-rna10-
            apt-pkgs-${{ runner.os }}-24.04-ci-v2-
      - name: Install native validation dependencies
        timeout-minutes: 15
        run: |
          pip install -q -e . numpy
          source tools/ci_apt_install.sh
          ensure_ffmpeg

      # 只在这一趟真摸了网、下了新包时回写（`APT_CACHE_DIRTY` 由
      # `tools/ci_apt_install.sh` 置位）。原来靠 actions/cache@v4 的 post 自动存：
      # 命中的趟白传一份、只装 ffmpeg 的趟把空目录存成最新那一格——见那份脚本
      # 顶部 2026-09-27 那段。判据 `tests/test_runner_setup_cache.py`。
      - name: 回写 apt 缓存（这趟真下了新包才存）
        if: env.APT_CACHE_DIRTY == '1' && steps.apt_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          key: ${{ steps.apt_cache.outputs.cache-primary-key }}
      - name: Restore verified transfer chunks
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/approved-rna10-chunks
          key: approved-rna10-${{ hashFiles('data/approved_reel_imports/nadal-academy-10th-2026/request.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            approved-rna10-${{ hashFiles('data/approved_reel_imports/nadal-academy-10th-2026/request.json') }}-
      - name: Reconstruct exact master and verify original native QC identity
        id: master
        run: python tools/import_approved_rna10.py assemble --request "$REQUEST"
      - name: Save verified chunks even after a failed import
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/approved-rna10-chunks
          key: approved-rna10-${{ hashFiles('data/approved_reel_imports/nadal-academy-10th-2026/request.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload movie to Release and generate native pages
        run: python tools/import_approved_rna10.py release --request "$REQUEST"
      - name: Commit metadata, cover, copy and QC evidence
        env:
          OUTDIR: ${{ steps.master.outputs.outdir }}
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          # Explicit file list: movie bytes must never become Git tree entries.
          git add --sparse specs/reels/nadal-academy-10th-2026.json specs/reels/nadal-academy-10th-2026.xhs.txt
          git add --sparse "$OUTDIR/render.json" "$OUTDIR/subtitles.ass" "$OUTDIR/poster.jpg" "$OUTDIR/qc_attestation.json" "$OUTDIR/copy.html" "$OUTDIR/push.html" "$OUTDIR/render_inputs.json" "$OUTDIR/topbar.ass" "$OUTDIR/audio_review_binding.json" "$OUTDIR/stat_card.jpg" "$OUTDIR/team-results.json" "$OUTDIR/release-verification.json" "$OUTDIR/import-provenance.json"
          for name in import-provenance.json research.md storyboard.md manual-qc.json subtitle_provenance.json silence_repair.json repair_review.json qc_landed.txt qc_before_repair.txt silence_detection.txt qc_contact.jpg; do
            if [ -f "$OUTDIR/$name" ]; then git add --sparse "$OUTDIR/$name"; fi
          done
          if [ -d "$OUTDIR/subtitle_sources" ]; then git add --sparse "$OUTDIR/subtitle_sources"; fi
          if git diff --cached --name-only | grep -E '\.(mp4|mov|mkv)$'; then
            echo '::error::Movie accidentally staged; refusing publication'
            exit 1
          fi
          python tools/check_staged_file_sizes.py
          if ! git diff --cached --quiet; then
            git commit -m 'reel: import approved RNA10 master and native QC evidence'
          fi
          source tools/git_push_retry.sh
          push_with_rebase_retry main
      - name: Run complete native publication gate
        id: publish_gate
        env:
          OUTDIR: ${{ steps.master.outputs.outdir }}
        run: python tools/auto_push_gate.py --forced --changed "$OUTDIR/render.json"
      - name: Require actual publication gate selection
        if: steps.publish_gate.outputs.found != 'true'
        run: |
          echo '::error::Native forced publication gate did not select the verified RNA10 master'
          exit 1
      - name: Report gate result without sending
        run: |
          echo 'Exact master imported. Main-thread operator must dispatch mode=push push=true after verifying Release GET and native publication gate.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: approved-rna10-import-diagnostics
          path: |
            output/*/reel/nadal-academy-10th-2026/*.json
            output/*/reel/nadal-academy-10th-2026/*.ass
          if-no-files-found: ignore
