name: Preserve finite current-model TTS inputs (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Preserve already generated finite audio bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/14e0934a041f2ba05f817ca38c9c6db14939848d > /tmp/bundle-blob.json
          python - <<'PY'
          import json,base64,hashlib
          from pathlib import Path
          j=json.loads(Path('/tmp/bundle-blob.json').read_text())
          b=base64.b64decode(j['content'])
          assert hashlib.sha256(b).hexdigest()=='2511e32398207b510786a8b92b7f3c145de927f84196f84b3c754eb7417156fd'
          Path('/tmp/visual-review.zip').write_bytes(b)
          PY
          TAG='reel-chwalinska-bouzkova-wuhan-2026-r2'
          gh release view "$TAG" --repo robertyang87/tennislive >/dev/null 2>&1 || gh release create "$TAG" --repo robertyang87/tennislive --target '${{ github.sha }}' --title 'Final film visual review: Chwalinska Wuhan round two' --notes 'Finite actual-audio review and calibration evidence, including retained failed comparisons. Not a completed film.'
          gh release upload "$TAG" /tmp/visual-review.zip --repo robertyang87/tennislive --clobber
