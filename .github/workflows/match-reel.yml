name: Preserve final afternoon review evidence (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve exact bounded review evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/9ed09012e5cd6314e9ba85c4d537a57be969957e > /tmp/blob-0.json
          python - <<'PY_EVIDENCE_0'
          from pathlib import Path
          import json,base64,hashlib
          raw=base64.b64decode(json.loads(Path('/tmp/blob-0.json').read_text())['content'])
          assert hashlib.sha256(raw).hexdigest()=='b3411fff68ad1d18acce5250274d5daf6c9807942f29658bb8c0bfde50ae88f6'
          Path('/tmp/pronunciation-evidence.zip').write_bytes(raw)
          PY_EVIDENCE_0
          gh api repos/robertyang87/tennislive/git/blobs/e8ecc7b8be2f951230cfefe501a6f1e8f4e5be10 > /tmp/blob-1.json
          python - <<'PY_EVIDENCE_1'
          from pathlib import Path
          import json,base64,hashlib
          raw=base64.b64decode(json.loads(Path('/tmp/blob-1.json').read_text())['content'])
          assert hashlib.sha256(raw).hexdigest()=='f1d0028a6a70dac59a769944d1b02de7334520fdad4629a195001ef8d06f3575'
          Path('/tmp/visual-qc-evidence.zip').write_bytes(raw)
          PY_EVIDENCE_1
          gh release view reel-review-ostapenko-pegula-wuhan-2026-r2-c7592cfccdfbb321 --repo robertyang87/tennislive >/dev/null 2>&1 || gh release create reel-review-ostapenko-pegula-wuhan-2026-r2-c7592cfccdfbb321 --title 'Actual afternoon final review evidence' --notes 'Exact frozen acoustic inputs and sampled dd931e37 final-movie visual review. Not a delivery receipt.' --latest=false --repo robertyang87/tennislive
          gh release upload reel-review-ostapenko-pegula-wuhan-2026-r2-c7592cfccdfbb321 /tmp/pronunciation-evidence.zip /tmp/visual-qc-evidence.zip --repo robertyang87/tennislive
