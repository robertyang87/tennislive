name: match-reel

# 把一条官方集锦剪成 9:16 竖版短片。分两步，因为**选段必须靠眼睛**：
#
#   mode=probe   下载源片 → 出场景切点 + 带时间码的缩略图墙 → 提交进仓库
#                （只提交几张 JPEG 和一个 json，源片 50MB 不进仓库）
#   mode=render  按 specs/reels/<slug>.json 剪 → 裁 9:16 → 中文解说 → 烧字幕
#                → 加封面 → 成片提交
#   mode=push    **成片已经在仓库里**，只写复制页 → 提交 → 发微信。
#                「先验产物再推」意味着推是**另一次**动作；没有这个模式就得为了
#                发一条消息把整条片子重渲一遍（一轮十五分钟：装中文字体 4 分 20、
#                渲片 7 分半），而重渲出来的那一版还得再验一次。
#   mode=cookies 什么都不产，只验 YouTube 还下不下得动（cookie 会过期）
#
# **为什么不在本地跑**：沙箱那台机器的 IP 被 YouTube 挡了——yt-dlp 拿得到格式表，
# 一取媒体就 403；真 Chromium 打开播放页直接是「detected unusual traffic」。
# edge-tts 同理。所以下载和合成都只能在 runner 上做。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe=下载并出缩略图墙；cover=只出封面海报；narration=只查旁白装不装得下；render=按 spec 出成片；push=只推已落库的成片；cookies=只验 YouTube 还能不能下"
        required: true
        type: choice
        # **`cover` 是给返工用的。** 封面是全流程返工最多的那一屏，而
        # `build_cover` 不依赖 segments / tracks / TTS / voice——下完源片就能
        # 出海报，省掉分段编码 + TTS + 成片那四五分钟。实测整趟 3 分 19 秒。
        # ⚠️ `--cover-only` 的 CLI 开关先落地了而这一行没跟着改，于是它在唯一
        # 能用的那台机器上够不着（源片只在 runner 上活过几分钟）。
        options: [probe, cover, narration, render, push, cookies]
        default: probe
      slug:
        description: "片子 slug，决定目录名与 spec 文件名"
        required: true
        default: "eala-zheng"
      url:
        description: "源片地址（probe 必填；render 从 spec 里读）"
        required: false
        default: ""
      every:
        description: "probe：每几秒抓一帧"
        required: false
        default: "2"
      scorebox:
        description: "probe：记分条位置 x0,y0,x1,y1（源片像素）；给了就顺手量死球时刻"
        required: false
        default: ""
      voice:
        description: "render：解说音色"
        required: false
        # 定下来的是云见（Yunjian）——体育解说那把嗓子。默认值一直写着云希，
        # 靠每次手动传参盖过去，漏一次就换了个人在说话。
        default: "zh-CN-YunjianNeural"
      rate:
        description: "render：语速"
        required: false
        default: "+6%"
      push:
        description: "render 完成后推送到微信"
        required: false
        type: boolean
        default: false
      # ⚠️ 下面这几个输入**一律不给默认值**。它们装的是「这一条片子的文案」，
      # 而默认值只能是**上一条片子的文案**——不传就顶着别人的话发出去，
      # 而且**不报错**。2026-08-01 郑钦文那条赛前前瞻就是这么发错的：
      # 标题印着「郑钦文首轮出局」（上一条华盛顿赛报的 summary 默认值），
      # 而那场球当晚 00:30 才开打。**说了一件没发生的事，微信收不回来。**
      #
      # 更阴的一层：**传空串盖不住默认值**。`github.event.inputs.X` 在收到空串时
      # 退回 default，所以我明明传了 `summary: ""`，用的还是那句旧话。
      # 唯一可靠的做法是默认值本身就是空的。
      matchup:
        description: "对阵，进标题：如「锦织圭 vs 商竣程」。**必填**（push=true 时）"
        required: false
        default: ""
      score:
        description: "赛果，进标题：赢家在前，如「2:1」。**赛前前瞻留空**"
        required: false
        default: ""
      event:
        description: "赛事与轮次，进标题。默认留空——加上就太长了，赛事名文案里有"
        required: false
        default: ""
      summary:
        description: "一句话概括赛果（顶掉「对阵 + 比分」）：只留最硬的那个结果。整句标题不超过 20 个字位，讲不完的写进 push_lead"
        required: false
        default: ""
      push_lead:
        description: "推送正文那一句"
        required: false
        default: ""

permissions:
  contents: write

# 同一条片子只留一个在跑——并行两个 run 会互相覆盖 output/ 里的成片。
# 分组名带 slug，不同片子互不影响。
concurrency:
  group: match-reel-${{ github.event.inputs.slug }}
  cancel-in-progress: true

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # **`push=true` 只能跑在 main 上，而且要在第一步就拦住。**
      #
      # GitHub Pages 只服务 main。复制页提交在特性分支上，那个 URL 永远是 404，
      # 而 `wait_for_copy_page` 等不到这一版就 `exit 1`——**一个字都不发**。
      # 这个设计是对的（宁可不发也不发一条带死链的消息），代价是它把失败推到了
      # 最后：渲片 6 分钟 → 轮询 10 分钟 → 才报错，前面全白跑。
      # 2026-07-29 大威那条就是这么烧掉一次的（run 30457284612），而
      # **CLAUDE.md 里白纸黑字记着这个坑**，照样走了进去。
      #
      # 判据探得很干净：同一个 Pages 站、同样的路径形状，分支上的 copy.html
      # 是 404，main 上 wang-pareja 的是 200，差别只有分支。
      #
      # 所以在这儿拦：让失败发生在第 5 秒，不是第 16 分钟。要出片不推送就
      # `push=false`，在分支上随便跑；要推送先把 PR 合进 main。
      - name: push=true 必须在 main 上
        if: github.event.inputs.push == 'true' && github.ref_name != 'main'
        run: |
          echo "::error::push=true 只能在 main 上跑，当前分支是 ${{ github.ref_name }}。"
          echo "::error::GitHub Pages 只服务 main——复制页留在分支上永远是 404，"
          echo "::error::推送那一步等不到它就会 exit 1，渲染和轮询全白跑十几分钟。"
          echo "::error::出片但不推送用 push=false；要推送先把 PR 合进 main 再跑。"
          exit 1

      # **标题里那句话必须是这次填的。** 上一版给 matchup / summary / push_lead
      # 留了上一条片子的默认值，于是 2026-08-01 郑钦文那条赛前前瞻顶着
      # 「郑钦文首轮出局」发了出去——那场球当晚 00:30 才开打，**说了一件没发生
      # 的事**。默认值现在一律为空，但空着发同样不行：标题末尾那一格会是空的。
      # 所以在这儿拦，第 3 秒就红，别等渲染十分钟之后再发一条错的。
      - name: push=true 必须自己填标题，不许吃默认值
        if: >-
          github.event.inputs.push == 'true'
          && github.event.inputs.matchup == ''
          && github.event.inputs.summary == ''
        run: |
          echo "::error::push=true 时 matchup 和 summary 至少要填一个——标题末尾那一格靠它。"
          echo "::error::赛前前瞻填 matchup（如「郑钦文 vs 塔拉鲁迪」）、score 留空；"
          echo "::error::赛报填 matchup + score，或者用 summary 一句话概括赛果。"
          exit 1

      - uses: actions/checkout@v4
        with:
          # **别把 output/ 拉下来。** HEAD 上它就有 1.36 GB（.git 1.77 GiB），
          # checkout 因此每次要 1 分 35 秒到 2 分 44 秒——而渲染一个字节都用不到
          # 别人的成片。稀疏检出把它挡在外面，剩下的加起来 161 MB。
          # 本次的 outdir 在「算出目录」那一步再 add 进来。
          # ⚠️ 排除的**只有** output/。assets 155 MB 是渲染真要读的东西
          # （抠图、示意图、字体），少一个就是第 5 分钟才炸的 FileNotFoundError。
          sparse-checkout: |
            assets
            data
            docs
            specs
            src
            tests
            tools

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ffmpeg 两种模式都要；**中文字体只有渲染要**（封面和烧字幕）。
      # 原来合成一步挂在所有模式前面，而 apt 那一步挂死过——probe 因此被一个
      # 它根本用不到的依赖拖住二十分钟。拆开，并给超时：卡住要失败，不要空转。
      - name: 装 ffmpeg
        # push 模式一帧都不碰：`push_reel.py` 那条路里 ffmpeg / ffprobe /
        # subprocess **一个都没出现**，装它白花半分钟。
        if: github.event.inputs.mode != 'push'
        timeout-minutes: 5
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # ⚠️ **`cover` 也要**：封面走 HTML 渲染（和知识帖同一套字），少了中文字体
      # 出来的是豆腐块。加 cover 档那次漏了这三步，run 155 就是这么红的——
      # 「加新能力就要同时改三处」的第 N 次。
      - name: 装中文字体（渲染和封面都要）
        if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover'
        timeout-minutes: 5
        run: sudo apt-get install -y -qq fonts-noto-cjk

      # 封面走 HTML 渲染（和知识帖同一套字），所以要 webrender + Chromium。
      # 少了它 render 会死在 ModuleNotFoundError: playwright，而且是在下完
      # 64MB 源片、合完音之后才死——白跑一分半。
      # visualqa 那份是 opencv：跟踪裁切靠它算帧差质心。**同一个坑第二次**——
      # 跟踪合进来的那次 render 就是在下完源片、合完音之后死在
      # `ModuleNotFoundError: No module named 'cv2'`（run 30334177432）。
      # 抠图模型 176MB，第一次跑要现下。缓存住，否则每条片子都等一遍。
      - name: 缓存抠图模型
        if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover'
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-isnet-general-use-${{ runner.os }}

      - name: 装依赖
        run: |
          # **push 模式只装主依赖。** 它不下片、不渲染、不抠图——rembg、opencv、
          # playwright、yt-dlp 一个都用不上，装全套只是把失败面铺大：那几个包
          # 里任何一个装不上，都会让一条**本来只是发消息**的 run 挂掉。
          if [ "${{ github.event.inputs.mode }}" = "push" ]; then
            pip install -q -e .
            # 真验一次 push 那条路要的东西，**不许 `|| true`**：装少了要在
            # 第 5 秒炸，而不是三分钟后死在推送那一步。
            python -c "import requests, tennislive.publish.pushplus, tennislive.render.pushmsg"
            echo "push 模式：只装主依赖，推送那条路的 import 已验过"
            exit 0
          fi
          # `cutout` 那份是 rembg：封面人物走「本场抽帧抠图」，抠背景要它。
          # **同一个坑第四次**——playwright、Chromium、cv2 三次都是本地装着、
          # runner 上没有，而且都死在下完 64MB 源片之后。这次连预检一起加了
          # （`_preflight_cutout`，排在下载之前），但依赖这一行还是得同一个提交里改。
          pip install -q -e ".[webrender,visualqa,cutout]"
          # **`yt-dlp` 要装 `[default]`**，它才带 `yt-dlp-ejs`——解 YouTube 的
          # n challenge 要跑一段 JS。少了它不会报「装少了」，而是
          # `n challenge solving failed` + `Only images are available`，
          # 于是任何视频格式选择器都匹配不上，看起来像「这个视频没有格式」或者
          # 「cookie 过期了」。JS 运行时用 runner 自带的 node（≥22），
          # 命令行统一带 `--js-runtimes node`。
          pip install -q "yt-dlp[default]" edge-tts
          node --version

      - name: 缓存 Chromium
        if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: 装 Chromium
        if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover'
        run: python -m playwright install --with-deps chromium

      # **同一条源片会被下两到三次**：probe 一次、cover 一次、render 一次——
      # 中间「丢掉不进仓库的中间物」把它删了，而它本来就不进仓库。实测一个
      # 70 MB 的源片要下 **100.86 秒**（YouTube 限速，不是带宽），而 render
      # 整步才 198 秒——**一半时间花在重下同一个文件上**。
      # 键按 slug 走：一条片子的源片 URL 写死在 spec 里，不会变。
      # ⚠️ 缓存目录在 `~` 底下，清理那一步只碰 outdir，碰不到它。
      - name: 缓存源片（同一条片子只下一次）
        if: github.event.inputs.mode != 'push' && github.event.inputs.mode != 'narration'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tennislive-sources
          key: reel-src-${{ github.event.inputs.slug }}-${{ hashFiles(format('specs/reels/{0}.json', github.event.inputs.slug)) }}
          restore-keys: reel-src-${{ github.event.inputs.slug }}-

      - name: 算出目录
        id: paths
        run: |
          OUT_DATE=$(TZ=Asia/Shanghai date +%F)
          SLUG="${{ github.event.inputs.slug }}"
          OUT_DIR="output/$OUT_DATE/reel/$SLUG"
          echo "outdir=$OUT_DIR" >> "$GITHUB_OUTPUT"
          echo "date=$OUT_DATE" >> "$GITHUB_OUTPUT"
          # checkout 把整个 output/ 挡在稀疏范围外了，这儿再把**自己那一格**
          # 加回来。三种模式都要：render/cover 要往里写，push 要读 mp4 的大小
          # （超 20 MB 就退 raw）。
          # ⚠️ 必须排在生成**之前**——`add` 会把 HEAD 上那一版先铺回工作区，
          # 反过来会拿旧内容盖掉刚生成的。
          git sparse-checkout add "$OUT_DIR"

      # push 模式的前提是**成片已经在这个 commit 里**。不在就当场报，别等到
      # 装完依赖、写完复制页、提交完之后才在推送那一步炸——「让失败发生在
      # 第 5 秒，不是第 90 秒」。
      # 查的是 `git ls-files`，不是 `test -f`：只在工作区里躺着的文件，推送
      # 发出去就是 404（同一个毛病在复制页上踩过两次）。
      - name: push 模式先确认成片真的在仓库里
        if: github.event.inputs.mode == 'push'
        run: |
          REEL="${{ steps.paths.outputs.outdir }}/${{ github.event.inputs.slug }}.mp4"
          if [ -z "$(git ls-files -- "$REEL")" ]; then
            echo "::error::$REEL 不在这个 commit 里——push 模式只发已经落库的成片。"
            echo "::error::先跑一次 mode=render（push=false），验完再用 mode=push 发。"
            git ls-files -- "${{ steps.paths.outputs.outdir }}" || true
            exit 1
          fi
          echo "成片在仓库里：$REEL（$(stat -c%s "$REEL") 字节）"
          test -f "${{ steps.paths.outputs.outdir }}/poster.jpg" || {
            echo "::error::海报不在——推送第一屏就是它，没有它只剩两个按钮"; exit 1; }

      # YouTube 对机房 IP 一律「Sign in to confirm you're not a bot」。第一道解法
      # 是 GVS PO token：yt-dlp 官方推荐的 bgutil provider 起在本机 4416，插件会
      # 自动去取，web/mweb/tv 三档就能过。**起不来不算失败**——起不来就退回 client
      # 梯子，让下载那一步去报真正的原因，别在这儿把整个 run 弄挂。
      - name: 起 PO token provider
        id: pot
        # push 模式不下任何东西——docker pull 那一分钟白等
        if: github.event.inputs.mode != 'push'
        continue-on-error: true
        run: |
          pip install -q bgutil-ytdlp-pot-provider
          docker run --name bgutil-pot -d -p 4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider
          for i in $(seq 1 25); do
            if curl -sf http://127.0.0.1:4416/ping >/dev/null; then
              echo "provider 起来了（第 ${i} 次探活）"
              echo "up=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          echo "::warning::PO token provider 50 秒内没起来，退回 client 梯子"
          docker logs bgutil-pot 2>&1 | tail -20 || true

      # 配了这个 Secret 就带 cookie 下载，没配就只能靠上面的 PO token + client 梯子。
      - name: 落 cookies（配了 Secret 才有）
        id: cookies
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "path=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_OUTPUT"
            echo "已写入 cookies（$(wc -l < "$RUNNER_TEMP/yt-cookies.txt") 行）"
          else
            echo "::notice::未配置 YT_COOKIES_TXT，只能靠 player client 梯子碰运气"
          fi

      # **cookie 会过期，而过期时的表现和「没配」一模一样。** 所以要有一条随时能跑、
      # 不产生任何产物的验证：真下三秒媒体流。
      # 注意 `--skip-download` 那种探活是**假的**——不带 cookie 也拿得到标题和格式表，
      # 只有真去取媒体流才会撞上 "Sign in to confirm you're not a bot"。
      - name: cookies — 只验 YouTube 还能不能下
        if: github.event.inputs.mode == 'cookies'
        env:
          YT_COOKIES: ${{ steps.cookies.outputs.path }}
        run: |
          URL="${{ github.event.inputs.url }}"
          [ -n "$URL" ] || URL="https://www.youtube.com/watch?v=HyKTXynnI9c"
          ARGS=""
          if [ -n "$YT_COOKIES" ]; then
            ARGS="--cookies $YT_COOKIES"
            echo "带 cookie 试（$(wc -l < "$YT_COOKIES") 行）"
          else
            echo "::warning::没有 YT_COOKIES_TXT，这次只验 PO token + client 梯子"
          fi
          rm -rf "$RUNNER_TEMP/ytcheck" && mkdir -p "$RUNNER_TEMP/ytcheck"
          yt-dlp $ARGS --js-runtimes node --download-sections "*0-3" \
            --force-keyframes-at-cuts \
            -f "bv*[height<=720]+ba/b[height<=720]/b" \
            -o "$RUNNER_TEMP/ytcheck/probe.%(ext)s" "$URL" 2>&1 | tee "$RUNNER_TEMP/yt.log" || true
          FILE=$(ls -S "$RUNNER_TEMP/ytcheck" 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then
            # **别把「没下到」一律说成「cookie 过期」**——第一次跑就栽在这上面：
            # 真实原因是没装 yt-dlp-ejs，n challenge 解不了，只剩图片格式，
            # 而我的报错写着「cookie 可能过期了」，方向反了。所以按日志分因。
            if grep -q "not a bot\|Sign in to confirm" "$RUNNER_TEMP/yt.log"; then
              echo "::error::撞上了机器人验证——cookie 无效或已过期，重新导一份"
            elif grep -q "n challenge solving failed\|Only images are available" "$RUNNER_TEMP/yt.log"; then
              echo "::error::n challenge 解不了：yt-dlp 缺 yt-dlp-ejs 或没有 JS 运行时，和 cookie 无关"
            else
              echo "::error::没下到媒体流，原因见下面的格式表"
            fi
            yt-dlp $ARGS --js-runtimes node --list-formats "$URL" 2>&1 | tail -25 || true
            exit 1
          fi
          SIZE=$(stat -c%s "$RUNNER_TEMP/ytcheck/$FILE")
          echo "拿到 $FILE，$SIZE 字节"
          # 几百字节的「文件」多半是错误页，不是媒体
          [ "$SIZE" -gt 51200 ] || { echo "::error::文件只有 $SIZE 字节，不是媒体流"; exit 1; }
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 \
            "$RUNNER_TEMP/ytcheck/$FILE"
          echo "YouTube 下载可用。"

      - name: probe — 下载 + 缩略图墙
        if: github.event.inputs.mode == 'probe'
        env:
          TENNISLIVE_SOURCE_CACHE: ~/.cache/tennislive-sources
          YT_COOKIES: ${{ steps.cookies.outputs.path }}
          YT_POT_PROVIDER: ${{ steps.pot.outputs.up }}
        run: |
          python tools/build_match_reel.py probe \
            --url "${{ github.event.inputs.url }}" \
            --every "${{ github.event.inputs.every }}" \
            --scorebox "${{ github.event.inputs.scorebox }}" \
            --outdir "${{ steps.paths.outputs.outdir }}"
          ls -la "${{ steps.paths.outputs.outdir }}"

      # 顺便把封面人物的候选帧也挑出来。**源片只在 runner 上有**——沙箱下不动
      # YouTube，所以这一步不在这儿做，就只能拿 2 秒一格的缩略图墙用肉眼找正脸，
      # 而那正是 `pick_cover_frames.py` 要替掉的活。
      # 挑帧判据（账号所有者定的）：正脸或稍微侧脸、上半身直立、表情读得出。
      # **挑完仍然要人打开看**：谁是谁、表情对不对题机器判不了，所以这里只出
      # 候选墙，不自动写进 spec。
      # 挑不出来**不算失败**（有些集锦通篇没有近景）——`|| true` 让它继续，
      # 缩略图墙那条老路还在。
      - name: probe — 封面候选帧
        if: github.event.inputs.mode == 'probe'
        run: |
          OUT="${{ steps.paths.outputs.outdir }}"
          python tools/pick_cover_frames.py \
            --video "$OUT/source.mp4" \
            --out "$OUT/cover_candidates" \
            --top 12 || true
          ls -la "$OUT/cover_candidates" 2>/dev/null || true

      # 只下源片 + 出海报就停：不分段、不合语音、不编码。改一档 scale / cx /
      # box 想看效果走这条，别再付一趟完整 render。实测整趟 3 分 19 秒，
      # 而且只提交一张 0.3 MB 的海报。
      # 只合语音、只报哪几段旁白写长了。**不下源片、不渲染、不写产物**——
      # 已经发过的片子拿它查，不会多出一个成片。跑一趟 render 去问同一个问题，
      # 在通过的情况下会顺手渲出一条新成片并提交。
      - name: narration — 只查旁白装不装得下
        if: github.event.inputs.mode == 'narration'
        run: |
          SPEC="specs/reels/${{ github.event.inputs.slug }}.json"
          test -f "$SPEC" || { echo "::error::找不到 $SPEC"; exit 1; }
          python tools/build_match_reel.py render --check-narration \
            --spec "$SPEC" \
            --voice "${{ github.event.inputs.voice }}" \
            --rate "${{ github.event.inputs.rate }}" \
            --outdir "${{ steps.paths.outputs.outdir }}"

      - name: cover — 只出封面海报
        if: github.event.inputs.mode == 'cover'
        env:
          TENNISLIVE_SOURCE_CACHE: ~/.cache/tennislive-sources
          YT_COOKIES: ${{ steps.cookies.outputs.path }}
          YT_POT_PROVIDER: ${{ steps.pot.outputs.up }}
        run: |
          SPEC="specs/reels/${{ github.event.inputs.slug }}.json"
          test -f "$SPEC" || { echo "::error::找不到 $SPEC"; exit 1; }
          python tools/build_match_reel.py render --cover-only \
            --spec "$SPEC" \
            --outdir "${{ steps.paths.outputs.outdir }}"
          ls -la "${{ steps.paths.outputs.outdir }}"

      - name: render — 出成片
        if: github.event.inputs.mode == 'render'
        env:
          TENNISLIVE_SOURCE_CACHE: ~/.cache/tennislive-sources
          YT_COOKIES: ${{ steps.cookies.outputs.path }}
          YT_POT_PROVIDER: ${{ steps.pot.outputs.up }}
        run: |
          SPEC="specs/reels/${{ github.event.inputs.slug }}.json"
          test -f "$SPEC" || { echo "::error::找不到 $SPEC"; exit 1; }
          python tools/build_match_reel.py render \
            --spec "$SPEC" \
            --voice "${{ github.event.inputs.voice }}" \
            --rate "${{ github.event.inputs.rate }}" \
            --outdir "${{ steps.paths.outputs.outdir }}"
          ls -la "${{ steps.paths.outputs.outdir }}"

      # 复制页**必须写在提交之前**。它由 GitHub Pages 提供，没进仓库就是 404。
      # 之前这一句藏在推送那一步里，而推送排在提交之后——文件只活在 runner 的
      # 工作区，从来没被 commit 过：run 30342567879 推送步骤 success，
      # 链接打开 404。**又一次「查信号不查产物」**。
      # **不挂在 push=true 上。** 分支上 `push=false` 渲的片子也要把复制页
      # 带进 PR——它跟着成片一起合进 main 之后，Pages 早就发布好了，
      # 后面那趟 `mode=push` 的 `wait_for_copy_page` 一次就中。挂在
      # push=true 上的话，复制页只能在推送那一刻才第一次进仓库，Pages
      # 从零开始发布，推送就得原地等几分钟（run 30624808733：连续 12 次
      # HTTP 404，第 13 次才中，240 秒纯空转）。
      # 写它几乎不要钱（一个 HTML），却决定后面那趟推送要不要空等。
      - name: 写复制页（必须排在提交之前）
        if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'push'
        run: |
          COPY="specs/reels/${{ github.event.inputs.slug }}.xhs.txt"
          test -f "$COPY" || { echo "::error::找不到 $COPY"; exit 1; }
          python tools/push_reel.py --stage page \
            --outdir "${{ steps.paths.outputs.outdir }}" \
            --matchup "${{ github.event.inputs.matchup }}" \
            --score "${{ github.event.inputs.score }}" \
            --event "${{ github.event.inputs.event }}" \
            --summary "${{ github.event.inputs.summary }}" \
            --copy "$COPY"

      # **查产物，不查信号。** 这个脚本一直在仓库里，`grep -rn check_reel_landed
      # .github/` 却是零命中——写好了一次都没跑过。补跑九条已发成片，它自己
      # 就报出了两个真缺陷：「音轨比画面短」×7、「38 秒数字静音」×1。
      # 拦在提交之前：进了 main，push 那条路就会把它发到微信，而消息收不回来。
      - name: 查成片本身合不合格
        if: github.event.inputs.mode == 'render'
        run: |
          python tools/check_reel_landed.py \
            --slug "${{ github.event.inputs.slug }}" \
            --film "${{ steps.paths.outputs.outdir }}/${{ github.event.inputs.slug }}.mp4"

      - name: 丢掉不进仓库的中间物
        if: github.event.inputs.mode != 'narration' && github.event.inputs.mode != 'cookies'
        run: |
          OUTDIR="${{ steps.paths.outputs.outdir }}"
          # 源片 50MB 上下，逐帧图几百张——都不进仓库，只留缩略图墙和成片。
          # _cover.html / poster.html 是封面那一屏的渲染输入，图以 data URI 内嵌，
          # 单个 12 MB，之前漏在清单外，每出一版就往仓库里塞一份。
          # **poster.jpg 要留下**：推送正文的第一屏就是它，删了推送里就没有图。
          # **`source*` 一整片删掉，不要逐个列名字。** 这个坑连着栽了四次，
          # 每次都是同一个形状：源片换了个名字，就从清单里溜过去了。
          #   1. `source.fNNN.mp4.part`（yt-dlp 分轨下载的半成品，probe wang-pareja）
          #   2. 同一个漏在 eala-zheng、potapova-venus 上各中一次
          #   3. 分轨的 `.webm` 和 yt-dlp 的续传记录 `.ytdl`
          #   4. **多源之后叫 `source_r1.mp4` / `source_iv.mp4`**——加多源支持时
          #      改了下载的落盘名，没改这里（run 30603686748，三条源片 250 MB
          #      全被兜底拦下）。又一次「加新能力就要同时改三处」。
          # 同理 `_versus_*` **不带后缀**：原来写死 `.jpg`，而抽帧抠图落的是
          # `_versus_cut_top.png`。
          # 封面候选帧只留候选墙和 json，12 张整帧不进仓库：q92 的 JPEG 单张
          # 132 KB、12 张 1.6 MB（存 PNG 是 9 MB），**两种都过得了「单个 8 MB」
          # 那道兜底**，却每探一次就加一份。
          # 判据在 test_中间物一个都不许进仓库：按 glob 语义验覆盖，不验字面名字。
          rm -f "$OUTDIR"/source* "$OUTDIR"/*.part "$OUTDIR"/*.ytdl \
            "$OUTDIR"/voice_*.mp3 "$OUTDIR"/_cover.jpg "$OUTDIR"/_cover.html \
            "$OUTDIR"/poster.html "$OUTDIR"/_versus_* "$OUTDIR"/_subs* \
            "$OUTDIR"/cover_candidates/cand_*
          rm -rf "$OUTDIR"/frames
          ls -la "$OUTDIR" || true

          # 兜底：上面那串模式挡住的是**已知**的中间物，挡不住下一个没见过的。
          # 所以清完再量一次，超过 8 MB 而又不是成片的，一律当成漏网并报错——
          # 宁可这一步红，也别再往仓库里塞一个没人发现的大文件（推分支吃 413
          # 就是被 pack 体积撑爆的）。
          #
          # **成片按名字放行，不按体积放行。** 第一版给成片卡了个 20 MB 的上限，
          # 结果第一条片子就被自己拦下来了：那个数是从**解说片**那条线搬来的
          # （静图幻灯，2 分 56 秒只有 7.7 MB / 365 kb/s），而这条线是真实比赛
          # 画面、crf 18，实测 3315 / 3517 / 3610 kb/s 三条几乎一样——**体积
          # 由时长决定**，写死一个字节数等于给片长设了个暗上限。
          SLUG="${{ github.event.inputs.slug }}"
          BAD=0
          while IFS= read -r f; do
            [ "$(basename "$f")" = "$SLUG.mp4" ] && continue
            echo "::error::清理之后仍有大文件进仓库：$f（$(stat -c%s "$f") 字节）"
            BAD=1
          done < <(find "$OUTDIR" -type f -size +8M)
          [ "$BAD" = 0 ] || exit 1
          # 成片自己只报不拦：拦它等于拦片长，而片长是编辑决定的。但**要出声**
          # ——已发的三条是 29–34 MB，明显跳出这个量级时得有人看见。
          REEL="$OUTDIR/$SLUG.mp4"
          if [ -f "$REEL" ]; then
            SZ=$(stat -c%s "$REEL")
            echo "成片 $SLUG.mp4：$((SZ/1048576)) MB"
            [ "$SZ" -le 83886080 ] || echo "::warning::成片 $((SZ/1048576)) MB，超过 80 MB——确认是片长所致，不是编码跑飞了"
          fi

      # **`always()` 不能省。** `if:` 不含状态函数时 GitHub 隐式和上
      # `success()`，于是上一步「丢掉不进仓库的中间物」末尾那个体积兜底一
      # exit 1（栽过四次），**成片明明已经渲完了，却既不上传也不提交**。
      # ⚠️ 位置不许往前挪：清理是先 rm 再检查，挪到前面会把源片一起传。
      - name: 上传 artifact
        if: always() && github.event.inputs.mode != 'narration' && github.event.inputs.mode != 'cookies'
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.event.inputs.slug }}-${{ github.run_number }}
          path: ${{ steps.paths.outputs.outdir }}
          retention-days: 14

      - name: 提交产物
        if: github.event.inputs.mode != 'narration' && github.event.inputs.mode != 'cookies'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OUTDIR="${{ steps.paths.outputs.outdir }}"
          # 只 add 本次的目录：一起 add output/ 会把别的选题的成片一并重放，
          # 并行跑的时候会来回覆盖（explainer 那条线上踩过）
          git add "$OUTDIR"
          if git diff --cached --quiet; then
            echo "没有变化"
            exit 0
          fi
          BRANCH="${{ github.ref_name }}"
          MSG="reel: ${{ github.event.inputs.mode }} ${{ github.event.inputs.slug }}"
          python tools/check_staged_file_sizes.py
          git commit -m "$MSG"
          # 多条不同 slug 可以并行落库。push 被别的 run 抢先后，只把本条
          # OUTDIR 重放到最新分支；普通 rebase 遇到同名二进制文件会冲突，
          # 而 `break` 版循环在重试耗尽后还会错误地继续微信推送。
          for attempt in $(seq 1 10); do
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "push 被拒（第 $attempt 次），把本条成片重放到最新的 $BRANCH 上"
            git fetch origin "$BRANCH"
            git branch -f rendered HEAD
            git reset --hard "origin/$BRANCH"
            git checkout rendered -- "$OUTDIR"
            git add "$OUTDIR"
            python tools/check_staged_file_sizes.py
            git diff --cached --quiet || git commit -m "$MSG"
            sleep $((attempt * 5 + RANDOM % 10))
          done
          echo "::error::连续 10 次推送失败；成片仍在 artifact 中，未发送微信死链"
          exit 1

      # 推送**必须排在提交之后**——正文里的成片链接和复制页链接都指向仓库里的
      # 文件，还没提交上去就是 404。这一段的注释一直写着「推送是最后一步：
      # 前面提交完成片才有可下载的链接」，而它本人一直排在提交**前面**：
      # `wait_for_images` 探了二十次全失败，整条推送被取消（run 30339377013）。
      # 之所以一直没被发现，是因为这一步以前从没真的跑成功过。
      #
      # 「触发成功」不算推了，**这一步 success 才算**。
      - name: 推送到微信（可选）
        if: github.event.inputs.push == 'true' && (github.event.inputs.mode == 'render' || github.event.inputs.mode == 'push')
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_SECRET_KEY: ${{ secrets.PUSHPLUS_SECRET_KEY }}
          # **钉 commit，别停在 @main。** 同一条片子重渲，海报路径一模一样，
          # 而微信的图片缓存按**路径**算——URL 停在 @main 的话第二轮推出去的
          # 还是第一轮那张海报，**而且不吭声**。解说片一直有这一行，reel 漏了。
          TENNISLIVE_ASSET_REV: ${{ github.sha }}
        run: |
          COPY="specs/reels/${{ github.event.inputs.slug }}.xhs.txt"
          test -f "$COPY" || { echo "::error::找不到 $COPY"; exit 1; }
          python tools/push_reel.py \
            --outdir "${{ steps.paths.outputs.outdir }}" \
            --matchup "${{ github.event.inputs.matchup }}" \
            --score "${{ github.event.inputs.score }}" \
            --event "${{ github.event.inputs.event }}" \
            --summary "${{ github.event.inputs.summary }}" \
            --lead "${{ github.event.inputs.push_lead }}" \
            --copy "$COPY"
