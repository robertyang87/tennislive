name: Preserve finite current-model TTS inputs (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Preserve already generated finite audio bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/110a8706af07a73175f33bb3e22bfa4c8a598ec6 > /tmp/bundle-blob.json
          python - <<'PY'
          import json,base64,hashlib
          from pathlib import Path
          j=json.loads(Path('/tmp/bundle-blob.json').read_text())
          b=base64.b64decode(j['content'])
          assert hashlib.sha256(b).hexdigest()=='f124868fb838fe0619fda7cad80910d2e1614bdf4420cad07d728f217a7a2113'
          Path('/tmp/pronunciation-evidence.zip').write_bytes(b)
          PY
          TAG='reel-audio-review-chwalinska-bouzkova-wuhan-2026-r2-e61f706d4aec216d'
          gh release view "$TAG" --repo robertyang87/tennislive >/dev/null 2>&1 || gh release create "$TAG" --repo robertyang87/tennislive --target '${{ github.sha }}' --title 'Actual speech review evidence: Chwalinska Wuhan round two' --notes 'Finite actual-audio review and calibration evidence, including retained failed comparisons. Not a completed film.'
          gh release upload "$TAG" /tmp/pronunciation-evidence.zip --repo robertyang87/tennislive --clobber
