name: Preserve exact frozen native TTS inputs (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            src
      - name: Publish exact generated native voice inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/a03b8718ae4150442bbdf7ee4fbf294e13f03404 > /tmp/bundle-blob.json
          python - <<'PY_INPUT'
          from pathlib import Path
          import json,base64,hashlib
          b=base64.b64decode(json.loads(Path('/tmp/bundle-blob.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='6df4a0c7f60b5f78081c77e8a41c277cfc3839d8f9e5a4a922cbc5059e824d26'
          Path('/tmp/tts_bundle.zip').write_bytes(b)
          Path('/tmp/producer.json').write_text(json.dumps({'slug': 'ostapenko-pegula-wuhan-2026-r2', 'checked_at': '2026-10-14T12:11:19Z', 'voice': 'zh-CN-YunjianNeural', 'rate': '+6%', 'backend': 'edge-tts', 'base_style': ['', ''], '_why': '--check-narration 量到的真 TTS 时长，--dry-run 对「落在估算误差里」的段按旁白指纹认这份账（build_match_reel.narration_check_findings）', 'segments': {'628cc8963ae947f6': {'segment': 2, 'spoken': 9.984, 'picture': 11.0}, 'e60684d6244481e1': {'segment': 4, 'spoken': 10.32, 'picture': 12.5}, '51bbabdc8173e88c': {'segment': 6, 'spoken': 10.104, 'picture': 11.8}, '72422831eaf2f4fd': {'segment': 8, 'spoken': 7.68, 'picture': 10.0}, 'b216359e00e2a6bb': {'segment': 10, 'spoken': 11.568, 'picture': 13.0}, 'df5ab8c10da6e2fb': {'segment': 12, 'spoken': 12.432, 'picture': 14.8}, 'f7fbe1e47c6fd1c2': {'segment': 13, 'spoken': 8.928, 'picture': 10.5}}, 'tts_bundle': {'schema': 'tennislive.frozen-tts-bundle.v1', 'bundle_sha256': '6df4a0c7f60b5f78081c77e8a41c277cfc3839d8f9e5a4a922cbc5059e824d26', 'request_count': 8, 'mode': 'capture_export', 'strict_reused': False, 'artifact_kind': 'native_tts_inputs', 'quality_approval': False, 'audio_decoding_verified': True}},ensure_ascii=False))
          PY_INPUT
          PYTHONPATH=src python tools/reel_tts_release.py publish --slug ostapenko-pegula-wuhan-2026-r2 --bundle /tmp/tts_bundle.zip --metadata /tmp/producer.json
