name: Preserve finite final review evidence (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish exact reviewed inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/4528f8f025856a7394741536469436d0aea0ec9a > /tmp/blob-0.json
          python - <<'PY_EVIDENCE_0'
          from pathlib import Path
          import json,base64,hashlib
          b=base64.b64decode(json.loads(Path('/tmp/blob-0.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='2beb23e3dc75fd0486e3aaab51c816360f7c5880baf2726286427a3a750a9acd'
          Path('/tmp/pronunciation-evidence.zip').write_bytes(b)
          PY_EVIDENCE_0
          gh api repos/robertyang87/tennislive/git/blobs/c2f1a54f75a8394a030d06106adc0de90de35845 > /tmp/blob-1.json
          python - <<'PY_EVIDENCE_1'
          from pathlib import Path
          import json,base64,hashlib
          b=base64.b64decode(json.loads(Path('/tmp/blob-1.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='4160f211d2c0dff2bf6b5abf2207ae6f4bdebdcabb77db92ab0bf3f2fce2b531'
          Path('/tmp/visual-qc-evidence.zip').write_bytes(b)
          PY_EVIDENCE_1
          gh release view reel-review-ostapenko-pegula-wuhan-2026-r2 --repo robertyang87/tennislive >/dev/null 2>&1 || gh release create reel-review-ostapenko-pegula-wuhan-2026-r2 --title 'Finite actual review evidence: ostapenko-pegula-wuhan-2026-r2' --notes 'Exact frozen pronunciation inputs and sampled actual final-movie visual review. Does not constitute provider delivery receipt.' --repo robertyang87/tennislive
          gh release upload reel-review-ostapenko-pegula-wuhan-2026-r2 /tmp/pronunciation-evidence.zip /tmp/visual-qc-evidence.zip --repo robertyang87/tennislive
