name: Preserve exact afternoon voice inputs (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            src
      - name: Publish exact frozen native voice
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/b73aa8165a9c34f39990e51dd4b028b2c690f387 > /tmp/blob.json
          python - <<'PY_INPUT'
          from pathlib import Path
          import json,base64,hashlib
          raw=base64.b64decode(json.loads(Path('/tmp/blob.json').read_text())['content'])
          assert hashlib.sha256(raw).hexdigest()=='c7592cfccdfbb321264c8809a685c3f73ea8548ca4864258c5bb66d628d37e7a'
          Path('/tmp/tts_bundle.zip').write_bytes(raw)
          Path('/tmp/producer.json').write_text('{"slug": "ostapenko-pegula-wuhan-2026-r2", "checked_at": "2026-10-14T14:11:25Z", "voice": "zh-CN-YunjianNeural", "rate": "+6%", "backend": "edge-tts", "base_style": ["", ""], "_why": "--check-narration 量到的真 TTS 时长，--dry-run 对「落在估算误差里」的段按旁白指纹认这份账（build_match_reel.narration_check_findings）", "segments": {"6f5091f2f0b1f38a": {"segment": 2, "spoken": 9.888, "picture": 11.0}, "e60684d6244481e1": {"segment": 4, "spoken": 10.32, "picture": 12.5}, "51bbabdc8173e88c": {"segment": 6, "spoken": 10.104, "picture": 11.8}, "63b9a10ed6bf7235": {"segment": 8, "spoken": 7.512, "picture": 10.0}, "b216359e00e2a6bb": {"segment": 10, "spoken": 11.568, "picture": 13.0}, "df5ab8c10da6e2fb": {"segment": 12, "spoken": 12.432, "picture": 14.8}, "f7fbe1e47c6fd1c2": {"segment": 13, "spoken": 8.928, "picture": 10.5}}, "tts_bundle": {"schema": "tennislive.frozen-tts-bundle.v1", "bundle_sha256": "c7592cfccdfbb321264c8809a685c3f73ea8548ca4864258c5bb66d628d37e7a", "request_count": 8, "mode": "capture_export", "strict_reused": false, "artifact_kind": "native_tts_inputs", "quality_approval": false, "audio_decoding_verified": true}}')
          PY_INPUT
          PYTHONPATH=src python tools/reel_tts_release.py publish --slug ostapenko-pegula-wuhan-2026-r2 --bundle /tmp/tts_bundle.zip --metadata /tmp/producer.json
