name: Preserve finite current-model TTS inputs (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Preserve already generated finite audio bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/0882b80098533252578fb686b2c51e46455c9637 > /tmp/bundle-blob.json
          python - <<'PY'
          import json,base64,hashlib
          from pathlib import Path
          j=json.loads(Path('/tmp/bundle-blob.json').read_text())
          b=base64.b64decode(j['content'])
          assert hashlib.sha256(b).hexdigest()=='0ab1177077232e5c851d6e730da10e0923b704eb8246c8828406e6aeae42ef03'
          Path('/tmp/tts_bundle.zip').write_bytes(b)
          PY
          TAG='reel-tts-chwalinska-bouzkova-wuhan-2026-r2-0ab1177077232e5c'
          gh release view "$TAG" --repo robertyang87/tennislive >/dev/null 2>&1 || gh release create "$TAG" --repo robertyang87/tennislive --target '${{ github.sha }}' --title 'Native TTS inputs: Chwalinska Wuhan round two' --notes 'Finite generated audio and word-boundary inputs. Not a completed film or QC approval.'
          gh release upload "$TAG" /tmp/tts_bundle.zip --repo robertyang87/tennislive --clobber
