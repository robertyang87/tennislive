name: Preserve exact B8 official source (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/tennislive-sources
          key: reel-src-medvedev-tsitsipas-shanghai-2026-r4-c72370cb40d31b15
          fail-on-cache-miss: true
      - name: Preserve the actual native-probed source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY_SOURCE'
          from pathlib import Path
          import json,hashlib,shutil
          source=Path.home()/'.cache/tennislive-sources/f47556a66fd68019.mp4'
          assert source.is_file() and source.stat().st_size>0
          folder=Path('/tmp/official-source');folder.mkdir()
          shutil.copyfile(source,folder/'B8EO9eKy-mY.mp4')
          manifest={'source_url':'https://www.youtube.com/watch?v=B8EO9eKy-mY','native_probe_run':38592843982,'source_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),'bytes':source.stat().st_size,'publication_approved':False}
          (folder/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest))
          PY_SOURCE
          gh release view source-B8EO9eKy-mY >/dev/null 2>&1 || gh release create source-B8EO9eKy-mY --title 'Exact Tennis TV B8EO9eKy-mY official source' --notes 'Actual native probe source bytes, not a completed production or QC approval.' --latest=false --target '${{ github.sha }}'
          gh release upload source-B8EO9eKy-mY /tmp/official-source/B8EO9eKy-mY.mp4 /tmp/official-source/manifest.json
