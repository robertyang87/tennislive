# Branch-only candidate validation. Do not merge this replacement workflow into main.
name: match-reel candidate validation
run-name: candidate-only · ${{ inputs.slug }}
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: Isolated candidate native render and L2; Actions artifact only.
        required: true
        type: choice
        options:
        - render
        default: render
      slug:
        description: 片子 slug，决定目录名与 spec 文件名
        required: true
        default: yastremska-chwalinska
      voice:
        description: render：解说音色
        required: false
        default: zh-CN-YunjianNeural
      rate:
        description: render：语速
        required: false
        default: +6%
      push:
        description: Must remain false. Candidate validation never publishes.
        required: false
        type: boolean
        default: false
      received_at:
        description: 生产可用的视频链接被确认/派发的 UTC 时刻；自动链路必传，手动留空则从本 job 第一秒起算
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: reel-candidate-${{ inputs.slug }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 63
    steps:
    - name: 10 分钟成片时钟起点
      id: production_clock
      if: github.event.inputs.mode == 'render'
      env:
        RECEIVED_AT: ${{ github.event.inputs.received_at }}
      run: 'START="${RECEIVED_AT:-$(date -u +%FT%TZ)}"

        echo "received_at=$START" >> "$GITHUB_OUTPUT"

        echo "[production-sla] link accepted at $START; owned MP4 budget = 600s"

        '
    - uses: actions/checkout@v4
      with:
        sparse-checkout: '.github

          assets

          data

          docs

          specs

          skills

          src

          tests

          tools

          '
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
    - name: Guard isolated candidate identity and no publication
      env:
        MODE: ${{ inputs.mode }}
        SLUG: ${{ inputs.slug }}
        PUSH: ${{ inputs.push }}
        EXPECTED_BRANCH: repair/chwalinska-ci-candidate-20261002
        EXPECTED_SPEC_SHA256: 5f9d697b0b1cc321a56f356b5fe11453b0b32faf3fbd42f5c632f5e402f0d619
      run: 'python - <<''PYGUARD''

        import hashlib, os, pathlib

        assert os.environ[''MODE''] == ''render'', ''only candidate rendering is supported''

        assert os.environ[''PUSH''] != ''true'', ''candidate validation rejects push=true''

        assert os.environ[''GITHUB_REF_NAME''] == os.environ[''EXPECTED_BRANCH''], ''unexpected branch''

        assert os.environ[''SLUG''] == ''yastremska-chwalinska'', ''unexpected target''

        p = pathlib.Path(''specs/reels/yastremska-chwalinska.json'')

        assert hashlib.sha256(p.read_bytes()).hexdigest() == os.environ[''EXPECTED_SPEC_SHA256''], ''candidate spec drift''

        print(''Candidate-only validation; delivered assets and ledger are not destinations.'')

        PYGUARD'
    - name: 装依赖
      run: "# **push 模式只装主依赖。** 它不下片、不渲染、不抠图——rembg、opencv、\n# playwright、yt-dlp 一个都用不上，装全套只是把失败面铺大：那几个包\n# 里任何一个装不上，都会让一条**本来只是发消息**的\
        \ run 挂掉。\nif [ \"${{ github.event.inputs.mode }}\" = \"push\" ]; then\n  pip install -q -e .\n  # 真验一次 push 那条路要的东西，**不许\
        \ `|| true`**：装少了要在\n  # 第 5 秒炸，而不是三分钟后死在推送那一步。\n  python -c \"import requests, tennislive.publish.pushplus, tennislive.render.pushmsg\"\
        \n  echo \"push 模式：只装主依赖，推送那条路的 import 已验过\"\n  exit 0\nfi\n# **narration 也只装它用得上的那点。** 它不下片、不渲染、不抠图——\n# rembg（176\
        \ MB 模型的那个包）、opencv、playwright、yt-dlp 一个都用不上。\n# 装全套是 31 秒，而整趟 narration 才 1 分 37 秒；而且和 push 模式同理，\n# 那几个包里任何一个装不上，都会让一条**只是查旁白长度**的\
        \ run 挂掉。\nif [ \"${{ github.event.inputs.mode }}\" = \"narration\" ]; then\n  pip install -q -e .\n  # ⚠️ **numpy\
        \ 不能省**，虽然缺了它不报错。`voice_prosody` 用它量音高，\n  # 没有就整张表退成十一行「量不了」——而这条 run 的产物**就是那张表**\n  # （「风格做出来没有、有没有做过头，报在这儿」）。在干净\
        \ venv 里照这\n  # 一行原样装一遍才看见的，沙箱里它一直装着。\n  pip install -q edge-tts azure-cognitiveservices-speech numpy\n  # 真验一次这条路要的东西，**不许\
        \ `|| true`**：装少了要在第 5 秒炸，\n  # 而不是一分半之后死在合语音那一步。\n  python -c \"import edge_tts, numpy, tennislive.video.azure_tts\"\
        \n  echo \"narration 模式：只装合语音要的，查旁白那条路的 import 已验过\"\n  exit 0\nfi\n# **cookies 模式装得最少**：它只拿 yt-dlp 真下 30 秒媒体流验 cookie\n\
        # 活不活，不渲、不抠、不合语音——rembg 拖着 176 MB 模型的 onnxruntime、\n# opencv、playwright 全用不上。装全套只是把失败面铺大：那几个包里\n# 任何一个装不上，都会让一条**只是验\
        \ cookie**的 run 挂掉。\n# **reattest 装得和 narration 差不多少**：它只跑 production_preflight、\n# `--dry-run`（只读 spec 和 probe.json）和\
        \ reattest_check（纯标准库），\n# 不下片、不渲、不合语音——rembg / opencv / playwright / yt-dlp / edge-tts\n# 一个都用不上。numpy 留着：dry-run\
        \ 的 probe 层有几处按需 import 它。\nif [ \"${{ github.event.inputs.mode }}\" = \"reattest\" ]; then\n  pip install -q -e .\
        \ numpy\n  python -c \"import numpy, tennislive\"\n  echo \"reattest 模式：只装主依赖 + numpy，重核对那条路的 import 已验过\"\n  exit\
        \ 0\nfi\nif [ \"${{ github.event.inputs.mode }}\" = \"cookies\" ]; then\n  pip install -q -e . \"yt-dlp[default]\"\
        \n  node --version\n  echo \"cookies 模式：只装 yt-dlp（[default] 不能省，见下面那段注释）\"\n  exit 0\nfi\n# **probe 也不渲不抠**：下源片（yt-dlp）、拼缩略图墙（ffmpeg）、\n\
        # 认死球/切点（cv2 → visualqa）、备料（requests → 主依赖）。\n# webrender（playwright）和 cutout（rembg + onnxruntime，一百多 MB）\n# 是 render/cover\
        \ 的封面链路用的——probe 唯一会碰 cutout 的是\n# 「封面候选帧」那一步，而它只在 `cutout_candidates=true` 时才跑，\n# 所以 cutout 也只在那时候装。\nif [ \"${{\
        \ github.event.inputs.mode }}\" = \"probe\" ]; then\n  if [ \"${{ github.event.inputs.cutout_candidates }}\" = \"\
        true\" ]; then\n    pip install -q -e \".[visualqa,cutout]\"\n  else\n    pip install -q -e \".[visualqa]\"\n  fi\n\
        \  pip install -q \"yt-dlp[default]\"\n  # 真验一次这条路要的东西，**不许 `|| true`**：装少了要在第 5 秒炸，\n  # 而不是下完几百 MB 源片之后死在拼墙/认切点那一步。\n\
        \  python -c \"import cv2, numpy, requests\"\n  node --version\n  echo \"probe 模式：装 visualqa + yt-dlp，探测那条路的 import\
        \ 已验过\"\n  exit 0\nfi\n# `cutout` 那份是 rembg：封面人物走「本场抽帧抠图」，抠背景要它。\n# **同一个坑第四次**——playwright、Chromium、cv2 三次都是本地装着、\n\
        # runner 上没有，而且都死在下完 64MB 源片之后。这次连预检一起加了\n# （`_preflight_cutout`，排在下载之前），但依赖这一行还是得同一个提交里改。\n# `faces` 是封面认人＋睁眼（onnxruntime）：cutout\
        \ 本来就带着它，显式写上是\n# 因为「别指望隐式带上的包永远够用」（visualqa 显式写 numpy 那条同一个理由）。\npip install -q -e \".[webrender,visualqa,cutout,faces]\"\
        \n# **`yt-dlp` 要装 `[default]`**，它才带 `yt-dlp-ejs`——解 YouTube 的\n# n challenge 要跑一段 JS。少了它不会报「装少了」，而是\n# `n challenge\
        \ solving failed` + `Only images are available`，\n# 于是任何视频格式选择器都匹配不上，看起来像「这个视频没有格式」或者\n# 「cookie 过期了」。JS 运行时用 runner\
        \ 自带的 node（≥22），\n# 命令行统一带 `--js-runtimes node`。\npip install -q \"yt-dlp[default]\" edge-tts\n# Azure 那条路要 SDK 才拿得到词边界（REST\
        \ 接口不给），而字幕整条线\n# 就建立在词边界上。没配 key 的时候装着也不碍事——`azure_tts.available()`\n# 两样都查，缺一样就退回 edge-tts。\npip install -q azure-cognitiveservices-speech\n\
        node --version\n"
    - name: 发布文案前置检查
      if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover' || github.event.inputs.mode == 'reattest'
      env:
        SLUG: ${{ github.event.inputs.slug }}
      run: python tools/production_preflight.py --spec "specs/reels/$SLUG.json" --column 赛场之上
    - name: 取人脸模型缓存
      id: face-cache
      if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover'
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/tennislive/face-models
        key: face-models-buffalo_s-v0.7-17d6bb6dfcd3
    - name: 备好人脸模型
      id: face-models
      if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover'
      run: "if python tools/face_checks.py fetch; then\n  echo \"ok=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"::warning::人脸模型没备好——封面认人／睁眼会降级成\
        \ unavailable（写进 render.json）\"\nfi\n"
    - name: 存人脸模型缓存
      if: (github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover') && steps.face-cache.outputs.cache-hit
        != 'true' && steps.face-models.outputs.ok == 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/tennislive/face-models
        key: face-models-buffalo_s-v0.7-17d6bb6dfcd3
    - name: dry-run — 先把 spec 的形状错拦在编码之前
      if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover' || github.event.inputs.mode == 'narration'
        || github.event.inputs.mode == 'reattest'
      timeout-minutes: 3
      env:
        AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
        AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      run: "# tee 进 /tmp/render-findings.log：render 红了之后「判据回喂模型修一轮」\n# 那一步要拿这份**确定性的原话**当输入（tools/repair_reel_spec.py）。\n\
        # pipefail 不能省——GitHub 的 bash -e 默认不带它，tee 会把失败吞成绿。\nset -o pipefail\nSLUG=\"${{ github.event.inputs.slug }}\"\nSPEC=\"\
        specs/reels/${SLUG}.json\"\ntest -f \"$SPEC\" || { echo \"::error::找不到 $SPEC\"; exit 1; }\n# dry-run 的 probe 层按**源片\
        \ URL** 认领 output/*/reel/*/probe.json，\n# 而稀疏检出把 output/ 挡在外面（554 MB）——不拉回来的话这一层是哑的，\n# 「没查」和「查过没问题」在日志上长得一模一样。只 add\
        \ 这条 slug 自己\n# 的那几格（probe.json 连着缩略图墙，几 MB），别把整棵 output/ 抬回来。\n# ⚠️ grep 零命中退 1，在 pipefail + bash -e 下会把整步打死——下面那个\n\
        # 专门处理「还没有 probe」的 else 分支就永远走不到（自动链总是先 probe\n# 后 render，从没有 slug 走过无 probe 这条路，2026-08-27 手建 spec 直接\n# render 才第一次踩到）。`||\
        \ true` 让零命中如实落进 else。\nDIRS=$({ git ls-tree -r --name-only HEAD -- output 2>/dev/null \\\n  | grep -E \"^output/[^/]+/reel/${SLUG}/probe\\\
        .json$\" || true; } \\\n  | xargs -r -n1 dirname | sort -u)\nif [ -n \"$DIRS\" ]; then\n  git sparse-checkout add\
        \ $DIRS\n  echo \"拉回 probe 产物：$DIRS\"\nelse\n  echo \"::warning::仓库里还没有 output/*/reel/${SLUG}/probe.json——\"\n  echo\
        \ \"::warning::dry-run 的 probe 层（切点/死球/片长）这趟是哑的，先跑一趟 mode=probe\"\nfi\n# 抽帧封面的认人／睁眼：dry-run 查的是这条 slug **已经抓好的那一帧**\n\
        # （`cover_src/`，一张 jpg 加一份 manifest）。`--outdir` 是 /tmp/dryrun，\n# 不把它拉回来的话这一步在 runner 上**永远是空的**（评审 2026-09-27 nit\
        \ 3）。\nCOVER_DIRS=$({ git ls-tree -r --name-only HEAD -- output 2>/dev/null \\\n  | grep -E \"^output/[^/]+/reel/${SLUG}/cover_src/manifest\\\
        .json$\" || true; } \\\n  | xargs -r -n1 dirname | sort -u)\nif [ -n \"$COVER_DIRS\" ]; then\n  git sparse-checkout\
        \ add $COVER_DIRS\n  echo \"拉回封面帧（dry-run 先查认人／睁眼）：$COVER_DIRS\"\nfi\n# 多源片子的源常常 probe 在**别的 slug 目录**下（hsieh-chan-uso3、proz-mia25、\n\
        # quiet-src-*……）——上面按本 slug 拉不回来，7 趟几何红的 runner dry-run 因此\n# 全是「一份 probe.json 都没认领上」。按源片 URL 把它们的 probe.json 落盘\n\
        # （只取 probe.json，不拉缩略图墙；一趟批量 fetch），见 tools/probe_sources.py。\n# ⚠️ 这一步必须排在**所有** `git sparse-checkout add` 之后：add\
        \ 会把稀疏范围\n# 之外、没被跟踪修改的落盘文件清掉（评审实测），落好的 probe.json 就没了。\n# 取失败了**要往下传**（REEL_PROBES_MATERIALIZE_FAILED）：这一趟「认领不到\n\
        # probe」可能只是没拉回来，覆盖那道闸降成只报，别拿「先跑一趟 mode=probe」误导人。\nif ! python tools/probe_sources.py materialize \"$SPEC\"; then\n\
        \  echo \"::warning::按 URL 认领 probe.json 失败——这一趟覆盖那道闸只报不拦\"\n  export REEL_PROBES_MATERIALIZE_FAILED=1\nfi\n# 覆盖那道闸只在\
        \ mode=render 硬：cover／narration 这两趟用不到 probe，\n# 时效第一、封面排最前，别让一条还没 probe 的源挡住出封面。\nexport REEL_DRY_RUN_FOR=\"${{ github.event.inputs.mode\
        \ }}\"\n# --voice／--rate 和 narration、render 两步传同一对表单值：误差带那道闸拿它们比账头\n# （`narration_record_mismatch`），不传就恒比 CLI 默认值——表单上换了音色，\n\
        # narration 量的账和 dry-run 的期望各说各的。判据 `test_runner三步传同一对音色语速`。\npython tools/build_match_reel.py render --dry-run \\\
        \n  --spec \"$SPEC\" \\\n  --voice \"${{ github.event.inputs.voice }}\" \\\n  --rate \"${{ github.event.inputs.rate\
        \ }}\" \\\n  --outdir /tmp/dryrun 2>&1 | tee -a /tmp/render-findings.log\n"
    - name: 抽帧封面先查官方图（有能过机器闸的就不许发抽帧）
      if: github.event.inputs.mode == 'render'
      timeout-minutes: 2
      run: "SLUG=\"${{ github.event.inputs.slug }}\"\nset +e\nLIMIT=$(python tools/cover_upgrade.py --preflight-budget --slug\
        \ \"$SLUG\" 2>/dev/null)\ncase \"$LIMIT\" in ''|*[!0-9]*) LIMIT=60 ;; esac\n# 不 tee 进 /tmp/render-findings.log：自动\
        \ spec 在这儿只报不拦，那份原话是给\n# 「判据回喂」修 spec 用的，换图不归模型管（账号所有者 2026-09-27：模型线不再加强）\ntimeout \"$LIMIT\" python tools/cover_upgrade.py\
        \ --preflight --slug \"$SLUG\" \\\n  --summary \"$GITHUB_STEP_SUMMARY\"\nrc=$?\nset -e\ncase \"$rc\" in\n  0) ;;\n\
        \  3) exit 1 ;;\n  124) echo \"::warning::渲前查官方图超时（${LIMIT} 秒），没查完——不拦，抽帧照发\" ;;\n  *) echo \"::warning::渲前查官方图的工具自己出错（退出码\
        \ $rc）——不拦，抽帧照发；看上面的日志\" ;;\nesac\n"
    - name: 缓存 apt 包（ffmpeg + 字体，绕开镜像抽风）
      id: apt_cache
      if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover'
      uses: actions/cache/restore@v4
      with:
        path: '~/.cache/apt-archives

          ~/.cache/apt-lists

          '
        key: apt-pkgs-${{ runner.os }}-24.04-ffmpeg-fonts-v4-${{ github.run_id }}
        restore-keys: 'apt-pkgs-${{ runner.os }}-24.04-ffmpeg-fonts-v4-

          apt-pkgs-${{ runner.os }}-24.04-ci-v2-

          '
    - name: 装 ffmpeg
      if: github.event.inputs.mode != 'push' && github.event.inputs.mode != 'reattest'
      timeout-minutes: 15
      run: 'source tools/ci_apt_install.sh

        ensure_ffmpeg

        '
    - name: 装中文字体（渲染和封面都要）
      if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover'
      timeout-minutes: 15
      run: 'source tools/ci_apt_install.sh

        apt_install_cached fonts-noto-cjk fonts-noto-color-emoji

        '
    - name: 回写 apt 缓存（这趟真下了新包才存）
      if: env.APT_CACHE_DIRTY == '1' && steps.apt_cache.outputs.cache-primary-key != ''
      uses: actions/cache/save@v4
      with:
        path: '~/.cache/apt-archives

          ~/.cache/apt-lists

          '
        key: ${{ steps.apt_cache.outputs.cache-primary-key }}
    - name: 缓存抠图模型
      if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover'
      uses: actions/cache@v4
      with:
        path: ~/.u2net
        key: rembg-isnet-general-use-${{ runner.os }}
    - name: 算 Chromium 缓存键（装上的 playwright 版本）
      id: pw_version
      if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover'
      run: 'v=$(python -c ''import importlib.metadata as m; print(m.version("playwright"))'')

        echo "playwright $v"

        echo "version=$v" >> "$GITHUB_OUTPUT"

        '
    - name: 缓存 Chromium
      if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-pw${{ steps.pw_version.outputs.version }}
        restore-keys: playwright-chromium-${{ runner.os }}-
    - name: 装 Chromium
      if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover'
      timeout-minutes: 10
      run: "# 浏览器目录命中缓存后，先真启动一个空白页。启动成功同时证明：\n# ① 当前 playwright 找得到正确版本的 Chromium；② runner 上所需动态库\n# 已齐。此时再跑 `--with-deps`\
        \ 只会重复碰 apt，白花几十秒到数分钟。\n#\n# 不能只看 actions/cache 的 cache-hit：restore-keys 命中的旧缓存也可能\n# 正好可用，反过来「目录命中」也不保证动态库齐。真 launch\
        \ 是行为判据；\n# 失败才原样落回下面带超时、重试和 dpkg 收尾的安装路径。\nif timeout 20 python - <<'PY'\nfrom playwright.sync_api import sync_playwright\n\
        \ntry:\n    with sync_playwright() as playwright:\n        browser = playwright.chromium.launch(headless=True)\n \
        \       page = browser.new_page()\n        page.set_content(\"<p>chromium-ready</p>\")\n        assert page.locator(\"\
        p\").inner_text() == \"chromium-ready\"\n        browser.close()\nexcept Exception as exc:  # noqa: BLE001\n    print(f\"\
        [chromium] 缓存未就绪，走带依赖安装：{type(exc).__name__}: {exc}\")\n    raise SystemExit(1)\nPY\nthen\n  echo \"[chromium] 缓存可直接启动，跳过带系统依赖的安装\"\
        \n  exit 0\nfi\n\n# ⚠️ **`--with-deps` 会跑 apt，而这个仓库的 apt 会抽风。** CLAUDE.md 里那条\n# 「一次静静烧了 13 分 42 秒」的教训当时只套在显式的 `apt-get`\
        \ 步骤上，\n# **漏了这一处**——而它既没超时也没重试，能一路烧到 job 的 15 分钟预算\n# 用完（run 30973785219：卡在这一步 13 分钟，其余步骤全在 1 分钟内跑完）。\n#\n# 正常 5~60\
        \ 秒（命中缓存时是空操作）。240 秒是 4~48 倍的余量，\n# 只有真挂死才会两次都吃满。⚠️ **别把这个数调小**：第一版 apt 重试\n# 写 3×100 秒当场把 CI 弄红了，因为 apt 一直在推进、只是慢——\n\
        # **把「慢」误判成「挂死」，重试就从救场变成三倍的浪费**。\n# ⚠️ **第一次超时会毒死第二次，所以重试之前必须等 dpkg 锁松开。**\n# `timeout` 杀掉的是 `playwright install`\
        \ 那层壳，**它派生的 apt-get\n# 活了下来并攥着 `/var/lib/dpkg/lock-frontend`**。run 31003290962 的\n# 日志一清二楚：第 1 次 240 秒被杀，15 秒后第 2\
        \ 次**两秒**就死在\n# `held by process 4285 (apt-get)`——也就是说「重试」根本没重试成，\n# 它只是第一次超时的一个必然后果。\n#\n# ⚠️ 用 `pgrep -x`（**按可执行名精确匹配**），不是\
        \ `pgrep -f`。\n# CLAUDE.md 里那条「`until ! pgrep -f 'X'` 会匹配到它自己」说的就是\n# `-f` 扫整条命令行；这个循环跑在 bash 里，名字对不上 apt-get/dpkg，\n\
        # 不会把自己数进去。也不用 fuser/lsof——runner 上不保证装着。\npw_wait_apt() {\n  for _ in $(seq 1 22); do\n    if ! pgrep -x apt-get\
        \ >/dev/null && ! pgrep -x dpkg >/dev/null; then\n      return 0\n    fi\n    sleep 5\n  done\n  echo \"::warning::等了\
        \ 110 秒 dpkg 锁还没松开——下一次尝试八成会在两秒内死在 Could not get lock，不是 apt 装不上\"\n  # ⚠️⚠️ 2026-08-19（run 32211814483，tnns-stats）：等满\
        \ 110 秒，锁**仍然**\n  # 没松——被 `timeout` 杀掉的那层壳没能把信号传给它派生出来的\n  # apt-get（这正是上面那条注释说的「派生的 apt-get 活了下来」），\n  # 那个孤儿这次不是挂死，是在镜像上慢慢下一个字体包，110\
        \ 秒不够它\n  # 下完。而这一层已经贴着步骤预算的上限（`test_等dpkg锁的预算够长\n  # 又不许撑爆步骤预算` 钉的 110~120 秒）——**再往上加等待时间不是\n  # 出路**：上一次从 60 秒加到\
        \ 110 秒就是这么来的，这次撞上同一个\n  # 天花板，说明「多等一会」这条路已经走到头了。\n  #\n  # 我们不需要保住那个孤儿的进度：它已经下进\n  # `/var/cache/apt/archives` 的包，下一次重试照样会复用（ci.yml\n\
        \  # 那条注释早说过）。所以**主动结束它，不再指望它自己让开**——\n  # 这比继续加大等待预算快得多，也不会撞步骤超时。\n  sudo pkill -9 apt-get 2>/dev/null || true\n\
        \  sudo pkill -9 dpkg 2>/dev/null || true\n  sudo dpkg --configure -a 2>/dev/null || true\n}\npw_retry() {\n  for\
        \ i in 1 2; do\n    timeout 240 python -m playwright install --with-deps chromium && return 0\n    echo \"::warning::装\
        \ Chromium 第 $i 次没跑完（多半卡在 --with-deps 的 apt）\"\n    # 等锁，别拿 sleep 猜。顺带：被杀掉那次已经把一部分包下进了\n    # /var/cache/apt/archives，所以第\
        \ 2 次是接着下，不是从头来。\n    pw_wait_apt\n  done\n  echo \"::error::装 Chromium 两次都没成功\"\n  return 1\n}\npw_retry\n"
    - name: 算出源片缓存的键
      id: srckey
      if: github.event.inputs.mode != 'push' && github.event.inputs.mode != 'narration' && github.event.inputs.mode != 'cookies'
        && github.event.inputs.mode != 'reattest'
      env:
        URL_INPUT: ${{ github.event.inputs.url }}
        SLUG: ${{ github.event.inputs.slug }}
      run: "# **复用 `spec_sources()`，别在这儿再解析一遍 spec**——单源写\n# `source_url`、多源写 `sources`，两种写法各写一遍必分叉。\n# 它是纯函数、不打印，所以可以直接用（`load_spec`\
        \ 会打印，不能用）。\npython - <<'PY'\nimport hashlib, json, os, pathlib, sys\nsys.path.insert(0, \"tools\")\nurl = os.environ.get(\"\
        URL_INPUT\", \"\").strip()\nurls: list[str] = []\nwhy = \"\"\nif url:\n    urls, why = [url], \"来自 url 输入\"\nelse:\n\
        \    spec = pathlib.Path(f\"specs/reels/{os.environ['SLUG']}.json\")\n    if spec.is_file():\n        try:\n     \
        \       from build_match_reel import spec_sources\n            urls = sorted(spec_sources(\n                json.loads(spec.read_text(encoding=\"\
        utf-8\"))).values())\n            why = f\"来自 {spec}\"\n        except Exception as exc:            # noqa: BLE001\n\
        \            # **算不出键不该把整趟带崩**：spec 真有问题的话，下面\n            # 那几步会报一个说人话的错。这儿只退化成「不缓存」。\n            why = f\"读不出源片地址（{type(exc).__name__}:\
        \ {exc}）\"\n    else:\n        why = f\"{spec} 还不存在\"\nkey = (hashlib.sha256(\"\\n\".join(urls).encode()).hexdigest()[:16]\n\
        \       if urls else \"nourl\")\npathlib.Path(os.environ[\"RUNNER_TEMP\"], \"srckey\").write_text(key)\n# **两种情况都要出声**：算出来了和没算出来，日志上必须分得开，\n\
        # 否则「缓存没生效」和「生效了」长得一模一样。\nprint(f\"源片缓存键 {key}：{len(urls)} 条源片，{why}\")\nPY\necho \"hash=$(cat \"$RUNNER_TEMP/srckey\"\
        )\" >> \"$GITHUB_OUTPUT\"\n"
    - name: 缓存源片（同一条片子只下一次）
      if: github.event.inputs.mode != 'push' && github.event.inputs.mode != 'narration' && github.event.inputs.mode != 'cookies'
        && github.event.inputs.mode != 'reattest'
      uses: actions/cache@v4
      with:
        path: ~/.cache/tennislive-sources
        key: reel-src-${{ github.event.inputs.slug }}-${{ steps.srckey.outputs.hash }}
        restore-keys: reel-src-${{ github.event.inputs.slug }}-
    - name: 缓存 TTS（同文旁白跨趟不重合成）
      if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'narration'
      uses: actions/cache@v4
      with:
        path: ~/.cache/tennislive-tts
        key: reel-tts-${{ github.event.inputs.slug }}-${{ github.run_id }}
        restore-keys: 'reel-tts-${{ github.event.inputs.slug }}-

          '
    - name: Allocate isolated run-scoped candidate directories
      id: paths
      run: 'OUT_DIR="$RUNNER_TEMP/reel-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

        PROBE_DIR="output/zz-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/reel/${{ inputs.slug }}"

        mkdir -p "$OUT_DIR" "$PROBE_DIR"

        echo "outdir=$OUT_DIR" >> "$GITHUB_OUTPUT"

        echo "probe_dir=$PROBE_DIR" >> "$GITHUB_OUTPUT"'
    - name: 起 PO token provider
      id: pot
      if: github.event.inputs.mode != 'push' && github.event.inputs.mode != 'narration' && github.event.inputs.mode != 'cookies'
        && github.event.inputs.mode != 'reattest'
      continue-on-error: true
      run: "pip install -q bgutil-ytdlp-pot-provider\ndocker run --name bgutil-pot -d -p 4416:4416 \\\n  brainicism/bgutil-ytdlp-pot-provider\n\
        for i in $(seq 1 25); do\n  if curl -sf http://127.0.0.1:4416/ping >/dev/null; then\n    echo \"provider 起来了（第 $i\
        \ 次探活）\"\n    echo \"up=1\" >> \"$GITHUB_OUTPUT\"\n    exit 0\n  fi\n  sleep 2\ndone\necho \"::warning::PO token provider\
        \ 50 秒内没起来，退回 client 梯子\"\ndocker logs bgutil-pot 2>&1 | tail -20 || true\n"
    - name: 落 cookies（配了 Secret 才有）
      id: cookies
      env:
        YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
      run: "if [ -n \"$YT_COOKIES_TXT\" ]; then\n  printf '%s' \"$YT_COOKIES_TXT\" > \"$RUNNER_TEMP/yt-cookies.txt\"\n  echo\
        \ \"path=$RUNNER_TEMP/yt-cookies.txt\" >> \"$GITHUB_OUTPUT\"\n  echo \"已写入 cookies（$(wc -l < \"$RUNNER_TEMP/yt-cookies.txt\"\
        ) 行）\"\nelse\n  echo \"::notice::未配置 YT_COOKIES_TXT，只能靠 player client 梯子碰运气\"\nfi\n"
    - name: Probe the authentic source with the unchanged exact scorebox
      env:
        TENNISLIVE_SOURCE_CACHE: ~/.cache/tennislive-sources
        YT_COOKIES: ${{ steps.cookies.outputs.path }}
        YT_POT_PROVIDER: ${{ steps.pot.outputs.up }}
        SLUG: ${{ inputs.slug }}
        OUTDIR: ${{ steps.paths.outputs.outdir }}
        PROBE_DIR: ${{ steps.paths.outputs.probe_dir }}
      run: "python - <<'PYPROBE'\nimport hashlib, json, os, pathlib, shutil, subprocess, sys\nsys.path.insert(0, 'tools')\n\
        import build_match_reel as b\nimport probe_board as pb\np = pathlib.Path('specs/reels') / (os.environ['SLUG'] + '.json')\n\
        s = json.loads(p.read_text())\nassert s['source_url'] == 'https://www.youtube.com/watch?v=12BOGT88OnQ'\nassert s['scorebox']\
        \ == [90, 870, 516, 984]\ndest = pathlib.Path(os.environ['PROBE_DIR'])\nsubprocess.run([sys.executable, 'tools/build_match_reel.py',\
        \ 'probe', '--url', s['source_url'], '--every', '2', '--scorebox', ','.join(map(str, s['scorebox'])), '--outdir',\
        \ str(dest)], check=True)\nprobe = json.loads((dest / 'probe.json').read_text())\nassert probe['url'] == s['source_url']\n\
        assert (probe['width'], probe['height']) == (1920, 1080)\nassert abs(probe['duration'] - 310.009615) < 0.15, 'different\
        \ source cut'\nassert abs(probe['fps_value'] - 25) < .001\nscan, problem = pb._pick_scan(probe['board'], s['scorebox'],\
        \ 'wta')\nassert scan and scan['box'] == s['scorebox'], problem\nassert scan['frames'] and scan['profiles']['wta']['runs']\n\
        claimed, missing = b.claim_probes(s)\nassert not missing and claimed[s['source_url']][0] == dest, 'native probe selection\
        \ did not select this run'\nsource = next(x for x in sorted(dest.glob('source.*')) if x.suffix.lower() in {'.mp4',\
        \ '.mkv', '.webm'})\nprovenance = {'url': s['source_url'], 'source_file': source.name, 'source_sha256': hashlib.sha256(source.read_bytes()).hexdigest(),\
        \ 'source_bytes': source.stat().st_size, 'probe_sha256': hashlib.sha256((dest / 'probe.json').read_bytes()).hexdigest(),\
        \ 'scorebox': s['scorebox'], 'scan_frames': scan['frames'], 'run_id': os.environ['GITHUB_RUN_ID']}\n(dest / 'source_provenance.json').write_text(json.dumps(provenance,\
        \ ensure_ascii=False, indent=2) + '\\n')\nreview = pathlib.Path(os.environ['OUTDIR']) / 'probe_evidence'\nreview.mkdir()\n\
        for item in dest.iterdir():\n if item.is_file() and not item.name.startswith('source.'):\n  shutil.copy2(item, review\
        \ / item.name)\nshutil.copy2(dest / 'source_provenance.json', review / 'source_provenance.json')\nprint(json.dumps(provenance,\
        \ ensure_ascii=False))\nPYPROBE\nREEL_DRY_RUN_FOR=render python tools/build_match_reel.py render --dry-run --spec\
        \ \"specs/reels/${{ inputs.slug }}.json\" --voice \"${{ inputs.voice }}\" --rate \"${{ inputs.rate }}\" --outdir /tmp/candidate-dryrun"
    - name: render — 出成片
      if: github.event.inputs.mode == 'render'
      env:
        AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
        AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        TENNISLIVE_SOURCE_CACHE: ~/.cache/tennislive-sources
        YT_COOKIES: ${{ steps.cookies.outputs.path }}
        YT_POT_PROVIDER: ${{ steps.pot.outputs.up }}
      run: "SPEC=\"specs/reels/${{ github.event.inputs.slug }}.json\"\nOUTDIR=\"${{ steps.paths.outputs.outdir }}\"\nSLUG=\"\
        ${{ github.event.inputs.slug }}\"\ntest -f \"$SPEC\" || { echo \"::error::找不到 $SPEC\"; exit 1; }\n# render 在 TTS 之后按真语音重放数字静音（`_render_silence_gate`），要读\
        \ probe.json——\n# 和 narration 那一步同一个理由再落一遍（已经在的不动，一趟批量 fetch 两秒）。\npython tools/probe_sources.py materialize \"$SPEC\"\
        \ \\\n  || echo \"::warning::按 URL 认领 probe.json 失败——render 按真语音重放数字静音这一趟可能没查\"\n# 600 秒是性能目标，不是内容闸。超线照样做完、照样过 L2\
        \ 和发布；\n# `finish` 会在产物与 job summary 留 FAIL + warning，供后续定点修复。\n# tee + pipefail：失败原话（TTS 装不下 / 哑场 / ReelError）要留给\n\
        # 「判据回喂模型修一轮」那一步当输入，见 dry-run 步的同款注释。\nset -o pipefail\nRENDER_STARTED=$(date -u +%FT%TZ)\npython tools/video_sla.py\
        \ mark --timeline \"$RUNNER_TEMP/production-timeline.json\" --phase render\npython tools/build_match_reel.py render\
        \ \\\n  --spec \"$SPEC\" \\\n  --voice \"${{ github.event.inputs.voice }}\" \\\n  --rate \"${{ github.event.inputs.rate\
        \ }}\" \\\n  --outdir \"$OUTDIR\" 2>&1 | tee -a /tmp/render-findings.log\npython tools/video_sla.py finish --spec\
        \ \"$SPEC\" --timeline \"$RUNNER_TEMP/production-timeline.json\" \\\n  --received-at \"${{ steps.production_clock.outputs.received_at\
        \ }}\" \\\n  --render-started-at \"$RENDER_STARTED\" \\\n  --artifact \"$OUTDIR/$SLUG.mp4\" \\\n  --metadata \"$OUTDIR/render.json\"\
        \ \\\n  --pipeline match-reel --slug \"$SLUG\" \\\n  --summary \"$GITHUB_STEP_SUMMARY\"\nls -la \"$OUTDIR\"\n"
    - name: 查成片本身合不合格
      if: github.event.inputs.mode == 'render'
      run: "# tee + pipefail：QC 的「[不合格] …」原话要留给「判据回喂模型修一轮」\n# 那一步当输入，见 dry-run 步的同款注释。\nset -o pipefail\npython tools/check_reel_landed.py\
        \ \\\n  --slug \"${{ github.event.inputs.slug }}\" \\\n  --film \"${{ steps.paths.outputs.outdir }}/${{ github.event.inputs.slug\
        \ }}.mp4\" \\\n  2>&1 | tee -a /tmp/render-findings.log\n"
    - name: Verify candidate binding and retain original delivery markers
      env:
        EXPECTED_SPEC_SHA256: 5f9d697b0b1cc321a56f356b5fe11453b0b32faf3fbd42f5c632f5e402f0d619
        OUTDIR: ${{ steps.paths.outputs.outdir }}
      run: 'python - <<''PYVERIFY''

        import hashlib, json, os, pathlib, subprocess

        out = pathlib.Path(os.environ[''OUTDIR''])

        p = pathlib.Path(''specs/reels/yastremska-chwalinska.json'')

        assert hashlib.sha256(p.read_bytes()).hexdigest() == os.environ[''EXPECTED_SPEC_SHA256''], ''candidate spec changed
        during validation''

        qc = json.loads((out / ''qc_attestation.json'').read_text())

        assert qc[''status''] == ''pass'' and qc[''spec_sha256''] == os.environ[''EXPECTED_SPEC_SHA256'']

        assert qc[''film_sha256''] == hashlib.sha256((out / ''yastremska-chwalinska.mp4'').read_bytes()).hexdigest()

        assert qc[''ass_sha256''] == hashlib.sha256((out / ''subtitles.ass'').read_bytes()).hexdigest()

        subprocess.run([''git'', ''diff'', ''--exit-code'', ''--'', ''output'', ''data/reel_publish_ledger''], check=True)

        assert not (out / ''pushed.json'').exists()

        assert not json.loads((out / ''render.json'').read_text()).get(''video_url''), ''candidate must not have a published
        asset''

        print(''Native candidate QC verified; no delivered asset, ledger or receipt changes.'')

        PYVERIFY'
    - name: Upload candidate movie, native evidence, and source proof
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: candidate-${{ inputs.slug }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ steps.paths.outputs.outdir }}

          !${{ steps.paths.outputs.outdir }}/source*

          !${{ steps.paths.outputs.outdir }}/frames/**'
        retention-days: 14
