name: Preserve finite reviewed source (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/tennislive-sources
          key: reel-src-video-l9gd5ksrsvm-b72bf9b80d85b7a0
          fail-on-cache-miss: true
      - name: Preserve exact downloaded source bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil, hashlib, json
          source=Path.home()/'.cache/tennislive-sources/f06d0578e7e7c4a3.mp4'
          assert source.is_file() and source.stat().st_size>0
          out=Path('/tmp/source-review'); out.mkdir()
          shutil.copy2(source,out/'source.mp4')
          digest=hashlib.sha256(source.read_bytes()).hexdigest()
          (out/'manifest.json').write_text(json.dumps({'source_url':'https://www.youtube.com/watch?v=l9Gd5ksrsVM','source_sha256':digest,'bytes':source.stat().st_size,'publication_approved':False},indent=2)+'\n')
          print('Preserved exact source:',source.stat().st_size,digest)
          PY
      - name: Preserve the actual probe contact sheets and captions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download 38555626888 --dir /tmp/probe-review
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('/tmp/probe-review')
          with zipfile.ZipFile('/tmp/source-review/probe-review.zip','w',zipfile.ZIP_STORED) as z:
              for p in root.rglob('*'):
                  if p.is_file() and p.suffix in {'.json','.txt','.jpg','.png','.md'} and not p.name.endswith('.info.json'):
                      z.write(p,p.relative_to(root))
          PY
          TAG='source-ostapenko-pegula-wuhan-2026-r2-review'
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --target '${{ github.sha }}' --title 'Exact official source inputs for editorial review' --notes 'Finite source bytes and native probe evidence; not a completed film or publication approval.'
          gh release upload "$TAG" /tmp/source-review/source.mp4 /tmp/source-review/manifest.json /tmp/source-review/probe-review.zip --clobber
