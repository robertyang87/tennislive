name: Preserve finite B8 actual review evidence (temporary isolated branch)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve exact finite review artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/721b014b309048fd66bb86a2ef46966c688e1eac > /tmp/blob-0-0.json
          python - <<'PY_EVIDENCE_0'
          from pathlib import Path
          import json,base64,hashlib
          parts=[]
          raw=base64.b64decode(json.loads(Path('/tmp/blob-0-0.json').read_text())['content'])
          assert hashlib.sha256(raw).hexdigest()=='b7cafa1ffa8ff4b69e4e72fbb889b2577c37bb15c570b939d96eedfcaef002ae'
          parts.append(raw)
          archive=b''.join(parts)
          assert len(archive)==8608213 and hashlib.sha256(archive).hexdigest()=='b7cafa1ffa8ff4b69e4e72fbb889b2577c37bb15c570b939d96eedfcaef002ae'
          Path('/tmp/pronunciation-evidence.zip').write_bytes(archive)
          PY_EVIDENCE_0
          gh api repos/robertyang87/tennislive/git/blobs/4607e7d56298b337b4595008b0a80065eb6641d5 > /tmp/blob-1-0.json
          gh api repos/robertyang87/tennislive/git/blobs/bd9d5e0cf60e8aaa231a54c4fec54f74e334845c > /tmp/blob-1-1.json
          gh api repos/robertyang87/tennislive/git/blobs/cec126fb4d4184e7eb8e62395b94d7d6e7542c1a > /tmp/blob-1-2.json
          gh api repos/robertyang87/tennislive/git/blobs/55ee304392469ce9e2b08ed468d0414d84cd666a > /tmp/blob-1-3.json
          gh api repos/robertyang87/tennislive/git/blobs/eb8e06f0c9e01e3327192c9eb7ad8315a382360c > /tmp/blob-1-4.json
          gh api repos/robertyang87/tennislive/git/blobs/e810a9c83f53c33393499089acf2464ea4c4cd10 > /tmp/blob-1-5.json
          gh api repos/robertyang87/tennislive/git/blobs/09f31a53ec7972f7ed01e92df8e80aa0a172869b > /tmp/blob-1-6.json
          python - <<'PY_EVIDENCE_1'
          from pathlib import Path
          import json,base64,hashlib
          parts=[]
          raw=base64.b64decode(json.loads(Path('/tmp/blob-1-0.json').read_text())['content'])
          assert hashlib.sha256(raw).hexdigest()=='9713aa58a9020a82d60b4cfd1c58b8c16ac907db2738370543b32eff9440410b'
          parts.append(raw)
          raw=base64.b64decode(json.loads(Path('/tmp/blob-1-1.json').read_text())['content'])
          assert hashlib.sha256(raw).hexdigest()=='2f6299e33a440b283c87bc09ab293cbc07d2f27e525bc71c9a2a947d1f9c16c4'
          parts.append(raw)
          raw=base64.b64decode(json.loads(Path('/tmp/blob-1-2.json').read_text())['content'])
          assert hashlib.sha256(raw).hexdigest()=='1236d1c36d1fae0a57064122369b22ecbd39cf7953bac6cdef2d2b3b02f5ee0e'
          parts.append(raw)
          raw=base64.b64decode(json.loads(Path('/tmp/blob-1-3.json').read_text())['content'])
          assert hashlib.sha256(raw).hexdigest()=='366f5d5096ce08c8f2ec72d67a4a1c40d6d3219092f5e971a6e925736f490fb1'
          parts.append(raw)
          raw=base64.b64decode(json.loads(Path('/tmp/blob-1-4.json').read_text())['content'])
          assert hashlib.sha256(raw).hexdigest()=='50a3bea8d4695f2cec2676d5267d725b9c2827e01bfb2d6becdf3a28c29eb83f'
          parts.append(raw)
          raw=base64.b64decode(json.loads(Path('/tmp/blob-1-5.json').read_text())['content'])
          assert hashlib.sha256(raw).hexdigest()=='c6f987871c40c81e6f1d2dce88b455d07cf6a3f1afd354f8ad51be8b2f02cdd7'
          parts.append(raw)
          raw=base64.b64decode(json.loads(Path('/tmp/blob-1-6.json').read_text())['content'])
          assert hashlib.sha256(raw).hexdigest()=='eb0b1adf899102acb2a29f99c760b87d64abbfa2541228e15f0bfa79f51fd22c'
          parts.append(raw)
          archive=b''.join(parts)
          assert len(archive)==110233972 and hashlib.sha256(archive).hexdigest()=='8a4fda9ca59509bcf06a68e962930e4b5d777d10e3c96e2b65d53aca3672b48e'
          Path('/tmp/visual-qc-evidence.zip').write_bytes(archive)
          PY_EVIDENCE_1
          gh release view reel-review-medvedev-tsitsipas-shanghai-2026-r4-cde78c9e5707badb --repo robertyang87/tennislive >/dev/null 2>&1 || gh release create reel-review-medvedev-tsitsipas-shanghai-2026-r4-cde78c9e5707badb --title 'Actual Medvedev Tsitsipas review evidence' --notes 'Frozen actual current MP3 pronunciation controls and sampled actual final-movie review. Not a delivery receipt.' --latest=false --repo robertyang87/tennislive
          gh release upload reel-review-medvedev-tsitsipas-shanghai-2026-r4-cde78c9e5707badb /tmp/pronunciation-evidence.zip /tmp/visual-qc-evidence.zip --repo robertyang87/tennislive
