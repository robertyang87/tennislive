name: match-reel

# 把一条官方集锦剪成 9:16 竖版短片。分两步，因为**选段必须靠眼睛**：
#
#   mode=probe   下载源片 → 出场景切点 + 带时间码的缩略图墙 → 提交进仓库
#                （只提交几张 JPEG 和一个 json，源片 50MB 不进仓库）
#   mode=render  按 specs/reels/<slug>.json 剪 → 裁 9:16 → 中文解说 → 烧字幕
#                → 加封面 → 成片提交
#   mode=push    **成片已经在仓库里**，只写复制页 → 提交 → 发微信。
#                「先验产物再推」意味着推是**另一次**动作；没有这个模式就得为了
#                发一条消息把整条片子重渲一遍（一轮十五分钟：装中文字体 4 分 20、
#                渲片 7 分半），而重渲出来的那一版还得再验一次。
#   mode=cookies 什么都不产，只验 YouTube 还下不下得动（cookie 会过期）
#
# **为什么不在本地跑**：沙箱那台机器的 IP 被 YouTube 挡了——yt-dlp 拿得到格式表，
# 一取媒体就 403；真 Chromium 打开播放页直接是「detected unusual traffic」。
# ⚠️ **「edge-tts 同理」这半句 2026-08-05 证伪了。** 它报的是
# `CERTIFICATE_VERIFY_FAILED`，不是被挡——沙箱出网走一个做 TLS 拦截的代理，
# 而 edge-tts 认 certifi 自带的根证书。挂上代理的 CA 当场就通
# （`tennislive.localca`，CLI 入口自动调，runner 上是 no-op）。
# 所以**只有下载**非 runner 不可；合语音在本地就能做，`--check-narration`
# 实测 29 秒。同理封面：本地渲海报走 `tools/render_cover_local.py`，7 秒。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe=下载并出缩略图墙；cover=只出封面海报；narration=只查旁白装不装得下；render=按 spec 出成片；push=只推已落库的成片；cookies=只验 YouTube 还能不能下"
        required: true
        type: choice
        # **`cover` 是给返工用的。** 封面是全流程返工最多的那一屏，而
        # `build_cover` 不依赖 segments / tracks / TTS / voice——下完源片就能
        # 出海报，省掉分段编码 + TTS + 成片那四五分钟。实测整趟 3 分 19 秒。
        # ⚠️ `--cover-only` 的 CLI 开关先落地了而这一行没跟着改，于是它在唯一
        # 能用的那台机器上够不着（源片只在 runner 上活过几分钟）。
        options: [probe, cover, narration, render, push, cookies]
        default: probe
      slug:
        description: "片子 slug，决定目录名与 spec 文件名"
        required: true
        default: "eala-zheng"
      url:
        description: "源片地址（probe 必填；render 从 spec 里读）"
        required: false
        default: ""
      every:
        description: "probe：每几秒抓一帧"
        required: false
        default: "2"
      clip_from:
        # **合集里取一场时用。** WTA 的单场集锦不是每场都发，Day N 合集才是
        # 全覆盖的（王欣瑜对卡萨金娜只在 61 分钟的 Day 2 合集里，章节
        # 2371–2553）。不给区间的话缩略图墙会出七十多张、全是别人的比赛。
        # ⚠️ 缩略图上烧的仍是**源片绝对秒数**，spec 里的窗口直接照抄。
        description: "probe：只看源片的这一段（秒）；合集里取一场时用"
        required: false
        default: ""
      clip_to:
        description: "probe：区间终点（秒）"
        required: false
        default: ""
      scorebox:
        description: "probe：记分条位置 x0,y0,x1,y1（源片像素）；给了就顺手量死球时刻"
        required: false
        default: ""
      cutout_candidates:
        # 默认关掉——2026-08-16 起「封面大图一律用官方高清实拍，`cover.portrait.
        # frame_at` 不许再抽帧」定成硬闸之后，`solo` 版式的封面人物已经不走
        # `pick_cover_frames.py` 这条路。量过：最近 30 条 spec 全是 solo，
        # 上一次真正用它挑出的候选帧写进 spec 是 2026-08-19 的 `zhang-li`，
        # 之后再没用过。这一步却一直在 probe 里无条件跑，一次 71 秒白烧。
        #
        # `versus.top/bottom`（VS 版式的抠图人物，`cutout` 版式）不受那道闸管，
        # 官方图两边都拿不到时仍然要靠这一步从本场视频里抠——所以不删，
        # 只改成显式认领：真要用 `cutout` 版式、且知道官方图会缺，手动开它。
        description: "probe：要不要顺手扫封面候选帧（只有 VS 版式的 cutout 人物用得上，solo 版式不需要）"
        required: false
        type: boolean
        default: false
      voice:
        description: "render：解说音色"
        required: false
        # 定下来的是云见（Yunjian）——体育解说那把嗓子。默认值一直写着云希，
        # 靠每次手动传参盖过去，漏一次就换了个人在说话。
        default: "zh-CN-YunjianNeural"
      rate:
        description: "render：语速"
        required: false
        default: "+6%"
      push:
        description: "render 完成后推送到微信"
        required: false
        type: boolean
        default: false
      received_at:
        description: "生产可用的视频链接被确认/派发的 UTC 时刻；自动链路必传，手动留空则从本 job 第一秒起算"
        required: false
        default: ""
      # ⚠️ 下面这几个输入**一律不给默认值**。它们装的是「这一条片子的文案」，
      # 而默认值只能是**上一条片子的文案**——不传就顶着别人的话发出去，
      # 而且**不报错**。2026-08-01 郑钦文那条赛前前瞻就是这么发错的：
      # 标题印着「郑钦文首轮出局」（上一条华盛顿赛报的 summary 默认值），
      # 而那场球当晚 00:30 才开打。**说了一件没发生的事，微信收不回来。**
      #
      # 更阴的一层：**传空串盖不住默认值**。`github.event.inputs.X` 在收到空串时
      # 退回 default，所以我明明传了 `summary: ""`，用的还是那句旧话。
      # 唯一可靠的做法是默认值本身就是空的。
      matchup:
        description: "对阵，进标题：如「锦织圭 vs 商竣程」。**必填**（push=true 时）"
        required: false
        default: ""
      score:
        description: "赛果，进标题：赢家在前，如「2:1」。**赛前前瞻留空**"
        required: false
        default: ""
      event:
        description: "赛事与轮次，进标题。默认留空——加上就太长了，赛事名文案里有"
        required: false
        default: ""
      home:
        description: "主队英文全名（probe 后自动备料用，如 Alexandra Eala）"
        required: false
        default: ""
      away:
        description: "客队英文全名（probe 后自动备料用）"
        required: false
        default: ""
      year:
        description: "赛事年份（probe 后自动备料用，如 2026）"
        required: false
        default: ""
      summary:
        description: "一句话概括赛果（顶掉「对阵 + 比分」）：只留最硬的那个结果。整句标题不超过 20 个字位，讲不完的写进 push_lead"
        required: false
        default: ""
      push_lead:
        description: "推送正文那一句"
        required: false
        default: ""

permissions:
  contents: write
  # 触发 `pages.yml` 重新发布复制页——工作流自己提交的 push
  # **不会**创建 workflow run，见 `trigger_pages_build`。
  actions: write

# probe/render 按 slug 分组，不同片子可以并行，同一条的新 run 会取代旧 run。
# 只有 mode=push 的轻量发布 run 共用一个全局组，而且绝不能取消已经开始发布的
# 那一条：copy.html／pushed.json／main 都是共享写点，只有不可撤回的发送阶段串行。
# render push=true 不在这里串行：它质检落库后会另派一趟 mode=push。
concurrency:
  group: ${{ github.event.inputs.mode == 'push' && 'match-reel-publish' || format('match-reel-{0}', github.event.inputs.slug) }}
  cancel-in-progress: ${{ github.event.inputs.mode != 'push' }}

jobs:
  reel:
    runs-on: ubuntu-latest
    # 45 = 各步骤声明的最坏预算之和（43：dry-run 闸的 3 分钟是新加的一笔）
    # 加两分钟余量——步骤自己还在正常重试时不许被 job 级的壳先砍掉，
    # 判据 test_job级超时要兜得住各步骤自己声明的最坏预算之和。
    timeout-minutes: 45
    steps:
      # 600 秒只算「生产输入已齐 → 我们自己的 MP4 落盘」。发布/Pages 是另一条
      # SLO，不得反过来污染成片耗时；自动 dispatch 把确认链接的时刻传进来，
      # 手动 dispatch 没传时从 runner 的第一步开始，不能等装完依赖再偷偷起表。
      - name: 10 分钟成片时钟起点
        id: production_clock
        if: github.event.inputs.mode == 'render'
        env:
          RECEIVED_AT: ${{ github.event.inputs.received_at }}
        run: |
          START="${RECEIVED_AT:-$(date -u +%FT%TZ)}"
          echo "received_at=$START" >> "$GITHUB_OUTPUT"
          echo "[production-sla] link accepted at $START; owned MP4 budget = 600s"

      # **`push=true` 只能跑在 main 上，而且要在第一步就拦住。**
      #
      # GitHub Pages 只服务 main。复制页提交在特性分支上，那个 URL 永远是 404，
      # 而 `wait_for_copy_page` 等不到这一版就 `exit 1`——**一个字都不发**。
      # 这个设计是对的（宁可不发也不发一条带死链的消息），代价是它把失败推到了
      # 最后：渲片 6 分钟 → 轮询 10 分钟 → 才报错，前面全白跑。
      # 2026-07-29 大威那条就是这么烧掉一次的（run 30457284612），而
      # **CLAUDE.md 里白纸黑字记着这个坑**，照样走了进去。
      #
      # 判据探得很干净：同一个 Pages 站、同样的路径形状，分支上的 copy.html
      # 是 404，main 上 wang-pareja 的是 200，差别只有分支。
      #
      # 所以在这儿拦：让失败发生在第 5 秒，不是第 16 分钟。要出片不推送就
      # `push=false`，在分支上随便跑；要推送先把 PR 合进 main。
      - name: push=true 必须在 main 上
        if: github.event.inputs.push == 'true' && github.ref_name != 'main'
        run: |
          echo "::error::push=true 只能在 main 上跑，当前分支是 ${{ github.ref_name }}。"
          echo "::error::GitHub Pages 只服务 main——复制页留在分支上永远是 404，"
          echo "::error::推送那一步等不到它就会 exit 1，渲染和轮询全白跑十几分钟。"
          echo "::error::出片但不推送用 push=false；要推送先把 PR 合进 main 再跑。"
          exit 1

      # ⚠️ **两个开关管同一件事，只拨一个 run 照样绿。** 2026-08-05 踩的：
      # `mode=push` 的**唯一目的**就是发微信（本文件开头写着「成片已经在仓库里，
      # 只写复制页 → 提交 → 发微信」），可真正发消息那一步的 `if:` 认的是
      # `inputs.push`。只传 `mode=push` 的那趟**27 秒跑完、绿的**——写了复制页、
      # 提交说「没有变化」、然后收工，微信一个字都没发。
      #
      # **它和「发出去了」长得一模一样**：run 是绿的，日志里没有任何一行说
      # 「本次没有推送」。又一次「兜底出事的时候不吭声」，只是这次不吭声的是
      # 一个被跳过的步骤——`skipped` 不进日志。
      #
      # 装在这儿而不是让它默默跳过：`mode=push` 且 `push!=true` 是一个**没有
      # 意义的组合**，跑完什么也不产。第 5 秒报错，比绿着回来强。
      - name: mode=push 就必须 push=true
        if: github.event.inputs.mode == 'push' && github.event.inputs.push != 'true'
        run: |
          echo "::error::mode=push 的唯一目的就是发微信，但 push 还是 false——"
          echo "::error::这一趟会写完复制页就收工，**绿着回来，什么都没发**。"
          echo "::error::要发就同时给 mode=push 和 push=true。"
          echo "::error::只想重写复制页不发消息的话，现在没有这个模式，也不需要。"
          exit 1

      # **标题里那句话必须是这次填的。** 上一版给 matchup / summary / push_lead
      # 留了上一条片子的默认值，于是 2026-08-01 郑钦文那条赛前前瞻顶着
      # 「郑钦文首轮出局」发了出去——那场球当晚 00:30 才开打，**说了一件没发生
      # 的事**。默认值因此一律为空，那一条现在钉在
      # `test_推送的文案输入不许留上一条片子的默认值` 上。
      #
      # ⚠️ **这儿原来还有一道「两个都空就别发」的闸，已经拆掉。** 它要求
      # `matchup` 或 `summary` 至少在**命令行**上填一个——而这两样的正确出处是
      # spec：对阵从 `cover.versus.names` 算，`summary` / `lead` 写在 `push` 块里
      # （`push_reel.push_meta`）。于是那道闸把「照规矩做」变成了「必须手打」，
      # 而手打的字**任何测试都看不见**：2026-08-02 我在输入里把「十九岁」打成
      # 「九岁」，是在发出去之前取消了那趟 run 才没出事。
      #
      # 现在这两样写进 spec，就同时被 `test_轮次要写半决赛不写四强` 和
      # `test_人名要以译名表为准` 扫到。spec 里也没有的那种情况由
      # `push_reel.resolve_meta` 抛出来（判据见 test_标题末尾那一格空着就别发），
      # 报错里写着该去补哪个字段。
      - uses: actions/checkout@v4
        with:
          # **别把 output/ 拉下来。** HEAD 上它就有 1.36 GB（.git 1.77 GiB），
          # checkout 因此每次要 1 分 35 秒到 2 分 44 秒——而渲染一个字节都用不到
          # 别人的成片。稀疏检出把它挡在外面，剩下的加起来 161 MB。
          # 本次的 outdir 在「算出目录」那一步再 add 进来。
          # ⚠️ 排除的**只有** output/。assets 155 MB 是渲染真要读的东西
          # （抠图、示意图、字体），少一个就是第 5 分钟才炸的 FileNotFoundError。
          sparse-checkout: |
            assets
            data
            docs
            specs
            src
            tests
            tools

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ffmpeg 两种模式都要；**中文字体只有渲染要**（封面和烧字幕）。
      # 原来合成一步挂在所有模式前面，而 apt 那一步挂死过——probe 因此被一个
      # 它根本用不到的依赖拖住二十分钟。拆开，并给超时：卡住要失败，不要空转。
      #
      # ⚠️ **2026-08-19 (bouzkova-jovic 那趟 render) `apt-get update` 连着两次
      # 吃满 150 秒、零字节进度**——`Acquire::http::Timeout=20` 那道防线对着一个
      # 彻底不响应的镜像没能生效，和 PR #448 那次 ci.yml 撞的是同一个坑。
      # 继续调重试参数治不了根：真正的杠杆是**大多数 run 根本不碰这个镜像**。
      # `tools/ci_apt_install.sh` 把 apt 的索引和下载缓存重定向到这里缓存住的
      # 目录，先试一次零网络的本地安装，缓存没命中才回退到会摸网的老路。
      - name: 缓存 apt 包（ffmpeg + 字体，绕开镜像抽风）
        if: github.event.inputs.mode != 'push'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          # actions/cache 的主键是不可变的。原来这儿是一把固定钥匙：如果第一趟
          # probe 只攒下 ffmpeg，后面的 render 即使把字体包补进目录，post step
          # 也不能覆盖同名缓存，于是每一趟 render 仍要重新摸 apt 镜像。
          #
          # 和下面 TTS 内容缓存一样改成滚动键：先按稳定前缀恢复最近一份，跑完
          # 再用本次 run_id 回写「旧缓存 + 这趟补齐的包」。这样一次 render
          # 补齐字体后，下一趟才能真的吃到完整缓存。
          key: apt-pkgs-${{ runner.os }}-24.04-ffmpeg-fonts-v2-${{ github.run_id }}
          restore-keys: |
            apt-pkgs-${{ runner.os }}-24.04-ffmpeg-fonts-v2-
      - name: 装 ffmpeg
        # push 模式一帧都不碰：`push_reel.py` 那条路里 ffmpeg / ffprobe /
        # subprocess **一个都没出现**，装它白花半分钟。
        if: github.event.inputs.mode != 'push'
        timeout-minutes: 15
        run: |
          source tools/ci_apt_install.sh
          ensure_ffmpeg

      # ⚠️ **`cover` 也要**：封面走 HTML 渲染（和知识帖同一套字），少了中文字体
      # 出来的是豆腐块。加 cover 档那次漏了这三步，run 155 就是这么红的——
      # 「加新能力就要同时改三处」的第 N 次。
      - name: 装中文字体（渲染和封面都要）
        if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover'
        # ⚠️ 7 分钟不够：`apt_install_cached` 缓存没命中时会退到
        # apt_retry(update) + apt_retry(install) 各两次 150 秒。
        # ⚠️⚠️ 2026-08-19 傍晚又涨了一次：`apt_install_cached` 最前面那句
        # 「先试本地安装」原来没有 `timeout` 包着，run 32290505356 撞出它
        # 也可能悄悄摸网（索引是新的不代表这批包的 .deb 也在盘上），补上
        # `timeout 150` 之后最坏预算变成 150 + 2×2×160 = 790 秒 ≈ 13.2 分。
        # 按 15 分钟留够余量，和这条线上其余用到 `apt_install_cached` 的
        # 步骤统一（判据 `test_装ffmpeg和字体那批步骤都走共享脚本不留手搓的调用`）。
        timeout-minutes: 15
        # `fonts-noto-color-emoji` 不是可选项：封面上每个球员名字旁边有一面
        # 国旗（账号所有者 2026-08-02 定的），而**缺了它不报错**——Chromium
        # 回退到没有旗帜字形的字体，🇵🇭 渲成两个方框或者裸的「PH」两个字母，
        # 海报照样出得来。同一条规矩这一天已经咬过三次（fonts-noto-core、
        # pip 行漏了 `-e .`、ci.yml 漏了字体）。判据在
        # `test_封面的国旗要有字体渲得出来`：它真渲一次并比像素。
        #
        # apt 那套重试/缓存逻辑和上面「装 ffmpeg」共用同一份脚本、同一份
        # 缓存目录——这一步不用再单独 `actions/cache`：同一个 job 里
        # ffmpeg 那步如果真的摸了网，索引已经落在 `~/.cache/apt-lists` 里，
        # 这一步直接吃现成的。
        run: |
          source tools/ci_apt_install.sh
          apt_install_cached fonts-noto-cjk fonts-noto-color-emoji

      # 封面走 HTML 渲染（和知识帖同一套字），所以要 webrender + Chromium。
      # 少了它 render 会死在 ModuleNotFoundError: playwright，而且是在下完
      # 64MB 源片、合完音之后才死——白跑一分半。
      # visualqa 那份是 opencv：跟踪裁切靠它算帧差质心。**同一个坑第二次**——
      # 跟踪合进来的那次 render 就是在下完源片、合完音之后死在
      # `ModuleNotFoundError: No module named 'cv2'`（run 30334177432）。
      # 抠图模型 176MB，第一次跑要现下。缓存住，否则每条片子都等一遍。
      - name: 缓存抠图模型
        if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover'
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-isnet-general-use-${{ runner.os }}

      - name: 装依赖
        run: |
          # **push 模式只装主依赖。** 它不下片、不渲染、不抠图——rembg、opencv、
          # playwright、yt-dlp 一个都用不上，装全套只是把失败面铺大：那几个包
          # 里任何一个装不上，都会让一条**本来只是发消息**的 run 挂掉。
          if [ "${{ github.event.inputs.mode }}" = "push" ]; then
            pip install -q -e .
            # 真验一次 push 那条路要的东西，**不许 `|| true`**：装少了要在
            # 第 5 秒炸，而不是三分钟后死在推送那一步。
            python -c "import requests, tennislive.publish.pushplus, tennislive.render.pushmsg"
            echo "push 模式：只装主依赖，推送那条路的 import 已验过"
            exit 0
          fi
          # **narration 也只装它用得上的那点。** 它不下片、不渲染、不抠图——
          # rembg（176 MB 模型的那个包）、opencv、playwright、yt-dlp 一个都用不上。
          # 装全套是 31 秒，而整趟 narration 才 1 分 37 秒；而且和 push 模式同理，
          # 那几个包里任何一个装不上，都会让一条**只是查旁白长度**的 run 挂掉。
          if [ "${{ github.event.inputs.mode }}" = "narration" ]; then
            pip install -q -e .
            # ⚠️ **numpy 不能省**，虽然缺了它不报错。`voice_prosody` 用它量音高，
            # 没有就整张表退成十一行「量不了」——而这条 run 的产物**就是那张表**
            # （「风格做出来没有、有没有做过头，报在这儿」）。在干净 venv 里照这
            # 一行原样装一遍才看见的，沙箱里它一直装着。
            pip install -q edge-tts azure-cognitiveservices-speech numpy
            # 真验一次这条路要的东西，**不许 `|| true`**：装少了要在第 5 秒炸，
            # 而不是一分半之后死在合语音那一步。
            python -c "import edge_tts, numpy, tennislive.video.azure_tts"
            echo "narration 模式：只装合语音要的，查旁白那条路的 import 已验过"
            exit 0
          fi
          # **cookies 模式装得最少**：它只拿 yt-dlp 真下 30 秒媒体流验 cookie
          # 活不活，不渲、不抠、不合语音——rembg 拖着 176 MB 模型的 onnxruntime、
          # opencv、playwright 全用不上。装全套只是把失败面铺大：那几个包里
          # 任何一个装不上，都会让一条**只是验 cookie**的 run 挂掉。
          if [ "${{ github.event.inputs.mode }}" = "cookies" ]; then
            pip install -q -e . "yt-dlp[default]"
            node --version
            echo "cookies 模式：只装 yt-dlp（[default] 不能省，见下面那段注释）"
            exit 0
          fi
          # **probe 也不渲不抠**：下源片（yt-dlp）、拼缩略图墙（ffmpeg）、
          # 认死球/切点（cv2 → visualqa）、备料（requests → 主依赖）。
          # webrender（playwright）和 cutout（rembg + onnxruntime，一百多 MB）
          # 是 render/cover 的封面链路用的——probe 唯一会碰 cutout 的是
          # 「封面候选帧」那一步，而它只在 `cutout_candidates=true` 时才跑，
          # 所以 cutout 也只在那时候装。
          if [ "${{ github.event.inputs.mode }}" = "probe" ]; then
            if [ "${{ github.event.inputs.cutout_candidates }}" = "true" ]; then
              pip install -q -e ".[visualqa,cutout]"
            else
              pip install -q -e ".[visualqa]"
            fi
            pip install -q "yt-dlp[default]"
            # 真验一次这条路要的东西，**不许 `|| true`**：装少了要在第 5 秒炸，
            # 而不是下完几百 MB 源片之后死在拼墙/认切点那一步。
            python -c "import cv2, numpy, requests"
            node --version
            echo "probe 模式：装 visualqa + yt-dlp，探测那条路的 import 已验过"
            exit 0
          fi
          # `cutout` 那份是 rembg：封面人物走「本场抽帧抠图」，抠背景要它。
          # **同一个坑第四次**——playwright、Chromium、cv2 三次都是本地装着、
          # runner 上没有，而且都死在下完 64MB 源片之后。这次连预检一起加了
          # （`_preflight_cutout`，排在下载之前），但依赖这一行还是得同一个提交里改。
          pip install -q -e ".[webrender,visualqa,cutout]"
          # **`yt-dlp` 要装 `[default]`**，它才带 `yt-dlp-ejs`——解 YouTube 的
          # n challenge 要跑一段 JS。少了它不会报「装少了」，而是
          # `n challenge solving failed` + `Only images are available`，
          # 于是任何视频格式选择器都匹配不上，看起来像「这个视频没有格式」或者
          # 「cookie 过期了」。JS 运行时用 runner 自带的 node（≥22），
          # 命令行统一带 `--js-runtimes node`。
          pip install -q "yt-dlp[default]" edge-tts
          # Azure 那条路要 SDK 才拿得到词边界（REST 接口不给），而字幕整条线
          # 就建立在词边界上。没配 key 的时候装着也不碍事——`azure_tts.available()`
          # 两样都查，缺一样就退回 edge-tts。
          pip install -q azure-cognitiveservices-speech
          node --version

      # **`--dry-run` 0.2 秒能拦的错，别让它等到装完 Chromium、下完源片才红。**
      # spec 形状错、选段硬伤、文案超限、旁白一定装不下——这四类在本地都该被
      # dry-run 拦住，但「本地跑过」靠的是人记得；这一步让 runner 自己也拦一遍，
      # 死在第 30 秒而不是第 5 分钟（「返工比慢更贵」那条的 runner 侧半截）。
      # ⚠️ 只给要读 spec 的三档（render / cover / narration）——probe 那档
      # 常常还没有 spec（它自己就是来备料写草稿的），cookies / push 不读 spec。
      - name: dry-run — 先把 spec 的形状错拦在编码之前
        if: >-
          github.event.inputs.mode == 'render'
          || github.event.inputs.mode == 'cover'
          || github.event.inputs.mode == 'narration'
        timeout-minutes: 3
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          SPEC="specs/reels/${SLUG}.json"
          test -f "$SPEC" || { echo "::error::找不到 $SPEC"; exit 1; }
          # dry-run 的 probe 层按**源片 URL** 认领 output/*/reel/*/probe.json，
          # 而稀疏检出把 output/ 挡在外面（554 MB）——不拉回来的话这一层是哑的，
          # 「没查」和「查过没问题」在日志上长得一模一样。只 add 这条 slug 自己
          # 的那几格（probe.json 连着缩略图墙，几 MB），别把整棵 output/ 抬回来。
          DIRS=$(git ls-tree -r --name-only HEAD -- output 2>/dev/null \
            | grep -E "^output/[^/]+/reel/${SLUG}/probe\.json$" \
            | xargs -r -n1 dirname | sort -u)
          if [ -n "$DIRS" ]; then
            git sparse-checkout add $DIRS
            echo "拉回 probe 产物：$DIRS"
          else
            echo "::warning::仓库里还没有 output/*/reel/${SLUG}/probe.json——"
            echo "::warning::dry-run 的 probe 层（切点/死球/片长）这趟是哑的，先跑一趟 mode=probe"
          fi
          python tools/build_match_reel.py render --dry-run \
            --spec "$SPEC" --outdir /tmp/dryrun

      - name: 缓存 Chromium
        if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          # ⚠️ **键钉在整份 `pyproject.toml` 上太宽。** 决定装哪个 Chromium 的
          # 只有 playwright 的版本，可这个键是**整份文件的哈希**——加一个依赖、
          # 改一行注释，六条工作流的 150 MB Chromium 缓存**同时失效**，
          # 下一趟每条都要重下一遍。2026-08-05 往 pyproject 里加 certifi 和
          # pytest-xdist 时当场撞上（run 30973785219 卡在「安装 Chromium」）。
          #
          # `restore-keys` 就够：主键没中就退到上一份，Chromium 已经在盘上，
          # `playwright install` 是个空操作；真换了 playwright 版本它会自己去下
          # 对的那一版，所以退旧缓存也不会拿错。这比另起一步去算版本号便宜，
          # 而且不用动步骤顺序。判据在 `test_Chromium缓存都要有restore_keys`。
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: 装 Chromium
        if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'cover'
        # 10 而不是 9：等 dpkg 锁最多再花 60 秒（见下面 pw_wait_apt），
        # 而 2×240 秒本来就贴着 9 分钟。第 2 次眼看要成却被步骤预算
        # 掐掉，和「装不上」长得一模一样。
        timeout-minutes: 10
        run: |
          # 浏览器目录命中缓存后，先真启动一个空白页。启动成功同时证明：
          # ① 当前 playwright 找得到正确版本的 Chromium；② runner 上所需动态库
          # 已齐。此时再跑 `--with-deps` 只会重复碰 apt，白花几十秒到数分钟。
          #
          # 不能只看 actions/cache 的 cache-hit：restore-keys 命中的旧缓存也可能
          # 正好可用，反过来「目录命中」也不保证动态库齐。真 launch 是行为判据；
          # 失败才原样落回下面带超时、重试和 dpkg 收尾的安装路径。
          if timeout 20 python - <<'PY'
          from playwright.sync_api import sync_playwright

          try:
              with sync_playwright() as playwright:
                  browser = playwright.chromium.launch(headless=True)
                  page = browser.new_page()
                  page.set_content("<p>chromium-ready</p>")
                  assert page.locator("p").inner_text() == "chromium-ready"
                  browser.close()
          except Exception as exc:  # noqa: BLE001
              print(f"[chromium] 缓存未就绪，走带依赖安装：{type(exc).__name__}: {exc}")
              raise SystemExit(1)
          PY
          then
            echo "[chromium] 缓存可直接启动，跳过带系统依赖的安装"
            exit 0
          fi

          # ⚠️ **`--with-deps` 会跑 apt，而这个仓库的 apt 会抽风。** CLAUDE.md 里那条
          # 「一次静静烧了 13 分 42 秒」的教训当时只套在显式的 `apt-get` 步骤上，
          # **漏了这一处**——而它既没超时也没重试，能一路烧到 job 的 15 分钟预算
          # 用完（run 30973785219：卡在这一步 13 分钟，其余步骤全在 1 分钟内跑完）。
          #
          # 正常 5~60 秒（命中缓存时是空操作）。240 秒是 4~48 倍的余量，
          # 只有真挂死才会两次都吃满。⚠️ **别把这个数调小**：第一版 apt 重试
          # 写 3×100 秒当场把 CI 弄红了，因为 apt 一直在推进、只是慢——
          # **把「慢」误判成「挂死」，重试就从救场变成三倍的浪费**。
          # ⚠️ **第一次超时会毒死第二次，所以重试之前必须等 dpkg 锁松开。**
          # `timeout` 杀掉的是 `playwright install` 那层壳，**它派生的 apt-get
          # 活了下来并攥着 `/var/lib/dpkg/lock-frontend`**。run 31003290962 的
          # 日志一清二楚：第 1 次 240 秒被杀，15 秒后第 2 次**两秒**就死在
          # `held by process 4285 (apt-get)`——也就是说「重试」根本没重试成，
          # 它只是第一次超时的一个必然后果。
          #
          # ⚠️ 用 `pgrep -x`（**按可执行名精确匹配**），不是 `pgrep -f`。
          # CLAUDE.md 里那条「`until ! pgrep -f 'X'` 会匹配到它自己」说的就是
          # `-f` 扫整条命令行；这个循环跑在 bash 里，名字对不上 apt-get/dpkg，
          # 不会把自己数进去。也不用 fuser/lsof——runner 上不保证装着。
          pw_wait_apt() {
            for _ in $(seq 1 22); do
              if ! pgrep -x apt-get >/dev/null && ! pgrep -x dpkg >/dev/null; then
                return 0
              fi
              sleep 5
            done
            echo "::warning::等了 110 秒 dpkg 锁还没松开——下一次尝试八成会在两秒内死在 Could not get lock，不是 apt 装不上"
            # ⚠️⚠️ 2026-08-19（run 32211814483，tnns-stats）：等满 110 秒，锁**仍然**
            # 没松——被 `timeout` 杀掉的那层壳没能把信号传给它派生出来的
            # apt-get（这正是上面那条注释说的「派生的 apt-get 活了下来」），
            # 那个孤儿这次不是挂死，是在镜像上慢慢下一个字体包，110 秒不够它
            # 下完。而这一层已经贴着步骤预算的上限（`test_等dpkg锁的预算够长
            # 又不许撑爆步骤预算` 钉的 110~120 秒）——**再往上加等待时间不是
            # 出路**：上一次从 60 秒加到 110 秒就是这么来的，这次撞上同一个
            # 天花板，说明「多等一会」这条路已经走到头了。
            #
            # 我们不需要保住那个孤儿的进度：它已经下进
            # `/var/cache/apt/archives` 的包，下一次重试照样会复用（ci.yml
            # 那条注释早说过）。所以**主动结束它，不再指望它自己让开**——
            # 这比继续加大等待预算快得多，也不会撞步骤超时。
            sudo pkill -9 apt-get 2>/dev/null || true
            sudo pkill -9 dpkg 2>/dev/null || true
            sudo dpkg --configure -a 2>/dev/null || true
          }
          pw_retry() {
            for i in 1 2; do
              timeout 240 python -m playwright install --with-deps chromium && return 0
              echo "::warning::装 Chromium 第 $i 次没跑完（多半卡在 --with-deps 的 apt）"
              # 等锁，别拿 sleep 猜。顺带：被杀掉那次已经把一部分包下进了
              # /var/cache/apt/archives，所以第 2 次是接着下，不是从头来。
              pw_wait_apt
            done
            echo "::error::装 Chromium 两次都没成功"
            return 1
          }
          pw_retry

      # **同一条源片会被下两到三次**：probe 一次、cover 一次、render 一次——
      # 中间「丢掉不进仓库的中间物」把它删了，而它本来就不进仓库。实测一个
      # 70 MB 的源片要下 **100.86 秒**（YouTube 限速，不是带宽），而 render
      # 整步才 198 秒——**一半时间花在重下同一个文件上**。
      # 键按 slug 走：一条片子的源片 URL 写死在 spec 里，不会变。
      # ⚠️ 缓存目录在 `~` 底下，清理那一步只碰 outdir，碰不到它。
      # **键要按源片的 URL 算，不按整份 spec 算。**
      #
      # 代码里那层缓存（`_cached_source`）的注释白纸黑字写着「键取 URL 的哈希：
      # 换了 URL 自然是另一个键」——而这儿的 Actions 缓存原来用的是
      # `hashFiles(specs/reels/<slug>.json)`，**两层的口径对不上**。
      #
      # 后果：改一个字的旁白 → spec 哈希变 → 主键必然未命中 → 这一趟结束时
      # 又把同一个 50~70 MB 的源片**重新上传一份**。shang-rublev 那条片子
      # 光 spec 就改了六次。仓库缓存上限 10 GB、LRU 淘汰，于是这些重复条目会
      # 把 Chromium（150 MB）和抠图模型（176 MB）挤出去——而那表现为
      # 「今天 CI 怎么慢了点」，没有任何东西会说是缓存被挤掉了。
      #
      # 按 URL 算之后，同一条源片的主键在整条片子的生命周期里**一直命中**，
      # 一次都不用重传。判据在 `test_源片缓存的键要按URL算`。
      # ⚠️ cookies 模式也不走 download()（它自己往 $RUNNER_TEMP 下 30 秒试块），
      # 恢复源片缓存对它是纯开销，还会在结束时把这份缓存重传一遍挤 10 GB 池子。
      - name: 算出源片缓存的键
        id: srckey
        if: github.event.inputs.mode != 'push' && github.event.inputs.mode != 'narration' && github.event.inputs.mode != 'cookies'
        env:
          URL_INPUT: ${{ github.event.inputs.url }}
          SLUG: ${{ github.event.inputs.slug }}
        run: |
          # **复用 `spec_sources()`，别在这儿再解析一遍 spec**——单源写
          # `source_url`、多源写 `sources`，两种写法各写一遍必分叉。
          # 它是纯函数、不打印，所以可以直接用（`load_spec` 会打印，不能用）。
          python - <<'PY'
          import hashlib, json, os, pathlib, sys
          sys.path.insert(0, "tools")
          url = os.environ.get("URL_INPUT", "").strip()
          urls: list[str] = []
          why = ""
          if url:
              urls, why = [url], "来自 url 输入"
          else:
              spec = pathlib.Path(f"specs/reels/{os.environ['SLUG']}.json")
              if spec.is_file():
                  try:
                      from build_match_reel import spec_sources
                      urls = sorted(spec_sources(
                          json.loads(spec.read_text(encoding="utf-8"))).values())
                      why = f"来自 {spec}"
                  except Exception as exc:            # noqa: BLE001
                      # **算不出键不该把整趟带崩**：spec 真有问题的话，下面
                      # 那几步会报一个说人话的错。这儿只退化成「不缓存」。
                      why = f"读不出源片地址（{type(exc).__name__}: {exc}）"
              else:
                  why = f"{spec} 还不存在"
          key = (hashlib.sha256("\n".join(urls).encode()).hexdigest()[:16]
                 if urls else "nourl")
          pathlib.Path(os.environ["RUNNER_TEMP"], "srckey").write_text(key)
          # **两种情况都要出声**：算出来了和没算出来，日志上必须分得开，
          # 否则「缓存没生效」和「生效了」长得一模一样。
          print(f"源片缓存键 {key}：{len(urls)} 条源片，{why}")
          PY
          echo "hash=$(cat "$RUNNER_TEMP/srckey")" >> "$GITHUB_OUTPUT"

      - name: 缓存源片（同一条片子只下一次）
        if: github.event.inputs.mode != 'push' && github.event.inputs.mode != 'narration' && github.event.inputs.mode != 'cookies'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tennislive-sources
          key: reel-src-${{ github.event.inputs.slug }}-${{ steps.srckey.outputs.hash }}
          restore-keys: reel-src-${{ github.event.inputs.slug }}-

      # TTS 缓存和源片缓存**形状不同**：源片按 URL hash 键，源不变键就不变，
      # 命中即完事；TTS 是内容寻址（`~/.cache/tennislive-tts/<内容hash>.mp3`），
      # 集合只会越跑越全。所以用**滚动键**（run_id 进 key）：每趟 restore-keys
      # 按 slug 前缀捞回上一趟攒下的全部音频，跑完把「旧 + 新增」一起存成新键。
      # 只改封面/字幕重渲时，旁白 text 没变 → 每段都命中内容 hash → 一分不重合成。
      # ⚠️ 只给真会合语音的两档（render / narration）。probe、cover、cookies
      # 一个字都不合成，恢复了也是空转；更贵的是**滚动键每趟都存一份新条目**
      # （run_id 进 key），白占 10 GB LRU 池，把 Chromium（150 MB）和抠图模型
      # （176 MB）往外挤——被挤掉的样子只是「今天 CI 怎么慢了点」。
      - name: 缓存 TTS（同文旁白跨趟不重合成）
        if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'narration'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tennislive-tts
          key: reel-tts-${{ github.event.inputs.slug }}-${{ github.run_id }}
          restore-keys: |
            reel-tts-${{ github.event.inputs.slug }}-

      - name: 算出目录
        id: paths
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          # **push 模式不能按「今天」算目录。** render/cover/probe/narration 都是
          # 当场生成新内容，目录理应是今天；但 push 推的是**已经渲好、可能是
          # 好几天前的成片**——账号所有者现在允许「渲完先审、审完再推」，
          # 中间隔的天数不确定。按今天拼目录会拼出一个根本不存在的路径
          # （eala-pegula-final 是 8/4 渲的，8/7 才推——`output/2026-08-07/...`
          # 那天什么都没写过），下游那道「push 模式先确认成片真的落地了」的闸
          # 会报「既不在这个 commit 里」，而真实原因是**问错日子了**。
          #
          # `git ls-tree` 不受稀疏检出影响（读的是 git 对象库，不是工作区），
          # 可以在还没 `sparse-checkout add` 之前就按 slug 把日期反查出来。
          # 同一个 slug 可能有多个日期目录（重渲过，比如 wong-brooksby 两次）
          # ——排序取最新的那个，和「查产物按最新那一份，别拿被顶替掉的当基准」
          # 一个道理。
          if [ "${{ github.event.inputs.mode }}" = "push" ]; then
            MATCH=$(git ls-tree -r HEAD --name-only \
              | grep -E "^output/[0-9]{4}-[0-9]{2}-[0-9]{2}/reel/${SLUG}/render\.json$" \
              | sort | tail -1)
            if [ -z "$MATCH" ]; then
              echo "::error::output/*/reel/$SLUG/render.json 在这个 commit 里一条都没有"
              echo "::error::——先跑一次 mode=render（push=false）出片，验完再用 mode=push 发。"
              exit 1
            fi
            OUT_DIR=$(dirname "$MATCH")
            OUT_DATE=$(echo "$OUT_DIR" | sed -E 's#^output/([0-9-]+)/.*#\1#')
            echo "[push] 按 slug 反查到 $OUT_DIR（这条片子渲的那天，不是今天）"
          else
            OUT_DATE=$(TZ=Asia/Shanghai date +%F)
            OUT_DIR="output/$OUT_DATE/reel/$SLUG"
          fi
          echo "outdir=$OUT_DIR" >> "$GITHUB_OUTPUT"
          echo "date=$OUT_DATE" >> "$GITHUB_OUTPUT"
          # checkout 把整个 output/ 挡在稀疏范围外了，这儿再把**自己那一格**
          # 加回来。三种模式都要：render/cover 要往里写，push 要读 mp4 的大小
          # （超 20 MB 就退 raw）。
          # ⚠️ 必须排在生成**之前**——`add` 会把 HEAD 上那一版先铺回工作区，
          # 反过来会拿旧内容盖掉刚生成的。
          git sparse-checkout add "$OUT_DIR"

      # push 模式的前提是**成片已经在这个 commit 里**。不在就当场报，别等到
      # 装完依赖、写完复制页、提交完之后才在推送那一步炸——「让失败发生在
      # 第 5 秒，不是第 90 秒」。
      # 查的是 `git ls-files`，不是 `test -f`：只在工作区里躺着的文件，推送
      # 发出去就是 404（同一个毛病在复制页上踩过两次）。
      # 成片有两条落脚点：≤95 MiB 进仓库，超了走 Release 附件（链接记在
      # render.json 的 `video_url` 里）。**两条都要认**——只认仓库那条的话，
      # 走了 Release 的片子会在这儿被判成「还没渲」，而它其实好好地在那儿。
      - name: push 模式先确认成片真的落地了
        if: github.event.inputs.mode == 'push'
        run: |
          OUTDIR="${{ steps.paths.outputs.outdir }}"
          REEL="$OUTDIR/${{ github.event.inputs.slug }}.mp4"
          # **重发要显式。** pushed.json 在仓库里就说明这条已经发过了——人工
          # 再跑一次 mode=push 会把同一条消息再发一遍，而微信消息收不回来。
          # ⚠️ 查 `git ls-files` 不查 `test -f`：稀疏检出下工作区那份不可靠
          # （「查 pushed.json 要用 ls-files」这条 auto_push_gate 早栽过），
          # 而且只在工作区、没提交的标记本来就不算数。
          if [ -n "$(git ls-files -- "$OUTDIR/pushed.json")" ]; then
            echo "::error::$OUTDIR/pushed.json 已在仓库里——这条已经推送过了。"
            echo "::error::确要重发，先把 pushed.json 从仓库删掉再来（让重发是一次显式的决定）。"
            exit 1
          fi
          URL=$(python -c "
          import json, pathlib, sys
          p = pathlib.Path('$OUTDIR/render.json')
          print(json.loads(p.read_text()).get('video_url', '') if p.is_file() else '')
          ")
          if [ -n "$URL" ]; then
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -L -r 0-99 "$URL" || echo 000)
            if [ "$CODE" != "206" ] && [ "$CODE" != "200" ]; then
              echo "::error::render.json 记着 $URL，但探不到（$CODE）"; exit 1
            fi
            echo "成片在 Release 上：$URL"
          elif [ -z "$(git ls-files -- "$REEL")" ]; then
            echo "::error::$REEL 既不在这个 commit 里，render.json 也没有 video_url。"
            echo "::error::先跑一次 mode=render（push=false），验完再用 mode=push 发。"
            git ls-files -- "$OUTDIR" || true
            exit 1
          else
            echo "成片在仓库里：$REEL（$(stat -c%s "$REEL") 字节）"
          fi
          test -f "${{ steps.paths.outputs.outdir }}/poster.jpg" || {
            echo "::error::海报不在——推送第一屏就是它，没有它只剩两个按钮"; exit 1; }

      # YouTube 对机房 IP 一律「Sign in to confirm you're not a bot」。第一道解法
      # 是 GVS PO token：yt-dlp 官方推荐的 bgutil provider 起在本机 4416，插件会
      # 自动去取，web/mweb/tv 三档就能过。**起不来不算失败**——起不来就退回 client
      # 梯子，让下载那一步去报真正的原因，别在这儿把整个 run 弄挂。
      - name: 起 PO token provider
        id: pot
        # push 模式不下任何东西——docker pull 那一分钟白等。
        # **narration 同理，而且更明显**：那道闸比的是「TTS 时长 vs spec 里的
        # 段长」，两样都不需要源片（`--check-narration` 的注释里写着「一个源片
        # 字节都不碰」）。它却一直在这儿等 PO token provider 起来——实测 11 秒，
        # 而整趟 narration 只有 1 分 37 秒。又一次「加新能力时新入口没继承前提」：
        # narration 这一档是后加的，这行 `if` 没跟着改。
        # cookies 模式同理：它只验 cookie 本身（不恢复源片缓存、不下源片），
        # PO token provider 对它是纯等待。
        # 判据在 `test_不下源片的模式不许等PO_token`。
        if: >-
          github.event.inputs.mode != 'push'
          && github.event.inputs.mode != 'narration'
          && github.event.inputs.mode != 'cookies'
        continue-on-error: true
        run: |
          pip install -q bgutil-ytdlp-pot-provider
          docker run --name bgutil-pot -d -p 4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider
          for i in $(seq 1 25); do
            if curl -sf http://127.0.0.1:4416/ping >/dev/null; then
              echo "provider 起来了（第 $i 次探活）"
              echo "up=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          echo "::warning::PO token provider 50 秒内没起来，退回 client 梯子"
          docker logs bgutil-pot 2>&1 | tail -20 || true

      # 配了这个 Secret 就带 cookie 下载，没配就只能靠上面的 PO token + client 梯子。
      - name: 落 cookies（配了 Secret 才有）
        id: cookies
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "path=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_OUTPUT"
            echo "已写入 cookies（$(wc -l < "$RUNNER_TEMP/yt-cookies.txt") 行）"
          else
            echo "::notice::未配置 YT_COOKIES_TXT，只能靠 player client 梯子碰运气"
          fi

      # **cookie 会过期，而过期时的表现和「没配」一模一样。** 所以要有一条随时能跑、
      # 不产生任何产物的验证：真下三秒媒体流。
      # 注意 `--skip-download` 那种探活是**假的**——不带 cookie 也拿得到标题和格式表，
      # 只有真去取媒体流才会撞上 "Sign in to confirm you're not a bot"。
      - name: cookies — 只验 YouTube 还能不能下
        if: github.event.inputs.mode == 'cookies'
        env:
          YT_COOKIES: ${{ steps.cookies.outputs.path }}
        run: |
          URL="${{ github.event.inputs.url }}"
          [ -n "$URL" ] || URL="https://www.youtube.com/watch?v=HyKTXynnI9c"
          ARGS=""
          if [ -n "$YT_COOKIES" ]; then
            ARGS="--cookies $YT_COOKIES"
            echo "带 cookie 试（$(wc -l < "$YT_COOKIES") 行）"
          else
            echo "::warning::没有 YT_COOKIES_TXT，这次只验 client 梯子（cookies 模式不起 PO token provider）"
          fi
          rm -rf "$RUNNER_TEMP/ytcheck" && mkdir -p "$RUNNER_TEMP/ytcheck"
          yt-dlp $ARGS --js-runtimes node --download-sections "*0-3" \
            --force-keyframes-at-cuts \
            -f "bv*[height<=720]+ba/b[height<=720]/b" \
            -o "$RUNNER_TEMP/ytcheck/probe.%(ext)s" "$URL" 2>&1 | tee "$RUNNER_TEMP/yt.log" || true
          FILE=$(ls -S "$RUNNER_TEMP/ytcheck" 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then
            # **别把「没下到」一律说成「cookie 过期」**——第一次跑就栽在这上面：
            # 真实原因是没装 yt-dlp-ejs，n challenge 解不了，只剩图片格式，
            # 而我的报错写着「cookie 可能过期了」，方向反了。所以按日志分因。
            if grep -q "not a bot\|Sign in to confirm" "$RUNNER_TEMP/yt.log"; then
              echo "::error::撞上了机器人验证——cookie 无效或已过期，重新导一份"
            elif grep -q "n challenge solving failed\|Only images are available" "$RUNNER_TEMP/yt.log"; then
              echo "::error::n challenge 解不了：yt-dlp 缺 yt-dlp-ejs 或没有 JS 运行时，和 cookie 无关"
            else
              echo "::error::没下到媒体流，原因见下面的格式表"
            fi
            yt-dlp $ARGS --js-runtimes node --list-formats "$URL" 2>&1 | tail -25 || true
            exit 1
          fi
          SIZE=$(stat -c%s "$RUNNER_TEMP/ytcheck/$FILE")
          echo "拿到 $FILE，$SIZE 字节"
          # 几百字节的「文件」多半是错误页，不是媒体
          [ "$SIZE" -gt 51200 ] || { echo "::error::文件只有 $SIZE 字节，不是媒体流"; exit 1; }
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 \
            "$RUNNER_TEMP/ytcheck/$FILE"
          echo "YouTube 下载可用。"

      - name: probe — 下载 + 缩略图墙
        if: github.event.inputs.mode == 'probe'
        env:
          TENNISLIVE_SOURCE_CACHE: ~/.cache/tennislive-sources
          YT_COOKIES: ${{ steps.cookies.outputs.path }}
          YT_POT_PROVIDER: ${{ steps.pot.outputs.up }}
        run: |
          python tools/build_match_reel.py probe \
            --url "${{ github.event.inputs.url }}" \
            --every "${{ github.event.inputs.every }}" \
            --from "${{ github.event.inputs.clip_from }}" \
            --to "${{ github.event.inputs.clip_to }}" \
            --scorebox "${{ github.event.inputs.scorebox }}" \
            --outdir "${{ steps.paths.outputs.outdir }}"
          ls -la "${{ steps.paths.outputs.outdir }}"

      # 顺便把封面人物的候选帧也挑出来——**但只在 `cutout_candidates=true` 时**。
      # 源片只在 runner 上有——沙箱下不动 YouTube，所以这一步不在这儿做，
      # 就只能拿 2 秒一格的缩略图墙用肉眼找正脸，而那正是 `pick_cover_frames.py`
      # 要替掉的活。
      # 挑帧判据（账号所有者定的）：正脸或稍微侧脸、上半身直立、表情读得出。
      # **挑完仍然要人打开看**：谁是谁、表情对不对题机器判不了，所以这里只出
      # 候选墙，不自动写进 spec。
      # 挑不出来**不算失败**（有些集锦通篇没有近景）——`|| true` 让它继续，
      # 缩略图墙那条老路还在。
      #
      # ⚠️ 默认不跑了。这一步找的是 `versus.top/bottom` 抠图人物（`cutout` 版式）
      # 用的候选，不是 `cover.portrait`——后者 2026-08-16 起硬性要求官方高清
      # 实拍、不许再抽帧。而现在几乎每条片子都是 `solo` 版式（量过：最近 30 条
      # 全是，上一次真用它挑出候选写进 spec 是 2026-08-19 的 `zhang-li`），
      # 所以这 71 秒常规就是白烧的。真要用 `cutout` 版式再显式开
      # `cutout_candidates: true`。
      - name: probe — 封面候选帧
        if: github.event.inputs.mode == 'probe' && github.event.inputs.cutout_candidates == 'true'
        run: |
          OUT="${{ steps.paths.outputs.outdir }}"
          python tools/pick_cover_frames.py \
            --video "$OUT/source.mp4" \
            --out "$OUT/cover_candidates" \
            --top 12 || true
          ls -la "$OUT/cover_candidates" 2>/dev/null || true

      # 逐分 + 比分板机械对齐备料（配音不脱节的命门）。probe 出完 contact_*.jpg
      # 之后：fetch_match_pbp 拉 WTA 逐分 + MiniMax 读比分板。两步都可选、都降级
      # ——对齐是「给 segments 加料」不是硬闸，没料就退回下面 assemble 里 DeepSeek
      # 读字幕那条老路。ATP 场没有 WTA 逐分通路，自然降级（prepare_alignment 出声）。
      - name: probe — 逐分+比分板对齐备料
        if: github.event.inputs.mode == 'probe' && github.event.inputs.home != ''
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          OUT="${{ steps.paths.outputs.outdir }}"
          PYTHONPATH=src python tools/prepare_alignment.py \
            --home "${{ github.event.inputs.home }}" \
            --away "${{ github.event.inputs.away }}" \
            --outdir "$OUT"

      # probe 出完缩略图墙 + captions + 切点之后，顺手把 spec 草稿也备好——这是
      # 「写 spec」自动化的最后一环：stats/狠数据/转折局/文案/窗口/封面一次跑齐，
      # 人只终审。只在编排器传了 home/away 时才跑（手动 probe 不带这些，跳过出声）。
      # 若上面机械对齐备出了 pbp.json + scoreboard.json，就传进去——assemble 会用
      # 逐分+比分板对齐出 segments（比读字幕准）；没备出就退回读字幕。
      - name: probe — 自动备料写 spec 草稿
        if: github.event.inputs.mode == 'probe' && github.event.inputs.home != ''
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          OUT="${{ steps.paths.outputs.outdir }}"
          SLUG="${{ github.event.inputs.slug }}"
          ALIGN_ARGS=""
          if [ -f "$OUT/pbp.json" ] && [ -f "$OUT/scoreboard.json" ]; then
            ALIGN_ARGS="--pbp $OUT/pbp.json --scoreboard $OUT/scoreboard.json"
          fi
          PYTHONPATH=src python tools/assemble_spec.py \
            --slug "$SLUG" \
            --home "${{ github.event.inputs.home }}" \
            --away "${{ github.event.inputs.away }}" \
            --event "${{ github.event.inputs.event }}" \
            --year "${{ github.event.inputs.year }}" \
            --captions "$OUT/captions.txt" \
            --cuts "$OUT/probe.json" \
            --source-url "${{ github.event.inputs.url }}" \
            --cover \
            $ALIGN_ARGS \
            --write

      # 只下源片 + 出海报就停：不分段、不合语音、不编码。改一档 scale / cx /
      # box 想看效果走这条，别再付一趟完整 render。实测整趟 3 分 19 秒，
      # 而且只提交一张 0.3 MB 的海报。
      # 只合语音、只报哪几段旁白写长了。**不下源片、不渲染、不写产物**——
      # 已经发过的片子拿它查，不会多出一个成片。跑一趟 render 去问同一个问题，
      # 在通过的情况下会顺手渲出一条新成片并提交。
      - name: narration — 只查旁白装不装得下
        if: github.event.inputs.mode == 'narration'
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          SPEC="specs/reels/${{ github.event.inputs.slug }}.json"
          test -f "$SPEC" || { echo "::error::找不到 $SPEC"; exit 1; }
          python tools/build_match_reel.py render --check-narration \
            --spec "$SPEC" \
            --voice "${{ github.event.inputs.voice }}" \
            --rate "${{ github.event.inputs.rate }}" \
            --outdir "${{ steps.paths.outputs.outdir }}"

      - name: cover — 只出封面海报
        if: github.event.inputs.mode == 'cover'
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          TENNISLIVE_SOURCE_CACHE: ~/.cache/tennislive-sources
          YT_COOKIES: ${{ steps.cookies.outputs.path }}
          YT_POT_PROVIDER: ${{ steps.pot.outputs.up }}
        run: |
          SPEC="specs/reels/${{ github.event.inputs.slug }}.json"
          test -f "$SPEC" || { echo "::error::找不到 $SPEC"; exit 1; }
          python tools/build_match_reel.py render --cover-only \
            --spec "$SPEC" \
            --outdir "${{ steps.paths.outputs.outdir }}"
          ls -la "${{ steps.paths.outputs.outdir }}"

      - name: render — 出成片
        if: github.event.inputs.mode == 'render'
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          TENNISLIVE_SOURCE_CACHE: ~/.cache/tennislive-sources
          YT_COOKIES: ${{ steps.cookies.outputs.path }}
          YT_POT_PROVIDER: ${{ steps.pot.outputs.up }}
        run: |
          SPEC="specs/reels/${{ github.event.inputs.slug }}.json"
          OUTDIR="${{ steps.paths.outputs.outdir }}"
          SLUG="${{ github.event.inputs.slug }}"
          test -f "$SPEC" || { echo "::error::找不到 $SPEC"; exit 1; }
          # 600 秒是性能目标，不是内容闸。超线照样做完、照样过 L2 和发布；
          # `finish` 会在产物与 job summary 留 FAIL + warning，供后续定点修复。
          RENDER_STARTED=$(date -u +%FT%TZ)
          python tools/build_match_reel.py render \
            --spec "$SPEC" \
            --voice "${{ github.event.inputs.voice }}" \
            --rate "${{ github.event.inputs.rate }}" \
            --outdir "$OUTDIR"
          python tools/video_sla.py finish \
            --received-at "${{ steps.production_clock.outputs.received_at }}" \
            --render-started-at "$RENDER_STARTED" \
            --artifact "$OUTDIR/$SLUG.mp4" \
            --metadata "$OUTDIR/render.json" \
            --pipeline match-reel --slug "$SLUG" \
            --summary "$GITHUB_STEP_SUMMARY"
          ls -la "$OUTDIR"

      # 复制页**必须写在提交之前**。它由 GitHub Pages 提供，没进仓库就是 404。
      # 之前这一句藏在推送那一步里，而推送排在提交之后——文件只活在 runner 的
      # 工作区，从来没被 commit 过：run 30342567879 推送步骤 success，
      # 链接打开 404。**又一次「查信号不查产物」**。
      # **不挂在 push=true 上。** 分支上 `push=false` 渲的片子也要把复制页
      # 带进 PR——它跟着成片一起合进 main 之后，Pages 早就发布好了，
      # 后面那趟 `mode=push` 的 `wait_for_copy_page` 一次就中。挂在
      # push=true 上的话，复制页只能在推送那一刻才第一次进仓库，Pages
      # 从零开始发布，推送就得原地等几分钟（run 30624808733：连续 12 次
      # HTTP 404，第 13 次才中，240 秒纯空转）。
      # 写它几乎不要钱（一个 HTML），却决定后面那趟推送要不要空等。
      - name: 写复制页（必须排在提交之前）
        if: github.event.inputs.mode == 'render' || github.event.inputs.mode == 'push'
        run: |
          COPY="specs/reels/${{ github.event.inputs.slug }}.xhs.txt"
          test -f "$COPY" || { echo "::error::找不到 $COPY"; exit 1; }
          python tools/push_reel.py --stage page \
            --outdir "${{ steps.paths.outputs.outdir }}" \
            --matchup "${{ github.event.inputs.matchup }}" \
            --score "${{ github.event.inputs.score }}" \
            --event "${{ github.event.inputs.event }}" \
            --summary "${{ github.event.inputs.summary }}" \
            --copy "$COPY"

      # **查产物，不查信号。** 这个脚本一直在仓库里，`grep -rn check_reel_landed
      # .github/` 却是零命中——写好了一次都没跑过。补跑九条已发成片，它自己
      # 就报出了两个真缺陷：「音轨比画面短」×7、「38 秒数字静音」×1。
      # 拦在提交之前：进了 main，push 那条路就会把它发到微信，而消息收不回来。
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: 查成片本身合不合格
        if: github.event.inputs.mode == 'render'
        run: |
          python tools/check_reel_landed.py \
            --slug "${{ github.event.inputs.slug }}" \
            --film "${{ steps.paths.outputs.outdir }}/${{ github.event.inputs.slug }}.mp4"

      # **成片一律走 GitHub Release，不进 git。**
      #
      # 账号所有者定过两层。2026-08-02：「我的基础要求是保证内容和画面质量，
      # 文件多大都没关系」「不要砍片长」——git 那条 100 MiB 服务端硬拒
      # （104 MiB 那条 push 被拒，五分钟白跑）的答案是换路，不是砍片长。
      # 2026-08-13：「当前代码库太大了，好多资源是不是不用放在这里代码库里」。
      #
      # 三条路比过（这段教训不过期）：
      #   Git LFS       免费额度 1 GB 存储 + **1 GB/月流量**，一条片子几十上百 MB，
      #                 一次推送很多人同时下载就能把月流量打光（超出计费）；
      #                 而且 `raw.githubusercontent.com` 对 LFS 文件返回的是
      #                 **指针文本不是视频**，微信里那个 ▶ 按钮直接坏掉
      #   外部对象存储   要另一套密钥和账单，为一条片子不值当
      #   **Release 附件**  单个 2 GB，公开仓库下载不计流量额度，链接稳定
      #                 （302 到 release-assets.githubusercontent.com，和
      #                 >20 MB 时走的 raw 是同一个量级的链路）
      #
      # **原来这儿有道 95 MiB 的体积闸，2026-08-13 拆掉了。** 那道闸只把超过
      # git 硬拒的片子送去 Release，95 以下照旧进仓库——而成片普遍 30~80 MiB，
      # **从来够不着那道门槛**，于是几乎每条都进了 git：量出来 .git 已 6.0 GB，
      # 其中 4.93 GB 是 mp4 blob（130 个），仓库每月胖一两个 GB。一个几乎
      # 从来走不到的兜底，正是「兜底出事的时候不吭声」的形状。历史片子的
      # ▶ 链接钉在 main 的文件路径上（raw.githubusercontent.com/…/main/…），
      # 已发的消息收不回来，所以**存量 ≤95 MiB 的成片留在 git 一个不动，
      # 只改增量**：从这天起成片不分体积一律发 Release。判据在
      # `test_成片一律走Release不进git`。
      #
      # 发完 Release 就**把本地那份删掉**，让下面的清理和提交步骤根本看不见它；
      # 链接写进 render.json，`push_reel.py` 优先读它。
      - name: 成片发到 Release（不进 git）
        if: github.event.inputs.mode == 'render'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUTDIR="${{ steps.paths.outputs.outdir }}"
          SLUG="${{ github.event.inputs.slug }}"
          REEL="$OUTDIR/$SLUG.mp4"
          SZ=$(stat -c%s "$REEL")
          TAG="reel-$SLUG"
          echo "成片 $((SZ/1048576)) MiB —— 发到 Release $TAG"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "赛场之上 · $SLUG" \
                 --notes "竖版成片。成片一律走 Release 附件，不进 git。"
          # **传附件要重试。** 2026-08-13 李娜那条：render 跑了 14 分 27 秒、
          # 质检也过了，就死在这一行——
          #     HTTP 500 (https://api.github.com/…/releases/assets/512914137)
          # `--clobber` 是「先删旧的再传」，而删那一下撞上 GitHub 自己的 5xx。
          # 一次瞬时服务端错误报销掉的是整趟 render，和 Azure 合语音那条
          # 「一次 429 报销掉五分钟」是同一个毛病（见 `azure_tts.synthesize`）。
          # 重发是安全的：`--clobber` 幂等，删到一半也是再传一遍就好。
          # ⚠️ 循环里不许写 `[ A ] && break`——`bash -e` 下 AND 列表整条为假会
          # 直接把这一步杀掉（下面探活那段的注释记的是同一个坑）。一律用 if。
          UPLOADED=0
          for i in 1 2 3 4; do
            if gh release upload "$TAG" "$REEL" --clobber; then UPLOADED=1; break; fi
            if [ "$i" != 4 ]; then
              WAIT=$((5 * i * i))
              echo "第 $i 次传 Release 附件没成，${WAIT}s 后重试"
              sleep "$WAIT"
            fi
          done
          [ "$UPLOADED" = 1 ] || {
            echo "::error::Release 附件传了 4 次都没上去"; exit 1; }
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$SLUG.mp4"
          # **传完要自己探一次**：Release 的 CDN 有几秒的传播延迟，探不到就别写
          # 链接——写了等于把一个 404 发到微信，而消息发出去收不回来。
          # ⚠️ 循环体最后一句不许写成 `[ A ] || [ B ] && break`：整条 AND-OR
          # 列表为假时 `bash -e` 会**直接把这一步杀掉**，看起来像「探活失败」，
          # 其实是第一次没中就退出了。用 if。
          for i in 1 2 3 4 5 6 7 8; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -L -r 0-99 "$URL" || echo 000)
            if [ "$CODE" = "206" ] || [ "$CODE" = "200" ]; then break; fi
            echo "第 $i 次探活 $CODE，5s 后重试"
            sleep 5
          done
          [ "$CODE" = "206" ] || [ "$CODE" = "200" ] || {
            echo "::error::Release 附件 $URL 探不到（$CODE）"; exit 1; }
          echo "Release 附件可取：$URL"
          python - "$OUTDIR/render.json" "$URL" "$SZ" <<'PY'
          import json, sys
          from pathlib import Path
          path, url, size = Path(sys.argv[1]), sys.argv[2], int(sys.argv[3])
          data = json.loads(path.read_text(encoding="utf-8"))
          data["video_url"] = url
          data["video_bytes"] = size
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                          encoding="utf-8")
          print("render.json 记下 video_url")
          PY
          rm -f "$REEL"

      # ⚠️ **mode=push 不许走这一步。** push 那条路一个中间物都不产（复制页 +
      # 发微信而已），而它的 OUTDIR 是按 slug 反查出来的**历史日期目录**——
      # 2026-08-13 之前发的片子成片还在 git 里（存量不动，只改增量），稀疏检出
      # 把那格 add 回来之后，末尾那个**递归**的 8 MB 兜底会把这些合法的存量
      # mp4 当成「漏网的大文件」`exit 1`，在写复制页之前就把唯一受支持的
      # 手动推送路径杀掉。清理是给 probe/cover/render 这几条**产中间物**的路的。
      - name: 丢掉不进仓库的中间物
        if: github.event.inputs.mode != 'narration' && github.event.inputs.mode != 'cookies' && github.event.inputs.mode != 'push'
        run: |
          OUTDIR="${{ steps.paths.outputs.outdir }}"
          # 源片 50MB 上下，逐帧图几百张——都不进仓库，只留缩略图墙和成片。
          # _cover.html / poster.html 是封面那一屏的渲染输入，图以 data URI 内嵌，
          # 单个 12 MB，之前漏在清单外，每出一版就往仓库里塞一份。
          # **poster.jpg 要留下**：推送正文的第一屏就是它，删了推送里就没有图。
          # **`source*` 一整片删掉，不要逐个列名字。** 这个坑连着栽了四次，
          # 每次都是同一个形状：源片换了个名字，就从清单里溜过去了。
          #   1. `source.fNNN.mp4.part`（yt-dlp 分轨下载的半成品，probe wang-pareja）
          #   2. 同一个漏在 eala-zheng、potapova-venus 上各中一次
          #   3. 分轨的 `.webm` 和 yt-dlp 的续传记录 `.ytdl`
          #   4. **多源之后叫 `source_r1.mp4` / `source_iv.mp4`**——加多源支持时
          #      改了下载的落盘名，没改这里（run 30603686748，三条源片 250 MB
          #      全被兜底拦下）。又一次「加新能力就要同时改三处」。
          # 同理 `_versus_*` **不带后缀**：原来写死 `.jpg`，而抽帧抠图落的是
          # `_versus_cut_top.png`。现在它只剩抠之前那张原帧（`_versus_raw_*`）。
          #
          # ⚠️ **`cover_src/` 是产物，不是中间物——别顺手加进这串 rm。**
          # 抓下来的帧和抠好的人存在那儿并**跟着提交**，为的是让封面返工能在
          # 沙箱里本地渲（`tools/render_cover_local.py`，实测 6.9 秒），
          # 不必为一行 CSS 上一趟 runner。量出来的账：shang-rublev 那 98 分钟里
          # 有 31 分钟全花在封面上，而三趟里帧一次都没变。
          # 代价是每条片子多 0.1~3 MB（同目录下的成片是 40~95 MB）。
          # 这是**认领过的取舍**，判据在 `test_封面素材要留在仓库里`。
          # 下面 `rm -f "$OUTDIR"/...` 都不带 `-r` 且只作用在根上，碰不到它；
          # 而末尾那个「超过 8 MB 就报错」的兜底是**递归**的，所以它仍然管得住
          # 「有人往 cover_src 里塞了个大文件」。
          # 封面候选帧只留候选墙和 json，12 张整帧不进仓库：q92 的 JPEG 单张
          # 132 KB、12 张 1.6 MB（存 PNG 是 9 MB），**两种都过得了「单个 8 MB」
          # 那道兜底**，却每探一次就加一份。
          # 判据在 test_中间物一个都不许进仓库：按 glob 语义验覆盖，不验字面名字。
          rm -f "$OUTDIR"/source* "$OUTDIR"/*.part "$OUTDIR"/*.ytdl \
            "$OUTDIR"/voice_*.mp3 "$OUTDIR"/_cover.jpg "$OUTDIR"/_cover.html \
            "$OUTDIR"/poster.html "$OUTDIR"/_versus_* "$OUTDIR"/_subs* \
            "$OUTDIR"/cover_candidates/cand_*
          rm -rf "$OUTDIR"/frames
          ls -la "$OUTDIR" || true

          # 兜底：上面那串模式挡住的是**已知**的中间物，挡不住下一个没见过的。
          # 所以清完再量一次，超过 8 MB 的一律当成漏网并报错——宁可这一步红，
          # 也别再往仓库里塞一个没人发现的大文件（推分支吃 413 就是被 pack
          # 体积撑爆的）。
          #
          # **成片走不到这里。** 2026-08-13 起成片不分体积一律在上面那一步发
          # Release 附件并当场 rm（来路见那一步的注释：.git 6.0 GB 里 4.93 GB
          # 是 mp4 blob），所以这个兜底不再给成片留白名单——原来那行
          # 「basename 是成片名就 continue」等于给「Release 步骤被跳过、成片
          # 漏进提交」开了个静默的口子。仍然出现在这儿的成片就是漏网，该红。
          # 「成片按名字放行，不按体积放行」那段教训（20 MB 上限是从解说片
          # 搬来的、体积由时长决定，写死字节数等于给片长设暗上限）针对的是
          # 「成片还进 git」的时代，判据在 test_成片一律走Release不进git。
          #
          # ⚠️ 这儿原来记着「实测 3315 / 3517 / 3610 kb/s」，那是 **9:16 时代**的数。
          # 换成 3:4 之后取景窗从 608px 宽变成 810px，码率高了三成，而这句注释没跟着改，
          # 于是 2026-08-02 我照着它把片子排到 3 分 04 秒（按旧数算才 78 MB），
          # 渲出来 104 MiB，被当年提交那一步的 100 MiB 硬上限拦下，五分钟白跑。
          # 当年的实测（都是从仓库里的成片量的，估体积仍按这套数）：
          #   eala-svitolina 81.9 MiB / 158.0s = 4348 kb/s
          #   wong-gea       80.2 MiB / 155.8s = 4318 kb/s
          #   eala-osaka 初版 104.0 MiB / 185.2s = 4712 kb/s   ← 进不了仓库
          #   eala-osaka 剪短后 94.5 MiB / 158.8s = 4990 kb/s（剪短之后码率反而更高：
          #     砍掉的是全片最静的那一段，留下的全是高动量的关键分）
          # **片长不设上限**（账号所有者：「不要砍片长」「文件多大都没关系」）。
          # `load_spec` 在写 spec 那一刻就把估算打进日志。
          BAD=0
          while IFS= read -r f; do
            echo "::error::清理之后仍有大文件进仓库：$f（$(stat -c%s "$f") 字节）"
            BAD=1
          done < <(find "$OUTDIR" -type f -size +8M)
          [ "$BAD" = 0 ] || exit 1

      # **`always()` 不能省。** `if:` 不含状态函数时 GitHub 隐式和上
      # `success()`，于是上一步「丢掉不进仓库的中间物」末尾那个体积兜底一
      # exit 1（栽过四次），**成片明明已经渲完了，却既不上传也不提交**。
      # ⚠️ 位置不许往前挪：清理是先 rm 再检查，挪到前面会把源片一起传。
      - name: 上传 artifact
        if: always() && github.event.inputs.mode != 'narration' && github.event.inputs.mode != 'cookies'
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.event.inputs.slug }}-${{ github.run_number }}
          path: ${{ steps.paths.outputs.outdir }}
          retention-days: 14

      # probe 失败（下不动源片）时，把 slug 从编排器 state 里摘掉——否则它已被
      # 标记「已 dispatch」，下次 cron 跳过它、永不重试。摘掉之后下次 cron 会重新
      # 探测 + dispatch，这就是 probe 失败的自愈。
      # ⚠️ 只在 probe 模式失败时摘：render 失败不该摘（spec 已经写好了，重来会
      # 重渲而不是重探），而且 render 失败要人去修 spec 或源片，不是自动重试。
      - name: probe 失败摘 state（自愈）
        if: failure() && github.event.inputs.mode == 'probe'
        run: |
          # ⚠️ `SLUG=…` 只是个 shell 变量，**不进子进程的环境**——底下那段 python 里
          # `os.environ["SLUG"]` 会 KeyError。它挂在 `failure()` 上，平时根本走不到，
          # 所以从写下来那天起一直没出声；2026-08-18 run 32086089179 第一次真走到
          # （probe 死在装 ffmpeg）就炸了，**自愈那一步自己也失败了**。
          # 要么 export、要么走 `env:`——这里用 export。
          export SLUG="${{ github.event.inputs.slug }}"
          python - <<'PY'
          import json, pathlib, os
          p = pathlib.Path("data/orchestration_state.json")
          if not p.is_file():
              print("没有 orchestration_state.json，无需摘")
              raise SystemExit(0)
          state = json.loads(p.read_text(encoding="utf-8"))
          disp = state.get("dispatched", {})
          if os.environ["SLUG"] in disp:
              del disp[os.environ["SLUG"]]
              p.write_text(json.dumps(state, ensure_ascii=False, indent=2),
                           encoding="utf-8")
              print(f"已把 {os.environ['SLUG']} 从 orchestration_state 摘掉，"
                    "下次 cron 会重新探测 + dispatch")
          else:
              print(f"{os.environ['SLUG']} 不在 state 里，无需摘")
          PY
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add data/orchestration_state.json
          if git diff --cached --quiet; then
            echo "state 没有变化，不提交"
          else
            git commit -m "orchestrate: probe 失败，摘掉 $SLUG 的 dispatch 标记"
            git push origin "HEAD:${{ github.ref_name }}" || echo "::warning::state 摘除提交失败（不影响本次失败告警）"
          fi

      - name: 提交产物
        if: github.event.inputs.mode != 'narration' && github.event.inputs.mode != 'cookies'
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          OUTDIR="${{ steps.paths.outputs.outdir }}"
          # 只 add 本次的目录：一起 add output/ 会把别的选题的成片一并重放，
          # 并行跑的时候会来回覆盖（explainer 那条线上踩过）
          git add "$OUTDIR"
          # 自动备料的草稿 spec 也要落库——assemble_spec --write 写到
          # specs/reels/pending/（⚠️ 不是 specs/reels/ 正下方：那儿被非递归
          # glob("*.json") 的判据扫着，一份草稿曾把 main CI 红过两小时，见
          # specs/reels/pending/README.md），不在 $OUTDIR 里，不加这步终审在
          # git 里根本看不到草稿。只 add 本 slug 的草稿，别把别人的一起带上；
          # 文件不存在（没备料/已提升成正式 spec）就跳过。
          if [ -f "specs/reels/pending/${{ github.event.inputs.slug }}.draft.json" ]; then
            git add "specs/reels/pending/${{ github.event.inputs.slug }}.draft.json"
          fi
          # assemble_spec --cover 把 WTA 官方赛后稿头图写到 assets/reel/，不在
          # OUTDIR 或 pending/ 里。漏 add 会让草稿引用一张 runner 消失后不存在的图。
          COVER_ASSET="assets/reel/${{ github.event.inputs.slug }}-cover.jpg"
          if [ -f "$COVER_ASSET" ]; then
            git add "$COVER_ASSET"
          fi
          if git diff --cached --quiet; then
            echo "没有变化"
            exit 0
          fi
          BRANCH="${{ github.ref_name }}"
          MSG="reel: ${{ github.event.inputs.mode }} ${{ github.event.inputs.slug }}"
          python tools/check_staged_file_sizes.py
          git commit -m "$MSG"
          # 多条不同 slug 可以并行落库。push 被别的 run 抢先后，只把本条
          # OUTDIR 重放到最新分支；普通 rebase 遇到同名二进制文件会冲突，
          # 而 `break` 版循环在重试耗尽后还会错误地继续微信推送。
          for attempt in $(seq 1 10); do
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "push 被拒（第 $attempt 次），把本次提交动过的文件重放到最新的 $BRANCH 上"
            git fetch origin "$BRANCH"
            git branch -f rendered HEAD
            git reset --hard "origin/$BRANCH"
            # **重放按「这次提交真正改了什么」算，不按写死的目录算。**
            # 老写法 `rm -rf $OUTDIR && git checkout rendered -- $OUTDIR` 有两个洞：
            # ① 只重放 OUTDIR——同一个提交里 OUTDIR 之外的文件（比如 probe
            #    自动备料写的 specs/reels/<slug>.draft.json）被 reset --hard
            #    抹掉之后**静默丢失**；草稿哪天挪个位置，这里还得跟着改，
            #    而漏改不吭声。
            # ② 「重放只加不减」的老毛病靠 rm -rf 补（run 30727483963：走了
            #    Release、已经 rm 掉的旧成片被 reset --hard 救活）——而 rm 的
            #    范围同样写死在 OUTDIR，跟 ① 一个形状。
            # 两条 diff 把这次提交动过的每一个文件原样搬回来：
            #   小写 d ＝ 排除删除（新增/修改的那些），checkout 恢复内容并进索引；
            #   大写 D ＝ 该提交删掉的那些（走了 Release 的旧成片），git rm 把
            #   reset --hard 刚救活的那份再删掉并进索引。--sparse：稀疏检出下
            #   照样能动索引；--ignore-unmatch：新 origin 上已经没有它也不红。
            # 循环每一轮都重新 `git branch -f rendered HEAD`，所以
            # `rendered^..rendered` 永远正好是本次这一个提交。
            git diff --name-only -z --diff-filter=d rendered^ rendered \
              | xargs -0 -r git checkout rendered --
            git diff --name-only -z --diff-filter=D rendered^ rendered \
              | xargs -0 -r git rm -q -f --ignore-unmatch --sparse --
            python tools/check_staged_file_sizes.py
            git diff --cached --quiet || git commit -m "$MSG"
            sleep $((attempt * 5 + RANDOM % 10))
          done
          echo "::error::连续 10 次推送失败；成片仍在 artifact 中，未发送微信死链"
          exit 1

      # push=true 的 render 不在本 job 里直接 POST：那会让 job 级发布锁把多场
      # render 也全部串行。到这里代表 dry-run、成片 L2、Release 探活、提交全过，
      # 再派一趟只做发布的 mode=push；这些轻量 run 在 match-reel-publish 组串行。
      - name: render 质检落库后自动派发微信推送
        if: github.event.inputs.mode == 'render' && github.event.inputs.push == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SENT=0
          for attempt in 1 2 3; do
            if gh workflow run match-reel.yml --ref main \
              -f mode=push \
              -f slug="${{ github.event.inputs.slug }}" \
              -f push=true; then
              SENT=1
              break
            fi
            echo "第 $attempt 次派发 push-only 没成，稍后重试"
            sleep $((attempt * 5))
          done
          [ "$SENT" = 1 ] || {
            echo "::error::成片已质检并落库，但 push-only 连续三次派发失败"; exit 1; }

      # 推送**必须排在提交之后**——正文里的成片链接和复制页链接都指向仓库里的
      # 文件，还没提交上去就是 404。这一段的注释一直写着「推送是最后一步：
      # 前面提交完成片才有可下载的链接」，而它本人一直排在提交**前面**：
      # `wait_for_images` 探了二十次全失败，整条推送被取消（run 30339377013）。
      # 之所以一直没被发现，是因为这一步以前从没真的跑成功过。
      #
      # 「触发成功」不算推了，**这一步 success 才算**。
      - name: 推送前预占持久发布账本
        id: publish_reserve
        if: github.event.inputs.push == 'true' && github.event.inputs.mode == 'push'
        run: |
          python tools/auto_push_gate.py \
            --reserve "${{ steps.paths.outputs.outdir }}" \
            --run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --now "$(date -u +%FT%TZ)"
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add --sparse "data/reel_publish_ledger/${{ github.event.inputs.slug }}.json"
          git commit -m "reel: 预占推送 ${{ github.event.inputs.slug }}"
          for attempt in $(seq 1 5); do
            if git push origin main; then exit 0; fi
            git pull --rebase origin main || { git rebase --abort || true; }
            sleep $((attempt * 3 + RANDOM % 5))
          done
          echo "::error::发送前账本没有落进 main，不允许发送"; exit 1

      - name: 推送到微信（可选）
        if: github.event.inputs.push == 'true' && github.event.inputs.mode == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          # **钉 commit，别停在 @main。** 同一条片子重渲，海报路径一模一样，
          # 而微信的图片缓存按**路径**算——URL 停在 @main 的话第二轮推出去的
          # 还是第一轮那张海报，**而且不吭声**。解说片一直有这一行，reel 漏了。
          TENNISLIVE_ASSET_REV: ${{ github.sha }}
        run: |
          COPY="specs/reels/${{ github.event.inputs.slug }}.xhs.txt"
          test -f "$COPY" || { echo "::error::找不到 $COPY"; exit 1; }
          python tools/push_reel.py \
            --outdir "${{ steps.paths.outputs.outdir }}" \
            --matchup "${{ github.event.inputs.matchup }}" \
            --score "${{ github.event.inputs.score }}" \
            --event "${{ github.event.inputs.event }}" \
            --summary "${{ github.event.inputs.summary }}" \
            --lead "${{ github.event.inputs.push_lead }}" \
            --copy "$COPY"

      # ⚠️ **手动推的片子也要记标记，否则自动闸会把它当成「没发过」再发一次。**
      #
      # 来路：2026-08-16 补发 `bucsa-chwalinska` / `eala-ruse`（那两条被
      # 「一趟最多一条」拦下之后在仓库里躺了 13 小时）时发现——`auto_push_gate`
      # 判「发过了」的**唯一**依据是 `<outdir>/pushed.json` 在仓库里，而写它的
      # 步骤只在 `auto-push-reel.yml` 里有，这条手动路径全文一个字都没提过它。
      # 于是**凡是走手动 `mode=push` 发出去的片子，在自动闸眼里永远是「没发过」**：
      # 哪天它的 `render.json` 再被合进 main 一次，就会再发一条微信，而消息
      # 收不回来。当天量了一遍，`push.auto:true` 且没有标记的有 9 条。
      #
      # ⚠️⚠️ **必须排在推送之后，不许提前。** 反过来的话，推送失败会留下一个
      # 「已经发过」的假标记，这条片子从此再也发不出去，**而且不吭声**——
      # `auto_push_gate` 的注释和 CLAUDE.md 都专门写过这个顺序。
      # 所以这一步不带 `always()`：上一步红了就不该记。
      - name: 记下已经推送过
        if: github.event.inputs.push == 'true' && github.event.inputs.mode == 'push'
        run: |
          python tools/auto_push_gate.py \
            --record "${{ steps.paths.outputs.outdir }}" \
            --run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --now "$(date -u +%FT%TZ)"
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add --sparse "${{ steps.paths.outputs.outdir }}" \
            "data/reel_publish_ledger/${{ github.event.inputs.slug }}.json"
          python tools/check_staged_file_sizes.py
          # ⚠️ 只放过「没有变化」这一种。原来是 `git commit … || exit 0`——
          # 它把**一切** commit 失败（钩子炸了、磁盘满、身份没配上）都吞成绿，
          # 而这一步的失败意味着「微信已发、标记没落库」，自动闸之后会把这条
          # 当「没发过」再发一遍。
          if git diff --cached --quiet; then
            echo "标记没有变化（已经记过），不用再提交"; exit 0
          fi
          git commit -m "reel: ${{ github.event.inputs.slug }} 已推送"
          # ⚠️ 撞车重试不能省：这一步排在微信**已经发出去**之后，单推一次撞上
          # 并行提交就红，红完标记没落库——下一次 render.json 被合并就是一条
          # 重复的微信消息。pushed.json 是纯文本，rebase 必然干净（和「提交
          # 产物」那个循环不同：那边有二进制要重放，这边没有）。
          git pull --rebase origin main
          for attempt in $(seq 1 5); do
            if git push origin main; then exit 0; fi
            echo "push 被拒（第 $attempt 次），rebase 之后重试"
            git pull --rebase origin main
            sleep $((attempt * 5 + RANDOM % 10))
          done
          echo "::error::「已推送」标记连续 5 次推不上去。微信**已经发出去了**，"
          echo "::error::标记必须补进仓库（tools/auto_push_gate.py --record 后提交），"
          echo "::error::否则自动闸会把这条片子当成「没发过」再发一次。"
          exit 1

      - name: 已预占后失败则标记推送状态不明
        if: failure() && steps.publish_reserve.outcome == 'success'
        continue-on-error: true
        run: |
          python tools/auto_push_gate.py \
            --uncertain "${{ steps.paths.outputs.outdir }}" \
            --run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --now "$(date -u +%FT%TZ)"
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add --sparse "data/reel_publish_ledger/${{ github.event.inputs.slug }}.json"
          git commit -m "reel: ${{ github.event.inputs.slug }} 推送状态待核实" || exit 0
          git pull --rebase origin main || { git rebase --abort || true; }
          git push origin main
