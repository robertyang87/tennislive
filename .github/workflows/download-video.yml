name: download-video
run-name: "Upload verified Zheng Beijing master and review copy"
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Temporary HTTPS file page for verified full movie"
        required: true
        type: string
      review_url:
        description: "Temporary HTTPS file page for verified review copy"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: deliver-zheng-charaeva-beijing-2026-r4
  cancel-in-progress: false
jobs:
  upload:
    if: github.ref == 'refs/heads/delivery/zheng-charaeva-beijing-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MOVIE_PAGE: ${{ inputs.url }}
      REVIEW_PAGE: ${{ inputs.review_url }}
    steps:
      - name: Download exact verified bytes and upload only to existing draft
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, html, json, os, re, subprocess
          import urllib.parse, urllib.request
          from pathlib import Path
          repo='robertyang87/tennislive'; release_id=405992221
          tag='reel-zheng-charaeva-beijing-2026-r4'
          assert os.environ['GH_REPO']==repo
          def api(endpoint):
              return json.loads(subprocess.check_output(['gh','api',endpoint],text=True))
          release=api(f'repos/{repo}/releases/{release_id}')
          assert release['draft'] and release['tag_name']==tag, 'Expected exact existing draft'
          entries=[
              ('MOVIE_PAGE','zheng-charaeva-beijing-2026-r4.mp4',100594865,'107cfcaa1a1985ce0873d291b6e79ead1d0f61f3f5ae97e4ea0f22585ac2721a'),
              ('REVIEW_PAGE','zheng-charaeva-beijing-2026-r4-review.mp4',25938584,'e16344281701406b3281b1c90b6d95caab60928219a5ffbe21ab6439189e6791')]
          def prepare(entry):
              variable,name,size,expected=entry
              page=os.environ[variable]
              parsed=urllib.parse.urlparse(page)
              assert parsed.scheme=='https' and parsed.hostname=='tmpfiles.org' and '/dl/' not in parsed.path
              with urllib.request.urlopen(urllib.request.Request(page,headers={'User-Agent':'tennislive/1.0 (+https://github.com/robertyang87/tennislive)'}),timeout=60) as response:
                  markup=response.read(100000).decode('utf-8')
              found=re.search(r'class="download"\s+href="([^"]+)"',markup)
              assert found, 'Download link missing; refuse HTML as movie'
              download=html.unescape(found.group(1)); parsed=urllib.parse.urlparse(download)
              assert parsed.scheme=='https' and parsed.hostname=='tmpfiles.org' and parsed.path.startswith('/dl/')
              path=Path(os.environ['RUNNER_TEMP'])/name
              digest=hashlib.sha256(); count=0
              with urllib.request.urlopen(urllib.request.Request(download,headers={'User-Agent':'tennislive/1.0 (+https://github.com/robertyang87/tennislive)'}),timeout=120) as response, path.open('wb') as output:
                  assert response.headers.get_content_type() in ('video/mp4','application/octet-stream'), 'Unexpected file type'
                  while True:
                      block=response.read(1048576)
                      if not block: break
                      count+=len(block); assert count<=size, 'Unexpected extra bytes'
                      digest.update(block); output.write(block)
              assert count==size and digest.hexdigest()==expected, 'Movie identity differs'
              print('Verified',name,count,expected,flush=True)
              return entry,path
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              prepared=list(pool.map(prepare,entries))
          def upload(item):
              entry,path=item; _,name,size,expected=entry
              existing=next((a for a in release['assets'] if a['name']==name),None)
              if existing and existing['size']==size and existing.get('digest')=='sha256:'+expected:
                  return name,size,expected
              if existing:
                  allowed_old={'zheng-charaeva-beijing-2026-r4.mp4':('sha256:1c7bfad0e69f83321ba77a3099bd9bfd32695657acd4634f9117068c2b6c8def',100843815),'zheng-charaeva-beijing-2026-r4-review.mp4':('sha256:1954458371f36e41ce124628595a44ff825da7ebd8b4db636b7336aad13b4b53',25970089)}
                  assert (existing.get('digest'),existing['size'])==allowed_old[name], 'Unrecognized old asset; refuse overwrite'
              subprocess.run(['gh','release','upload',tag,str(path),'--repo',repo,'--clobber'],check=True)
              return name,size,expected
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              uploaded=list(pool.map(upload,prepared))
          release=api(f'repos/{repo}/releases/{release_id}')
          assert release['draft'], 'Draft must remain unpublished'
          proof=[]
          for name,size,expected in uploaded:
              asset=next(a for a in release['assets'] if a['name']==name)
              assert asset['size']==size and asset.get('digest')=='sha256:'+expected, 'Remote asset identity differs'
              proof.append({k:asset[k] for k in ('id','name','size','digest','browser_download_url')})
          print(json.dumps({'release_id':release_id,'draft':True,'assets':proof},ensure_ascii=False,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('Exact full movie and review copy uploaded to existing draft. No WeChat send, no merge, no Release publish.\n\n```json\n'+json.dumps(proof,indent=2)+'\n```\n')
          PY
