name: download-video
run-name: "cookie-diagnostic · ${{ inputs.url }}"

# 把单条公开 YouTube 视频下载到 runner，再作为 GitHub Release
# 附件持久保存。不把大视频提交进 git 历史。
on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube 视频链接（请确保你有权下载和存档）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: download-video-${{ inputs.url }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VIDEO_URL: ${{ inputs.url }}
      GH_TOKEN: ${{ github.token }}
      # 下载和 Release 显式绑定仓库；仅检出共享依赖安装脚本。
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 YouTube 下载器
        run: pip install -q -e . "yt-dlp[default]" bgutil-ytdlp-pot-provider

      - name: 恢复音视频工具 apt 缓存
        id: apt_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          key: apt-pkgs-${{ runner.os }}-24.04-download-video-v1-${{ github.run_id }}
          restore-keys: |
            apt-pkgs-${{ runner.os }}-24.04-download-video-v1-
      - name: 安装音视频合并工具
        timeout-minutes: 15
        run: |
          source tools/ci_apt_install.sh
          ensure_ffmpeg
      - name: 回写实际下载的 apt 缓存
        if: env.APT_CACHE_DIRTY == '1' && steps.apt_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          key: ${{ steps.apt_cache.outputs.cache-primary-key }}

      # YouTube 对机房 IP 经常要求 PO token。provider 起不来时不在
      # 这里伪造一个根因，让 yt-dlp 在下一步输出真实诊断。
      - name: 启动 PO token provider
        continue-on-error: true
        run: |
          docker run --name bgutil-pot -d -p 4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider
          for attempt in $(seq 1 25); do
            if curl -sf http://127.0.0.1:4416/ping >/dev/null; then
              echo "PO token provider 已就绪"
              exit 0
            fi
            sleep 2
          done
          echo "::warning::PO token provider 50 秒内未就绪，继续尝试 cookies/client 通道"
          docker logs bgutil-pot 2>&1 | tail -20 || true

      - name: 写入 YouTube cookies（如已配置）
        id: cookies
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "path=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::未配置 YT_COOKIES_TXT，仅使用 PO token/client 通道"
          fi

      - name: 仅检查Cookie到期元数据
        env:
          YT_COOKIES: ${{ steps.cookies.outputs.path }}
        run: |
          python - <<'META'
          import os,time,json
          from pathlib import Path
          jar=os.environ.get('YT_COOKIES','')
          result={'file_configured':bool(jar),'values_logged':False,'now_utc_epoch':int(time.time())}
          auth={'SID','HSID','SSID','APISID','SAPISID','__Secure-1PSID','__Secure-3PSID','__Secure-1PAPISID','__Secure-3PAPISID','__Secure-1PSIDTS','__Secure-3PSIDTS'}
          counts={'auth_records':0,'expired_auth_records':0,'unexpired_auth_records':0,'session_auth_records':0,'invalid_record_count':0}
          if jar and Path(jar).is_file():
              for line in Path(jar).read_text().splitlines():
                  if line.startswith('#HttpOnly_'):line=line[len('#HttpOnly_'):]
                  elif not line or line.startswith('#'):continue
                  parts=line.split('\t')
                  if len(parts)!=7:
                      counts['invalid_record_count']+=1
                      continue
                  domain=parts[0].lstrip('.')
                  if not(domain=='youtube.com' or domain.endswith('.youtube.com')) or parts[5] not in auth:continue
                  counts['auth_records']+=1
                  try:expiry=int(parts[4])
                  except ValueError:
                      counts['invalid_record_count']+=1
                      continue
                  if expiry<=0:counts['session_auth_records']+=1
                  elif expiry<=time.time():counts['expired_auth_records']+=1
                  else:counts['unexpired_auth_records']+=1
          result.update(counts)
          print(json.dumps(result,sort_keys=True))
          META

      - name: 已知公开视频的原生三秒媒体对照
        env:
          YT_COOKIES: ${{ steps.cookies.outputs.path }}
        run: bash tools/yt_cookie_check.sh "https://www.youtube.com/watch?v=HyKTXynnI9c"
