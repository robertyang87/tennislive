name: download-video
run-name: "Paris title-run official source archive"
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Unused compatibility input; sources fixed for this episode"
        required: false
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            pyproject.toml
            README.md
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -e . yt-dlp
      - name: Archive the two verified public Tennis TV sources
        shell: bash
        run: |
          python - <<'PYARCHIVE'
          import subprocess,hashlib,json
          from pathlib import Path
          from tennislive.video.official import media_url
          sources=[('4606354','paris-2026-final-shelton-alcaraz-short-highlights'),('4606098','road-to-final-paris')]
          for ident,slug in sources:
              original='https://www.tennistv.com/videos/'+ident+'/'+slug
              playback=media_url(original)
              name='tennistv-'+ident
              path=Path(name+'.mp4')
              subprocess.run(['yt-dlp','--no-progress','-f','bestvideo[height<=1080]+bestaudio/best','--merge-output-format','mp4','-o',str(path),playback],check=True)
              proof={'original_url':original,'sha256':hashlib.file_digest(path.open('rb'),'sha256').hexdigest(),'bytes':path.stat().st_size,'run_id':'${{ github.run_id }}'}
              manifest=Path(name+'.json');manifest.write_text(json.dumps(proof,indent=2))
              tag='source-'+name
              exists=subprocess.run(['gh','release','view',tag],capture_output=True).returncode==0
              if not exists:subprocess.run(['gh','release','create',tag,'--title','Official source '+name,'--notes','Official public source archive for the requested Paris 2026 Alcaraz title-run episode. Source: '+original],check=True)
              subprocess.run(['gh','release','upload',tag,str(path),str(manifest),'--clobber'],check=True)
              print(json.dumps(proof),flush=True)
          PYARCHIVE
