name: download-video
run-name: "download-video · Vacherot rich recut official sources"
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Authorized official free source batch"
        required: true
        type: string
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: [{"key":"ao","id":"6388215420112","slug":"ao-2026-r3-shelton-vacherot"}]
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            tools
            pyproject.toml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -e . 'yt-dlp[default]'
      - name: Install ffmpeg
        timeout-minutes: 15
        run: |
          source tools/ci_apt_install.sh
          ensure_ffmpeg
      - name: Archive anonymous officially free source
        run: python tools/archive_rich_recut_sources.py '${{ matrix.id }}' '${{ matrix.slug }}'
