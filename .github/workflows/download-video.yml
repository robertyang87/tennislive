name: download-video
run-name: "download-video · ${{ inputs.url }}"

# 把单条公开 YouTube 视频下载到 runner，再作为 GitHub Release
# 附件持久保存。不把大视频提交进 git 历史。
on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube 视频链接（请确保你有权下载和存档）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: download-video-${{ inputs.url }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VIDEO_URL: ${{ inputs.url }}
      GH_TOKEN: ${{ github.token }}
      # 下载和 Release 显式绑定仓库；仅检出共享依赖安装脚本。
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 YouTube 下载器
        run: pip install -q -e . "yt-dlp[default]" bgutil-ytdlp-pot-provider

      - name: 恢复音视频工具 apt 缓存
        id: apt_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          key: apt-pkgs-${{ runner.os }}-24.04-download-video-v1-${{ github.run_id }}
          restore-keys: |
            apt-pkgs-${{ runner.os }}-24.04-download-video-v1-
      - name: 安装音视频合并工具
        timeout-minutes: 15
        run: |
          source tools/ci_apt_install.sh
          ensure_ffmpeg
      - name: 回写实际下载的 apt 缓存
        if: env.APT_CACHE_DIRTY == '1' && steps.apt_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          key: ${{ steps.apt_cache.outputs.cache-primary-key }}

      # YouTube 对机房 IP 经常要求 PO token。provider 起不来时不在
      # 这里伪造一个根因，让 yt-dlp 在下一步输出真实诊断。
      - name: 启动 PO token provider
        continue-on-error: true
        run: |
          docker run --name bgutil-pot -d -p 4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider
          for attempt in $(seq 1 25); do
            if curl -sf http://127.0.0.1:4416/ping >/dev/null; then
              echo "PO token provider 已就绪"
              exit 0
            fi
            sleep 2
          done
          echo "::warning::PO token provider 50 秒内未就绪，继续尝试 cookies/client 通道"
          docker logs bgutil-pot 2>&1 | tail -20 || true

      - name: 写入 YouTube cookies（如已配置）
        id: cookies
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "path=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::未配置 YT_COOKIES_TXT，仅使用 PO token/client 通道"
          fi

      - name: 解析并下载原片
        id: video
        env:
          YT_COOKIES: ${{ steps.cookies.outputs.path }}
        run: |
          set -euo pipefail
          export PYTHONPATH=src:tools
          export YT_POT_PROVIDER=http://127.0.0.1:4416
          python - <<'NATIVE'
          import os
          from pathlib import Path
          import build_match_reel as reel
          url=os.environ['VIDEO_URL']
          assert url=='https://www.youtube.com/watch?v=ip817TTdCtY'
          reel.YTDLP_BASE += ['--force-ipv4','--retries','2']
          dest=Path(os.environ['RUNNER_TEMP'])/'native-source'/'ip817TTdCtY.mp4'
          dest.parent.mkdir(exist_ok=True)
          try:
              reel.download(url,dest)
          except reel.ReelError:
              if not os.environ.get('YT_COOKIES'):
                  raise
              print('[native] Authenticated ladder unavailable; retry same native ladder with public anonymous channel.')
              os.environ.pop('YT_COOKIES',None)
              reel.download(url,dest)
          w,h=reel.probe_size(dest)
          if h<1080:
              raise SystemExit(f'Native helper retrieved only {w}x{h}; no source quality exception granted.')
          print(f'[native] Actual source {w}x{h}, {dest.stat().st_size} bytes')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('id=ip817TTdCtY\n')
              f.write('title=Elina Svitolina vs. Karolina Muchova | 2026 FAGE WTA Finals Group 2 | WTA Highlights\n')
              f.write(f'file={dest}\nsize={dest.stat().st_size}\n')
          NATIVE

      - name: 上传到 GitHub Release
        env:
          VIDEO_ID: ${{ steps.video.outputs.id }}
          VIDEO_TITLE: ${{ steps.video.outputs.title }}
          VIDEO_FILE: ${{ steps.video.outputs.file }}
          VIDEO_SIZE: ${{ steps.video.outputs.size }}
        run: |
          set -euo pipefail
          TAG="source-$VIDEO_ID"
          ASSET="$VIDEO_ID.mp4"
          cp "$VIDEO_FILE" "$RUNNER_TEMP/$ASSET"

          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$VIDEO_TITLE" \
              --notes "由 download-video GitHub Action 保存的源视频。来源：$VIDEO_URL"

          UPLOADED=0
          for attempt in 1 2 3 4; do
            if gh release upload "$TAG" "$RUNNER_TEMP/$ASSET" --clobber; then
              UPLOADED=1
              break
            fi
            sleep $((attempt * attempt * 5))
          done
          test "$UPLOADED" = 1 || { echo "::error::Release 附件连续 4 次上传失败"; exit 1; }

          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$ASSET"
          CODE=000
          for attempt in 1 2 3 4 5 6 7 8; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -L -r 0-99 "$URL" || echo 000)
            if [ "$CODE" = 200 ] || [ "$CODE" = 206 ]; then
              break
            fi
            sleep 5
          done
          if [ "$CODE" != 200 ] && [ "$CODE" != 206 ]; then
            echo "::error::Release 已上传，但直链探活返回 HTTP $CODE"
            exit 1
          fi

          {
            echo "## 视频已保存"
            echo
            echo "- 标题：$VIDEO_TITLE"
            echo "- 大小：$VIDEO_SIZE 字节"
            echo "- [直接下载]($URL)"
            echo "- [Release 页](https://github.com/${{ github.repository }}/releases/tag/$TAG)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "download_url=$URL"
