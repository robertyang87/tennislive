name: download-video
run-name: "download-video · Vacherot rich recut official sources"
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Authorized official free source batch"
        required: true
        type: string
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: [{"key": "monte", "id": "4485679", "slug": "monte-carlo-2026-qf-vacherot-de-minaur-short-highlights"}, {"key": "tokyo", "id": "4585425", "slug": "tokyo-2026-r2-vacherot-tsitsipas-short-highlights"}, {"key": "shanghai", "id": "4591083", "slug": "shanghai-2026-r3-paul-vacherot-short-highlights"}, {"key": "paris-r2", "id": "4392293", "slug": "paris-2025-r2-rinderknech-vacherot-short-highlights"}, {"key": "paris-r3", "id": "4393082", "slug": "paris-2025-r3-norrie-vacherot-short-highlights"}, {"key": "basel-2025", "id": "4387963", "slug": "basel-2025-r1-fritz-vacherot-short-highlights"}, {"key": "chengdu", "id": "4582098", "slug": "chengdu-2026-r2-vacherot-harris-short-highlights"}]
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            tools
            pyproject.toml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -e . 'yt-dlp[default]'
      - name: Archive anonymous officially free source
        run: python tools/archive_rich_recut_sources.py '${{ matrix.id }}' '${{ matrix.slug }}'
