name: codex-dispatch-fils-tirante-cover-preview

on:
  push:
    branches:
      - codex/fils-tirante-final-20260821
    paths:
      - .github/workflows/codex-dispatch-fils-tirante-cover-preview.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: "${{ github.event.head_commit.message == 'ci: preview Fils winning-expression cover' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch cover preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run match-reel.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref codex/fils-tirante-final-20260821 \
            -f mode=cover \
            -f slug=fils-tirante \
            -f push=false
