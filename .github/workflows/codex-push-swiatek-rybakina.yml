name: push Swiatek Rybakina Cincinnati to WeChat

on:
  push:
    branches:
      - codex/push-swiatek-rybakina-cincinnati-20260821
    paths:
      - .github/workflows/codex-push-swiatek-rybakina.yml

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified push on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run match-reel.yml \
            --repo robertyang87/tennislive \
            --ref main \
            -f mode=push \
            -f slug=swiatek-rybakina-cincinnati-2026-qf \
            -f push=true
