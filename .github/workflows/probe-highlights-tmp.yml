name: probe-highlights-tmp
on:
  workflow_dispatch:
    inputs:
      url:
        description: "集锦视频 URL"
        required: true
        default: "https://www.youtube.com/watch?v=sZJCqFpN6S0"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: pip install -q "yt-dlp[default]" bgutil-ytdlp-pot-provider
      - name: 取时长与字幕
        env:
          URL: ${{ inputs.url }}
        run: |
          echo "=== 视频信息 ==="
          yt-dlp --print "%(duration)s %(title)s" --no-warnings "$URL" || echo "INFO_FAIL"
          echo "=== 可用字幕 ==="
          yt-dlp --list-subs --no-warnings "$URL" 2>&1 | head -40 || echo "SUBS_FAIL"
          echo "=== 下载英文自动字幕 ==="
          mkdir -p /tmp/cap && cd /tmp/cap
          yt-dlp --write-auto-subs --write-subs --sub-langs "en.*" --skip-download --sub-format "vtt/json3" --no-warnings "$URL" 2>&1 | tail -5 || echo "CAP_FAIL"
          ls -la /tmp/cap/
          for f in /tmp/cap/*; do
            echo "--- $f ($(wc -c <"$f") bytes) ---"
            tail -c 3000 "$f"
            echo
          done
