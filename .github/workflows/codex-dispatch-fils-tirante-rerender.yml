name: codex-dispatch-fils-tirante-rerender

on:
  push:
    branches:
      - codex/fils-tirante-final-20260821
    paths:
      - .github/workflows/codex-dispatch-fils-tirante-rerender.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: "${{ github.event.head_commit.message == 'ci: rerender Fils intro after copy QA' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch corrected full render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run match-reel.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref codex/fils-tirante-final-20260821 \
            -f mode=render \
            -f slug=fils-tirante \
            -f push=false
