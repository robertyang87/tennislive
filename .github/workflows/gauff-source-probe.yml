name: gauff-source-probe

on:
  pull_request:
    paths:
      - ".github/workflows/gauff-source-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependency
        run: python -m pip install --disable-pip-version-check "yt-dlp[default]"
      - name: Write YouTube cookies
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s' "$YT_COOKIES_TXT" > /tmp/yt-cookies.txt
          else
            : > /tmp/yt-cookies.txt
          fi
      - name: Search fresh official and broadcast uploads
        run: |
          COOKIE_ARGS=()
          if [ -s /tmp/yt-cookies.txt ]; then COOKIE_ARGS=(--cookies /tmp/yt-cookies.txt); fi
          FORMAT='%(upload_date)s | %(channel)s | %(id)s | %(duration_string)s | %(title)s'
          for QUERY in \
            'ytsearch30:Coco Gauff Kostyuk Cincinnati interview 2026' \
            'ytsearch30:Coco Gauff Cincinnati post match interview 2026' \
            'ytsearch30:Coco Gauff Cincinnati press conference 2026'
          do
            echo "SEARCH_BEGIN=$QUERY"
            yt-dlp --no-warnings --js-runtimes node "${COOKIE_ARGS[@]}" \
              --flat-playlist --skip-download --print "$FORMAT" "$QUERY" || true
            echo "SEARCH_END=$QUERY"
          done
          for CHANNEL in \
            'https://www.youtube.com/@CincyTennis/videos' \
            'https://www.youtube.com/@TennisChannel/videos' \
            'https://www.youtube.com/@WTA/videos'
          do
            echo "CHANNEL_BEGIN=$CHANNEL"
            yt-dlp --no-warnings --js-runtimes node "${COOKIE_ARGS[@]}" \
              --flat-playlist --playlist-end 40 --print "$FORMAT" "$CHANNEL" || true
            echo "CHANNEL_END=$CHANNEL"
          done
