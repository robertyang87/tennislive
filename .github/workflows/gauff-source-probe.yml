name: gauff-interview-preview-bridge

on:
  pull_request:
    paths:
      - ".github/workflows/gauff-source-probe.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch interview subtitle probe on the PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run interview-clip.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_HEAD_REF" \
            -f slug=gauff-kostyuk-cincinnati-2026-qf \
            -f mode=subs \
            -f push=false
