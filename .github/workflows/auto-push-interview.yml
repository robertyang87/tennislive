name: auto-push-interview

# **合进 main 就自动发微信**，赛后开麦这条线的那一半（reel 那半是
# `auto-push-reel.yml`，2026-08-02 就有了）。
#
# **为什么 2026-08-14 才补上**：`auto-push-reel` 的路径正则写着
# `output/*/reel/*/render.json`，而采访产物存在 `output/interviews/<slug>/`
# ——**没有日期那一层**（`push_reel.headline` 的注释写着这是故意的：同一场
# 采访哪天发都可能）。两个形状对不上，所以那条路**结构性地**够不着这条线，
# 不是配漏了。量出来的代价：18 条 spec 里 0 条写了 `push.auto`、18 个产物
# 目录里 0 个 `pushed.json`——而赛后开麦是时效最紧的一条，过一夜就没人看了。
#
# ⚠️ **默认什么都不会发。** 要开，在 `specs/interviews/<slug>.json` 的 `push`
# 块里加一行 `"auto": true`；没这一行的采访，这条工作流看一眼就跳过并说明
# 原因。五道闸（路径形状 / 显式认领 / 没推过 / 海报在仓库里 / 一趟最多一条）
# 全在 `tools/auto_push_interview_gate.py` 里——写进 YAML 就测不了了。
#
# ⚠️ **海报那道现在会拦下所有存量，那是对的。** 2026-08-13 那次 purge 从全史
# 抹掉了 output/ 下所有 jpg，`git ls-files 'output/interviews/*/poster*'`
# 零命中。要发得先跑一趟 `interview-clip mode=cover` 把海报渲回来。
#
# **为什么必须是 main**：GitHub Pages 只服务 main，复制页留在分支上永远是
# 404；而海报链接钉在 commit sha 上，未合并的 commit 有被 GC 的风险。
# 消息发出去收不回来。
on:
  push:
    branches: [main]
    # 只盯 render.json：它是「这条采访渲完了」的产物，而且**成片本身不在这儿**
    # ——2026-08-13 起采访成片一律传 Release，链接就记在 render.json 的
    # `video_url` 里。盯 mp4 会一条都盯不到。
    paths:
      - "output/interviews/*/render.json"

permissions:
  contents: write
  # 触发 `pages.yml` 重新发布复制页——工作流自己提交的 push
  # **不会**创建 workflow run，见 `trigger_pages_build`。
  actions: write

# 同一条采访只留一个在跑。**不许 cancel-in-progress**：取消一个已经发出
# POST 的 run，只会让「发没发出去」变成未知，而 pushed.json 那一笔可能没记上。
concurrency:
  group: auto-push-interview
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 只取 HEAD 和它的父提交：算「这次改了哪些文件」要 diff 一次，
          # 而拉整部历史是好几个 G。
          fetch-depth: 2
          # 这条只需要自己那一格——在「挑出该发的那一条」之后
          # `git sparse-checkout add` 回来。**两半都要有**：只写这一半，
          # 后面 `git add` 会说路径在稀疏范围之外，只警告、退出码 0，
          # 产物静默丢掉。
          sparse-checkout: |
            .github
            specs
            src
            tools

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 这条路不下源片、不转写、不烧字幕、不编码，所以不装那一堆重依赖。
      # 装全套只会把失败面铺大：那几个包里任何一个装不上，都会让一条**本来
      # 只是发消息**的 run 挂掉。`interview-clip.yml` 的 `mode=push` 也是这么
      # 挑的（「只挑工作不挑准备等于没挑」）。
      - name: 装依赖
        run: |
          pip install -q -e .
          # 真验一次这条路要的东西，**不许 `|| true`**：装少了要在第 5 秒炸，
          # 而不是几分钟后死在推送那一步。
          python -c "import requests, tennislive.publish.pushplus, tennislive.render.pushmsg"

      - name: 挑出该自动发的那一条
        id: gate
        run: |
          # **拿 `HEAD^` 比，别拿 `github.event.before`。** 这是浅克隆
          # （fetch-depth: 2），`before` 那个 sha 可能根本不在本地——`git diff`
          # 会失败，而失败在这儿的表现是「这次没有该发的采访」，**和真的没有
          # 长得一模一样**，一条该发的推送就这么静默消失了。
          # 这个仓库是 squash 合并，`HEAD^` 就是合并前的 main，深度 2 保证有。
          # `--diff-filter=AM`：**删掉的 render.json 不是新渲完的片子**。清理旧版
          # 产物的合并会带进 D 条目，而它的 spec 往往还写着 auto:true、又没有
          # pushed.json——不滤掉就会凑成「一次 N 条」把真该发的那条一起拦死。
          CHANGED=$(git diff --diff-filter=AM --name-only HEAD^ HEAD -- 'output/interviews/*/render.json')
          if [ -z "$CHANGED" ]; then
            echo "[自动推送] 这次没有动到任何 render.json。"
            exit 0
          fi
          # shellcheck disable=SC2086
          python tools/auto_push_interview_gate.py --changed $CHANGED

      - name: 把这一格放进稀疏范围
        if: steps.gate.outputs.found == 'true'
        run: git sparse-checkout add "${{ steps.gate.outputs.outdir }}"

      # ⚠️ **这条线和 reel 不一样：复制页多半是新的，不是「通常一模一样」。**
      # `match-reel.yml` 的写复制页那步在 `mode=render` 上无条件跑，所以
      # copy.html 跟着 PR 就进了 main，`auto-push-reel` 那一步通常什么都不用
      # 提交、Pages 早就构建好了。而 `interview-clip.yml` 的同一步挂着
      # `if: inputs.push == 'true'`——走自动推送时那趟 render 是 push=false，
      # **copy.html 根本没写过**。于是这一步会真的产出一个新文件、真的要提交、
      # 然后真的要等 Pages 把它发布出来（下面推送那一步的等待窗口就是为它给的）。
      #
      # 顺序不许动：写文件 → 提交 → 发微信。这条规矩在别的线上踩过六次
      # （日志印着链接、步骤 success、人点开 404）。
      #
      # `--date` 是这条线独有的：产物目录里没有日期，`push_reel` 解不出来。
      # **它从 gate 那一步来，不在这儿再算一遍**——这一步和下面推送那一步
      # 各算一次标题，`wait_for_copy_page(expect=title)` 要求两次算出同一句，
      # 跨过上海午夜就会分叉成两个日期，然后等一句永远不出现的话。
      - name: 写复制页（必须排在提交之前）
        if: steps.gate.outputs.found == 'true'
        run: |
          python tools/push_reel.py --stage page \
            --outdir "${{ steps.gate.outputs.outdir }}" \
            --date "${{ steps.gate.outputs.date }}" \
            --copy "specs/interviews/${{ steps.gate.outputs.slug }}.xhs.txt"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: 复制页有变化就先提交
        if: steps.gate.outputs.found == 'true'
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add --sparse "${{ steps.gate.outputs.outdir }}"
          if git diff --cached --quiet; then
            echo "复制页和仓库里那份一致，不用提交"
          else
            python tools/check_staged_file_sizes.py
            git commit -m "interview: 自动推送前补齐复制页 ${{ steps.gate.outputs.slug }}"
            git pull --rebase origin main
            git push origin main
          fi

      - name: 推送到微信
        if: steps.gate.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # **钉 commit，别停在 @main。** 同一条采访重渲，海报路径一模一样，
          # 而微信的图片缓存按**路径**算——URL 停在 @main 的话推出去的还是
          # 上一版那张海报，而且不吭声。
          TENNISLIVE_ASSET_REV: ${{ github.sha }}
          # **这个仓库的 Pages 构建明显比默认预算慢。** 实测：08:41 的提交能
          # 打开，08:54 的等了 14 分钟还是 404，而默认预算是 30×20s=10 分钟。
          # 「等不到」和「没等够」长得一模一样，而代价完全不对称——多等只是让
          # runner 空转，等不够就是复制页按钮被摘掉。两个数照抄
          # `interview-clip.yml` 的推送那一步（注释也抄），别在这儿另定一套。
          # ⚠️ 60×40s = 40 分钟，所以上面 job 的 `timeout-minutes` 必须比它大
          # ——写 20 分钟的话，等待还没走完 job 就被砍了，而砍掉的时机正好在
          # 「复制页已提交、微信一个字没发」那一段。
          TENNISLIVE_COPYPAGE_ATTEMPTS: "60"
          TENNISLIVE_COPYPAGE_RETRY_SECONDS: "40"
        run: |
          python tools/push_reel.py \
            --outdir "${{ steps.gate.outputs.outdir }}" \
            --date "${{ steps.gate.outputs.date }}" \
            --copy "specs/interviews/${{ steps.gate.outputs.slug }}.xhs.txt"

      # **发完必须记一笔，而且必须进仓库。** 这是「已经发过」的唯一判据——
      # 「工作流跑成功过」证明不了消息发出去了，而重发就是让人再收一条一样的。
      # ⚠️ **必须排在发微信之后**：反过来的话，推送失败会留下一个「已经发过」
      # 的假标记，这条采访从此再也发不出去，而且不吭声。
      # 记不进去也不算这一趟失败（消息已经发了），但要红出来让人看见。
      - name: 记下已经推送过
        if: steps.gate.outputs.found == 'true'
        run: |
          python tools/auto_push_interview_gate.py \
            --record "${{ steps.gate.outputs.outdir }}" \
            --run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --now "$(date -u +%FT%TZ)"
          git add --sparse "${{ steps.gate.outputs.outdir }}"
          python tools/check_staged_file_sizes.py
          git commit -m "interview: ${{ steps.gate.outputs.slug }} 已自动推送"
          git pull --rebase origin main
          git push origin main

      - name: 失败时告警
        if: failure()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "## ⚠️ 赛后开麦自动推送失败"
            echo ""
            echo "- slug：\`${{ steps.gate.outputs.slug }}\`"
            echo "- 运行日志：$RUN_URL"
            echo "- ⚠️ **先看日志确认微信到底发出去没有**：失败在推送之前是安全的，"
            echo "  失败在「记下已经推送过」那一步则消息已经发了，别再手动补一次。"
          } >> "$GITHUB_STEP_SUMMARY"
