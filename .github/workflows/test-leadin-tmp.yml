name: test-leadin-tmp
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q "yt-dlp[default]"
      - name: 落 cookies
        id: cookies
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "path=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_OUTPUT"
          fi
      - name: 启动 PO token
        run: |
          pip install -q bgutil-ytdlp-pot-provider
          docker run --name bgutil-pot -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4416/ping && break || sleep 1; done
      - name: 下载 lead_in 片段
        env:
          COOKIES: ${{ steps.cookies.outputs.path }}
        run: |
          set -e
          URL="https://www.youtube.com/watch?v=B8EO9eKy-mY"
          ARGS=(--extractor-args "youtube:player_client=mweb" --js-runtimes node)
          [ -n "$COOKIES" ] && ARGS+=(--cookies "$COOKIES")
          echo "=== 下载 212-231 秒片段 ==="
          yt-dlp "${ARGS[@]}" --download-sections "*212-231" --force-keyframes-at-cuts \
            -f "bv*[height<=1080]+ba/b[height<=1080]" --merge-output-format mp4 \
            -o "/tmp/leadin_test.mp4" --no-warnings "$URL"
          ls -lh /tmp/leadin_test.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 /tmp/leadin_test.mp4
          echo "SUCCESS"
