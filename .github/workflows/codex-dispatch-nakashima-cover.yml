name: codex-dispatch-nakashima-cover

# v2：改用同场更正面的现场图，触发一次仅封面重渲染。

on:
  push:
    branches:
      - codex/nakashima-cover-closeup
    paths:
      - .github/workflows/codex-dispatch-nakashima-cover.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Render replacement Nakashima cover
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run match-reel.yml --repo "$GH_REPO" \
            --ref codex/nakashima-cover-closeup \
            -f mode=cover \
            -f slug=fritz-nakashima-cincinnati-2026-qf \
            -f url='https://youtu.be/t4eOVbP8Tdc?is=PN4qzNJefrg0VXpz' \
            -f every=2 \
            -f cutout_candidates=false \
            -f push=false
