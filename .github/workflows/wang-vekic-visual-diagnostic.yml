name: Wang Vekic visual diagnostic
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            tools
            tests
            src
            assets
            skills
            specs
            output/2026-08-23/reel/fils-cobolli-cincinnati-2026-sf
            output/2026-09-22/reel/wang-vekic-singapore-2026-r1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -e ".[dev]" "yt-dlp[default]>=2026.7.4"
      - name: 安装 ffmpeg（共享缓存与超时）
        timeout-minutes: 5
        run: |
          source tools/ci_apt_install.sh
          apt_install_cached ffmpeg
      - uses: actions/cache@v4
        with:
          path: ~/.cache/tennislive-sources
          key: reel-src-fils-cobolli-cincinnati-2026-sf-visual-benchmark-v2
          restore-keys: reel-src-fils-cobolli-cincinnati-2026-sf-
      - name: Restore missing reference contact sheets from original source
        timeout-minutes: 7
        env:
          TENNISLIVE_SOURCE_CACHE: ~/.cache/tennislive-sources
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          python - <<'PY'
          import os,json,sys
          from pathlib import Path
          sys.path.insert(0,"tools")
          from build_match_reel import download,contact_sheet,probe_duration
          base=Path("output/2026-08-23/reel/fils-cobolli-cincinnati-2026-sf")
          if not list(base.glob("contact_*.jpg")):
              cookie=Path(os.environ["RUNNER_TEMP"])/"benchmark-cookies.txt"
              if os.environ.get("YT_COOKIES_TXT"):
                  cookie.write_text(os.environ["YT_COOKIES_TXT"])
                  os.chmod(cookie,0o600)
                  os.environ["YT_COOKIES"]=str(cookie)
              try:
                  probe=json.loads((base/"probe.json").read_text())
                  source=download(probe["url"],Path(os.environ["RUNNER_TEMP"])/"benchmark-source.mp4")
                  assert abs(probe_duration(source)-float(probe["duration"])) < .25, "Reference source changed; cannot reuse old timing"
                  contact_sheet(source,base,every=2)
              finally:
                  cookie.unlink(missing_ok=True)
          assert list(base.glob("contact_*.jpg")), "Reference still has no images"
          PY
      - name: Verify panel and existing production gates
        run: python -m pytest tests/test_visual_panels.py tests/test_visual_duration_citation.py tests/test_reel_production_gates.py -q
      - name: Published reference shadow benchmark with final-content guard
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python tools/benchmark_reel_models.py --outdir visual-benchmark
      - name: Audit match only after benchmark passes
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          python - <<'PY'
          import json,sys,os,urllib.request
          from pathlib import Path
          sys.path.insert(0,"tools")
          from analyze_reel_visuals import verified_minimax_report,select_contact_sheets,evidence_hash,AUDIT_VERSION
          base=Path("output/2026-09-22/reel/wang-vekic-singapore-2026-r1")
          draft=json.loads(Path("specs/reels/pending/wang-vekic-singapore-2026-r1.draft.json").read_text())
          cover=Path("wang-current-match.jpg")
          urllib.request.urlretrieve("https://wx1.sinaimg.cn/large/008CZ4NUgy1ihcimp59qxj31a50wrtfe.jpg",cover)
          draft.setdefault("cover",{}).setdefault("portrait",{})["image"]=str(cover)
          draft["_cover_brief"]={"preferred_subject":"王欣瑜","preferred_moment":"winner_celebration"}
          frames=select_contact_sheets(list(base.glob("contact_*.jpg")))
          report,problems=verified_minimax_report(draft,frames,cover,json.loads((base/"probe.json").read_text()),os.environ["MINIMAX_API_KEY"])
          report.update(input_sha256=evidence_hash(frames,cover),audit_version=AUDIT_VERSION,cover_image=str(cover))
          Path("visual-diagnostic.json").write_text(json.dumps({"report":report,"problems":problems},ensure_ascii=False,indent=2))
          print(json.dumps({"report":report,"problems":problems},ensure_ascii=False))
          # This is an audit only. A third-party image is not silently promoted
          # to an official photo, and failed evidence never reaches production.
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wang-visual-repair-benchmark
          path: |
            visual-benchmark/
            output/2026-08-23/reel/fils-cobolli-cincinnati-2026-sf/contact_*.jpg
            visual-diagnostic.json
            wang-current-match.jpg
          retention-days: 7
