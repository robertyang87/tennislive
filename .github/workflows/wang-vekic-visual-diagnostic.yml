name: Wang Vekic visual diagnostic
on:
  push:
    branches: [codex/wang-vekic-singapore-reel]
    paths: [.github/workflows/wang-vekic-visual-diagnostic.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            tools
            src
            skills
            specs/reels/pending
            output/2026-09-22/reel/wang-vekic-singapore-2026-r1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/tennislive-sources
          key: reel-src-wang-vekic-singapore-2026-r1-7117161ff07cc587
      - run: pip install -q -e .
      - name: Diagnose same-match visual request
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          python - <<'PY'
          import json,sys,os,urllib.error,urllib.request
          from pathlib import Path
          sys.path.insert(0,"tools")
          from analyze_reel_visuals import ask_minimax,select_contact_sheets,clean_report
          base=Path("output/2026-09-22/reel/wang-vekic-singapore-2026-r1")
          draft=json.loads(Path("specs/reels/pending/wang-vekic-singapore-2026-r1.draft.json").read_text())
          cover=Path("wang-current-match.jpg")
          urllib.request.urlretrieve("https://wx1.sinaimg.cn/large/008CZ4NUgy1ihcimp59qxj31a50wrtfe.jpg",cover)
          draft.setdefault("cover",{}).setdefault("portrait",{})["image"]=str(cover)
          draft["_cover_brief"]={"preferred_subject":"王欣瑜","preferred_moment":"winner_celebration","source_url":"https://www.sina.cn/news/detail/5345982256253548.html","note":"候选是本场赛后微笑致意图片，必须自行核对。另一张官方帖白帽图与本场酒红帽不同，已排除。"}
          previous={"cold_open":{"start":262.76,"end":282.88,"kind":"match_point"},"ending":{"start":262.5,"end":282.88,"reason":"引用284.5到294.5的窗口外画面"}}
          problems=["上一轮将赛后画面错误分类为match_point：赛点发生于251.48至258.76秒；262.76秒为维基奇特写，不能说赢家全程可见。请按图片独立核对，选择真实类型。","上一轮理由引用ending窗口外284.5至294.5秒，且错误声称278.5到282.5是教练包厢。该处应核对实际人物，不能重复猜测。","新候选封面需要独立核对，不能因提供了图片就通过；请保留3到30秒窗口与实际时间证据。"]
          report={}
          try:
              report["response"]=ask_minimax(draft,select_contact_sheets(list(base.glob("contact_*.jpg"))),cover,json.loads((base/"probe.json").read_text()),os.environ["MINIMAX_API_KEY"],previous=previous,validation_problems=problems)
              report["validated"],report["problems"]=clean_report(report["response"],draft,305.156644)
          except urllib.error.HTTPError as e:
              report={"http_status":e.code,"response_body":e.read(4096).decode("utf-8","replace").replace(os.environ["MINIMAX_API_KEY"],"[REDACTED]")}
          Path("visual-diagnostic.json").write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wang-vekic-corrected-visual-review
          path: |
            wang-current-match.jpg
            visual-diagnostic.json
          retention-days: 7
