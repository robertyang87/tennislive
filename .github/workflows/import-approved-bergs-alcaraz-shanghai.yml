name: Import approved Alcaraz Shanghai master
on:
  push:
    branches: [main]
    paths:
      - data/approved_reel_imports/bergs-alcaraz-shanghai-2026-r3/request.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-approved-bergs-alcaraz-shanghai-2026-r3
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      REQUEST: data/approved_reel_imports/bergs-alcaraz-shanghai-2026-r3/request.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            data
            specs/reels
            tools
            assets/reel
            assets/flags
            assets/logo
            assets/players/headshots
            src
            output/2026-10-12/reel/bergs-alcaraz-shanghai-2026-r3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Cache apt packages for native validation
        id: apt_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          key: apt-pkgs-${{ runner.os }}-24.04-approved-bergs-alcaraz-shanghai-2026-r3-${{ github.run_id }}
          restore-keys: |
            apt-pkgs-${{ runner.os }}-24.04-approved-bergs-alcaraz-shanghai-2026-r3-
            apt-pkgs-${{ runner.os }}-24.04-ci-v2-
      - name: Install native validation dependencies
        timeout-minutes: 15
        run: |
          pip install -q -e . numpy
          source tools/ci_apt_install.sh
          ensure_ffmpeg

      # 只在这一趟真摸了网、下了新包时回写（`APT_CACHE_DIRTY` 由
      # `tools/ci_apt_install.sh` 置位）。原来靠 actions/cache@v4 的 post 自动存：
      # 命中的趟白传一份、只装 ffmpeg 的趟把空目录存成最新那一格——见那份脚本
      # 顶部 2026-09-27 那段。判据 `tests/test_runner_setup_cache.py`。
      - name: 回写 apt 缓存（这趟真下了新包才存）
        if: env.APT_CACHE_DIRTY == '1' && steps.apt_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          key: ${{ steps.apt_cache.outputs.cache-primary-key }}
      - name: Restore verified transfer chunks
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/approved-bergs-alcaraz-shanghai-2026-r3-chunks
          key: approved-bergs-alcaraz-shanghai-2026-r3-${{ hashFiles('data/approved_reel_imports/bergs-alcaraz-shanghai-2026-r3/request.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            approved-bergs-alcaraz-shanghai-2026-r3-${{ hashFiles('data/approved_reel_imports/bergs-alcaraz-shanghai-2026-r3/request.json') }}-
      - name: Reconstruct exact master and verify original native QC identity
        id: master
        run: python tools/import_approved_bergs_alcaraz_shanghai.py assemble --request "$REQUEST"
      - name: Save verified chunks even after a failed import
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/approved-bergs-alcaraz-shanghai-2026-r3-chunks
          key: approved-bergs-alcaraz-shanghai-2026-r3-${{ hashFiles('data/approved_reel_imports/bergs-alcaraz-shanghai-2026-r3/request.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload movie to Release and generate native pages
        run: python tools/import_approved_bergs_alcaraz_shanghai.py release --request "$REQUEST"
      - name: Commit verified Release metadata and native pages
        env:
          OUTDIR: ${{ steps.master.outputs.outdir }}
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          # Native spec/QC/ASS/covers remain unchanged; stage only transport/pages.
          git add --sparse "$OUTDIR/render.json" "$OUTDIR/render.before-release.json" "$OUTDIR/copy.html" "$OUTDIR/push.html" "$OUTDIR/release-verification.json" "$OUTDIR/import-provenance.json" data/evidence/bergs-alcaraz-shanghai-2026-r3/final-audio-review-manifest.json
          if git diff --cached --name-only | grep -E '\.(mp4|mp3|mov|mkv|wav)$'; then
            echo '::error::Media accidentally staged; refusing publication'
            exit 1
          fi
          python tools/check_staged_file_sizes.py
          if ! git diff --cached --quiet; then
            git commit -m 'reel: prepare exact Alcaraz Shanghai Release and native publication pages'
          fi
          source tools/git_push_retry.sh
          push_with_rebase_retry main
      - name: Run complete native publication gate
        id: publish_gate
        env:
          OUTDIR: ${{ steps.master.outputs.outdir }}
        run: python tools/auto_push_gate.py --forced --changed "$OUTDIR/render.json"
      - name: Require actual publication gate selection
        if: steps.publish_gate.outputs.found != 'true'
        run: |
          echo '::error::Native forced publication gate did not select the verified Alcaraz Shanghai master'
          exit 1
      - name: Report gate result without sending
        run: |
          echo 'Exact master and review copy remotely verified; original acoustic findings are preserved without a new human-review claim. Main-thread operator must verify the exact reviewed code/assets CI head and the current main native publication gate before dispatching match-reel mode=push push=true once. This workflow sends no message.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: approved-bergs-alcaraz-shanghai-2026-r3-import-diagnostics
          path: |
            output/*/reel/bergs-alcaraz-shanghai-2026-r3/*.json
            output/*/reel/bergs-alcaraz-shanghai-2026-r3/*.ass
          if-no-files-found: ignore
