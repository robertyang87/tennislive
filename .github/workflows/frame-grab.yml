name: Transport exact native Iga Wuhan R3 TTS bundle (isolated)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upload already captured exact native bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/2044ab4c7017e204364a9f7cf84ad79a7ced3017 > /tmp/bundle-blob.json
          python - <<'PY_VERIFY'
          from pathlib import Path
          import json,base64,hashlib,zipfile
          b=base64.b64decode(json.loads(Path('/tmp/bundle-blob.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='6c196df17315935b533aaaa6a8b801ac0d31a3e8e430aa3ade0df23ecab37e66'
          assert len(b)==431626
          p=Path('/tmp/tts_bundle.zip');p.write_bytes(b)
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
          print('Verified captured native bundle bytes',len(b),'6c196df17315935b533aaaa6a8b801ac0d31a3e8e430aa3ade0df23ecab37e66')
          PY_VERIFY
          gh release view reel-tts-swiatek-krueger-wuhan-2026-r3-6c196df17315935b >/dev/null 2>&1 || gh release create reel-tts-swiatek-krueger-wuhan-2026-r3-6c196df17315935b --target '${{ github.sha }}' --title 'swiatek-krueger-wuhan-2026-r3 · 实际配音快照' --notes 'Only native TTS inputs and WordBoundary marks. This is not a film or QC approval.' --latest=false
          gh release upload reel-tts-swiatek-krueger-wuhan-2026-r3-6c196df17315935b /tmp/tts_bundle.zip
