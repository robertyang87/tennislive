name: Preserve finite actual Jodar Medvedev Shanghai SF review evidence (isolated)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Preserve exact finite reviewed archives (transport only)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/8f7d706c17e4d2dd593604c941e558fb3e6f5ed8 > /tmp/blob-0-0.json
          python - <<'PY_ARCHIVE_0'
          from pathlib import Path
          import json,base64,hashlib
          parts=[]
          b=base64.b64decode(json.loads(Path('/tmp/blob-0-0.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='939fa0e624c84c0f273a8cf5cf5f4a6ebe54c0f5b9c2a030cdf7cb835be4d8d8'
          parts.append(b)
          b=b''.join(parts)
          assert len(b)==15388934 and hashlib.sha256(b).hexdigest()=='939fa0e624c84c0f273a8cf5cf5f4a6ebe54c0f5b9c2a030cdf7cb835be4d8d8'
          Path('/tmp/pronunciation-evidence.zip').write_bytes(b)
          print('Exact archive bytes verified',len(b),'939fa0e624c84c0f273a8cf5cf5f4a6ebe54c0f5b9c2a030cdf7cb835be4d8d8')
          PY_ARCHIVE_0
          gh api repos/robertyang87/tennislive/git/blobs/3c266769c85118926df9bb41788aa6fda982a08d > /tmp/blob-1-0.json
          gh api repos/robertyang87/tennislive/git/blobs/b8e1f9cd817dd6d3d21908a281679ca4c401573d > /tmp/blob-1-1.json
          gh api repos/robertyang87/tennislive/git/blobs/f178c1b34175a0af1d73c8182075dfe5229f183a > /tmp/blob-1-2.json
          gh api repos/robertyang87/tennislive/git/blobs/20c7b6f6cb253eeef6dcf919540efb2a4aae4236 > /tmp/blob-1-3.json
          gh api repos/robertyang87/tennislive/git/blobs/fb86445e58124397cba9ae58bb2baf1909c121c3 > /tmp/blob-1-4.json
          gh api repos/robertyang87/tennislive/git/blobs/60326c9db9155596ac2d38b7acb064c3ad817425 > /tmp/blob-1-5.json
          python - <<'PY_ARCHIVE_1'
          from pathlib import Path
          import json,base64,hashlib
          parts=[]
          b=base64.b64decode(json.loads(Path('/tmp/blob-1-0.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='421865dd739cdd5d67f21f2a5a6f57a37db4cef9c467e15384b425e6550fcd89'
          parts.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/blob-1-1.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='9d453322c55b01df746d18f4ff3a92e7305e74ab80daab31ceacd556e92a85fb'
          parts.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/blob-1-2.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='6132480bf14b1ee308f26e5a16e0ac8b3c85a1f7775a4b3d97017b9dd4197716'
          parts.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/blob-1-3.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='9905b9bae584c8ebd385b61fdcee2475af9b0ceff8783a2117a5de3e207c8c30'
          parts.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/blob-1-4.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='4f8177e77a44d6d0f3f70500b3ef54c438e846835b9b9eae178bd725357803ac'
          parts.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/blob-1-5.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='798e716150bd504fb70b5adde87fec855a99c1d132138677a7097d1cd62810b1'
          parts.append(b)
          b=b''.join(parts)
          assert len(b)==86589733 and hashlib.sha256(b).hexdigest()=='68d8ab082f7e5247c09df7ac09cf8098833173bdc552c8f7d737c9247ed74811'
          Path('/tmp/visual-qc-evidence.zip').write_bytes(b)
          print('Exact archive bytes verified',len(b),'68d8ab082f7e5247c09df7ac09cf8098833173bdc552c8f7d737c9247ed74811')
          PY_ARCHIVE_1
          gh release view reel-review-jodar-medvedev-shanghai-2026-sf-bccd141c75a33ea1 >/dev/null 2>&1 || gh release create reel-review-jodar-medvedev-shanghai-2026-sf-bccd141c75a33ea1 --target '${{ github.sha }}' --title 'Jodar Medvedev Shanghai SF finite actual review evidence' --notes 'Actual frozen native pronunciation and sampled actual movie evidence. Transport success is not a review/QC approval or delivery receipt.' --latest=false
          gh release upload reel-review-jodar-medvedev-shanghai-2026-sf-bccd141c75a33ea1 /tmp/pronunciation-evidence.zip /tmp/visual-qc-evidence.zip
