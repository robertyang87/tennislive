name: Transport exact native Ostapenko Wuhan QF TTS bundle (isolated)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upload already captured exact native bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/f41a35c3e79df235335cdc41624e1b9cc05ac18e > /tmp/bundle-blob.json
          python - <<'PY_VERIFY'
          from pathlib import Path
          import json,base64,hashlib,zipfile
          b=base64.b64decode(json.loads(Path('/tmp/bundle-blob.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='bc91d1d69f056e97133ad361d161f02d493587c6d4498a524ddfee10c4c17313'
          assert len(b)==491052
          p=Path('/tmp/tts_bundle.zip');p.write_bytes(b)
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
          print('Verified captured native bundle bytes',len(b),'bc91d1d69f056e97133ad361d161f02d493587c6d4498a524ddfee10c4c17313')
          PY_VERIFY
          gh release view reel-tts-ostapenko-shnaider-wuhan-2026-qf-bc91d1d69f056e97 >/dev/null 2>&1 || gh release create reel-tts-ostapenko-shnaider-wuhan-2026-qf-bc91d1d69f056e97 --target '${{ github.sha }}' --title 'ostapenko-shnaider-wuhan-2026-qf · 实际配音快照' --notes 'Only native TTS inputs and WordBoundary marks. This is not a film or QC approval.' --latest=false
          gh release upload reel-tts-ostapenko-shnaider-wuhan-2026-qf-bc91d1d69f056e97 /tmp/tts_bundle.zip
