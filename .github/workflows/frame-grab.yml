name: frame-grab

# 从一条 YouTube 视频里抽候选帧，用来给某一屏配图。
#
# 为什么要有这条：YouTube 对机房 IP 一律「Sign in to confirm you're not a bot」，
# 沙箱里 yt-dlp 拿到 403 或 DRM 报错。runner 上有整套解法（bgutil PO token
# provider + YT_COOKIES_TXT），match-reel 一直在用——这条复用同一套。
#
# 产物**提交进仓库**而不是走 artifact：这个沙箱下不动 artifact
# （api.github.com 是 403），帧只能进仓库才看得到。

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube 链接（只用赛事官方或球员官方频道的片子）"
        required: true
      slug:
        description: "落到 output/<日期>/frames/<slug>/"
        required: true
      every:
        description: "每几秒抽一帧"
        default: "2"
      width:
        description: "帧宽（像素）"
        default: "1600"

permissions:
  contents: write

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # output/ 在 HEAD 上就有 1 GB 多，不稀疏检出的话光 checkout 就两分钟。
          # 本次的 outdir 由下面「算目录」那一步 add 回来。
          sparse-checkout: |
            /*
            !output
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        timeout-minutes: 12
        run: |
          # ⚠️ apt 镜像会抽风，而且不是偶发：2026-08-04 两小时内两次——
          # 一次静静烧了 **13 分 42 秒**（那时没有闸），一次被 `timeout-minutes: 6`
          # 掐掉（run 30878555571），而正常只要 **18~53 秒**。
          # 硬超时只把「静静烧半小时」换成「6 分钟红掉、要人重跑」——**方向对了但停在
          # 一半**：卡住的正确处置是换一次重试，不是整趟失败。重跑那趟 34 秒就过了。
          # ⚠️ **第一版写的是 3 × 100 秒，当场把 CI 弄红了**（run 30880649692）：
          # 三次全跑满 100 秒被杀，也就是 apt **一直在推进、只是慢**，不是挂死。
          # 那个 100 秒是按「正常 18~53 秒」拍的，而那是**另一条工作流**的数——
          # ci.yml 这一步正常 25~34 秒，镜像变慢时能到 100 秒以上仍在干活。
          # **把「慢」误判成「挂死」，重试就从救场变成了三倍的浪费。**
          # ⚠️⚠️ **2026-08-18：这句话原来写的是「5.3 分，仍在步骤的 6 分钟超时以内」，
          #    而它把预算算漏了一半——这一步调 `apt_retry` **两次**（update 一次、
          #    install 一次），真正的上界是 2 × 2 × (150s + 10s) = **640 秒 ≈ 10.7 分**。
          #    于是 match-reel 那两步（`timeout-minutes: 5`）连着两趟死在同一个地方：
          #    第 1 次 update 吃满 150 秒 → sleep 10 → 第 2 次跑到第 150 秒那一刻
          #    正好撞上步骤超时（run 32084186086 / 32084758610，00:33:07 报第一次没跑完、
          #    00:35:47 步骤被杀）。**重试在它唯一该起作用的那一次结构性地跑不完。**
          #    步骤超时现在按 `calls × tries × (per + 10)` 反推并留 1 分钟余量，
          #    判据 `test_apt重试的预算不许超过步骤自己的超时` 自己算不硬编。
          # 每次都留 150 秒（正常值的 4~6 倍），只有真挂死才会两次都吃满。
          apt_retry() {
            for i in 1 2; do
              sudo timeout 150 "$@" && return 0
              echo "::warning::apt 第 $i 次没跑完（卡住或超时）：$*"
              sudo dpkg --configure -a || true   # 上一次被 SIGTERM 打断可能留下半装状态
              sleep 10
            done
            echo "::error::apt 两次都没成功：$*"
            return 1
          }
          # ⚠️ **`Acquire::http::Timeout` 是这一行的关键，不是装饰。**
          # 2026-08-18 02:02 那趟 CI（run 32090339473）`apt-get update` **两次各吃满
          # 150 秒**，一个字节的进度都没有——这是 apt 挂在一个不响应的镜像上等
          # 它自己的默认超时（120 秒起）的样子，不是「在推进、只是慢」。
          # 给 apt 自己一个 20 秒的连接超时 ＋ 3 次重试，它会**在我们的 `timeout 150`
          # 之内自己换一个镜像**；没有这两个参数，外层重试只是把同一次挂死再等一遍。
          # ⚠️ 别用它去替代外层的 `apt_retry`：那一层管的是「整条命令挂了」，
          # 这一层管的是「某个 host 不响应」，两层各拦一头。
          apt_retry apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=20
          # ⚠️ **`--no-install-recommends` 不是洁癖，是这一步的耗时本身。**
          # 2026-08-18 `apt-get install ffmpeg` 连着两次吃满 150 秒被杀
          # （run 32085745112：00:46:29 起，00:49:11 和 00:51:51 各报一次没跑完；
          # 同一趟的 `apt-get update` 十几秒就过了，慢的只有 install）。
          # ffmpeg 的 recommends 拖着一整串 VA-API 驱动，而 runner 上根本没有
          # 硬件解码可用——`.claude/hooks/session-start.sh` 早就是这么装的，
          # 只是这半边一直没跟上（「规矩只写在了其中一半」）。
          # `Acquire::Retries=3` 让 apt 自己在一次尝试里换一次镜像，
          # 而不是挂在一个不响应的 host 上等我们的 `timeout` 来杀。
          apt_retry apt-get install -y -qq --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=20 ffmpeg
          # **`[default]` 不是可选的**：它才带 `yt-dlp-ejs`，而解 YouTube 的
          # n challenge 要跑一段 JS。少了它 yt-dlp **不报「装少了」**，而是
          # 格式表里只剩故事板，于是任何选择器（连 `worst`）都匹配不上，
          # 报出来是 `Requested format is not available`——看起来像「这条片子
          # 只有 DRM」。头两趟 run（30791003879 / 30791363067）八个 client
          # 全红，我据此写下「卡在片源」，方向反了。JS 运行时用 runner 自带的
          # node，命令行统一带 `--js-runtimes node`（在 YTDLP_BASE 里）。
          pip install -q -e . "yt-dlp[default]"
          node --version

      # 起不来不算失败——退回 client 梯子，让下载那一步去报真正的原因。
      - name: 起 PO token provider
        id: pot
        continue-on-error: true
        run: |
          pip install -q bgutil-ytdlp-pot-provider
          docker run --name bgutil-pot -d -p 4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider
          for i in $(seq 1 25); do
            if curl -sf http://127.0.0.1:4416/ping >/dev/null; then
              echo "provider 起来了（第 $           次探活）"
              echo "up=1" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 2
          done
          echo "::warning::PO token provider 50 秒内没起来，退回 client 梯子"
          docker logs bgutil-pot 2>&1 | tail -20 || true

      - name: 落 cookies（配了 Secret 才有）
        id: cookies
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "path=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_OUTPUT"
            echo "已写入 cookies（$(wc -l < "$RUNNER_TEMP/yt-cookies.txt") 行）"
          else
            echo "::notice::未配置 YT_COOKIES_TXT，只能靠 PO token + client 梯子"
          fi

      # ⚠️ 要排在抽帧**之前**：sparse-checkout add 会把 HEAD 上那一版先铺回
      # 工作区，反过来会拿旧内容盖掉刚生成的。
      - name: 算目录
        id: paths
        run: |
          OUT_DATE=$(TZ=Asia/Shanghai date +%F)
          OUT_DIR="output/$OUT_DATE/frames/${{ github.event.inputs.slug }}"
          echo "outdir=$OUT_DIR" >> "$GITHUB_OUTPUT"
          git sparse-checkout add "$OUT_DIR" || true
          mkdir -p "$OUT_DIR"

      - name: 抽帧
        env:
          YT_COOKIES: ${{ steps.cookies.outputs.path }}
          # 起来了就让 POT 那三档排在前面（`_ladder()` 按这个变量决定顺序）。
          # 不设的话八档照跑，只是把最可能成的那几档排到了最后。
          YT_POT_PROVIDER: ${{ steps.pot.outputs.up }}
          PYTHONPATH: src
        run: |
          python tools/grab_frames.py "${{ github.event.inputs.url }}" \
            -o "${{ steps.paths.outputs.outdir }}" \
            --every "${{ github.event.inputs.every }}" \
            --width "${{ github.event.inputs.width }}"
          ls -la "${{ steps.paths.outputs.outdir }}" | head -20

      - name: 提交候选帧
        run: |
          OUTDIR="${{ steps.paths.outputs.outdir }}"
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          # 稀疏模式下裸的 git add 只警告、退出码 0，产物会静默丢掉
          git add --sparse "$OUTDIR"
          python tools/check_staged_file_sizes.py
          git diff --cached --quiet && { echo "没有新内容"; exit 0; }
          git commit -m "frames: ${{ github.event.inputs.slug }} 候选帧"
          for attempt in $(seq 1 5); do
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            git fetch origin "${{ github.ref_name }}"
            git branch -f grabbed HEAD
            git reset --hard "origin/${{ github.ref_name }}"
            rm -rf "$OUTDIR"
            git checkout grabbed -- "$OUTDIR"
            git add --sparse "$OUTDIR"
            git diff --cached --quiet || git commit -m "frames: ${{ github.event.inputs.slug }} 候选帧"
            sleep $((attempt * 5 + RANDOM % 10))
          done
          echo "::error::连续 5 次推送失败"; exit 1
