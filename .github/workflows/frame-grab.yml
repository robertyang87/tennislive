name: Preserve finite actual Zverev Shanghai SF review evidence (isolated)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Preserve exact finite reviewed archives (transport only)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/c7addf6595f321e4f79399b14a914ddfdfb5f599 > /tmp/blob-0-0.json
          gh api repos/robertyang87/tennislive/git/blobs/c1ed35ec64af90e92911e67cfd237743667b4ec0 > /tmp/blob-0-1.json
          python - <<'PY_ARCHIVE_0'
          from pathlib import Path
          import json,base64,hashlib
          parts=[]
          b=base64.b64decode(json.loads(Path('/tmp/blob-0-0.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='4d2ff82b54021a6343d90ad8573f4f1f546ca6ec5e190cca0e9dae4d6ef98122'
          parts.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/blob-0-1.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='fc129759afcc6555bc08b2e6f9d3623deaabfbe7b0add55623dd6790fa7f3b4a'
          parts.append(b)
          b=b''.join(parts)
          assert len(b)==17470976 and hashlib.sha256(b).hexdigest()=='62e251159d925a0d1aae0dbbaab84eb29e78acb9606fba88166499fcfea6f2a7'
          Path('/tmp/pronunciation-evidence.zip').write_bytes(b)
          print('Exact archive bytes verified',len(b),'62e251159d925a0d1aae0dbbaab84eb29e78acb9606fba88166499fcfea6f2a7')
          PY_ARCHIVE_0
