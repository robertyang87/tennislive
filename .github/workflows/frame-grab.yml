name: Archive Iga title-map source clips and editorial dossier (isolated)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Preserve exact research bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/e608bfd0f0f9785d7300781b3118409c5cce3cb9 > /tmp/part-0.json
          gh api repos/robertyang87/tennislive/git/blobs/32abfa2b763a9f60163075fcffae50032463c558 > /tmp/part-1.json
          gh api repos/robertyang87/tennislive/git/blobs/a6cef3bda23a9ede5b837f296ce26e8be329b90e > /tmp/part-2.json
          gh api repos/robertyang87/tennislive/git/blobs/0d88177268a989cbc8c77d7d907fde1fcc880742 > /tmp/part-3.json
          gh api repos/robertyang87/tennislive/git/blobs/a6e3e788707445c52c287644c0adb79acdd2c3a6 > /tmp/part-4.json
          gh api repos/robertyang87/tennislive/git/blobs/4f132110e27d79473e8c2e975b8bc2940c44fe5c > /tmp/part-5.json
          gh api repos/robertyang87/tennislive/git/blobs/7f8fd7f060c02037e96edc3e6f9e96c9d1a0f4cf > /tmp/part-6.json
          gh api repos/robertyang87/tennislive/git/blobs/c1c8a55d3610ae5f0231869dea0a8f4ca9183ab4 > /tmp/part-7.json
          gh api repos/robertyang87/tennislive/git/blobs/3165b1c00442ec8f41ec6882e7de471e2a32171e > /tmp/part-8.json
          gh api repos/robertyang87/tennislive/git/blobs/9bd0e0db13144aad1801f889af69a44d865277a9 > /tmp/part-9.json
          gh api repos/robertyang87/tennislive/git/blobs/2af1eae4c77334fbf4890df1a13cb686340c5879 > /tmp/part-10.json
          gh api repos/robertyang87/tennislive/git/blobs/681f5d975258aa4eb15b9c1a3dbc973b130a6331 > /tmp/part-11.json
          gh api repos/robertyang87/tennislive/git/blobs/4cd95d3aaa3dc51f77ac62b03401d62cd2d6584e > /tmp/part-12.json
          gh api repos/robertyang87/tennislive/git/blobs/c845c562d6a5f7f9a95a8ed4124cdd615d5a56bc > /tmp/part-13.json
          python - <<'PY_JOIN'
          from pathlib import Path
          import json,base64,hashlib
          pieces=[]
          b=base64.b64decode(json.loads(Path('/tmp/part-0.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='6e9b0783e2c9a22462ad029d55c1d3c458a1946fc903932bc1cd51709b9a4000'
          pieces.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/part-1.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='328f170f68a3ca9d1afbc7a4dc43efd9bcbfd59bd0c11f8e16a326fb770e58ed'
          pieces.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/part-2.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='c90958c8fc581ff8c76ffd17fcd3267a468834f1cd9760ca15d83567fd76f733'
          pieces.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/part-3.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='4a3282aa79298286b382395c366056489af0cb3ac80acf5d0a17fe46cee246aa'
          pieces.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/part-4.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='414fb04ea208cff8166d3f02d659d062ac9737323db5f1bd689ee49406917bc8'
          pieces.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/part-5.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='3ea21f45d9100cdda93f5fbbda787824f501ac6fe643e1f138af23cad7e1dccc'
          pieces.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/part-6.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='7ef8374647d8c6c62bc72642110b574d9c97e6aab3b0481c5938cebd2cc32944'
          pieces.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/part-7.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='8af42b2a0a09ab93850d4db567ef3b6f8cf63a76a45557017324be71671ffc5f'
          pieces.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/part-8.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='d8edbbb24e2e756eb371d9c20bba0be06d72cfcf045fb168781aede3e77ee6fa'
          pieces.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/part-9.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='7e515a6bfdb16b26e073ea767dedab1ead6e35bbfc5ddc0af76f6ed2600dd9b4'
          pieces.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/part-10.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='d67261714c5baf3fd1b922fec4ee8a4c3a0674bb25e0f2cb527f78761204d43b'
          pieces.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/part-11.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='7fd823c0b0b5d9ae2df3adbbcc6abd9b29ed6af4d85a55f354771b93fbd05382'
          pieces.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/part-12.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='2b3e6654a8587d11a7a09fdadf8c7faa6d8999741d9e2456afe5ce9d935b60a6'
          pieces.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/part-13.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='babd0d6e27ac51a9060e0e121d7e3afb46e3345e6c06cbad9d26ead6cff4cce2'
          pieces.append(b)
          b=b''.join(pieces)
          assert len(b)==220737205 and hashlib.sha256(b).hexdigest()=='c69678cf8bc256af753938416d2c4106e87787832dddf10860c4e9282a935730'
          Path('/tmp/swiatek-wta1000-title-map-materials.zip').write_bytes(b)
          print('Exact source-clip bundle verified',len(b))
          PY_JOIN
          gh release upload research-iga-title-map-20261016 /tmp/swiatek-wta1000-title-map-materials.zip
