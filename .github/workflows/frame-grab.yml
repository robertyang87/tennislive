name: Transport exact native Moon R3 TTS bundle (isolated)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upload already captured exact native bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/c3de5d03dc4116f27f7726d9875d5474659f4622 > /tmp/bundle-blob.json
          python - <<'PY_VERIFY'
          from pathlib import Path
          import json,base64,hashlib,zipfile
          b=base64.b64decode(json.loads(Path('/tmp/bundle-blob.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='e35d913c416209be96566582110d4c9d21ce6c170cdebcf8380d7f651b4ad82e'
          assert len(b)==402493
          p=Path('/tmp/tts_bundle.zip');p.write_bytes(b)
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
          print('Verified captured native bundle bytes',len(b),'e35d913c416209be96566582110d4c9d21ce6c170cdebcf8380d7f651b4ad82e')
          PY_VERIFY
          gh release view reel-tts-chwalinska-jovic-wuhan-2026-r3-e35d913c416209be >/dev/null 2>&1 || gh release create reel-tts-chwalinska-jovic-wuhan-2026-r3-e35d913c416209be --target '${{ github.sha }}' --title 'chwalinska-jovic-wuhan-2026-r3 · 实际配音快照' --notes 'Only native TTS inputs and WordBoundary marks. This is not a film or QC approval.' --latest=false
          gh release upload reel-tts-chwalinska-jovic-wuhan-2026-r3-e35d913c416209be /tmp/tts_bundle.zip
