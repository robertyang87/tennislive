          assert len(b)==8765725 and hashlib.sha256(b).hexdigest()=='774166f020d2dff56722b41205cbab7a5a4797833115d4fff5671312eba0a2ec'
          Path('/tmp/pronunciation-evidence.zip').write_bytes(b)
