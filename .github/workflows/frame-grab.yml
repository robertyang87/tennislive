name: Preserve finite actual Iga Wuhan R3 review evidence (isolated)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Preserve exact finite reviewed archives (transport only)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/e50d2cb443dd13f08a492d3d52582d66ef80724f > /tmp/blob-0-0.json
          gh api repos/robertyang87/tennislive/git/blobs/e10a410a90a2ca8f800b8fc66cc9bd3221e493cd > /tmp/blob-0-1.json
          gh api repos/robertyang87/tennislive/git/blobs/016162f79cbd970ecd428e43fa04013def6b3bd8 > /tmp/blob-0-2.json
          python - <<'PY_ARCHIVE_0'
          from pathlib import Path
          import json,base64,hashlib
          parts=[]
          b=base64.b64decode(json.loads(Path('/tmp/blob-0-0.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='b893cd7bb7335396db75f8d24f23a11c4e85d44fab91f70880b941144b7b658b'
          parts.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/blob-0-1.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='4d4e4e7105d1115da39cb29f48cb5d78f41f8cdd96adfb08e73283d67fad700b'
          parts.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/blob-0-2.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='e6144797243a57aff54e13f7a86991c68c110c7189410b018265f71ca93cbc9f'
          parts.append(b)
          b=b''.join(parts)
          assert len(b)==39493953 and hashlib.sha256(b).hexdigest()=='aba912cad51bdcd1f4961a460dad4b31341c388facb805ce16a9449fc55ae83b'
          Path('/tmp/pronunciation-evidence.zip').write_bytes(b)
          print('Exact archive bytes verified',len(b),'aba912cad51bdcd1f4961a460dad4b31341c388facb805ce16a9449fc55ae83b')
