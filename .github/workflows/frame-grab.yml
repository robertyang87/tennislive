name: Transport exact native Zverev Shanghai SF TTS bundle (isolated)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upload already captured exact native bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/50ae1d6b8e4650be51b5a2bf80773f8eeb230fb2 > /tmp/bundle-blob.json
          python - <<'PY_VERIFY'
          from pathlib import Path
          import json,base64,hashlib,zipfile
          b=base64.b64decode(json.loads(Path('/tmp/bundle-blob.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='728ab30f7e1adf68ad32695723b248b97da61941d7720a6a8ce1daeb07902f03'
          assert len(b)==456829
          p=Path('/tmp/tts_bundle.zip');p.write_bytes(b)
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
          print('Verified captured native bundle bytes',len(b),'728ab30f7e1adf68ad32695723b248b97da61941d7720a6a8ce1daeb07902f03')
          PY_VERIFY
          gh release view reel-tts-davidovich-zverev-shanghai-2026-sf-728ab30f7e1adf68 >/dev/null 2>&1 || gh release create reel-tts-davidovich-zverev-shanghai-2026-sf-728ab30f7e1adf68 --target '${{ github.sha }}' --title 'davidovich-zverev-shanghai-2026-sf · 实际配音快照' --notes 'Only native TTS inputs and WordBoundary marks. This is not a film or QC approval.' --latest=false
          gh release upload reel-tts-davidovich-zverev-shanghai-2026-sf-728ab30f7e1adf68 /tmp/tts_bundle.zip
