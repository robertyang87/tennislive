name: Retrieve requested source caption tracks for review
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  captions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -q 'yt-dlp[default]'
      - name: Retrieve English caption tracks without downloading media
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/captions
          ARGS=()
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/yt-cookies.txt"
            ARGS+=(--cookies "$RUNNER_TEMP/yt-cookies.txt")
          fi
          yt-dlp --js-runtimes node --skip-download --ignore-no-formats-error --write-subs --write-auto-subs --sub-langs 'en,en-US,en-orig' --sub-format json3 --write-info-json "${ARGS[@]}" -o '/tmp/captions/%(id)s.%(ext)s' 'https://www.youtube.com/watch?v=402fnpRkS3c'
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('/tmp/captions/402fnpRkS3c.info.json')
          d=json.loads(p.read_text())
          out={'id':d['id'],'title':d['title'],'channel':d.get('channel'),'manual_languages':list(d.get('subtitles')or{}),'automatic_languages':list(d.get('automatic_captions')or{}),'files':[]}
          for f in p.parent.glob('*.json3'):
              out['files'].append({'name':f.name,'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()})
          (p.parent/'caption-retrieval.json').write_text(json.dumps(out,indent=2))
          p.unlink()
          print('Actual English subtitle files:',len(out['files']))
          PY
      - name: Preserve retrieved caption evidence only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG='source-captions-402fnpRkS3c'
          gh release create "$TAG" --target '${{ github.sha }}' --title '402fnpRkS3c source caption evidence' --notes 'Retrieved source caption tracks for cross-check only. Not a completed audio review or video.' --latest=false
          gh release upload "$TAG" /tmp/captions/caption-retrieval.json
          find /tmp/captions -maxdepth 1 -type f -name '*.json3' -exec gh release upload "$TAG" {} +
