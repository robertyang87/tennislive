name: Collect official Iga title ceremony sources (isolated)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Acquire public official ceremony sources once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          set -euo pipefail
          pip install -q 'yt-dlp[default]'
          if ! command -v ffmpeg >/dev/null; then pip install -q imageio-ffmpeg; python -c "import imageio_ffmpeg,os;os.symlink(imageio_ffmpeg.get_ffmpeg_exe(),'/usr/local/bin/ffmpeg')"; fi
          printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/cookies.txt"
          mkdir -p /tmp/iga-ceremony
          python - <<'PY_MEDIA'
          import concurrent.futures,hashlib,json,subprocess,os
          from pathlib import Path
          root=Path('/tmp/iga-ceremony')
          targets=[('doha','_nXPuqvyrfY',{'QTF Clips'})]
          def one(t):
              event,vid,allowed=t
              args=['yt-dlp','--js-runtimes','node','--cookies',os.environ['RUNNER_TEMP']+'/cookies.txt','--socket-timeout','25','--retries','1']
              try:
                  d=json.loads(subprocess.check_output(args+['--skip-download','--dump-single-json','https://www.youtube.com/watch?v='+vid]))
                  assert d.get('channel')in allowed or d.get('uploader')in allowed,(d.get('channel'),d.get('uploader'))
                  raw=root/(vid+'.raw.json');raw.write_text(json.dumps(d))
                  subprocess.run(args+['--load-info-json',str(raw),'-f','bv*[height<=1080][ext=mp4]+ba[ext=m4a]/b[ext=mp4]/b','--merge-output-format','mp4','--remux-video','mp4','-o',str(root/(vid+'.%(ext)s'))],check=True)
                  out=root/(vid+'.mp4');assert out.exists()
                  keep={k:d.get(k)for k in ['id','title','uploader','uploader_id','channel','channel_id','webpage_url','duration','upload_date']}
                  keep.update(event=event,sha256=hashlib.file_digest(out.open('rb'),'sha256').hexdigest(),bytes=out.stat().st_size,filename=out.name,visual_status='awaiting_finite_frame_review')
                  raw.unlink()
                  (root/(vid+'.json')).write_text(json.dumps(keep,indent=2)+'\n');print(json.dumps(keep),flush=True)
                  return keep
              except Exception as e:
                  result={'event':event,'id':vid,'error':str(e)};print(json.dumps(result),flush=True);return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=2)as ex:results=list(ex.map(one,targets))
          (root/'native-results-doha.json').write_text(json.dumps(results,indent=2)+'\n')
          PY_MEDIA
          TAG=research-iga-title-map-20261016
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title 'Research assets: Iga latest eight WTA1000 titles' --notes 'Official source footage collected for an editorial asset dossier; no finished video or messaging publication.'
          gh release upload "$TAG" /tmp/iga-ceremony/*.mp4 /tmp/iga-ceremony/*.json
