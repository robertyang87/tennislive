name: Preserve exact Jodar Medvedev semifinal official source (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/tennislive-sources
          key: reel-src-jodar-medvedev-d5e9b36f39e8470b
          fail-on-cache-miss: true
      - name: Preserve the actual native-probed source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY_SOURCE'
          from pathlib import Path
          import json,hashlib,shutil
          source=Path.home()/'.cache/tennislive-sources/d36a1ec214289256.mp4'
          assert source.is_file() and source.stat().st_size==58208673
          folder=Path('/tmp/official-source');folder.mkdir()
          sha=hashlib.sha256(source.read_bytes()).hexdigest()
          shutil.copyfile(source,folder/'aE21b2-ef-Y.mp4')
          shutil.copyfile(source,folder/f'aE21b2-ef-Y-{sha[:16]}.mp4')
          manifest={'source_url':'https://www.youtube.com/watch?v=aE21b2-ef-Y','native_probe_run':39036715783,'source_sha256':sha,'bytes':source.stat().st_size,'publication_approved':False,'retrieval':'restore pre-existing GitHub Actions source cache only; no YouTube network access','immutable_filename':f'aE21b2-ef-Y-{sha[:16]}.mp4'}
          (folder/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest))
          PY_SOURCE
          gh release view source-aE21b2-ef-Y >/dev/null 2>&1 || gh release create source-aE21b2-ef-Y --title 'Exact ATP Jodar Medvedev semifinal official source' --notes 'Actual native probe source bytes, not a completed production or QC approval.' --latest=false --target '${{ github.sha }}'
          gh release upload source-aE21b2-ef-Y /tmp/official-source/*.mp4 /tmp/official-source/manifest.json
