name: Preserve official Shanghai semifinal source and dual ASR
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source_asr:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/source_asr.py
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-small.en-medium.en-v1
      - name: Fetch verified public official source and preserve exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_URL: "https://video2.atptour.com/media/v1/pmp4/static/clear/6057277721001/1f42a749-22a7-4e6e-9e7d-051efbdfd9fc/2caa37c8-ed6b-4157-becb-d28ebb93b410/main.mp4"
        run: |
          set -euo pipefail
          mkdir -p /tmp/official
          curl -sSL --fail --max-time 180 "$SOURCE_URL" -o /tmp/official/6407012514112-1c5459904fb36909.mp4
          python - <<'PY_SOURCE'
          from pathlib import Path
          import hashlib,json
          p=Path('/tmp/official/6407012514112-1c5459904fb36909.mp4');assert p.stat().st_size==80787665
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='1c5459904fb369096020dca00b48dc658db723dd3cf7e49bf88d8387ffebe089'
          Path('/tmp/official/manifest.json').write_text('{\n  "source": "official Rolex Shanghai Masters public Brightcove MP4",\n  "canonical_player_url": "https://players.brightcove.net/6057277721001/xO4H0ZXngd_default/index.html?videoId=6407012514112",\n  "official_listing_url": "https://en.rolexshanghaimasters.com/en/media/videos",\n  "video_id": "6407012514112",\n  "source_sha256": "1c5459904fb369096020dca00b48dc658db723dd3cf7e49bf88d8387ffebe089",\n  "bytes": 80787665,\n  "width": 1280,\n  "height": 720,\n  "fps": "50/1",\n  "duration": "303.105000",\n  "native_1080_source_claimed": false,\n  "actual_media_url": "https://video2.atptour.com/media/v1/pmp4/static/clear/6057277721001/1f42a749-22a7-4e6e-9e7d-051efbdfd9fc/2caa37c8-ed6b-4157-becb-d28ebb93b410/main.mp4",\n  "immutable_filename": "6407012514112-1c5459904fb36909.mp4",\n  "release_tag": "source-shanghai-jodar-medvedev-2026-sf",\n  "publication_approved": false\n}\n')
          print('Exact source SHA and bytes verified')
          PY_SOURCE
          gh release create source-shanghai-jodar-medvedev-2026-sf --target '${{ github.sha }}' --title 'Official Shanghai Jodar Medvedev semifinal source' --notes 'Exact public official tournament video and dual ASR; does not approve production or publication.' --latest=false
          gh release upload source-shanghai-jodar-medvedev-2026-sf /tmp/official/6407012514112-1c5459904fb36909.mp4 /tmp/official/manifest.json
      - name: Install transcription runtime
        run: pip install -q faster-whisper
      - name: Transcribe actual whole official source with two English models
        run: |
          set -euo pipefail
          for MODEL in small.en medium.en; do
            python tools/source_asr.py --source /tmp/official/6407012514112-1c5459904fb36909.mp4 --model "$MODEL" --out "/tmp/official/$MODEL.json"
          done
      - name: Preserve exact raw dual ASR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload source-shanghai-jodar-medvedev-2026-sf /tmp/official/small.en.json /tmp/official/medium.en.json
