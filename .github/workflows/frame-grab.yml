name: Transport exact native Jodar Medvedev Shanghai SF TTS bundle (isolated)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upload already captured exact native bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/5782b7c19f8910aeeec07d5805275a62756e9461 > /tmp/bundle-blob.json
          python - <<'PY_VERIFY'
          from pathlib import Path
          import json,base64,hashlib,zipfile
          b=base64.b64decode(json.loads(Path('/tmp/bundle-blob.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='bccd141c75a33ea1e0f43aaddb407994cdb0a8d8dc6ef843ff0cc4f206dd2c66'
          assert len(b)==424686
          p=Path('/tmp/tts_bundle.zip');p.write_bytes(b)
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
          print('Verified captured native bundle bytes',len(b),'bccd141c75a33ea1e0f43aaddb407994cdb0a8d8dc6ef843ff0cc4f206dd2c66')
          PY_VERIFY
          gh release view reel-tts-jodar-medvedev-shanghai-2026-sf-bccd141c75a33ea1 >/dev/null 2>&1 || gh release create reel-tts-jodar-medvedev-shanghai-2026-sf-bccd141c75a33ea1 --target '${{ github.sha }}' --title 'jodar-medvedev-shanghai-2026-sf · 实际配音快照' --notes 'Only native TTS inputs and WordBoundary marks. This is not a film or QC approval.' --latest=false
          gh release upload reel-tts-jodar-medvedev-shanghai-2026-sf-bccd141c75a33ea1 /tmp/tts_bundle.zip
