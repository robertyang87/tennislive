name: Transport exact native Davidovich Fokina Jodar Shanghai Final TTS bundle (isolated)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upload already captured exact native bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/2bd31c544880b468db92593bd8e78701fc2b489c > /tmp/bundle-blob.json
          python - <<'PY_VERIFY'
          from pathlib import Path
          import json,base64,hashlib,zipfile
          b=base64.b64decode(json.loads(Path('/tmp/bundle-blob.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='e918bceb8e1e258c3dbde186b002ea5a6710d3d68c368bc4a377e75c8962d8b5'
          assert len(b)==886365
          p=Path('/tmp/tts_bundle.zip');p.write_bytes(b)
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
          print('Verified captured native bundle bytes',len(b),'e918bceb8e1e258c3dbde186b002ea5a6710d3d68c368bc4a377e75c8962d8b5')
          PY_VERIFY
          gh release view reel-tts-davidovichfokina-jodar-shanghai-2026-final-e918bceb8e1e258c >/dev/null 2>&1 || gh release create reel-tts-davidovichfokina-jodar-shanghai-2026-final-e918bceb8e1e258c --target '${{ github.sha }}' --title 'davidovichfokina-jodar-shanghai-2026-final · 实际配音快照' --notes 'Only native TTS inputs and WordBoundary marks. This is not a film or QC approval.' --latest=false
          gh release upload reel-tts-davidovichfokina-jodar-shanghai-2026-final-e918bceb8e1e258c /tmp/tts_bundle.zip
