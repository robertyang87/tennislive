name: Restore exact approved Zheng release asset
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify previously approved film
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          chunks=sorted(Path('assets/recovery/zheng-approved-20261004').glob('chunk-*.bin'))
          assert len(chunks)==13, len(chunks)
          film=Path('/tmp/zheng-kalinskaya-beijing-2026-r2.mp4')
          with film.open('wb') as f:
              for c in chunks:
                  f.write(c.read_bytes())
          assert film.stat().st_size==67113729
          sha=hashlib.sha256(film.read_bytes()).hexdigest()
          assert sha=='775b10396cb8622f1d6a7f950702f7f48d1a97d563122ce9f2b7fa2030900236',sha
          print('Exact previously approved film verified:',sha,film.stat().st_size)
          PY
      - name: Restore empty stable release without overwriting newer assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api repos/robertyang87/tennislive/releases/402706324 --jq '[.assets[] | select(.name=="zheng-kalinskaya-beijing-2026-r2.mp4")] | length')
          test "$count" = 0
          gh release upload reel-zheng-kalinskaya-beijing-2026-r2 /tmp/zheng-kalinskaya-beijing-2026-r2.mp4 --repo robertyang87/tennislive
          mkdir /tmp/verify-approved
          gh release download reel-zheng-kalinskaya-beijing-2026-r2 --repo robertyang87/tennislive --pattern zheng-kalinskaya-beijing-2026-r2.mp4 --dir /tmp/verify-approved
          echo '775b10396cb8622f1d6a7f950702f7f48d1a97d563122ce9f2b7fa2030900236  /tmp/verify-approved/zheng-kalinskaya-beijing-2026-r2.mp4' | sha256sum --check
          gh api repos/robertyang87/tennislive/releases/402706324 --jq '.assets[] | select(.name=="zheng-kalinskaya-beijing-2026-r2.mp4") | {id,name,size,digest}'
