name: Verify current Iga source uploader identity (isolated)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read original public video metadata only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          set -euo pipefail
          pip install -q 'yt-dlp[default]'
          printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/cookies.txt"
          yt-dlp --js-runtimes node --cookies "$RUNNER_TEMP/cookies.txt" --skip-download --dump-single-json 'https://www.youtube.com/watch?v=O8f_vcT29uY' > "$RUNNER_TEMP/raw.json"
          python - <<'PY_META'
          import json,os,datetime
          from pathlib import Path
          d=json.loads(Path(os.environ['RUNNER_TEMP'],'raw.json').read_text())
          keys=['id','title','uploader','uploader_id','uploader_url','channel','channel_id','channel_url','webpage_url','duration','upload_date','timestamp','availability']
          result={k:d.get(k)for k in keys}
          result['checked_at']=datetime.datetime.now(datetime.UTC).isoformat()
          assert result['id']=='O8f_vcT29uY'
          Path('/tmp/source_identity.json').write_text(json.dumps(result,indent=2)+'
')
          print(json.dumps(result))
          PY_META
          gh release upload source-O8f_vcT29uY /tmp/source_identity.json
