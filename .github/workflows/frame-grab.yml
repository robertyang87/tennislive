name: Fetch exact official source oembed metadata (isolated)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch actual YouTube metadata only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl -sSL --fail --max-time 30 'https://www.youtube.com/oembed?url=https%3A%2F%2Fwww.youtube.com%2Fwatch%3Fv%3DuI4UCjY34b4&format=json' -o /tmp/youtube-oembed.json
          python -c "import json; x=json.load(open('/tmp/youtube-oembed.json')); assert x['author_name']=='WTA'; print(x['author_name'],x['title'])"
          gh release upload source-uI4UCjY34b4 /tmp/youtube-oembed.json
