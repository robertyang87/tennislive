name: Preserve exact Zverev Shanghai semifinal official source (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/tennislive-sources
          key: reel-src-davidovich-zverev-shanghai-2026-sf-3690eb3ba5130e1e
          fail-on-cache-miss: true
      - name: Preserve the actual native-probed source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY_SOURCE'
          from pathlib import Path
          import json,hashlib,shutil
          source=Path.home()/'.cache/tennislive-sources/f6e5c86cb5f4cd62.mp4'
          assert source.is_file() and source.stat().st_size>0
          folder=Path('/tmp/official-source');folder.mkdir()
          sha=hashlib.sha256(source.read_bytes()).hexdigest()
          shutil.copyfile(source,folder/'NKFVL_lELNE.mp4')
          shutil.copyfile(source,folder/f'NKFVL_lELNE-{sha[:16]}.mp4')
          manifest={'source_url':'https://www.youtube.com/watch?v=NKFVL_lELNE','native_probe_run':39028782835,'source_sha256':sha,'bytes':source.stat().st_size,'publication_approved':False,'immutable_filename':f'NKFVL_lELNE-{sha[:16]}.mp4'}
          (folder/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest))
          PY_SOURCE
          curl -sSL --fail --max-time 30 'https://www.youtube.com/oembed?url=https%3A%2F%2Fwww.youtube.com%2Fwatch%3Fv%3DNKFVL_lELNE&format=json' -o /tmp/official-source/youtube-oembed.json || echo 'Official oembed unavailable; verify actual court and official facts.'
          gh release view source-NKFVL_lELNE >/dev/null 2>&1 || gh release create source-NKFVL_lELNE --title 'Exact WTA Zverev Shanghai semifinal official source' --notes 'Actual native probe source bytes, not a completed production or QC approval.' --latest=false --target '${{ github.sha }}'
          gh release upload source-NKFVL_lELNE /tmp/official-source/*
