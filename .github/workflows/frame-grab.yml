name: Preserve finite actual Chwalinska Wuhan QF review evidence (isolated)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Preserve exact finite reviewed archives (transport only)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/74905be1913ded6237b1708ca9e4a65736f748e3 > /tmp/blob-0-0.json
          gh api repos/robertyang87/tennislive/git/blobs/459174bf2032b6098ff66d74e948f79747c3ff0d > /tmp/blob-0-1.json
          python - <<'PY_ARCHIVE_0'
          from pathlib import Path
          import json,base64,hashlib
          parts=[]
          b=base64.b64decode(json.loads(Path('/tmp/blob-0-0.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='5dc93f232043988338230d14b1ac10a02eea0a0f32d289459c7a3374e5ed7d4c'
          parts.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/blob-0-1.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='11c6e97ea98a997deec33548a0504a7147dd796940601b0b0a9bb511f9f5c04a'
          parts.append(b)
          b=b''.join(parts)
          assert len(b)==25670062 and hashlib.sha256(b).hexdigest()=='dad2f5457d6b705b06605fa6577377ee77283856b0d21b8307a8faca5cbdf30d'
          Path('/tmp/pronunciation-evidence.zip').write_bytes(b)
          print('Exact archive bytes verified',len(b),'dad2f5457d6b705b06605fa6577377ee77283856b0d21b8307a8faca5cbdf30d')
          PY_ARCHIVE_0
          gh api repos/robertyang87/tennislive/git/blobs/b9e6aec4f9902fb12a491d859a6a937a4bd9271f > /tmp/blob-1-0.json
          gh api repos/robertyang87/tennislive/git/blobs/a48d7f010ae773ca53216dc1ef3571f0864d45c9 > /tmp/blob-1-1.json
          python - <<'PY_ARCHIVE_1'
          from pathlib import Path
          import json,base64,hashlib
          parts=[]
          b=base64.b64decode(json.loads(Path('/tmp/blob-1-0.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='c54183b4d2e6794b987832c67def007b9eb351cb32fcffc4aa684507bee63970'
          parts.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/blob-1-1.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='b14ca5f56bbc03096251421e6355fb68377d94301d6a52ac1318eb29fe38d4a2'
          parts.append(b)
          b=b''.join(parts)
          assert len(b)==26837906 and hashlib.sha256(b).hexdigest()=='0bfba89ee7ad1832d2a7d79e1893b65f89a7cc6274ec11963e9fce4ebdc76a3b'
          Path('/tmp/visual-qc-evidence.zip').write_bytes(b)
          print('Exact archive bytes verified',len(b),'0bfba89ee7ad1832d2a7d79e1893b65f89a7cc6274ec11963e9fce4ebdc76a3b')
          PY_ARCHIVE_1
          gh release view reel-review-chwalinska-sakkari-wuhan-2026-qf-da9c1b7e5c367c8d >/dev/null 2>&1 || gh release create reel-review-chwalinska-sakkari-wuhan-2026-qf-da9c1b7e5c367c8d --target '${{ github.sha }}' --title 'Chwalinska Wuhan QF finite actual review evidence' --notes 'Actual frozen native pronunciation and sampled actual movie evidence. Transport success is not a review/QC approval or delivery receipt.' --latest=false
          gh release upload reel-review-chwalinska-sakkari-wuhan-2026-qf-da9c1b7e5c367c8d /tmp/pronunciation-evidence.zip /tmp/visual-qc-evidence.zip
