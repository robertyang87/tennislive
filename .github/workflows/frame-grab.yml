name: Transport exact native Zverev Shanghai SF TTS bundle (isolated)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upload already captured exact native bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/d1dcfdf9ef6f80f72760333d5de47b6b2f8dd96e > /tmp/bundle-blob.json
          python - <<'PY_VERIFY'
          from pathlib import Path
          import json,base64,hashlib,zipfile
          b=base64.b64decode(json.loads(Path('/tmp/bundle-blob.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='224043b9cf2a8e5494807da630b4f4039ad18471e79c9e2def59263cfacf00ae'
          assert len(b)==438420
          p=Path('/tmp/tts_bundle.zip');p.write_bytes(b)
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
          print('Verified captured native bundle bytes',len(b),'224043b9cf2a8e5494807da630b4f4039ad18471e79c9e2def59263cfacf00ae')
          PY_VERIFY
          gh release view reel-tts-davidovich-zverev-shanghai-2026-sf-224043b9cf2a8e54 >/dev/null 2>&1 || gh release create reel-tts-davidovich-zverev-shanghai-2026-sf-224043b9cf2a8e54 --target '${{ github.sha }}' --title 'davidovich-zverev-shanghai-2026-sf · 实际配音快照' --notes 'Only native TTS inputs and WordBoundary marks. This is not a film or QC approval.' --latest=false
          gh release upload reel-tts-davidovich-zverev-shanghai-2026-sf-224043b9cf2a8e54 /tmp/tts_bundle.zip
