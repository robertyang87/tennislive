name: Transport exact native Davidovich Fokina Jodar Shanghai Final TTS bundle (isolated)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upload already captured exact native bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/3c9281d2afe91064b5d90a5f34a72f75dff3cbe5 > /tmp/bundle-blob.json
          python - <<'PY_VERIFY'
          from pathlib import Path
          import json,base64,hashlib,zipfile
          b=base64.b64decode(json.loads(Path('/tmp/bundle-blob.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='bd2137c35394dd9ad9aec92dd4aec128d9d427eb5d43b6b3c4ff72a879774326'
          assert len(b)==890419
          p=Path('/tmp/tts_bundle.zip');p.write_bytes(b)
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
          print('Verified captured native bundle bytes',len(b),'bd2137c35394dd9ad9aec92dd4aec128d9d427eb5d43b6b3c4ff72a879774326')
          PY_VERIFY
          gh release view reel-tts-davidovichfokina-jodar-shanghai-2026-final-bd2137c35394dd9a >/dev/null 2>&1 || gh release create reel-tts-davidovichfokina-jodar-shanghai-2026-final-bd2137c35394dd9a --target '${{ github.sha }}' --title 'davidovichfokina-jodar-shanghai-2026-final · 实际配音快照' --notes 'Only native TTS inputs and WordBoundary marks. This is not a film or QC approval.' --latest=false
          gh release upload reel-tts-davidovichfokina-jodar-shanghai-2026-final-bd2137c35394dd9a /tmp/tts_bundle.zip
