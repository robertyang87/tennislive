name: Transport exact native Davidovich Fokina Jodar Shanghai Final TTS bundle (isolated)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upload already captured exact native bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/b5ae945de263a34b32610bb7fa55738ff2596a4e > /tmp/bundle-blob.json
          python - <<'PY_VERIFY'
          from pathlib import Path
          import json,base64,hashlib,zipfile
          b=base64.b64decode(json.loads(Path('/tmp/bundle-blob.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='816d5deffdc351a3011dd8deaed7964cf21af857941271aba1d27304dffa562c'
          assert len(b)==892088
          p=Path('/tmp/tts_bundle.zip');p.write_bytes(b)
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
          print('Verified captured native bundle bytes',len(b),'816d5deffdc351a3011dd8deaed7964cf21af857941271aba1d27304dffa562c')
          PY_VERIFY
          gh release view reel-tts-davidovichfokina-jodar-shanghai-2026-final-816d5deffdc351a3 >/dev/null 2>&1 || gh release create reel-tts-davidovichfokina-jodar-shanghai-2026-final-816d5deffdc351a3 --target '${{ github.sha }}' --title 'davidovichfokina-jodar-shanghai-2026-final · 实际配音快照' --notes 'Only native TTS inputs and WordBoundary marks. This is not a film or QC approval.' --latest=false
          gh release upload reel-tts-davidovichfokina-jodar-shanghai-2026-final-816d5deffdc351a3 /tmp/tts_bundle.zip
