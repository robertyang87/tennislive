name: Transport exact native Ostapenko Wuhan QF TTS bundle (isolated)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upload already captured exact native bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/c46751e76c54ba37db1840b79e39b458b724b10f > /tmp/bundle-blob.json
          python - <<'PY_VERIFY'
          from pathlib import Path
          import json,base64,hashlib,zipfile
          b=base64.b64decode(json.loads(Path('/tmp/bundle-blob.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='f5b30c57e32b340d1b0c05b97d4604dfa3536b4e06f2faf73299daafd57e3560'
          assert len(b)==490751
          p=Path('/tmp/tts_bundle.zip');p.write_bytes(b)
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
          print('Verified captured native bundle bytes',len(b),'f5b30c57e32b340d1b0c05b97d4604dfa3536b4e06f2faf73299daafd57e3560')
          PY_VERIFY
          gh release view reel-tts-ostapenko-shnaider-wuhan-2026-qf-f5b30c57e32b340d >/dev/null 2>&1 || gh release create reel-tts-ostapenko-shnaider-wuhan-2026-qf-f5b30c57e32b340d --target '${{ github.sha }}' --title 'ostapenko-shnaider-wuhan-2026-qf · 实际配音快照' --notes 'Only native TTS inputs and WordBoundary marks. This is not a film or QC approval.' --latest=false
          gh release upload reel-tts-ostapenko-shnaider-wuhan-2026-qf-f5b30c57e32b340d /tmp/tts_bundle.zip
