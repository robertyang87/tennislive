name: Transport exact native Chwalinska Wuhan QF TTS bundle (isolated)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upload already captured exact native bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/0ef01ffb29d80ac2fdb395bbebbf0784bd8cc8c7 > /tmp/bundle-blob.json
          python - <<'PY_VERIFY'
          from pathlib import Path
          import json,base64,hashlib,zipfile
          b=base64.b64decode(json.loads(Path('/tmp/bundle-blob.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='da9c1b7e5c367c8da9e6b251825a1828b8d4691d95f92dd634c54ebb7895378c'
          assert len(b)==572086
          p=Path('/tmp/tts_bundle.zip');p.write_bytes(b)
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
          print('Verified captured native bundle bytes',len(b),'da9c1b7e5c367c8da9e6b251825a1828b8d4691d95f92dd634c54ebb7895378c')
          PY_VERIFY
          gh release view reel-tts-chwalinska-sakkari-wuhan-2026-qf-da9c1b7e5c367c8d >/dev/null 2>&1 || gh release create reel-tts-chwalinska-sakkari-wuhan-2026-qf-da9c1b7e5c367c8d --target '${{ github.sha }}' --title 'chwalinska-sakkari-wuhan-2026-qf · 实际配音快照' --notes 'Only native TTS inputs and WordBoundary marks. This is not a film or QC approval.' --latest=false
          gh release upload reel-tts-chwalinska-sakkari-wuhan-2026-qf-da9c1b7e5c367c8d /tmp/tts_bundle.zip
