name: Preserve exact Iga third-round official source (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/tennislive-sources
          key: reel-src-swiatek-krueger-wuhan-2026-r3-ce1d8846e55b0872
          fail-on-cache-miss: true
      - name: Preserve the actual native-probed source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY_SOURCE'
          from pathlib import Path
          import json,hashlib,shutil
          source=Path.home()/'.cache/tennislive-sources/51ef1328701d1b6c.mp4'
          assert source.is_file() and source.stat().st_size>0
          folder=Path('/tmp/official-source');folder.mkdir()
          sha=hashlib.sha256(source.read_bytes()).hexdigest()
          shutil.copyfile(source,folder/'2JaGT8z3O60.mp4')
          shutil.copyfile(source,folder/f'2JaGT8z3O60-{sha[:16]}.mp4')
          manifest={'source_url':'https://www.youtube.com/watch?v=2JaGT8z3O60','native_probe_run':38747368606,'source_sha256':sha,'bytes':source.stat().st_size,'publication_approved':False,'immutable_filename':f'2JaGT8z3O60-{sha[:16]}.mp4'}
          (folder/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest))
          PY_SOURCE
          curl -sSL --fail --max-time 30 'https://www.youtube.com/oembed?url=https%3A%2F%2Fwww.youtube.com%2Fwatch%3Fv%3D2JaGT8z3O60&format=json' -o /tmp/official-source/youtube-oembed.json || echo 'Official oembed unavailable; match identity requires actual board and official match facts.'
          gh release view source-2JaGT8z3O60 >/dev/null 2>&1 || gh release create source-2JaGT8z3O60 --title 'Exact WTA Iga third-round official source' --notes 'Actual native probe source bytes, not a completed production or QC approval.' --latest=false --target '${{ github.sha }}'
          gh release upload source-2JaGT8z3O60 /tmp/official-source/*
