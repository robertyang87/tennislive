name: Transport exact native Moon R3 TTS bundle (isolated)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upload already captured exact native bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/1f86018826ff528d90f9aaa4497d6060844d866a > /tmp/bundle-blob.json
          python - <<'PY_VERIFY'
          from pathlib import Path
          import json,base64,hashlib,zipfile
          b=base64.b64decode(json.loads(Path('/tmp/bundle-blob.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='940605eabb1e2bd11351c7cf8eca2c0902cac16996017f277464cbe8ea093044'
          assert len(b)==404381
          p=Path('/tmp/tts_bundle.zip');p.write_bytes(b)
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
          print('Verified captured native bundle bytes',len(b),'940605eabb1e2bd11351c7cf8eca2c0902cac16996017f277464cbe8ea093044')
          PY_VERIFY
          gh release view reel-tts-chwalinska-jovic-wuhan-2026-r3-940605eabb1e2bd1 >/dev/null 2>&1 || gh release create reel-tts-chwalinska-jovic-wuhan-2026-r3-940605eabb1e2bd1 --target '${{ github.sha }}' --title 'chwalinska-jovic-wuhan-2026-r3 · 实际配音快照' --notes 'Only native TTS inputs and WordBoundary marks. This is not a film or QC approval.' --latest=false
          gh release upload reel-tts-chwalinska-jovic-wuhan-2026-r3-940605eabb1e2bd1 /tmp/tts_bundle.zip
