name: Transport exact native Moon R3 TTS bundle (isolated)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upload already captured exact native bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/9a50f08d16c3e1a05c508bc464391d57d072f840 > /tmp/bundle-blob.json
          python - <<'PY_VERIFY'
          from pathlib import Path
          import json,base64,hashlib,zipfile
          b=base64.b64decode(json.loads(Path('/tmp/bundle-blob.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='e1fe9b7d6cf9b3588b9be0b593fffc91195a5586546147f60381a9909d8e1ef8'
          assert len(b)==416087
          p=Path('/tmp/tts_bundle.zip');p.write_bytes(b)
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
          print('Verified captured native bundle bytes',len(b),'e1fe9b7d6cf9b3588b9be0b593fffc91195a5586546147f60381a9909d8e1ef8')
          PY_VERIFY
          gh release view reel-tts-chwalinska-jovic-wuhan-2026-r3-e1fe9b7d6cf9b358 >/dev/null 2>&1 || gh release create reel-tts-chwalinska-jovic-wuhan-2026-r3-e1fe9b7d6cf9b358 --target '${{ github.sha }}' --title 'chwalinska-jovic-wuhan-2026-r3 · 实际配音快照' --notes 'Only native TTS inputs and WordBoundary marks. This is not a film or QC approval.' --latest=false
          gh release upload reel-tts-chwalinska-jovic-wuhan-2026-r3-e1fe9b7d6cf9b358 /tmp/tts_bundle.zip
