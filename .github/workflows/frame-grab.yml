name: Transport exact native Swiatek Wuhan QF TTS bundle (isolated)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upload already captured exact native bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/9a0c32d0d5bf105ddd8724407beeb8090da09ee5 > /tmp/bundle-blob.json
          python - <<'PY_VERIFY'
          from pathlib import Path
          import json,base64,hashlib,zipfile
          b=base64.b64decode(json.loads(Path('/tmp/bundle-blob.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='14af885578f8b30a96654521ae767a50c26b5e59bd70cd9881ca3322ebdf5258'
          assert len(b)==469769
          p=Path('/tmp/tts_bundle.zip');p.write_bytes(b)
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
          print('Verified captured native bundle bytes',len(b),'14af885578f8b30a96654521ae767a50c26b5e59bd70cd9881ca3322ebdf5258')
          PY_VERIFY
          gh release view reel-tts-swiatek-li-wuhan-2026-qf-14af885578f8b30a >/dev/null 2>&1 || gh release create reel-tts-swiatek-li-wuhan-2026-qf-14af885578f8b30a --target '${{ github.sha }}' --title 'swiatek-li-wuhan-2026-qf · 实际配音快照' --notes 'Only native TTS inputs and WordBoundary marks. This is not a film or QC approval.' --latest=false
          gh release upload reel-tts-swiatek-li-wuhan-2026-qf-14af885578f8b30a /tmp/tts_bundle.zip
