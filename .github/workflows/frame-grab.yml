name: frame-grab

# 从一条 YouTube 视频里抽候选帧，用来给某一屏配图。
#
# 为什么要有这条：YouTube 对机房 IP 一律「Sign in to confirm you're not a bot」，
# 沙箱里 yt-dlp 拿到 403 或 DRM 报错。runner 上有整套解法（bgutil PO token
# provider + YT_COOKIES_TXT），match-reel 一直在用——这条复用同一套。
#
# 产物**提交进仓库**而不是走 artifact：这个沙箱下不动 artifact
# （api.github.com 是 403），帧只能进仓库才看得到。

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube 链接（只用赛事官方或球员官方频道的片子）"
        required: true
      slug:
        description: "落到 output/<日期>/frames/<slug>/"
        required: true
      every:
        description: "每几秒抽一帧"
        default: "2"
      width:
        description: "帧宽（像素）"
        default: "1600"

permissions:
  contents: write

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # output/ 在 HEAD 上就有 1 GB 多，不稀疏检出的话光 checkout 就两分钟。
          # 本次的 outdir 由下面「算目录」那一步 add 回来。
          sparse-checkout: |
            /*
            !output
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -e . yt-dlp

      # 起不来不算失败——退回 client 梯子，让下载那一步去报真正的原因。
      - name: 起 PO token provider
        continue-on-error: true
        run: |
          pip install -q bgutil-ytdlp-pot-provider
          docker run --name bgutil-pot -d -p 4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider
          for i in $(seq 1 25); do
            if curl -sf http://127.0.0.1:4416/ping >/dev/null; then
              echo "provider 起来了（第 ${i} 次探活）"; exit 0
            fi
            sleep 2
          done
          echo "::warning::PO token provider 50 秒内没起来，退回 client 梯子"
          docker logs bgutil-pot 2>&1 | tail -20 || true

      - name: 落 cookies（配了 Secret 才有）
        id: cookies
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "path=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_OUTPUT"
            echo "已写入 cookies（$(wc -l < "$RUNNER_TEMP/yt-cookies.txt") 行）"
          else
            echo "::notice::未配置 YT_COOKIES_TXT，只能靠 PO token + client 梯子"
          fi

      # ⚠️ 要排在抽帧**之前**：sparse-checkout add 会把 HEAD 上那一版先铺回
      # 工作区，反过来会拿旧内容盖掉刚生成的。
      - name: 算目录
        id: paths
        run: |
          OUT_DATE=$(TZ=Asia/Shanghai date +%F)
          OUT_DIR="output/$OUT_DATE/frames/${{ github.event.inputs.slug }}"
          echo "outdir=$OUT_DIR" >> "$GITHUB_OUTPUT"
          git sparse-checkout add "$OUT_DIR" || true
          mkdir -p "$OUT_DIR"

      - name: 抽帧
        env:
          YT_COOKIES: ${{ steps.cookies.outputs.path }}
          PYTHONPATH: src
        run: |
          python tools/grab_frames.py "${{ github.event.inputs.url }}" \
            -o "${{ steps.paths.outputs.outdir }}" \
            --every "${{ github.event.inputs.every }}" \
            --width "${{ github.event.inputs.width }}"
          ls -la "${{ steps.paths.outputs.outdir }}" | head -20

      - name: 提交候选帧
        run: |
          OUTDIR="${{ steps.paths.outputs.outdir }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 稀疏模式下裸的 git add 只警告、退出码 0，产物会静默丢掉
          git add --sparse "$OUTDIR"
          python tools/check_staged_file_sizes.py
          git diff --cached --quiet && { echo "没有新内容"; exit 0; }
          git commit -m "frames: ${{ github.event.inputs.slug }} 候选帧"
          for attempt in $(seq 1 5); do
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            git fetch origin "${{ github.ref_name }}"
            git branch -f grabbed HEAD
            git reset --hard "origin/${{ github.ref_name }}"
            rm -rf "$OUTDIR"
            git checkout grabbed -- "$OUTDIR"
            git add --sparse "$OUTDIR"
            git diff --cached --quiet || git commit -m "frames: ${{ github.event.inputs.slug }} 候选帧"
            sleep $((attempt * 5 + RANDOM % 10))
          done
          echo "::error::连续 5 次推送失败"; exit 1
