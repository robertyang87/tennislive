name: Preserve finite actual Moon R3 V3 review evidence (isolated)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Preserve exact finite reviewed archives (transport only)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/36b281e8c9a6f2af13283a53fb2347ec10d3a2a7 > /tmp/blob-0-0.json
          gh api repos/robertyang87/tennislive/git/blobs/74d716195a5802fee3865a10820e07589127ea71 > /tmp/blob-0-1.json
          python - <<'PY_ARCHIVE_0'
          from pathlib import Path
          import json,base64,hashlib
          parts=[]
          b=base64.b64decode(json.loads(Path('/tmp/blob-0-0.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='d22cfa9ca032b50eae686688a35be33452f37f66e5f6e1af205ac209b3ea9d41'
          parts.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/blob-0-1.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='22369bf381fc842837240ed17ed6322d3d17a9958f23395b903cedb2b507a46c'
          parts.append(b)
          b=b''.join(parts)
          assert len(b)==22094275 and hashlib.sha256(b).hexdigest()=='aaa7e7ed18ab48c42f4f130c4ba67fb35ce6b6ae88b5140fb93541b7aebd7e38'
          Path('/tmp/pronunciation-evidence.zip').write_bytes(b)
          print('Exact archive bytes verified',len(b),'aaa7e7ed18ab48c42f4f130c4ba67fb35ce6b6ae88b5140fb93541b7aebd7e38')
          PY_ARCHIVE_0
          gh api repos/robertyang87/tennislive/git/blobs/d75be49500aea926003d058e602ddea1642910fc > /tmp/blob-1-0.json
          gh api repos/robertyang87/tennislive/git/blobs/cb560f7fb756e4fa4c3ce230ca5362035676dec5 > /tmp/blob-1-1.json
          gh api repos/robertyang87/tennislive/git/blobs/e2f0bda9c98f5037e4134d63cf8a5be8f2898c52 > /tmp/blob-1-2.json
          gh api repos/robertyang87/tennislive/git/blobs/a8c65879c8b67cef8eee1478f64abac4b7374bb2 > /tmp/blob-1-3.json
          gh api repos/robertyang87/tennislive/git/blobs/b6b0162dd5b00f9bc6ab01068f91830a5d683bc9 > /tmp/blob-1-4.json
          python - <<'PY_ARCHIVE_1'
          from pathlib import Path
          import json,base64,hashlib
          parts=[]
          b=base64.b64decode(json.loads(Path('/tmp/blob-1-0.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='0150c9c2cfe727428c0ccb5afa5b48be9375d7dcc6ce3ff439a6755c614d8819'
          parts.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/blob-1-1.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='988f27bc04f27f56312b8e90f930849e1b4b3b940c7e46fd045e630dad1c5c96'
          parts.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/blob-1-2.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='8547b1cdf9136a946f31c1a0d4d22a03bda406e45730c80839a42efc5274d280'
          parts.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/blob-1-3.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='afa6ea3f1cef2fe1ec1a0f515ff318d7b03642fa27bf9f7090328dd6eb35bc20'
          parts.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/blob-1-4.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='538b51e7d8b2d4b75745e09523456082c85887a52740b96bf78e9e88dac18941'
          parts.append(b)
          b=b''.join(parts)
          assert len(b)==83131162 and hashlib.sha256(b).hexdigest()=='151659e82bd72cbed08a608bd19c262e799e308414e03f33b69cf40ec1d6b153'
          Path('/tmp/visual-qc-evidence.zip').write_bytes(b)
          print('Exact archive bytes verified',len(b),'151659e82bd72cbed08a608bd19c262e799e308414e03f33b69cf40ec1d6b153')
          PY_ARCHIVE_1
          gh release view reel-review-chwalinska-jovic-wuhan-2026-r3-e35d913c416209be >/dev/null 2>&1 || gh release create reel-review-chwalinska-jovic-wuhan-2026-r3-e35d913c416209be --target '${{ github.sha }}' --title 'Moon R3 V3 finite actual review evidence' --notes 'Actual frozen V3 pronunciation and sampled actual V3 movie evidence. Transport success is not a review/QC approval or delivery receipt.' --latest=false
          gh release upload reel-review-chwalinska-jovic-wuhan-2026-r3-e35d913c416209be /tmp/pronunciation-evidence.zip /tmp/visual-qc-evidence.zip
