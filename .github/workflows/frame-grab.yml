name: Archive Iga title-map source clips and editorial dossier (isolated)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Preserve exact research bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/e74598500470aec83f4c93770e66c9915ba5ee21 > /tmp/part-0.json
          gh api repos/robertyang87/tennislive/git/blobs/5faf8676e2df0c38981af21ca382ac283fe43d56 > /tmp/part-1.json
          gh api repos/robertyang87/tennislive/git/blobs/685eaee96e90d205f4567428ff84ae18c56f2814 > /tmp/part-2.json
          gh api repos/robertyang87/tennislive/git/blobs/cf3799256fa840fb076f94bb4e150e98fe2e9065 > /tmp/part-3.json
          gh api repos/robertyang87/tennislive/git/blobs/ad783baeb7d6d0cea40e278e8b562477c25676bf > /tmp/part-4.json
          gh api repos/robertyang87/tennislive/git/blobs/a722f84256029b6a6e62ae719db488a9e2ae5659 > /tmp/part-5.json
          gh api repos/robertyang87/tennislive/git/blobs/3602505a8c1c3b0a8fad29c84b557babf5e9de36 > /tmp/part-6.json
          gh api repos/robertyang87/tennislive/git/blobs/49f9464ad3a7a9dc412a87ff746617f75f06536b > /tmp/part-7.json
          gh api repos/robertyang87/tennislive/git/blobs/ff9686acc22039137faae7053520335d536b06aa > /tmp/part-8.json
          gh api repos/robertyang87/tennislive/git/blobs/56b98fad14949d2e641ff787ecf85fa2139d3c8f > /tmp/part-9.json
          gh api repos/robertyang87/tennislive/git/blobs/9b045f0999c4a721353383cef350ac04b60f4950 > /tmp/part-10.json
          gh api repos/robertyang87/tennislive/git/blobs/625f01bfee2429c37229a2b1d8de8c2e985bf0bb > /tmp/part-11.json
          gh api repos/robertyang87/tennislive/git/blobs/d3fe638021edbd2ca4a9f8512d971073ec91f188 > /tmp/part-12.json
          gh api repos/robertyang87/tennislive/git/blobs/f7838931175e77bd70c6df429b874d19de82947e > /tmp/part-13.json
          python - <<'PY_JOIN'
          from pathlib import Path
          import json,base64,hashlib
          pieces=[]
          b=base64.b64decode(json.loads(Path('/tmp/part-0.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='b50b7a4c21a28541b21393ea0454fb3f72ff86001b69416fdafd2e8422227e6d'
          pieces.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/part-1.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='49cc0d664901d4a0863123c37f1c216d636e501006de76d03905fd72ce8ea49e'
          pieces.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/part-2.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='e6135df552d3f46906d69ba8e744395809e3cf72a08762a91fc904c75be3c2ef'
          pieces.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/part-3.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='01f23d78ee072bf136fa0b7c7f78d293fced4fd95b3e9e8024e2c9aa62f985c4'
          pieces.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/part-4.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='e983b710767088d97087abf34eb4eeebcd2c8f03b6fee60266cf41b97ecd2842'
          pieces.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/part-5.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='f2bf46e30af949dae6357570f3d711301bbe2f78eec1d41855e7f3b8f9b2b619'
          pieces.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/part-6.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='a27e9a212f1fcb5afafa6fc0fd827bdc1c0de13ddae53ba14b9de5ca22b6b884'
          pieces.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/part-7.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='c80dde2ffd1b3fb2900ec7091808e4d15932ec6675d0d3e442b20100846c47f9'
          pieces.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/part-8.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='6500aa77b1d8e0b179bd90449bf525b9923c8d34fed39b92ed97230416d34e6d'
          pieces.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/part-9.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='eb4bf320fe7973ab704eeef5b8dce68724413d9fa13bfed87fc5619c8250fab9'
          pieces.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/part-10.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='49c8df70e7ec2326c46b0ae1cb86a8024eef7aabe4df0d11693d7957b5f5dd59'
          pieces.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/part-11.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='10bd1724ee85024838acf2874306c1fcca7709564106a1a9db6100d06a443d6e'
          pieces.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/part-12.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='4ffc4eb3feddbfbd873f3ed9fd0221dd63950e2276f7d79c80e4616caa6a171c'
          pieces.append(b)
          b=base64.b64decode(json.loads(Path('/tmp/part-13.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='108ecf79441ea440b63971cfe09a94084cb5f47d6b8ac8d4504965f25d6e5c9e'
          pieces.append(b)
          b=b''.join(pieces)
          assert len(b)==220617652 and hashlib.sha256(b).hexdigest()=='6cc49b3802648abfc45d3f7d1ebc56673f9ff1e8ba03aa59e4973d226a619ef6'
          Path('/tmp/swiatek-wta1000-title-map-kit.zip').write_bytes(b)
          print('Exact source-clip bundle verified',len(b))
          PY_JOIN
          gh release upload research-iga-title-map-20261016 /tmp/swiatek-wta1000-title-map-kit.zip
