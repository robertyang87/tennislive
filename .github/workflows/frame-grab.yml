name: Transport exact native Davidovich Fokina Jodar Shanghai Final TTS bundle (isolated)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upload already captured exact native bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/640755711e46b24d3909c2ff33ca9c7e013c4517 > /tmp/bundle-blob.json
          python - <<'PY_VERIFY'
          from pathlib import Path
          import json,base64,hashlib,zipfile
          b=base64.b64decode(json.loads(Path('/tmp/bundle-blob.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='8b447189169075b0686289167e011b21060c7dac4b1dcfd7e013a37f1aa1fe14'
          assert len(b)==890461
          p=Path('/tmp/tts_bundle.zip');p.write_bytes(b)
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
          print('Verified captured native bundle bytes',len(b),'8b447189169075b0686289167e011b21060c7dac4b1dcfd7e013a37f1aa1fe14')
          PY_VERIFY
          gh release view reel-tts-davidovichfokina-jodar-shanghai-2026-final-8b447189169075b0 >/dev/null 2>&1 || gh release create reel-tts-davidovichfokina-jodar-shanghai-2026-final-8b447189169075b0 --target '${{ github.sha }}' --title 'davidovichfokina-jodar-shanghai-2026-final · 实际配音快照' --notes 'Only native TTS inputs and WordBoundary marks. This is not a film or QC approval.' --latest=false
          gh release upload reel-tts-davidovichfokina-jodar-shanghai-2026-final-8b447189169075b0 /tmp/tts_bundle.zip
