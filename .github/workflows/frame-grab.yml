name: Transport exact native Davidovich Fokina Jodar Shanghai Final TTS bundle (isolated)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upload already captured exact native bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/git/blobs/1ed432f5e34d4f3744156fe486acac550d16a455 > /tmp/bundle-blob.json
          python - <<'PY_VERIFY'
          from pathlib import Path
          import json,base64,hashlib,zipfile
          b=base64.b64decode(json.loads(Path('/tmp/bundle-blob.json').read_text())['content'])
          assert hashlib.sha256(b).hexdigest()=='1b66f9c6aad24effb68f123bfb3ec7daa7b496bf1260dbd7ec7a79a113ecd81a'
          assert len(b)==890101
          p=Path('/tmp/tts_bundle.zip');p.write_bytes(b)
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
          print('Verified captured native bundle bytes',len(b),'1b66f9c6aad24effb68f123bfb3ec7daa7b496bf1260dbd7ec7a79a113ecd81a')
          PY_VERIFY
          gh release view reel-tts-davidovichfokina-jodar-shanghai-2026-final-1b66f9c6aad24eff >/dev/null 2>&1 || gh release create reel-tts-davidovichfokina-jodar-shanghai-2026-final-1b66f9c6aad24eff --target '${{ github.sha }}' --title 'davidovichfokina-jodar-shanghai-2026-final · 实际配音快照' --notes 'Only native TTS inputs and WordBoundary marks. This is not a film or QC approval.' --latest=false
          gh release upload reel-tts-davidovichfokina-jodar-shanghai-2026-final-1b66f9c6aad24eff /tmp/tts_bundle.zip
