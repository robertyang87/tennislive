name: Restore existing final source cache only (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: ~/.cache/tennislive-sources
          key: reel-src-davidovich-jodar-1970098d7563907c
          fail-on-cache-miss: true
      - name: Install local probe executable
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Verify exact cache match and preserve existing bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MATCHED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
          RESTORE_RUN: ${{ github.run_id }}
          RESTORE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$MATCHED_KEY" = 'reel-src-davidovich-jodar-1970098d7563907c'
          command -v ffprobe
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,subprocess,os,shutil
          root=Path.home()/'.cache/tennislive-sources'
          source=root/'204e033c47f9f2c9.mp4'
          assert source.is_file() and source.stat().st_size==257901027, 'Expected exact existing raw source is missing or size differs; no fallback allowed'
          folder=Path('/tmp/existing-final-source');folder.mkdir()
          digest=hashlib.sha256()
          with source.open('rb') as fh:
              for block in iter(lambda:fh.read(1024*1024),b''):digest.update(block)
          sha=digest.hexdigest()
          probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(source)],text=True))
          video=next(s for s in probe['streams'] if s['codec_type']=='video')
          assert video['width']==1920 and video['height']==1080
          assert abs(float(probe['format']['duration'])-626.149297)<1
          filename=f'woUghsSGrGg-{sha[:16]}.mp4'
          shutil.copyfile(source,folder/filename)
          manifest={'schema_version':1,'operation':'restore_existing_exact_github_cache_only','cache_id':9118411338,'cache_key':os.environ['MATCHED_KEY'],'cache_scope':'refs/heads/main','cache_archive_size':257089334,'native_probe_run':39124463899,'source_url':'https://www.youtube.com/watch?v=woUghsSGrGg','requested_youtube_id':'402fnpRkS3c','is_requested_exact_video':False,'source_publisher_verified':False,'source_publisher_note':'Prior probe logs lack title/channel evidence; no claim of official publisher. No source website contacted during this restoration.','restored_source_path':str(source),'source_sha256':sha,'bytes':source.stat().st_size,'immutable_filename':filename,'raw_ffprobe':probe,'prior_post_conform_probe':{'duration':626.149297,'width':1920,'height':1080,'fps':25},'restore_run':int(os.environ['RESTORE_RUN']),'restore_commit':os.environ['RESTORE_SHA'],'new_source_downloads':0,'publication_approved':False,'cache_inventory':[{'path':str(p.relative_to(root)),'bytes':p.stat().st_size} for p in root.rglob('*') if p.is_file()]}
          (folder/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({k:v for k,v in manifest.items() if k not in ['raw_ffprobe','cache_inventory']},ensure_ascii=False))
          PY
          gh release create cached-source-shanghai-final-20261018-9118411338 --title 'Existing Shanghai final source cache' --notes 'Restoration of exact already existing GitHub cache only. No source website was contacted. Publisher identity and exact requested YouTube identity are not verified. Not a completed production or publication approval.' --latest=false --target "$RESTORE_SHA"
          gh release upload cached-source-shanghai-final-20261018-9118411338 /tmp/existing-final-source/*
