name: frame-grab
on:
  workflow_dispatch:
    inputs:
      url:
        required: true
      slug:
        required: true
permissions:
  contents: write
jobs:
  review_source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/tennislive-sources
          key: reel-src-vacherot-urludpfjfq-d5fa461c6505ba8b
          fail-on-cache-miss: true
      - name: Archive exact cached source for editorial review
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import pathlib, shutil, hashlib, json
          candidates=list((pathlib.Path.home()/'.cache/tennislive-sources').rglob('*.mp4'))
          assert len(candidates)==1, [str(p) for p in candidates]
          shutil.copyfile(candidates[0], 'uRLUdPfjF_Q.mp4')
          p=pathlib.Path('uRLUdPfjF_Q.mp4')
          pathlib.Path('source-review.json').write_text(json.dumps({'source_url':'https://www.youtube.com/watch?v=uRLUdPfjF_Q','sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size},indent=2)+'\n')
          PY
          gh release view source-uRLUdPfjF_Q --repo "$REPOSITORY" >/dev/null 2>&1 || gh release create source-uRLUdPfjF_Q --repo "$REPOSITORY" --title 'Source archive · Vacherot Tokyo' --notes 'Exact cached source used for editorial audio and video review.'
          gh release upload source-uRLUdPfjF_Q uRLUdPfjF_Q.mp4 source-review.json --repo "$REPOSITORY" --clobber
