name: Preserve failed CI diagnostic only (isolated)
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Preserve bounded sanitized actual pytest failure details
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api repos/robertyang87/tennislive/actions/jobs/116902571336/logs > /tmp/ci.log
          python - <<'PY_DIAG'
          import re,json
          from pathlib import Path
          from urllib.parse import urlsplit,urlunsplit
          s=Path('/tmp/ci.log').read_text()
          s=re.sub(r'^\d{4}-[^ ]+ ', '', s, flags=re.M)
          k=s.find('FAILURES'); assert k>=0, 'No pytest failure section'
          end=s.rfind('short test summary info')
          excerpt=s[max(0,k-90):min(len(s),end+16000)] if end>=k else s[max(0,k-90):]
          excerpt=excerpt[:160000]
          excerpt=re.sub(r'https?://[^\s<>]+',lambda m: urlunsplit((*urlsplit(m.group(0))[:3],'','')),excerpt)
          excerpt=re.sub(r'gh[pousr]_[A-Za-z0-9_]+','[REDACTED_GH_TOKEN]',excerpt)
          excerpt='\n'.join(line for line in excerpt.splitlines() if not re.search(r'authorization|extraheader|password|PUSHPLUS_TOKEN',line,re.I))
          Path('/tmp/ci-failure-38879511906.txt').write_text(excerpt)
          print('bounded actual failure details saved',len(excerpt))
          PY_DIAG
          gh release upload reel-review-ostapenko-shnaider-wuhan-2026-qf-bc91d1d69f056e97 /tmp/ci-failure-38879511906.txt
