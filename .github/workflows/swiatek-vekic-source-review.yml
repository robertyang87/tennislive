name: swiatek-vekic-source-review
on:
  push:
    branches: [codex/reel-rGsZ0vrlUns]
    paths: [.github/workflows/swiatek-vekic-source-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/tennislive-sources
          key: reel-src-source-rgsz0vrluns-f02d9c53d937a1c3
          fail-on-cache-miss: true
      - name: Export original 1080p for exact scoreboard review
        run: |
          mkdir review
          python - <<'PYCODE'
          import hashlib,pathlib,shutil,json
          url='https://www.youtube.com/watch?v=rGsZ0vrlUns'
          source=pathlib.Path.home()/'.cache/tennislive-sources'/(hashlib.sha1(url.encode()).hexdigest()[:16]+'.mp4')
          assert hashlib.sha256(source.read_bytes()).hexdigest()=='9ecc50946d9c77dd2ed71d6438ba95213c78b58c93aa15929ad352d5b0bc79b4'
          shutil.copyfile(source,'review/source.mp4')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: swiatek-vekic-original-review
          compression-level: 0
          path: review/
          retention-days: 3
