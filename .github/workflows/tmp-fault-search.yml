name: tmp-fault-search
# 临时：网球有故事 fault-not-out-2026 找官方源片。只在本分支 push 触发，合并前删除。
on:
  push:
    branches: [claude/fault-not-out-2026]
    paths: [research/fault-not-out-2026/queries.txt, .github/workflows/tmp-fault-search.yml]
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/fault-not-out-2026
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "yt-dlp[default]"
      - name: search
        run: |
          python3 - <<'PY'
          import json, subprocess
          for q in open('research/fault-not-out-2026/queries.txt'):
              q=q.strip()
              if not q or q.startswith('#'): continue
              print('\n######', q, flush=True)
              r=subprocess.run(['yt-dlp','--flat-playlist','-J',f'ytsearch15:{q}'],capture_output=True,text=True)
              try: d=json.loads(r.stdout)
              except Exception: print('ERR',r.stderr[-500:]); continue
              for e in d.get('entries',[]):
                  print(f"{e.get('id')} | {e.get('channel')} | {e.get('duration')} | {e.get('title')}", flush=True)
          PY
      - name: captions
        continue-on-error: true
        run: |
          mkdir -p subs
          for id in $(grep -v '^#' research/fault-not-out-2026/caption_ids.txt 2>/dev/null); do
            yt-dlp --skip-download --write-auto-subs --write-subs --sub-langs "en.*" --sub-format vtt -o "subs/%(id)s" "https://www.youtube.com/watch?v=$id" >/dev/null 2>&1 || echo "subs fail $id"
          done
          python3 - <<'PY'
          import glob,re
          for f in sorted(glob.glob('subs/*.vtt')):
              print('\n######', f)
              t=None; last=''
              for line in open(f,encoding='utf-8'):
                  line=line.strip()
                  m=re.match(r'(\d+):(\d+):(\d+\.\d+) -->',line)
                  if m: t=int(m[1])*3600+int(m[2])*60+float(m[3]); continue
                  txt=re.sub(r'<[^>]+>','',line)
                  if txt and txt!=last and t is not None and not txt.startswith(('WEBVTT','Kind:','Language:')):
                      print(f'{t:8.2f} {txt}'); last=txt
          PY
