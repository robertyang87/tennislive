name: yesterday-tennis-point

on:
  schedule:
    # ATP、WTA 官方视频上架时间不同步，六班次独立重试：一方先有素材先推送，
    # 另一方留到下一班次继续找，互不等待。已经成功的巡回赛后续班次会被跳过，
    # 不重复生成也不重复推送（见 cmd_yesterday_point 的 skip_tours 逻辑）。
    # 16:00 / 21:00 两班接欧美下午、晚间才上架的官方剪辑。
    - cron: "0 22 * * *"    # 北京时间 06:00（首班）
    - cron: "0 0 * * *"     # 北京时间 08:00（重试）
    - cron: "0 2 * * *"     # 北京时间 10:00（重试）
    - cron: "0 4 * * *"     # 北京时间 12:00（重试）
    - cron: "0 8 * * *"     # 北京时间 16:00（重试）
    - cron: "0 13 * * *"    # 北京时间 21:00（末班）
  workflow_dispatch:
    inputs:
      date:
        description: "发布日期（YYYY-MM-DD，北京时间；留空=今天）"
        required: false
        default: ""
      force:
        description: "仅验证：忽略仓库内已有成片，重新生成但不提交、不推送"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/yesterday-point.yml"
      - "src/tennislive/video/daily_point.py"
      - "src/tennislive/video/official.py"
      - "src/tennislive/video/pipeline.py"
      - "src/tennislive/cli.py"
      - "tests/test_daily_point.py"

permissions:
  contents: write

concurrency:
  group: yesterday-tennis-point
  cancel-in-progress: false

jobs:
  point:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      TENNISLIVE_YESTERDAY_POINT: "on"
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 手动任务同步最新主分支
        if: github.event_name == 'workflow_dispatch'
        run: git pull --ff-only origin "${{ github.ref_name }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          pip install -q -e ".[dev,video]"
          # yt-dlp 要带 [default] 才有 yt-dlp-ejs：解 YouTube 的 n challenge 要跑一段 JS。
          # 少了它不报「装少了」，而是 n challenge solving failed / Only images available，
          # 于是任何格式选择器都匹配不上，看着像「没有格式」或「cookie 过期」。
          # JS 运行时用 runner 自带的 node。
          pip install -q "yt-dlp[default]"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          node --version

      - name: 校验昨日好球规则
        run: pytest -q tests/test_daily_point.py tests/test_official_video.py

      # 配了 YT_COOKIES_TXT 就把它落成文件：官方 YouTube 取播放源时带 cookie 过机器人
      # 验证（机房 IP 上 cookie 是唯一稳定的解）；没配就只能靠 client 梯子碰运气。
      - name: 落 cookies（配了 Secret 才有）
        id: cookies
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "path=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_OUTPUT"
            echo "已写入 cookies（$(wc -l < "$RUNNER_TEMP/yt-cookies.txt") 行）"
          else
            echo "::notice::未配置 YT_COOKIES_TXT，官方 YouTube 取播放源仍会被机器人验证挡住"
          fi

      # cookie 会过期，过期时的表现和「没配」一模一样，所以真下三秒媒体流验一次，
      # 按日志分因（cookie 失效 vs 缺 ejs），把根因摆到生成之前——别等两分钟跑完才发现。
      # 非致命：验不过也让生成继续（那天照常跳过）。--skip-download 探活是假的：不带
      # cookie 也拿得到标题和格式表，只有真取媒体流才会撞机器人验证。
      - name: 预检 YouTube 取流（配了 cookie 才验）
        if: steps.cookies.outputs.path != ''
        env:
          YT_COOKIES: ${{ steps.cookies.outputs.path }}
        run: |
          URL="https://www.youtube.com/watch?v=jNQXAC9IVRw"
          rm -rf "$RUNNER_TEMP/ytpre" && mkdir -p "$RUNNER_TEMP/ytpre"
          yt-dlp --cookies "$YT_COOKIES" --js-runtimes node \
            --download-sections "*0-3" --force-keyframes-at-cuts \
            -f "bv*[height<=720]+ba/b[height<=720]/b" \
            -o "$RUNNER_TEMP/ytpre/p.%(ext)s" "$URL" 2>&1 \
            | tee "$RUNNER_TEMP/ytpre.log" || true
          FILE=$(ls -S "$RUNNER_TEMP/ytpre" 2>/dev/null | head -1)
          SIZE=0
          [ -n "$FILE" ] && SIZE=$(stat -c%s "$RUNNER_TEMP/ytpre/$FILE" 2>/dev/null || echo 0)
          if [ "${SIZE:-0}" -gt 51200 ]; then
            echo "::notice::YouTube 预检通过：cookie 有效、能取媒体流（$SIZE 字节）"
          elif grep -q "not a bot\|Sign in to confirm" "$RUNNER_TEMP/ytpre.log"; then
            echo "::error::cookie 无效或已过期——重新导一份 YT_COOKIES_TXT（本期 YouTube 源会取不到）"
          elif grep -q "n challenge\|Only images are available" "$RUNNER_TEMP/ytpre.log"; then
            echo "::error::缺 yt-dlp-ejs / JS 运行时，n challenge 解不了（和 cookie 无关）"
          else
            echo "::warning::YouTube 预检没下到媒体流，继续跑但官方 YouTube 源可能取不到"
          fi

      - name: 生成独立视频包
        id: generate
        env:
          # Scope credentials to generation only. Tests and quality gates must
          # never inherit live Tennis TV credentials.
          TENNISTV_JWT: ${{ secrets.TENNISTV_JWT }}
          TENNISTV_REFRESH_TOKEN: ${{ secrets.TENNISTV_REFRESH_TOKEN }}
          # 官方 YouTube 取播放源带上 cookie（落 cookies 步骤写的文件），
          # official._ytdl_opts 读 YT_COOKIES 挂到 yt-dlp。
          YT_COOKIES: ${{ steps.cookies.outputs.path }}
        run: |
          DATE_ARG="${{ github.event.inputs.date }}"
          if [ -z "$DATE_ARG" ]; then DATE_ARG="today"; fi
          DATE_DIR=$(python -c "from tennislive.timeutil import parse_date_arg; print(parse_date_arg('$DATE_ARG').isoformat())")
          OUT_DIR="output/$DATE_DIR/yesterday-point"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ github.event.inputs.force }}" = "true" ]; then
            rm -rf "$OUT_DIR"
            echo "::notice::强制验证模式：使用干净目录重新发现视频；不会提交或 PushPlus 推送"
          fi
          echo "outdir=$OUT_DIR" >> "$GITHUB_OUTPUT"
          # 不清空 OUT_DIR：已提交的 atp/wta 内容要留在工作区，
          # 这样 CLI 才能识别出哪个巡回赛这次该跳过、哪个还要继续找。
          tennislive point --date "$DATE_ARG" --outdir output

      - name: 昨日好球发现记账（来源诊断）
        # 全跳过的日子不提交空包，带 resolver_attempts 台账的顶层 manifest 只落在
        # 工作区/artifact 里；这一步把它升到 Actions 摘要，让「为什么没推」
        # 一眼可见，并把 ATP 主通道的根因（命中卡片却缺 JWT）单独升为 warning。
        if: always() && steps.generate.conclusion == 'success'
        env:
          TENNISTV_JWT: ${{ secrets.TENNISTV_JWT }}
        run: |
          MANIFEST="${{ steps.generate.outputs.outdir }}/manifest.json"
          [ -s "$MANIFEST" ] || exit 0
          jq -r '.resolver_attempts // [] | .[] |
            "· \(.source): 抓取\(.fetched // "-")/命中\(.matched // "-")/" +
            (if .status == "error" then "报错 \(.error)"
             elif .status == "candidate" then "选中"
             else "未选中——\(.note // .status)" end)' "$MANIFEST" \
            | while IFS= read -r line; do echo "::notice::$line"; done
          if [ -z "${TENNISTV_JWT}" ] && jq -e '.resolver_attempts // [] | any(
                .source == "Tennis TV Hot Shots"
                and (.matched // 0) > 0 and .status != "candidate")' \
                "$MANIFEST" >/dev/null; then
            echo "::warning::Tennis TV 命中了昨日比赛的 Hot Shots，但缺 TENNISTV_JWT，无法解析可播放源；配置该 Secret 可打通 ATP 主通道"
          fi

      - name: 严格质量门禁
        run: |
          OUT_DIR="${{ steps.generate.outputs.outdir }}"
          MANIFEST="$OUT_DIR/manifest.json"
          test -s "$MANIFEST"
          STATUS=$(jq -r '.status' "$MANIFEST")
          if [ "$STATUS" = "skipped" ]; then
            echo "::notice::ATP 与 WTA 当日均无可验证的官方完整回合"
            exit 0
          fi
          test "$STATUS" = "pass"
          for TOUR in atp wta; do
            TOUR_UPPER=$(echo "$TOUR" | tr '[:lower:]' '[:upper:]')
            TOUR_STATUS=$(jq -r --arg t "$TOUR_UPPER" '.tours[$t] // "skipped"' "$MANIFEST")
            if [ "$TOUR_STATUS" != "pass" ]; then
              echo "::notice::$TOUR_UPPER 当日无可验证的官方完整回合，跳过该巡回赛门禁"
              continue
            fi
            TDIR="$OUT_DIR/$TOUR"
            TMANIFEST="$TDIR/manifest.json"
            test -s "$TMANIFEST"
            jq -e '
              .status == "pass" and
              .complete_rally.verified == true and
              .complete_rally.montage == false and
              .complete_rally.source_window_ms[0] == 0 and
              .consensus.verified == true and
              (
                (.consensus.rank == 3 and
                 .consensus.score == 100 and
                 .consensus.basis == "official-daily-best" and
                 any(.consensus.signals[];
                     .kind == "official-best-designation" and .scope == "day")) or
                (.consensus.rank == 2 and
                 .consensus.score == 85 and
                 .consensus.basis == "official-match-best" and
                 any(.consensus.signals[];
                     .kind == "official-best-designation" and .scope == "match")) or
                (.consensus.rank == 1 and
                 .consensus.score == 72 and
                 .consensus.basis == "official-hot-shot" and
                 any(.consensus.signals[];
                     .kind == "official-hot-shot" and .scope == "hot-shot")) or
                (.consensus.rank == 0 and
                 .consensus.score == 40 and
                 .consensus.basis == "official-highlights" and
                 any(.consensus.signals[];
                     .kind == "official-highlights" and .scope == "highlights"))
              ) and
              .framing.mode == "contain" and
              .framing.dynamic_tracking_crop == false and
              (.source_resolution | length) == 2
            ' "$TMANIFEST" >/dev/null
            test -s "$TDIR/yesterday-point.mp4"
            test -s "$TDIR/yesterday-point.zh-CN.srt"
            test -s "$TDIR/xiaohongshu.txt"
            test -s "$TDIR/copy.html"
            test -s "$TDIR/push.html"
            test "$(grep -c '^$' "$TDIR/xiaohongshu.txt")" -eq 1
            ! grep -Eq '来源：|图源：|摄影/图源|非商业资料引用' \
              "$TDIR/xiaohongshu.txt" "$TDIR/copy.html" \
              "$TDIR/push.html" "$TDIR/yesterday-point.zh-CN.srt"
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=width,height \
              -of csv=s=x:p=0 "$TDIR/yesterday-point.mp4" | grep -qx '1080x1440'
          done

      - name: 上传独立内容包
        uses: actions/upload-artifact@v4
        with:
          name: yesterday-point-${{ github.run_number }}
          path: ${{ steps.generate.outputs.outdir }}

      - name: 提交成片或 skip 诊断
        id: commit
        if: github.event_name != 'push' && github.event.inputs.force != 'true'
        run: |
          echo "ready=false" >> "$GITHUB_OUTPUT"
          OUT_DIR="${{ steps.generate.outputs.outdir }}"
          STATUS=$(jq -r '.status' "$OUT_DIR/manifest.json")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # skip 也提交：skip.json 记录了每路 resolver 的尝试与失败原因，
          # 落进仓库才不会随 Actions 日志过期而消失。只有 pass 才触发推送。
          git add "$OUT_DIR"
          if git diff --cached --quiet; then
            echo "内容与仓库一致，不重复提交或推送"
            exit 0
          fi
          if [ "$STATUS" = "pass" ]; then
            git commit -m "content: 昨日好球 $(basename "$(dirname "$OUT_DIR")")"
          else
            git commit -m "chore: 昨日好球 skip 诊断 $(basename "$(dirname "$OUT_DIR")")"
          fi
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "${{ github.ref_name }}"
          if [ "$STATUS" = "pass" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: PushPlus 推送昨日 Hot Shots / 最佳回合（只推本次新完成的巡回赛）
        if: steps.commit.outputs.ready == 'true' && env.PUSHPLUS_TOKEN != ''
        continue-on-error: true
        run: |
          OUT_DIR="${{ steps.generate.outputs.outdir }}"
          export TENNISLIVE_ASSET_REV="$(git rev-parse HEAD)"
          # 只推 fresh_tours：之前班次已经推送过的巡回赛即使仍是 pass 也不会
          # 再进这个列表，避免同一份内容重复推送到微信。
          FRESH=$(jq -r '.fresh_tours[]? // empty' "$OUT_DIR/manifest.json" | tr '[:upper:]' '[:lower:]')
          if [ -z "$FRESH" ]; then
            echo "本次没有新完成的巡回赛，跳过推送"
            exit 0
          fi
          for TOUR in $FRESH; do
            tennislive publish pushplus --dir "$OUT_DIR/$TOUR" \
              || echo "::warning::$TOUR PushPlus 推送失败"
          done
