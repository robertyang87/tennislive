name: tmp-douyin-ref
on:
  push:
    branches: [claude/tmp-douyin-ref]
    paths: [.github/workflows/tmp-douyin-ref.yml]
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: scan
        run: |
          pip install -q requests
          mkdir -p out
          python3 - <<'PY' | tee out/pegula_scan.txt
          import requests, time
          H={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36"}
          # references 按 WTA 球员 id 筛：先从文章接口里找 Pegula 的 id
          hits=[]
          for base in ("photo","text"):
              for page in range(0,400):
                  try:
                      d=requests.get(f"https://api.wtatennis.com/content/wta/{base}/EN/?pageSize=100&page={page}",headers=H,timeout=30).json()
                  except Exception as e:
                      print(base,"page",page,"err",e); break
                  items=d.get("content") or []
                  if not items: break
                  for it in items:
                      ld=it.get("leadMedia") or {}
                      t=" ".join(str(x) for x in (it.get("title"),it.get("description"),it.get("imageUrl"),ld.get("title"),ld.get("imageUrl")))
                      tl=t.lower()
                      if "pegula" in tl and "dubai" in tl and "2026" in tl:
                          od=it.get("originalDetails") or ld.get("originalDetails") or {}
                          hits.append((base,it.get("publishFrom"),od.get("width"),od.get("height"),it.get("title"),ld.get("title"),it.get("imageUrl") or ld.get("imageUrl"),it.get("onDemandUrl") or ld.get("onDemandUrl")))
                  last=items[-1].get("publishFrom") or 0
                  if page%20==0: print(base,"page",page,"last",time.strftime("%Y-%m-%d",time.gmtime(int(last)/1000)))
                  if int(last)/1000 < 1771200000: break   # 2026-02-16
          print("### hits",len(hits))
          for h in hits: print(" | ".join(str(x) for x in h))
          PY
          curl -sSL -A "Mozilla/5.0" -o out/pegula_dubai_day7.jpg "https://photoresources.wtatennis.com/wta/photo/2026/10/14/c104339b-6014-4a95-9d1f-5aa260bf57f4/Jessica_Pegula_-_Dubai_Duty_Free_Tennis_Championships_2026_-_Day_7-DSC_1112A.jpg"
          ls -la out
      - name: upload
        if: always()
        run: |
          cd out; find . -size 0 -delete
          for f in *; do gh release upload ref-douyin-7698221105147890959 --clobber "$f" || true; done
