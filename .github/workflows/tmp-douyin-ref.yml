name: tmp-douyin-ref
on:
  push:
    branches: [claude/tmp-douyin-ref]
    paths: [.github/workflows/tmp-douyin-ref.yml]
permissions:
  contents: write
jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      R: https://github.com/robertyang87/tennislive/releases/download
    steps:
      - name: derive
        run: |
          set -euxo pipefail
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null
          mkdir -p out
          curl -sSL -o mt.mp4 "$R/source-wta1000-2026-madrid-trophy/madrid_trophy.mp4"
          # 马德里赛事官方颁奖（madrid_t，本身是 Obv_j6l33nQ 894.0–919.5 截出）15.12–18.04 那一镜：科斯秋克亲吻奖杯，人在画面右侧，
          # 取 x=900 起 810×1080 的 3:4 窗口，原尺寸置于 1920×1080 中央（不缩放）
          ffmpeg -y -ss 15.12 -to 18.04 -i mt.mp4 -vf "crop=810:1080:900:0,pad=1920:1080:555:0:black,setsar=1,fps=25" -c:v libx264 -preset medium -crf 16 -pix_fmt yuv420p -r 25 -c:a aac -b:a 160k -ar 48000 -movflags +faststart out/madrid_kiss.mp4
          ffprobe -v error -show_entries stream=codec_type,width,height,r_frame_rate:format=duration -of compact out/madrid_kiss.mp4
      - name: upload
        run: |
          gh release create source-wta1000-2026-madrid-kiss --title "马德里官方颁奖 madrid_trophy 15.12–18.04 派生（右移 3:4 窗口置中 1920×1080 25fps）" --notes "https://www.youtube.com/watch?v=Obv_j6l33nQ 894.0–919.5s 截出的 madrid_trophy.mp4 再取 15.12–18.04s：科斯秋克亲吻奖杯近景；取 x=900 的 810×1080，原尺寸置中" out/madrid_kiss.mp4
