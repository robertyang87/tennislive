name: tmp-douyin-ref
on:
  push:
    branches: [claude/tmp-douyin-ref]
    paths: [.github/workflows/tmp-douyin-ref.yml]
permissions:
  contents: write
jobs:
  asr:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: asr
        run: |
          pip install -q faster-whisper
          mkdir -p out
          curl -sSL -o clip.mp4 https://github.com/robertyang87/tennislive/releases/download/source-wta1000-2026-dubai-trophy-lift/dubai_trophy_lift.mp4
          python3 - <<'PY'
          import json, hashlib
          from faster_whisper import WhisperModel
          sha = hashlib.sha256(open('clip.mp4','rb').read()).hexdigest()
          for m in ('small.en','medium.en'):
              model = WhisperModel(m, device='cpu', compute_type='int8')
              segs, info = model.transcribe('clip.mp4', language='en', word_timestamps=True, vad_filter=False)
              words = []
              for s in segs:
                  for w in (s.words or []):
                      words.append({'w': w.word, 's': round(w.start, 2), 'e': round(w.end, 2)})
              json.dump({'model': m, 'source_sha256': sha, 'duration': info.duration, 'words': words},
                        open(f'out/dubai_trophy_lift-{m}.json','w'), ensure_ascii=False, indent=1)
              print(m, len(words), ' '.join(f"{w['w']}@{w['s']}" for w in words))
          PY
      - name: upload
        run: for f in out/*; do gh release upload source-wta1000-2026-dubai-trophy-lift --clobber "$f"; done
