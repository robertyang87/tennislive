name: tmp-douyin-ref
on:
  push:
    branches: [claude/tmp-douyin-ref]
    paths: [.github/workflows/tmp-douyin-ref.yml]
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            tools
            src
            data
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: search
        run: |
          pip install -q requests pillow numpy
          mkdir -p out
          export PYTHONPATH=src:tools
          for args in "--player Pegula --event Dubai --date 2026-02-21 --days 3" \
                      "--player Kostyuk --event Madrid --date 2026-05-02 --days 3" \
                      "--player Zheng --event Beijing --date 2026-10-05 --days 2" \
                      "--player Chwalinska --event Wuhan --date 2026-10-18 --days 2"; do
            echo "########## $args" | tee -a out/photo_search.txt
            timeout 600 python3 tools/find_cover_photo.py $args 2>&1 | tee -a out/photo_search.txt || true
          done
          # WTA 照片接口按球员名粗扫（标题含「<名>, <赛事> 2026」）
          python3 - <<'PY' | tee -a out/photo_search.txt
          import requests, re, json
          H={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36"}
          want=[("Pegula","Dubai"),("Kostyuk","Madrid"),("Zheng","Beijing"),("Chwalinska","Wuhan"),("Chwalińska","Wuhan")]
          hits=[]
          for page in range(0,120):
              try:
                  r=requests.get(f"https://api.wtatennis.com/content/wta/photo/EN/?pageSize=100&page={page}",headers=H,timeout=30)
                  d=r.json()
              except Exception as e:
                  print("page",page,"err",e); break
              items=d.get("content") or []
              if not items: break
              for it in items:
                  t=(it.get("title") or "")+" "+(it.get("description") or "")+" "+(it.get("imageUrl") or "")
                  for p,e in want:
                      if p.lower() in t.lower() and e.lower() in t.lower() and "2026" in t:
                          od=it.get("originalDetails") or {}
                          hits.append((p,e,it.get("publishFrom"),od.get("width"),od.get("height"),it.get("title"),(it.get("description") or "")[:200],it.get("imageUrl")))
              last=items[-1].get("publishFrom")
              if page%10==0: print("page",page,"last",last)
              if last and str(last)[:7] < "2026-02": break
          print("### WTA photo API hits", len(hits))
          for h in hits: print(" | ".join(str(x) for x in h))
          PY
      - name: upload
        if: always()
        run: gh release upload ref-douyin-7698221105147890959 --clobber out/photo_search.txt
