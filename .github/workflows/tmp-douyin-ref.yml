name: tmp-douyin-ref
on:
  push:
    branches: [claude/tmp-douyin-ref]
    paths: [.github/workflows/tmp-douyin-ref.yml]
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: search
        run: |
          pip install -q -U "yt-dlp[default]"
          mkdir -p out
          while IFS= read -r q; do
            [ -n "$q" ] || continue
            echo "### $q" | tee -a out/trophy_search2.txt
            yt-dlp --flat-playlist --print "%(id)s | %(channel)s | %(duration)s | %(title)s" "ytsearch12:$q" 2>/dev/null | tee -a out/trophy_search2.txt || true
          done <<'Q'
          Chwalinska lifts trophy Wuhan 2026
          Chwalinska kisses trophy Wuhan Open
          Wuhan Open 2026 trophy ceremony Chwalinska WTA
          Pegula lifts trophy Dubai 2026
          Kostyuk lifts trophy Madrid 2026
          Sabalenka lifts trophy Miami 2026
          Svitolina lifts trophy Rome 2026
          WTA champion trophy moments 2026 shorts
          Q
          echo "### WTA channel shorts (latest 150)" | tee -a out/trophy_search2.txt
          yt-dlp --flat-playlist --playlist-end 150 --print "%(id)s | %(duration)s | %(title)s" "https://www.youtube.com/@WTA/shorts" 2>/dev/null | grep -iE "troph|champion|lift|🏆|kiss|title" | tee -a out/trophy_search2.txt || true
      - name: upload
        run: gh release upload ref-douyin-7698221105147890959 --clobber out/trophy_search2.txt
