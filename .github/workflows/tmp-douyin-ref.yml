name: tmp-douyin-ref
on:
  push:
    branches: [claude/tmp-douyin-ref]
    paths: [.github/workflows/tmp-douyin-ref.yml]
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: search
        run: |
          pip install -q -U "yt-dlp[default]"
          mkdir -p out
          while IFS= read -r q; do
            [ -n "$q" ] || continue
            echo "### $q" | tee -a out/trophy_search.txt
            yt-dlp --flat-playlist --print "%(id)s | %(channel)s | %(duration)s | %(upload_date)s | %(title)s" "ytsearch10:$q" 2>/dev/null | tee -a out/trophy_search.txt || true
          done <<'Q'
          Pegula Dubai 2026 trophy ceremony
          Pegula Dubai 2026 champion
          Kostyuk Madrid 2026 trophy ceremony
          Kostyuk Madrid Open 2026 champion trophy
          Sabalenka Miami Open 2026 trophy ceremony
          Zheng Qinwen China Open 2026 trophy ceremony
          郑钦文 中网 2026 颁奖
          Zheng Qinwen Beijing 2026 champion trophy
          Chwalinska Wuhan 2026 trophy ceremony
          Chwalinska Wuhan Open 2026 champion speech
          WTA 2026 Dubai final highlights Pegula Svitolina
          Q
      - name: upload
        run: |
          TAG="ref-douyin-7698221105147890959"
          gh release upload "$TAG" --clobber out/trophy_search.txt
