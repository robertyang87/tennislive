name: tmp-douyin-ref
on:
  push:
    branches: [claude/tmp-douyin-ref]
    paths: [.github/workflows/tmp-douyin-ref.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: meta
        run: |
          pip install -q -U "yt-dlp[default]"
          mkdir -p out
          yt-dlp --skip-download --print "%(id)s | %(channel)s | %(uploader_id)s | %(duration)s | %(width)sx%(height)s | %(upload_date)s | %(title)s" "https://www.youtube.com/watch?v=8-YxB5kn8qA" 2>&1 | tee out/gemini_check.txt
          echo "### Dubai channel recent (flat, 80)" | tee -a out/gemini_check.txt
          yt-dlp --flat-playlist --playlist-end 80 --print "%(id)s | %(duration)s | %(title)s" "https://www.youtube.com/@DubaiDutyFreeTennisChampionships/videos" 2>/dev/null | grep -iE "pegula|champion|trophy|final|2026" | tee -a out/gemini_check.txt || true
          yt-dlp --flat-playlist --playlist-end 80 --print "%(id)s | %(duration)s | %(title)s" "https://www.youtube.com/@DubaiDutyFreeTennisChampionships/shorts" 2>/dev/null | grep -iE "pegula|champion|trophy|final|2026" | tee -a out/gemini_check.txt || true
      - name: upload
        run: gh release upload ref-douyin-7698221105147890959 --clobber out/gemini_check.txt
