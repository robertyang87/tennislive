name: medvedev-profanity-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            workspace/medvedev-story
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore apt cache
        id: apt_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          key: apt-pkgs-${{ runner.os }}-24.04-medvedev-profanity-check-v1-${{ github.run_id }}
          restore-keys: |
            apt-pkgs-${{ runner.os }}-24.04-medvedev-profanity-check-v1-
      - name: Install ffmpeg
        timeout-minutes: 15
        run: |
          source tools/ci_apt_install.sh
          ensure_ffmpeg
      - name: Save apt cache
        if: env.APT_CACHE_DIRTY == '1' && steps.apt_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          key: ${{ steps.apt_cache.outputs.cache-primary-key }}
      - name: Install whisper
        timeout-minutes: 10
        run: python -m pip install -q openai-whisper
      - name: Transcribe risk segments
        run: |
          for f in workspace/medvedev-story/audio-check/*.m4a; do
            echo "===== $f ====="
            python -m whisper "$f" --model base --language en --output_format txt --output_dir /tmp/transcripts 2>/dev/null
            echo ""
          done
          echo "===== ALL TRANSCRIPTS ====="
          cat /tmp/transcripts/*.txt
      - name: Upload transcripts
        uses: actions/upload-artifact@v4
        with:
          name: profanity-transcripts
          path: /tmp/transcripts/
          retention-days: 7
