name: Push existing content to PlusPlus

on:
  workflow_dispatch:
    inputs:
      date:
        description: Content date (YYYY-MM-DD)
        required: false
        default: ""
      scope:
        description: Existing package to push
        required: true
        type: choice
        options:
          - main
          - knowledge
          - grand-slam
          - schedule
        default: main
  push:
    branches: [main]
    paths:
      - "output/**/knowledge/**"
      - ".github/workflows/push-existing.yml"

permissions:
  contents: read

jobs:
  push-existing:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pushplus]') || contains(github.event.head_commit.message, '[push-knowledge]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # **别把 output/ 拉下来**（1.36 GB）。这条只读——从仓库里已有的包
          # 发微信，不生成也不提交——所以只要把它这次要读的那一格 add 回来。
          sparse-checkout: |
            data
            src
            tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: pip install -q -e .
      - name: Push existing package
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_SECRET_KEY: ${{ secrets.PUSHPLUS_SECRET_KEY }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_SCOPE: ${{ inputs.scope }}
          # Fresh GitHub Pages assets can take several minutes to propagate.
          TENNISLIVE_PUSHPLUS_IMAGE_SETTLE_SECONDS: '20'
          TENNISLIVE_PUSHPLUS_IMAGE_ATTEMPTS: '20'
          TENNISLIVE_PUSHPLUS_IMAGE_RETRY_SECONDS: '15'
        run: |
          DATE="${INPUT_DATE:-$(TZ=Asia/Shanghai date +%F)}"
          SCOPE="${INPUT_SCOPE:-main}"
          if [ "${{ github.event_name }}" = "push" ] && \
             echo "${{ github.event.head_commit.message }}" | grep -q '\[push-knowledge\]'; then
            SCOPE="knowledge"
          fi
          if [ "$SCOPE" = "knowledge" ]; then
            OUT_DIR="output/${DATE}/knowledge"
          elif [ "$SCOPE" = "grand-slam" ]; then
            OUT_DIR="output/grand-slam-vertical-v2"
          elif [ "$SCOPE" = "schedule" ]; then
            OUT_DIR="output/${DATE}/schedule"
          else
            OUT_DIR="output/${DATE}"
          fi
          git sparse-checkout add "${OUT_DIR}"
          test -s "${OUT_DIR}/push.html"
          test -s "${OUT_DIR}/xiaohongshu.txt"
          test -n "${PUSHPLUS_TOKEN}"
          export TENNISLIVE_ASSET_REV="$(git rev-parse HEAD)"
          tennislive publish pushplus --dir "${OUT_DIR}"
