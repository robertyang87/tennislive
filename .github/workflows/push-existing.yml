name: Push existing content to PlusPlus

# 把仓库里**已经生成好**的包推到微信。
#
# 2026-07-31 连删三个 scope：
#
# - `main`（昨日赛果日报）、`knowledge`（每日知识旧路径）——日报停产，没人再产
# - `schedule`（今日赛程包）——账号所有者：「昨日赛果和今日赛程都要拿掉了」。
#   这是赛程包唯一的发布出口，删掉它就等于这个栏目不再发出去
#
# 盯 `output/**/knowledge/**` 的 push 触发也一起删了（永远不会再触发）。
# 只剩 `grand-slam` 一个 scope。每日知识现在由 `knowledge-adhoc.yml` 自己
# 定时产、自己推，不再走这条。

on:
  workflow_dispatch:
    inputs:
      date:
        description: Content date (YYYY-MM-DD)
        required: false
        default: ""
      scope:
        description: Existing package to push
        required: true
        type: choice
        options:
          - grand-slam
        default: grand-slam

permissions:
  contents: read

jobs:
  push-existing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # **别把 output/ 拉下来**（1.36 GB）。这条只读——从仓库里已有的包
          # 发微信，不生成也不提交——所以只要把它这次要读的那一格 add 回来。
          sparse-checkout: |
            data
            src
            tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: pip install -q -e .
      - name: Push existing package
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_SECRET_KEY: ${{ secrets.PUSHPLUS_SECRET_KEY }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_SCOPE: ${{ inputs.scope }}
          # Fresh GitHub Pages assets can take several minutes to propagate.
          TENNISLIVE_PUSHPLUS_IMAGE_SETTLE_SECONDS: '20'
          TENNISLIVE_PUSHPLUS_IMAGE_ATTEMPTS: '20'
          TENNISLIVE_PUSHPLUS_IMAGE_RETRY_SECONDS: '15'
        run: |
          DATE="${INPUT_DATE:-$(TZ=Asia/Shanghai date +%F)}"
          SCOPE="${INPUT_SCOPE:-grand-slam}"
          if [ "$SCOPE" = "grand-slam" ]; then
            OUT_DIR="output/grand-slam-vertical-v2"
          else
            echo "::error::认不出来的 scope「$SCOPE」。日报和每日知识已于"
            echo "::error::2026-07-31 停产，main / knowledge 两个 scope 已删。"
            exit 1
          fi
          git sparse-checkout add "${OUT_DIR}"
          test -s "${OUT_DIR}/push.html"
          test -s "${OUT_DIR}/xiaohongshu.txt"
          test -n "${PUSHPLUS_TOKEN}"
          export TENNISLIVE_ASSET_REV="$(git rev-parse HEAD)"
          tennislive publish pushplus --dir "${OUT_DIR}"
