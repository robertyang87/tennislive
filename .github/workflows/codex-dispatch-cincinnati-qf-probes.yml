name: codex-dispatch-cincinnati-qf-probes

on:
  push:
    branches:
      - feature/us-open-men-2026-preview
    paths:
      - .github/workflows/codex-dispatch-cincinnati-qf-probes.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch both non-publishing probes in parallel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run match-reel.yml --repo "$GH_REPO" \
            --ref feature/us-open-men-2026-preview \
            -f mode=probe -f slug=bejlek-keys-cincinnati-2026-qf \
            -f url=https://youtu.be/QuM0ytM-wlg -f every=2 \
            -f home="Sara Bejlek" -f away="Madison Keys" -f year=2026 &
          first_pid=$!
          gh workflow run match-reel.yml --repo "$GH_REPO" \
            --ref feature/us-open-men-2026-preview \
            -f mode=probe -f slug=fritz-nakashima-cincinnati-2026-qf \
            -f url=https://youtu.be/t4eOVbP8Tdc -f every=2 \
            -f home="Taylor Fritz" -f away="Brandon Nakashima" -f year=2026 &
          second_pid=$!
          wait "$first_pid"
          wait "$second_pid"
