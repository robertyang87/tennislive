name: retry-nishikori-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retry-nishikori-once.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: retry-nishikori-once
  cancel-in-progress: false

jobs:
  patch-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 修正收尾卡与半决赛表述
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          slug = "nishikori-sakamoto-us-open-2026-q3-farewell"
          path = Path("specs/interviews") / f"{slug}.json"
          spec = json.loads(path.read_text(encoding="utf-8"))

          for field in ("zh", "_zh_draft"):
              spec[field] = [
                  "一次决赛、两次半决赛" if line == "一次决赛、两次四强" else line
                  for line in spec.get(field, [])
              ]

          spec.setdefault("takeaway", {})["close"] = {
              "point": "纽约见证奇迹，也见证他的大满贯告别。",
              "ask": "你从哪场记住锦织圭？",
          }
          note = "收尾卡已压缩到34字以内；双ASR、日语说明和六处掌声空档继续按既有质检执行。"
          notes = spec.setdefault("_notes", [])
          if note not in notes:
              notes.append(note)

          close = spec["takeaway"]["close"]
          total = len(close["point"]) + len(close["ask"])
          assert total <= 34, total
          assert "一次决赛、两次四强" not in spec["zh"]
          assert "一次决赛、两次四强" not in spec["_zh_draft"]
          path.write_text(
              json.dumps(spec, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(f"收尾卡 {total} 字；内容修正完成：{path}")
          PY

          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git add specs/interviews/nishikori-sakamoto-us-open-2026-q3-farewell.json
          if ! git diff --cached --quiet; then
            git commit -m "content: 压缩锦织圭告别片收尾卡"
            source tools/git_push_retry.sh
            push_with_rebase_retry main 5
          fi

      - name: 点名重新渲染
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 20); do
            REMOTE=$(git ls-remote origin refs/heads/main | awk '{print $1}')
            LOCAL=$(git rev-parse HEAD)
            [ "$REMOTE" = "$LOCAL" ] && break
            git pull --rebase origin main
            sleep 1
          done
          RECEIVED_AT=$(date -u +%FT%TZ)
          gh workflow run interview-clip.yml --ref main \
            -f slug=nishikori-sakamoto-us-open-2026-q3-farewell \
            -f mode=render \
            -f "received_at=$RECEIVED_AT"
          echo "已点名 dispatch：$RECEIVED_AT"

      - name: 删除一次性工作流
        if: always()
        run: |
          git pull --rebase origin main
          git rm .github/workflows/retry-nishikori-once.yml
          git commit -m "ops: 清理锦织圭一次性重跑工作流"
          source tools/git_push_retry.sh
          push_with_rebase_retry main 5
