name: medvedev-almaty-lookup

# 一次性：梅德韦杰夫 2026 阿拉木图夺冠之路选源。只在本分支 push 时跑，不进 main。
# 识别用户给的三条链接、按每一场搜官方集锦、拉 flashscore 逐场比分与统计。

on:
  push:
    branches: [claude/medvedev-almaty-title-run]
    paths: [.github/workflows/medvedev-almaty-lookup.yml]

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/medvedev-almaty-title-run
          sparse-checkout: |
            tools
            src
            pyproject.toml
            data/evidence
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -e . "yt-dlp[default]"
      - name: cookies
        id: cookies
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "path=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_OUTPUT"
          fi
      - name: 存 flashscore 原始 feed 进证据目录
        run: |
          D=data/evidence/medvedev-almaty-title-run-2026/flashscore
          mkdir -p $D
          python - <<'PY'
          import json, re, sys, datetime, hashlib
          sys.path.insert(0, "tools")
          import match_feed as mf
          D = "data/evidence/medvedev-almaty-title-run-2026/flashscore"
          page = mf._get("https://www.flashscore.com/tennis/atp-singles/almaty/results/").decode("utf-8","replace")
          ids = {"MgnKGnx8":"r2","t2iMf2AC":"qf","AJS23nbt":"sf","6B33aysH":"final"}
          ident = {}
          for blk in page.split("~AA÷")[1:]:
              mid = blk[:8]
              if mid in ids and mid not in ident:
                  f = dict(re.findall(r"([A-Z]{2})÷([^¬~]*)", blk))
                  ident[mid] = {"round_key": ids[mid], "start_utc": datetime.datetime.utcfromtimestamp(int(f["AD"])).isoformat()+"+00:00", "field_record": f, "results_page": "https://www.flashscore.com/tennis/atp-singles/almaty/results/"}
          json.dump(ident, open(f"{D}/identity.json","w"), ensure_ascii=False, indent=2)
          for mid in ids:
              for feed in ("df_st_1","df_mh_1","df_sui_1"):
                  raw = mf.fs_feed(feed, mid)
                  open(f"{D}/{feed}_{mid}.txt","w").write(raw)
                  print(mid, feed, len(raw), hashlib.sha256(raw.encode()).hexdigest())
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evidence/medvedev-almaty-title-run-2026
          git commit -m "evidence: 阿拉木图四场 flashscore 原始 feed" && git push origin HEAD:claude/medvedev-almaty-title-run || true
      - name: 决赛全量与开赛时刻
        run: |
          python tools/match_feed.py show 6B33aysH --home 梅德韦杰夫 --away 巴西拉什维利 2>&1 | sed -n 1,80p || true
          python - <<'PY'
          import re, sys, datetime
          sys.path.insert(0, "tools")
          import match_feed as mf
          page = mf._get("https://www.flashscore.com/tennis/atp-singles/almaty/results/").decode("utf-8","replace")
          for blk in page.split("~AA÷")[1:]:
              if "Medvedev" not in blk: continue
              f = dict(re.findall(r"([A-Z]{2})÷([^¬~]*)", blk))
              ad = f.get("AD")
              t = datetime.datetime.utcfromtimestamp(int(ad)).isoformat()+"Z" if ad else None
              print("MATCH", blk[:8], f.get("AE"), f.get("AF"), f.get("ER"), t, {k:f.get(k) for k in ("BA","BB","BC","BD","BE","BF","DA","DB","AS","AZ")})
          PY
