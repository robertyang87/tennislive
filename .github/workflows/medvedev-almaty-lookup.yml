name: medvedev-almaty-lookup

# 一次性：梅德韦杰夫 2026 阿拉木图夺冠之路选源。只在本分支 push 时跑，不进 main。
# 识别用户给的三条链接、按每一场搜官方集锦、拉 flashscore 逐场比分与统计。

on:
  push:
    branches: [claude/medvedev-almaty-title-run]
    paths: [.github/workflows/medvedev-almaty-lookup.yml]

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            src
            pyproject.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -e . "yt-dlp[default]"
      - name: cookies
        id: cookies
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "path=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_OUTPUT"
          fi
      - name: flashscore 逐场
        run: |
          python tools/match_feed.py find --tour atp --event almaty --who Medvedev 2>&1 | tail -40 || true
          for m in "MgnKGnx8 梅德韦杰夫 岛袋将" "t2iMf2AC 梅德韦杰夫 阿特曼" "AJS23nbt 梅德韦杰夫 布勃利克" "6B33aysH 梅德韦杰夫 巴西拉什维利"; do
            set -- $m
            echo "==== $1"
            python tools/match_feed.py show "$1" --home "$2" --away "$3" 2>&1 | tail -120 || true
          done
          python tools/match_feed.py find --tour atp --event almaty --who Moutet 2>&1 | tail -5 || true
      - name: 封面官方图
        run: |
          python tools/find_cover_photo.py --discover almaty 2>&1 | tail -60 || true
          python tools/find_cover_photo.py --player Medvedev --event Almaty --tour atp --date 2026-10-25 --final 2>&1 | tail -80 || true
