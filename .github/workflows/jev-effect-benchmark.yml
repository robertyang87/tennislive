name: Jev effect benchmark
on:
  push:
    branches: [agent/jev-effect-20260923]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data
            tools
            src
            demos/jev_effect
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Real title-only cold and warm comparison
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python demos/jev_effect/replay.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-effect-report
          path: jev-effect-results/report.json
