name: Wang approved final render
on:
  push:
    branches: [codex/wang-vekic-singapore-reel]
    paths: [.github/workflows/wang-vekic-final-render.yml]
permissions:
  contents: read
  actions: write
concurrency:
  group: wang-vekic-final-render-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch the approved branch through the existing production workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          # One-shot recovery for the GitHub web UI 502 on 2026-09-22.
          # This cannot publish: render stays on the branch, and existing QC/merge/push gates remain.
          python - <<'PY'
          import json, os, subprocess
          repo = os.environ["REPO"]
          branch = "codex/wang-vekic-singapore-reel"
          expected = os.environ["EXPECTED_HEAD"]
          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path], text=True))
          head = api(f"repos/{repo}/branches/{branch}")["commit"]["sha"]
          if head != expected:
              raise SystemExit("Branch moved: do not render an unreviewed replacement")
          runs = api(f"repos/{repo}/actions/runs?per_page=100")["workflow_runs"]
          existing = [r for r in runs if r["name"] == "match-reel" and r["head_sha"] == expected]
          if existing:
              print("Already dispatched for this exact head:", [r["id"] for r in existing])
              raise SystemExit(0)
          subprocess.run([
              "gh", "workflow", "run", "match-reel.yml", "--repo", repo, "--ref", branch,
              "-f", "mode=render", "-f", "slug=wang-vekic-singapore-2026-r1",
              "-f", "received_at=2026-09-22T09:02:00Z", "-f", "push=false",
              "-f", "matchup=王欣瑜 vs 维基奇", "-f", "score=6-1 6-2"
          ], check=True)
          print("Dispatched one branch render; no push requested.")
          PY
