name: tmp-scout-shnaider-muchova
on:
  push:
    branches: [claude/shnaider-muchova-wuhan-r3]
    paths: ['.github/workflows/tmp-scout-shnaider-muchova.yml']
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            src
            specs
            data
            assets/players
            pyproject.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps
        run: |
          python -m pip install -q -e . playwright pillow
          for i in 1 2; do timeout 240 python -m playwright install --with-deps chromium && break; sudo pkill -9 apt-get || true; sudo dpkg --configure -a || true; done
      - name: wta official
        continue-on-error: true
        run: |
          D=data/research/shnaider-muchova-wuhan-2026-r3; mkdir -p $D
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129 Safari/537.36"
          curl -sS -A "$UA" "https://api.wtatennis.com/tennis/tournaments/1075/2026/matches" -o $D/matches.raw
          MID=$(python - <<'P'
          import json
          d=json.load(open('data/research/shnaider-muchova-wuhan-2026-r3/matches.raw'))
          for m in d.get('Matches',[]):
              s=json.dumps(m).upper()
              if 'MUCHOVA' in s and 'SHNAIDER' in s and m.get('DrawMatchType')=='S':
                  print(m['MatchID']); break
          P
          )
          echo "MID=$MID"; echo "$MID" > $D/match_id.txt
          for p in stats point-by-point; do curl -sS -A "$UA" "https://api.wtatennis.com/tennis/tournaments/1075/2026/matches/$MID/$p" -o $D/$p.raw; done
          curl -sS -A "$UA" "https://api.wtatennis.com/tennis/players/ranked?page=0&pageSize=100&type=rankSingles&sort=asc&metric=SINGLES" -o $D/rankings.raw
          curl -sS -A "$UA" "https://wtafiles.wtatennis.com/pdf/draws/2026/1075/MDS.pdf" -o $D/draw.pdf
          ls -la $D
      - name: tnns
        continue-on-error: true
        run: |
          D=data/research/shnaider-muchova-wuhan-2026-r3
          python tools/tnns_stats.py fetch --who Shnaider --who Muchova --date 2026-10-14 > $D/tnns.txt 2>&1 || true
          tail -60 $D/tnns.txt
      - name: cover
        continue-on-error: true
        run: |
          D=data/research/shnaider-muchova-wuhan-2026-r3; mkdir -p $D/cover
          MID=$(cat $D/match_id.txt)
          python tools/fetch_wta_cover_photo.py --tournament 1075 --year 2026 --city wuhan --match "$MID" --surnames muchova shnaider --match-date 2026-10-14 --out $D/cover/reaction.jpg > $D/cover-reaction.txt 2>&1 || true
          tail -30 $D/cover-reaction.txt
          for p in Muchova Shnaider; do
            python tools/find_cover_photo.py --player $p --event Wuhan --date 2026-10-14 --tour wta --days 2 > $D/cover-find-$p.txt 2>&1 || true
            tail -60 $D/cover-find-$p.txt
          done
      - name: commit
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add -f data/research/shnaider-muchova-wuhan-2026-r3
          git commit -qm "scout: shnaider-muchova wuhan r3 [skip ci]" && git push origin HEAD:${GITHUB_REF_NAME}
