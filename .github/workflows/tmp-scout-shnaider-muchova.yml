name: tmp-scout-shnaider-muchova
on:
  push:
    branches: [claude/shnaider-muchova-wuhan-r3]
    paths: ['.github/workflows/tmp-scout-shnaider-muchova.yml']
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            src
            specs
            data
            .github
            assets/players
            pyproject.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps
        run: |
          python -m pip install -q -e . playwright pillow
          for i in 1 2; do timeout 240 python -m playwright install --with-deps chromium && break; sudo pkill -9 apt-get || true; sudo dpkg --configure -a || true; done
      - name: board scan
        run: |
          sudo apt-get install -y -q ffmpeg >/dev/null 2>&1 || bash tools/ci_apt_install.sh ffmpeg
          pip install -q -e ".[visualqa]"
          curl -sSL -o /tmp/src.mp4 -H "Authorization: Bearer ${{ github.token }}" "https://github.com/${{ github.repository }}/releases/download/source-XUQeeTikU7k/XUQeeTikU7k.mp4"
          ls -la /tmp/src.mp4
          git fetch -q --depth=1 origin main
          git checkout origin/main -- output/2026-10-15/reel/muchova-wuhan-2026/probe.json 2>/dev/null || true
          ls output/2026-10-15/reel/muchova-wuhan-2026/ || true
          PYTHONPATH=tools:src python - <<'P'
          import json, pathlib, sys
          sys.path.insert(0,'tools')
          from probe_board import plan_boxes, scan_plan
          p=pathlib.Path('output/2026-10-15/reel/muchova-wuhan-2026/probe.json')
          d=json.loads(p.read_text())
          plan=plan_boxes((90,826,550,980),(1920,1080),profile='wta')
          print('plan',plan)
          new=scan_plan(pathlib.Path('/tmp/src.mp4'),plan,1920)
          for e in new: print(json.dumps(e)[:400])
          boxes=[s['box'] for s in d['board']['scans']]
          for e in new:
              if e['box'] not in boxes: d['board']['scans'].append(e)
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
          P
      - name: commit
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add -f output/2026-10-15/reel/muchova-wuhan-2026/probe.json
          git commit -qm "scout3: shnaider-muchova wuhan r3 [skip ci]" && git push origin HEAD:${GITHUB_REF_NAME}
