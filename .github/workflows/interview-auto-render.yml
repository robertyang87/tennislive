name: interview-auto-render
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            assets
            data
            docs
            requests
            skills
            specs
            src
            tests
            tools
            output/interviews/sabalenka-noskova-usopen-2026-qf-oncourt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -q -e '.[visualqa]' 'yt-dlp[default]' faster-whisper bgutil-ytdlp-pot-provider
      - name: Install ffmpeg and fonts
        run: |
          source tools/ci_apt_install.sh
          apt_install_cached ffmpeg fonts-noto-core fonts-noto-cjk
      - name: PO token provider
        run: docker run --name bgutil-pot -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
      - name: Cookies
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "YT_COOKIES=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_ENV"
          fi
      - name: Complete source probe
        run: PYTHONPATH=src python tools/build_match_reel.py probe --url 'https://www.youtube.com/watch?v=o4zD4bAkNDY' --outdir output/interviews/sabalenka-noskova-usopen-2026-qf-oncourt --every 4
      - name: Transcribe and translate only requested interview
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: PYTHONPATH=src python tools/prepare_sabalenka_oncourt.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sabalenka-oncourt-preparation
          path: output/interviews/sabalenka-noskova-usopen-2026-qf-oncourt
      - name: Commit requested interview evidence
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add specs/interviews/sabalenka-noskova-usopen-2026-qf-oncourt.json specs/interviews/sabalenka-noskova-usopen-2026-qf-oncourt.xhs.txt
          git add -f output/interviews/sabalenka-noskova-usopen-2026-qf-oncourt/cap_asr.json3 output/interviews/sabalenka-noskova-usopen-2026-qf-oncourt/probe.json output/interviews/sabalenka-noskova-usopen-2026-qf-oncourt/contact*.jpg
          if [ -f output/interviews/sabalenka-noskova-usopen-2026-qf-oncourt/captions.txt ]; then git add output/interviews/sabalenka-noskova-usopen-2026-qf-oncourt/captions.txt; fi
          git commit -m "interview: prepare Sabalenka US Open quarterfinal on-court source and bilingual draft"
          source tools/git_push_retry.sh
          push_with_rebase_retry "${GITHUB_REF_NAME}" 5
