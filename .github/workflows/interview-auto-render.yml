name: interview-auto-render

# 「赛后开麦」自动出片的最后一环：
# 1) 把自动草稿提升成正式 spec；
# 2) 把人工指定、身份与赛果已经核实的请求转写/翻译成正式 spec；
# 3) 补同场比赛结尾与双语现场解说；
# 4) 只 dispatch 生产契约完整的条目。
#
# 微信推送由 interview-clip 渲完后叫醒 auto-push-interview；后者复核 L0/L2、
# 成片指纹、独立发布账本和海报。这里不把“dispatch 成功”冒充成“已经发布”。

on:
  push:
    branches: [main]
    paths:
      - "requests/interviews/*.json"
      # 同一 slug 修字幕、封面或空档销账后，spec SHA 会与已落地 QC 不同；
      # 必须立刻叫醒输入指纹闸，不能等下一趟定时班次。
      - "specs/interviews/*.json"
      # 渲染器本身的字幕、顶栏、封面或发布闸修正也必须叫醒重渲；否则修复合并
      # 后只能碰运气等 schedule。
      - "tools/build_interview_clip.py"
      - "tools/build_interview_request.py"
      - "tools/interview_zh_tail.py"
      - "tools/draft_interview_spec.py"
      - "tools/interview_source_gate.py"
      - "tools/attach_interview_lead_in.py"
      # dispatch 之前那道离线预检和推送后修订的判据：修了这几道闸，等待名单里被它们
      # 拦下的 spec 要马上重判，不能干等下一趟定时班次（最多 10 分钟）。
      # 判据 `test_auto_render被预检和picker的判据改动叫醒`（按 import 推导）。
      - "tools/pick_interview_renders.py"
      - "tools/interview_preflight.py"
      - "tools/interview_spec_gates.py"
      - "tools/interview_tail.py"
      - "tools/interview_revision.py"
      - "tools/production_preflight.py"
      # 全称断言那道闸（预检排在最前面的一道）和它的扫描面
      - "tools/absolute_claims.py"
      - "tools/spec_wording.py"
      # 账号所有者的口味闸（`build_interview_clip.check_taste`，预检闸表里的一道）
      - "tools/taste_gates.py"
      - "data/legacy_taste_gates.json"
      # 另一半口味闸（`check_taste_extra`；请求预检 `check_request` 也调它）和它的存量表
      - "tools/taste_gates_extra.py"
      - "data/legacy_interview_gates.json"
      - ".github/workflows/interview-auto-render.yml"
  schedule:
    # 每 10 分钟接住新草稿、人工请求、片头重试和 dispatch；避开整点/半点。
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: interview-auto-render
  cancel-in-progress: false

jobs:
  auto:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            assets/fonts
            data
            docs
            requests
            skills
            specs
            src
            tests
            tools

      # 上一趟**全量**预检记下的结论（`pick_interview_renders.VERDICT_CACHE`）。探针跑在系统
      # python3 上（没有 PIL），量宽度那几项判不了——同一份输入全量判过的就拿这份顶上，
      # 不然一条卡在量宽度上的红 spec 每 10 分钟逼一次全量 job。键是「判据代码＋spec＋
      # 文案＋字幕缓存＋日期」的指纹，存在文件里不在缓存键上：缓存丢了只是多跑一趟全量。
      - name: 取预检结论缓存
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/tennislive-preflight
          key: interview-preflight-verdicts-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            interview-preflight-verdicts-v1-

      - name: 没活就早退
        id: gate
        run: |
          set -o pipefail
          # 取回的那份预检结论的指纹——末尾「有变才存」拿它比（见「存预检结论缓存」）
          echo "verdicts_sha=$(sha256sum ~/.cache/tennislive-preflight/interview_verdicts.json 2>/dev/null | cut -d' ' -f1 || true)" >> "$GITHUB_OUTPUT"
          DRAFTS=$(find specs/interviews -maxdepth 1 -name '*.draft.json' | wc -l)
          REQUESTS=$(python3 tools/build_interview_request.py --count-pending)
          NEEDS_LEAD=$(python3 - <<'PY'
          import json
          from pathlib import Path
          n = 0
          for p in Path('specs/interviews').glob('*.json'):
              if p.name.endswith('.draft.json'):
                  continue
              try: d = json.loads(p.read_text(encoding='utf-8'))
              except Exception: continue
              op = d.get('opening') or {}
              n += bool(d.get('requested_content_type') in {'on_court', 'farewell'}
                        and op.get('kind') == 'none' and not d.get('lead_in'))
          print(n)
          PY
          )
          # This is only a cheap work probe. Full eligibility runs again after
          # dependencies and fonts are installed, before any dispatch.
          if ! python3 tools/pick_interview_renders.py --probe > /tmp/todo.txt 2> /tmp/waiting.txt; then
            cat /tmp/waiting.txt >&2
            echo 'Work probe needs rendering dependencies; continue to full validation.'
            echo 'work=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat /tmp/todo.txt
          cat /tmp/waiting.txt >&2
          READY=$(tail -n +2 /tmp/todo.txt | grep -c . || true)
          python3 tools/pick_interview_renders.py --stale | tee /tmp/stale.txt
          if grep -q "（投于" /tmp/stale.txt; then
            {
              echo "## ⚠️ 有采访投出去超过 70 分钟还没有当前成片（本轮自动重投；窗口和 tools/pick_interview_renders.py 的 STALE_MINUTES 同一个数）"
              echo ""
              tail -n +2 /tmp/stale.txt | sed 's/^  /- /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s /tmp/waiting.txt ]; then
            {
              echo "## ⏳ 等自动补齐 / 例外复核（不 dispatch）"
              echo ""
              tail -n +2 /tmp/waiting.txt | sed 's/^  /- /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$DRAFTS" -eq 0 ] && [ "$REQUESTS" -eq 0 ] \
             && [ "$READY" -eq 0 ] && [ "$NEEDS_LEAD" -eq 0 ]; then
            echo "[早退] 没有草稿、人工请求、待补片头或待 dispatch 的正式 spec。"
            echo "work=false" >> "$GITHUB_OUTPUT"
          else
            echo "草稿=$DRAFTS，人工请求=$REQUESTS，待 dispatch=$READY，待同场冷开场=$NEEDS_LEAD"
            echo "work=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.work == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: 先校验转写与翻译脚本语法
        if: steps.gate.outputs.work == 'true'
        run: python -m py_compile tools/draft_interview_spec.py tools/build_interview_request.py

      - name: 把人工请求的产物格加回稀疏范围
        if: steps.gate.outputs.work == 'true'
        run: |
          python3 tools/build_interview_request.py --pending-slugs | tee /tmp/request-slugs.txt
          while IFS= read -r slug; do
            [ -n "$slug" ] || continue
            git sparse-checkout add "output/interviews/$slug"
          done < /tmp/request-slugs.txt

      - name: 校验赛后开麦制作规范资源
        if: steps.gate.outputs.work == 'true'
        run: test -f skills/tennis-interview-production/SKILL.md

      # ⚠️ 这一步不许裸调 apt-get：重试/超时/缓存那套逻辑只有一份
      # （`tools/ci_apt_install.sh`），裸调既绕开缓存、又没有超时——实测同一步
      # 能从 18 秒变成 13 分 42 秒，而 `-qq` 让它卡的时候一个字都不吭。
      - name: 缓存 apt 包（字幕排版字体，绕开镜像抽风）
        id: apt_cache
        if: steps.gate.outputs.work == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          # 滚动键：按稳定前缀恢复最近一份，跑完用本次 run_id 回写——固定钥匙
          # 的话第一趟只攒下一部分包，之后再也覆盖不掉同名缓存。
          key: apt-pkgs-${{ runner.os }}-24.04-interview-auto-render-v1-${{ github.run_id }}
          # 第二格退到 CI 在 main 上存的那份（cjk＋core＋emoji，这一步装的字体是它的
          # 子集）：缓存按 ref 隔离，本线自己存的只有同一条分支看得见，每条新分支
          # 的第一趟全靠这一格（2026-09-27，见 match-reel.yml 同一步的注释）
          restore-keys: |
            apt-pkgs-${{ runner.os }}-24.04-interview-auto-render-v1-
            apt-pkgs-${{ runner.os }}-24.04-ci-v2-
      - name: 装转写与字幕排版字体
        timeout-minutes: 15
        if: steps.gate.outputs.work == 'true'
        run: |
          source tools/ci_apt_install.sh
          apt_install_cached fonts-noto-core fonts-noto-cjk
          test -f /usr/share/fonts/truetype/noto/NotoSans-Regular.ttf

      # 只在这一趟真摸了网、下了新包时回写（`APT_CACHE_DIRTY` 由
      # `tools/ci_apt_install.sh` 置位）。原来靠 actions/cache@v4 的 post 自动存：
      # 命中的趟白传一份、只装 ffmpeg 的趟把空目录存成最新那一格——见那份脚本
      # 顶部 2026-09-27 那段。判据 `tests/test_runner_setup_cache.py`。
      - name: 回写 apt 缓存（这趟真下了新包才存）
        if: env.APT_CACHE_DIRTY == '1' && steps.apt_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          key: ${{ steps.apt_cache.outputs.cache-primary-key }}

      - name: 缓存转写模型和生产检查点
        if: steps.gate.outputs.work == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.cache/tennislive-production
          key: interview-preparation-${{ runner.os }}-v1-${{ github.run_id }}
          restore-keys: |
            interview-preparation-${{ runner.os }}-v1-

      - name: 装依赖
        if: steps.gate.outputs.work == 'true'
        run: pip install -q -e . "yt-dlp[default]>=2026.7.4" faster-whisper

      - name: 启动 YouTube PO token provider
        if: steps.gate.outputs.work == 'true'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          pip install -q bgutil-ytdlp-pot-provider
          docker run --name bgutil-pot -d -p 4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider
          for i in $(seq 1 25); do
            curl -fsS http://127.0.0.1:4416/ping >/dev/null && exit 0
            sleep 2
          done
          docker logs bgutil-pot 2>&1 | tail -20 || true
          echo "::warning::PO token provider 未就绪；继续用 cookies/client 梯子尝试"
          exit 1

      - name: 提升草稿为正式 spec（查赛果补 winner/matchup）
        if: steps.gate.outputs.work == 'true'
        run: |
          set -o pipefail
          python tools/promote_interview_draft.py --write | tee /tmp/promote.log

      - name: 落 cookies（正文转写与同场官方集锦字幕）
        if: steps.gate.outputs.work == 'true'
        id: lead_cookies
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "path=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_OUTPUT"
          fi

      # 一条请求没过闸（没认领的全称断言、封面 zoom 越界、窗口无效……）不连坐：
      # 每条各自 build，失败的那条什么都不写、`::error file=` 指回请求文件、记进
      # /tmp/request-failed.txt；这一步照样退出 0，后面补片头、提交、dispatch 照常走
      # （没过闸的那几个 slug 在提交和 dispatch 两步都跳过），
      # 最后一步「人工请求没过闸」再把整趟标红。原来单条红就整步退出 1，别的请求
      # 白转写一遍、没提交，每 10 分钟重来一趟。判据
      # `tests/test_absolute_claims.py::test_一条人工请求没过闸_不连坐同一趟的其余请求`。
      - name: 人工指定请求转写、切行并逐行翻译
        if: steps.gate.outputs.work == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          YT_COOKIES: ${{ steps.lead_cookies.outputs.path }}
        run: |
          set -o pipefail
          python tools/build_interview_request.py --write \
            --failed-list /tmp/request-failed.txt | tee /tmp/request-build.log

      - name: 自动配同场比赛结尾与解说双语字幕
        if: steps.gate.outputs.work == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          YT_COOKIES: ${{ steps.lead_cookies.outputs.path }}
        run: |
          set -o pipefail
          python tools/attach_interview_lead_in.py --write | tee /tmp/lead-in.log

      - name: 提交生成与提升结果
        if: steps.gate.outputs.work == 'true'
        run: |
          git fetch -q origin "$GITHUB_REF_NAME"
          python tools/check_production_writes.py --remote "origin/$GITHUB_REF_NAME"
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add specs/interviews
          git add requests/interviews
          # 防御性的一刀：没过闸的那条本来一个字节都不写（build 的落盘全排在所有闸之后，
          # 测试钉着），所以它的 cap_asr.json3 要么不在、要么还是上次提交的那份。这里跳过
          # 是防哪天有人把写挪到闸前面——今天它不拦任何东西。
          FAILED_SLUGS=""
          if [ -s /tmp/request-failed.txt ]; then
            FAILED_SLUGS=$(cut -f2 /tmp/request-failed.txt)
          fi
          if [ -f /tmp/request-slugs.txt ]; then
            while IFS= read -r slug; do
              [ -n "$slug" ] || continue
              if printf '%s\n' "$FAILED_SLUGS" | grep -qxF -- "$slug"; then
                echo "[跳过] $slug 这一趟没过闸，它的转写不进提交"
                continue
              fi
              if [ -f "output/interviews/$slug/cap_asr.json3" ]; then
                git add -f "output/interviews/$slug/cap_asr.json3"
              fi
            done < /tmp/request-slugs.txt
          fi
          if git diff --cached --quiet; then
            echo "没有新请求或草稿被生成/提升。"
            exit 0
          fi
          python tools/check_staged_file_sizes.py
          git commit -m "interview: 自动生成赛后开麦正式 spec"
          source tools/git_push_retry.sh
          if ! push_with_rebase_retry "${GITHUB_REF_NAME}" 5; then
            echo "::error::生成结果推不上去——请求/草稿还在，下一趟会重来"
            exit 1
          fi

      - name: dispatch 未 render 的正式 spec（每 slug 一个 run，并行）
        if: steps.gate.outputs.work == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python tools/pick_interview_renders.py | tee /tmp/todo.txt
          mapfile -t SLUGS < <(tail -n +2 /tmp/todo.txt | grep -v '^$' || true)
          # 这一趟人工请求没过闸的 slug 不投：改过的请求没落盘，此刻的正式 spec 还是上一版。
          # 上一版的 render 要是一直没落地（过了 STALE_MINUTES），pick 会把它当待渲再投一次，
          # push.auto 的话旧版就抢在改过的请求前面发出去了。不记 dispatch 状态，
          # 下一趟请求过了闸自然接上。
          BLOCKED=""
          if [ -s /tmp/request-failed.txt ]; then
            BLOCKED=$(cut -f2 /tmp/request-failed.txt)
          fi
          FAILED=()
          for slug in "${SLUGS[@]}"; do
            if [ -n "$BLOCKED" ] && printf '%s\n' "$BLOCKED" | grep -qxF -- "$slug"; then
              echo "[跳过] $slug 这一趟人工请求没过闸，不投上一版 spec"
              continue
            fi
            RECEIVED_AT=$(date -u +%FT%TZ)
            echo "[dispatch] interview-clip render $slug"
            if gh workflow run interview-clip.yml --ref main \
              -f "slug=$slug" -f mode=render -f "received_at=$RECEIVED_AT"; then
              python tools/pick_interview_renders.py --mark-one "$slug" --at "$RECEIVED_AT"
            else
              FAILED+=("$slug")
            fi
          done
          if [ "${#FAILED[@]}" -gt 0 ]; then
            {
              echo "## ⚠️ 有采访 dispatch 失败（没记状态，下一趟会重投）"
              echo ""
              for s in "${FAILED[@]}"; do echo "- $s"; done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::${#FAILED[@]} 条 dispatch 失败：${FAILED[*]}"
          fi
          git add data/interview_render_dispatched.json
          if git diff --cached --quiet; then
            echo "状态没有变化。"
            exit 0
          fi
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          python tools/check_staged_file_sizes.py
          BASE_STATE="$RUNNER_TEMP/interview_dispatch_base.json"
          OURS_STATE="$RUNNER_TEMP/interview_dispatch_ours.json"
          git show HEAD:data/interview_render_dispatched.json > "$BASE_STATE"
          cp data/interview_render_dispatched.json "$OURS_STATE"
          git commit -m "data: interview render dispatch 记录"
          source tools/git_push_retry.sh
          if ! push_interview_dispatch_retry "${GITHUB_REF_NAME}" "$BASE_STATE" "$OURS_STATE" 5; then
            echo "::error::dispatch 状态推不上去——这批 slug 下一趟会被重投"
            echo "::error::（interview-clip 的 concurrency 按 slug 去重，代价是把正在跑的那趟掐了重跑）"
            exit 1
          fi

      - name: 人工请求没过闸：其余已照常提交、dispatch，整趟标红
        if: always() && steps.gate.outputs.work == 'true'
        run: |
          if [ ! -s /tmp/request-failed.txt ]; then
            exit 0
          fi
          {
            echo "## ❌ 人工请求没过闸（这几条没进提交；其余照常提交、dispatch）"
            echo ""
            while IFS=$'\t' read -r path slug reason; do
              echo "- \`$path\`（${slug:-slug 读不出}）：$reason"
            done < /tmp/request-failed.txt
          } >> "$GITHUB_STEP_SUMMARY"
          # 失败清单里的原因带着异常类型：ValueError/RuntimeError 多半是请求本身（全称断言、字段、
          # JSON、受保护的 spec）；下载／转写／网络这类环境故障也记在这儿，不该叫人去改请求文件
          # （复审 2026-09-27 nit）。
          echo "::error::$(grep -c . /tmp/request-failed.txt) 条人工请求没过闸（原因见上面的 ::error:: 和 run 摘要）——请求本身的问题改请求文件；下载、转写、网络这类环境故障不用改。两种下一趟都自动重试"
          exit 1

      # 全量那一趟（dispatch 那一步）把每条 spec 的预检结论记进 VERDICT_CACHE，存给下一趟探针。
      # ⚠️ **结论有变才另存一份**：有草稿时每 10 分钟一趟全量，一趟存一份就是一天 144 条
      # 一样的缓存（review 那条）。键仍然带 run_id——缓存键一经写入不可覆盖，按日期或
      # 内容定键的话，A→B→A 那一下存不进去，restore-keys 取回的「最新一份」就成了 B，
      # 探针从此逢判不了就逼全量；带 run_id、只在内容变了才存，取回的永远是最后一份。
      - name: 预检结论有没有变
        id: verdicts
        if: always() && steps.gate.outputs.work == 'true'
        run: |
          NOW=$(sha256sum ~/.cache/tennislive-preflight/interview_verdicts.json 2>/dev/null | cut -d' ' -f1 || true)
          if [ -n "$NOW" ] && [ "$NOW" != "${{ steps.gate.outputs.verdicts_sha }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "[预检缓存] 和取回的那份逐字节一样（或这趟没写出来），不另存"
          fi

      - name: 存预检结论缓存
        if: always() && steps.verdicts.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/tennislive-preflight
          key: interview-preflight-verdicts-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 顺手叫醒挨饿的编排/提升班次
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source tools/nudge_stale_ticks.sh
          nudge_if_stale orchestrate.yml 20 -f apply=true
          nudge_if_stale reel-auto-ready.yml 20
