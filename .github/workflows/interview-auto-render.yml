name: interview-auto-render

# 「赛后开麦」自动出片的最后一环：把草稿提升成正式 spec（补 winner/matchup，
# 查赛果），然后 dispatch render——每 slug 一个 run，interview-clip 的
# concurrency 按 slug 分组，**不同采访天然并行**（好多比赛差不多时间结束）。
#
# ⚠️ **推微信不是「auto-push-interview 盯 render.json 自动触发」**——这句话
# 2026-08-21 之前写在这儿，而它从来没成立过：render 的成片提交用的是
# GITHUB_TOKEN，GitHub 防递归不给这种 push 创建 workflow run（铁证：50 份
# render.json / 0 份 pushed.json）。真话是：interview-clip 渲完自己
# `gh workflow run auto-push-interview.yml -f slug=…` 叫醒推送，
# 那头会复核 L0、L2 attestation、成片指纹、独立发布账本和海报。
#
# ⚠️ **只 dispatch 生产契约完整的 spec。** 自动草稿的 zh 与正式切行同源，
# transcript 走双 ASR 指纹；opening/lead-in/takeaway/cover 也由流水线补齐。
# 任何身份不明或精确同场片头没找到的仍留在 waiting，不把失败任务记成已 dispatch。
#
# 前两环在 oncourt-interviews.yml：采集（定时）→ 候选（pick_oncourt_clips）→
# 自动建草稿（逐场 matrix，最多 4 路）。这条做「提升 + 同场片头 + dispatch」。

on:
  schedule:
    # 每 10 分钟接住新草稿、片头重试和 dispatch。避开整点——
    # GitHub 在整点半点最容易延迟或丢弃（daily 当年留下的经验，knowledge-adhoc
    # 的 08:37 也是这么定的）。
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: interview-auto-render
  cancel-in-progress: false

jobs:
  auto:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data
            docs
            specs
            src
            tests
            tools

      # **没活就早退，别装依赖。** 这条每 10 分钟跑一趟，而大多数趟什么都
      # 没有——`pick_interview_renders` 和它 import 的 `build_interview_clip`
      # 顶层只有标准库，系统 python3 就跑得动（git ls-files 读 index，也不用
      # 检出 output/）。stale 告警也在这儿出：**「投了」只是信号，render.json
      # 才是产物**——投出去 3 小时还没产物的要喊出来，不能安静地躺在状态文件里。
      - name: 没活就早退
        id: gate
        run: |
          set -o pipefail
          # 用 find 不用 `ls *.glob`：没有草稿时 ls 退出码 2，在
          # `set -e -o pipefail` 下会把整步打红——而「没有草稿」是常态。
          DRAFTS=$(find specs/interviews -maxdepth 1 -name '*.draft.json' | wc -l)
          NEEDS_LEAD=$(python3 - <<'PY'
          import json
          from pathlib import Path
          n = 0
          for p in Path('specs/interviews').glob('*.json'):
              if p.name.endswith('.draft.json'):
                  continue
              try: d = json.loads(p.read_text(encoding='utf-8'))
              except Exception: continue
              op = d.get('opening') or {}
              n += bool(d.get('requested_content_type') == 'on_court'
                        and op.get('kind') == 'none' and not d.get('lead_in'))
          print(n)
          PY
          )
          python3 tools/pick_interview_renders.py > /tmp/todo.txt 2> /tmp/waiting.txt
          cat /tmp/todo.txt
          cat /tmp/waiting.txt >&2
          READY=$(tail -n +2 /tmp/todo.txt | grep -c . || true)
          python3 tools/pick_interview_renders.py --stale | tee /tmp/stale.txt
          if grep -q "（投于" /tmp/stale.txt; then
            {
              echo "## ⚠️ 有采访投出去超过 3 小时还没有 render.json（本轮自动重投）"
              echo ""
              tail -n +2 /tmp/stale.txt | sed 's/^  /- /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s /tmp/waiting.txt ]; then
            {
              echo "## ⏳ 等自动补齐 / 例外复核（不 dispatch）"
              echo ""
              tail -n +2 /tmp/waiting.txt | sed 's/^  /- /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$DRAFTS" -eq 0 ] && [ "$READY" -eq 0 ] && [ "$NEEDS_LEAD" -eq 0 ]; then
            echo "[早退] 没有草稿要提升、没有 spec 要 dispatch——不装依赖了。"
            echo "work=false" >> "$GITHUB_OUTPUT"
          else
            echo "草稿=$DRAFTS，待 dispatch=$READY，待同场冷开场=$NEEDS_LEAD"
            echo "work=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.work == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: 装依赖
        if: steps.gate.outputs.work == 'true'
        run: pip install -q -e . "yt-dlp[default]>=2026.7.4"

      - name: 启动 YouTube PO token provider
        if: steps.gate.outputs.work == 'true'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          pip install -q bgutil-ytdlp-pot-provider
          docker run --name bgutil-pot -d -p 4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider
          for i in $(seq 1 25); do
            curl -fsS http://127.0.0.1:4416/ping >/dev/null && exit 0
            sleep 2
          done
          docker logs bgutil-pot 2>&1 | tail -20 || true
          echo "::warning::PO token provider 未就绪；继续用 cookies/client 梯子尝试"
          exit 1

      - name: 提升草稿为正式 spec（查赛果补 winner/matchup）
        if: steps.gate.outputs.work == 'true'
        run: |
          set -o pipefail
          # 只提升「赛果里查得到唯一同场对手」的草稿；查不到的留在草稿重试/复核
          # （宁可漏推不误推——顶栏对阵印错比晚一点糟）。
          python tools/promote_interview_draft.py --write \
            | tee /tmp/promote.log

      - name: 落 cookies（同场官方集锦字幕）
        if: steps.gate.outputs.work == 'true'
        id: lead_cookies
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "path=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_OUTPUT"
          fi

      - name: 自动配同场获胜画面与解说双语字幕
        if: steps.gate.outputs.work == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          YT_COOKIES: ${{ steps.lead_cookies.outputs.path }}
        run: |
          set -o pipefail
          python tools/attach_interview_lead_in.py --write | tee /tmp/lead-in.log

      - name: 提交提升结果
        if: steps.gate.outputs.work == 'true'
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          # 先 add 再判：提升会**新建**正式 spec（未跟踪文件），裸的
          # `git diff --quiet` 看不见它们——只在删草稿那半边出声，而
          # 「删了草稿、新 spec 没提交」正是最坏的中间态。
          git add specs/interviews
          if git diff --cached --quiet; then
            echo "没有草稿被提升。"
            exit 0
          fi
          python tools/check_staged_file_sizes.py
          git commit -m "interview: 自动提升赛后开麦 spec 草稿"
          # 重试收在共享脚本里：原来这儿的 `git pull --rebase` 没带
          # `|| abort`，`bash -e` 下 rebase 一失败整步立刻死，循环一次
          # 都轮不到（tools/git_push_retry.sh 顶部注释记着这一族）。
          source tools/git_push_retry.sh
          if ! push_with_rebase_retry "${GITHUB_REF_NAME}" 5; then
            echo "::error::提升结果推不上去——草稿还在，下一趟会重来"
            exit 1
          fi

      - name: dispatch 未 render 的正式 spec（每 slug 一个 run，并行）
        if: steps.gate.outputs.work == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          # 重新扫一遍（上一步可能刚提升出新 spec）；stdout 第二行起是名单。
          # ⚠️ 不能用 `… | while read`——管道里的 while 在子 shell 里跑，
          # 循环里记下的任何状态都传不出来。用 mapfile。
          python tools/pick_interview_renders.py | tee /tmp/todo.txt
          mapfile -t SLUGS < <(tail -n +2 /tmp/todo.txt | grep -v '^$' || true)
          FAILED=()
          for slug in "${SLUGS[@]}"; do
            # 正式 spec、同场片头和来源核验都齐了，到这里才是“生产链接已接收”。
            # 这个时刻一路传给成片，不允许 render job 装完依赖后重新起表。
            RECEIVED_AT=$(date -u +%FT%TZ)
            echo "[dispatch] interview-clip render $slug"
            if gh workflow run interview-clip.yml --ref main \
              -f "slug=$slug" -f mode=render -f "received_at=$RECEIVED_AT"; then
              # **投一条记一条，先投后记。** 反过来（先把整批记进状态再逐条
              # dispatch）的下场踩过：dispatch 失败的那条挂着「已投」的标记，
              # 从此再也不会被投，而且不吭声。
              python tools/pick_interview_renders.py --mark-one "$slug" --at "$RECEIVED_AT"
            else
              FAILED+=("$slug")
            fi
          done
          if [ "${#FAILED[@]}" -gt 0 ]; then
            {
              echo "## ⚠️ 有采访 dispatch 失败（没记状态，下一趟会重投）"
              echo ""
              for s in "${FAILED[@]}"; do echo "- $s"; done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::${#FAILED[@]} 条 dispatch 失败：${FAILED[*]}"
          fi
          git add data/interview_render_dispatched.json
          if git diff --cached --quiet; then
            echo "状态没有变化。"
            exit 0
          fi
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          python tools/check_staged_file_sizes.py
          git commit -m "data: interview render dispatch 记录"
          source tools/git_push_retry.sh
          if ! push_with_rebase_retry "${GITHUB_REF_NAME}" 5; then
            echo "::error::dispatch 状态推不上去——这批 slug 下一趟会被重投"
            echo "::error::（interview-clip 的 concurrency 按 slug 去重，代价是把正在跑的那趟掐了重跑）"
            exit 1
          fi
