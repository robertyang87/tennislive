name: tmp-wawr-photos
# 一次性（第三趟：git add --sparse）：沙箱连不到 ATP Media 图床、也下不了 artifact。把 2026 巴塞尔瓦林卡的官方实拍
# 缩成预览（长边 1600）连同原图说明一起写回本分支，挑封面用。挑完即删本文件。
on:
  push:
    branches: [claude/wawrinka-career-story]
    paths: [.github/workflows/tmp-wawr-photos.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/official_photo_apis.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pillow requests
      - name: 拉预览
        run: |
          python - <<'PY'
          import io, json, sys, urllib.request
          from pathlib import Path
          from PIL import Image
          sys.path.insert(0, "tools")
          import official_photo_apis as api
          out = Path("assets/reel/wawrinka-career-story-2026/candidates"); out.mkdir(parents=True, exist_ok=True)
          rows = []
          for page in range(4):
              d = api.get_json(api.page_url(api.ATP_MEDIA_API, page))
              for c in d.get("content", []):
                  t = c.get("title") or ""
                  if "Wawrinka" not in t or "2026" not in t:
                      continue
                  pub = c.get("publishFrom") or 0
                  if pub < 1793120400000:   # 2026-10-27 17:00Z 之前的不要
                      continue
                  url = c.get("imageUrl") or ""
                  if not url.lower().endswith((".jpg", ".jpeg")):
                      continue
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  blob = urllib.request.urlopen(req, timeout=60).read()
                  meta = api.parse_head(blob[:api.HEAD_BYTES])
                  im = Image.open(io.BytesIO(blob)); w, h = im.size
                  im.thumbnail((1600, 1600)); name = f"{c['id']}.jpg"
                  im.convert("RGB").save(out / name, quality=88)
                  rows.append({"id": c["id"], "title": t, "publishFrom": pub, "date": c.get("date"),
                               "url": url, "w": w, "h": h, "preview": name,
                               "taken": meta.get("taken"), "caption": meta.get("caption"),
                               "credit": meta.get("credit"), "instructions": meta.get("instructions"),
                               "restriction": api.restriction(*(meta.get("texts") or []))})
                  print(rows[-1])
          (out / "meta.json").write_text(json.dumps(rows, ensure_ascii=False, indent=1))
          print(len(rows), "张")
          PY
      - name: 写回分支
        run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add --sparse -f assets/reel/wawrinka-career-story-2026/candidates
          git commit -m "assets: 巴塞尔 2026 瓦林卡官方实拍预览（挑封面用）" || exit 0
          for i in 1 2 3; do git pull --rebase origin claude/wawrinka-career-story && git push origin HEAD:claude/wawrinka-career-story && exit 0; sleep 3; done
          exit 1
