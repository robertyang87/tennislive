name: tmp-wawr-photos
# 一次性（第五趟：瑞士媒体里嵌的告别视频＋离场照原图）：沙箱连不到这些站，下不了 artifact。
# 结果写成文本、照片写进 assets，推回本分支。片子做完即删本文件。
on:
  push:
    branches: [claude/wawrinka-career-story]
    paths: [.github/workflows/tmp-wawr-photos.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/official_photo_apis.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pillow requests "yt-dlp[default]"
      - name: 查嵌入视频
        run: |
          mkdir -p assets/reel/wawrinka-career-story-2026
          R=assets/reel/wawrinka-career-story-2026/research2.txt
          : > "$R"
          for u in \
            "https://www.srf.ch/sport/tennis/atp-tour/swiss-indoors-in-basel-ende-einer-eindruecklichen-karriere-wawrinka-unterliegt-lehecka" \
            "https://www.20min.ch/story/swiss-indoors-wawrinkas-karriere-endet-trotz-kampf-mit-einer-fruehen-niederlage-103657456" \
            "https://www.watson.ch/sport/tennis/771749820-stan-wawrinka-beendet-karriere-mit-niederlage-in-basel" \
            "https://www.blick.ch/sport/tennis/stan-wawrinka-laesst-sich-in-basel-feiern/nngc9hg" \
            "https://www.bluewin.ch/en/sport/wawrinka-s-career-ends-with-a-loss-in-basel-li.3651310" \
            "https://www.nau.ch/sport/tennis" ; do
            echo "== $u" >> "$R"
            curl -sSL -A "Mozilla/5.0" -m 30 "$u" -o page.html || { echo "curl 失败" >> "$R"; continue; }
            grep -oE 'urn:srf:video:[0-9a-f-]{36}|cdn\.jwplayer\.com/[A-Za-z0-9/_.-]+|https://[^"'"'"' ]+\.(mp4|m3u8)|c\.nau\.ch/videos/[A-Za-z0-9/_.-]+|(x|twitter)\.com/[A-Za-z0-9_]+/status/[0-9]+|instagram\.com/(p|reel)/[A-Za-z0-9_-]+|"title":"[^"]{10,160}"|"duration":[0-9.]+' page.html | sort -u | head -60 >> "$R"
          done
          for urn in $(grep -oE 'urn:srf:video:[0-9a-f-]{36}' "$R" | sort -u); do
            echo "== yt-dlp $urn" >> "$R"
            yt-dlp --print "%(id)s|%(duration)s|%(width)sx%(height)s|%(title)s" "https://www.srf.ch/play/tv/redirect/detail/${urn##*:}" >> "$R" 2>&1 || true
          done
          cat "$R"
      - name: 离场照原图
        run: |
          python - <<'PY'
          import io, sys, urllib.request
          from PIL import Image
          sys.path.insert(0, "tools")
          import official_photo_apis as api
          want = {4599890: "exit", 4599856: "wave"}
          got = set()
          for page in range(3):
              for c in api.get_json(api.page_url(api.ATP_MEDIA_API, page)).get("content", []):
                  if c.get("id") in want and c["id"] not in got:
                      blob = urllib.request.urlopen(urllib.request.Request(c["imageUrl"], headers={"User-Agent": "Mozilla/5.0"}), timeout=60).read()
                      im = Image.open(io.BytesIO(blob)).convert("RGB")
                      im.thumbnail((2400, 2400))
                      im.save(f"assets/reel/wawrinka-career-story-2026/photo-{want[c['id']]}.jpg", quality=90)
                      print(c["id"], c["imageUrl"], im.size)
                      got.add(c["id"])
          PY
      - name: 写回分支
        run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add --sparse -f assets/reel/wawrinka-career-story-2026
          git commit -m "assets: 瑞士媒体嵌入视频检索＋巴塞尔离场照" || exit 0
          for i in 1 2 3; do git pull --rebase origin claude/wawrinka-career-story && git push origin HEAD:claude/wawrinka-career-story && exit 0; sleep 3; done
          exit 1
