name: tmp-fault-cover
# 临时：fault-not-out-2026 封面候选检索（Commons/Openverse），合并前删除。
on:
  push:
    branches: [claude/fault-not-out-2026]
    paths: [research/fault-not-out-2026/cover_search.py, research/fault-not-out-2026/cover_fetch.txt, .github/workflows/tmp-fault-cover.yml]
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/fault-not-out-2026
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: search
        run: python3 research/fault-not-out-2026/cover_search.py
      - name: fetch chosen originals
        run: |
          if [ -f research/fault-not-out-2026/cover_fetch.txt ]; then
            while read -r url out; do [ -n "$url" ] && curl -sSLf -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" -o "$out" "$url" && ls -la "$out"; done < research/fault-not-out-2026/cover_fetch.txt
          fi
      - name: commit
        run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add -A research/fault-not-out-2026 assets/reel || true
          git diff --cached --quiet || { git commit -qm "tmp: fault 封面候选"; for i in 1 2 3 4; do git pull -q --rebase origin claude/fault-not-out-2026 && git push origin HEAD:claude/fault-not-out-2026 && break; sleep 5; done; }
