name: Wang Vekic bounded editorial repair
on:
  push:
    branches: [codex/wang-vekic-singapore-reel]
    paths: [.github/workflows/wang-vekic-editorial-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/wang-vekic-singapore-reel
          filter: blob:none
          sparse-checkout: |
            tools
            src
            skills
            docs/production
            specs/reels/pending
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -e .
      - name: One correction from verified facts, save candidate only
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PY'
          import sys,json
          from pathlib import Path
          sys.path.insert(0,"tools")
          from draft_spec import draft_editorial, draft_push, Chat
          output=Path("docs/production/wang-vekic-editorial-candidate.json")
          if output.exists():
              raise SystemExit("Bounded correction already attempted")
          rejected=json.loads(Path("docs/production/wang-vekic-rejected-editorial.json").read_text())
          facts="""
          王欣瑜在2026年9月22日WTA500新加坡站首轮，以六比一、六比二击败八号种子维基奇。
          首盘双方先保发到一比一。第三局王欣瑜自己的发球局曾零比三十落后，随后保发到二比一。
          注意零比三十不等于破发点，不能说已到破发点。
          王欣瑜在首盘一比一后连赢五局，以六比一拿下首盘；当盘两次破发。
          原片119.44至137.60秒为二比一时维基奇发球，王欣瑜由十五比三十打到十五比四十，制造破发点，尚未兑现。
          原声132.24至136.48秒明确说王欣瑜善于进攻对手二发；允许讲接二发抢攻争取主动。
          具体正反手和落点线路未经完整视频审核，不可编造；不要把击球后的镜头当作完整回合。
          次盘双方各保发两局到二比二，此后王欣瑜连赢四局，以六比二收尾。
          四比二时维基奇发球局曾化解破发点，原片197.08至251.48秒显示抵抗和网前变化，但最终破发的一分未展示。
          原片251.48至282.88秒含王欣瑜五比二发球时赛点、比赛结束、握手和庆祝。
          全场王欣瑜八个发球局全部保发，七个破发点兑现四个；维基奇一个破发点未兑现。
          WTA官方总用时一小时六分十八秒，原声说一小时六分。
          不写总得分、赢球局差、最近战绩和交手次数；原逐分与统计有冲突，避免以之构建噱头。
          用户要求比赛内容线完整、关键点讲清楚，同时给画面能支持的技战术解释。
          三个beats依次：一比一时守住发球局；首盘接二发抢攻并拉开比分；次盘二比二后拉开、四比二时对手抵抗、赛点结束。
          """
          fixture="新加坡首轮。对上一稿只进行这一次纠错；不得重复首稿错误。错误列表："+json.dumps(rejected["errors"],ensure_ascii=False)
          chat=Chat(provider="deepseek")
          assert chat.ready
          editorial=draft_editorial(chat,home="Donna Vekic",away="Xinyu Wang",event="Singapore",year=2026,fixture=fixture,facts=facts,background="维基奇为本届八号种子。中国球员王欣瑜获胜。")
          push=draft_push(chat,editorial=editorial,facts=facts) if editorial else None
          output.write_text(json.dumps({"status":"candidate_requires_review","attempt":1,"channel":chat.channel,"facts":facts,"editorial":editorial,"push":push},ensure_ascii=False,indent=2)+"\n")
          print("Saved correction candidate; no render, promotion or publication")
          PY
      - name: Preserve candidate
        run: |
          git config user.name "Codex"
          git config user.email "noreply@openai.com"
          git add docs/production/wang-vekic-editorial-candidate.json
          git commit -m "reel: bounded Wang Vekic editorial correction candidate"
          git push origin HEAD:codex/wang-vekic-singapore-reel
