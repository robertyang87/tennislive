name: knowledge-adhoc

# 手动触发：按指定 slug 单独生成一篇知识帖，不占用当天常规知识帖
# （daily.yml 里 output/<date>/knowledge/）的位置，写到独立目录
# output/<date>/knowledge_adhoc/。只能从预先写好、事实核验过的选题池
# 里选 slug（见 src/tennislive/render/tournament_story.py 的 STORIES）——
# 知识帖要求可核实的事实与已授权配图，不支持凭空生成全新话题；全新
# 话题需要先补充一条新的 TournamentStory 条目（含真实来源与配图）。
#
# slug 留空 = 自动选题：复用常规每日流程同一套排序逻辑
# （tournament_story_candidates），按当日真实赛事/球员热度与时效性排序
# 候选，逐个尝试配图，配图不达标就自动换下一个候选，直到成功或候选
# 耗尽——不需要人工挑一个 slug 再试错。
#
# ## 2026-07-31：每日网球知识从 daily 里分出来，落在这条线上
#
# 账号所有者：「**所以要分开啊**。昨日赛果和今日赛程都要拿掉了，**其他的
# 可以保留**」。日报（`daily.yml`）连同昨日赛果、今日赛程一起删了，而知识帖
# 一直是搭它顺风车出的（同一趟 `tennislive digest`，分两条 PushPlus 推）。
#
# 分出来几乎不用改代码：这条工作流跑的 `cmd_knowledge_adhoc` 用的就是同一个
# `generate_knowledge_package`，而且**本来就支持 slug 留空自动选题**（按当日
# 赛事/球员热度排序、配图不达标自动换候选）。定时触发时
# `github.event.inputs.slug` 是空的，正好走自动选题那条路。
#
# 时刻 00:37 UTC = 08:37 北京时间。**避开 :00/:30**——GitHub 定时任务在整点
# 半点最容易被延迟或丢弃，这是 daily 当年留下的经验。
#
# ## 2026-08-11：定时停了——这条线渲的是「网球有故事」栏目昨天已经决定
# 淘汰的那种老模板
#
# `docs/story-asset-topics.md`（2026-08-10 账号所有者拍板）：「网球有故事」
# **形态按全栏目口径：视频优先**（真实画面当底+字卡+旁白，休伊特那条是
# 先例），**静卡只留天然图表题材**。而 `knowledge_column()` 把这条线（`slug`
# 不以 `otd-` 开头的全部）一律印成「网球有故事」——这条定时任务天天从近 60
# 个选题里自动挑一个渲成静态四宫格卡片推送，和昨天定下的形态直接矛盾。
#
# 撞上的实例：2026-08-11 08:37 那趟（run 31452944689，`event=schedule`）
# 自动选中 `cincinnati`（辛辛那提公开赛历史：建赛年份、德约科维奇2023年
# 逆转、高芙同日夺冠）——纯叙事内容，不是天然图表题材，正是要淘汰的那种。
# 账号所有者当场反馈「还是用的老模板啊」。⚠️ 之前 4 天（8/7~8/10）这条
# cron **一直在失败**（见 run 31144783364 起连续 failure），8/11 刚跑成功
# 就撞上了这个——不是失败率问题，是选题池和形态本身已经过期。
#
# **停的是定时，不是这条线的代码**——`workflow_dispatch` 留着：真遇到
# 天然图表题材（比如 `scoring-history` 这类），仍能手动指定 slug 单独渲一条
# 静态卡片。要恢复定时，得先给 STORIES 选题池按「天然图表 / 叙事」分类
# （或者把这条线接上视频优先的资产线管线），不能照抄这行 cron 直接开回去。
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "选题 slug（如 hawkeye / big-three / umag）；留空=自动按热度/时效选题并自动跳过配图不达标的候选"
        required: false
        default: ""
      date:
        description: "基准日期（YYYY-MM-DD，北京时间；留空=今天）"
        required: false
        default: ""
      push:
        description: "是否通过 PushPlus 推送到微信"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  # 触发 `pages.yml` 重新发布复制页——工作流自己提交的 push
  # **不会**创建 workflow run，见 `trigger_pages_build`。
  actions: write

jobs:
  knowledge-adhoc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      TENNISLIVE_THEME: ${{ vars.TENNISLIVE_THEME || 'dark' }}
      TENNISLIVE_VISUAL_FETCH: ${{ vars.TENNISLIVE_VISUAL_FETCH || 'on' }}
      TENNISLIVE_VISUAL_STRICT: ${{ vars.TENNISLIVE_VISUAL_STRICT || 'on' }}
      TENNISLIVE_VISUAL_CANDIDATES: ${{ vars.TENNISLIVE_VISUAL_CANDIDATES || '8' }}
      TENNISLIVE_VISUAL_RETRIES_PER_TOPIC: ${{ vars.TENNISLIVE_VISUAL_RETRIES_PER_TOPIC || '4' }}
      TENNISLIVE_VISUAL_EXPANDED_SOURCES: ${{ vars.TENNISLIVE_VISUAL_EXPANDED_SOURCES || 'on' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # **别把 output/ 拉下来。** HEAD 上它就有 1.36 GB（.git 1.77 GiB），
          # checkout 因此每次要一分半到三分钟。
          # 本次要写的那一格在算出目录之后 `git sparse-checkout add` 回来——
          # **两半都要有**：只写这一半，`git add "$OUTDIR"` 会说路径在稀疏
          # 范围之外，只警告、退出码 0，产物静默丢掉。
          sparse-checkout: |
            assets
            data
            docs
            specs
            src
            tests
            tools

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装中文字体（卡片图需要）
        timeout-minutes: 6
        run: |
          # ⚠️ apt 镜像会抽风，而且不是偶发：2026-08-04 两小时内两次——一次静静烧了
          # **13 分 42 秒**（那时没有闸），一次被 `timeout-minutes: 6` 掐掉
          # （run 30878555571），而正常只要 **18~53 秒**，重跑那趟 34 秒就过了。
          # 硬超时只把「静静烧半小时」换成「6 分钟红掉、要人重跑」——**方向对了但停在
          # 一半**：卡住的正确处置是换一次重试，不是整趟失败。
          # ⚠️ **第一版写的是 3 × 100 秒，当场把 CI 弄红了**（run 30880649692）：
          # 三次全跑满 100 秒被杀，也就是 apt **一直在推进、只是慢**，不是挂死。
          # 那个 100 秒是按「正常 18~53 秒」拍的，而那是**另一条工作流**的数——
          # ci.yml 这一步正常 25~34 秒，镜像变慢时能到 100 秒以上仍在干活。
          # **把「慢」误判成「挂死」，重试就从救场变成了三倍的浪费。**
          # 现在 2 × (150s + 10s) = 5.3 分，仍在步骤的 6 分钟超时以内。
          # 每次都留 150 秒（正常值的 4~6 倍），只有真挂死才会两次都吃满。
          apt_retry() {
            for i in 1 2; do
              sudo timeout 150 "$@" && return 0
              echo "::warning::apt 第 $i 次没跑完（卡住或超时）：$*"
              sudo dpkg --configure -a || true   # 上一次被 SIGTERM 打断可能留下半装状态
              sleep 10
            done
            echo "::error::apt 两次都没成功：$*"
            return 1
          }
          apt_retry apt-get update -qq
          apt_retry apt-get install -y -qq fonts-noto-cjk

      - name: 安装 tennislive
        run: pip install -q -e ".[webrender,visualqa]"

      - name: 缓存 Chromium（HTML 卡片渲染）
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          # ⚠️ **键钉在整份 `pyproject.toml` 上太宽。** 决定装哪个 Chromium 的
          # 只有 playwright 的版本，可这个键是**整份文件的哈希**——加一个依赖、
          # 改一行注释，六条工作流的 150 MB Chromium 缓存**同时失效**，
          # 下一趟每条都要重下一遍。2026-08-05 往 pyproject 里加 certifi 和
          # pytest-xdist 时当场撞上（run 30973785219 卡在「安装 Chromium」）。
          #
          # `restore-keys` 就够：主键没中就退到上一份，Chromium 已经在盘上，
          # `playwright install` 是个空操作；真换了 playwright 版本它会自己去下
          # 对的那一版，所以退旧缓存也不会拿错。这比另起一步去算版本号便宜，
          # 而且不用动步骤顺序。判据在 `test_Chromium缓存都要有restore_keys`。
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: 安装 Chromium
        # 10 而不是 9：等 dpkg 锁最多再花 60 秒（见下面 pw_wait_apt），
        # 而 2×240 秒本来就贴着 9 分钟。第 2 次眼看要成却被步骤预算
        # 掐掉，和「装不上」长得一模一样。
        timeout-minutes: 10
        run: |
          # ⚠️ **`--with-deps` 会跑 apt，而这个仓库的 apt 会抽风。** CLAUDE.md 里那条
          # 「一次静静烧了 13 分 42 秒」的教训当时只套在显式的 `apt-get` 步骤上，
          # **漏了这一处**——而它既没超时也没重试，能一路烧到 job 的 15 分钟预算
          # 用完（run 30973785219：卡在这一步 13 分钟，其余步骤全在 1 分钟内跑完）。
          #
          # 正常 5~60 秒（命中缓存时是空操作）。240 秒是 4~48 倍的余量，
          # 只有真挂死才会两次都吃满。⚠️ **别把这个数调小**：第一版 apt 重试
          # 写 3×100 秒当场把 CI 弄红了，因为 apt 一直在推进、只是慢——
          # **把「慢」误判成「挂死」，重试就从救场变成三倍的浪费**。
          # ⚠️ **第一次超时会毒死第二次，所以重试之前必须等 dpkg 锁松开。**
          # `timeout` 杀掉的是 `playwright install` 那层壳，**它派生的 apt-get
          # 活了下来并攥着 `/var/lib/dpkg/lock-frontend`**。run 31003290962 的
          # 日志一清二楚：第 1 次 240 秒被杀，15 秒后第 2 次**两秒**就死在
          # `held by process 4285 (apt-get)`——也就是说「重试」根本没重试成，
          # 它只是第一次超时的一个必然后果。
          #
          # ⚠️ 用 `pgrep -x`（**按可执行名精确匹配**），不是 `pgrep -f`。
          # CLAUDE.md 里那条「`until ! pgrep -f 'X'` 会匹配到它自己」说的就是
          # `-f` 扫整条命令行；这个循环跑在 bash 里，名字对不上 apt-get/dpkg，
          # 不会把自己数进去。也不用 fuser/lsof——runner 上不保证装着。
          pw_wait_apt() {
            for _ in $(seq 1 22); do
              if ! pgrep -x apt-get >/dev/null && ! pgrep -x dpkg >/dev/null; then
                return 0
              fi
              sleep 5
            done
            echo "::warning::等了 110 秒 dpkg 锁还没松开——下一次尝试八成会在两秒内死在 Could not get lock，不是 apt 装不上"
          }
          pw_retry() {
            for i in 1 2; do
              timeout 240 python -m playwright install --with-deps chromium && return 0
              echo "::warning::装 Chromium 第 $i 次没跑完（多半卡在 --with-deps 的 apt）"
              # 等锁，别拿 sleep 猜。顺带：被杀掉那次已经把一部分包下进了
              # /var/cache/apt/archives，所以第 2 次是接着下，不是从头来。
              pw_wait_apt
            done
            echo "::error::装 Chromium 两次都没成功"
            return 1
          }
          pw_retry

      - name: 生成知识帖
        id: gen
        run: |
          DATE_ARG="${{ github.event.inputs.date }}"
          if [ -z "$DATE_ARG" ]; then DATE_ARG="today"; fi
          OUT_DATE=$(python -c "from tennislive.timeutil import parse_date_arg; print(parse_date_arg('$DATE_ARG').isoformat())")
          OUT_DIR="output/$OUT_DATE/knowledge_adhoc"
          echo "outdir=$OUT_DIR" >> "$GITHUB_OUTPUT"
          # 进 cone 排在生成之前：`sparse-checkout add` 会把 HEAD 上那一版
          # 先铺回工作区，铺完再生成才是对的顺序（反过来会拿旧内容盖掉新的）。
          # 重放循环里的 `git checkout rendered -- "$OUTDIR"` 也要它在 cone 里。
          git sparse-checkout add "$OUT_DIR"
          rm -rf "$OUT_DIR"
          tennislive knowledge-adhoc \
            --slug "${{ github.event.inputs.slug }}" \
            --date "$DATE_ARG" \
            --outdir "$OUT_DIR"

      - name: 校验知识帖完整性
        run: |
          OUT_DIR="${{ steps.gen.outputs.outdir }}"
          for name in story evidence visual_sources visual_qa; do
            FILE="$OUT_DIR/$name.json"
            test -s "$FILE" || {
              echo "::error file=$FILE::知识帖缺少 $name.json"
              exit 1
            }
          done
          jq -e '.status == "pass" and (.errors | length == 0)' \
            "$OUT_DIR/visual_qa.json" >/dev/null || {
            echo "::error file=$OUT_DIR/visual_qa.json::知识帖视觉质检未通过"
            cat "$OUT_DIR/visual_qa.json"
            exit 1
          }
          jq -e '((.sources // []) | unique | length >= 2)' \
            "$OUT_DIR/evidence.json" >/dev/null || {
            echo "::error file=$OUT_DIR/evidence.json::知识帖交叉核验来源少于 2 个"
            exit 1
          }
          CARD_COUNT="$(find "$OUT_DIR/cards" -maxdepth 1 -type f -name 'card_*.jpg' 2>/dev/null | wc -l)"
          test "$CARD_COUNT" -ge 3 || {
            echo "::error::知识帖卡片过少（实际 $CARD_COUNT，至少 3 张）"
            exit 1
          }

      - name: 上传失败诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-adhoc-failure-${{ github.run_number }}
          path: ${{ steps.gen.outputs.outdir }}*

      - name: 提交内容到仓库
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          GENERATED_SLUG="$(jq -r '.slug' "${{ steps.gen.outputs.outdir }}/story.json")"
          git add "${{ steps.gen.outputs.outdir }}" data/story_state.json
          if git diff --cached --quiet; then
            echo "没有新内容，跳过提交"
          else
            python tools/check_staged_file_sizes.py
            git commit -m "content: 知识帖(ad-hoc) $GENERATED_SLUG"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "${{ github.ref_name }}"
          fi

      - name: 上传内容包 artifact
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-adhoc-${{ github.run_number }}
          path: ${{ steps.gen.outputs.outdir }}

      - name: PushPlus 推送到微信
        if: github.event.inputs.push != 'false' && env.PUSHPLUS_TOKEN != ''
        continue-on-error: true
        run: |
          export TENNISLIVE_ASSET_REV="$(git rev-parse HEAD)"
          tennislive publish pushplus --dir "${{ steps.gen.outputs.outdir }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
