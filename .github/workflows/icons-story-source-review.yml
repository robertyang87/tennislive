name: icons-story-source-review
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        source:
        - jordan
        - woods
        - swiatek
        - keys
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: |
          tools
          src
          assets
          requests/stories
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install existing source preparation dependencies
      run: |
        pip install -q -e . 'yt-dlp[default]' bgutil-ytdlp-pot-provider
    - name: 缓存 apt 包（ffmpeg + 字体，绕开镜像抽风）
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/apt-archives
          ~/.cache/apt-lists
        key: apt-pkgs-${{ runner.os }}-24.04-ffmpeg-fonts-v2-${{ github.run_id }}
        restore-keys: |
          apt-pkgs-${{ runner.os }}-24.04-ffmpeg-fonts-v2-
    - name: 装 ffmpeg
      timeout-minutes: 15
      run: |
        source tools/ci_apt_install.sh
        ensure_ffmpeg
    - name: Start existing PO token provider
      id: pot
      continue-on-error: true
      run: |
        docker run --name bgutil-pot -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
        for i in $(seq 1 25); do
          if curl -sf http://127.0.0.1:4416/ping >/dev/null; then
            echo 'up=1' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sleep 2
        done
        exit 1
    - name: Prepare source footage and contact sheet
      env:
        YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        YT_POT_PROVIDER: ${{ steps.pot.outputs.up }}
        SOURCE_KEY: ${{ matrix.source }}
        PYTHONPATH: src
      run: |
        if [ -n "$YT_COOKIES_TXT" ]; then
          umask 077
          printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/icons-yt-cookies.txt"
          export YT_COOKIES="$RUNNER_TEMP/icons-yt-cookies.txt"
        fi
        python tools/prepare_icons_story_source.py "$SOURCE_KEY"
    - name: Remove temporary cookie file
      if: always()
      run: rm -f "$RUNNER_TEMP/icons-yt-cookies.txt"
    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: icons-source-${{ matrix.source }}
        path: source-review/${{ matrix.source }}/
        retention-days: 3
        compression-level: 0
        if-no-files-found: error
'on':
  push:
    branches:
    - codex/zheng-usopen-icons-story
    paths:
    - requests/stories/zheng-usopen-icons.json
  workflow_dispatch: null
