on:
  push:
    branches: [claude/swiatek-chwalinska-story-2026]
    paths: [research/swiatek-chwalinska-story-2026/cover_search.py, .github/workflows/tmp-sc-cover.yml]
permissions:
  contents: read
jobs:
  cover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/swiatek-chwalinska-story-2026
