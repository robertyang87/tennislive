name: tmp-wawr-trophy
on:
  push:
    branches: [claude/wawrinka-career-story]
    paths: [.github/workflows/tmp-wawr-trophy.yml, tools/wawr_trophy_probe.py]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - run: pip install -q requests
      - run: python tools/wawr_trophy_probe.py out
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && zip -q ../cands.zip * && cd ..
          gh release create tmp-wawr-trophy --title tmp-wawr-trophy --notes tmp --prerelease -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release upload tmp-wawr-trophy cands.zip --clobber -R "$GITHUB_REPOSITORY"
