name: codex-grab-fils-tirante-cover

on:
  push:
    branches:
      - codex/fils-tirante-final-20260821
    paths:
      - .github/workflows/codex-grab-fils-tirante-cover.yml

permissions:
  contents: write

jobs:
  grab-cover:
    if: "${{ github.event.head_commit.message == 'ci: replace Fils cover with winning expression' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache and install ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/apt-archives
            ~/.cache/apt-lists
          key: apt-pkgs-${{ runner.os }}-24.04-frame-grab-v1
      - name: Install dependencies
        run: |
          source tools/ci_apt_install.sh
          ensure_ffmpeg
          pip install -q "yt-dlp[default]" pillow bgutil-ytdlp-pot-provider
      - name: Start PO token provider
        id: pot
        continue-on-error: true
        run: |
          docker run --name bgutil-pot -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
          for i in $(seq 1 25); do
            curl -sf http://127.0.0.1:4416/ping >/dev/null && { echo "up=1" >> "$GITHUB_OUTPUT"; exit 0; }
            sleep 2
          done
      - name: Materialize cookies
        id: cookies
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "path=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_OUTPUT"
          fi
      - name: Extract selected winning-expression frame
        env:
          YT_COOKIES: ${{ steps.cookies.outputs.path }}
          YT_POT_PROVIDER: ${{ steps.pot.outputs.up }}
        run: |
          OUT="$RUNNER_TEMP/fils-short"
          mkdir -p "$OUT"
          ARGS=(--js-runtimes node)
          [ -n "$YT_COOKIES" ] && ARGS+=(--cookies "$YT_COOKIES")
          yt-dlp "${ARGS[@]}" -f 137 -o "$OUT/source.mp4" \
            "https://youtube.com/shorts/iGBTbmQM2vk"
          ffmpeg -v error -ss 7.75 -i "$OUT/source.mp4" -frames:v 1 -q:v 2 -y \
            assets/reel/fils-tirante-cincinnati-2026-qf.jpg
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          path = Path("assets/reel/fils-tirante-cincinnati-2026-qf.jpg")
          with Image.open(path) as image:
              print(f"[封面原帧] {path} {image.width}x{image.height}")
              if image.size != (1080, 1920):
                  raise SystemExit(f"封面不是原生1080×1920：{image.size}")
          PY
      - name: Commit selected cover
        run: |
          git config user.name "Codex"
          git config user.email "noreply@openai.com"
          git add -- assets/reel/fils-tirante-cincinnati-2026-qf.jpg
          python tools/check_staged_file_sizes.py
          git diff --cached --quiet && { echo "封面没有变化"; exit 1; }
          git commit -m "assets: use winning-expression Fils cover"
          git push origin "HEAD:codex/fils-tirante-final-20260821"
