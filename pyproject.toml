[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennislive"
version = "0.1.0"
description = "WTA/ATP 巡回赛每日赛程赛果同步：CLI 查询 + 公众号/小红书内容自动生成"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "rich>=13.0",
    "Pillow>=10.0",
    "pypdf>=5.0",
    # `tennislive.localca` **直接** import 它（要合并根证书，好让本地也能合语音）。
    # 它一直靠 requests 传递地装进来——而传递依赖是别人的实现细节，
    # requests 哪天换掉它，我们这条路就静默炸在一句 ImportError 上。
    # 自己 import 的就自己声明，判据在 `test_测试里不许import没声明的包`。
    "certifi>=2024.2.2",
]

[project.optional-dependencies]
# ruff 是判据不是洁癖：`--select F821`（未定义的名字）。`build_versus_poster`
# 里 `_cut_person(source, …)` 的 source 从来就不存在，「首选本场抽帧」那条
# 路一次都没跑起来过；同一天我自己又漏了一个 `seconds`，在 runner 上白跑
# 五分钟才炸。这两个 py_compile 和 pytest 都看不见，ruff 一秒指出来。
# pyyaml 是给**读工作流 YAML 的测试**用的（`test_match_reel.py` 里那条
# 「渲染专用的依赖不许挂在 probe 路径上」）。它一度不在这儿，而沙箱里恰好
# 装着，于是本地全绿、CI 红——**本地装着不等于 CI 装着**，这条在竖版剪辑线上
# 已经栽过三次（playwright、Chromium、cv2），这次栽在测试依赖上。
# 判据落在 `test_测试用到的第三方包都在dev依赖里`。
# `pytest-xdist` 是 CI 那行 `-n auto` 要的。缺了它 pytest 报
# `unrecognized arguments: -n`——**红得很响，不会假绿**，所以这一条不用另设判据。
dev = ["pytest>=7.0", "pytest-xdist>=3.5", "ruff>=0.6", "pyyaml>=6.0"]
# HTML/Chromium 精细卡片渲染（缺失时自动回退 Pillow 版）
webrender = ["playwright>=1.40"]
visualqa = ["opencv-python-headless>=4.10,<5"]
# 热点简报的中译 + 要点提炼（`tennislive brief`）。
# ⚠️ 别退回 GitHub Models：那个端点 2026-08-05 实测返回 410
# `github_models_retirement_brownout`，正在退役。详见 research/brief.py 的注释。
brief = ["anthropic>=0.69"]
video = ["yt-dlp>=2026.7.4"]
# 封面人物「本场抽帧抠图」：从源片抓一帧、抠掉背景。装 extra 别装裸包名——
# opencv 那次就是随手 `pip install opencv-python-headless` 装到 5.x，
# `CascadeClassifier` 在 5 里没了，红得和「没装」一模一样。
cutout = ["rembg[cpu]>=2.0.60"]
# 竖屏科普样片渲染（Pillow 合成 + 便携版 ffmpeg + 中文配音）
shortvideo = ["Pillow>=10.0", "imageio-ffmpeg>=0.5", "gTTS>=2.5", "edge-tts>=7.0"]

[project.scripts]
tennislive = "tennislive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tennislive.zh" = ["player_names_top500.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
# cards.py 的主题色是 `globals().update(_THEMES[...])` 灌进来的——静态看不见，
# 72 条全是假阳性。**排除写在这儿而不是藏在测试里**，让它是一个看得见的决定。
"src/tennislive/render/cards.py" = ["F821"]
