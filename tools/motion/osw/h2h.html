<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:NS;src:url(file:///workspace/tennislive/assets/fonts/NotoSansSC-Bold-sub.ttf);font-weight:700}
@font-face{font-family:NSR;src:url(file:///workspace/tennislive/assets/fonts/NotoSansSC-Regular-sub.ttf);font-weight:400}
@font-face{font-family:BC;src:url(file:///workspace/tennislive/assets/fonts/BarlowCondensed-Bold.ttf);font-weight:700}
@font-face{font-family:BCM;src:url(file:///workspace/tennislive/assets/fonts/BarlowCondensed-Medium.ttf)}
html,body{margin:0;width:1080px;height:1440px;overflow:hidden;background:#05080f;color:#f4fbf7;font-family:NS,sans-serif}
.abs{position:absolute}
#bg{inset:0;background:linear-gradient(180deg,#0a1222 0%,#060a14 55%,#04060c 100%)}
#bloom1{width:1400px;height:1100px;left:-160px;top:-520px;border-radius:50%;background:radial-gradient(closest-side,#2c4a78aa,#1a2c4a44 55%,transparent);filter:blur(30px)}
#bloom2{width:1100px;height:900px;left:-260px;top:620px;border-radius:50%;background:radial-gradient(closest-side,#3a5f9a55,#c6f65a10 60%,transparent);filter:blur(40px)}
#vig{inset:0;background:radial-gradient(130% 95% at 50% 40%,transparent 55%,#000000b0 100%)}
#grain{inset:-64px;opacity:.06;mix-blend-mode:overlay}
#stage{inset:0;transform-origin:50% 38%}
#label{top:84px;right:84px;text-align:right;padding-right:28px}
#bar{right:0;top:0;width:6px;background:#c6f65a;border-radius:3px;box-shadow:0 0 18px #c6f65a66}
.l{white-space:nowrap}.l1{font-size:40px;letter-spacing:2px}.l2{font-family:NSR;font-size:24px;color:#a9bcb2;margin-top:10px;letter-spacing:1px}
.l3{font-family:BC;font-size:38px;margin-top:6px;letter-spacing:1px}.l4{font-family:NSR;font-size:26px;color:#cfe6d8;margin-top:6px}
#kick{left:0;right:0;top:205px;text-align:center;font-family:NSR;font-size:22px;letter-spacing:10px;color:#a9bcb2}
#head{left:0;right:0;top:255px;text-align:center;font-family:BC;font-size:230px;line-height:1;letter-spacing:-8px;transform-origin:center center;position:absolute}
#head .w{color:#c6f65a;text-shadow:0 0 60px #c6f65a40}
#head .k{display:inline-block;width:56px;height:12px;border-radius:6px;background:#f4fbf7;opacity:.55;margin:0 22px 0 16px;vertical-align:66px}
#sweep{left:340px;top:265px;width:400px;height:230px;overflow:hidden;mix-blend-mode:screen;-webkit-mask:linear-gradient(#000,#000)}
#sweep i{position:absolute;top:-40px;width:110px;height:420px;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,#ffffff55,transparent)}
#sub{left:0;right:0;top:505px;text-align:center;font-family:NSR;font-size:26px;color:#cfe6d8;letter-spacing:6px}
#sub b{font-family:NS;color:#f4fbf7}
.glass{background:linear-gradient(180deg,#ffffff12,#ffffff06);border:1px solid #ffffff1c;border-radius:28px;
 box-shadow:inset 0 1px 0 #ffffff26,0 2px 6px #0006,0 24px 60px #0008;backdrop-filter:blur(24px)}
#tab{left:72px;right:72px;top:640px;padding:8px 36px}
.r{display:flex;align-items:center;height:58px;border-bottom:1px solid #ffffff10}.r:last-child{border:0}
.y{font-family:BCM;font-size:30px;width:100px;color:#8d9e96;letter-spacing:1px}.e{font-family:NSR;font-size:28px;flex:1;color:#dde9e2}
.s{font-family:BC;font-size:40px;color:#8d9e96;font-variant-numeric:tabular-nums}.s b{color:#c6f65a}.s i{font-style:normal;font-family:BCM;font-size:26px;color:#6f7f78;vertical-align:8px}
.s .g{display:inline-block;margin-left:22px}
#cnt{left:72px;right:72px;top:1060px;display:flex;gap:28px}
.c{flex:1;padding:24px 34px 22px}
.ck{font-family:NSR;font-size:24px;letter-spacing:6px;color:#a9bcb2}
.cv{font-family:BC;font-size:118px;line-height:1;letter-spacing:-3px;font-variant-numeric:tabular-nums;transform-origin:left bottom;margin-top:6px}
.cv b{color:#c6f65a}.cv i{font-style:normal;color:#4d5c56;margin:0 8px}.cv span{color:#f4fbf7}
.ft{position:absolute;right:34px;bottom:26px;font-family:NSR;font-size:20px;color:#6f7f78}

#hero{left:0;right:0;top:190px;height:400px}
.pl{position:absolute;top:0;width:300px;text-align:center}
#pa{left:56px}#pb{right:56px}
.disc{position:relative;width:260px;height:260px;margin:0 auto;border-radius:50%;overflow:hidden;
 background:radial-gradient(circle at 50% 30%,#2a3f63,#121c30 70%);
 box-shadow:inset 0 2px 0 #ffffff30,inset 0 -30px 60px #00000080,0 0 0 1px #ffffff22,0 0 0 8px #ffffff08,0 30px 60px #000a}
.disc img{position:absolute;left:50%;top:6px;width:450px;transform:translateX(-50%)}
.rim{position:absolute;inset:0;border-radius:50%;box-shadow:inset 6px 0 18px -6px #cfe6ff66}
#pb .rim{box-shadow:inset -6px 0 18px -6px #cfe6ff66}
.nm{margin-top:22px;font-size:34px;letter-spacing:2px}.nm small{display:block;font-family:NSR;font-size:20px;letter-spacing:4px;color:#8d9e96;margin-top:6px}
</style></head><body>
<div id="bg" class="abs"></div><div id="bloom1" class="abs"></div><div id="bloom2" class="abs"></div>
<div id="stage" class="abs">
<div id="label" class="abs" style="display:none!important"><div id="bar" class="abs"></div><div class="l l1">克星关系</div><div class="l l2">2019—2025 · WTA 巡回赛</div><div class="l l3">6—0</div><div class="l l4">奥斯塔彭科 vs 斯瓦泰克</div></div>
<div id="hero" class="abs">
<div class="pl" id="pa"><div class="disc"><img src="img/ostapenko-319939.png"><div class="rim"></div></div><div class="nm">奥斯塔彭科<small>LATVIA</small></div></div>
<div class="pl" id="pb"><div class="disc"><img src="img/swiatek-326408.png"><div class="rim"></div></div><div class="nm">斯瓦泰克<small>POLAND</small></div></div>
</div><div id="kick" class="abs">HEAD TO HEAD</div>
<div id="head"><span class="w">6</span><span class="k"></span>0</div>
<div id="sweep" class="abs"><i></i></div>
<div id="sub" class="abs">六战全胜</div>
<div id="tab" class="abs glass"></div>
<div id="cnt" class="abs"><div class="c glass" id="c1"><div class="ck">盘数</div><div class="cv"><b id="a1">0</b><i>:</i><span id="b1">0</span></div><div class="ft" id="dec">决胜盘 3:0</div></div>
<div class="c glass" id="c2"><div class="ck">局数</div><div class="cv"><b id="a2">0</b><i>:</i><span id="b2">0</span></div></div></div>
</div>
<canvas id="grain" class="abs" width="296" height="384"></canvas>
<div id="vig" class="abs"></div>
<script>
const SHOW_DECIDER=new URLSearchParams(location.search).get('decider')!=='0';
const D=[["2019","伯明翰 首轮","6-0 6-2"],["2021","印第安维尔斯 16强","6-4 6-3"],["2022","迪拜","4-6 6-1 7-6(4)"],
["2023","美网 16强","3-6 6-3 6-1"],["2025","多哈 半决赛","6-3 6-1"],["2025","斯图加特 1/4决赛","6-3 3-6 6-2"]];
const fmt=s=>s.split(" ").map(x=>{const m=x.match(/(\d+)-(\d+)(\(\d+\))?/);const a=+m[1],b=+m[2],tb=m[3]?'<i>'+m[3]+'</i>':'';
 return '<span class="g">'+(a>b?'<b>'+a+'</b>-'+b:a+'-<b>'+b+'</b>')+tb+'</span>'}).join('');
const T=document.getElementById('tab');D.forEach(d=>{const e=document.createElement('div');e.className='r';
 e.innerHTML='<div class="y">'+d[0]+'</div><div class="e">'+d[1]+'</div><div class="s">'+fmt(d[2])+'</div>';T.appendChild(e)});
const g=i=>document.getElementById(i),cl=x=>Math.max(0,Math.min(1,x));
const expo=p=>p>=1?1:1-Math.pow(2,-10*p),q4=p=>1-Math.pow(1-p,4),io=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const spring=u=>u<=0?0:1-Math.exp(-8*u)*Math.cos(12*u);
const bounce=u=>u<=0?1:1+0.05*Math.exp(-6*u)*Math.cos(14*u);
function enter(el,t0,dur,dy,blur){const p=expo(cl((window._t-t0)/dur));el.style.opacity=p;
 el.style.transform='translateY('+(dy*(1-p))+'px)';el.style.filter=p>=.999?'none':'blur('+(blur*(1-p)).toFixed(2)+'px)';return p}
// deterministic grain
function rng(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const gc=g('grain').getContext('2d');function grain(f){const r=rng(9973*(f+1)),im=gc.createImageData(296,384);
 for(let i=0;i<im.data.length;i+=4){const v=r()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}gc.putImageData(im,0,0)}
g('grain').style.width='1208px';g('grain').style.height='1568px';
window.renderAt=function(t,fps){window._t=t;const f=Math.round(t*(fps||60));grain(f>>1);
 const dp=io(cl(t/6.0));g('stage').style.transform='scale('+(1+0.03*dp)+')';
 g('bloom1').style.transform='translate('+(60*Math.sin(t*0.5))+'px,'+(30*dp)+'px) scale('+(1+0.06*dp)+')';
 g('bloom2').style.transform='translate('+(80*dp)+'px,0)';g('bloom2').style.opacity=0.6+0.4*dp;
 const lp=expo(cl((t-0.1)/0.7));g('bar').style.height=(lp*100)+'%';
 [...g('label').querySelectorAll('.l')].forEach((e,i)=>enter(e,0.2+i*0.07,0.7,0,10)&&(e.style.transform='translateX('+(20*(1-expo(cl((t-0.2-i*0.07)/0.7))))+'px)'));
 const pa=enter(g('pa'),0.3,1.0,0,22),pb=enter(g('pb'),0.42,1.0,0,22);
 g('pa').style.transform='translateX('+(-120*(1-pa))+'px)';g('pb').style.transform='translateX('+(120*(1-pb))+'px)';
 enter(g('kick'),0.7,0.8,12,8);
 const hp=enter(g('head'),1.0,1.0,30,24);g('head').style.transform+=' scale('+(0.9+0.1*spring(t-1.0))+')';
 const sw=cl((t-1.8)/0.7);g('sweep').firstChild.style.left=(-160+620*io(sw))+'px';g('sweep').style.opacity=sw>0&&sw<1?1:0;
 enter(g('sub'),1.5,0.9,16,10);
 enter(T,1.7,0.9,40,16);
 [...T.children].forEach((e,i)=>enter(e,1.85+i*0.12,0.7,22,10));
 enter(g('c1'),2.65,0.9,40,16);enter(g('c2'),2.77,0.9,40,16);
 const p=q4(cl((t-2.9)/1.4));[[12,3],[83,47]].forEach((v,k)=>{g('a'+(k+1)).textContent=Math.round(v[0]*p);g('b'+(k+1)).textContent=Math.round(v[1]*p)});
 const bs=bounce(t-4.3);document.querySelectorAll('.cv').forEach(e=>e.style.transform='scale('+bs+')');
 g('grain').style.transform='translate('+(-(f*37)%64)+'px,'+(-(f*53)%64)+'px)';
};
if(!SHOW_DECIDER)g('dec').remove();
renderAt(0);
</script></body></html>
