<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07140f">
  <meta name="description" content="网球时差内容流水线状态看板">
  <title>网球时差 · 内容流水线</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">TENNIS TIMEZONE · OPS</p>
      <h1>内容流水线</h1>
    </div>
    <button id="refresh" class="refresh" type="button" aria-label="刷新数据">刷新</button>
  </header>

  <main>
    <section id="hero" class="hero skeleton" aria-live="polite"></section>
    <section id="metrics" class="metrics" aria-label="关键指标"></section>

    <section class="panel">
      <div class="section-head">
        <div><p class="eyebrow">LIVE PIPELINE</p><h2>流程状态</h2></div>
        <span id="freshness" class="freshness">读取中</span>
      </div>
      <div id="stages" class="stages"></div>
    </section>

    <section class="panel">
      <div class="section-head">
        <div><p class="eyebrow">CONTENT</p><h2>最近内容</h2></div>
        <div id="filters" class="filters" role="group" aria-label="内容筛选"></div>
      </div>
      <div id="content-list" class="content-list"></div>
    </section>

    <section class="panel">
      <div class="section-head">
        <div><p class="eyebrow">GITHUB ACTIONS</p><h2>自动任务</h2></div>
        <a class="link" href="https://github.com/robertyang87/tennislive/actions" target="_blank" rel="noreferrer">查看全部</a>
      </div>
      <div id="workflows" class="workflow-list"></div>
    </section>

    <section class="source-note">
      <strong>判据</strong>
      <span>状态来自仓库内 spec、render/QC 凭证、PushPlus 发布账本与 GitHub Actions；未知不按成功展示。</span>
    </section>
  </main>

  <template id="empty-template"><div class="empty">暂无可展示记录</div></template>
  <script src="./app.js" defer></script>
</body>
</html>
